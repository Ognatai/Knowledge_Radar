# Migration package "Data protection": input for `python -m app.agents.regulatory_notes <command> data-protection`.
# Frame sections (TL;DR, scope, timeline, ...) are written by hand in
# migration/regulatory/frames/<note>.en.md; article summaries are drafted locally.
notes:
  gdpr:
    source: eurlex
    # German summaries were translated from English (all reviewed and rewritten in corrections/).
    german_summaries: translate
    urls:
      en: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
      de: https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:02016R0679-20160504
    act: the General Data Protection Regulation (Regulation (EU) 2016/679)
    frontmatter:
      jurisdiction: EU
      instrument: regulation
      status: in-force
      official_reference: "Regulation (EU) 2016/679"
      consolidated_version: 2016-05-04
      aliases: [GDPR, DSGVO, DS-GVO]
    sources:
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj/eng
      - https://eur-lex.europa.eu/eli/reg/2016/679/oj/deu
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02016R0679-20160504
    # Important articles with a detailed section, and when they apply (Art. 99(2)).
    detailed:
      "5": applies from 25 May 2018 (Art. 99(2))
      "6": applies from 25 May 2018 (Art. 99(2))
      "9": applies from 25 May 2018 (Art. 99(2))
      "17": applies from 25 May 2018 (Art. 99(2))
      "22": applies from 25 May 2018 (Art. 99(2))
      "25": applies from 25 May 2018 (Art. 99(2))
      "35": applies from 25 May 2018 (Art. 99(2))
      "46": applies from 25 May 2018 (Art. 99(2))
  eprivacy-directive:
    source: eurlex
    # German summaries were translated from English (all reviewed and rewritten in corrections/).
    german_summaries: translate
    urls:
      en: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02002L0058-20091219
      de: https://eur-lex.europa.eu/legal-content/DE/TXT/HTML/?uri=CELEX:02002L0058-20091219
    act: the ePrivacy Directive (Directive 2002/58/EC)
    frontmatter:
      jurisdiction: EU
      instrument: directive
      status: in-force
      official_reference: "Directive 2002/58/EC"
      consolidated_version: 2009-12-19
      aliases: [ePrivacy Directive, ePrivacy-Richtlinie, Datenschutzrichtlinie für elektronische Kommunikation]
    sources:
      - https://eur-lex.europa.eu/eli/dir/2002/58/oj/eng
      - https://eur-lex.europa.eu/eli/dir/2002/58/oj/deu
      - https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=CELEX:02002L0058-20091219
    detailed:
      "5": >-
        applies through national transposition (deadline 31 October 2003, Art. 17); paragraph 3 in its
        current wording was introduced by Directive 2009/136/EC, to be transposed by 25 May 2011
  bdsg:
    source: gesetze
    slug: bdsg_2018
    act: the German Federal Data Protection Act (Bundesdatenschutzgesetz, BDSG)
    frontmatter:
      jurisdiction: DE
      instrument: national-law
      status: in-force
      official_reference: "BGBl. I 2017, 2097"
      consolidated_version: 2026-05-12
      aliases: [BDSG, Bundesdatenschutzgesetz, Federal Data Protection Act]
    sources:
      - https://www.gesetze-im-internet.de/bdsg_2018/
    # German law: application text in German (source language).
    detailed:
      "26": gilt seit dem Inkrafttreten des Gesetzes am 25. Mai 2018
      "31": gilt seit dem Inkrafttreten des Gesetzes am 25. Mai 2018
    # Fixes for the translated English headings (German is authentic).
    english_heading_terms:
      Affected Persons: Data Subjects
      Personal Data Protection Breaches: Personal Data Breaches
      Rights to Correction: Rights to Rectification
      Correction and Erasure: Rectification and Erasure
      Fines Provisions: Provisions on Fines
      Protection of Economic Traffic: Protection of Commercial Transactions
      Data Confidentiality: Data Secrecy
      Appeal to the Federal Commissioner: Complaint to the Federal Commissioner
  tdddg:
    source: gesetze
    slug: ttdsg
    act: the German Telecommunications Digital Services Data Protection Act (TDDDG)
    frontmatter:
      jurisdiction: DE
      instrument: national-law
      status: in-force
      official_reference: "BGBl. I 2021, 1982"
      consolidated_version: 2026-03-10
      aliases: [TDDDG, TTDSG, Telekommunikation-Digitale-Dienste-Datenschutz-Gesetz]
    sources:
      - https://www.gesetze-im-internet.de/ttdsg/
    detailed:
      "25": gilt seit dem Inkrafttreten des Gesetzes (damals TTDSG) am 1. Dezember 2021
    english_heading_terms:
      End Devices: Terminal Equipment
      End User Registers: End User Directories
      Information Procedure: Disclosure Procedure
      Message Transmission with Storage: Message Transmission with Intermediate Storage
      Disruption of Telecommunications Equipment: Faults in Telecommunications Systems
      Penalties and Fines: Criminal Provisions and Fines

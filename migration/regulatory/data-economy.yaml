# Migration package "EU data economy": input for `python -m app.agents.regulatory_notes <command> data-economy`.
# Texts come from the Publications Office (CELLAR): Official Journal text for unamended acts,
# consolidated version otherwise.
# Legal status checked with `python -m app.agents.cellar` on 2026-10-06: Data Act, DGA, DSA and DMA
# unamended; EECC amended by Directive (EU) 2022/2555; eIDAS amended by Directive (EU) 2022/2555 and
# Regulation (EU) 2024/1183.
notes:
  data-act:
    source: eurlex
    urls:
      en: cellar:32023R2854
      de: cellar:32023R2854
    act: the Data Act (Regulation (EU) 2023/2854)
    frontmatter:
      jurisdiction: EU
      instrument: regulation
      status: in-force
      official_reference: "Regulation (EU) 2023/2854"
      consolidated_version: 2023-12-22
      aliases: [Data Act, Datenverordnung, EU Data Act]
    sources:
      - https://eur-lex.europa.eu/eli/reg/2023/2854/oj/eng
      - https://eur-lex.europa.eu/eli/reg/2023/2854/oj/deu
    # Reviewed casing of the unit headings (the Official Journal prints them in capitals).
    english_heading_terms:
      MAKING DATA AVAILABLE TO PUBLIC SECTOR BODIES, THE COMMISSION, THE EUROPEAN CENTRAL BANK AND UNION BODIES ON THE BASIS OF AN EXCEPTIONAL NEED: Making data available to public sector bodies, the Commission, the European Central Bank and Union bodies on the basis of an exceptional need
      OBLIGATIONS FOR DATA HOLDERS OBLIGED TO MAKE DATA AVAILABLE PURSUANT TO UNION LAW: Obligations for data holders obliged to make data available pursuant to Union law
    german_heading_terms:
      ALLGEMEINE BESTIMMUNGEN: Allgemeine Bestimmungen
      DATENWEITERGABE VON UNTERNEHMEN AN VERBRAUCHER UND ZWISCHEN UNTERNEHMEN: Datenweitergabe von Unternehmen an Verbraucher und zwischen Unternehmen
      PFLICHTEN DER DATENINHABER, DIE GEMÄSS DEM UNIONSRECHT VERPFLICHTET SIND, DATEN BEREITZUSTELLEN: Pflichten der Dateninhaber, die gemäß dem Unionsrecht verpflichtet sind, Daten bereitzustellen
      MISSBRÄUCHLICHE VERTRAGSKLAUSELN IN BEZUG AUF DEN DATENZUGANG UND DIE DATENNUTZUNG ZWISCHEN UNTERNEHMEN: Missbräuchliche Vertragsklauseln in Bezug auf den Datenzugang und die Datennutzung zwischen Unternehmen
      BEREITSTELLUNG VON DATEN FÜR ÖFFENTLICHE STELLEN, DIE KOMMISSION, DIE EUROPÄISCHE ZENTRALBANK UND EINRICHTUNGEN DER UNION WEGEN AUSSERGEWÖHNLICHER NOTWENDIGKEIT: Bereitstellung von Daten für öffentliche Stellen, die Kommission, die Europäische Zentralbank und Einrichtungen der Union wegen außergewöhnlicher Notwendigkeit
      WECHSEL ZWISCHEN DATENVERARBEITUNGSDIENSTEN: Wechsel zwischen Datenverarbeitungsdiensten
      UNRECHTMÄSSIGER STAATLICHER ZUGANG ZU UND UNRECHTMÄSSIGE STAATLICHE ÜBERMITTLUNG VON NICHT-PERSONENBEZOGENEN DATEN IM INTERNATIONALEN UMFELD: Unrechtmäßiger staatlicher Zugang zu und unrechtmäßige staatliche Übermittlung von nicht-personenbezogenen Daten im internationalen Umfeld
      INTEROPERABILITÄT: Interoperabilität
      SCHUTZRECHT SUI GENERIS NACH DER RICHTLINIE 96/9/EG: Schutzrecht sui generis nach der Richtlinie 96/9/EG
      ANWENDUNG UND DURCHSETZUNG: Anwendung und Durchsetzung
      SCHLUSSBESTIMMUNGEN: Schlussbestimmungen

# Cybersecurity Act amended by Regulation (EU) 2025/37 (consolidated 2025-02-04); CRA amended by
# Article 104 of Regulation (EU) 2025/327 (EHDS: Art. 13(4) replaced, Art. 32(5a) inserted), no
# consolidated version yet, so the OJ text is used and the two amendments are covered in the review.
# BSIG: new act of 2 December 2025 (Article 1 NIS2UmsuCG), in force 6 December 2025; text includes the
# amendments of 11 March, 21 July and 23 July 2026.
# BSI-KritisV: last amended 15 May 2026.

# Migration package "Cybersecurity": input for `python -m app.agents.regulatory_notes <command> cybersecurity`.
# EU texts come from the Publications Office (CELLAR): Official Journal text for unamended acts,
# consolidated version otherwise. German law via gesetze-im-internet XML.

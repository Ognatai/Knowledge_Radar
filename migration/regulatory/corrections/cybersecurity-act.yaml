# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
# Summarised text: consolidated version of 4.2.2025 (including Regulation (EU) 2025/37).
en:
  "5": Requires ENISA to contribute to Union cybersecurity policy and law by advising on its development, assisting Member States with consistent implementation, supporting the Cooperation Group and reporting annually on incident notifications.
  "6": Requires ENISA to help Member States and Union institutions build capacity to prevent, detect and respond to cyber threats and incidents, including support for CERT-EU and national CSIRTs, biennial Union-level exercises and training.
  "7": Requires ENISA to support operational cooperation, act as secretariat of the CSIRTs network, organise Union-level cybersecurity exercises, prepare a regular technical situation report and contribute to the response to large-scale cross-border incidents.
  "8": Requires ENISA to support Union cybersecurity certification policy, in particular by preparing candidate certification schemes, monitoring standardisation, publishing guidelines and analysing the cybersecurity market.
  "10": Requires ENISA to raise public awareness of cybersecurity risks, provide guidance on cyber-hygiene, run outreach campaigns and help Member States promote cybersecurity education.
  "11": Requires ENISA to advise on cybersecurity research needs and priorities, take part in Union research funding programmes where empowered and contribute to the strategic research agenda.
  "12": Requires ENISA to support the Union's international cybersecurity cooperation, for example by observing international exercises, providing expertise to the Commission and advising on mutual recognition agreements for certificates.
  "14": Provides that the Management Board consists of one member appointed by each Member State and two appointed by the Commission, all with voting rights, alternates and renewable four-year terms.
  "16": Requires the Management Board to elect a Chairperson and a Deputy Chairperson from among its members by a two-thirds majority for four-year terms, renewable once.
  "17": Requires the Management Board to meet at least twice a year, and in extraordinary meetings at the request of its Chairperson, the Commission or a third of its members, with the Executive Director attending without a vote.
  "18": Provides that the Management Board decides by a majority of its members, with a two-thirds majority for the single programming document, the annual budget and decisions on the Executive Director.
  "19": Establishes an Executive Board of five Management Board members that prepares Management Board decisions, ensures follow-up to OLAF and audit findings, advises the Executive Director and may take urgent provisional decisions.
  "31": Makes the Executive Director responsible for implementing ENISA's budget and sets out the annual accounting and discharge procedure, from provisional accounts by 1 March to discharge by the European Parliament.
  "32": Requires the Management Board to adopt ENISA's financial rules after consulting the Commission, departing from Delegated Regulation (EU) No 1271/2013 only where necessary and with the Commission's prior consent.
  "36": Provides that the Management Board appoints the Executive Director from a list proposed by the Commission after an open selection procedure, for a five-year term that can be extended once.
  "37": Allows ENISA to make use of seconded national experts and other staff not employed by it, to whom the EU staff rules do not apply.
  "39": Governs ENISA's contractual liability by the law applicable to the contract and requires it to make good damage caused by it or its staff, with the Court of Justice competent for compensation disputes.
  "41": Subjects ENISA's processing of personal data to Regulation (EU) 2018/1725 and requires the Management Board to adopt implementing rules.
  "43": Requires ENISA, after consulting the Commission, to adopt security rules for sensitive non-classified and classified information based on the Commission's security principles.
  "45": Subjects ENISA's operations to supervision by the European Ombudsman under Article 228 TFEU.
  "47": Requires the Commission to publish, and update at least every three years, a Union rolling work programme setting strategic priorities and listing products and services that could benefit from European certification schemes.
  "48": Allows the Commission to request ENISA to prepare or review a certification scheme based on the Union rolling work programme and, in duly justified cases, the Commission or the ECCG to request schemes not included in it.
  "49": Requires ENISA to prepare candidate schemes on request, consulting stakeholders and the ECCG, empowers the Commission to adopt schemes by implementing acts and requires ENISA to evaluate each scheme at least every five years.
  "49a": Requires the Commission to publish its requests to ENISA for candidate schemes and allows the European Parliament and the Council to request quarterly information on draft schemes and to discuss how schemes function.
  "50": Requires ENISA to maintain a dedicated website on European cybersecurity certification schemes, certificates and EU statements of conformity, including withdrawn and expired ones.
  "56": Presumes certified products, services, processes and managed security services to comply with the scheme, keeps certification voluntary unless law provides otherwise, and regulates who may issue certificates at assurance levels basic, substantial and high.
  "57": Makes national certification schemes covered by a European scheme cease to produce effects from the date set in the implementing act, prohibits new overlapping national schemes and keeps existing national certificates valid until expiry.
  "58": Requires each Member State to designate independent national cybersecurity certification authorities that supervise certificates and self-assessments, handle complaints and may audit, withdraw certificates and impose penalties.
  "60": Requires conformity assessment bodies to be accredited by national accreditation bodies for at most five years, renewable, if they meet the requirements in the Annex.
  "65": Requires Member States to lay down effective, proportionate and dissuasive penalties for infringements of the certification rules and of European certification schemes and to notify them to the Commission.
  "67": Requires the Commission to evaluate ENISA and the certification framework by 28 June 2024 and every five years thereafter, including whether essential cybersecurity requirements for market access are needed.
  "69": Provides for entry into force on the twentieth day after publication, with the provisions on national certification authorities, conformity assessment bodies, notification, complaints, remedies and penalties applying from 28 June 2021.
de:
  "4": Legt die Ziele der ENISA fest, darunter ihre Rolle als Kompetenzzentrum für Cybersicherheit, die Unterstützung bei Politik und Kapazitätsaufbau, die Förderung der Zusammenarbeit und der europäischen Cybersicherheitszertifizierung sowie die Sensibilisierung.
  "5": Verpflichtet die ENISA, zur Entwicklung und Umsetzung der Unionspolitik und des Unionsrechts im Bereich der Cybersicherheit durch Beratung, Stellungnahmen, Leitlinien und einen jährlichen Bericht über gemeldete Sicherheitsvorfälle beizutragen.
  "6": Verpflichtet die ENISA, die Mitgliedstaaten und die Organe der Union beim Aufbau von Kapazitäten zur Verhütung, Erkennung und Bewältigung von Cyberbedrohungen und Sicherheitsvorfällen zu unterstützen, etwa durch Unterstützung des CERT-EU und nationaler CSIRTs sowie Übungen.
  "7": Verpflichtet die ENISA, die operative Zusammenarbeit zu unterstützen, das Sekretariat des CSIRTs-Netzwerks zu stellen, Cybersicherheitsübungen auf Unionsebene zu organisieren, regelmäßig einen technischen EU-Cybersicherheitslagebericht zu erstellen und zur Reaktion auf große grenzüberschreitende Sicherheitsvorfälle beizutragen.
  "8": Verpflichtet die ENISA, die Politik der Cybersicherheitszertifizierung zu unterstützen, insbesondere durch die Ausarbeitung möglicher europäischer Schemata, die Beobachtung der Normung, Leitlinien und Analysen des Cybersicherheitsmarkts.
  "10": Verpflichtet die ENISA, die Öffentlichkeit für Cybersicherheitsrisiken zu sensibilisieren, Leitlinien zur Cyberhygiene bereitzustellen, Aufklärungskampagnen durchzuführen und die Mitgliedstaaten bei der Cybersicherheitsausbildung zu unterstützen.
  "11": Verpflichtet die ENISA, die Organe der Union und die Mitgliedstaaten zu Forschungsbedarf und -prioritäten im Bereich der Cybersicherheit zu beraten und zur strategischen Forschungs- und Innovationsagenda beizutragen.
  "12": Verpflichtet die ENISA, die internationale Zusammenarbeit der Union in Fragen der Cybersicherheit zu unterstützen, etwa durch Beobachtung internationaler Übungen, Fachwissen für die Kommission und Beratung zu Abkommen über die gegenseitige Anerkennung von Zertifikaten.
  "13": Legt die Verwaltungs- und Leitungsstruktur der ENISA fest, bestehend aus Verwaltungsrat, Exekutivrat, Exekutivdirektor, ENISA-Beratungsgruppe und Netz der nationalen Verbindungsbeamten.
  "15": Legt die Aufgaben des Verwaltungsrats fest, darunter die allgemeine Ausrichtung der ENISA, die Annahme des einheitlichen Programmplanungsdokuments und des Haushalts sowie die Ernennung des Exekutivdirektors.
  "19": Richtet einen Exekutivrat aus fünf Mitgliedern des Verwaltungsrats ein, der Beschlüsse vorbereitet, Folgemaßnahmen zu OLAF- und Prüfergebnissen sicherstellt, den Exekutivdirektor berät und in dringenden Fällen vorläufige Beschlüsse fassen kann.
  "22": Setzt eine Gruppe der Interessenträger für die Cybersicherheitszertifizierung ein, deren Mitglieder die Kommission auf Vorschlag der ENISA auswählt und die die Kommission zu strategischen Fragen des Zertifizierungsrahmens berät.
  "25": Verpflichtet die Mitglieder des Verwaltungsrats, den Exekutivdirektor und abgeordnete Beamte, jährlich schriftlich zu erklären, ob Interessen bestehen, die ihre Unabhängigkeit beeinträchtigen könnten.
  "26": Verpflichtet die ENISA zu hoher Transparenz und dazu, der Öffentlichkeit und interessierten Kreisen angemessene, objektive und leicht zugängliche Informationen, insbesondere über ihre Arbeitsergebnisse, bereitzustellen.
  "27": Verbietet der ENISA, vertraulich zu behandelnde Informationen an Dritte weiterzugeben, verpflichtet ihre Organe und Bediensteten zur Vertraulichkeit nach Artikel 339 AEUV und regelt den Umgang mit Verschlusssachen.
  "31": Macht den Exekutivdirektor für die Ausführung des Haushaltsplans verantwortlich und regelt das jährliche Verfahren von den vorläufigen Rechnungen bis zur Entlastung durch das Europäische Parlament.
  "32": Verpflichtet den Verwaltungsrat, nach Konsultation der Kommission eine Finanzregelung zu erlassen, die von der Delegierten Verordnung (EU) Nr. 1271/2013 nur abweicht, wenn dies für den Betrieb der ENISA erforderlich ist und die Kommission vorher zustimmt.
  "33": Verpflichtet die ENISA, der Interinstitutionellen Vereinbarung über die internen Untersuchungen des Europäischen Amtes für Betrugsbekämpfung (OLAF) beizutreten, und gibt Rechnungshof und OLAF Prüf- und Untersuchungsbefugnisse bei von der ENISA finanzierten Verträgen und Finanzhilfen.
  "41": Unterwirft die Verarbeitung personenbezogener Daten durch die ENISA der Verordnung (EU) 2018/1725 und verpflichtet den Verwaltungsrat zu Durchführungsbestimmungen.
  "43": Verpflichtet die ENISA, nach Konsultation der Kommission Sicherheitsvorschriften für vertrauliche Informationen, die nicht zu den Verschlusssachen zählen, und für Verschlusssachen nach den Sicherheitsgrundsätzen der Kommission zu erlassen.
  "48": Erlaubt der Kommission, die ENISA auf Grundlage des fortlaufenden Arbeitsprogramms mit der Ausarbeitung oder Überarbeitung eines Schemas zu beauftragen, und in begründeten Fällen auch der Kommission oder der Europäischen Gruppe für die Cybersicherheitszertifizierung außerhalb des Programms.
  "49": Verpflichtet die ENISA, auf Auftrag mögliche Schemata unter Konsultation der Interessenträger und der Europäischen Gruppe für die Cybersicherheitszertifizierung auszuarbeiten, ermächtigt die Kommission, Schemata durch Durchführungsrechtsakte anzunehmen, und sieht eine Bewertung mindestens alle fünf Jahre vor.
  "49a": Verpflichtet die Kommission, ihre Aufträge an die ENISA zu veröffentlichen, und erlaubt dem Europäischen Parlament und dem Rat, vierteljährlich Informationen über Entwürfe möglicher Schemata anzufordern und die Funktionsweise der Schemata zu erörtern.
  "50": Verpflichtet die ENISA, eine Website zu europäischen Schemata für die Cybersicherheitszertifizierung, Zertifikaten und EU-Konformitätserklärungen zu betreiben, auch zu zurückgezogenen und abgelaufenen.
  "54": Legt die Mindestelemente eines europäischen Schemas für die Cybersicherheitszertifizierung fest, etwa Gegenstand und Umfang, angewandte Normen, Vertrauenswürdigkeitsstufen, Bewertungskriterien, Regeln zur Überwachung und zum Umgang mit Schwachstellen sowie die Höchstgültigkeitsdauer der Zertifikate.
  "55": Verpflichtet Hersteller oder Anbieter zertifizierter IKT-Produkte, -Dienste oder -Prozesse, ergänzende Cybersicherheitsangaben öffentlich zugänglich zu machen, etwa Leitlinien zur sicheren Konfiguration, den Zeitraum der Sicherheitsunterstützung und Kontaktangaben für Schwachstellenmeldungen.
  "56": Begründet für zertifizierte IKT-Produkte, -Dienste, -Prozesse und verwaltete Sicherheitsdienste die Vermutung der Einhaltung des Schemas, hält die Zertifizierung grundsätzlich freiwillig und regelt, wer Zertifikate der Stufen „niedrig“, „mittel“ und „hoch“ ausstellen darf.
  "57": Lässt nationale Zertifizierungsschemata, die unter ein europäisches Schema fallen, ab dem im Durchführungsrechtsakt festgelegten Zeitpunkt unwirksam werden, verbietet neue überschneidende nationale Schemata und lässt bestehende Zertifikate bis zu ihrem Ablauf gelten.
  "60": Verlangt, dass Konformitätsbewertungsstellen von nationalen Akkreditierungsstellen für höchstens fünf Jahre akkreditiert werden, wenn sie die Anforderungen des Anhangs erfüllen.
  "63": Gibt natürlichen und juristischen Personen das Recht, beim Aussteller eines europäischen Cybersicherheitszertifikats oder bei der zuständigen nationalen Behörde für die Cybersicherheitszertifizierung Beschwerde einzulegen.
  "65": Verpflichtet die Mitgliedstaaten, wirksame, verhältnismäßige und abschreckende Sanktionen für Verstöße gegen die Zertifizierungsvorschriften und die europäischen Schemata festzulegen und der Kommission mitzuteilen.
  "67": Verpflichtet die Kommission, die ENISA und den Zertifizierungsrahmen bis zum 28. Juni 2024 und danach alle fünf Jahre zu bewerten, auch im Hinblick darauf, ob grundlegende Cybersicherheitsanforderungen für den Marktzugang nötig sind.
  "68": Hebt die Verordnung (EU) Nr. 526/2013 mit Wirkung vom 27. Juni 2019 auf und lässt die durch diese Verordnung errichtete ENISA die Rechtsnachfolge der bisherigen ENISA antreten.
  "69": Regelt das Inkrafttreten am zwanzigsten Tag nach der Veröffentlichung; die Artikel 58, 60, 61, 63, 64 und 65 gelten ab dem 28. Juni 2021.

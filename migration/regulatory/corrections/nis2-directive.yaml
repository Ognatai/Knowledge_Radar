# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
en:
  "1": Lays down measures for a high common level of cybersecurity across the Union, including national strategies and authorities, risk-management and reporting obligations for entities, information sharing, and supervision and enforcement.
  "2": Applies to medium-sized and larger public or private entities of a type listed in Annex I or II that operate in the Union and, regardless of size, to certain entities such as telecoms providers, trust service providers, DNS providers and critical entities.
  "8": Requires each Member State to designate or establish one or more competent authorities for cybersecurity and supervision and a single point of contact for cross-border and cross-sectoral cooperation.
  "10": Requires each Member State to designate or establish one or more CSIRTs, which may sit within a competent authority, cover at least the sectors in Annexes I and II and are responsible for incident handling.
  "11": Sets out requirements for CSIRTs, such as highly available communication channels, secure premises and redundant systems, and their tasks, including monitoring threats, issuing early warnings, responding to incidents and scanning entities' systems on request.
  "12": Requires each Member State to designate a CSIRT as coordinator for coordinated vulnerability disclosure, acting as a trusted intermediary between reporters and manufacturers, and requires ENISA to set up a European vulnerability database.
  "18": Requires ENISA, in cooperation with the Commission and the Cooperation Group, to adopt a biennial report on the state of cybersecurity in the Union with a risk assessment and policy recommendations and to present it to the European Parliament.
  "19": Provides for voluntary peer reviews of Member States' cybersecurity measures by experts from at least two other Member States, based on a methodology that the Cooperation Group establishes on 17 January 2025.
  "20": Requires the management bodies of essential and important entities to approve the cybersecurity risk-management measures, oversee their implementation and follow training, and makes them liable for infringements.
  "21": Requires essential and important entities to take appropriate and proportionate risk-management measures based on an all-hazards approach, including at least incident handling, business continuity, supply chain security, cryptography, access control and multi-factor authentication.
  "22": Allows the Cooperation Group, together with the Commission and ENISA, to carry out coordinated security risk assessments of critical ICT supply chains, taking into account technical and non-technical risk factors.
  "23": Requires essential and important entities to report significant incidents to their CSIRT or competent authority, with an early warning within 24 hours, an incident notification within 72 hours and a final report within one month.
  "24": Allows Member States to require essential and important entities to use ICT products, services and processes certified under European cybersecurity certification schemes, and empowers the Commission to make this mandatory for certain categories of entities.
  "25": Requires Member States to encourage the use of European and international standards and technical specifications for the security of network and information systems, without favouring a particular technology.
  "26": Places entities under the jurisdiction of the Member State of establishment, except that telecoms providers fall under the Member States where they provide services and digital providers such as cloud services under the Member State of their main establishment in the Union.
  "29": Requires Member States to ensure that entities can voluntarily exchange cybersecurity information, such as cyber threats, vulnerabilities and indicators of compromise, within cybersecurity information-sharing arrangements.
  "31": Requires Member States to ensure effective supervision by competent authorities, allows risk-based prioritisation and requires close cooperation with data protection authorities on incidents resulting in personal data breaches.
  "32": Gives competent authorities extensive powers over essential entities, including inspections, regular and ad hoc audits, security scans, binding instructions and fines, and as a last resort suspension of authorisations and temporary bans on managers.
  "33": Requires competent authorities to act against important entities only ex post, where evidence indicates non-compliance, with powers similar to but more limited than those for essential entities.
  "34": Requires Member States to provide for fines for breaches of Articles 21 and 23 with maximums of at least 10 million euros or 2 percent of worldwide turnover for essential entities and 7 million euros or 1.4 percent for important entities, whichever is higher.
  "36": Requires Member States to lay down effective, proportionate and dissuasive penalties for infringements of national implementing measures and to notify them to the Commission by 17 January 2025.
  "40": Requires the Commission to review the functioning of the Directive by 17 October 2027 and every 36 months thereafter, in particular the relevance of entity sizes and sectors, and to propose legislation where necessary.
de:
  "1": Legt Maßnahmen für ein hohes gemeinsames Cybersicherheitsniveau in der Union fest, darunter nationale Strategien und Behörden, Risikomanagement- und Berichtspflichten für Einrichtungen, Informationsaustausch sowie Aufsicht und Durchsetzung.
  "2": Erfasst öffentliche und private Einrichtungen der in Anhang I oder II genannten Art ab der Größe mittlerer Unternehmen, die in der Union tätig sind, sowie unabhängig von der Größe etwa Telekommunikationsanbieter, Vertrauensdiensteanbieter, DNS-Diensteanbieter und kritische Einrichtungen.
  "3": Bestimmt, welche Einrichtungen als wesentliche und welche als wichtige Einrichtungen gelten, und verpflichtet die Mitgliedstaaten, bis zum 17. April 2025 eine Liste dieser Einrichtungen zu erstellen.
  "11": Legt Anforderungen an die CSIRTs fest, etwa hochverfügbare Kommunikationskanäle, sichere Standorte und redundante Systeme, sowie ihre Aufgaben, darunter Überwachung von Cyberbedrohungen, Frühwarnungen, Reaktion auf Sicherheitsvorfälle und Scans auf Antrag.
  "13": Verpflichtet die zuständigen Behörden, zentralen Anlaufstellen und CSIRTs eines Mitgliedstaats zur Zusammenarbeit und die Mitgliedstaaten zur Zusammenarbeit mit anderen Behörden, etwa Strafverfolgungs- und Datenschutzbehörden und Behörden nach der Richtlinie (EU) 2022/2557.
  "17": Erlaubt der Union, internationale Übereinkünfte zu schließen, die Drittländern oder internationalen Organisationen die Beteiligung an Tätigkeiten der Kooperationsgruppe, des CSIRTs-Netzwerks und von EU-CyCLONe ermöglichen.
  "20": Verpflichtet die Mitgliedstaaten sicherzustellen, dass die Leitungsorgane wesentlicher und wichtiger Einrichtungen die Risikomanagementmaßnahmen billigen, ihre Umsetzung überwachen, an Schulungen teilnehmen und für Verstöße verantwortlich gemacht werden können.
  "21": Verpflichtet wesentliche und wichtige Einrichtungen zu geeigneten und verhältnismäßigen Risikomanagementmaßnahmen nach einem gefahrenübergreifenden Ansatz, mindestens etwa zur Bewältigung von Sicherheitsvorfällen, Aufrechterhaltung des Betriebs, Sicherheit der Lieferkette, Kryptografie und Multi-Faktor-Authentifizierung.
  "22": Erlaubt der Kooperationsgruppe, gemeinsam mit der Kommission und der ENISA koordinierte Risikobewertungen kritischer Lieferketten für IKT-Dienste, -Systeme oder -Produkte durchzuführen, die die Kommission bestimmt.
  "23": Verpflichtet wesentliche und wichtige Einrichtungen, erhebliche Sicherheitsvorfälle dem CSIRT oder der zuständigen Behörde zu melden, mit Frühwarnung binnen 24 Stunden, Meldung über den Sicherheitsvorfall binnen 72 Stunden und Abschlussbericht binnen eines Monats.
  "24": Erlaubt den Mitgliedstaaten, wesentlichen und wichtigen Einrichtungen die Nutzung von nach europäischen Schemata zertifizierten IKT-Produkten, -Diensten und -Prozessen vorzuschreiben, und ermächtigt die Kommission, dies für bestimmte Kategorien verbindlich festzulegen.
  "25": Verpflichtet die Mitgliedstaaten, die Anwendung europäischer und internationaler Normen und technischer Spezifikationen für die Sicherheit von Netz- und Informationssystemen zu fördern, ohne eine bestimmte Technologie vorzuschreiben oder zu bevorzugen.
  "26": Unterstellt Einrichtungen der Zuständigkeit des Mitgliedstaats ihrer Niederlassung, mit Ausnahmen; Telekommunikationsanbieter unterliegen dem Mitgliedstaat, in dem sie Dienste erbringen, digitale Anbieter wie Cloud-Computing-Dienstleister dem Mitgliedstaat ihrer Hauptniederlassung in der Union.
  "27": Verpflichtet die ENISA, ein Register der DNS-Diensteanbieter, TLD-Namenregister, Cloud-Computing-Dienstleister und weiterer digitaler Anbieter zu führen, die den zuständigen Behörden bis zum 17. Januar 2025 Angaben wie Hauptniederlassung und IP-Adressbereiche übermitteln müssen.
  "28": Verpflichtet die Mitgliedstaaten, TLD-Namenregister und Anbieter von Domänennamen-Registrierungsdiensten zur Pflege genauer und vollständiger Domänennamen-Registrierungsdaten, zur Veröffentlichung nicht personenbezogener Daten und zur Auskunft an berechtigte Zugangsnachfrager binnen 72 Stunden zu verpflichten.
  "32": Gibt den zuständigen Behörden gegenüber wesentlichen Einrichtungen weitreichende Befugnisse, darunter Vor-Ort-Kontrollen, Sicherheitsprüfungen, Ad-hoc-Prüfungen, verbindliche Anweisungen und Geldbußen, als letztes Mittel auch die Aussetzung von Genehmigungen und das vorübergehende Verbot von Leitungsaufgaben.
  "33": Verpflichtet die zuständigen Behörden, gegenüber wichtigen Einrichtungen nachträglich tätig zu werden, wenn Hinweise auf Verstöße vorliegen, mit ähnlichen, aber begrenzteren Befugnissen als gegenüber wesentlichen Einrichtungen.
  "34": Verpflichtet die Mitgliedstaaten, für Verstöße gegen die Artikel 21 und 23 Geldbußen mit Höchstbeträgen von mindestens 10 Millionen Euro oder 2 % des weltweiten Jahresumsatzes für wesentliche und 7 Millionen Euro oder 1,4 % für wichtige Einrichtungen vorzusehen, je nachdem, welcher Betrag höher ist.
  "35": Verpflichtet die zuständigen Behörden, die Datenschutzaufsichtsbehörden unverzüglich zu unterrichten, wenn ein Verstoß eine meldepflichtige Verletzung des Schutzes personenbezogener Daten zur Folge haben kann, und schließt doppelte Geldbußen für dasselbe Verhalten aus.
  "36": Verpflichtet die Mitgliedstaaten, wirksame, verhältnismäßige und abschreckende Sanktionen für Verstöße gegen die nationalen Umsetzungsmaßnahmen festzulegen und der Kommission bis zum 17. Januar 2025 mitzuteilen.
  "38": Regelt die Befugnis der Kommission zum Erlass delegierter Rechtsakte über verpflichtende Zertifizierungen nach Artikel 24, übertragen für fünf Jahre ab dem 16. Januar 2023, einschließlich Widerruf und Einwänden von Parlament und Rat.
  "39": Regelt das Ausschussverfahren nach der Verordnung (EU) Nr. 182/2011, mit dem die Kommission beim Erlass von Durchführungsrechtsakten unterstützt wird.
  "40": Verpflichtet die Kommission, die Richtlinie bis zum 17. Oktober 2027 und danach alle 36 Monate zu überprüfen, insbesondere Größe und Sektoren der erfassten Einrichtungen, und dem Europäischen Parlament und dem Rat zu berichten.
  "41": Verpflichtet die Mitgliedstaaten, die erforderlichen Vorschriften bis zum 17. Oktober 2024 zu erlassen und zu veröffentlichen und sie ab dem 18. Oktober 2024 anzuwenden.
  "44": Hebt die Richtlinie (EU) 2016/1148 mit Wirkung vom 18. Oktober 2024 auf; Bezugnahmen auf sie gelten als Bezugnahmen auf diese Richtlinie nach der Entsprechungstabelle in Anhang III.

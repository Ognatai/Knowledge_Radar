# Reviewed corrections of the model summaries (source language: de).
# KWG review (2026-10-06): every summary checked against the section heading and the opening
# paragraphs (the core rule); sections with model flags or doubts were read in full.
de:
  "2b": Verbietet, erlaubnispflichtige Kreditinstitute sowie Factoring- und Finanzierungsleasingunternehmen in der Rechtsform des Einzelkaufmanns zu betreiben.
  "2c": Verpflichtet interessierte Erwerber, den beabsichtigten Erwerb oder die Erhöhung einer bedeutenden Beteiligung an einem Institut der Bundesanstalt und der Deutschen Bundesbank vorab anzuzeigen, und erlaubt der Bundesanstalt, den Erwerb zu untersagen.
  "2e": Erlaubt der Aufsichtsbehörde, auf gemischte Finanzholding-Gesellschaften, die gleichwertigen Bestimmungen unterliegen, nur die einschlägigen Vorschriften einer der betroffenen Richtlinien anzuwenden.
  "2g": Verpflichtet CRR-Kreditinstitute und Wertpapierinstitute im Europäischen Wirtschaftsraum mit demselben Mutterunternehmen in einem Drittstaat, ein zwischengeschaltetes EU-Mutterunternehmen einzurichten, wenn die Drittstaatengruppe im Europäischen Wirtschaftsraum Vermögenswerte von mehr als 40 Milliarden Euro hält.
  "3": Verbietet Werksparkassen, Zwecksparunternehmen außer Bausparkassen sowie Kredit- und Einlagengeschäfte ohne Möglichkeit der Barabhebung und untersagt großen CRR-Kreditinstituten und ihren Gruppen oberhalb bestimmter Schwellenwerte bestimmte risikoreiche Geschäfte.
  "6b": Verpflichtet die Aufsichtsbehörde, die Regelungen, Strategien, Verfahren und Prozesse eines Instituts sowie seine Risiken zu überprüfen und zu beurteilen, auch anhand von Stresstests.
  "7a": Verpflichtet die Bundesanstalt, der Europäischen Kommission bestimmte Vorgänge zu melden, etwa das Erlöschen oder die Aufhebung von Erlaubnissen.
  "7c": Weggefallen.
  "8": Regelt die Zusammenarbeit der Bundesanstalt mit anderen Stellen, etwa Mitteilungen der Finanzbehörden über Steuerstrafverfahren und den Informationsaustausch mit zuständigen Stellen im Europäischen Wirtschaftsraum und in Drittstaaten.
  "8d": Weggefallen.
  "8f": Regelt die Einstufung von Zweigniederlassungen als bedeutend und die Zusammenarbeit mit den Behörden des Aufnahmestaats bei ihrer Aufsicht.
  "8g": Verpflichtet die Bundesanstalt, mit anderen zuständigen Behörden im Europäischen Wirtschaftsraum alle Informationen auszutauschen, die nötig sind, um eine Umgehung der Anforderungen an Drittstaatengruppen zu verhindern.
  "8h": Verpflichtet die Aufsichtsbehörde, den Abwicklungsbehörden zusätzliche Eigenmittelanforderungen und Eigenmittelempfehlungen gegenüber CRR-Kreditinstituten zu melden.
  "9": Verpflichtet die bei der Bundesanstalt und der Deutschen Bundesbank tätigen sowie weitere beauftragte Personen, geheimhaltungsbedürftige Tatsachen nicht unbefugt zu offenbaren oder zu verwerten.
  "10e": Erlaubt der Bundesanstalt, für alle oder bestimmte Institute einen Kapitalpuffer für systemische Risiken aus hartem Kernkapital anzuordnen.
  "10i": Definiert die kombinierte Kapitalpufferanforderung als das gesamte harte Kernkapital, das für den Kapitalerhaltungspuffer, den antizyklischen Kapitalpuffer und die Puffer für systemische Risiken und systemrelevante Institute erforderlich ist.
  "12": Verpflichtet die Aufsichtsbehörde, jährlich im Einvernehmen mit der Deutschen Bundesbank zu bestimmen, welche Institute und Gesellschaften potentiell systemrelevant sind.
  "12a": Verpflichtet Institute und Finanzholding-Gesellschaften, beim Erwerb von Beteiligungen an ausländischen Unternehmen sicherzustellen, dass sie die für die Zusammenfassung nach § 10a erforderlichen Angaben erhalten.
  "13": Verlangt für Großkredite einen einstimmigen Beschluss sämtlicher Geschäftsleiter und ermächtigt das Bundesministerium der Finanzen zu näheren Regelungen, etwa zum Großkreditmeldeverfahren.
  "13d": Weggefallen.
  "16": Aufgehoben.
  "18": Verpflichtet Kreditinstitute, sich vor Gewährung von Krediten über 1,5 Millionen Euro oder 10 Prozent des Kernkapitals die wirtschaftlichen Verhältnisse des Kreditnehmers offenlegen zu lassen.
  "18a": Verpflichtet Kreditinstitute, vor Abschluss eines Verbraucherdarlehensvertrags die Kreditwürdigkeit des Darlehensnehmers zu prüfen und den Vertrag nur bei positivem Ergebnis der Prüfung abzuschließen.
  "20": Nimmt bestimmte Geschäfte vom Kreditbegriff für Millionenkredite aus, etwa kurzfristig abgewickelte Devisen- und Wertpapiergeschäfte und Forderungen aus dem Zahlungsverkehr.
  "22c": Erklärt die §§ 22d bis 22o für Refinanzierungsregister, die von einem oder für einen Refinanzierungsmittler geführt werden, für sinngemäß anwendbar.
  "22h": Gibt dem Verwalter das Recht, die Bücher des registerführenden Unternehmens einzusehen, und verpflichtet ihn zur Verschwiegenheit über dabei erlangte Tatsachen.
  "22m": Verpflichtet das Insolvenzgericht, Ernennung und Abberufung des Sachwalters dem Registergericht mitzuteilen und öffentlich bekannt zu machen.
  "22p": Weggefallen.
  "23": Erlaubt der Bundesanstalt, bestimmte Arten der Werbung von Instituten zu untersagen, etwa wenn Werbung für Verbraucherdarlehen falsche Erwartungen weckt.
  "24c": Verpflichtet Kreditinstitute, ein Dateisystem mit Konto- und Depotstammdaten zu führen, aus dem die Bundesanstalt Daten automatisiert abrufen kann.
  "25e": Verlangt, dass Inhaber von Schlüsselfunktionen fachlich geeignet und zuverlässig sind, und verpflichtet die Unternehmen, die ordnungsgemäße Ausübung der Schlüsselfunktionen sicherzustellen.
  "25f": Verpflichtet CRR-Kreditinstitute und ihre Gruppen, die nach § 3 Absatz 2 und 4 verbotenen Geschäfte nur in einem wirtschaftlich, organisatorisch und rechtlich eigenständigen Finanzhandelsinstitut zu betreiben, das sich eigenständig refinanziert.
  "25g": Unterstellt die Einhaltung der Pflichten von Kreditinstituten nach EU-Vorschriften zum bargeldlosen Zahlungsverkehr, etwa zu Geldtransfers und grenzüberschreitenden Zahlungen, der Überwachung durch die Bundesanstalt.
  "25i": Verpflichtet Kreditinstitute, bei der Ausgabe von E-Geld die allgemeinen Sorgfaltspflichten des Geldwäschegesetzes auch unterhalb der Schwellenwerte zu erfüllen, mit Ausnahmen für geringe Beträge.
  "25j": Erlaubt, die Identitätsprüfung erst unverzüglich nach Eröffnung eines Kontos oder Depots abzuschließen, sofern bis dahin keine Gelder abverfügt werden können.
  "25k": Verpflichtet Institute zu Sorgfaltspflichten bei Sortengeschäften ab 2.500 Euro, die nicht über ein Kundenkonto abgewickelt werden, und Factoringinstitute zu Maßnahmen gegen erhöhte Geldwäscherisiken.
  "25l": Unterwirft Finanzholding-Gesellschaften und gemischte Finanzholding-Gesellschaften mit Zulassung nach § 2f den Pflichten des Geldwäschegesetzes und der Geldwäscheaufsicht der Bundesanstalt.
  "25m": Verbietet Geschäftsbeziehungen mit Bank-Mantelgesellschaften und das Führen von Konten auf den Namen des Instituts oder für dritte Institute, über die deren Kunden eigenständig verfügen können.
  "26": Verpflichtet Institute, den Jahresabschluss in den ersten drei Monaten des Geschäftsjahres aufzustellen und mit dem Lagebericht der Bundesanstalt und der Deutschen Bundesbank einzureichen, und den Abschlussprüfer, seinen Prüfungsbericht einzureichen.
  "26d": Verpflichtet die Geschäftsleiter, einen ESG-Risikoplan zur Überwachung und Steuerung der finanziellen Risiken aus Umwelt-, Sozial- und Unternehmensführungsfaktoren mit Zielen und Prozessen erstellen zu lassen.
  "27": Aufgehoben.
  "28": Verpflichtet Institute, den bestellten Abschlussprüfer anzuzeigen, und erlaubt der Bundesanstalt, binnen zwei Monaten die Bestellung eines anderen Prüfers zu verlangen, etwa nach elf aufeinanderfolgenden Jahren mit demselben Prüfer.
  "29": Verpflichtet den Abschlussprüfer, bei der Prüfung des Jahresabschlusses auch die wirtschaftlichen Verhältnisse des Instituts und die Einhaltung bestimmter Anzeigepflichten und aufsichtlicher Anforderungen zu prüfen.
  "33": Nennt die Gründe, aus denen die Erlaubnis zu versagen ist, etwa fehlendes Anfangskapital oder unzuverlässige oder fachlich ungeeignete Geschäftsleiter oder Inhaber bedeutender Beteiligungen.
  "33b": Verpflichtet die Aufsichtsbehörde, vor einer Erlaubnis für Tochter- oder Schwesterunternehmen von CRR-Kreditinstituten, Börsenbetreibern oder Erstversicherern aus anderen Staaten des Europäischen Wirtschaftsraums deren zuständige Stellen anzuhören.
  "35": Regelt das Erlöschen der Erlaubnis, etwa wenn sie ein Jahr lang nicht genutzt wird, und ihre Aufhebung durch die Aufsichtsbehörde, etwa bei Gefahr für die Gläubiger oder schweren Verstößen.
  "36": Erlaubt der Bundesanstalt, statt die Erlaubnis aufzuheben, die Abberufung verantwortlicher Geschäftsleiter zu verlangen und ihnen die Tätigkeit zu untersagen, und regelt Maßnahmen gegen Mitglieder des Verwaltungs- oder Aufsichtsorgans.
  "36a": Erlaubt der Aufsichtsbehörde, einer für bestimmte Verstöße verantwortlichen natürlichen Person vorübergehend für bis zu zwei Jahre die künftige Tätigkeit als Geschäftsleiter bei einem Institut zu untersagen.
  "41": Nimmt Unternehmen, bei denen die Worte Bank oder Sparkasse keinen Anschein von Bankgeschäften erwecken, von den §§ 39 und 40 aus und erlaubt ausländischen Kreditinstituten geschützte Bezeichnungen mit einem Hinweis auf ihren Sitzstaat.
  "45a": Erlaubt der Bundesanstalt, Finanzholding-Gesellschaften an der Spitze einer Gruppe die Ausübung ihrer Stimmrechte zu untersagen, etwa wenn sie die für die Konsolidierung erforderlichen Angaben nicht übermitteln.
  "45c": Erlaubt der Aufsichtsbehörde, einen unabhängigen, zuverlässigen und geeigneten Sonderbeauftragten mit Aufgaben und Befugnissen bei einem Institut zu betrauen.
  "46a": Erlaubt der Aufsichtsbehörde, Instituten die Verwendung von Ratings nicht registrierter Ratingagenturen außerhalb des Europäischen Wirtschaftsraums zu untersagen und Anordnungen gegen einen übermäßigen Rückgriff auf externe Ratings zu treffen.
  "46c": Verschiebt den Beginn insolvenzrechtlicher Fristen auf den Tag einer Maßnahme nach § 46, vermutet die Zulässigkeit bestimmter danach erbrachter Leistungen und regelt den Sorgfaltsmaßstab für das Handeln der Bundesanstalt.
  "46d": Verpflichtet die Bundesanstalt, die zuständigen Behörden der anderen Staaten des Europäischen Wirtschaftsraums vor Sanierungsmaßnahmen gegenüber CRR-Kreditinstituten zu unterrichten.
  "46f": Regelt die Unterrichtung der Gläubiger durch ein Formblatt in allen Amtssprachen des Europäischen Wirtschaftsraums und die Rangfolge bestimmter Forderungen im Insolvenzverfahren über ein Institut.
  "46g": Erlaubt der Bundesregierung, bei drohenden schweren Gefahren für die Gesamtwirtschaft durch Rechtsverordnung ein Moratorium für ein Kreditinstitut anzuordnen und den Bank- und Börsenverkehr vorübergehend einzustellen.
  "46h": Erlaubt der Bundesregierung, durch Rechtsverordnung die Wiederaufnahme des Zahlungs- und Börsenverkehrs nach einer vorübergehenden Schließung zu regeln, einschließlich zeitweiliger Auszahlungsbeschränkungen.
  "48": Erlaubt der Aufsichtsbehörde, bei Verstößen gegen die Verordnung (EU) 2017/2402 über Verbriefungen die Einstellung der Verstöße anzuordnen und weitere Maßnahmen zu ergreifen, etwa bei fälschlich als STS bezeichneten Verbriefungen.
  "48a": Erlaubt der Bundesanstalt, Geschäftsleiter bei einem Risiko übermäßiger Konzentration gegenüber einer zentralen Gegenpartei anzuweisen, die Risikopositionen zu verringern oder über Clearingkonten neu zuzuweisen.
  "48u": Erlaubt der Bundesanstalt, durch Allgemeinverfügung Beschränkungen für Darlehen zum Bau oder Erwerb von Wohnimmobilien festzulegen, wenn dies zur Abwehr von Gefahren für die Finanzstabilität erforderlich ist.
  "50": Erlaubt der Bundesanstalt, bei anhaltenden Verstößen periodische Zwangsgelder gegen Unternehmen und verantwortliche Personen wie Geschäftsleiter und Organmitglieder zu verhängen.
  "51": Verpflichtet die Institute, dem Bund die Kosten der Aufsicht zu 90 Prozent zu erstatten, umgelegt nach dem Geschäftsumfang.
  "52": Lässt eine andere staatliche Aufsicht über Institute neben der Aufsicht der Bundesanstalt bestehen.
  "53c": Bestimmt, wann Zweigstellen von Unternehmen aus Drittstaaten als CRD-Drittstaatenzweigstellen gelten, für die die besonderen Vorschriften der §§ 53ca bis 53cq gelten.
  "53cf": Unterwirft CRD-Drittstaatenzweigstellen der Risikoklasse 1 den Liquiditätsanforderungen der Verordnung (EU) Nr. 575/2013 und verpflichtet solche der Risikoklasse 2, liquide Aktiva für Abflüsse von mindestens 30 Tagen vorzuhalten.
  "53cg": Verpflichtet CRD-Drittstaatenzweigstellen, zwei Geschäftsleiter mit Wohnsitz im Inland zu bestellen, und erklärt je nach Risikoklasse Vorschriften über Unternehmensführung und Risikomanagement für anwendbar.
  "53ci": Erlaubt der Bundesanstalt, von CRD-Drittstaatenzweigstellen die Gründung eines erlaubnispflichtigen Tochterunternehmens zu verlangen, etwa bei grenzüberschreitender Tätigkeit oder Systemrelevanz.
  "53cj": Verlangt eine Bewertung der Systemrelevanz von CRD-Drittstaatenzweigstellen, wenn ihre Drittstaatengruppe über solche Zweigstellen in der Europäischen Union Vermögenswerte von 40 Milliarden Euro oder mehr hält.
  "53cm": Verpflichtet die Bundesanstalt, CRD-Drittstaatenzweigstellen nach Titel VII der Richtlinie 2013/36/EU zu beaufsichtigen und in ihre Aufsichtsplanung aufzunehmen.
  "53co": Verpflichtet die Bundesanstalt, von CRD-Drittstaatenzweigstellen frühzeitig Maßnahmen zur Einhaltung der Anforderungen und zur Abdeckung wesentlicher Risiken zu verlangen, etwa eine höhere Kapitalausstattung.
  "53cq": Erklärt § 2g Absatz 5 und § 7b Absatz 2 Nummer 1a für CRD-Drittstaatenzweigstellen für entsprechend anwendbar.
  "53d": Verpflichtet die Aufsichtsbehörde zu prüfen, ob die konsolidierte Aufsicht eines Drittstaats über Mutterunternehmen inländischer CRR-Kreditinstitute und Wertpapierhandelsunternehmen gleichwertig ist.
  "53e": Wendet die Vorschriften über Inhaber bedeutender Beteiligungen entsprechend an, wenn die Bundesanstalt eine schädliche Einflussnahme auf eine zentrale Gegenpartei nach der Verordnung (EU) Nr. 648/2012 beenden soll.
  "53k": Erklärt für Auslagerungen zentraler Gegenparteien nach der Verordnung (EU) Nr. 648/2012 § 25b Absatz 3 Satz 1 und 2 und Absatz 4 für entsprechend anwendbar.
  "54": Bestraft mit Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe, wer verbotene Geschäfte nach § 3 betreibt, ohne Erlaubnis Bankgeschäfte betreibt oder Finanzdienstleistungen erbringt oder ohne Zulassung Clearingdienstleistungen erbringt.
  "54a": Bestraft mit Freiheitsstrafe bis zu fünf Jahren oder Geldstrafe, wer entgegen § 25c Absatz 4a oder 4b nicht für die dort vorgeschriebenen Strategien, Prozesse und Verfahren sorgt und dadurch eine Bestandsgefährdung des Instituts oder der Gruppe herbeiführt.
  "55a": Bestraft mit Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe, wer entgegen § 14 Absatz 2 Satz 10 Angaben über Millionenkredite verwertet; die Tat wird nur auf Antrag verfolgt.
  "57": Ahndet Verstöße gegen die Pflichten zur getrennten und gesicherten Verwahrung von Kryptowerten und privaten kryptographischen Schlüsseln nach § 26b mit Geldbußen bis zu 500 000 Euro.
  "58": Weggefallen.
  "59": Erstreckt § 30 des Gesetzes über Ordnungswidrigkeiten auf Unternehmen im Sinne des § 53b Absatz 1 Satz 1 und Absatz 7 Satz 1, die über eine Zweigniederlassung oder grenzüberschreitend im Inland tätig sind.
  "60a": Verpflichtet Gerichte und Strafverfolgungsbehörden, der Bundesanstalt in Strafverfahren gegen Inhaber, Geschäftsleiter und Organmitglieder von Instituten sowie wegen Straftaten nach § 54 bei Erhebung der öffentlichen Klage die Anklageschrift und weitere Unterlagen zu übermitteln.
  "60b": Verpflichtet die Bundesanstalt, bestandskräftige Maßnahmen und unanfechtbare Bußgeldentscheidungen wegen Verstößen gegen dieses Gesetz oder die Verordnung (EU) Nr. 575/2013 unverzüglich auf ihren Internetseiten bekannt zu machen und dabei Art und Charakter des Verstoßes anzugeben.
  "61": Lässt die Erlaubnis nach § 32 für Kreditinstitute als erteilt gelten, die bei Inkrafttreten des Gesetzes Bankgeschäfte im Umfang von § 1 Absatz 1 betreiben durften.
  "62": Erhält bestehende Rechtsvorschriften und Anordnungen auf dem Gebiet des Kreditwesens aufrecht, soweit dieses Gesetz nicht entgegensteht, und überträgt die Aufgaben der früheren Bankaufsichtsbehörde auf die Bundesanstalt.
  "63": Betraf die Aufhebung und Änderung von Rechtsvorschriften; der Text ist nicht abgedruckt.
  "63a": Lässt die Erlaubnis für Kreditinstitute mit Sitz in der DDR, die am 1. Juli 1990 Bankgeschäfte betreiben durften, als erteilt gelten und erlaubt der Bundesanstalt, Kreditinstitute in dem in Artikel 3 des Einigungsvertrages genannten Gebiet von Verpflichtungen nach diesem Gesetz freizustellen.
  "64": Lässt die Erlaubnis für das Nachfolgeunternehmen der Deutschen Bundespost POSTBANK ab 1. Januar 1995 als erteilt gelten und ließ bestimmte Anteile bis zum 31. Dezember 2002 unberücksichtigt.
  "64a": Erlaubte bereits am 27. Juni 2019 bestehenden Finanzholding-Gesellschaften, bis zum 28. Juni 2021 die Zulassung nach § 2f zu beantragen, und regelt die Befugnisse der Aufsichtsbehörde in der Übergangszeit und bei fehlendem Antrag.
  "64c": Enthält Übergangsvorschriften zum Bankenrichtlinienumsetzungs- und Bürokratieentlastungsgesetz, darunter Bestandsschutz für Mandate von Geschäftsleitern zugelassener Finanzholding-Gesellschaften, die am 31. Dezember 2025 bestanden, und den erstmaligen Anwendungszeitpunkt neuer Anzeigefristen.
  "64d": Weggefallen.
  "64g": Verlangt bis zum Erlass der Rechtsverordnung nach § 13c, dass bedeutende gruppeninterne Transaktionen mit gemischten Holdinggesellschaften oder deren Tochterunternehmen eines Kalenderjahres vor dem 16. Januar des Folgejahres der Bundesanstalt und der Deutschen Bundesbank angezeigt werden.
  "64h": Erlaubt Instituten, vor dem 1. Januar 2007 erhobene personenbezogene Daten nach Maßgabe des § 10 Absatz 2 zu verarbeiten; die übrigen Übergangsvorschriften sind weggefallen oder ausgelaufen.
  "64i": Lässt die Erlaubnis für die Anlageberatung und weitere durch das Finanzmarktrichtlinie-Umsetzungsgesetz neu geregelte Tätigkeiten für Unternehmen mit bestehender Erlaubnis am 1. November 2007 als erteilt oder vorläufig erteilt gelten.
  "64m": Wendet § 25a Absatz 5a erstmals auf Kündigungen an, die nach Ablauf von acht Monaten nach dem 29. März 2019 zugehen, und regelt Übergänge für Unternehmen aus dem Vereinigten Königreich bei einem Austritt ohne Austrittsabkommen.
  "64n": Lässt die Erlaubnis für Unternehmen, die durch die erweiterte Definition der Finanzinstrumente am 1. Juni 2012 zum Finanzdienstleistungsinstitut wurden, bis zur Entscheidung der Bundesanstalt als vorläufig erteilt gelten, wenn sie bis zum 31. Dezember 2012 einen vollständigen Erlaubnisantrag stellten.
  "64r": Enthält Übergangsvorschriften zum CRD IV-Umsetzungsgesetz, darunter Bestandsschutz für Mandate von Geschäftsleitern und Mitgliedern von Verwaltungs- und Aufsichtsorganen, die am 31. Dezember 2013 bereits bestanden; die meisten Absätze sind weggefallen.
  "64w": Weggefallen.
  "64x": Lässt die Erlaubnis für den Betrieb eines organisierten Handelssystems für CRR-Kreditinstitute und Betreiber multilateraler Handelssysteme am 3. Januar 2018 als erteilt gelten und für neu erfasste Unternehmen als vorläufig erteilt, wenn sie bis zum 2. Juli 2018 einen vollständigen Antrag stellten.
  "64y": Weggefallen.
  "65": Erlaubt Unternehmen mit Erlaubnis für das Kryptoverwahrgeschäft am 10. Juni 2021, auch private kryptografische Schlüssel für Kryptowertpapiere zu sichern, und lässt die Erlaubnis für die Kryptowertpapierregisterführung unter Bedingungen als vorläufig erteilt gelten.
  "65a": Lässt für Institute mit Erlaubnis für das Kryptoverwahrgeschäft am 29. Dezember 2024 die Erlaubnis für das qualifizierte Kryptoverwahrgeschäft als erteilt gelten und regelt den Anwendungsbeginn einzelner Vorschriften, darunter die Meldeanforderungen nach der Verordnung (EU) 2022/2554 ab dem 17. Januar 2025.
en:
  "1":
    title: "Definitions; authorisation to issue ordinances"
    summary: "Defines credit institutions, financial services institutions, financial enterprises and other key terms and authorises BaFin to designate further undertakings as financial enterprises."
  "1a":
    title: "Application of Directive 2013/36/EU and Regulations (EU) No 575/2013, (EC) No 1060/2009, (EU) 2015/534 and (EU) 2017/2402 to credit and financial services institutions"
    summary: "Governs the application of Directive 2013/36/EU and Regulations (EU) No 575/2013, (EC) No 1060/2009, (EU) 2015/534 and (EU) 2017/2402 to institutions that are not CRR credit institutions."
  "1b":
    title: "Unreliability of sanctioned persons"
    summary: "Sets out when a natural or legal person is deemed unreliable, in particular where it is subject to European Union sanctions."
  "2":
    title: "Exemptions"
    summary: "Exempts certain bodies from the definition of a credit institution, in particular the Deutsche Bundesbank, the KfW, social security institutions and other special institutions, as well as undertakings that conduct only certain banking business."
  "2a":
    title: "Exemptions for group institutions and institutions belonging to institutional protection schemes"
    summary: "Governs applications to the supervisory authority for waivers under Articles 7 and 8 of Regulation (EU) No 575/2013 and waivers from the requirements for the risk control function."
  "2b":
    title: "Legal form"
    summary: "Prohibits credit institutions requiring authorisation and factoring and finance leasing undertakings from being operated as sole proprietorships."
  "2c":
    title: "Holders of qualifying holdings"
    summary: "Requires proposed acquirers to notify BaFin and the Deutsche Bundesbank in advance of the intended acquisition or increase of a qualifying holding in an institution and allows BaFin to prohibit the acquisition."
  "2d":
    title: "Management bodies of financial holding companies and mixed financial holding companies"
    summary: "Requires the managers of financial holding companies and mixed financial holding companies to be reliable, professionally qualified and able to devote sufficient time to their duties."
  "2e":
    title: "Exemptions for mixed financial holding companies"
    summary: "Allows the supervisory authority to apply to mixed financial holding companies subject to equivalent rules only the relevant provisions of one of the directives concerned."
  "2f":
    title: "Approval of financial holding companies and mixed financial holding companies; authorisation to issue ordinances"
    summary: "Requires parent financial holding companies and parent mixed financial holding companies, and their subsidiaries, to obtain written approval from the supervisory authority."
  "2g":
    title: "Establishment of an intermediate EU parent undertaking where the parent undertaking is established in a third country; authorisation to issue ordinances"
    summary: "Requires CRR credit institutions and investment firms in the European Economic Area with the same third-country parent to establish an intermediate EU parent undertaking where the third-country group holds assets of more than EUR 40 billion in the European Economic Area."
  "2h":
    title: "Acquisition of a significant holding"
    summary: "Requires CRR credit institutions to notify the supervisory authority and the Deutsche Bundesbank before acquiring a significant holding."
  "2i":
    title: "Mergers and divisions"
    summary: "Requires CRR credit institutions, financial holding companies and mixed financial holding companies to notify the supervisory authority and the Deutsche Bundesbank of certain information on planned mergers or divisions."
  "3":
    title: "Prohibited business"
    summary: "Prohibits company savings schemes, special-purpose savings undertakings other than building societies and credit and deposit business without the option of cash withdrawal, and prohibits large CRR credit institutions and their groups above certain thresholds from conducting certain high-risk business."
  "4":
    title: "Decision of the Federal Financial Supervisory Authority"
    summary: "Provides that BaFin decides in cases of doubt whether an undertaking is subject to this Act and that its decisions bind the administrative authorities."
  "5":
    title: "Electronic communication; authorisation to issue ordinances"
    summary: "Authorises the Federal Ministry of Finance to lay down rules by ordinance on electronic communication and access to electronic procedures."
  "6":
    title: "Tasks"
    summary: "Governs BaFin's supervision of institutions and central counterparties and its role as competent authority under various EU acts."
  "6a":
    title: "Special tasks"
    summary: "Allows BaFin, where terrorist financing is suspected, to issue instructions, prohibit dispositions and prohibit financial transactions."
  "6b":
    title: "Supervisory review and evaluation"
    summary: "Requires the supervisory authority to review and evaluate an institution's arrangements, strategies, procedures and processes and its risks, including by means of stress tests."
  "6c":
    title: "Additional own funds requirements"
    summary: "Governs additional own funds requirements for institutions and groups where the supervisory authority finds that risks are not or not sufficiently covered by existing rules."
  "6d":
    title: "Own funds guidance"
    summary: "Governs how the supervisory authority sets own funds guidance based on the own funds requirements and the appropriate overall level of own funds."
  "7":
    title: "Cooperation with the Deutsche Bundesbank"
    summary: "Governs cooperation between BaFin and the Deutsche Bundesbank, in particular the ongoing monitoring of institutions by the Deutsche Bundesbank."
  "7a":
    title: "Cooperation with the European Commission"
    summary: "Requires BaFin to inform the European Commission of certain events, such as the lapse or revocation of authorisations."
  "7b":
    title: "Cooperation with the European Banking Authority, the European Securities and Markets Authority and the European Insurance and Occupational Pensions Authority"
    summary: "Governs BaFin's cooperation with the European Banking Authority, the European Securities and Markets Authority and the European Insurance and Occupational Pensions Authority."
  "7c":
    title: "(repealed)"
    summary: "Repealed."
  "7d":
    title: "Cooperation with the European Systemic Risk Board"
    summary: "Governs BaFin's cooperation with the European Systemic Risk Board and the reporting of certain changes and information to it."
  "8":
    title: "Cooperation with other bodies"
    summary: "Governs BaFin's cooperation with other bodies, such as notifications by the tax authorities about tax criminal proceedings and the exchange of information with competent bodies in the European Economic Area and in third countries."
  "8a":
    title: "Special tasks in consolidated supervision"
    summary: "Governs BaFin's special tasks in the consolidated supervision of groups of institutions, financial holding groups or mixed financial holding groups with an EU parent undertaking."
  "8b":
    title: "Competence for consolidated supervision"
    summary: "Governs BaFin's competence for the consolidated supervision of certain groups where the parent undertaking meets certain criteria and BaFin supervises at individual institution level."
  "8c":
    title: "Transfer of competence for the supervision of groups of institutions, financial holding groups, mixed financial holding groups and group institutions"
    summary: "Governs the transfer of competence for the supervision of groups of institutions, financial holding groups, mixed financial holding groups and group institutions to another competent body in the European Economic Area."
  "8d":
    title: "(repealed)"
    summary: "Repealed."
  "8e":
    title: "Colleges of supervisors"
    summary: "Governs the establishment of colleges of supervisors to coordinate the supervision of groups of institutions, financial holding groups or mixed financial holding groups and to ensure cooperation with competent bodies in the European Economic Area and in third countries."
  "8f":
    title: "Cooperation in the supervision of significant branches"
    summary: "Governs the classification of branches as significant and cooperation with the host state authorities in supervising them."
  "8g":
    title: "Cooperation in the supervision of branches and credit institutions belonging to the same third-country group"
    summary: "Requires BaFin to exchange with other competent authorities in the European Economic Area all information needed to prevent circumvention of the requirements for third-country groups."
  "8h":
    title: "Cooperation with resolution authorities"
    summary: "Requires the supervisory authority to inform the resolution authorities of additional own funds requirements and own funds guidance for CRR credit institutions."
  "9":
    title: "Duty of confidentiality"
    summary: "Requires persons employed at BaFin and the Deutsche Bundesbank and other persons engaged by them not to disclose or use confidential facts without authorisation."
  "10":
    title: "Supplementary own funds requirements for institutions, groups of institutions, financial holding groups and mixed financial holding groups; authorisation to issue ordinances"
    summary: "Authorises the Federal Ministry of Finance to lay down detailed rules by ordinance on the adequate own funds of institutions, groups of institutions, financial holding groups and mixed financial holding groups."
  "10a":
    title: "Determination of the own funds of groups of institutions, financial holding groups and mixed financial holding groups; authorisation to issue ordinances"
    summary: "Governs how the own funds of groups of institutions, financial holding groups and mixed financial holding groups are determined and authorises the Federal Ministry of Finance to issue ordinances."
  "10b":
    title: "Relationship between capital buffer requirements, other capital requirements and own funds guidance"
    summary: "Provides that institutions may not use Common Equity Tier 1 capital needed to meet other capital requirements and own funds guidance to meet capital buffer requirements."
  "10c":
    title: "Capital conservation buffer"
    summary: "Requires institutions to maintain a capital conservation buffer of Common Equity Tier 1 capital equal to 2.5 percent of the total risk exposure amount."
  "10d":
    title: "Countercyclical capital buffer"
    summary: "Requires institutions to maintain an institution-specific countercyclical capital buffer of Common Equity Tier 1 capital."
  "10e":
    title: "Systemic risk buffer"
    summary: "Allows BaFin to require all or certain institutions to maintain a systemic risk buffer of Common Equity Tier 1 capital."
  "10f":
    title: "Buffer for global systemically important institutions"
    summary: "Requires global systemically important institutions to maintain a buffer of Common Equity Tier 1 capital on a consolidated basis, the rate of which BaFin sets and reviews annually."
  "10g":
    title: "Buffer for other systemically important institutions"
    summary: "Provides that BaFin may require another systemically important institution to maintain a buffer of Common Equity Tier 1 capital of up to 3 percent of the total risk exposure amount."
  "10h":
    title: "Interaction of the systemic risk buffer and the buffers for global and other systemically important institutions"
    summary: "Governs compliance with the buffers for global systemically important institutions, other systemically important institutions and systemic risk, and how these buffers are combined."
  "10i":
    title: "Combined buffer requirement"
    summary: "Defines the combined buffer requirement as the total Common Equity Tier 1 capital required for the capital conservation buffer, the countercyclical capital buffer and the buffers for systemic risk and systemically important institutions."
  "10j":
    title: "Leverage ratio buffer requirement"
    summary: "Requires global systemically important institutions to maintain an additional leverage ratio buffer of Tier 1 capital."
  "11":
    title: "Liquidity; authorisation to issue ordinances"
    summary: "Lays down liquidity requirements for institutions and authorises the Federal Ministry of Finance to specify details by ordinance in consultation with the Deutsche Bundesbank."
  "12":
    title: "Potentially systemically important institutions"
    summary: "Requires the supervisory authority to determine annually, in agreement with the Deutsche Bundesbank, which institutions and companies are potentially systemically important."
  "12a":
    title: "Establishment of corporate relationships"
    summary: "Requires institutions and financial holding companies acquiring holdings in foreign undertakings to ensure that they receive the information needed for consolidation under section 10a."
  "13":
    title: "Large exposures; authorisation to issue ordinances"
    summary: "Requires a unanimous resolution of all managers for large exposures and authorises the Federal Ministry of Finance to lay down detailed rules, for instance on the large exposure reporting procedure."
  "13c":
    title: "Intragroup transactions with mixed holding companies"
    summary: "Requires CRR credit institutions to notify significant intragroup transactions with mixed holding companies to the supervisory authority, the Deutsche Bundesbank and, where applicable, BaFin."
  "13d":
    title: "(repealed)"
    summary: "Repealed."
  "14":
    title: "Loans of EUR 1 million or more"
    summary: "Requires credit institutions and other financial institutions to report borrowers with loans of EUR 1 million or more quarterly to the central credit register of the Deutsche Bundesbank."
  "15":
    title: "Transactions with related parties"
    summary: "Governs loans to persons and undertakings with close links to the institution's bodies and requires a unanimous decision of the managers and the consent of the supervisory body."
  "16":
    summary: "Repealed."
  "17":
    title: "Liability"
    summary: "Governs the liability of managers and members of the supervisory body for breaches of duty in connection with lending and the limitation period for claims."
  "18":
    title: "Credit documentation"
    summary: "Requires credit institutions, before granting loans of more than EUR 1.5 million or 10 percent of Tier 1 capital, to have the borrower disclose its financial circumstances."
  "18a":
    title: "Consumer credit and financial accommodation for consideration; authorisation to issue ordinances"
    summary: "Requires credit institutions to assess the borrower's creditworthiness before concluding a consumer credit agreement and to conclude the agreement only if the assessment is positive."
  "19":
    title: "Definition of credit for section 14 and of borrower for sections 14, 15 and 18"
    summary: "Defines credit for the purposes of section 14 and borrower for the purposes of sections 14, 15 and 18."
  "20":
    title: "Exemptions from the obligations under section 14"
    summary: "Excludes certain transactions from the definition of credit for loans of EUR 1 million or more, such as foreign exchange and securities transactions settled at short notice and claims arising from payment transactions."
  "21":
    title: "Definition of credit for sections 15 to 18"
    summary: "Defines credit for the purposes of sections 15 to 18, lists the types of credit and sets out the exceptions."
  "22":
    title: "Authorisation to issue ordinances on loans of EUR 1 million or more"
    summary: "Authorises the Federal Ministry of Finance to lay down detailed rules by ordinance on loans of EUR 1 million or more in consultation with the Deutsche Bundesbank."
  "22a":
    title: "Undertaking keeping the register"
    summary: "Governs the entry of claims and land charges in a refinancing register kept by the refinancing undertaking where another undertaking is entitled to their transfer."
  "22b":
    title: "Keeping the refinancing register for third parties"
    summary: "Governs the keeping of a refinancing register for third parties by a domestic credit institution or the KfW where the refinancing undertaking is not a credit institution or one of the bodies named."
  "22c":
    title: "Refinancing intermediaries"
    summary: "Declares sections 22d to 22o applicable mutatis mutandis to refinancing registers kept by or for a refinancing intermediary."
  "22d":
    title: "Refinancing register; authorisation to issue ordinances"
    summary: "Provides that the Federal Ministry of Finance lays down by ordinance the form and manner of entries in the refinancing register."
  "22e":
    title: "Appointment of the administrator"
    summary: "Governs the appointment and tasks of the administrator of the refinancing register, the appointment of a deputy and the liability of the administrator and the deputy."
  "22f":
    title: "Relationship between the administrator and BaFin"
    summary: "Requires the administrator to provide information to BaFin and to notify it where the register is suspected of not being kept properly."
  "22g":
    title: "Tasks of the administrator"
    summary: "Governs the tasks of the administrator of the refinancing register, in particular compliance with the structure rules, the accuracy of time entries and the prohibition on later changes to entries."
  "22h":
    title: "Relationship between the administrator, the undertaking keeping the register and the refinancing undertaking"
    summary: "Gives the administrator the right to inspect the books of the undertaking keeping the register and binds the administrator to confidentiality about facts learned in doing so."
  "22i":
    title: "Remuneration of the administrator"
    summary: "Governs the remuneration of the administrator and the deputy by the undertaking keeping the register and the reimbursement of necessary expenses."
  "22j":
    title: "Effects of entry in the refinancing register"
    summary: "Governs the separation of assets of the refinancing undertaking in insolvency and the right of the person entitled to transfer to object to enforcement measures."
  "22k":
    title: "Termination and transfer of register keeping"
    summary: "Governs the termination and transfer of register keeping with the consent of the persons entitled to transfer and under BaFin's supervision."
  "22l":
    title: "Appointment of a trustee on the opening of insolvency proceedings"
    summary: "Governs the appointment of a trustee for the refinancing register by the insolvency court on application by BaFin when insolvency proceedings are opened over an undertaking's assets."
  "22m":
    title: "Publication of the trustee's appointment"
    summary: "Requires the insolvency court to notify the register court of the appointment and dismissal of the trustee and to publish them."
  "22n":
    title: "Tasks and legal position of the trustee"
    summary: "Requires the trustee to carry out the legal acts needed to complete the transfer of the assets entered in the register and to manage those assets until then."
  "22o":
    title: "Appointment of a trustee in case of risk of insolvency"
    summary: "Governs the appointment of a trustee by the court on application by BaFin where there is a risk of insolvency, and the trustee's legal position and competences."
  "22p":
    title: "(repealed)"
    summary: "Repealed."
  "23":
    title: "Advertising"
    summary: "Allows BaFin to prohibit certain types of advertising by institutions, for instance where advertising for consumer credit creates false expectations."
  "23a":
    title: "Protection scheme"
    summary: "Requires institutions to inform customers about their membership of a protection scheme and the coverage limits."
  "24":
    title: "Notifications; authorisation to issue ordinances"
    summary: "Requires institutions to notify without delay certain events, such as the appointment or departure of managers, changes of legal form, losses of Tier 1 capital or qualifying holdings."
  "24a":
    title: "Establishment of a branch and cross-border provision of services in other states of the European Economic Area"
    summary: "Requires CRR credit institutions to notify BaFin and the Deutsche Bundesbank without delay of their intention to establish a branch in another state of the European Economic Area or to use tied agents established or habitually resident there."
  "24b":
    title: "Participation in payment and securities settlement systems and interoperable systems"
    summary: "Requires an institution to inform BaFin and the Deutsche Bundesbank without delay of its intention to operate a payment or securities settlement system, of its participants and of arrangements on interoperable systems."
  "24c":
    title: "Automated retrieval of account information"
    summary: "Requires credit institutions to keep a file system of account and securities account master data from which BaFin can retrieve data automatically."
  "25":
    title: "Financial information, information on risk-bearing capacity and liquidity management, funding plans; authorisation to issue ordinances"
    summary: "Requires institutions to submit financial information, information on risk-bearing capacity and liquidity management and funding plans without delay after the end of each quarter or annually."
  "25a":
    title: "Special organisational obligations, rules for risk takers; authorisation to issue ordinances"
    summary: "Requires institutions to have a proper business organisation, including strategies, risk management procedures, internal control systems and an independent internal audit function."
  "25b":
    title: "Outsourcing of activities and processes; authorisation to issue ordinances"
    summary: "Requires institutions outsourcing activities and processes to take appropriate measures to avoid excessive additional risks and to ensure the proper conduct of business and risk management."
  "25c":
    title: "Managers"
    summary: "Requires managers to be professionally qualified and reliable and to have sufficient knowledge, experience and time for their duties, and requires that persons not meeting these conditions are not appointed or kept as managers."
  "25d":
    title: "Administrative or supervisory body"
    summary: "Requires members of the administrative or supervisory body to be reliable, to have the necessary expertise and to devote sufficient time to their duties."
  "25e":
    title: "Requirements for key function holders and tied agents"
    summary: "Requires key function holders to be professionally qualified and reliable and requires undertakings to ensure that key functions are performed properly."
  "25f":
    title: "Special requirements for the proper business organisation of CRR credit institutions and of groups of institutions, financial holding groups and mixed financial holding groups that include a CRR credit institution; authorisation to issue ordinances"
    summary: "Requires CRR credit institutions and their groups to conduct the business prohibited under section 3(2) and (4) only in an economically, organisationally and legally separate financial trading institution that funds itself independently."
  "25g":
    title: "Compliance with special organisational obligations in cashless payment transactions"
    summary: "Places credit institutions' compliance with EU rules on cashless payment transactions, such as transfers of funds and cross-border payments, under BaFin's supervision."
  "25h":
    title: "Internal safeguards"
    summary: "Requires institutions, financial holding companies and mixed financial holding companies to have appropriate safeguards and risk management to prevent criminal acts."
  "25i":
    title: "General due diligence obligations in relation to electronic money"
    summary: "Requires credit institutions issuing electronic money to perform the general due diligence obligations of the Money Laundering Act even below the thresholds, with exceptions for small amounts."
  "25j":
    title: "Timing of identity verification"
    summary: "Allows identity verification to be completed without delay after an account or securities account has been opened, provided no funds can be withdrawn until then."
  "25k":
    title: "Enhanced due diligence obligations"
    summary: "Requires institutions to apply due diligence to currency exchange transactions of EUR 2,500 or more not settled through a customer account, and factoring institutions to take measures against increased money laundering risks."
  "25l":
    title: "Anti-money laundering obligations for financial holding companies"
    summary: "Subjects financial holding companies and mixed financial holding companies approved under section 2f to the obligations of the Money Laundering Act and to BaFin's anti-money laundering supervision."
  "25m":
    title: "Prohibited business"
    summary: "Prohibits business relationships with shell banks and keeping accounts in the institution's name or for other institutions that their customers can use independently."
  "26":
    title: "Submission of annual accounts, management report and audit reports"
    summary: "Requires institutions to prepare their annual accounts within the first three months of the financial year and submit them with the management report to BaFin and the Deutsche Bundesbank, and requires the auditor to submit the audit report."
  "26a":
    title: "Disclosure by institutions"
    summary: "Requires CRR credit institutions to disclose additional information in their annual accounts on the legal and organisational structure and governance of the group and on their establishments."
  "26b":
    title: "Segregation of assets"
    summary: "Governs the segregation of customer assets from the institution's assets and the custody of crypto instruments and private keys."
  "26c":
    title: "ESG risks in risk management"
    summary: "Requires institutions to take ESG risks into account in risk management, to draw up an ESG risk plan, to review and adjust strategies and processes regularly and to consider ESG risks in procedures, staffing and remuneration systems."
  "26d":
    title: "ESG risk plan"
    summary: "Requires managers to have an ESG risk plan drawn up to monitor and manage financial risks arising from environmental, social and governance factors, with targets and processes."
  "27":
    summary: "Repealed."
  "28":
    title: "Appointment of the auditor in special cases"
    summary: "Requires institutions to notify the appointed auditor and allows BaFin to require the appointment of a different auditor within two months, for instance after eleven consecutive years with the same auditor."
  "29":
    title: "Special duties of the auditor"
    summary: "Requires the auditor, when auditing the annual accounts, also to examine the institution's financial situation and compliance with certain notification obligations and supervisory requirements."
  "30":
    title: "Determination of audit content"
    summary: "Provides that BaFin may set the content of the audit vis-à-vis the institution, which the auditor must take into account in the annual audit."
  "31":
    title: "Exemptions; authorisation to issue ordinances"
    summary: "Authorises the Federal Ministry of Finance to exempt institutions or groups of institutions by ordinance from certain obligations under sections 14, 24, 25, 26 and 29."
  "32":
    title: "Authorisation"
    summary: "Requires undertakings that wish to conduct banking business or provide financial services in Germany commercially or on a scale requiring a commercial business organisation to obtain written or electronic authorisation from the supervisory authority."
  "33":
    title: "Refusal of authorisation"
    summary: "Lists the grounds for refusing authorisation, such as insufficient initial capital or managers or holders of qualifying holdings who are unreliable or not professionally qualified."
  "33a":
    title: "Suspension or restriction of authorisation for undertakings established outside the European Union"
    summary: "Governs the suspension or restriction of authorisation for undertakings established outside the European Union on the basis of a decision of the Council or the European Commission."
  "33b":
    title: "Consultation of the competent bodies of another state of the European Economic Area"
    summary: "Requires the supervisory authority to consult the competent bodies of other states of the European Economic Area before authorising subsidiaries or sister undertakings of their CRR credit institutions, market operators or direct insurers."
  "34":
    title: "Representation and continuation in the event of death"
    summary: "Governs the continuation of institutions by representatives for up to one year after the death of the authorisation holder and the appointment of and requirements for representatives."
  "35":
    title: "Lapse and revocation of authorisation"
    summary: "Governs the lapse of authorisation, for instance if it is not used for a year, and its revocation by the supervisory authority, for instance where creditors are at risk or in case of serious breaches."
  "36":
    title: "Measures against managers and members of the administrative or supervisory body"
    summary: "Allows BaFin, instead of revoking authorisation, to require the dismissal of responsible managers and prohibit them from acting, and governs measures against members of the administrative or supervisory body."
  "36a":
    title: "Prohibition of activity for natural persons"
    summary: "Allows the supervisory authority to prohibit a natural person responsible for certain breaches temporarily, for up to two years, from acting as manager of an institution."
  "37":
    title: "Action against unauthorised or prohibited business"
    summary: "Governs BaFin's power to order the undertaking and its bodies to cease business and wind up unauthorised or prohibited business."
  "38":
    title: "Consequences of revocation and lapse of authorisation, measures in winding up"
    summary: "Governs the winding up of institutions after revocation or lapse of authorisation and the appointment of a liquidator by BaFin."
  "39":
    title: "Designations \"Bank\" and \"Bankier\""
    summary: "Governs the use of the designations \"Bank\" and \"Bankier\" by credit institutions and other undertakings and restricts the designation \"Volksbank\" to registered cooperatives."
  "40":
    title: "Designation \"Sparkasse\""
    summary: "Governs the use of the designation \"Sparkasse\" by public-law savings banks, certain other undertakings and undertakings newly created by conversion."
  "41":
    title: "Exemptions"
    summary: "Exempts undertakings whose use of the words bank or savings bank does not suggest banking business from sections 39 and 40 and allows foreign credit institutions to use protected designations with a reference to their home state."
  "42":
    title: "Decision of BaFin"
    summary: "Provides that BaFin decides in cases of doubt whether an undertaking may use certain designations and informs the register court."
  "43":
    title: "Register provisions"
    summary: "Sets out the conditions for entries in public registers for banking business or financial services requiring authorisation and requires proof of authorisation to be provided to the register court."
  "44":
    title: "Information and audits of institutions, ancillary services undertakings, financial holding companies, mixed financial holding companies and other undertakings"
    summary: "Requires institutions, superordinate undertakings, outsourcing providers and their board members and employees to provide information and documents to BaFin and the Deutsche Bundesbank on request and to make copies where needed."
  "44a":
    title: "Cross-border information and audits"
    summary: "Governs the transfer of data between certain financial institutions and undertakings abroad to comply with supervisory rules and the audit of such data at the request of a supervisory authority of another EEA state."
  "44b":
    title: "Information and audits concerning holders of qualifying holdings"
    summary: "Governs the obligations of holders of qualifying holdings and certain affiliated undertakings to provide information and documents to BaFin and the Deutsche Bundesbank."
  "44c":
    title: "Pursuit of unauthorised banking business and financial services"
    summary: "Requires undertakings, their bodies, employees and other undertakings involved to provide information and documents to BaFin and the Deutsche Bundesbank on request where facts suggest that unauthorised banking business or financial services are being conducted."
  "45":
    title: "Measures to ensure continuous compliance with regulatory requirements"
    summary: "Governs the measures the supervisory authority can order to ensure that institutions continuously meet regulatory requirements where their development or other circumstances indicate that they will not."
  "45a":
    title: "Measures against financial holding companies and mixed financial holding companies"
    summary: "Allows BaFin to prohibit financial holding companies at the head of a group from exercising their voting rights, for instance where they do not provide the information needed for consolidation."
  "45b":
    title: "Measures in case of organisational deficiencies"
    summary: "Governs the measures the supervisory authority can order where an institution lacks a proper business organisation, in particular to reduce risks, restrict branches and limit certain types of business."
  "45c":
    title: "Special representative"
    summary: "Allows the supervisory authority to entrust an independent, reliable and suitable special representative with tasks and powers at an institution."
  "46":
    title: "Measures in case of danger"
    summary: "Allows the supervisory authority to take interim measures where an institution's ability to meet its obligations is at risk."
  "46a":
    title: "Power to prohibit and order the use of external ratings"
    summary: "Allows the supervisory authority to prohibit institutions from using ratings of unregistered rating agencies outside the European Economic Area and to issue orders against excessive reliance on external ratings."
  "46b":
    title: "Insolvency petition"
    summary: "Requires the managers and, for sole proprietor institutions, the owner to notify BaFin without delay of insolvency, over-indebtedness or impending insolvency and to submit the relevant documents."
  "46c":
    title: "Insolvency law time limits and liability"
    summary: "Moves the start of insolvency law time limits to the day of a measure under section 46, presumes certain payments made afterwards to be permissible and sets the standard of care for BaFin's actions."
  "46d":
    title: "Informing the other states of the European Economic Area about reorganisation measures"
    summary: "Requires BaFin to inform the competent authorities of the other states of the European Economic Area before taking reorganisation measures against CRR credit institutions."
  "46e":
    title: "Insolvency proceedings in the states of the European Economic Area"
    summary: "Governs jurisdiction for opening insolvency proceedings over the assets of CRR credit institutions in the European Economic Area and the recognition of such proceedings."
  "46f":
    title: "Informing creditors in insolvency proceedings and ranking in insolvency"
    summary: "Governs informing creditors by means of a form in all official languages of the European Economic Area and the ranking of certain claims in insolvency proceedings over an institution."
  "46g":
    title: "Moratorium, suspension of banking and stock exchange business"
    summary: "Allows the Federal Government, where serious dangers to the economy as a whole are imminent, to order a moratorium for a credit institution by ordinance and to suspend banking and stock exchange business temporarily."
  "46h":
    title: "Resumption of banking and stock exchange business"
    summary: "Allows the Federal Government to regulate by ordinance the resumption of payment and stock exchange business after a temporary closure, including temporary restrictions on payouts."
  "46i":
    title: "Allocation of crypto instruments held in custody; costs of separation"
    summary: "Provides that crypto instruments held in custody belong to the customer unless consent has been given to dispositions for the account of the institution or third parties."
  "47":
    title: "Power to issue orders under Regulation (EU) No 1286/2014"
    summary: "Governs BaFin's power to issue orders to institutions that advise on, sell or manufacture PRIIPs where they breach requirements of Regulation (EU) No 1286/2014."
  "47a":
    title: "Special powers under Regulation (EU) 2022/2554"
    summary: "Governs BaFin's powers to issue orders and conduct investigations in case of breaches of Regulation (EU) 2022/2554, and the questioning of board members."
  "48":
    title: "Measures in case of breaches of Regulation (EU) 2017/2402"
    summary: "Allows the supervisory authority, in case of breaches of the Securitisation Regulation (EU) 2017/2402, to order the breaches to cease and to take further measures, for instance for securitisations wrongly labelled as STS."
  "48a":
    title: "Measures in case of a risk of excessive concentration of exposures to a central counterparty"
    summary: "Allows BaFin, where there is a risk of excessive concentration of exposures to a central counterparty, to instruct managers to reduce the exposures or reallocate them through clearing accounts."
  "48t":
    title: "Measures to limit macroprudential or systemic risks"
    summary: "Governs measures by BaFin that deviate from requirements of Regulation (EU) No 575/2013 to limit macroprudential or systemic risks where other macroprudential instruments are not effective enough."
  "48u":
    title: "Measures to limit macroprudential risks in lending for the construction or acquisition of residential property; authorisation to issue ordinances"
    summary: "Allows BaFin to set restrictions on loans for the construction or acquisition of residential property by general administrative act where this is necessary to avert dangers to financial stability."
  "49":
    title: "Immediate enforceability"
    summary: "Provides that objections and actions for annulment against certain measures of BaFin have no suspensive effect."
  "50":
    title: "Periodic penalty payments"
    summary: "Allows BaFin to impose periodic penalty payments on undertakings and responsible persons such as managers and board members in case of continuing breaches."
  "51":
    title: "Levy and costs"
    summary: "Requires institutions to reimburse 90 percent of the costs of supervision to the Federal Government, apportioned according to the scale of their business."
  "51a":
    title: "Own funds requirements for housing companies with savings facilities"
    summary: "Lays down requirements for the adequate own funds of housing companies with savings facilities and authorises the Federal Ministry of Finance to issue detailed rules on solvency."
  "51b":
    title: "Liquidity requirements for housing companies with savings facilities"
    summary: "Lays down liquidity requirements for housing companies with savings facilities and governs the treatment of rental payments as liquidity inflows."
  "51c":
    title: "Other special provisions for housing companies with savings facilities"
    summary: "Governs the deposit business of housing companies with savings facilities and restricts it to members of the cooperative and their relatives."
  "52":
    title: "Special supervision"
    summary: "Allows other state supervision of institutions to exist alongside BaFin's supervision."
  "52a":
    title: "Limitation of claims against board members of credit institutions"
    summary: "Sets a ten-year limitation period for claims of credit institutions against managers and members of the supervisory or administrative body arising from their office or employment for breaches of the duty of care."
  "53":
    title: "Branches of undertakings established abroad; authorisation to issue ordinances"
    summary: "Provides that domestic branches of foreign undertakings conducting banking business or providing financial services are deemed credit institutions or financial services institutions."
  "53a":
    title: "Representative offices of institutions established abroad"
    summary: "Governs the establishment and operation of representative offices in Germany by institutions established abroad and the requirement to notify them to BaFin and the Deutsche Bundesbank, which confirm receipt."
  "53b":
    title: "Undertakings established in another state of the European Economic Area"
    summary: "Sets out the conditions under which a CRR credit institution established in another state of the European Economic Area may conduct banking business or provide financial services in Germany without authorisation from the supervisory authority."
  "53c":
    title: "Special requirements for CRD third-country branches"
    summary: "Determines when branches of third-country undertakings count as CRD third-country branches, to which the special rules of sections 53ca to 53cq apply."
  "53ca":
    title: "Classification of CRD third-country branches into risk classes"
    summary: "Governs the classification of CRD third-country branches into risk class 1 or 2 depending on whether certain conditions are met."
  "53cb":
    title: "Qualifying CRD third-country branches"
    summary: "Sets out the conditions for recognising a CRD third-country branch as qualifying, based on the supervisory standards, confidentiality rules and risk classification of the head undertaking's home state."
  "53cc":
    title: "Conditions for authorisation"
    summary: "Sets out the conditions for authorising a CRD third-country branch that wishes to provide services in Germany commercially or on a scale requiring a commercial business organisation."
  "53cd":
    title: "Grounds for refusal, lapse and revocation"
    summary: "Sets out the grounds on which authorisation is refused, lapses or is revoked, in particular where the conditions for authorisation are not met or supervisory requirements are not complied with."
  "53ce":
    title: "Capital endowment"
    summary: "Lays down the minimum capital endowment of CRD third-country branches depending on their risk class and their average liabilities over the three preceding reporting periods."
  "53cf":
    title: "Liquidity requirements"
    summary: "Subjects CRD third-country branches of risk class 1 to the liquidity requirements of Regulation (EU) No 575/2013 and requires those of risk class 2 to hold liquid assets covering outflows over at least 30 days."
  "53cg":
    title: "Internal governance and risk management"
    summary: "Requires CRD third-country branches to appoint two managers resident in Germany and, depending on the risk class, applies rules on internal governance and risk management."
  "53ch":
    title: "Booking and accounting rules"
    summary: "Requires a CRD third-country branch to keep separate books and to render accounts to BaFin and the Deutsche Bundesbank."
  "53ci":
    title: "Requirement to establish a subsidiary"
    summary: "Allows BaFin to require CRD third-country branches to establish a subsidiary requiring authorisation, for instance in case of cross-border activity or systemic importance."
  "53cj":
    title: "Assessment of systemic importance"
    summary: "Requires an assessment of the systemic importance of CRD third-country branches where their third-country group holds assets of EUR 40 billion or more in the European Union through such branches."
  "53ck":
    title: "Reporting obligations"
    summary: "Requires CRD third-country branches to report to the Deutsche Bundesbank certain information on assets, liabilities, compliance with rules and deposit guarantee schemes and information on their head undertaking."
  "53cl":
    title: "Reporting frequency"
    summary: "Provides that CRD third-country branches of risk class 1 report regulatory and financial information at least half-yearly and those of risk class 2 at least annually."
  "53cm":
    title: "Supervisory examination programme"
    summary: "Requires BaFin to supervise CRD third-country branches under Title VII of Directive 2013/36/EU and to include them in its supervisory planning."
  "53cn":
    title: "Supervisory review and evaluation"
    summary: "Governs BaFin's review and evaluation of the arrangements, strategies, procedures and mechanisms implemented by CRD third-country branches."
  "53co":
    title: "Supervisory measures"
    summary: "Requires BaFin to require CRD third-country branches at an early stage to take measures to comply with requirements and to cover material risks, such as a higher capital endowment."
  "53cp":
    title: "Cooperation and colleges of supervisors"
    summary: "Provides that BaFin cooperates with the competent supervisory authorities of the Member States and concludes written coordination and cooperation arrangements."
  "53cq":
    title: "Notification to the European Banking Authority"
    summary: "Declares section 2g(5) and section 7b(2) no. 1a applicable mutatis mutandis to CRD third-country branches."
  "53d":
    title: "Parent undertakings established in a third country"
    summary: "Requires the supervisory authority to assess whether a third country's consolidated supervision of parent undertakings of domestic CRR credit institutions and investment firms is equivalent."
  "53e":
    title: "Holders of qualifying holdings"
    summary: "Applies the rules on holders of qualifying holdings mutatis mutandis where BaFin is to end harmful influence on a central counterparty under Regulation (EU) No 648/2012."
  "53f":
    title: "Colleges of supervisors"
    summary: "Governs the exercise of votes by BaFin and the Deutsche Bundesbank and by the competent supervisory authorities of trading venues in the college of supervisors."
  "53g":
    title: "Financial resources of central counterparties"
    summary: "Allows BaFin to impose additional financial resource requirements on central counterparties to take account of risks and special business situations."
  "53h":
    title: "Liquidity"
    summary: "Allows BaFin, when assessing liquidity in individual cases, to order additional liquidity requirements for a central counterparty where this is necessary for its lasting liquidity."
  "53i":
    title: "Granting access under Articles 7 and 8 of Regulation (EU) No 648/2012"
    summary: "Requires a central counterparty to inform BaFin of applications for access under Articles 7 and 8 of Regulation (EU) No 648/2012."
  "53j":
    title: "Notifications; authorisation to issue ordinances"
    summary: "Requires a central counterparty to report monthly to BaFin and the Deutsche Bundesbank certain data on compliance with margin requirements, default funds, financial resources and other aspects of clearing."
  "53k":
    title: "Outsourcing of activities and processes"
    summary: "Declares section 25b(3), first and second sentences, and (4) applicable mutatis mutandis to outsourcing by central counterparties under Regulation (EU) No 648/2012."
  "53l":
    title: "Power to issue orders; measures in case of organisational deficiencies"
    summary: "Governs BaFin's power to issue orders to central counterparties in individual cases to ensure compliance with Regulation (EU) No 648/2012."
  "53m":
    title: "Content of the application for authorisation; request for documents; waiver of hearing"
    summary: "Governs the content of an application for authorisation as a central counterparty in Germany, the request for further documents and BaFin's waiver of a hearing."
  "53n":
    title: "Measures to improve the financial resources and liquidity of a central counterparty authorised under Regulation (EU) No 648/2012"
    summary: "Governs measures to improve the financial resources and liquidity of a central counterparty that cannot continuously meet the requirements of Regulation (EU) No 648/2012."
  "53o":
    title: "Applications under Regulation (EU) No 909/2014; duty of confidentiality"
    summary: "Governs the language of documents to be submitted to BaFin under Regulation (EU) No 909/2014, the electronic submission of applications and the application of the duty of confidentiality."
  "53p":
    title: "Power to issue orders for supervision under Regulation (EU) No 909/2014"
    summary: "Governs BaFin's power to issue orders to ensure compliance with Regulation (EU) No 909/2014 and the acts based on it."
  "53q":
    title: "Ownership rights in central securities depositories"
    summary: "Governs the duty to inform about transfers, acquisitions or disposals of ownership rights in central securities depositories and BaFin's power to prohibit the exercise of voting rights."
  "53r":
    title: "Competence"
    summary: "Governs BaFin's competence within the meaning of Article 12(1) to (3) of Regulation (EU) 2022/858."
  "53s":
    title: "Exemptions from the authorisation requirement under section 32"
    summary: "Exempts DLT market infrastructures with a specific permission and retail clients dealing on own account from the authorisation requirement under section 32."
  "53t":
    title: "DLT settlement systems and DLT trading and settlement systems"
    summary: "Applies the rules on central securities depositories also to certain DLT settlement systems and DLT trading and settlement systems."
  "53u":
    title: "Documents and applications under Regulation (EU) 2022/858"
    summary: "Governs the language of documents and the electronic submission to BaFin of applications under Regulation (EU) 2022/858."
  "53v":
    title: "Operators of regulated markets"
    summary: "Applies the provisions of this subdivision to operators of regulated markets that operate certain DLT trading systems."
  "54":
    title: "Prohibited business, acting without authorisation"
    summary: "Punishes with imprisonment of up to five years or a fine anyone who conducts business prohibited under section 3, conducts banking business or provides financial services without authorisation or provides clearing services without authorisation."
  "54a":
    title: "Criminal provisions"
    summary: "Punishes with imprisonment of up to five years or a fine anyone who, contrary to section 25c(4a) or (4b), fails to ensure the strategies, processes and procedures required there and thereby endangers the continued existence of the institution or the group."
  "55":
    title: "Breach of the duty to notify insolvency or over-indebtedness"
    summary: "Punishes with imprisonment of up to three years or a fine anyone who, contrary to section 46b(1), first sentence, also in conjunction with section 53b(3), first sentence, fails to make a notification, or makes it incorrectly, incompletely or late."
  "55a":
    title: "Unauthorised use of information on loans of EUR 1 million or more"
    summary: "Punishes with imprisonment of up to two years or a fine anyone who uses information on loans of EUR 1 million or more contrary to section 14(2), tenth sentence; the offence is prosecuted only on request."
  "55b":
    title: "Unauthorised disclosure of information on loans of EUR 1 million or more"
    summary: "Punishes the unauthorised disclosure of information on loans of EUR 1 million or more with imprisonment of up to one year or a fine."
  "56":
    title: "Provisions on fines"
    summary: "Lays down the administrative offences and fines for breaches of various statutory and regulatory provisions on banking."
  "57":
    title: "Provisions on fines"
    summary: "Punishes breaches of the obligations to keep crypto assets and private cryptographic keys separately and securely under section 26b with fines of up to EUR 500,000."
  "58":
    title: "(repealed)"
    summary: "Repealed."
  "59":
    title: "Fines against undertakings"
    summary: "Extends section 30 of the Administrative Offences Act to undertakings within the meaning of section 53b(1), first sentence, and (7), first sentence, that operate in Germany through a branch or cross-border."
  "60":
    title: "Competent administrative authority"
    summary: "Provides that BaFin is the administrative authority within the meaning of section 36(1) no. 1 of the Administrative Offences Act."
  "60a":
    title: "Participation of BaFin and notifications in criminal matters"
    summary: "Requires courts and prosecuting authorities, in criminal proceedings against owners, managers and board members of institutions and for offences under section 54, to send BaFin the indictment and further documents when public charges are brought."
  "60b":
    title: "Publication of measures"
    summary: "Requires BaFin to publish without delay on its website final measures and final decisions on fines for breaches of this Act or Regulation (EU) No 575/2013, stating the type and nature of the breach."
  "60c":
    title: "Publication of measures and sanctions for breaches of Regulation (EU) No 909/2014, Regulation (EU) 2015/2365, Regulation (EU) 2016/1011, Regulation (EU) 2017/2402 or Regulation (EU) 2022/2554"
    summary: "Requires BaFin to publish decisions on measures and sanctions on its website without delay after informing the person concerned."
  "60d":
    title: "Publication of measures and sanctions against investment services enterprises"
    summary: "Requires BaFin to publish on its website without delay decisions on measures and sanctions against investment services enterprises."
  "61":
    title: "Authorisation for existing credit institutions"
    summary: "Deems authorisation under section 32 to have been granted to credit institutions that were permitted to conduct banking business within the scope of section 1(1) when this Act entered into force."
  "62":
    title: "Transitional provisions"
    summary: "Maintains existing legal provisions and orders in the field of banking unless this Act conflicts with them and transfers the tasks of the former banking supervisory authority to BaFin."
  "63":
    summary: "Concerned the repeal and amendment of legal provisions; the text is not reproduced."
  "63a":
    title: "Special provisions for the territory referred to in Article 3 of the Unification Treaty"
    summary: "Deems authorisation to have been granted to credit institutions established in the GDR that were permitted to conduct banking business on 1 July 1990 and allows BaFin to exempt credit institutions in the territory referred to in Article 3 of the Unification Treaty from obligations under this Act."
  "64":
    title: "Successor undertaking of the Deutsche Bundespost"
    summary: "Deems authorisation to have been granted to the successor undertaking of the Deutsche Bundespost POSTBANK from 1 January 1995 and disregarded certain holdings until 31 December 2002."
  "64a":
    title: "Transitional provision on the Risk Reduction Act"
    summary: "Allowed financial holding companies existing on 27 June 2019 to apply for approval under section 2f until 28 June 2021 and governs the supervisory authority's powers during the transition and where no application is made."
  "64b":
    title: "Transitional provision on section 24(1d)"
    summary: "Provides that the notification obligation under section 24(1d) must be met for the first time for the reporting date of 31 December 2023."
  "64c":
    title: "Transitional provisions on the Act implementing the Banking Directive and reducing bureaucracy"
    summary: "Contains transitional provisions on the Act implementing the Banking Directive and reducing bureaucracy, including grandfathering of mandates of managers of approved financial holding companies held on 31 December 2025 and the date from which new notification deadlines apply."
  "64d":
    title: "(repealed)"
    summary: "Repealed."
  "64e":
    title: "Transitional provisions on the Sixth Act amending the Banking Act"
    summary: "Governs the recognition of authorisations of credit institutions and financial services institutions on 1 January 1998, notification obligations and initial capital requirements."
  "64f":
    title: "Transitional provisions on the Fourth Financial Market Promotion Act"
    summary: "Deems authorisation for credit card business to have been granted to credit institutions authorised as deposit-taking credit institutions on 1 July 2002."
  "64g":
    title: "Transitional provisions on the Act implementing the Financial Conglomerates Directive"
    summary: "Requires, until the ordinance under section 13c is issued, that significant intragroup transactions with mixed holding companies or their subsidiaries in a calendar year be notified to BaFin and the Deutsche Bundesbank before 16 January of the following year."
  "64h":
    title: "Transitional provisions on the Act implementing the recast Banking Directive and the recast Capital Adequacy Directive"
    summary: "Allows institutions to process personal data collected before 1 January 2007 in accordance with section 10(2); the other transitional provisions have been repealed or have expired."
  "64i":
    title: "Transitional provisions on the Act implementing the Markets in Financial Instruments Directive"
    summary: "Deems authorisation for investment advice and other activities newly regulated by the Act implementing the Markets in Financial Instruments Directive to have been granted or provisionally granted to undertakings authorised on 1 November 2007."
  "64j":
    title: "Transitional provisions on the Annual Tax Act 2009"
    summary: "Governs the recognition of authorisations for factoring and finance leasing for certain undertakings and financial services institutions under the Annual Tax Act 2009."
  "64k":
    title: "Transitional provision on the Act implementing the Qualifying Holdings Directive"
    summary: "Applies this Act as in force until 17 March 2009 to proceedings under section 2c for which a notification was received by that date."
  "64l":
    title: "Transitional provision on authorisation for investment administration"
    summary: "Deems authorisation for investment administration to have been granted to institutions authorised on 25 March 2009 for principal broking, proprietary trading or portfolio management."
  "64m":
    title: "Transitional provision on the Brexit Tax Accompanying Act"
    summary: "Applies section 25a(5a) for the first time to terminations received more than eight months after 29 March 2019 and governs transitions for undertakings from the United Kingdom in case of withdrawal without a withdrawal agreement."
  "64n":
    title: "Transitional provision on the Act amending the law on financial intermediaries and capital investments"
    summary: "Deemed authorisation to have been provisionally granted, until BaFin's decision, to undertakings that became financial services institutions on 1 June 2012 through the extended definition of financial instruments, if they submitted a complete application by 31 December 2012."
  "64o":
    title: "Transitional provisions on the EMIR Implementation Act"
    summary: "Governs the application of provisions of this Act to credit institutions until authorisation under Regulation (EU) No 648/2012 is granted or refused."
  "64p":
    title: "Transitional provision on the High-Frequency Trading Act"
    summary: "Governs the provisional granting of authorisation for proprietary trading and dealing on own account to undertakings that became financial services institutions through the extended definition of proprietary trading."
  "64q":
    title: "Transitional provision on the AIFM Implementation Act"
    summary: "Governs the continued application of earlier versions of section 1(1a) and this Act until certain dates to financial services institutions that count as management companies or units of investment funds."
  "64r":
    title: "Transitional provisions on the CRD IV Implementation Act"
    summary: "Contains transitional provisions on the CRD IV Implementation Act, including grandfathering of mandates of managers and members of administrative and supervisory bodies held on 31 December 2013; most subsections have been repealed."
  "64v":
    title: "Transitional provisions on the First Financial Markets Amendment Act"
    summary: "Governs the continuation of activity as a central securities depository until the decision on the application for authorisation under Regulation (EU) No 909/2014 becomes final."
  "64w":
    title: "(repealed)"
    summary: "Repealed."
  "64x":
    title: "Transitional provision on the Second Financial Markets Amendment Act"
    summary: "Deems authorisation to operate an organised trading facility to have been granted to CRR credit institutions and operators of multilateral trading facilities on 3 January 2018 and provisionally granted to newly covered undertakings that submitted a complete application by 2 July 2018."
  "64y":
    title: "(repealed)"
    summary: "Repealed."
  "65":
    title: "Transitional provision on the Act introducing electronic securities"
    summary: "Allows undertakings authorised for crypto custody business on 10 June 2021 also to safeguard private cryptographic keys for crypto securities and deems authorisation for keeping crypto securities registers to be provisionally granted under certain conditions."
  "65a":
    title: "Transitional provision on the Financial Market Digitalisation Act"
    summary: "Deems authorisation for qualified crypto custody business to have been granted to institutions authorised for crypto custody business on 29 December 2024 and sets the start of application of certain provisions, including the reporting requirements under Regulation (EU) 2022/2554 from 17 January 2025."

# Reviewed corrections of the model summaries (source language: en).
en:
  "5": Requires Member States to ensure the confidentiality of communications and related traffic data, and allows storing or accessing information on a user's terminal equipment only with consent unless strictly necessary.
  "6": Requires providers to erase or anonymise traffic data once no longer needed for transmission, with exceptions for billing and, with consent, for marketing and value added services.
  "7": Gives subscribers the right to receive non-itemised bills and requires Member States to reconcile itemised billing with the privacy of calling and called users.
  "8": Requires service providers to offer calling and called users simple, free means to prevent the presentation of calling and connected line identification.
  "9": Allows location data other than traffic data to be processed only when made anonymous or with the consent of users or subscribers, who must be informed beforehand and can withdraw consent at any time.
  "11": Gives every subscriber the possibility, by simple means and free of charge, to stop automatic call forwarding by a third party to their terminal.
  "13": Allows automated calling systems, fax or electronic mail to be used for direct marketing only with prior consent, with an exception for electronic contact details of existing customers.
  "14": Requires Member States to ensure that no mandatory requirements for specific technical features are imposed on terminal or other electronic communication equipment that could impede its placing on the market and free circulation.
  "14a": Provides that the Commission is assisted by the Communications Committee established under the Framework Directive 2002/21/EC.

# German: written with the terms of the official German text (an authentic
# language version), not translated by the model.
de:
  "1": Harmonisiert die nationalen Vorschriften, um einen gleichwertigen Schutz der Grundrechte, insbesondere der Privatsphäre und der Vertraulichkeit, im Bereich der elektronischen Kommunikation zu gewährleisten.
  "2": Bestimmt Begriffe wie Nutzer, Verkehrsdaten, Standortdaten, Nachricht, Einwilligung, Dienst mit Zusatznutzen, elektronische Post und Verletzung des Schutzes personenbezogener Daten.
  "3": Erfasst die Verarbeitung personenbezogener Daten in Verbindung mit öffentlich zugänglichen elektronischen Kommunikationsdiensten in öffentlichen Kommunikationsnetzen.
  "4": Verpflichtet Anbieter öffentlich zugänglicher elektronischer Kommunikationsdienste zu geeigneten technischen und organisatorischen Maßnahmen für die Sicherheit ihrer Dienste und zur Meldung von Datenschutzverletzungen.
  "5": Verpflichtet die Mitgliedstaaten, die Vertraulichkeit der Nachrichten und der zugehörigen Verkehrsdaten sicherzustellen, und erlaubt das Speichern von oder den Zugriff auf Informationen im Endgerät nur mit Einwilligung, sofern nicht unbedingt erforderlich.
  "6": Verpflichtet Anbieter, Verkehrsdaten zu löschen oder zu anonymisieren, sobald sie für die Übertragung nicht mehr benötigt werden, mit Ausnahmen für die Abrechnung und, mit Einwilligung, für Vermarktung und Dienste mit Zusatznutzen.
  "7": Gibt Teilnehmern das Recht auf Rechnungen ohne Einzelverbindungsnachweis und verpflichtet die Mitgliedstaaten, Einzelverbindungsnachweise mit der Privatsphäre der Anrufenden und Angerufenen in Einklang zu bringen.
  "8": Verpflichtet Diensteanbieter, anrufenden und angerufenen Nutzern einfache und kostenlose Möglichkeiten zu bieten, die Anzeige der Rufnummer zu unterdrücken.
  "9": Erlaubt die Verarbeitung anderer Standortdaten als Verkehrsdaten nur anonymisiert oder mit Einwilligung der vorher informierten Nutzer oder Teilnehmer, die ihre Einwilligung jederzeit zurückziehen können.
  "10": Verpflichtet die Mitgliedstaaten zu transparenten Verfahren, nach denen Anbieter die Unterdrückung der Rufnummernanzeige oder die Verweigerung von Standortdaten zur Verfolgung böswilliger Anrufe und für Notrufdienste aufheben dürfen.
  "11": Gibt jedem Teilnehmer die Möglichkeit, eine von Dritten veranlasste automatische Anrufweiterschaltung auf sein Endgerät einfach und kostenlos abzustellen.
  "12": Verpflichtet dazu, Teilnehmer vor ihrer Aufnahme in ein öffentliches Teilnehmerverzeichnis kostenlos über dessen Zwecke und weitere Nutzungsmöglichkeiten zu informieren.
  "13": Erlaubt automatische Anrufsysteme, Faxgeräte oder elektronische Post für Direktwerbung nur mit vorheriger Einwilligung, mit einer Ausnahme für elektronische Kontaktdaten bestehender Kunden.
  "14": Verpflichtet die Mitgliedstaaten sicherzustellen, dass für Endgeräte und andere elektronische Kommunikationsgeräte keine zwingenden technischen Anforderungen gelten, die ihr Inverkehrbringen und ihren freien Verkehr behindern könnten.
  "14a": Bestimmt, dass die Kommission vom Kommunikationsausschuss unterstützt wird, der durch die Rahmenrichtlinie 2002/21/EG eingesetzt wurde.
  "15": Erlaubt den Mitgliedstaaten, Rechte und Pflichten aus bestimmten Artikeln der Richtlinie zum Schutz der nationalen und öffentlichen Sicherheit im Einklang mit dem Gemeinschaftsrecht zu beschränken.
  "15a": Verpflichtet die Mitgliedstaaten, Sanktionen für Verstöße gegen die nationalen Umsetzungsvorschriften festzulegen und ihre Durchsetzung sicherzustellen.
  "16": Erlaubt, rechtmäßig vor Geltung der nationalen Umsetzungsvorschriften in Teilnehmerverzeichnisse aufgenommene Daten dort zu belassen, sofern die informierten Teilnehmer nicht widersprechen.
  "17": Verpflichtet die Mitgliedstaaten, die Richtlinie bis zum 31. Oktober 2003 umzusetzen und der Kommission die Umsetzungsvorschriften mitzuteilen.
  "18": Verpflichtet die Kommission, einen Bericht über die Anwendung und die Auswirkungen der Richtlinie vorzulegen und gegebenenfalls Änderungen vorzuschlagen.
  "19": Hebt die Richtlinie 97/66/EG mit Wirkung vom Zeitpunkt nach Artikel 17 Absatz 1 auf; Verweise auf sie gelten als Verweise auf diese Richtlinie.
  "20": Bestimmt, dass die Richtlinie am Tag ihrer Veröffentlichung im Amtsblatt der Europäischen Gemeinschaften in Kraft tritt.
  "21": Richtet die Richtlinie an die Mitgliedstaaten.

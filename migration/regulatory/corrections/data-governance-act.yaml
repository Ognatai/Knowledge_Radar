# Reviewed corrections of the model summaries (each language summarised from its own official text).
en:
  "1": Lays down conditions for the re-use of certain protected data held by public sector bodies, a framework for data intermediation services, voluntary registration of data altruism organisations and the European Data Innovation Board.
  "2": Defines the terms used in the Regulation, including data, re-use, data holder, data user, data sharing, data intermediation service, data altruism, public sector body and secure processing environment.
  "7": Requires Member States to designate competent bodies that assist public sector bodies in granting or refusing access for the re-use of protected data.
  "13": Requires each Member State to designate competent authorities for data intermediation services that meet requirements of independence and cooperate with other relevant authorities.
  "14": Requires the competent authorities for data intermediation services to monitor and supervise the providers' compliance with this Chapter, also on request of natural or legal persons.
  "17": Requires public national registers and a public Union register of recognised data altruism organisations, which may use a common label and logo.
  "22": Requires the Commission to supplement the Regulation by delegated acts establishing a rulebook with information, technical and security requirements and communication roadmaps for data altruism.
  "23": Requires each Member State to designate competent authorities for the registration of data altruism organisations.
  "24": Requires the competent authorities for registration to monitor and supervise the compliance of recognised data altruism organisations with this Chapter.
  "25": Allows the Commission to adopt implementing acts establishing a European data altruism consent form.
  "30": Sets out the tasks of the European Data Innovation Board, including advising the Commission on consistent practices for re-use requests, data intermediation and data altruism.
  "35": Requires the Commission to evaluate the Regulation by 24 September 2025 and report to the European Parliament, the Council and the European Economic and Social Committee.
  "38": Provides that the Regulation enters into force on the twentieth day following its publication and applies from 24 September 2023.
de:
  "1": Legt Bedingungen für die Weiterverwendung bestimmter geschützter Daten öffentlicher Stellen, einen Rahmen für Datenvermittlungsdienste, die freiwillige Eintragung datenaltruistischer Organisationen und den Europäischen Dateninnovationsrat fest.
  "2": Bestimmt die Begriffe der Verordnung, darunter Daten, Weiterverwendung, Dateninhaber, Datennutzer, gemeinsame Datennutzung, Datenvermittlungsdienst, Datenaltruismus, öffentliche Stelle und sichere Verarbeitungsumgebung.
  "3": Erfasst Daten öffentlicher Stellen, die aus Gründen der geschäftlichen Vertraulichkeit, der statistischen Geheimhaltung, des Schutzes geistigen Eigentums Dritter oder des Schutzes personenbezogener Daten geschützt sind.
  "13": Verpflichtet jeden Mitgliedstaat, eine oder mehrere zuständige Behörden für Datenvermittlungsdienste zu benennen und der Kommission bis zum 24. September 2023 mitzuteilen.
  "14": Verpflichtet die für Datenvermittlungsdienste zuständigen Behörden, die Einhaltung der Anforderungen dieses Kapitels durch die Anbieter zu überwachen.
  "17": Verpflichtet zu öffentlichen nationalen Registern und einem öffentlichen Unionsregister anerkannter datenaltruistischer Organisationen, die ein gemeinsames Label und Logo verwenden dürfen.
  "22": Verpflichtet die Kommission, die Verordnung durch delegierte Rechtsakte um ein Regelwerk mit Informations-, technischen und Sicherheitsanforderungen sowie Kommunikationsfahrplänen für den Datenaltruismus zu ergänzen.
  "27": Gibt natürlichen und juristischen Personen das Recht, bei der zuständigen Behörde Beschwerde gegen einen Anbieter von Datenvermittlungsdiensten oder eine anerkannte datenaltruistische Organisation einzulegen.
  "32": Regelt die Ausübung der Befugnis der Kommission zum Erlass delegierter Rechtsakte.
  "35": Verpflichtet die Kommission, die Verordnung bis zum 24. September 2025 zu bewerten und dem Europäischen Parlament, dem Rat und dem Europäischen Wirtschafts- und Sozialausschuss einen Bericht vorzulegen.
  "37": Verpflichtet Einrichtungen, die am 23. Juni 2022 bereits Datenvermittlungsdienste nach Artikel 10 erbrachten, die Pflichten des Kapitels III bis zum 24. September 2025 zu erfüllen.
  "7": Verpflichtet jeden Mitgliedstaat, zuständige Stellen zu benennen, die öffentliche Stellen bei der Gewährung oder Verweigerung des Zugangs zur Weiterverwendung geschützter Daten unterstützen.
  "23": Verpflichtet jeden Mitgliedstaat, eine oder mehrere zuständige Behörden für das öffentliche nationale Register der anerkannten datenaltruistischen Organisationen zu benennen.
  "24": Verpflichtet die für die Registrierung zuständigen Behörden, die Einhaltung der Anforderungen dieses Kapitels durch anerkannte datenaltruistische Organisationen zu überwachen und zu beaufsichtigen.
  "25": Verpflichtet die Kommission, durch Durchführungsrechtsakte ein europäisches Einwilligungsformular für Datenaltruismus festzulegen.
  "30": Legt die Aufgaben des Europäischen Dateninnovationsrats fest, darunter die Beratung der Kommission zu einheitlicher Praxis bei Anträgen auf Weiterverwendung, Datenvermittlung und Datenaltruismus.
  "38": Bestimmt, dass die Verordnung am zwanzigsten Tag nach ihrer Veröffentlichung in Kraft tritt und ab dem 24. September 2023 gilt.

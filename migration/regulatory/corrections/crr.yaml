# Reviewed unit summaries for the CRR, which is summarised per structural unit (see finance.yaml).
# The model summaries mostly described only the first article of a unit; each summary below
# was rewritten from the unit's article headings in that language and checked against the
# official text for the figures it states (Art. 92, 89, 395, 428b, 465). Both language
# versions are authentic; each language was written from its own text.
en:
  "1–5a": "Sets out the subject matter and scope of the Regulation (own funds, large exposures, liquidity, leverage, reporting and disclosure), supervisory powers, the option to apply stricter requirements and the definitions, including those for credit risk and crypto-assets."
  "6–10": "Requires institutions to meet the requirements on an individual basis and allows competent authorities to waive prudential and liquidity requirements for subsidiaries and parents within a group and for credit institutions permanently affiliated to a central body."
  "10a–24": "Requires parent institutions to meet the requirements on a consolidated basis and governs the methods and scope of prudential consolidation, joint decisions of competent authorities, sub-consolidation of third-country entities and the valuation of assets."
  "25": "Defines Tier 1 capital as the sum of Common Equity Tier 1 capital and Additional Tier 1 capital."
  "26–50": "Defines Common Equity Tier 1 items and instruments, including those of mutuals and cooperatives, prudential filters and the deductions from Common Equity Tier 1, such as intangible assets, deferred tax assets, non-performing exposures and holdings in financial sector entities, with threshold exemptions."
  "51–61": "Defines Additional Tier 1 items and instruments, including restrictions on cancelling distributions and requirements for write-down or conversion, and the deductions from Additional Tier 1 items."
  "62–71": "Defines Tier 2 items and instruments, their amortisation in the final five years and the deductions from Tier 2 items."
  "72": "Defines own funds as the sum of Tier 1 capital and Tier 2 capital."
  "72a–72l": "Defines eligible liabilities items and instruments for the requirements for own funds and eligible liabilities, their amortisation, the consequences of ceasing to be eligible and the deductions, in particular for holdings of eligible liabilities of G-SII entities."
  "73–80": "Lays down general requirements for own funds and eligible liabilities instruments, such as rules on distributions, supervisory permission before reducing or redeeming instruments, temporary waivers from deduction and the ongoing review of instrument quality."
  "81–88b": "Governs the extent to which minority interests and Additional Tier 1, Tier 2 and eligible liabilities instruments issued by subsidiaries count towards consolidated own funds."
  "89–91": "Requires qualifying holdings outside the financial sector above 15 % of eligible capital per holding, or 60 % in total, to be risk-weighted at 1 250 % or prohibited, or alternatively deducted from Common Equity Tier 1."
  "92–94": "Requires institutions to maintain at all times a Common Equity Tier 1 ratio of 4.5 %, a Tier 1 ratio of 6 %, a total capital ratio of 8 % and a leverage ratio of 3 %, applies an output floor of 72.5 % and sets requirements for G-SIIs."
  "102–106": "Lays down requirements for the trading book, such as trading strategies, management and inclusion of positions, reclassification, trading desks, prudent valuation and internal hedges."
  "107–110a": "Sets out the approaches to credit risk (the Standardised Approach or the IRB Approach) and the treatment of credit risk mitigation, securitisation positions and credit risk adjustments."
  "111–141": "Lays down the Standardised Approach for credit risk: exposure values, exposure classes, risk weights for each class such as sovereigns, institutions, corporates, retail and real estate exposures, and the use of credit assessments by ECAIs."
  "142–191": "Lays down the Internal Ratings Based Approach for credit risk: supervisory permission, calculation of risk-weighted exposure amounts, PD, LGD and maturity parameters and minimum requirements for rating systems, data, validation, governance and internal audit."
  "192–239": "Governs the recognition of credit risk mitigation, including netting, financial and other collateral, guarantees and credit derivatives, and how their effect is calculated."
  "242–270e": "Governs the capital treatment of securitisation positions, including STS securitisations, significant risk transfer and the hierarchy of approaches (SEC-IRBA, SEC-SA and SEC-ERBA)."
  "271–311": "Governs the exposure value for counterparty credit risk from derivatives and securities financing transactions using the standardised approach, simplified methods or the internal model method, and exposures to central counterparties."
  "311a–315": "Sets the own funds requirement for operational risk as the business indicator component calculated from the institution's business indicator."
  "316–323": "Lays down requirements for operational risk loss data, such as loss data sets, thresholds and data quality, and requires an operational risk management framework."
  "325–325b": "Sets out the approaches for calculating own funds requirements for market risk and the conditions for using the simplified standardised approach."
  "325c–325ay": "Lays down the alternative standardised approach for market risk, comprising the sensitivities-based method, the default risk charge and the residual risk add-on, with risk factors, risk weights and correlations."
  "325az–325bp": "Lays down the alternative internal model approach for market risk, including permission, the expected shortfall measure, modellability of risk factors, back-testing, profit and loss attribution and internal default risk models."
  "326–350": "Governs own funds requirements for position risk in debt and equity instruments, derivatives and units in collective investment undertakings, including the calculation of net positions and specific and general risk."
  "351–354": "Governs own funds requirements for foreign exchange risk based on the overall net foreign exchange position, with a de minimis threshold."
  "355–361": "Governs own funds requirements for commodities risk using the maturity ladder approach, the simplified approach or the extended maturity ladder approach."
  "378–380": "Governs own funds requirements for settlement and delivery risk and free deliveries, with a waiver in case of system-wide failures."
  "381–386": "Governs own funds requirements for credit valuation adjustment (CVA) risk, using the standardised, basic or simplified approach, and the recognition of eligible hedges."
  "387–403": "Requires institutions to identify, manage and report large exposures and limits exposures to a client or group of connected clients to 25 % of Tier 1 capital, with exemptions and recognition of credit risk mitigation."
  "411–414": "Defines liquidity terms and requires institutions to hold liquid assets covering net outflows under stress (liquidity coverage requirement) and to fund long-term assets with stable funding."
  "415–426": "Governs the reporting of liquid assets, liquidity outflows and inflows for the liquidity coverage requirement, including the requirements for holdings and valuation of liquid assets."
  "427–428": "Governs the reporting of items providing stable funding and items requiring stable funding."
  "428a–428b": "Requires institutions to maintain a net stable funding ratio of at least 100 %, including on a consolidated basis."
  "428c–428h": "Lays down general rules for calculating the net stable funding ratio, such as the treatment of derivatives, netting, interdependent assets and liabilities and deposits within institutional protection schemes."
  "428i–428o": "Governs the calculation of available stable funding by applying factors from 0 % to 100 % to liabilities and own funds according to their residual maturity and type."
  "428p–428ah": "Governs the calculation of required stable funding by applying factors from 0 % to 100 % to assets and off-balance-sheet items according to their residual maturity and liquidity."
  "428ai": "Allows small and non-complex institutions, with the permission of the competent authority, to calculate the net stable funding ratio using a simplified method."
  "428aj–428ap": "Governs available stable funding under the simplified calculation of the net stable funding ratio for small and non-complex institutions."
  "428aq–428az": "Governs required stable funding under the simplified calculation of the net stable funding ratio for small and non-complex institutions."
  "429–429g": "Governs the calculation of the leverage ratio as Tier 1 capital divided by the total exposure measure, including exposures excluded from it and the exposure values of assets, derivatives, securities financing transactions and off-balance-sheet items."
  "430–430c": "Requires institutions to report on prudential requirements and financial information, together with specific reporting obligations."
  "431–434c": "Requires institutions to disclose information under a formal policy, sets the frequency and scope of disclosures for large, small and non-complex and other institutions and provides for uniform formats and publication via the European single access point."
  "435–451b": "Specifies the information to be disclosed, such as risk management objectives, own funds, capital requirements, key metrics, credit, market, operational and liquidity risks, ESG risks, remuneration, the leverage ratio and crypto-asset exposures."
  "452–455": "Requires disclosure on the use of the IRB Approach, credit risk mitigation techniques and internal models for operational and market risk."
  "456–464": "Empowers the Commission to adopt delegated acts, allows Member States to take stricter national measures against macroprudential or systemic risk and governs the exercise of the delegation and the European Banking Committee."
  "465–482": "Contains transitional provisions for own funds, including the phase-in of the output floor from 50 % in 2025, the introduction of IFRS 9 and transitional deductions and filters."
  "483–491": "Governs the grandfathering of capital instruments that qualified as own funds under earlier rules, including State aid instruments, and their phasing out."
  "492": "Contains transitional provisions for the disclosure of own funds."
  "493–501b": "Contains transitional provisions for large exposures, the requirements for own funds and eligible liabilities, equity and specialised lending exposures, market risk models, the leverage ratio and other areas."
  "501c–519b": "Requires the Commission and the EBA to report on and review various aspects of the Regulation, such as the treatment of environmental and social risks, crypto-assets, covered bonds, large exposures and liquidity."
  "519c–519f": "Provides for an EBA compliance tool, a framework for minimum haircut floors for securities financing transactions and reports on operational risk and proportionality."
  "520–520a": "Amends Regulation (EU) No 648/2012 and governs the application of the own funds requirements for market risk."
  "521": "Provides that the Regulation entered into force on the day following publication and has applied since 1 January 2014, with certain provisions applying later."
de:
  "1–5a": "Legt Gegenstand und Anwendungsbereich der Verordnung (Eigenmittel, Großkredite, Liquidität, Verschuldung, Meldung und Offenlegung), die Aufsichtsbefugnisse, die Anwendung strengerer Anforderungen und die Begriffsbestimmungen fest, auch für das Kreditrisiko und Kryptowerte."
  "6–10": "Verpflichtet die Institute, die Anforderungen auf Einzelbasis zu erfüllen, und erlaubt den zuständigen Behörden Ausnahmen von den Aufsichts- und Liquiditätsanforderungen für Tochter- und Mutterunternehmen einer Gruppe und für einer Zentralorganisation zugeordnete Kreditinstitute."
  "10a–24": "Verpflichtet Mutterinstitute, die Anforderungen auf konsolidierter Basis zu erfüllen, und regelt Methoden und Umfang der aufsichtlichen Konsolidierung, gemeinsame Entscheidungen der zuständigen Behörden, die Teilkonsolidierung bei Drittlandsunternehmen und die Bewertung von Vermögenswerten."
  "25": "Bestimmt das Kernkapital als Summe aus hartem Kernkapital und zusätzlichem Kernkapital."
  "26–50": "Bestimmt die Posten und Instrumente des harten Kernkapitals, auch von Genossenschaften und Sparkassen, aufsichtliche Korrekturen und die Abzüge vom harten Kernkapital, etwa für immaterielle Vermögenswerte, latente Steueransprüche, notleidende Risikopositionen und Beteiligungen an Unternehmen der Finanzbranche, mit Schwellenwertausnahmen."
  "51–61": "Bestimmt die Posten und Instrumente des zusätzlichen Kernkapitals einschließlich Beschränkungen beim Ausfall von Ausschüttungen und Anforderungen an Herabschreibung oder Umwandlung sowie die Abzüge vom zusätzlichen Kernkapital."
  "62–71": "Bestimmt die Posten und Instrumente des Ergänzungskapitals, ihre Amortisierung in den letzten fünf Jahren der Laufzeit und die Abzüge vom Ergänzungskapital."
  "72": "Bestimmt die Eigenmittel als Summe aus Kernkapital und Ergänzungskapital."
  "72a–72l": "Bestimmt Posten und Instrumente berücksichtigungsfähiger Verbindlichkeiten für die Anforderungen an Eigenmittel und berücksichtigungsfähige Verbindlichkeiten, ihre Amortisierung, die Folgen des Wegfalls der Berücksichtigungsfähigkeit und die Abzüge, insbesondere für Positionen in Verbindlichkeiten von G-SRI-Einheiten."
  "73–80": "Legt allgemeine Anforderungen an Eigenmittelinstrumente und Instrumente berücksichtigungsfähiger Verbindlichkeiten fest, etwa zu Ausschüttungen, zur Erlaubnis der Aufsicht vor einer Verringerung, zu befristeten Ausnahmen vom Abzug und zur laufenden Prüfung ihrer Qualität."
  "81–88b": "Regelt, inwieweit Minderheitsbeteiligungen und von Tochterunternehmen begebene Instrumente des zusätzlichen Kernkapitals, des Ergänzungskapitals und berücksichtigungsfähiger Verbindlichkeiten zu den konsolidierten Eigenmitteln zählen."
  "89–91": "Verlangt, qualifizierte Beteiligungen außerhalb des Finanzsektors über 15 % der anrechenbaren Eigenmittel je Beteiligung oder 60 % insgesamt mit 1 250 % zu gewichten oder zu verbieten oder alternativ vom harten Kernkapital abzuziehen."
  "92–94": "Verpflichtet die Institute, jederzeit eine harte Kernkapitalquote von 4,5 %, eine Kernkapitalquote von 6 %, eine Gesamtkapitalquote von 8 % und eine Verschuldungsquote von 3 % einzuhalten, legt eine Eigenmitteluntergrenze von 72,5 % fest und regelt Anforderungen für G-SRI."
  "102–106": "Legt Anforderungen an das Handelsbuch fest, etwa Handelsstrategien, Führung und Einbeziehung von Positionen, Neueinstufung, Handelstische, vorsichtige Bewertung und interne Sicherungsgeschäfte."
  "107–110a": "Legt die Ansätze zur Ermittlung des Kreditrisikos (Standardansatz oder IRB-Ansatz) und die Behandlung von Kreditrisikominderung, Verbriefungspositionen und Kreditrisikoanpassungen fest."
  "111–141": "Regelt den Standardansatz für das Kreditrisiko: Risikopositionswerte, Risikopositionsklassen, Risikogewichte je Klasse, etwa für Zentralstaaten, Institute, Unternehmen, Mengengeschäft und Immobilien, und die Verwendung von Bonitätsbeurteilungen von Ratingagenturen."
  "142–191": "Regelt den IRB-Ansatz für das Kreditrisiko: Erlaubnis der Aufsicht, Berechnung der risikogewichteten Positionsbeträge, die Parameter PD, LGD und Laufzeit sowie Mindestanforderungen an Ratingsysteme, Daten, Validierung, Unternehmensführung und Innenrevision."
  "192–239": "Regelt die Anerkennung von Kreditrisikominderung, darunter Netting, Finanz- und andere Sicherheiten, Garantien und Kreditderivate, und die Berechnung ihrer Wirkung."
  "242–270e": "Regelt die Eigenmittelbehandlung von Verbriefungspositionen, darunter STS-Verbriefungen, die Übertragung eines signifikanten Risikos und die Rangfolge der Ansätze (SEC-IRBA, SEC-SA und SEC-ERBA)."
  "271–311": "Regelt den Risikopositionswert für das Gegenparteiausfallrisiko aus Derivaten und Wertpapierfinanzierungsgeschäften nach dem Standardansatz, vereinfachten Methoden oder der auf einem internen Modell beruhenden Methode sowie Risikopositionen gegenüber zentralen Gegenparteien."
  "311a–315": "Legt die Eigenmittelanforderung für das operationelle Risiko als Geschäftsindikatorkomponente fest, die aus dem Geschäftsindikator des Instituts berechnet wird."
  "316–323": "Legt Anforderungen an Verlustdaten aus operationellen Risiken fest, etwa Verlustdatensatz, Schwellenwerte und Datenqualität, und verlangt einen Rahmen für die Steuerung operationeller Risiken."
  "325–325b": "Legt die Ansätze für die Berechnung der Eigenmittelanforderungen für das Marktrisiko und die Bedingungen für den vereinfachten Standardansatz fest."
  "325c–325ay": "Regelt den alternativen Standardansatz für das Marktrisiko mit der sensitivitätsgestützten Methode, der Eigenmittelanforderung für das Ausfallrisiko und der Anforderung für Restrisiken samt Risikofaktoren, Risikogewichten und Korrelationen."
  "325az–325bp": "Regelt den alternativen auf einem internen Modell beruhenden Ansatz für das Marktrisiko, darunter Erlaubnis, Expected Shortfall, Modellierbarkeit von Risikofaktoren, Rückvergleiche, P&L-Attribution und interne Modelle für Ausfallrisiken."
  "326–350": "Regelt die Eigenmittelanforderungen für das Positionsrisiko aus Schuldtiteln, Aktieninstrumenten, Derivaten und Anteilen an OGA, einschließlich der Berechnung von Nettopositionen und des spezifischen und allgemeinen Risikos."
  "351–354": "Regelt die Eigenmittelanforderungen für das Fremdwährungsrisiko auf Grundlage der gesamten Netto-Fremdwährungsposition mit einem Schwellenwert."
  "355–361": "Regelt die Eigenmittelanforderungen für das Warenpositionsrisiko nach dem Laufzeitbandverfahren, dem vereinfachten Verfahren oder dem erweiterten Laufzeitbandverfahren."
  "378–380": "Regelt die Eigenmittelanforderungen für das Abwicklungs- und Lieferrisiko und für Vorleistungen mit einer Aussetzung bei systemweiten Störungen."
  "381–386": "Regelt die Eigenmittelanforderungen für das Risiko einer Anpassung der Kreditbewertung (CVA-Risiko) nach dem Standardansatz, dem Basisansatz oder dem vereinfachten Ansatz und die Anerkennung von Absicherungen."
  "387–403": "Verpflichtet die Institute, Großkredite zu ermitteln, zu steuern und zu melden, und begrenzt Risikopositionen gegenüber einem Kunden oder einer Gruppe verbundener Kunden auf 25 % des Kernkapitals, mit Ausnahmen und Anerkennung von Kreditrisikominderung."
  "411–414": "Bestimmt Begriffe der Liquidität und verpflichtet die Institute, liquide Aktiva zur Deckung der Nettoabflüsse unter Stress vorzuhalten (Liquiditätsdeckungsanforderung) und langfristige Aktiva stabil zu refinanzieren."
  "415–426": "Regelt die Meldung liquider Aktiva sowie der Liquiditätsabflüsse und -zuflüsse für die Liquiditätsdeckungsanforderung, einschließlich der Anforderungen an Bestand und Bewertung liquider Aktiva."
  "427–428": "Regelt die Meldung von Positionen, die eine stabile Refinanzierung bieten, und von Positionen, die eine stabile Refinanzierung erfordern."
  "428a–428b": "Verpflichtet die Institute, eine strukturelle Liquiditätsquote von mindestens 100 % einzuhalten, auch auf konsolidierter Basis."
  "428c–428h": "Legt allgemeine Regeln für die Berechnung der strukturellen Liquiditätsquote fest, etwa zu Derivaten, Netting, interdependenten Aktiva und Verbindlichkeiten und Einlagen in institutsbezogenen Sicherungssystemen."
  "428i–428o": "Regelt die Berechnung der verfügbaren stabilen Refinanzierung mit Faktoren von 0 % bis 100 % je nach Restlaufzeit und Art der Verbindlichkeiten und Eigenmittel."
  "428p–428ah": "Regelt die Berechnung der erforderlichen stabilen Refinanzierung mit Faktoren von 0 % bis 100 % je nach Restlaufzeit und Liquidität der Aktiva und außerbilanziellen Posten."
  "428ai": "Erlaubt kleinen und nicht komplexen Instituten mit Erlaubnis der zuständigen Behörde, die strukturelle Liquiditätsquote vereinfacht zu berechnen."
  "428aj–428ap": "Regelt die verfügbare stabile Refinanzierung bei der vereinfachten Berechnung der strukturellen Liquiditätsquote für kleine und nicht komplexe Institute."
  "428aq–428az": "Regelt die erforderliche stabile Refinanzierung bei der vereinfachten Berechnung der strukturellen Liquiditätsquote für kleine und nicht komplexe Institute."
  "429–429g": "Regelt die Berechnung der Verschuldungsquote als Kernkapital geteilt durch die Gesamtrisikopositionsmessgröße, einschließlich der ausgeschlossenen Risikopositionen und der Risikopositionswerte von Aktiva, Derivaten, Wertpapierfinanzierungsgeschäften und außerbilanziellen Posten."
  "430–430c": "Verpflichtet die Institute zur Meldung über Aufsichtsanforderungen und Finanzinformationen sowie zu spezifischen Meldungen."
  "431–434c": "Verpflichtet die Institute zur Offenlegung nach förmlichen Verfahren, legt Häufigkeit und Umfang für große, kleine und nicht komplexe und andere Institute fest und sieht einheitliche Formate und die Veröffentlichung über das zentrale europäische Zugangsportal vor."
  "435–451b": "Bestimmt die offenzulegenden Informationen, etwa Risikomanagementziele, Eigenmittel, Eigenmittelanforderungen, Schlüsselparameter, Kredit-, Markt-, operationelle und Liquiditätsrisiken, ESG-Risiken, Vergütungspolitik, Verschuldungsquote und Risikopositionen in Kryptowerten."
  "452–455": "Verlangt die Offenlegung der Anwendung des IRB-Ansatzes, von Kreditrisikominderungstechniken und interner Modelle für operationelle Risiken und das Marktrisiko."
  "456–464": "Ermächtigt die Kommission zu delegierten Rechtsakten, erlaubt den Mitgliedstaaten strengere nationale Maßnahmen gegen Makroaufsichts- oder Systemrisiken und regelt die Ausübung der Befugnisübertragung und den Europäischen Bankenausschuss."
  "465–482": "Enthält Übergangsbestimmungen für die Eigenmittel, darunter die stufenweise Einführung der Eigenmitteluntergrenze ab 50 % im Jahr 2025, die Einführung des IFRS 9 und übergangsweise Abzüge und Korrekturen."
  "483–491": "Regelt den Bestandsschutz für Kapitalinstrumente, die nach früheren Vorschriften als Eigenmittel galten, einschließlich Instrumenten der staatlichen Beihilfe, und ihr Auslaufen."
  "492": "Enthält Übergangsbestimmungen für die Offenlegung von Eigenmitteln."
  "493–501b": "Enthält Übergangsbestimmungen für Großkredite, die Anforderungen an Eigenmittel und berücksichtigungsfähige Verbindlichkeiten, Beteiligungs- und Spezialfinanzierungsrisikopositionen, interne Marktrisikomodelle, die Verschuldungsquote und weitere Bereiche."
  "501c–519b": "Verpflichtet Kommission und EBA zu Berichten und Überprüfungen zu verschiedenen Aspekten der Verordnung, etwa zur Behandlung ökologischer und sozialer Risiken, von Kryptowerten, gedeckten Schuldverschreibungen, Großkrediten und Liquidität."
  "519c–519f": "Sieht ein Instrument der EBA zur Erleichterung der Einhaltung der Vorschriften, ein Rahmenwerk für Mindestabschläge bei Wertpapierfinanzierungsgeschäften sowie Berichte zum operationellen Risiko und zur Verhältnismäßigkeit vor."
  "520–520a": "Ändert die Verordnung (EU) Nr. 648/2012 und regelt die Anwendung der Eigenmittelanforderungen für das Marktrisiko."
  "521": "Bestimmt, dass die Verordnung am Tag nach ihrer Veröffentlichung in Kraft getreten ist und seit dem 1. Januar 2014 gilt, einzelne Vorschriften später."

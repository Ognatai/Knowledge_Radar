# Reviewed corrections of the model summaries (each language summarised from its own official text).
en:
  "3": Defines the terms used in the Regulation, including electronic identification, European Digital Identity Wallet, trust service, electronic signature, electronic seal and electronic attestation of attributes.
  "5c": Provides for the certification of European Digital Identity Wallets by accredited conformity assessment bodies designated by Member States.
  "5f": Requires Member States to accept European Digital Identity Wallets for online public services that require electronic identification, and private relying parties obliged to use strong user authentication, as well as very large online platforms, to accept them at the user's voluntary request.
  "12a": Provides for the certification of electronic identification schemes against cybersecurity requirements by conformity assessment bodies designated by Member States.
  "12b": Requires gatekeepers under the Digital Markets Act to give providers of European Digital Identity Wallets and of notified electronic identification means effective interoperability with, and access to, the same operating system, hardware and software features.
  "16": Requires Member States to lay down penalties, including administrative fines for trust service providers with a maximum of at least EUR 5 000 000 or, for legal persons, 1 % of total worldwide annual turnover, whichever is higher.
  "30": Provides for the certification of qualified electronic signature creation devices by public or private bodies designated by Member States.
  "31": Requires the Commission to establish, publish and maintain a list of certified qualified electronic signature creation devices on the basis of information notified by Member States.
  "35": Provides that electronic seals may not be denied legal effect solely because they are electronic, and that qualified electronic seals enjoy a presumption of integrity and correctness of origin of the data.
  "45a": Prohibits web-browser providers from measures contrary to their obligations under Article 45 and, exceptionally, allows precautionary measures for substantiated security concerns, which must be notified without delay.
  "46a": Requires Member States to designate supervisory bodies for providers of European Digital Identity Wallets.
  "46b": Requires Member States to designate supervisory bodies for trust services, with ex ante and ex post supervision of qualified and ex post supervision of non-qualified trust service providers.
  "46c": Requires each Member State to designate a single point of contact for trust services, European Digital Identity Wallets and notified electronic identification schemes.
  "48": Provides that the Commission is assisted by a committee within the meaning of Regulation (EU) No 182/2011.
  "49": Requires the Commission to review the application of the Regulation and report by 21 May 2026, including on the availability, security and usability of electronic identification means and European Digital Identity Wallets.
de:
  "3": Bestimmt die Begriffe der Verordnung, darunter elektronische Identifizierung, europäische Brieftasche für die Digitale Identität, Vertrauensdienst, elektronische Signatur, elektronisches Siegel und elektronische Attributsbescheinigung.
  "5": Bestimmt, dass die Verwendung von Pseudonymen in elektronischen Transaktionen nicht untersagt werden darf, sofern nicht Unionsrecht oder nationales Recht eine Identifizierung verlangt.
  "5c": Sieht die Zertifizierung europäischer Brieftaschen für die Digitale Identität durch akkreditierte, von den Mitgliedstaaten benannte Konformitätsbewertungsstellen vor.
  "5e": Verpflichtet die Anbieter europäischer Brieftaschen für die Digitale Identität, bei Sicherheitsverletzungen die Bereitstellung unverzüglich auszusetzen oder zurückzuziehen und Nutzer, vertrauende Beteiligte und die Kommission zu unterrichten.
  "5f": Verpflichtet die Mitgliedstaaten, europäische Brieftaschen für die Digitale Identität für Online-Dienste öffentlicher Stellen mit Identifizierungspflicht zu akzeptieren, sowie private vertrauende Beteiligte mit Pflicht zur starken Nutzerauthentifizierung und sehr große Online-Plattformen, sie auf freiwilliges Verlangen des Nutzers zu akzeptieren.
  "10": Verpflichtet den notifizierenden Mitgliedstaat, bei einer Sicherheitsverletzung des Identifizierungssystems die grenzüberschreitende Authentifizierung unverzüglich auszusetzen oder zu widerrufen und die anderen Mitgliedstaaten und die Kommission zu unterrichten.
  "11": Macht den notifizierenden Mitgliedstaat für Schäden haftbar, die vorsätzlich oder fahrlässig durch Verletzung seiner Pflichten nach Artikel 7 Buchstaben d und f bei grenzüberschreitenden Transaktionen verursacht werden.
  "12a": Sieht die Zertifizierung elektronischer Identifizierungssysteme anhand von Cybersicherheitsanforderungen durch von den Mitgliedstaaten benannte Konformitätsbewertungsstellen vor.
  "12b": Verpflichtet Torwächter nach dem Gesetz über digitale Märkte, Anbietern europäischer Brieftaschen für die Digitale Identität und notifizierter elektronischer Identifizierungsmittel wirksame Interoperabilität mit denselben Betriebssystem-, Hardware- und Softwarefunktionen und Zugang dazu zu ermöglichen.
  "15": Verpflichtet dazu, elektronische Identifizierungsmittel, Vertrauensdienste und Endnutzerprodukte in einfacher und verständlicher Sprache und barrierefrei für Menschen mit Behinderungen bereitzustellen.
  "16": Verpflichtet die Mitgliedstaaten, Sanktionen festzulegen, darunter Geldbußen gegen Vertrauensdiensteanbieter mit einem Höchstbetrag von mindestens 5 000 000 EUR oder bei juristischen Personen 1 % des weltweiten Jahresumsatzes, je nachdem, welcher Betrag höher ist.
  "20": Verpflichtet qualifizierte Vertrauensdiensteanbieter, sich mindestens alle 24 Monate auf eigene Kosten von einer Konformitätsbewertungsstelle prüfen zu lassen und den Bericht der Aufsichtsstelle vorzulegen.
  "22": Verpflichtet die Mitgliedstaaten, Vertrauenslisten mit Angaben zu qualifizierten Vertrauensdiensteanbietern und ihren Diensten zu erstellen, zu führen und zu veröffentlichen.
  "23": Erlaubt qualifizierten Vertrauensdiensteanbietern, ihre qualifizierten Vertrauensdienste nach Aufnahme in die Vertrauensliste mit dem EU-Vertrauenssiegel zu kennzeichnen.
  "24a": Bestimmt, dass qualifizierte Vertrauensdienste, die in einem Mitgliedstaat erbracht werden, in allen anderen Mitgliedstaaten als qualifizierte Vertrauensdienste anerkannt werden.
  "31": Verpflichtet die Kommission, auf Grundlage der Mitteilungen der Mitgliedstaaten eine Liste zertifizierter qualifizierter elektronischer Signaturerstellungseinheiten aufzustellen, zu veröffentlichen und zu führen.
  "35": Bestimmt, dass elektronischen Siegeln die Rechtswirkung nicht allein wegen ihrer elektronischen Form abgesprochen werden darf und für qualifizierte elektronische Siegel die Unversehrtheit und Richtigkeit der Herkunftsangabe der Daten vermutet wird.
  "37": Verpflichtet die Mitgliedstaaten, fortgeschrittene und qualifizierte elektronische Siegel in den durch Durchführungsrechtsakte festgelegten Formaten anzuerkennen, wenn Online-Dienste öffentlicher Stellen sie verlangen.
  "43": Bestimmt, dass Daten, die mit einem Dienst für die Zustellung elektronischer Einschreiben versandt werden, die Rechtswirkung nicht allein wegen ihrer elektronischen Form abgesprochen werden darf, und begründet bei qualifizierten Diensten Vermutungen für Unversehrtheit und Absender.
  "45a": Verbietet Webbrowser-Anbietern Maßnahmen, die ihren Pflichten aus Artikel 45 widersprechen, und erlaubt bei begründeten Sicherheitsbedenken ausnahmsweise Vorsichtsmaßnahmen, die unverzüglich mitzuteilen sind.
  "45e": Verpflichtet die Mitgliedstaaten sicherzustellen, dass qualifizierte Vertrauensdiensteanbieter bestimmte Attribute auf Verlangen des Nutzers elektronisch bei authentischen Quellen öffentlicher Stellen überprüfen können.
  "46b": Verpflichtet die Mitgliedstaaten, Aufsichtsstellen für Vertrauensdienste zu benennen, die qualifizierte Anbieter vorab und nachträglich und nichtqualifizierte Anbieter nachträglich beaufsichtigen.
  "46c": Verpflichtet jeden Mitgliedstaat, eine zentrale Anlaufstelle für Vertrauensdienste, europäische Brieftaschen für die Digitale Identität und notifizierte elektronische Identifizierungssysteme zu benennen.
  "47": Regelt die Ausübung der Befugnis der Kommission zum Erlass delegierter Rechtsakte.
  "48": Bestimmt, dass die Kommission von einem Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011 unterstützt wird.
  "48a": Verpflichtet die Mitgliedstaaten, Statistiken über das Funktionieren der europäischen Brieftaschen für die Digitale Identität und der qualifizierten Vertrauensdienste zu erheben, zu veröffentlichen und der Kommission jährlich zu übermitteln.
  "50": Hebt die Richtlinie 1999/93/EG mit Wirkung vom 1. Juli 2016 auf; Bezugnahmen auf sie gelten als Bezugnahmen auf diese Verordnung.

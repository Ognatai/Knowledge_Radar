# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
en:
  "1": Lays down uniform requirements for the digital operational resilience of financial entities, covering ICT risk management, incident reporting, resilience testing, information sharing, ICT third-party risk and the oversight of critical ICT third-party service providers.
  "5": Requires financial entities to have an internal governance and control framework for ICT risk and makes the management body ultimately responsible for ICT risk, the resilience strategy, the related budget and the policy on ICT third-party services.
  "16": Exempts small and non-interconnected investment firms, exempted payment and electronic money institutions and small occupational pension institutions from Articles 5 to 15 and subjects them to a simplified ICT risk management framework.
  "19": Requires financial entities to report major ICT-related incidents to their competent authority with an initial notification, an intermediate report and a final report, to inform affected clients, and allows voluntary notification of significant cyber threats.
  "25": Requires the testing programme to include appropriate tests, such as vulnerability scans, source code reviews and penetration tests, and requires central securities depositories and central counterparties to assess vulnerabilities before each deployment.
  "26": Requires financial entities identified by the competent authorities, other than microenterprises and entities under the simplified regime, to carry out threat-led penetration testing (TLPT) on live production systems at least every three years.
  "28": Requires financial entities to manage ICT third-party risk as part of ICT risk while remaining fully responsible, with a third-party risk strategy, a register of information on all ICT contracts, due diligence, termination rights and exit strategies.
  "30": Requires contracts with ICT third-party service providers to be in writing and to contain minimum terms, such as service descriptions, data locations, data protection, cooperation with authorities and termination rights, with further terms for critical or important functions.
  "31": Requires the ESAs, on recommendation of the Oversight Forum, to designate critical ICT third-party service providers based on systemic impact, reliance of systemically important institutions and substitutability, and to appoint a Lead Overseer for each.
  "35": Gives the Lead Overseer powers to request information, conduct investigations and inspections and issue recommendations, and to impose daily periodic penalty payments of up to 1 percent of average daily worldwide turnover for non-compliance.
  "38": Allows the Lead Overseer to investigate critical ICT third-party service providers, examine records, summon representatives and request records of telephone and data traffic.
  "39": Allows the Lead Overseer to conduct on-site and off-site inspections of critical ICT third-party service providers, which must submit to inspections ordered by decision.
  "41": Requires the ESAs to develop draft regulatory technical standards by 17 July 2024 on information to be provided by ICT third-party service providers, the composition of joint examination teams and the assessment of measures taken by critical providers.
  "42": Requires critical ICT third-party service providers to state within 60 calendar days whether they will follow the Lead Overseer's recommendations and allows competent authorities, as a last resort, to require financial entities to suspend or terminate the use of their services.
  "43": Requires the Lead Overseer to charge critical ICT third-party service providers fees that fully cover its oversight costs and are proportionate to their turnover.
  "46": Designates the competent authorities responsible for compliance for each type of financial entity, such as the authorities under the CRD and, for significant credit institutions, the ECB.
  "51": Sets out how competent authorities exercise their sanctioning powers and the factors they must consider, such as the gravity and duration of the breach, financial strength, cooperation and previous breaches.
  "54": Requires competent authorities to publish final decisions imposing administrative penalties on their websites, with deferral, anonymisation or non-publication where publication would be disproportionate.
de:
  "5": Verpflichtet Finanzunternehmen zu einem internen Governance- und Kontrollrahmen für IKT-Risiken und macht das Leitungsorgan letztverantwortlich für das IKT-Risiko, die Strategie für die digitale operationale Resilienz, das Budget und die Leitlinie zu IKT-Drittdienstleistungen.
  "15": Verpflichtet die ESA, über den Gemeinsamen Ausschuss und nach Konsultation der ENISA bis zum 17. Januar 2024 Entwürfe technischer Regulierungsstandards zu weiteren Elementen des IKT-Risikomanagements auszuarbeiten.
  "16": Nimmt kleine und nicht verflochtene Wertpapierfirmen, ausgenommene Zahlungs- und E-Geld-Institute und kleine Einrichtungen der betrieblichen Altersversorgung von den Artikeln 5 bis 15 aus und unterwirft sie einem vereinfachten IKT-Risikomanagementrahmen.
  "19": Verpflichtet Finanzunternehmen, schwerwiegende IKT-bezogene Vorfälle der zuständigen Behörde mit Erstmeldung, Zwischenmeldung und Abschlussmeldung zu melden und betroffene Kunden zu informieren, und erlaubt die freiwillige Meldung erheblicher Cyberbedrohungen.
  "22": Verpflichtet die zuständige Behörde, den Eingang von Meldungen zu bestätigen, erlaubt ihr Rückmeldungen und Orientierungshilfen und verpflichtet die ESA zu einem jährlichen anonymisierten Bericht über schwerwiegende IKT-bezogene Vorfälle.
  "25": Verlangt, dass das Testprogramm geeignete Tests wie Schwachstellenbewertungen, Quellcodeprüfungen und Penetrationstests umfasst, und verpflichtet Zentralverwahrer und zentrale Gegenparteien zu Schwachstellenbewertungen vor jedem Einsatz neuer Anwendungen.
  "26": Verpflichtet die von den zuständigen Behörden bestimmten Finanzunternehmen, mindestens alle drei Jahre bedrohungsorientierte Penetrationstests (TLPT) an Produktionssystemen durchzuführen; Kleinstunternehmen und Unternehmen nach Artikel 16 sind ausgenommen.
  "27": Verpflichtet Finanzunternehmen, für TLPT nur Tester mit höchster Eignung, spezifischem Fachwissen, Zertifizierung oder Verhaltenskodizes und Berufshaftpflichtversicherung einzusetzen, und knüpft den Einsatz interner Tester an die Genehmigung der Behörde.
  "28": Verpflichtet Finanzunternehmen, das IKT-Drittparteienrisiko als Teil des IKT-Risikos zu steuern und dabei voll verantwortlich zu bleiben, mit Strategie, Informationsregister zu allen IKT-Verträgen, Sorgfaltsprüfung, Kündigungsrechten und Ausstiegsstrategien.
  "29": Verpflichtet Finanzunternehmen, bei Verträgen über IKT-Dienstleistungen für kritische oder wichtige Funktionen zu prüfen, ob sie zu nicht leicht ersetzbaren Anbietern oder mehreren Verträgen mit demselben Anbieter führen, und die Unterauftragsvergabe zu bewerten.
  "30": Verlangt, dass Verträge mit IKT-Drittdienstleistern schriftlich Rechte und Pflichten festlegen und Mindestinhalte wie Leistungsbeschreibung, Orte der Datenverarbeitung, Datenschutz, Zusammenarbeit mit Behörden und Kündigungsrechte enthalten, mit weiteren Inhalten für kritische oder wichtige Funktionen.
  "34": Verpflichtet die drei federführenden Überwachungsbehörden, ein gemeinsames Überwachungsnetz (JON) einzurichten, um ihre Überwachungstätigkeiten abzustimmen.
  "35": Gibt der federführenden Überwachungsbehörde Befugnisse zu Auskunftsersuchen, Untersuchungen, Inspektionen und Empfehlungen und erlaubt ihr, bei Nichteinhaltung tägliche Zwangsgelder von bis zu 1 % des durchschnittlichen weltweiten Tagesumsatzes zu verhängen.
  "36": Erlaubt der federführenden Überwachungsbehörde, Auskunfts- und Inspektionsbefugnisse an Standorten kritischer IKT-Drittdienstleister in Drittstaaten auszuüben, wenn der Dienstleister zustimmt und die Behörde des Drittstaats nicht widerspricht.
  "37": Erlaubt der federführenden Überwachungsbehörde, von kritischen IKT-Drittdienstleistern per einfachem Ersuchen oder per Beschluss alle für ihre Aufgaben erforderlichen Informationen zu verlangen, bei Beschlüssen unter Androhung von Zwangsgeldern.
  "38": Erlaubt der federführenden Überwachungsbehörde, kritische IKT-Drittdienstleister zu untersuchen, Unterlagen zu prüfen, Vertreter vorzuladen und Aufzeichnungen von Telefongesprächen und Datenübermittlungen anzufordern.
  "39": Erlaubt der federführenden Überwachungsbehörde, Inspektionen in den Räumlichkeiten kritischer IKT-Drittdienstleister und außerhalb davon durchzuführen; per Beschluss angeordneten Inspektionen müssen sich die Dienstleister unterziehen.
  "42": Verpflichtet kritische IKT-Drittdienstleister, binnen 60 Kalendertagen mitzuteilen, ob sie den Empfehlungen der federführenden Überwachungsbehörde folgen, und erlaubt den zuständigen Behörden als letztes Mittel, Finanzunternehmen die Aussetzung oder Kündigung der Nutzung ihrer Dienste vorzuschreiben.
  "43": Verpflichtet die federführende Überwachungsbehörde, von kritischen IKT-Drittdienstleistern Gebühren zu erheben, die ihre Überwachungskosten vollständig decken und im Verhältnis zum Umsatz stehen.
  "47": Erlaubt den ESA und den zuständigen Behörden, sich an der Kooperationsgruppe nach der Richtlinie (EU) 2022/2555 zu beteiligen und mit den dortigen zentralen Anlaufstellen, CSIRTs und zuständigen Behörden zusammenzuarbeiten.
  "48": Verpflichtet die zuständigen Behörden, eng zusammenzuarbeiten und mit der federführenden Überwachungsbehörde zeitnah alle relevanten Informationen über kritische IKT-Drittdienstleister auszutauschen.
  "53": Verpflichtet die Mitgliedstaaten, der Kommission, der ESMA, der EBA und der EIOPA bis zum 17. Januar 2025 ihre Vorschriften zur Durchführung dieses Kapitels mitzuteilen.
  "54": Verpflichtet die zuständigen Behörden, unanfechtbare Entscheidungen über verwaltungsrechtliche Sanktionen auf ihren Websites zu veröffentlichen, mit Ausnahmen wie Aufschub oder Anonymisierung, wenn die Veröffentlichung unverhältnismäßig wäre.
  "62": Verpflichtet APA, CTP und ARM nach der Verordnung (EU) Nr. 600/2014, die Anforderungen der Verordnung (EU) 2022/2554 an die Sicherheit von Netzwerk- und Informationssystemen zu erfüllen.
  "63": Fügt in Artikel 6 der Verordnung (EU) 2016/1011 einen Absatz an, nach dem Administratoren kritischer Referenzwerte solide Verwaltungs- und Rechnungslegungsverfahren, interne Kontrollen und IKT-Schutzvorkehrungen gemäß der Verordnung (EU) 2022/2554 haben müssen.

# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
en:
  "1": Lays down harmonised rules on making product data and related service data available to users, on making data available to data recipients and public sector bodies, on switching between data processing services and on interoperability.
  "2": Defines the terms used in the Regulation, including data, connected product, related service, user, data holder, data recipient, data processing service, switching, smart contract and interoperability.
  "4": Requires data holders to make readily available data and metadata accessible to the user without undue delay where the user cannot access them directly, subject to limits such as the protection of trade secrets.
  "5": Gives the user the right to have data holders make readily available data and metadata available to a third party, and excludes gatekeepers under the Digital Markets Act as eligible third parties.
  "7": Exempts data generated by connected products or related services of micro and small enterprises from the obligations of Chapter II under certain conditions and makes contractual terms excluding the user's rights non-binding.
  "16": Leaves other obligations to make data available unaffected and excludes activities for preventing and prosecuting criminal or administrative offences and for customs and taxation from the Chapter.
  "20": Requires data holders other than micro and small enterprises to make data available free of charge in a public emergency, and entitles data holders to fair compensation in other cases of exceptional need.
  "31": Exempts data processing services custom-built for an individual customer and not offered at broad commercial scale, as well as test versions, from certain switching obligations.
  "37": Requires each Member State to designate competent authorities to apply and enforce the Regulation and, where it designates several, a data coordinator.
  "41": Requires the Commission to develop and recommend non-binding model contractual terms on data access and use and non-binding standard contractual clauses for cloud computing contracts.
  "42": Gives the European Data Innovation Board (EDIB) the task of supporting the consistent application of the Regulation, in particular by advising the Commission and facilitating cooperation between competent authorities.
  "44": Leaves specific data access obligations in Union acts that entered into force on or before 11 January 2024 unaffected, and allows sector-specific Union law to set further requirements.
  "46": Provides that the Commission is assisted by the committee established by Regulation (EU) 2022/868, a committee within the meaning of Regulation (EU) No 182/2011.
  "49": Requires the Commission to evaluate the Regulation by 12 September 2028 and report the main findings to the European Parliament, the Council and the European Economic and Social Committee.
de:
  "1": Legt harmonisierte Vorschriften fest, unter anderem für die Bereitstellung von Produktdaten und verbundenen Dienstdaten für Nutzer, die Bereitstellung von Daten für Datenempfänger und öffentliche Stellen, den Wechsel zwischen Datenverarbeitungsdiensten und die Interoperabilität.
  "2": Bestimmt die Begriffe der Verordnung, darunter Daten, vernetztes Produkt, verbundener Dienst, Nutzer, Dateninhaber, Datenempfänger, Datenverarbeitungsdienst, Wechsel, intelligenter Vertrag und Interoperabilität.
  "4": Verpflichtet Dateninhaber, dem Nutzer ohne Weiteres verfügbare Daten und Metadaten unverzüglich bereitzustellen, wenn er nicht direkt darauf zugreifen kann, mit Grenzen etwa zum Schutz von Geschäftsgeheimnissen.
  "5": Gibt dem Nutzer das Recht, vom Dateninhaber die Bereitstellung ohne Weiteres verfügbarer Daten und Metadaten an einen Dritten zu verlangen, und schließt Torwächter nach dem Gesetz über digitale Märkte als berechtigte Dritte aus.
  "6": Verpflichtet Dritte, die Daten auf Verlangen des Nutzers erhalten, sie nur für die vereinbarten Zwecke und zu den vereinbarten Bedingungen zu verarbeiten und sie zu löschen, wenn sie nicht mehr benötigt werden.
  "7": Nimmt Daten aus vernetzten Produkten oder verbundenen Diensten von Kleinst- und Kleinunternehmen unter bestimmten Voraussetzungen von den Pflichten des Kapitels II aus und erklärt Vertragsklauseln, die die Rechte der Nutzer ausschließen, für nicht bindend.
  "13": Bestimmt, dass missbräuchliche Vertragsklauseln über Datenzugang und Datennutzung, die ein Unternehmen einem anderen einseitig auferlegt hat, für dieses nicht bindend sind.
  "16": Lässt andere Pflichten zur Bereitstellung von Daten unberührt und nimmt Tätigkeiten zur Verhütung und Verfolgung von Straftaten und Verwaltungsvergehen sowie die Zoll- und Steuerverwaltung vom Kapitel aus.
  "18": Verpflichtet Dateninhaber, Daten auf ein Verlangen nach diesem Kapitel unverzüglich bereitzustellen, unter Berücksichtigung der erforderlichen technischen, organisatorischen und rechtlichen Maßnahmen.
  "20": Verpflichtet Dateninhaber, die keine Kleinst- oder Kleinunternehmen sind, Daten zur Bewältigung eines öffentlichen Notstands unentgeltlich bereitzustellen, und gibt Dateninhabern in anderen Fällen außergewöhnlicher Notwendigkeit Anspruch auf eine faire Gegenleistung.
  "24": Beschränkt die technischen Pflichten auf die Dienste, Verträge und Geschäftspraktiken des ursprünglichen Anbieters von Datenverarbeitungsdiensten.
  "29": Verpflichtet Anbieter von Datenverarbeitungsdiensten, ab dem 12. Januar 2027 keine Wechselentgelte mehr zu erheben, und erlaubt bis dahin nur ermäßigte Wechselentgelte, die die unmittelbaren Kosten nicht übersteigen.
  "31": Nimmt Datenverarbeitungsdienste, die für einzelne Kunden maßgeschneidert sind und nicht in größerem kommerziellem Maßstab angeboten werden, sowie Testversionen von bestimmten Pflichten zum Anbieterwechsel aus.
  "37": Verpflichtet jeden Mitgliedstaat, zuständige Behörden für die Anwendung und Durchsetzung der Verordnung und, wenn er mehrere benennt, einen Datenkoordinator zu benennen.
  "38": Gibt natürlichen und juristischen Personen das Recht, bei der zuständigen Behörde Beschwerde einzulegen, wenn sie ihre Rechte nach dieser Verordnung verletzt sehen.
  "41": Verpflichtet die Kommission, unverbindliche Mustervertragsklauseln für Datenzugang und Datennutzung sowie unverbindliche Standardvertragsklauseln für Cloud-Computing-Verträge auszuarbeiten und zu empfehlen.
  "42": Weist dem Europäischen Dateninnovationsrat (EDIB) die Aufgabe zu, die einheitliche Anwendung der Verordnung zu unterstützen, insbesondere durch Beratung der Kommission und Förderung der Zusammenarbeit der zuständigen Behörden.
  "44": Lässt besondere Pflichten zur Bereitstellung von Daten in Unionsrechtsakten, die bis zum 11. Januar 2024 in Kraft getreten sind, unberührt und erlaubt weitere Anforderungen in sektorspezifischem Unionsrecht.
  "45": Regelt die Ausübung der Befugnis der Kommission zum Erlass delegierter Rechtsakte.
  "46": Bestimmt, dass die Kommission von dem durch die Verordnung (EU) 2022/868 eingesetzten Ausschuss unterstützt wird, einem Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011.
  "49": Verpflichtet die Kommission, die Verordnung bis zum 12. September 2028 zu bewerten und dem Europäischen Parlament, dem Rat und dem Europäischen Wirtschafts- und Sozialausschuss über die wichtigsten Ergebnisse zu berichten.
  "50": Regelt das Inkrafttreten am zwanzigsten Tag nach der Veröffentlichung und den Geltungsbeginn ab dem 12. September 2025, mit gesonderten Terminen für einzelne Pflichten.

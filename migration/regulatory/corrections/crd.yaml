# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
# Review method (190 articles, 105k words per language): each summary was checked against the
# article heading and the opening of the article text in its language; flagged or doubtful
# articles were read further.
en:
  "2": "Applies to institutions and, in part, to financial holding companies, mixed financial holding companies and mixed-activity holding companies, and excludes certain entities such as central banks, post office giro institutions and named national institutions."
  "4a": "Requires Member States to ensure that competent authorities and the members of their governance bodies exercise supervisory powers independently and objectively, without seeking or taking instructions from supervised institutions, Union bodies, governments or other bodies."
  "8a": "Requires undertakings that are credit institutions under point (1)(b) of Article 4(1) of Regulation (EU) No 575/2013 and already hold an authorisation under Directive 2014/65/EU to apply for authorisation as a credit institution once their total assets reach the relevant thresholds."
  "10": "Requires applications for authorisation to include a programme of operations setting out the types of business and the structural organisation and a description of the governance arrangements referred to in Article 74(1)."
  "12": "Requires competent authorities to refuse authorisation where a credit institution does not hold separate own funds or its initial capital is less than EUR 5 million."
  "13": "Requires at least two persons to effectively direct the business of a credit institution and requires its head office to be located in the Member State of its registered office."
  "17": "Prohibits host Member States from requiring authorisation or endowment capital for branches of credit institutions authorised in other Member States."
  "18": "Allows competent authorities to withdraw a credit institution's authorisation only on specified grounds, such as non-use within 12 months, authorisation obtained by false statements, no longer meeting the conditions or serious breaches."
  "20": "Requires competent authorities to notify EBA of every authorisation granted and every withdrawal with the reasons, and requires EBA to publish a list of authorised credit institutions."
  "21": "Allows competent authorities to waive the requirements of Articles 10, 12 and 13(1) for credit institutions permanently affiliated to a central body under Article 10 of Regulation (EU) No 575/2013."
  "21c": "Requires third-country undertakings to establish a branch in a Member State in order to provide banking services there, without prejudice to contracts entered into before 11 July 2026."
  "23": "Requires competent authorities to assess the suitability of the proposed acquirer and the financial soundness of the acquisition against criteria such as reputation, financial soundness, the ability to comply with prudential requirements and money laundering or terrorist financing risks."
  "25": "Requires persons who decide to dispose of a qualifying holding in a credit institution, or to reduce it below certain thresholds, to notify the competent authorities in writing in advance."
  "27": "Determines qualifying holdings by reference to the voting rights and aggregation rules of Directive 2004/109/EC and disregards certain voting rights or shares held temporarily as a result of underwriting."
  "27b": "Requires the competent authority to assess the prospect of sound and prudent management by the proposed acquirer, in particular the risks after the acquisition, its ability to comply with prudential requirements and money laundering or terrorist financing risks."
  "27j": "Requires the competent authority to assess a proposed merger or division against criteria such as reputation, financial soundness, compliance with prudential requirements, the feasibility of the plan and money laundering or terrorist financing risks."
  "36": "Gives the host Member State's competent authorities two months after receiving the notification to prepare for the supervision of a branch before it commences activities, and requires changes to the notified information to be notified at least one month in advance."
  "37": "Requires Member States to inform the Commission and EBA of the number and type of cases in which a notification under Article 35 or Article 36(3) was refused."
  "43": "Allows the host Member State's competent authorities, in emergency situations, to take proportionate precautionary measures against financial instability that seriously threatens depositors, investors and clients in their territory."
  "45": "Requires the home Member State's competent authorities to inform the host Member State's authorities without delay of a withdrawal of authorisation, and the latter to prevent further transactions and safeguard depositors' interests."
  "47": "Prohibits Member States from treating branches of third-country credit institutions more favourably than branches of Union institutions and requires such branches to report certain information to the competent authorities at least annually."
  "48l": "Requires EBA to develop uniform reporting formats and definitions for third-country branches and requires class 1 branches to report at least twice a year and class 2 branches at least annually."
  "54a": "Leaves the European Parliament's powers of investigation under Article 226 TFEU unaffected by Articles 53 and 54."
  "60": "Prohibits the disclosure under Article 59 of information received from other authorities or obtained through on-the-spot checks without the express consent of the competent authorities that disclosed it or carried out the check."
  "66": "Requires Member States to provide for administrative penalties, periodic penalty payments and other measures at least for breaches of authorisation requirements and of the rules on acquisitions or divestitures of material holdings, material transfers, mergers and divisions."
  "67": "Requires Member States to provide for administrative penalties and measures, such as pecuniary penalties, public statements, orders to cease conduct, withdrawal of authorisation and temporary bans on management body members, at least for listed breaches such as false statements or reporting failures."
  "77": "Requires competent authorities to encourage significant institutions to develop internal credit risk assessment capacity and to make greater use of the IRB Approach where their exposures are material and involve many material counterparties."
  "80": "Requires competent authorities to ensure that the risk of recognised credit risk mitigation techniques proving less effective than expected is addressed and controlled, including through written policies and procedures."
  "82": "Requires competent authorities to ensure that risks from securitisations in which credit institutions are investor, originator or sponsor, including reputational risks, are evaluated and addressed through appropriate policies and procedures."
  "83": "Requires competent authorities to ensure that policies and processes identify, measure and manage all material market risks, including liquidity shortage risk from short positions, and that internal capital covers material market risks not subject to an own funds requirement."
  "87": "Requires competent authorities to ensure that institutions have policies and processes to identify, manage and monitor the risk of excessive leverage, using indicators such as the leverage ratio and mismatches between assets and obligations."
  "94": "Lays down principles for variable remuneration, such as performance assessment, deferral, malus and clawback, and caps the variable component at 100 % of the fixed component, or 200 % with shareholder approval."
  "97": "Requires competent authorities to review the arrangements, strategies, processes and mechanisms of institutions and evaluate their risks, including risks revealed by stress testing (supervisory review and evaluation process)."
  "98": "Lays down the technical criteria for the supervisory review and evaluation, such as stress test results and concentration, liquidity, interest rate, leverage and ESG risks, as well as the institution's business model and governance."
  "101": "Requires competent authorities to review regularly, and at least every three years, whether institutions still meet the requirements for internal approaches requiring permission, and to act on material deficiencies."
  "102": "Requires competent authorities to require institutions to take the necessary measures at an early stage where they do not meet the requirements of this Directive or Regulation (EU) No 575/2013 or are likely to breach them within the next 12 months."
  "104": "Gives competent authorities at least the powers to require additional own funds, reinforced arrangements, a plan to restore compliance, restrictions of business, risk reduction and limits on variable remuneration and distributions, among others."
  "104a": "Requires competent authorities to impose an additional own funds requirement where the supervisory review shows that an institution's risks are not sufficiently covered by own funds requirements or that other supervisory measures are insufficient."
  "104b": "Requires institutions to set their internal capital at an adequate level of own funds and allows competent authorities to communicate guidance on additional own funds above the requirements."
  "105": "Requires competent authorities to assess whether a specific liquidity requirement is necessary, taking into account the institution's business model, liquidity arrangements and the outcome of the supervisory review."
  "106": "Requires Member States to empower competent authorities to require institutions to publish certain information more frequently and to set deadlines for submitting disclosure information to EBA."
  "110": "Requires competent authorities to apply the review and evaluation process and supervisory measures at the level of application of the requirements of Regulation (EU) No 575/2013."
  "110a": "Applies this Chapter to investment firm groups in which at least one investment firm is subject to Regulation (EU) No 575/2013 under Article 1(2) or (5) of Regulation (EU) 2019/2033."
  "112": "Requires the consolidating supervisor to coordinate the gathering and dissemination of information and to plan and coordinate supervisory activities in going-concern and emergency situations."
  "116": "Requires the consolidating supervisor to establish colleges of supervisors to facilitate its tasks and to ensure coordination and cooperation, including with third-country supervisory authorities where appropriate."
  "126": "Requires Member States to ensure that administrative penalties or other measures can be imposed on financial holding companies, mixed financial holding companies and mixed-activity holding companies, or their effective managers, for breaches of the rules transposing this Chapter."
  "131": "Requires Member States to designate an authority to identify global systemically important institutions (G-SIIs) and other systemically important institutions (O-SIIs) and lays down the identification methodology and the buffers for these institutions."
  "133": "Requires Member States to make it possible to set a systemic risk buffer of Common Equity Tier 1 capital for the financial sector or subsets of it to prevent and mitigate macroprudential or systemic risks, including those arising from climate change."
  "135": "Allows the ESRB to give guidance by recommendation to designated authorities on setting countercyclical buffer rates, including principles, measurement methods and indicator variables."
  "136": "Requires each Member State to designate an authority that sets the countercyclical buffer rate, calculates a quarterly buffer guide based on the credit-to-GDP ratio and other variables and reviews the rate every quarter."
  "137": "Allows designated authorities to recognise countercyclical buffer rates above 2,5 % set by other designated authorities or third-country authorities for the calculation of institution-specific buffers."
  "138": "Allows the ESRB to recommend to designated authorities an appropriate countercyclical buffer rate for exposures to a third country where the third-country authority has not set a rate or the rate is insufficient."
  "140": "Defines the institution-specific countercyclical buffer rate as the weighted average of the countercyclical buffer rates applicable in the jurisdictions where the institution's relevant credit exposures are located."
  "141": "Prohibits institutions from making distributions that would reduce their Common Equity Tier 1 capital below the combined buffer requirement and requires institutions failing to meet it to calculate the maximum distributable amount and restrict distributions accordingly."
  "141b": "Prohibits institutions from making distributions that would breach the leverage ratio buffer requirement and requires institutions failing to meet it to calculate and notify the leverage ratio related maximum distributable amount."
  "143": "Requires competent authorities to publish the texts of national prudential rules, the exercise of options and discretions in Union law, the criteria for the supervisory review and aggregate statistical data."
  "146": "Provides that changes to the initial capital amounts in Article 12 and Title IV to reflect economic and monetary developments are adopted by implementing act."
  "147": "Provides that the European Banking Committee assists the Commission in adopting implementing acts as a committee within the meaning of Regulation (EU) No 182/2011."
  "150": "Amends Article 21a of Directive 2002/87/EC, under which the ESAs develop draft regulatory technical standards on the calculation methods through the Joint Committee."
  "151": "Provides that this Chapter applies instead of Articles 40, 41, 43, 49, 50 and 51 until the liquidity coverage requirement applies under a delegated act."
  "160": "Phased in the capital conservation buffer and the countercyclical buffer during a transitional period from 1 January 2016 to 31 December 2018."
  "162": "Required Member States to adopt and publish the transposition measures by 31 December 2013 and to apply them from 1 January 2014."
  "164": "Provides that the Directive enters into force on the twentieth day following its publication in the Official Journal of the European Union."
  "165": "Provides that the Directive is addressed to the Member States."
de:
  "1": "Legt Vorschriften über den Zugang zur Tätigkeit von Kreditinstituten, die Aufsichtsbefugnisse und -instrumente, die mit der Verordnung (EU) Nr. 575/2013 übereinstimmende Beaufsichtigung und die Veröffentlichungspflichten der zuständigen Behörden fest."
  "2": "Gilt für Institute, teilweise auch für Finanzholdinggesellschaften, gemischte Finanzholdinggesellschaften und gemischte Holdinggesellschaften, und nimmt bestimmte Einrichtungen wie Zentralbanken, Postscheckämter und benannte nationale Institute aus."
  "3": "Bestimmt die Begriffe der Richtlinie, etwa Kreditinstitut, Wertpapierfirma, Leitungsorgan und Geschäftsleitung, meist durch Verweis auf die Verordnung (EU) Nr. 575/2013."
  "4": "Verpflichtet die Mitgliedstaaten, die zuständigen Behörden zu benennen, die die Aufgaben nach dieser Richtlinie und der Verordnung (EU) Nr. 575/2013 wahrnehmen."
  "4a": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass die zuständigen Behörden und die Mitglieder ihrer Führungsorgane ihre Aufsichtsbefugnisse unabhängig und objektiv ausüben, ohne Weisungen von beaufsichtigten Instituten, Einrichtungen der Union, Regierungen oder anderen Stellen einzuholen oder entgegenzunehmen."
  "6": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass die zuständigen Behörden im Europäischen Finanzaufsichtssystem vertrauensvoll und in gegenseitigem Respekt zusammenarbeiten und einander Informationen weitergeben."
  "7": "Verpflichtet die zuständigen Behörden, die möglichen Auswirkungen ihrer Entscheidungen auf die Stabilität des Finanzsystems in anderen Mitgliedstaaten zu berücksichtigen, besonders in Krisensituationen."
  "8a": "Verpflichtet Unternehmen, die Kreditinstitute im Sinne des Artikels 4 Absatz 1 Nummer 1 Buchstabe b der Verordnung (EU) Nr. 575/2013 sind und bereits eine Zulassung nach der Richtlinie 2014/65/EU haben, spätestens bei Erreichen bestimmter Schwellenwerte der Bilanzsumme eine Zulassung als Kreditinstitut zu beantragen."
  "10": "Verlangt, dass dem Zulassungsantrag ein Geschäftsplan mit der Art der geplanten Geschäfte und dem organisatorischen Aufbau sowie eine Beschreibung der Regelungen nach Artikel 74 Absatz 1 beigefügt wird."
  "11": "Verbietet den Mitgliedstaaten vorzuschreiben, dass der Zulassungsantrag nach den wirtschaftlichen Bedürfnissen des Marktes geprüft wird."
  "13": "Erlaubt die Zulassung nur, wenn mindestens zwei Personen die Geschäfte tatsächlich leiten, und verlangt, dass sich die Hauptverwaltung im Mitgliedstaat des Sitzes befindet."
  "15": "Verpflichtet die zuständige Behörde, die Verweigerung einer Zulassung binnen sechs Monaten nach Eingang des vollständigen Antrags mit Gründen mitzuteilen und in jedem Fall binnen zwölf Monaten zu entscheiden."
  "17": "Verbietet den Aufnahmemitgliedstaaten, für Zweigstellen von in anderen Mitgliedstaaten zugelassenen Kreditinstituten eine Zulassung oder Dotationskapital zu verlangen."
  "18": "Erlaubt den zuständigen Behörden, die Zulassung nur aus bestimmten Gründen zu entziehen, etwa bei Nichtnutzung binnen zwölf Monaten, Erschleichung durch falsche Angaben, Wegfall der Zulassungsvoraussetzungen oder schweren Verstößen."
  "21a": "Verpflichtet Mutterfinanzholdinggesellschaften und gemischte Mutterfinanzholdinggesellschaften, eine Zulassung zu beantragen und Angaben zu Gruppenstruktur, Unternehmensführung und Einhaltung der Aufsichtsanforderungen vorzulegen."
  "21c": "Verpflichtet Unternehmen aus Drittländern, für die Erbringung von Bankdienstleistungen in einem Mitgliedstaat eine Zweigstelle zu errichten; Verträge, die vor dem 11. Juli 2026 geschlossen wurden, bleiben unberührt."
  "23": "Verpflichtet die zuständigen Behörden, die Eignung des interessierten Erwerbers und die finanzielle Solidität des Erwerbs anhand von Kriterien wie Leumund, finanzieller Solidität, Einhaltung der Aufsichtsanforderungen und Risiken der Geldwäsche oder Terrorismusfinanzierung zu beurteilen."
  "27": "Bestimmt, dass für qualifizierte Beteiligungen die Stimmrechte und Zurechnungsregeln der Richtlinie 2004/109/EG gelten und bestimmte vorübergehend im Rahmen einer Emissionsübernahme gehaltene Stimmrechte oder Anteile unberücksichtigt bleiben."
  "27h": "Bestimmt die Begriffe Verschmelzung und Spaltung und nimmt Verschmelzungen und Spaltungen, die sich aus der Anwendung der Richtlinie 2014/59/EU ergeben, von diesem Kapitel aus."
  "27j": "Verpflichtet die zuständige Behörde, den geplanten Vorgang anhand von Kriterien wie Leumund, finanzieller Solidität, Erfüllung der Aufsichtsanforderungen, Realisierbarkeit des Plans und Risiken der Geldwäsche oder Terrorismusfinanzierung zu beurteilen."
  "27k": "Verpflichtet die zuständige Behörde, die Aufsichtsbehörden anderer betroffener Unternehmen der Finanzbranche zu konsultieren, wenn solche Unternehmen an dem geplanten Vorgang beteiligt sind."
  "36": "Gibt den zuständigen Behörden des Aufnahmemitgliedstaats zwei Monate nach Eingang der Angaben, um die Beaufsichtigung der Zweigstelle vorzubereiten, und verpflichtet das Kreditinstitut, Änderungen der Angaben mindestens einen Monat vorher mitzuteilen."
  "37": "Verpflichtet die Mitgliedstaaten, der Kommission und der EBA Anzahl und Art der Fälle mitzuteilen, in denen eine Anzeige nach Artikel 35 oder Artikel 36 Absatz 3 abgelehnt wurde."
  "38": "Bestimmt, dass mehrere Betriebsstellen eines Kreditinstituts mit Sitz in einem anderen Mitgliedstaat im selben Mitgliedstaat als eine einzige Zweigstelle gelten."
  "39": "Verpflichtet Kreditinstitute, vor der erstmaligen Ausübung ihrer Tätigkeit im Rahmen des freien Dienstleistungsverkehrs in einem anderen Mitgliedstaat den zuständigen Behörden des Herkunftsmitgliedstaats die geplanten Tätigkeiten nach Anhang I anzuzeigen."
  "40": "Erlaubt den zuständigen Behörden des Aufnahmemitgliedstaats, von Kreditinstituten mit Zweigstellen in ihrem Hoheitsgebiet regelmäßige Berichte über ihre dortigen Tätigkeiten zu verlangen."
  "41": "Verpflichtet die zuständigen Behörden des Aufnahmemitgliedstaats, die Behörden des Herkunftsmitgliedstaats über Verstöße oder Risiken eines Kreditinstituts bei seinen dortigen Tätigkeiten zu unterrichten, und diese, umgehend Abhilfemaßnahmen zu ergreifen."
  "45": "Verpflichtet die zuständigen Behörden des Herkunftsmitgliedstaats, die Behörden des Aufnahmemitgliedstaats unverzüglich über einen Entzug der Zulassung zu unterrichten, und diese, weitere Geschäfte des Kreditinstituts zu verhindern und die Interessen der Einleger zu schützen."
  "46": "Erlaubt Kreditinstituten mit Sitz in einem anderen Mitgliedstaat, ihre Dienstleistungen im Aufnahmemitgliedstaat über alle verfügbaren Kommunikationskanäle zu bewerben, vorbehaltlich der Vorschriften über Form und Inhalt der Werbung."
  "47": "Verbietet den Mitgliedstaaten, Zweigstellen von Kreditinstituten aus Drittländern günstiger zu behandeln als Zweigstellen von Kreditinstituten aus der Union, und verlangt von ihnen, bestimmte Informationen mindestens jährlich zu melden."
  "48k": "Verpflichtet Zweigstellen aus Drittländern, ihren zuständigen Behörden regelmäßig Angaben zu Vermögenswerten und Verbindlichkeiten, zur Einhaltung der Anforderungen, zur Einlagensicherung und zum Unternehmen an der Spitze zu übermitteln."
  "48l": "Verpflichtet die EBA, einheitliche Meldeformate und Begriffsbestimmungen für Zweigstellen aus Drittländern auszuarbeiten, und legt fest, dass Zweigstellen der Klasse 1 mindestens zweimal jährlich und der Klasse 2 mindestens einmal jährlich melden."
  "54": "Erlaubt den zuständigen Behörden, vertrauliche Informationen nur für bestimmte Zwecke zu verwenden, etwa die Prüfung der Zulassungsvoraussetzungen, die Überwachung der Tätigkeit, die Verhängung von Sanktionen und Gerichtsverfahren."
  "56": "Erlaubt den Informationsaustausch zwischen zuständigen Behörden und bestimmten anderen Stellen, etwa den Aufsichtsbehörden anderer Unternehmen der Finanzbranche, im Rahmen ihrer Aufsichtsaufgaben."
  "57": "Verpflichtet die Mitgliedstaaten, den Informationsaustausch zwischen den zuständigen Behörden und den Behörden zu ermöglichen, die etwa Abwicklungs- und Insolvenzstellen, Sicherungssysteme und Abschlussprüfer beaufsichtigen."
  "59": "Erlaubt den Mitgliedstaaten, die Weitergabe bestimmter Informationen an andere zentralstaatliche Dienststellen und deren Inspektoren zuzulassen, wenn dies aus Aufsichtsgründen oder für Präventiv- und Abwicklungsmaßnahmen erforderlich ist."
  "60": "Verbietet die Weitergabe von Informationen aus Nachprüfungen vor Ort und Inspektionen nach Artikel 59 ohne ausdrückliche Zustimmung der zuständigen Behörden, die sie übermittelt oder die Prüfung durchgeführt haben."
  "61": "Erlaubt den zuständigen Behörden, Informationen an Clearingstellen oder ähnliche Stellen weiterzugeben, wenn dies für deren ordnungsgemäßes Funktionieren erforderlich ist."
  "63": "Verpflichtet die Abschlussprüfer von Instituten, den zuständigen Behörden umgehend Tatsachen oder Entscheidungen zu melden, die einen schwerwiegenden Verstoß darstellen, die Fortführung des Instituts beeinträchtigen oder zur Verweigerung des Bestätigungsvermerks führen können."
  "67": "Verpflichtet die Mitgliedstaaten, mindestens für bestimmte Verstöße wie falsche Angaben bei der Zulassung oder unterlassene Meldungen Verwaltungssanktionen und -maßnahmen vorzusehen, etwa Geldbußen, öffentliche Bekanntmachungen, Unterlassungsanordnungen, den Entzug der Zulassung und Tätigkeitsverbote."
  "69": "Verpflichtet die zuständigen Behörden, die EBA über alle Verwaltungssanktionen zu unterrichten, und die EBA, eine nur den Behörden zugängliche zentrale Datenbank zu führen."
  "71": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass die zuständigen Behörden wirksame Mechanismen zur Meldung von Verstößen schaffen und Institute interne Meldeverfahren über einen unabhängigen Kanal einrichten."
  "76": "Verpflichtet das Leitungsorgan, die Strategien und Grundsätze für die Steuerung der Risiken, einschließlich makroökonomischer und ESG-Risiken, zu genehmigen und mindestens alle zwei Jahre zu überprüfen."
  "77": "Verpflichtet die zuständigen Behörden, bedeutende Institute anzuhalten, interne Kapazitäten zur Kreditrisikobewertung zu entwickeln und den IRB-Ansatz verstärkt zu nutzen, wenn sie wesentliche Risikopositionen gegenüber vielen bedeutenden Gegenparteien haben."
  "78": "Verpflichtet die zuständigen Behörden sicherzustellen, dass Institute mit internen Ansätzen oder dem alternativen Standardansatz ihre Berechnungsergebnisse für Referenzportfolios melden."
  "79": "Verpflichtet die zuständigen Behörden sicherzustellen, dass die Kreditvergabe auf soliden Kriterien beruht und die Institute über interne Methoden zur Bewertung des Kreditrisikos verfügen, die sich nicht ausschließlich auf externe Bonitätsbeurteilungen stützen."
  "80": "Verpflichtet die zuständigen Behörden sicherzustellen, dass das Risiko einer geringeren Wirksamkeit anerkannter Kreditrisikominderungstechniken unter anderem durch schriftliche Grundsätze und Verfahren erfasst und gesteuert wird."
  "81": "Verpflichtet die zuständigen Behörden sicherzustellen, dass das Konzentrationsrisiko aus Risikopositionen gegenüber Gegenparteien, auch zentralen Gegenparteien, und aus Kryptowerten durch schriftliche Grundsätze und Verfahren erfasst und gesteuert wird."
  "82": "Verpflichtet die zuständigen Behörden sicherzustellen, dass Risiken aus Verbriefungen, bei denen Kreditinstitute Anleger, Originator oder Sponsor sind, einschließlich Reputationsrisiken, durch angemessene Grundsätze und Verfahren bewertet und erfasst werden."
  "83": "Verpflichtet die zuständigen Behörden sicherzustellen, dass Grundsätze und Verfahren zur Ermittlung, Messung und Steuerung aller wesentlichen Marktrisiken bestehen und das interne Kapital wesentliche Marktrisiken ohne Eigenmittelanforderung abdeckt."
  "85": "Verpflichtet die zuständigen Behörden sicherzustellen, dass die Institute Grundsätze und Verfahren zur Beurteilung und Steuerung operationeller Risiken anwenden, auch aus Auslagerungsvereinbarungen und Risikopositionen in Kryptowerten."
  "86": "Verpflichtet die zuständigen Behörden sicherzustellen, dass die Institute solide Strategien, Grundsätze, Verfahren und Systeme haben, um das Liquiditätsrisiko über angemessene Zeiträume einschließlich untertägig zu ermitteln, zu messen, zu steuern und zu überwachen."
  "87": "Verpflichtet die zuständigen Behörden sicherzustellen, dass die Institute Grundsätze und Verfahren zur Ermittlung, Steuerung und Überwachung des Risikos einer übermäßigen Verschuldung haben, mit Indikatoren wie der Verschuldungsquote."
  "87a": "Verpflichtet die zuständigen Behörden sicherzustellen, dass die Institute belastbare Strategien, Grundsätze, Verfahren und Systeme zur Ermittlung, Messung, Steuerung und Überwachung von ESG-Risiken auf kurze, mittlere und lange Sicht haben."
  "89": "Verpflichtet die Mitgliedstaaten, von jedem Institut seit dem 1. Januar 2015 die jährliche Offenlegung bestimmter Angaben auf konsolidierter Basis, aufgeschlüsselt nach Mitgliedstaaten und Drittländern, zu verlangen, etwa Umsatz, Beschäftigte, Gewinn und Steuern."
  "91": "Verpflichtet die Unternehmen sicherzustellen, dass die Mitglieder des Leitungsorgans jederzeit gut beleumundet, aufrichtig und integer sind und über ausreichende Kenntnisse, Fähigkeiten und Erfahrung verfügen, und ihre Eignung vor Amtsantritt und regelmäßig zu beurteilen."
  "93": "Verlangt von Instituten, die eine außerordentliche staatliche Unterstützung erhalten, die variable Vergütung strikt zu begrenzen und ihre Vergütung im Einklang mit solidem Risikomanagement und langfristigem Wachstum umzugestalten."
  "94": "Legt Grundsätze für variable Vergütungsbestandteile fest, etwa Leistungsbeurteilung, Zurückbehaltung, Malus und Rückforderung, und begrenzt die variable Vergütung auf 100 % der festen Vergütung, mit Zustimmung der Anteilseigner auf bis zu 200 %."
  "100": "Verpflichtet die zuständigen Behörden, bei den beaufsichtigten Instituten mindestens jährlich aufsichtliche Stresstests durchzuführen, um die Überprüfung und Bewertung nach Artikel 97 zu erleichtern."
  "102": "Verpflichtet die zuständigen Behörden, von einem Institut frühzeitig Abhilfemaßnahmen zu verlangen, wenn es die Anforderungen dieser Richtlinie oder der Verordnung (EU) Nr. 575/2013 nicht erfüllt oder voraussichtlich gegen sie verstoßen wird."
  "104": "Gibt den zuständigen Behörden mindestens die Befugnisse, zusätzliche Eigenmittel, verstärkte Regelungen und einen Plan zur Wiederherstellung der Anforderungen zu verlangen, Geschäfte zu beschränken, Risiken zu verringern und variable Vergütung und Ausschüttungen zu begrenzen."
  "104c": "Verpflichtet die zuständigen Behörden, die Abwicklungsbehörden über die zusätzliche Eigenmittelanforderung und über Empfehlungen für zusätzliche Eigenmittel zu unterrichten."
  "106": "Verpflichtet die Mitgliedstaaten, die zuständigen Behörden zu ermächtigen, von Instituten häufigere Veröffentlichungen bestimmter Informationen zu verlangen und Fristen für die Übermittlung von Offenlegungsinformationen an die EBA festzulegen."
  "107": "Verpflichtet die zuständigen Behörden, die EBA über ihren Überprüfungs- und Bewertungsprozess und ihre Methoden zu unterrichten, und die EBA, diese Informationen im Interesse einer einheitlichen Aufsichtspraxis auszuwerten."
  "108": "Verlangt, dass Institute, die weder Tochter- noch Mutterunternehmen oder nicht in die Konsolidierung einbezogen sind, die Pflichten nach Artikel 73 auf Einzelbasis erfüllen, und regelt die Anwendung auf konsolidierter oder teilkonsolidierter Basis."
  "110": "Verpflichtet die zuständigen Behörden, die Überprüfung und Bewertung und die Aufsichtsmaßnahmen auf der in der Verordnung (EU) Nr. 575/2013 vorgesehenen Anwendungsebene durchzuführen."
  "114": "Verpflichtet die konsolidierende Aufsichtsbehörde, in einer Krisensituation so rasch wie möglich die EBA und die in Artikel 58 Absatz 4 und Artikel 59 genannten Behörden zu alarmieren und ihnen alle wesentlichen Informationen zu übermitteln."
  "115": "Verpflichtet die konsolidierende Aufsichtsbehörde und die anderen zuständigen Behörden, schriftliche Koordinierungs- und Kooperationsvereinbarungen für eine wirksame Aufsicht zu schließen."
  "116a": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass bestimmte Informationen, etwa veröffentlichte Verwaltungssanktionen, ab dem 10. Januar 2030 über das zentrale europäische Zugangsportal zugänglich sind."
  "117": "Verpflichtet die zuständigen Behörden, eng zusammenzuarbeiten und einander alle für ihre Aufsichtsaufgaben wesentlichen oder zweckdienlichen Informationen zu übermitteln."
  "120": "Erlaubt der konsolidierenden Aufsichtsbehörde, auf eine gemischte Finanzholdinggesellschaft, die gleichwertigen Bestimmungen dieser Richtlinie und der Richtlinie 2002/87/EG unterliegt, nach Konsultation der anderen Behörden nur die Richtlinie 2002/87/EG anzuwenden."
  "126": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass gegen Finanzholdinggesellschaften, gemischte Finanzholdinggesellschaften und gemischte Holdinggesellschaften oder ihre Geschäftsleiter bei Verstößen gegen die Umsetzungsvorschriften dieses Kapitels Verwaltungssanktionen oder andere Maßnahmen verhängt werden können."
  "128": "Bestimmt die Begriffe dieses Kapitels, etwa Kapitalerhaltungspuffer, institutsspezifischer antizyklischer Kapitalpuffer, G-SRI-Puffer, A-SRI-Puffer, Systemrisikopuffer und kombinierte Kapitalpufferanforderung."
  "129": "Verpflichtet die Institute, zusätzlich zum harten Kernkapital für die Eigenmittelanforderungen nach Artikel 92 Absatz 1 der Verordnung (EU) Nr. 575/2013 einen Kapitalerhaltungspuffer aus hartem Kernkapital von 2,5 % ihres Gesamtrisikobetrags vorzuhalten."
  "131": "Verpflichtet die Mitgliedstaaten, eine Behörde zu benennen, die global systemrelevante Institute (G-SRI) und andere systemrelevante Institute (A-SRI) ermittelt, und regelt die Methode und die Puffer für diese Institute."
  "133": "Verpflichtet die Mitgliedstaaten sicherzustellen, dass ein Systemrisikopuffer aus hartem Kernkapital für die Finanzbranche oder Teilbereiche festgelegt werden kann, um Makroaufsichts- oder Systemrisiken, auch aus dem Klimawandel, zu vermeiden und zu mindern."
  "135": "Erlaubt dem ESRB, den benannten Behörden durch Empfehlungen Orientierungen zur Festlegung der Quote für den antizyklischen Kapitalpuffer zu geben."
  "136": "Verpflichtet jeden Mitgliedstaat, eine Behörde zu benennen, die die Quote des antizyklischen Kapitalpuffers festsetzt, vierteljährlich einen Pufferrichtwert berechnet und die Quote vierteljährlich überprüft."
  "138": "Erlaubt dem ESRB, den benannten Behörden eine angemessene Quote des antizyklischen Kapitalpuffers für Risikopositionen in einem Drittland zu empfehlen, wenn die Drittlandsbehörde keine Quote festgelegt hat oder diese nicht ausreicht."
  "141": "Verbietet Instituten Ausschüttungen, durch die ihr hartes Kernkapital unter die kombinierte Kapitalpufferanforderung fiele, und verpflichtet Institute, die sie nicht erfüllen, den ausschüttungsfähigen Höchstbetrag zu berechnen und der zuständigen Behörde zu melden."
  "141b": "Verbietet Instituten Ausschüttungen, durch die die Anforderung an den Puffer der Verschuldungsquote nicht mehr erfüllt wäre, und verpflichtet Institute, die sie nicht erfüllen, den entsprechenden ausschüttungsfähigen Höchstbetrag zu berechnen und zu melden."
  "142": "Verpflichtet ein Institut, das die kombinierte Kapitalpufferanforderung oder die Anforderung an den Puffer der Verschuldungsquote nicht erfüllt, binnen fünf Arbeitstagen einen Kapitalerhaltungsplan vorzulegen."
  "143": "Verpflichtet die zuständigen Behörden, die nationalen Aufsichtsvorschriften, die Ausübung von Wahlrechten und Ermessensspielräumen, die Kriterien der aufsichtlichen Überprüfung und aggregierte statistische Daten zu veröffentlichen."
  "146": "Bestimmt, dass Änderungen des Anfangskapitals nach Artikel 12 und Titel IV zur Berücksichtigung wirtschaftlicher und geldpolitischer Entwicklungen durch Durchführungsrechtsakt erlassen werden."
  "147": "Bestimmt, dass der Europäische Bankenausschuss die Kommission beim Erlass von Durchführungsrechtsakten als Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011 unterstützt."
  "148": "Regelt die Übertragung der Befugnis zum Erlass delegierter Rechtsakte an die Kommission auf unbestimmte Zeit ab dem 17. Juli 2013 sowie den Widerruf der Befugnisübertragung und das Inkrafttreten delegierter Rechtsakte."
  "149": "Legt fest, dass das Europäische Parlament und der Rat binnen eines Monats Einwände gegen einen technischen Regulierungsstandard erheben können, der dem Entwurf der EBA entspricht, mit Verlängerung um einen Monat auf Initiative eines der Organe."
  "150": "Ändert Artikel 21a der Richtlinie 2002/87/EG, wonach die ESA über den Gemeinsamen Ausschuss Entwürfe technischer Regulierungsstandards zu den Berechnungsmethoden ausarbeiten."
  "151": "Bestimmt, dass dieses Kapitel bis zur Geltung der Liquiditätsdeckungsanforderung anstelle der Artikel 40, 41, 43, 49, 50 und 51 gilt, und erlaubt der Kommission, diesen Zeitpunkt zu verschieben."
  "152": "Erlaubt den Aufnahmemitgliedstaaten, für statistische Zwecke von Kreditinstituten mit Zweigstellen in ihrem Hoheitsgebiet regelmäßige Berichte über ihre dortigen Tätigkeiten zu verlangen."
  "157": "Verpflichtet die zuständigen Behörden, bei der Beaufsichtigung von Instituten mit Zweigstellen in anderen Mitgliedstaaten eng zusammenzuarbeiten und einander die dafür erforderlichen Informationen zu übermitteln."
  "159a": "Verpflichtete Mutterfinanzholdinggesellschaften und gemischte Mutterfinanzholdinggesellschaften, die am 27. Juni 2019 bereits bestanden, bis zum 28. Juni 2021 die Zulassung nach Artikel 21a zu beantragen."
  "161": "Verpflichtet die Kommission, die Anwendung der Richtlinie regelmäßig daraufhin zu überprüfen, dass sie nicht zu einer offenkundigen Diskriminierung von Instituten aufgrund ihrer Rechtsstruktur oder ihres Eigentümermodells führt."
  "162": "Verpflichtete die Mitgliedstaaten, die Umsetzungsvorschriften bis zum 31. Dezember 2013 zu erlassen und ab dem 1. Januar 2014 anzuwenden."
  "163": "Hebt die Richtlinien 2006/48/EG und 2006/49/EG mit Wirkung vom 1. Januar 2014 auf; Verweisungen gelten als Verweisungen auf diese Richtlinie und die Verordnung (EU) Nr. 575/2013."
  "164": "Bestimmt, dass die Richtlinie am zwanzigsten Tag nach ihrer Veröffentlichung im Amtsblatt der Europäischen Union in Kraft tritt."

# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
# Summarised text: OJ version of 20.11.2024. Article 104 of Regulation (EU) 2025/327 (EHDS)
# later replaced Art. 13(4) and inserted Art. 32(5a) (EHR systems); this is covered in the frame.
en:
  "2": Applies to products with digital elements whose intended or reasonably foreseeable use includes a data connection to a device or network; medical devices, motor vehicles, certified aviation products, marine equipment and defence products are excluded.
  "5": Allows Member States to impose additional cybersecurity requirements for procurement or use for specific purposes, and requires them to take the essential cybersecurity requirements and vulnerability handling into account in public procurement.
  "6": Allows products with digital elements to be made available only if they meet the essential cybersecurity requirements of Part I of Annex I and the manufacturer's processes comply with Part II of Annex I.
  "7": Classifies products with the core functionality of a category in Annex III, divided into classes I and II, as important products with digital elements subject to stricter conformity assessment, and sets the criteria for these categories.
  "10": Requires Member States, supported where appropriate by the Commission, the European Cybersecurity Competence Centre and ENISA, to promote measures to develop cybersecurity skills and collaboration in support of the Regulation's implementation.
  "11": Applies parts of the General Product Safety Regulation (EU) 2023/988 to products with digital elements for aspects and risks not covered by this Regulation, unless other Union harmonisation legislation sets specific safety requirements.
  "12": Deems high-risk AI systems that are products with digital elements to meet the cybersecurity requirements of Article 15 of the AI Act if they fulfil the essential cybersecurity requirements of Annex I and this is demonstrated in the EU declaration of conformity.
  "13": Sets out manufacturers' obligations, including a documented cybersecurity risk assessment, due diligence for third-party components, vulnerability handling during a support period of generally at least five years, technical documentation, conformity assessment and CE marking.
  "14": Requires manufacturers to notify actively exploited vulnerabilities and severe incidents simultaneously to the CSIRT designated as coordinator and ENISA via the single reporting platform, with an early warning within 24 hours and a notification within 72 hours.
  "17": Allows notified information to be shared with EU-CyCLONe and the public to be informed of severe incidents, and requires ENISA to report on emerging risks every 24 months and add fixed vulnerabilities to the European vulnerability database.
  "18": Allows manufacturers to appoint an authorised representative by written mandate, which must at least cover keeping documentation available, providing information to and cooperating with market surveillance authorities.
  "26": Requires the Commission to publish guidance on applying the Regulation, with a particular focus on microenterprises and SMEs, covering scope, support periods, interaction with other Union law and substantial modification.
  "27": Presumes conformity with the essential cybersecurity requirements for products and processes that comply with harmonised standards, common specifications or European cybersecurity certification schemes, and allows the Commission to adopt common specifications where standards are lacking.
  "30": Requires the CE marking to be affixed visibly, legibly and indelibly to the product or, where that is not possible, to its packaging and EU declaration of conformity, and for software to the declaration or the accompanying website.
  "32": Requires manufacturers to assess conformity using internal control, EU-type examination, full quality assurance or a certification scheme, with third-party procedures required for class II important products, for class I without harmonised standards, and for critical products.
  "33": Requires Member States, where appropriate, to support microenterprises and small enterprises through awareness-raising, dedicated communication channels and testing support, allows cyber resilience regulatory sandboxes and lets small firms use simplified technical documentation.
  "36": Requires each Member State to designate a notifying authority responsible for assessing, designating, notifying and monitoring conformity assessment bodies.
  "39": Sets out requirements for notified bodies, including legal personality, independence from the products they assess, technical competence, impartiality, liability insurance and professional secrecy.
  "46": Requires the Commission to investigate doubts about the competence of a notified body, obliges the notifying Member State to provide information and allows the Commission to request corrective measures, including de-notification.
  "48": Requires Member States to ensure that an appeal procedure against decisions of notified bodies is available.
  "50": Requires the Commission to organise the exchange of experience between the national authorities responsible for notification policy.
  "51": Requires the Commission to ensure coordination between notified bodies through a cross-sectoral group, in whose work Member States must ensure their notified bodies participate.
  "52": Applies the Market Surveillance Regulation (EU) 2019/1020, requires Member States to designate market surveillance authorities, which also supervise open-source software stewards, and establishes ADCO, which monitors support periods.
  "55": Requires the Commission, where a Member State objects to a national measure or the Commission considers it contrary to Union law, to consult and decide within nine months whether the measure is justified.
  "60": Requires market surveillance authorities to conduct simultaneous coordinated control actions (sweeps) of particular products or categories, coordinated in principle by the Commission and possibly using purchases under a cover identity.
  "63": Requires all parties involved in applying the Regulation to keep information confidential, protecting in particular trade secrets including source code, inspections and investigations, security interests and the integrity of proceedings.
  "64": Requires Member States to lay down penalties, with fines of up to 15 million euros or 2.5 percent of worldwide turnover for breaches of the essential requirements and of Articles 13 and 14, and lower caps for other breaches.
  "69": Applies the Regulation to products placed on the market before 11 December 2027 only if they are substantially modified afterwards, except for the reporting obligations of Article 14, and keeps existing certificates valid until 11 June 2028.
  "71": Provides for entry into force on the twentieth day after publication and application from 11 December 2027, with the reporting obligations of Article 14 applying from 11 September 2026 and Chapter IV from 11 June 2026.
de:
  "1": Legt Vorschriften für die Bereitstellung von Produkten mit digitalen Elementen auf dem Markt, grundlegende Cybersicherheitsanforderungen an Konzeption, Entwicklung, Herstellung und Behandlung von Schwachstellen, Pflichten der Wirtschaftsakteure und die Marktüberwachung fest.
  "4": Verbietet den Mitgliedstaaten, die Bereitstellung konformer Produkte zu behindern, und erlaubt die Präsentation nicht konformer Produkte auf Messen sowie unfertige Software für Tests, wenn sie deutlich als nicht konform gekennzeichnet sind.
  "5": Erlaubt den Mitgliedstaaten zusätzliche Cybersicherheitsanforderungen für Beschaffung oder Nutzung zu bestimmten Zwecken und verpflichtet sie, bei der Beschaffung die grundlegenden Cybersicherheitsanforderungen einschließlich der Behandlung von Schwachstellen zu berücksichtigen.
  "6": Erlaubt die Bereitstellung von Produkten mit digitalen Elementen auf dem Markt nur, wenn sie die grundlegenden Cybersicherheitsanforderungen des Anhangs I Teil I erfüllen und die Verfahren des Herstellers Anhang I Teil II entsprechen.
  "7": Stuft Produkte mit der Kernfunktion einer Produktkategorie aus Anhang III, unterteilt in die Klassen I und II, als wichtige Produkte mit digitalen Elementen ein, für die strengere Konformitätsbewertungsverfahren gelten.
  "9": Verpflichtet die Kommission, bei der Vorbereitung von Durchführungsmaßnahmen die einschlägigen Interessenträger zu konsultieren, darunter Unternehmen, die Open-Source-Gemeinschaft und Verbraucherverbände, und mindestens einmal jährlich Konsultationen zu veranstalten.
  "10": Verpflichtet die Mitgliedstaaten, gegebenenfalls mit Unterstützung der Kommission, des Europäischen Kompetenzzentrums für Cybersicherheit und der ENISA, Maßnahmen zum Aufbau von Cybersicherheitskompetenzen und zur Zusammenarbeit zwischen Privatsektor, Wirtschaftsakteuren und Verwaltung zu fördern.
  "11": Wendet Teile der Verordnung (EU) 2023/988 über die allgemeine Produktsicherheit auf Produkte mit digitalen Elementen an, soweit es um Aspekte und Risiken geht, die diese Verordnung nicht abdeckt, und keine anderen Harmonisierungsrechtsvorschriften gelten.
  "12": Lässt Produkte mit digitalen Elementen, die als Hochrisiko-KI-Systeme eingestuft sind, als konform mit den Cybersicherheitsanforderungen des Artikels 15 der Verordnung (EU) 2024/1689 gelten, wenn sie die grundlegenden Cybersicherheitsanforderungen des Anhangs I erfüllen und dies in der EU-Konformitätserklärung nachgewiesen wird.
  "13": Legt die Pflichten der Hersteller fest, darunter eine dokumentierte Bewertung der Cybersicherheitsrisiken, Sorgfalt bei Komponenten Dritter, die Behandlung von Schwachstellen während eines Unterstützungszeitraums von grundsätzlich mindestens fünf Jahren, technische Dokumentation, Konformitätsbewertung und CE-Kennzeichnung.
  "14": Verpflichtet die Hersteller, aktiv ausgenutzte Schwachstellen und schwerwiegende Sicherheitsvorfälle gleichzeitig dem als Koordinator benannten CSIRT und der ENISA über die einheitliche Meldeplattform zu melden, mit Frühwarnung binnen 24 Stunden und Meldung binnen 72 Stunden.
  "15": Erlaubt Herstellern und anderen Personen, Schwachstellen, Cyberbedrohungen, Sicherheitsvorfälle und Beinahe-Vorfälle freiwillig einem als Koordinator benannten CSIRT oder der ENISA zu melden.
  "17": Erlaubt die Weitergabe gemeldeter Informationen an EU-CyCLONe und die Information der Öffentlichkeit über schwerwiegende Sicherheitsvorfälle und verpflichtet die ENISA zu einem technischen Bericht über aufkommende Trends alle 24 Monate und zur Aufnahme behobener Schwachstellen in die europäische Schwachstellendatenbank.
  "18": Erlaubt Herstellern, schriftlich einen Bevollmächtigten zu beauftragen, dessen Auftrag mindestens das Bereithalten der Dokumentation sowie Auskünfte an und Zusammenarbeit mit den Marktüberwachungsbehörden umfassen muss.
  "20": Verpflichtet die Händler, mit der gebührenden Sorgfalt zu handeln und vor der Bereitstellung zu überprüfen, dass Produkte mit digitalen Elementen die CE-Kennzeichnung tragen und Hersteller und Einführer ihre Informationspflichten erfüllt haben.
  "21": Behandelt Einführer und Händler als Hersteller mit den Pflichten der Artikel 13 und 14, wenn sie ein Produkt mit digitalen Elementen unter eigenem Namen oder eigener Marke in Verkehr bringen oder wesentlich ändern.
  "22": Behandelt andere Personen, die ein Produkt mit digitalen Elementen wesentlich ändern und auf dem Markt bereitstellen, als Hersteller, mit den Pflichten der Artikel 13 und 14 für den geänderten Teil oder bei Auswirkungen auf die Cybersicherheit für das gesamte Produkt.
  "28": Verpflichtet die Hersteller, eine EU-Konformitätserklärung nach dem Muster in Anhang V auszustellen, die die Erfüllung der grundlegenden Cybersicherheitsanforderungen des Anhangs I bestätigt und mit der sie die Verantwortung für die Konformität übernehmen.
  "30": Regelt die Anbringung der CE-Kennzeichnung auf dem Produkt, sonst auf Verpackung und EU-Konformitätserklärung, und bei Software auf der EU-Konformitätserklärung oder der begleitenden Website.
  "32": Verpflichtet die Hersteller zur Konformitätsbewertung durch interne Kontrolle, EU-Baumusterprüfverfahren, umfassende Qualitätssicherung oder ein Zertifizierungsschema, wobei für wichtige Produkte der Klasse II, für Klasse I ohne harmonisierte Normen und für kritische Produkte Verfahren mit Dritten vorgeschrieben sind.
  "33": Verpflichtet die Mitgliedstaaten, Kleinst- und Kleinunternehmen gegebenenfalls durch Sensibilisierung, eigene Kommunikationskanäle und Unterstützung bei Tests zu helfen, erlaubt Reallabore für Cyberresilienz und vereinfachte technische Dokumentation.
  "34": Erlaubt der Union, unter Berücksichtigung des technischen Entwicklungsstands und des Konformitätsbewertungskonzepts eines Drittlands Abkommen über die gegenseitige Anerkennung zu schließen, um den internationalen Handel zu erleichtern.
  "35": Verpflichtet die Mitgliedstaaten, der Kommission und den anderen Mitgliedstaaten die zur Konformitätsbewertung befugten Stellen zu notifizieren und bis zum 11. Dezember 2026 auf eine ausreichende Zahl notifizierter Stellen hinzuwirken.
  "37": Verlangt, dass notifizierende Behörden Interessenkonflikte mit Konformitätsbewertungsstellen vermeiden, objektiv und unparteiisch arbeiten, Vertraulichkeit wahren und über ausreichend kompetentes Personal verfügen.
  "38": Verpflichtet die Mitgliedstaaten, die Kommission über ihre Verfahren zur Bewertung und Notifizierung von Konformitätsbewertungsstellen und zur Überwachung notifizierter Stellen sowie über Änderungen zu unterrichten.
  "39": Legt Anforderungen an notifizierte Stellen fest, darunter Rechtspersönlichkeit, Unabhängigkeit von den bewerteten Produkten, Fachkompetenz, Unparteilichkeit, Haftpflichtversicherung und Schweigepflicht.
  "40": Vermutet, dass eine Konformitätsbewertungsstelle die Anforderungen des Artikels 39 erfüllt, soweit sie die Erfüllung der Kriterien einschlägiger harmonisierter Normen nachweist.
  "41": Verpflichtet notifizierte Stellen, sicherzustellen, dass Unterauftragnehmer und Zweigstellen die Anforderungen des Artikels 39 erfüllen, die notifizierende Behörde zu unterrichten und die volle Verantwortung für deren Arbeit zu übernehmen.
  "42": Regelt den Antrag einer Konformitätsbewertungsstelle auf Notifizierung bei der notifizierenden Behörde ihres Mitgliedstaats, mit Beschreibung ihrer Tätigkeiten und Akkreditierungsurkunde oder anderen Nachweisen.
  "43": Erlaubt den notifizierenden Behörden, nur Konformitätsbewertungsstellen zu notifizieren, die Artikel 39 erfüllen, und regelt das Verfahren einschließlich der Frist für Einwände von zwei Wochen oder zwei Monaten.
  "45": Verpflichtet die notifizierende Behörde, die Notifizierung einzuschränken, auszusetzen oder zu widerrufen, wenn eine notifizierte Stelle die Anforderungen des Artikels 39 nicht mehr erfüllt oder ihren Pflichten nicht nachkommt.
  "46": Verpflichtet die Kommission, Zweifel an der Kompetenz notifizierter Stellen zu untersuchen und den notifizierenden Mitgliedstaat gegebenenfalls zu Korrekturmaßnahmen bis hin zum Widerruf der Notifizierung aufzufordern.
  "48": Verpflichtet die Mitgliedstaaten sicherzustellen, dass ein Einspruchsverfahren gegen Entscheidungen notifizierter Stellen zur Verfügung steht.
  "49": Verpflichtet notifizierte Stellen, der notifizierenden Behörde Verweigerungen, Einschränkungen, Aussetzungen und Aufhebungen von Bescheinigungen und andere relevante Umstände zu melden und anderen notifizierten Stellen negative Bewertungsergebnisse mitzuteilen.
  "50": Verpflichtet die Kommission, den Erfahrungsaustausch zwischen den für die Notifizierungspolitik zuständigen nationalen Behörden zu organisieren.
  "51": Verpflichtet die Kommission, eine sektorübergreifende Gruppe notifizierter Stellen für deren Koordinierung und Zusammenarbeit einzurichten, und die Mitgliedstaaten, für die Mitwirkung ihrer notifizierten Stellen zu sorgen.
  "52": Wendet die Verordnung (EU) 2019/1020 an, verpflichtet jeden Mitgliedstaat, Marktüberwachungsbehörden zu benennen, die auch Verwalter quelloffener Software beaufsichtigen, und richtet die ADCO ein, die unter anderem die Unterstützungszeiträume beobachtet.
  "54": Verpflichtet die Marktüberwachungsbehörde, Produkte mit digitalen Elementen mit erheblichem Cybersicherheitsrisiko zu prüfen, von Wirtschaftsakteuren Korrekturmaßnahmen, Rücknahme oder Rückruf zu verlangen und andernfalls vorläufige Maßnahmen zu ergreifen.
  "55": Verpflichtet die Kommission, bei Einwänden eines Mitgliedstaats gegen eine nationale Maßnahme oder Zweifeln an deren Vereinbarkeit mit dem Unionsrecht die Maßnahme zu prüfen und binnen neun Monaten über ihre Rechtfertigung zu entscheiden.
  "58": Verpflichtet die Marktüberwachungsbehörde, vom Hersteller die Beendigung formaler Nichtkonformitäten zu verlangen, etwa bei fehlender oder fehlerhafter CE-Kennzeichnung, EU-Konformitätserklärung oder technischer Dokumentation.
  "60": Verpflichtet die Marktüberwachungsbehörden, gleichzeitige koordinierte Kontrollen („Sweeps“) bestimmter Produkte mit digitalen Elementen durchzuführen, die grundsätzlich von der Kommission koordiniert werden.
  "61": Regelt die Befugnis der Kommission zum Erlass delegierter Rechtsakte für fünf Jahre ab dem 10. Dezember 2024 mit stillschweigender Verlängerung, Widerruf und Einwänden von Parlament und Rat.
  "62": Regelt das Ausschussverfahren nach der Verordnung (EU) Nr. 182/2011, mit dem die Kommission beim Erlass von Durchführungsrechtsakten unterstützt wird.
  "64": Verpflichtet die Mitgliedstaaten zu Sanktionen, mit Geldbußen bis zu 15 Millionen Euro oder 2,5 % des weltweiten Jahresumsatzes bei Verstößen gegen die grundlegenden Anforderungen und die Artikel 13 und 14 sowie niedrigeren Obergrenzen für andere Verstöße.
  "67": Fügt die Verordnung (EU) 2024/2847 in Anhang I der Richtlinie (EU) 2020/1828 über Verbandsklagen ein.
  "68": Ergänzt die Tabelle in Anhang II Teil C1 der Verordnung (EU) Nr. 168/2013 um einen Eintrag zum Schutz von Fahrzeugen vor Cyberangriffen.
  "69": Wendet die Verordnung auf vor dem 11. Dezember 2027 in Verkehr gebrachte Produkte nur bei späterer wesentlicher Änderung an, mit Ausnahme der Meldepflichten nach Artikel 14, und lässt bestehende Bescheinigungen bis zum 11. Juni 2028 gelten.
  "71": Regelt das Inkrafttreten am zwanzigsten Tag nach der Veröffentlichung und die Geltung ab dem 11. Dezember 2027; Artikel 14 gilt ab dem 11. September 2026 und Kapitel IV ab dem 11. Juni 2026.

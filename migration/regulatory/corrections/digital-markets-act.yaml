# Reviewed corrections of the model summaries (each language summarised from its own official text).
en:
  "3": Sets out when an undertaking is designated as a gatekeeper, with presumptions based on turnover or market capitalisation, at least 45 million monthly active end users and 10 000 yearly active business users, and the designation procedure.
  "4": Requires the Commission to review regularly, at least every three years, whether gatekeepers still meet the designation criteria and to update the list of gatekeepers and core platform services.
  "5": Sets out obligations for gatekeepers, e.g. no combining of personal data across services without consent, no ban on business users offering other prices elsewhere and no tying of identification or payment services.
  "6": Sets out further obligations that may be specified by the Commission, e.g. no use of business users' non-public data in competition with them, allowing third-party app stores, no self-preferencing in ranking and data portability.
  "13": Prohibits splitting core platform services to circumvent the thresholds and any behaviour by gatekeepers that undermines effective compliance with Articles 5, 6 and 7.
  "17": Allows the Commission to conduct a market investigation to determine whether an undertaking should be designated as a gatekeeper or which core platform services to list.
  "18": Allows the Commission to conduct a market investigation into systematic non-compliance and to impose behavioural or structural remedies on the gatekeeper.
  "21": Allows the Commission to require undertakings to provide all necessary information, including access to data and algorithms and explanations, by simple request or by decision.
  "29": Requires the Commission to adopt a non-compliance decision where a gatekeeper does not comply with Articles 5, 6 or 7 or other specified measures.
  "30": Allows the Commission to impose fines on gatekeepers of up to 10 % of total worldwide turnover for non-compliance, and up to 20 % for repeated infringements.
  "31": Allows the Commission to impose periodic penalty payments of up to 5 % of average daily worldwide turnover per day to compel compliance with its decisions.
  "34": Gives gatekeepers and other undertakings concerned the right to be heard on the Commission's preliminary findings and access to the file before decisions are adopted.
  "39": Allows national courts to ask the Commission for information or opinions, requires Member States to forward national judgments on the Regulation to the Commission, and allows the Commission to submit observations.
  "44": Requires the Commission to publish decisions under the specified articles with the names of the parties, the main content and any penalties, taking account of confidential information.
  "47": Allows the Commission to adopt guidelines on any aspect of the Regulation to facilitate its implementation and enforcement.
  "48": Allows the Commission to mandate European standardisation bodies to develop standards that facilitate the implementation of the obligations.
  "50": Provides that the Commission is assisted by the Digital Markets Advisory Committee, a committee within the meaning of Regulation (EU) No 182/2011.
  "53": Requires the Commission to evaluate the Regulation by 3 May 2026 and every three years thereafter, including whether to modify the rules or the list of core platform services.
de:
  "3": Regelt, wann ein Unternehmen als Torwächter benannt wird, mit Vermutungen anhand von Umsatz oder Marktkapitalisierung, mindestens 45 Millionen monatlich aktiven Endnutzern und 10 000 jährlich aktiven gewerblichen Nutzern, sowie das Benennungsverfahren.
  "5": Legt Verpflichtungen für Torwächter fest, etwa keine Zusammenführung personenbezogener Daten über Dienste hinweg ohne Einwilligung, kein Verbot anderer Preise für gewerbliche Nutzer anderswo und keine Kopplung von Identifizierungs- oder Zahlungsdiensten.
  "6": Legt weitere, von der Kommission präzisierbare Verpflichtungen fest, etwa keine Nutzung nicht öffentlicher Daten gewerblicher Nutzer im Wettbewerb mit ihnen, Zulassung fremder App-Stores, keine Selbstbevorzugung im Ranking und Datenübertragbarkeit.
  "13": Verbietet, zentrale Plattformdienste aufzuspalten, um die Schwellenwerte zu umgehen, sowie jedes Verhalten von Torwächtern, das die wirksame Einhaltung der Artikel 5, 6 und 7 untergräbt.
  "20": Verpflichtet die Kommission, einen Beschluss zur Einleitung eines Verfahrens zu erlassen, wenn sie Beschlüsse nach Artikel 8, 29 oder 30 in Betracht zieht.
  "21": Erlaubt der Kommission, von Unternehmen und Unternehmensvereinigungen durch einfaches Auskunftsverlangen oder Beschluss alle erforderlichen Auskünfte sowie Zugang zu Daten und Algorithmen zu verlangen.
  "24": Erlaubt der Kommission, in dringenden Fällen bei Gefahr eines ernsten und nicht wiedergutzumachenden Schadens einstweilige Maßnahmen gegen einen Torwächter anzuordnen.
  "25": Erlaubt der Kommission, Verpflichtungszusagen eines Torwächters durch Durchführungsrechtsakt für bindend zu erklären.
  "29": Verpflichtet die Kommission, einen Nichteinhaltungsbeschluss zu erlassen, wenn ein Torwächter eine Verpflichtung aus den Artikeln 5, 6 oder 7 oder bestimmte andere Maßnahmen nicht einhält.
  "30": Erlaubt der Kommission, gegen Torwächter Geldbußen bis zu 10 % ihres weltweiten Gesamtumsatzes bei Nichteinhaltung und bis zu 20 % bei wiederholten Zuwiderhandlungen zu verhängen.
  "31": Erlaubt der Kommission, Zwangsgelder bis zu 5 % des durchschnittlichen weltweiten Tagesumsatzes pro Tag zu verhängen, um die Befolgung ihrer Beschlüsse zu erzwingen.
  "37": Verpflichtet die Kommission und die Mitgliedstaaten, eng zusammenzuarbeiten und ihre Durchsetzungsmaßnahmen abzustimmen, damit die für Torwächter geltenden Rechtsinstrumente kohärent durchgesetzt werden.
  "39": Ermöglicht nationalen Gerichten, die Kommission um Informationen oder Stellungnahmen zu ersuchen, verpflichtet die Mitgliedstaaten, ihr Urteile zur Anwendung der Verordnung zu übermitteln, und erlaubt der Kommission schriftliche Stellungnahmen.
  "45": Gibt dem Gerichtshof die Befugnis zur unbeschränkten Nachprüfung von Geldbußen und Zwangsgeldern der Kommission, die er aufheben, herabsetzen oder erhöhen kann.
  "46": Erlaubt der Kommission, Durchführungsrechtsakte mit näheren Regelungen zur Anwendung verschiedener Vorschriften der Verordnung zu erlassen.
  "47": Erlaubt der Kommission, Leitlinien zu allen Aspekten der Verordnung zu erlassen, um deren Durchführung und Durchsetzung zu erleichtern.
  "48": Erlaubt der Kommission, europäische Normungsorganisationen mit der Entwicklung von Normen zu beauftragen, die die Umsetzung der Verpflichtungen erleichtern.
  "49": Regelt die Ausübung der Befugnis der Kommission zum Erlass delegierter Rechtsakte.
  "50": Bestimmt, dass die Kommission vom Beratenden Ausschuss für digitale Märkte unterstützt wird, einem Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011.
  "4": Erlaubt der Kommission, Benennungsbeschlüsse jederzeit zu überprüfen, zu ändern oder aufzuheben, und verpflichtet sie, regelmäßig, mindestens alle drei Jahre, zu prüfen, ob die Torwächter die Voraussetzungen noch erfüllen.
  "17": Erlaubt der Kommission, eine Marktuntersuchung durchzuführen, um zu prüfen, ob ein Unternehmen als Torwächter zu benennen ist oder welche zentralen Plattformdienste aufzuführen sind.
  "18": Erlaubt der Kommission, eine Marktuntersuchung zu systematischer Nichteinhaltung durchzuführen und dem Torwächter verhaltensbezogene oder strukturelle Abhilfemaßnahmen aufzuerlegen.
  "34": Gibt dem Torwächter und anderen betroffenen Unternehmen vor Beschlüssen der Kommission das Recht, sich zu deren vorläufigen Feststellungen zu äußern, und das Recht auf Akteneinsicht.

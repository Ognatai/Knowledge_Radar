# Reviewed corrections of the model summaries (each language summarised from its own official text).
en:
  "7": Provides that providers of intermediary services do not lose the liability exemptions of Articles 4, 5 and 6 solely because they carry out voluntary own-initiative investigations against illegal content in good faith and diligently.
  "19": Exempts online platforms that are micro or small enterprises from this Section, also for 12 months after losing that status, unless they are designated as very large online platforms.
  "22": Requires providers of online platforms to give priority to notices from trusted flaggers and to process them without undue delay.
  "32": Requires providers of online platforms to inform consumers who bought illegal products or services through their service about the illegality, the trader's identity and the means of redress.
  "33": Applies this Section to online platforms and online search engines with at least 45 million average monthly active recipients in the Union that the Commission designates as very large online platforms or search engines.
  "40": Requires providers of very large online platforms and search engines to give the Digital Services Coordinator or the Commission access to data for compliance monitoring and, under conditions, to give vetted researchers access to data for research on systemic risks.
  "43": Requires the Commission to charge providers of very large online platforms and search engines an annual supervisory fee to cover its supervisory costs.
  "44": Requires the Commission to support and promote the development of voluntary European and international standards, e.g. for notices, interfaces, audits and interoperability of advertisement repositories.
  "45": Requires the Commission and the Board to encourage and facilitate voluntary codes of conduct at Union level, in particular on illegal content and systemic risks.
  "46": Requires the Commission to encourage voluntary codes of conduct for more transparency in online advertising beyond Articles 26 and 39, aiming for them to be drawn up by 18 February 2025.
  "47": Requires the Commission to encourage codes of conduct to improve the accessibility of online services for persons with disabilities, aiming for them to be drawn up by 18 February 2025.
  "48": Allows the Board to recommend that the Commission initiate voluntary crisis protocols for extraordinary circumstances affecting public security or public health.
  "49": Requires Member States to designate competent authorities for supervising providers of intermediary services and enforcing the Regulation, one of which acts as Digital Services Coordinator.
  "50": Requires Member States to ensure that their Digital Services Coordinators act impartially, transparently, in a timely manner and with complete independence, with adequate resources.
  "52": Requires Member States to lay down penalties, with maximum fines of 6 % of annual worldwide turnover for infringements and 1 % for incorrect or incomplete information, and periodic penalty payments of up to 5 % of average daily turnover.
  "56": Gives the Member State of the provider's main establishment exclusive powers to supervise and enforce the Regulation, and the Commission exclusive powers for the obligations of very large online platforms and search engines.
  "59": Allows a Digital Services Coordinator or the Board to refer a matter to the Commission if the Coordinator of establishment does not respond in time or they disagree with its assessment or measures.
  "60": Allows the Digital Services Coordinator of establishment to launch and lead joint investigations with other Coordinators into infringements in several Member States.
  "62": Provides that the Board is composed of the Digital Services Coordinators, represented by high-level officials.
  "63": Sets out the tasks of the Board, including supporting joint investigations, analysing audit reports of very large online platforms and search engines, and advising the Commission.
  "64": Requires the Commission, in cooperation with the Digital Services Coordinators and the Board, to develop Union expertise and capabilities, including on systemic and emerging issues.
  "67": Allows the Commission to require providers of very large online platforms and search engines and other persons to provide information on suspected infringements, by simple request or by decision.
  "70": Allows the Commission to order interim measures against providers of very large online platforms or search engines in case of urgency and a prima facie finding of infringement.
  "72": Allows the Commission to monitor compliance of very large online platforms and search engines, including by ordering access to databases and algorithms and by appointing external experts.
  "73": Requires the Commission to adopt a non-compliance decision where a provider of a very large online platform or search engine infringes the Regulation, and to set a period for compliance.
  "74": Allows the Commission to impose fines of up to 6 % of total worldwide annual turnover on providers of very large online platforms or search engines, e.g. for infringements or non-compliance with interim measures or binding commitments.
  "76": Allows the Commission to impose periodic penalty payments of up to 5 % of average daily income or worldwide turnover per day to compel compliance with its decisions and requests.
  "79": Gives the provider concerned and other persons subject to proceedings the right to be heard on the Commission's preliminary findings and access to the file before a decision is adopted.
  "80": Requires the Commission to publish its decisions under the specified articles, with the names of the parties, the main content and any penalties, taking account of legitimate interests.
  "82": Allows the Commission, as a last resort for persistent infringements causing serious harm, to request the Digital Services Coordinator of establishment to seek a temporary restriction of access, after inviting written observations.
  "83": Allows the Commission to adopt implementing acts on the practical arrangements for proceedings, hearings and negotiated disclosure of information.
  "86": Gives recipients of the service the right to mandate certain bodies to exercise their rights on their behalf and requires online platforms to process complaints from such bodies with priority.
  "88": Provides that the Commission is assisted by a committee within the meaning of Regulation (EU) No 182/2011.
  "91": Requires the Commission to evaluate specified aspects by 18 February 2027 and 17 November 2025, including Article 33, and the Regulation as a whole by 17 November 2027 and every five years thereafter.
de:
  "6": Befreit Hostingdiensteanbieter von der Haftung für gespeicherte Informationen, sofern sie keine tatsächliche Kenntnis von rechtswidrigen Inhalten haben oder nach Kenntniserlangung zügig tätig werden.
  "7": Bestimmt, dass Anbieter von Vermittlungsdiensten die Haftungsbefreiungen der Artikel 4, 5 und 6 nicht allein deshalb verlieren, weil sie in gutem Glauben und sorgfältig freiwillige Untersuchungen zu rechtswidrigen Inhalten durchführen.
  "19": Nimmt Online-Plattformen, die Kleinst- oder Kleinunternehmen sind, von diesem Abschnitt aus, auch für zwölf Monate nach Verlust dieses Status, sofern sie nicht als sehr große Online-Plattformen benannt sind.
  "29": Nimmt Online-Plattformen, die Kleinst- oder Kleinunternehmen sind, von diesem Abschnitt über Fernabsatzverträge aus, auch für zwölf Monate nach Verlust dieses Status, sofern sie nicht als sehr große Online-Plattformen benannt sind.
  "30": Verpflichtet Anbieter von Online-Plattformen sicherzustellen, dass Unternehmer ihre Dienste für Angebote an Verbraucher in der Union nur nutzen können, wenn sie bestimmte Angaben zu ihrer Identität gemacht haben.
  "32": Verpflichtet Anbieter von Online-Plattformen, Verbraucher, die über ihren Dienst rechtswidrige Produkte oder Dienstleistungen erworben haben, über die Rechtswidrigkeit, die Identität des Unternehmers und die Rechtsbehelfe zu informieren.
  "40": Verpflichtet Anbieter sehr großer Online-Plattformen und Suchmaschinen, dem Koordinator für digitale Dienste oder der Kommission Zugang zu Daten für die Überwachung zu gewähren und unter Bedingungen zugelassenen Forschern Datenzugang für die Erforschung systemischer Risiken zu ermöglichen.
  "42": Verpflichtet Anbieter sehr großer Online-Plattformen und Suchmaschinen, mindestens alle sechs Monate Transparenzberichte zu veröffentlichen, unter anderem über die für die Moderation von Inhalten eingesetzten Ressourcen.
  "43": Verpflichtet die Kommission, von Anbietern sehr großer Online-Plattformen und Suchmaschinen eine jährliche Aufsichtsgebühr zur Deckung ihrer Aufsichtskosten zu erheben.
  "47": Verpflichtet die Kommission, die Ausarbeitung von Verhaltenskodizes zur Verbesserung der Barrierefreiheit von Online-Diensten für Menschen mit Behinderungen zu fördern.
  "48": Ermöglicht dem Gremium, der Kommission die Einleitung freiwilliger Krisenprotokolle für außergewöhnliche Umstände zu empfehlen, die die öffentliche Sicherheit oder Gesundheit beeinträchtigen.
  "49": Verpflichtet die Mitgliedstaaten, zuständige Behörden für die Aufsicht über Anbieter von Vermittlungsdiensten zu benennen, von denen eine als Koordinator für digitale Dienste handelt.
  "50": Verpflichtet die Mitgliedstaaten sicherzustellen, dass ihre Koordinatoren für digitale Dienste ihre Aufgaben unparteiisch, transparent, zeitnah und völlig unabhängig und mit ausreichenden Ressourcen erfüllen.
  "51": Gibt den Koordinatoren für digitale Dienste Untersuchungs- und Durchsetzungsbefugnisse, etwa Auskunftsverlangen, Nachprüfungen, Anordnungen zur Abstellung von Zuwiderhandlungen und Geldbußen.
  "52": Verpflichtet die Mitgliedstaaten, Sanktionen festzulegen, mit Geldbußen bis zu 6 % des weltweiten Jahresumsatzes bei Zuwiderhandlungen, bis zu 1 % bei unrichtigen oder unvollständigen Angaben und Zwangsgeldern bis zu 5 % des durchschnittlichen Tagesumsatzes.
  "56": Gibt dem Mitgliedstaat der Hauptniederlassung des Anbieters die ausschließliche Zuständigkeit für Aufsicht und Durchsetzung und der Kommission die ausschließliche Zuständigkeit für die besonderen Pflichten sehr großer Online-Plattformen und Suchmaschinen.
  "59": Ermöglicht einem Koordinator für digitale Dienste oder dem Gremium, die Kommission zu befassen, wenn der Koordinator am Niederlassungsort nicht rechtzeitig reagiert oder sie dessen Bewertung oder Maßnahmen nicht teilen.
  "64": Verpflichtet die Kommission, in Zusammenarbeit mit den Koordinatoren für digitale Dienste und dem Gremium Sachkenntnis und Kapazitäten der Union aufzubauen, auch zu systemischen und neu auftretenden Fragen.
  "65": Erlaubt der Kommission, die Einhaltung der Verordnung durch sehr große Online-Plattformen und Suchmaschinen schon vor Einleitung eines Verfahrens zu untersuchen.
  "71": Erlaubt der Kommission, Verpflichtungszusagen von Anbietern sehr großer Online-Plattformen oder Suchmaschinen für bindend zu erklären, wenn sie die Einhaltung der Verordnung sicherstellen.
  "73": Verpflichtet die Kommission, einen Nichteinhaltungsbeschluss zu erlassen, wenn ein Anbieter einer sehr großen Online-Plattform oder Suchmaschine gegen die Verordnung verstößt, und eine Frist zur Abhilfe zu setzen.
  "74": Erlaubt der Kommission, gegen Anbieter sehr großer Online-Plattformen oder Suchmaschinen Geldbußen bis zu 6 % des weltweiten Gesamtjahresumsatzes zu verhängen, etwa bei Zuwiderhandlungen oder Nichtbefolgung einstweiliger Maßnahmen.
  "75": Verpflichtet Anbieter sehr großer Online-Plattformen oder Suchmaschinen, nach einer Zuwiderhandlung gegen Kapitel III Abschnitt 5 einen Aktionsplan zur Behebung vorzulegen, dessen Umsetzung die Kommission überwacht.
  "76": Erlaubt der Kommission, Zwangsgelder bis zu 5 % der durchschnittlichen Tageseinnahmen oder des Tagesumsatzes pro Tag zu verhängen, um die Befolgung ihrer Beschlüsse und Verlangen durchzusetzen.
  "77": Regelt eine Verjährungsfrist von fünf Jahren für die Verhängung von Geldbußen und Zwangsgeldern durch die Kommission.
  "85": Verpflichtet die Kommission, ein zuverlässiges und sicheres Informationsaustauschsystem für die Kommunikation zwischen den Koordinatoren für digitale Dienste, der Kommission und dem Gremium einzurichten.
  "86": Gibt den Nutzern das Recht, bestimmte Einrichtungen mit der Wahrnehmung ihrer Rechte zu beauftragen, und verpflichtet Online-Plattformen, Beschwerden solcher Einrichtungen vorrangig zu bearbeiten.
  "87": Regelt die Ausübung der Befugnis der Kommission zum Erlass delegierter Rechtsakte.
  "88": Bestimmt, dass die Kommission von einem Ausschuss im Sinne der Verordnung (EU) Nr. 182/2011 unterstützt wird.
  "91": Verpflichtet die Kommission, bestimmte Aspekte bis zum 18. Februar 2027 und 17. November 2025 zu bewerten, darunter Artikel 33, und die Verordnung insgesamt bis zum 17. November 2027 und danach alle fünf Jahre.
  "93": Regelt das Inkrafttreten am zwanzigsten Tag nach der Veröffentlichung und den Geltungsbeginn ab dem 17. Februar 2024; einzelne Vorschriften gelten bereits ab dem 16. November 2022.
  "22": Verpflichtet Anbieter von Online-Plattformen, Meldungen vertrauenswürdiger Hinweisgeber vorrangig zu behandeln und unverzüglich zu bearbeiten.
  "33": Wendet diesen Abschnitt auf Online-Plattformen und Online-Suchmaschinen mit mindestens 45 Millionen durchschnittlich monatlich aktiven Nutzern in der Union an, die die Kommission als sehr groß benennt.
  "44": Verpflichtet die Kommission, nach Konsultation des Gremiums die Entwicklung und Umsetzung freiwilliger europäischer und internationaler Normen zu unterstützen und zu fördern.
  "45": Verpflichtet die Kommission und das Gremium, die Ausarbeitung freiwilliger Verhaltenskodizes auf Unionsebene zu fördern und zu erleichtern, insbesondere zu rechtswidrigen Inhalten und systemischen Risiken.
  "46": Verpflichtet die Kommission, freiwillige Verhaltenskodizes für mehr Transparenz in der Online-Werbung über die Artikel 26 und 39 hinaus zu fördern und zu erleichtern.
  "60": Erlaubt dem Koordinator für digitale Dienste am Niederlassungsort, gemeinsam mit anderen Koordinatoren Untersuchungen zu mutmaßlichen Zuwiderhandlungen in mehreren Mitgliedstaaten einzuleiten und zu leiten.
  "62": Bestimmt, dass sich das Gremium aus den Koordinatoren für digitale Dienste zusammensetzt, die durch hochrangige Beamte vertreten werden.
  "63": Legt die Aufgaben des Gremiums fest, darunter die Unterstützung gemeinsamer Untersuchungen, die Analyse von Prüfberichten sehr großer Dienste und die Beratung der Kommission.
  "67": Erlaubt der Kommission, von Anbietern sehr großer Online-Plattformen und Suchmaschinen sowie anderen Personen durch einfaches Verlangen oder Beschluss Auskünfte zu verlangen.
  "70": Erlaubt der Kommission, bei Dringlichkeit und einer prima facie festgestellten Zuwiderhandlung einstweilige Maßnahmen gegen Anbieter sehr großer Online-Plattformen oder Suchmaschinen anzuordnen.
  "72": Erlaubt der Kommission, die Einhaltung der Verordnung durch sehr große Online-Plattformen und Suchmaschinen zu überwachen, etwa durch Zugang zu Datenbanken und Algorithmen und durch externe Sachverständige.
  "79": Gibt dem betroffenen Anbieter und anderen Verfahrensbeteiligten vor einem Beschluss der Kommission das Recht, sich zu deren vorläufigen Feststellungen zu äußern, und das Recht auf Akteneinsicht.
  "80": Verpflichtet die Kommission, ihre Beschlüsse nach den genannten Artikeln mit Namen der Parteien, wesentlichem Inhalt und Sanktionen unter Wahrung berechtigter Interessen zu veröffentlichen.
  "82": Erlaubt der Kommission, bei anhaltenden schweren Zuwiderhandlungen als letztes Mittel den Koordinator für digitale Dienste am Niederlassungsort zu ersuchen, eine vorübergehende Zugangsbeschränkung zu beantragen.
  "83": Erlaubt der Kommission, Durchführungsrechtsakte zu den praktischen Modalitäten von Verfahren, Anhörungen und einvernehmlicher Offenlegung von Informationen zu erlassen.

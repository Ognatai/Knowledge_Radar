# Reviewed corrections of the model summaries. Both language versions of EU acts are
# authentic; each language was summarised from its own official text and is corrected here.
en:
  "1": Lays down obligations for Member States to identify and support critical entities and for critical entities to enhance their resilience, as well as rules on supervision, enforcement and cooperation; matters covered by the NIS2 Directive are excluded.
  "2": Defines the terms used in the Directive, including critical entity, resilience, incident, critical infrastructure, essential service, risk, risk assessment and public administration entity.
  "7": Lists the criteria Member States must consider when assessing whether an incident would have a significant disruptive effect, such as the number of users, cross-sector dependencies, market share and the geographic area affected.
  "8": Exempts critical entities in the banking, financial market infrastructure and digital infrastructure sectors from Article 11 and Chapters III, IV and VI, while allowing Member States to set higher national resilience requirements for them.
  "10": Requires Member States to support critical entities in enhancing their resilience, for example through guidance, exercises, advice and training, and allows them to provide financial support.
  "11": Requires Member States to consult one another on critical entities that use cross-border infrastructure, belong to cross-border corporate structures or provide essential services in other Member States.
  "13": Requires critical entities to take appropriate and proportionate technical, security and organisational resilience measures, such as physical protection, crisis management, business continuity and personnel security, to describe them in a resilience plan and to designate a liaison officer.
  "14": Requires Member States to specify when critical entities may request background checks on persons in sensitive roles, with access to premises or systems, or under consideration for recruitment, and sets minimum content such as identity and criminal record checks.
  "17": Defines critical entities of particular European significance as critical entities providing the same or similar essential services to or in six or more Member States, and sets out how they report this and how the Commission notifies them after consultations.
  "18": Requires the Commission to organise advisory missions, at the request of the identifying Member State or, with its agreement, on its own initiative, to assess the measures taken by critical entities of particular European significance.
  "20": Requires the Commission to support Member States and critical entities, prepare a Union-level overview of cross-border and cross-sectoral risks, organise advisory missions and facilitate information exchange.
  "21": Requires Member States to give competent authorities powers to inspect critical entities on site, supervise them off site, order audits, request information and order remedial measures, subject to appropriate safeguards.
  "22": Requires Member States to lay down effective, proportionate and dissuasive penalties for infringements of the national implementing measures and to notify the Commission of them by 17 October 2024.
de:
  "1": Legt Pflichten der Mitgliedstaaten zur Ermittlung und Unterstützung kritischer Einrichtungen und Pflichten kritischer Einrichtungen zur Stärkung ihrer Resilienz fest, ebenso Vorschriften über Aufsicht, Durchsetzung und Zusammenarbeit; Angelegenheiten der Richtlinie (EU) 2022/2555 sind ausgenommen.
  "4": Verpflichtet jeden Mitgliedstaat, bis zum 17. Januar 2026 eine Strategie zur Verbesserung der Resilienz kritischer Einrichtungen mit Zielen, Governance-Rahmen und Maßnahmen anzunehmen und sie mindestens alle vier Jahre zu aktualisieren.
  "5": Verpflichtet die zuständigen Behörden, bis zum 17. Januar 2026 und danach mindestens alle vier Jahre eine Risikobewertung durch Mitgliedstaaten durchzuführen, die natürliche und vom Menschen verursachte Risiken einschließlich hybrider Bedrohungen berücksichtigt.
  "6": Verpflichtet die Mitgliedstaaten, bis zum 17. Juli 2026 die kritischen Einrichtungen anhand ihrer Risikobewertung und festgelegter Kriterien zu ermitteln, sie darüber zu unterrichten und die Liste mindestens alle vier Jahre zu überprüfen.
  "7": Nennt die Kriterien, nach denen die Mitgliedstaaten das Ausmaß einer Störung bestimmen, etwa die Zahl der Nutzer, die Abhängigkeit anderer Sektoren, den Marktanteil und das betroffene geografische Gebiet.
  "8": Nimmt kritische Einrichtungen der Sektoren Banken, Finanzmarktinfrastruktur und digitale Infrastruktur von Artikel 11 und den Kapiteln III, IV und VI aus und erlaubt den Mitgliedstaaten strengere nationale Vorschriften für sie.
  "9": Verpflichtet jeden Mitgliedstaat, eine oder mehrere zuständige Behörden und eine zentrale Anlaufstelle für die grenzüberschreitende Zusammenarbeit zu benennen oder einzurichten und sie mit ausreichenden Befugnissen und Ressourcen auszustatten.
  "10": Verpflichtet die Mitgliedstaaten, kritische Einrichtungen bei der Verbesserung ihrer Resilienz zu unterstützen, etwa durch Leitfäden, Übungen, Beratung und Schulungen, und erlaubt finanzielle Unterstützung.
  "11": Verpflichtet die Mitgliedstaaten, sich zu kritischen Einrichtungen mit grenzüberschreitend verbundener kritischer Infrastruktur, grenzüberschreitenden Unternehmensstrukturen oder Diensten in anderen Mitgliedstaaten gegenseitig zu konsultieren.
  "12": Verpflichtet kritische Einrichtungen, binnen neun Monaten nach ihrer Unterrichtung und danach mindestens alle vier Jahre eine Risikobewertung durchzuführen, die alle relevanten natürlichen und vom Menschen verursachten Risiken berücksichtigt.
  "13": Verpflichtet die Mitgliedstaaten sicherzustellen, dass kritische Einrichtungen geeignete und verhältnismäßige technische, sicherheitsbezogene und organisatorische Resilienzmaßnahmen ergreifen, sie in einem Resilienzplan beschreiben und einen Verbindungsbeauftragten benennen.
  "14": Verpflichtet die Mitgliedstaaten festzulegen, unter welchen Bedingungen kritische Einrichtungen Zuverlässigkeitsüberprüfungen von Personen in sensiblen Funktionen, mit Zugang zu Räumlichkeiten oder Systemen oder vor einer Einstellung beantragen dürfen.
  "15": Verpflichtet die Mitgliedstaaten sicherzustellen, dass kritische Einrichtungen Sicherheitsvorfälle, die wesentliche Dienste erheblich stören oder stören könnten, der zuständigen Behörde melden, mit einer ersten Meldung binnen 24 Stunden und einem ausführlichen Bericht binnen eines Monats.
  "16": Verpflichtet die Mitgliedstaaten, die Anwendung europäischer und internationaler Normen und technischer Spezifikationen für Sicherheits- und Resilienzmaßnahmen kritischer Einrichtungen technologieneutral zu fördern.
  "18": Verpflichtet die Kommission, auf Antrag des ermittelnden Mitgliedstaats oder mit dessen Zustimmung Beratungsmissionen zu organisieren, die die Maßnahmen kritischer Einrichtungen von besonderer Bedeutung für Europa bewerten.
  "20": Verpflichtet die Kommission, die Mitgliedstaaten und kritischen Einrichtungen zu unterstützen, eine unionsweite Übersicht über grenz- und sektorübergreifende Risiken zu erstellen, Beratungsmissionen zu organisieren und den Informationsaustausch zu erleichtern.
  "21": Verpflichtet die Mitgliedstaaten, den zuständigen Behörden Befugnisse zu Vor-Ort-Kontrollen, Audits, Auskunftsverlangen und Anordnungen von Abhilfemaßnahmen gegenüber kritischen Einrichtungen zu geben, mit angemessenen Schutzvorkehrungen.
  "22": Verpflichtet die Mitgliedstaaten, wirksame, verhältnismäßige und abschreckende Sanktionen für Verstöße gegen die nationalen Umsetzungsvorschriften festzulegen und sie der Kommission bis zum 17. Oktober 2024 mitzuteilen.
  "23": Regelt die Befugnis der Kommission zum Erlass delegierter Rechtsakte zur Liste wesentlicher Dienste, übertragen für fünf Jahre ab dem 16. Januar 2023, einschließlich Widerruf und Einwänden von Parlament und Rat.
  "25": Verpflichtet die Kommission, bis zum 17. Juli 2027 über die Umsetzung durch die Mitgliedstaaten zu berichten und die Richtlinie regelmäßig zu überprüfen, erstmals mit einem Bericht bis zum 17. Juni 2029.
  "26": Verpflichtet die Mitgliedstaaten, die erforderlichen Vorschriften bis zum 17. Oktober 2024 zu erlassen und zu veröffentlichen und sie ab dem 18. Oktober 2024 anzuwenden.
  "27": Hebt die Richtlinie 2008/114/EG mit Wirkung vom 18. Oktober 2024 auf; Bezugnahmen auf sie gelten als Bezugnahmen auf die vorliegende Richtlinie.

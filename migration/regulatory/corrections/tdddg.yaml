# Reviewed corrections of the model summaries (source language: de).
de:
  "1": Regelt den Anwendungsbereich des Gesetzes, darunter das Fernmeldegeheimnis, den Datenschutz bei Telekommunikations- und digitalen Diensten, den Schutz der Privatsphäre bei Endeinrichtungen und die Aufsicht.
  "3": Verpflichtet Anbieter von Telekommunikationsdiensten, Betreiber von Telekommunikationsnetzen und -anlagen sowie Mitwirkende, das Fernmeldegeheimnis zu wahren, das den Inhalt und die näheren Umstände der Telekommunikation schützt.
  "4": Stellt klar, dass das Fernmeldegeheimnis der Wahrnehmung von Rechten des Endnutzers gegenüber dem Anbieter durch Erben oder andere berechtigte Personen nicht entgegensteht.
  "5": Erlaubt mit Funkanlagen nur das Abhören von Nachrichten, die für den Betreiber, Funkamateure oder die Allgemeinheit bestimmt sind, und verbietet die Weitergabe anderer empfangener Nachrichten.
  "6": Regelt, unter welchen Voraussetzungen Anbieter bei Diensten mit Zwischenspeicherung, etwa Sprach- oder Textnachrichten, Nachrichteninhalte von Endnutzern verarbeiten dürfen.
  "8": Verbietet Besitz, Herstellung, Vertrieb und Einfuhr von Telekommunikationsanlagen, die einen anderen Gegenstand vortäuschen und zum unbemerkten Abhören oder Aufnehmen bestimmt sind.
  "10": Regelt, wie Anbieter Verkehrsdaten zur Ermittlung und Abrechnung der Entgelte verarbeiten und an Dritte übermitteln dürfen.
  "11": Gibt dem Endnutzer das Recht, einen Einzelverbindungsnachweis über die entgeltpflichtigen Verbindungen zu verlangen, wenn er dies vor dem maßgeblichen Abrechnungszeitraum tut.
  "12": Erlaubt die Verarbeitung von Verkehrs- und Steuerdaten, soweit erforderlich, um Störungen von Telekommunikationsanlagen zu erkennen und zu beseitigen sowie Missbrauch von Telekommunikationsdiensten aufzudecken.
  "13": Erlaubt die Verarbeitung von Standortdaten für Dienste mit Zusatznutzen nur anonymisiert oder mit Einwilligung und verpflichtet den Anbieter, den Endnutzer bei jeder Standortfeststellung zu informieren.
  "14": Verpflichtet den Anbieter, einem Anschlussinhaber, der bedrohende oder belästigende Anrufe schlüssig vorträgt, auf schriftlichen Antrag Auskunft über die Inhaber der anrufenden Anschlüsse zu erteilen.
  "15": Verpflichtet Anbieter von Sprachkommunikationsdiensten, anrufenden und angerufenen Endnutzern die dauernde oder fallweise Unterdrückung der Rufnummernanzeige und die Abweisung von Anrufen mit unterdrückter Rufnummer zu ermöglichen.
  "19": Verpflichtet Anbieter digitaler Dienste zu technischen und organisatorischen Vorkehrungen, damit Nutzer den Dienst jederzeit beenden und geschützt vor Kenntnisnahme Dritter nutzen können, und soweit möglich zur anonymen oder pseudonymen Nutzung.
  "21": Erlaubt Anbietern digitaler Dienste, im Einzelfall Auskunft über Bestandsdaten zu erteilen, etwa zur Durchsetzung von Rechten am geistigen Eigentum oder zivilrechtlicher Ansprüche wegen der Verletzung absolut geschützter Rechte.
  "22": Erlaubt Anbietern digitaler Dienste, Bestandsdaten zur Erfüllung von Auskunftspflichten gegenüber bestimmten Behörden zu verwenden, und regelt das Verfahren.
  "23": Erlaubt Anbietern digitaler Dienste, Passwörter und andere Zugangsdaten nur unter besonderen Voraussetzungen zur Erfüllung von Auskunftspflichten gegenüber bestimmten Behörden zu verwenden.
  "24": Erlaubt Anbietern digitaler Dienste, Nutzungsdaten zur Erfüllung von Auskunftspflichten gegenüber bestimmten Behörden zu verwenden, und regelt das Verfahren.
  "25": Erlaubt das Speichern von Informationen in der Endeinrichtung des Endnutzers und den Zugriff darauf nur mit Einwilligung, es sei denn, dies ist für die Übertragung einer Nachricht oder einen ausdrücklich gewünschten digitalen Dienst unbedingt erforderlich.
  "27": Bedroht das unerlaubte Abhören mit Funkanlagen, die Weitergabe abgehörter Nachrichten und die Herstellung oder den Vertrieb getarnter Abhöranlagen mit Freiheitsstrafe bis zu zwei Jahren oder Geldstrafe.
  "28": Regelt Ordnungswidrigkeiten, etwa die unzulässige Verarbeitung von Verkehrsdaten oder Speicherung von Informationen in Endeinrichtungen ohne Einwilligung, mit Geldbußen bis zu dreihunderttausend Euro.
  "29": Regelt die Zuständigkeit der oder des Bundesbeauftragten für den Datenschutz und die Informationsfreiheit als Aufsichtsbehörde für Telekommunikationsdienste und für § 25 bei Telekommunikationsanbietern und öffentlichen Stellen des Bundes.

# English: written from the verified German summaries and the German text
# (German is the only authentic version; no model translation).
en:
  "1": Sets out the subject matter of the Act, including the secrecy of telecommunications, data protection in telecommunications and digital services, privacy in terminal equipment and supervision.
  "2": Applies the definitions of the Telecommunications Act, the Digitale-Dienste-Gesetz and the GDPR, unless paragraph 2 provides otherwise, and adds definitions of its own.
  "3":
    title: Confidentiality of Communications – Secrecy of Telecommunications
    summary: Obliges telecommunications service providers, operators of telecommunications networks and systems and those involved to observe the secrecy of telecommunications, which protects the content and circumstances of telecommunications.
  "4": Clarifies that the secrecy of telecommunications does not prevent heirs or other authorised persons from exercising the end user's rights against the provider.
  "5": Allows radio equipment to be used only to listen to messages intended for its operator, radio amateurs or the general public, and prohibits passing on other messages received.
  "6": Sets out the conditions under which providers of services requiring intermediate storage, such as voice or text messages, may process the content of end users' messages.
  "7": Regulates when providers and those involved may require an official identity document to verify an end user's details.
  "8": Prohibits possessing, manufacturing, selling or importing telecommunications equipment that is disguised as another object and intended for covert eavesdropping or recording.
  "9": Allows traffic data to be processed only as necessary to establish and maintain telecommunications, for billing or to establish further connections.
  "10":
    title: Determination and Billing of Charges
    summary: Regulates how providers may process traffic data to determine and bill charges and transmit them to third parties.
  "11":
    title: Itemised Bill
    summary: Gives the end user the right to an itemised bill of chargeable connections if requested before the relevant billing period.
  "12": Allows traffic data and control data to be processed as necessary to detect and remove faults in telecommunications systems and to detect misuse of telecommunications services.
  "13": Allows location data to be processed for value added services only if anonymised or with consent, and requires the provider to inform the end user each time the location is determined.
  "13a": Regulates the processing of personal data by telecommunications providers to comply with European production or preservation orders under Regulation (EU) 2023/1543.
  "14": Requires the provider, on written request, to disclose the holders of the calling lines to a subscriber who credibly shows that they receive threatening or harassing calls.
  "15": Requires providers of voice communications services to let calling and called end users suppress the display of their number permanently or per call and reject calls with suppressed numbers.
  "16": Requires providers of voice communications services to let end users stop automatic call forwarding initiated by a third party, where technically possible.
  "17":
    title: End User Directories
    summary: Regulates the entry of subscribers in end user directories and their rights to have entries made, corrected and deleted.
  "18": Requires providers of number-based interpersonal telecommunications services to make end user data available on request for publicly available directory enquiry services.
  "19": Requires providers of digital services to take technical and organisational measures so that users can end the service at any time and use it protected against third parties, and to allow anonymous or pseudonymous use where possible.
  "20": Prohibits providers of digital services from processing minors' personal data for commercial purposes if the data were collected for the protection of minors.
  "21":
    title: Subscriber Data
    summary: Allows providers of digital services to disclose subscriber data in individual cases, for example to enforce intellectual property rights or civil claims for infringements of absolutely protected rights.
  "22":
    title: Disclosure Procedure for Subscriber Data
    summary: Allows providers of digital services to use subscriber data to meet disclosure obligations towards certain authorities and regulates the procedure.
  "23": Allows providers of digital services to use passwords and other access data only under special conditions to meet disclosure obligations towards certain authorities.
  "24": Allows providers of digital services to use usage data to meet disclosure obligations towards certain authorities and regulates the procedure.
  "24a": Allows providers of digital services and other addressees to process personal data as necessary to comply with a European production or preservation order.
  "25":
    title: Protection of Privacy in Terminal Equipment
    summary: Allows information to be stored in or accessed from an end user's terminal equipment only with consent, unless strictly necessary to transmit a message or to provide a digital service explicitly requested by the user.
  "26": Regulates the recognition of consent management services by an independent body, subject to requirements on user-friendliness, independence and security.
  "27":
    title: Criminal Provisions
    summary: Makes unlawful eavesdropping with radio equipment, passing on intercepted messages and manufacturing or selling disguised eavesdropping devices punishable by imprisonment of up to two years or a fine.
  "28":
    title: Provisions on Fines
    summary: Defines regulatory offences, such as unlawful processing of traffic data or storing information in terminal equipment without consent, with fines of up to three hundred thousand euros.
  "29": Makes the Federal Commissioner for Data Protection and Freedom of Information the supervisory authority for telecommunications services and for § 25 as regards telecommunications providers and federal public bodies.
  "30": Makes the Federal Network Agency the supervisory authority for Part 2 where the Federal Commissioner is not competent, and sets out its powers of inspection and enforcement.

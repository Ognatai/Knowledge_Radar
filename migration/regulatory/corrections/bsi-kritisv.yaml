# Reviewed corrections of the model summaries (source language: de).
# Each sector section: critical services (para. 1), areas (Bereiche), and critical facilities =
# facilities of the annex categories (column B) that reach the threshold (column D).
de:
  "1": Bestimmt die Begriffe Anlage, Versorgungsgrad und Schwellenwert und regelt, welche Anlagenteile und Nebeneinrichtungen einer Anlage zuzurechnen sind und wann mehrere Anlagen als gemeinsame Anlage gelten.
  "2": Bestimmt Strom-, Gas-, Kraftstoff- und Heizöl- sowie Fernwärmeversorgung als kritische Dienstleistungen im Sektor Energie, gliedert sie in Bereiche und erklärt Anlagen der Kategorien in Anhang 1 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "3": Bestimmt Trinkwasserversorgung und Abwasserbeseitigung als kritische Dienstleistungen im Sektor Wasser, gliedert sie in Bereiche und erklärt Anlagen der Kategorien in Anhang 2 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "4": Bestimmt die Lebensmittelversorgung mit den Bereichen Herstellung und Behandlung sowie Handel als kritische Dienstleistung im Sektor Ernährung und erklärt Anlagen der Kategorien in Anhang 3 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "5": Bestimmt Sprach- und Datenübertragung sowie Datenspeicherung und -verarbeitung (Housing, IT-Hosting, Vertrauensdienste) als kritische Dienstleistungen und erklärt Anlagen der Kategorien in Anhang 4 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "6": Bestimmt stationäre medizinische Versorgung, lebenserhaltende Medizinprodukte, verschreibungspflichtige Arzneimittel, Blut- und Plasmakonzentrate sowie Laboratoriumsdiagnostik als kritische Dienstleistungen und erklärt Anlagen der Kategorien in Anhang 5 ab dem Schwellenwert zu kritischen Anlagen.
  "7": Bestimmt Bargeldversorgung, kartengestützten und konventionellen Zahlungsverkehr sowie Wertpapier- und Derivatehandel mit Verrechnung und Abwicklung als kritische Dienstleistungen und erklärt Anlagen der Kategorien in Anhang 6 ab dem Schwellenwert zu kritischen Anlagen.
  "8": Gliedert die Leistungen der Sozialversicherung und der Grundsicherung für Arbeitsuchende in Bereiche und erklärt Anlagen der Kategorien in Anhang 9 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "9": Bestimmt den Personen- und Güterverkehr, von Luft- und Eisenbahnverkehr bis zu ÖPNV und Logistik, als kritische Dienstleistung und erklärt Anlagen der Kategorien in Anhang 7 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "10": Bestimmt die Entsorgung von Siedlungsabfällen als kritische Dienstleistung und erklärt Anlagen der Kategorien in Anhang 8 ab dem dort festgelegten Schwellenwert zu kritischen Anlagen.
  "11": Schreibt vor, die kritischen Dienstleistungen und Bereiche, die Anlagenkategorien und die Schwellenwerte alle zwei Jahre unter Beteiligung der Ressorts und unter Berücksichtigung von Erkenntnissen der Betreiber, ihrer Verbände und der Wissenschaft zu evaluieren.
  "12": Lässt die Verordnung außer Kraft treten, sobald die Rechtsverordnung nach § 4 Absatz 3 und § 5 Absatz 1 des KRITIS-Dachgesetzes in Kraft tritt; das Bundesministerium des Innern gibt den Zeitpunkt im Bundesgesetzblatt bekannt.

# English: written from the verified German summaries and the German text
# (German is the only authentic version; no model translation).
en:
  "1":
    title: Definitions
    summary: Defines facility, level of supply and threshold, and determines which installation parts and ancillary facilities belong to a facility and when several facilities count as one joint facility.
  "2":
    title: Energy Sector
    summary: Designates electricity, gas, fuel and heating oil, and district heating supply as critical services in the energy sector, divides them into areas and classifies facilities of the categories in Annex 1 that reach the threshold set there as critical facilities.
  "3":
    title: Water Sector
    summary: Designates drinking water supply and wastewater disposal as critical services in the water sector, divides them into areas and classifies facilities of the categories in Annex 2 that reach the threshold set there as critical facilities.
  "4":
    title: Food Sector
    summary: Designates food supply, with the areas of production and processing and of trade, as a critical service in the food sector and classifies facilities of the categories in Annex 3 that reach the threshold set there as critical facilities.
  "5":
    title: Information Technology and Telecommunications Sector
    summary: Designates voice and data transmission and data storage and processing (housing, IT hosting, trust services) as critical services and classifies facilities of the categories in Annex 4 that reach the threshold set there as critical facilities.
  "6":
    title: Health Sector
    summary: Designates inpatient medical care, life-sustaining medical devices, prescription medicines, blood and plasma concentrates and laboratory diagnostics as critical services and classifies facilities of the categories in Annex 5 that reach the threshold as critical facilities.
  "7":
    title: Finance Sector
    summary: Designates cash supply, card-based and conventional payment transactions, and securities and derivatives trading including clearing and settlement as critical services and classifies facilities of the categories in Annex 6 that reach the threshold as critical facilities.
  "8":
    title: Social Insurance Benefits and Basic Income Support for Jobseekers Sector
    summary: Divides social insurance benefits and basic income support for jobseekers into areas and classifies facilities of the categories in Annex 9 that reach the threshold set there as critical facilities.
  "9":
    title: Transport and Traffic Sector
    summary: Designates passenger and freight transport, from air and rail transport to local public transport and logistics, as a critical service and classifies facilities of the categories in Annex 7 that reach the threshold set there as critical facilities.
  "10":
    title: Municipal Waste Disposal Sector
    summary: Designates the disposal of municipal waste as a critical service and classifies facilities of the categories in Annex 8 that reach the threshold set there as critical facilities.
  "11":
    title: Evaluation
    summary: Requires the critical services and areas, the facility categories and the thresholds to be evaluated every two years, involving the ministries concerned and taking into account findings of operators, their associations and researchers.
  "12":
    title: Expiry
    summary: Provides that the Ordinance ceases to have effect when the ordinance under § 4(3) and § 5(1) of the KRITIS Umbrella Act (KRITIS-Dachgesetz) enters into force; the Federal Ministry of the Interior announces the date in the Federal Law Gazette.

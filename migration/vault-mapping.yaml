# Hand-maintained mapping from the Obsidian vault ("Wissensdatenbank") to this
# repository: stable English IDs (future note slugs), bilingual titles, entity
# type, and which note template applies. Input for
# `python -m app.agents.vault_inventory`.
#
# The note template follows from the area: legal -> regulatory, otherwise
# technical; a `template:` key on an entry overrides that.
# hub: true  marks overview notes (MOCs). They are not migrated as notes; their
#            sections become topic groups in the inventory.
# Technology is not yet in schema.yaml; see schema_proposals.md.


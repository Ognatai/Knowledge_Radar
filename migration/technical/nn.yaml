# Migration package "Neural networks and deep learning architectures": input for
# `python -m app.agents.technical_notes <command> nn`.
# arXiv sources are verified against the `expect` title fragment; DOIs checked against Crossref,
# abstracts against OpenAlex where available; documentation pages read directly.
notes:
  neural-networks:
    sources:
      - url: https://doi.org/10.1038/323533a0
        citation: "Rumelhart, D. E., Hinton, G. E. & Williams, R. J. (1986). *Learning representations by back-propagating errors.* Nature 323."
        short: Rumelhart et al. (1986)
        link_label: doi:10.1038/323533a0
        summary: "Describes back-propagation, a learning procedure for networks of neuron-like units: the weights of the connections are repeatedly adjusted to minimise the difference between the actual output vector and the desired output vector. As a result, hidden units that are neither input nor output come to represent important features of the task domain."
      - url: https://doi.org/10.1016/0893-6080%2889%2990020-8
        citation: "Hornik, K., Stinchcombe, M. & White, H. (1989). *Multilayer feedforward networks are universal approximators.* Neural Networks 2(5)."
        short: Hornik et al. (1989)
        link_label: doi:10.1016/0893-6080(89)90020-8
        summary: "Proves that standard multilayer feedforward networks with as few as one hidden layer using arbitrary squashing activation functions can approximate any Borel measurable function to any desired degree of accuracy, provided sufficiently many hidden units are available."
      - url: https://doi.org/10.1038/nature14539
        citation: "LeCun, Y., Bengio, Y. & Hinton, G. (2015). *Deep learning.* Nature 521."
        short: LeCun et al. (2015)
        link_label: doi:10.1038/nature14539
        summary: "Review of deep learning: computational models composed of multiple processing layers learn representations of data with multiple levels of abstraction, adjusting their parameters with the backpropagation algorithm. Deep convolutional networks brought breakthroughs in processing images, video, speech and audio, and recurrent networks in sequential data such as text and speech."
      - url: https://www.deeplearningbook.org/
        citation: "Goodfellow, I., Bengio, Y. & Courville, A. (2016). *Deep Learning.* MIT Press."
        short: Goodfellow et al. (2016)
        link_label: online edition
        summary: "Textbook on deep learning. Deep feedforward networks (multilayer perceptrons) compose layers of units, each computing a weighted sum of its inputs plus a bias followed by a non-linear activation function; the rectified linear unit (ReLU) is the default recommendation for hidden units, while sigmoid and tanh saturate. Output units and loss are chosen together (e.g. softmax with cross-entropy for classification); the forward pass computes outputs from inputs layer by layer, and back-propagation computes gradients efficiently with the chain rule."
  neural-network-training:
    sources:
      - url: https://www.deeplearningbook.org/
        citation: "Goodfellow, I., Bengio, Y. & Courville, A. (2016). *Deep Learning.* MIT Press."
        short: Goodfellow et al. (2016)
        link_label: online edition
        summary: "Textbook on deep learning. Training minimises a loss such as cross-entropy or mean squared error with gradient-based optimisation; back-propagation computes the gradients with the chain rule. Stochastic gradient descent estimates the gradient on minibatches; one epoch is one pass over the training set. The learning rate is the most important hyperparameter; momentum and adaptive methods (AdaGrad, RMSProp, Adam) adjust the updates; parameter initialisation, batch normalisation and early stopping affect optimisation and generalisation."
      - url: https://proceedings.mlr.press/v9/glorot10a.html
        citation: "Glorot, X. & Bengio, Y. (2010). *Understanding the difficulty of training deep feedforward neural networks.* AISTATS 2010."
        short: Glorot & Bengio (2010)
        link_label: PMLR
        summary: "Studies why standard gradient descent from random initialisation does poorly with deep networks: with sigmoid activations the top hidden layer can saturate, and activations and gradients vary across layers. Proposes a new initialisation scheme, scaled to the number of inputs and outputs of each layer, that brings substantially faster convergence."
      - {arxiv: "1502.01852", expect: "Delving Deep into Rectifiers", venue: ICCV 2015}
      - {arxiv: "1412.6980", expect: "Adam", venue: ICLR 2015}
      - {arxiv: "1711.05101", expect: "Decoupled Weight Decay Regularization", venue: ICLR 2019}
      - {arxiv: "1502.03167", expect: "Batch Normalization", venue: ICML 2015}
  convolutional-neural-networks:
    sources:
      - url: https://doi.org/10.1109/5.726791
        citation: "LeCun, Y., Bottou, L., Bengio, Y. & Haffner, P. (1998). *Gradient-based learning applied to document recognition.* Proceedings of the IEEE 86(11)."
        short: LeCun et al. (1998)
        link_label: doi:10.1109/5.726791
        summary: "Multilayer networks trained with back-propagation can classify high-dimensional patterns such as handwritten characters with minimal preprocessing. Convolutional neural networks, designed to deal with the variability of 2D shapes, outperformed all other techniques on a standard handwritten digit recognition task. Also introduces graph transformer networks for training multi-module document recognition systems globally."
      - url: https://doi.org/10.1145/3065386
        citation: "Krizhevsky, A., Sutskever, I. & Hinton, G. E. (2017). *ImageNet classification with deep convolutional neural networks.* Communications of the ACM 60(6) (NeurIPS 2012)."
        short: Krizhevsky et al. (2012)
        link_label: doi:10.1145/3065386
        summary: "A large deep convolutional network with 60 million parameters and 650,000 neurons, five convolutional layers (some followed by max-pooling) and three fully connected layers with a 1000-way softmax, classified the 1.2 million ImageNet LSVRC-2010 images into 1000 classes with top-1 and top-5 error rates of 37.5% and 17.0%. It used non-saturating neurons, an efficient GPU implementation and dropout; a variant won ILSVRC-2012 with 15.3% top-5 error versus 26.2% for the second-best entry."
      - {arxiv: "1409.1556", expect: "Very Deep Convolutional Networks", venue: ICLR 2015}
      - {arxiv: "1512.03385", expect: "Deep Residual Learning for Image Recognition", venue: CVPR 2016}
      - url: https://www.deeplearningbook.org/
        citation: "Goodfellow, I., Bengio, Y. & Courville, A. (2016). *Deep Learning.* MIT Press."
        short: Goodfellow et al. (2016)
        link_label: online edition
        summary: "Textbook chapter on convolutional networks: a convolution slides a small kernel (filter) over the input and computes weighted sums, which gives sparse interactions, parameter sharing and equivariance to translation. Inputs and feature maps have several channels; each filter produces one output channel. Stride and padding determine the output size, and pooling (e.g. max pooling) summarises nearby outputs and makes the representation approximately invariant to small translations."
  recurrent-neural-networks:
    sources:
      - url: https://www.deeplearningbook.org/
        citation: "Goodfellow, I., Bengio, Y. & Courville, A. (2016). *Deep Learning.* MIT Press."
        short: Goodfellow et al. (2016)
        link_label: online edition
        summary: "Textbook chapter on recurrent neural networks: an RNN processes a sequence step by step, sharing the same parameters across time steps and carrying a hidden state that summarises the past. It is trained by back-propagation through time, i.e. back-propagation on the network unrolled over the sequence. Long-term dependencies are hard to learn because gradients propagated over many steps tend to vanish or explode; gated RNNs such as the LSTM and GRU address this."
      - url: https://doi.org/10.1109/72.279181
        citation: "Bengio, Y., Simard, P. & Frasconi, P. (1994). *Learning long-term dependencies with gradient descent is difficult.* IEEE Transactions on Neural Networks 5(2)."
        short: Bengio et al. (1994)
        link_label: doi:10.1109/72.279181
        summary: "Shows why gradient-based learning algorithms for recurrent networks face an increasingly difficult problem as the duration of the dependencies to be captured increases, exposing a trade-off between efficient learning by gradient descent and latching on to information for long periods; alternatives to standard gradient descent are considered."
      - url: https://doi.org/10.1162/neco.1997.9.8.1735
        citation: "Hochreiter, S. & Schmidhuber, J. (1997). *Long Short-Term Memory.* Neural Computation 9(8)."
        short: Hochreiter & Schmidhuber (1997)
        link_label: doi:10.1162/neco.1997.9.8.1735
        summary: "Introduces the LSTM recurrent network, whose memory cells with multiplicative gate units keep error flow constant over long time lags and so allow learning dependencies over more than 1000 time steps, where earlier recurrent networks failed because of vanishing or exploding gradients."
      - {arxiv: "1406.1078", expect: "Learning Phrase Representations using RNN Encoder-Decoder", venue: EMNLP 2014}
      - {arxiv: "1409.3215", expect: "Sequence to Sequence Learning with Neural Networks", venue: NeurIPS 2014}
      - url: https://otexts.com/fpp3/
        citation: "Hyndman, R. J. & Athanasopoulos, G. (2021). *Forecasting: Principles and Practice* (3rd ed.). OTexts."
        short: Hyndman & Athanasopoulos (2021)
        link_label: online edition
        summary: "Open textbook on forecasting: time series patterns (trend, seasonality, cycles), autocorrelation, stationarity, exponential smoothing and ARIMA models, neural network autoregression (feed-forward networks on lagged values), and forecast evaluation on later test data with time series cross-validation."
  attention-and-transformers:
    sources:
      - {arxiv: "1409.3215", expect: "Sequence to Sequence Learning with Neural Networks", venue: NeurIPS 2014}
      - {arxiv: "1409.0473", expect: "Neural Machine Translation by Jointly Learning to Align and Translate", venue: ICLR 2015}
      - {arxiv: "1706.03762", expect: "Attention Is All You Need", venue: NeurIPS 2017}
      - {arxiv: "1810.04805", expect: "BERT", venue: NAACL 2019}
      - {arxiv: "2010.11929", expect: "An Image is Worth 16x16 Words", venue: ICLR 2021}
      - {arxiv: "2205.14135", expect: "FlashAttention", venue: NeurIPS 2022}
      - url: https://edoc.ub.uni-muenchen.de/36297/
        citation: "Urchs, S. (2025). *Detecting Gender Discrimination in Natural Language Processing.* Dissertation, Ludwig-Maximilians-Universität München."
        short: Urchs (2025)
        link_label: LMU edoc
        summary: "Dissertation on gender discrimination in NLP with a background chapter on large language models. Describes the Transformer of Vaswani et al.: encoder and decoder of N identical layers; encoder layers with multi-head self-attention and a position-wise feed-forward network, decoder layers adding cross-attention over the encoder outputs; residual connections and layer normalisation around every sub-layer. Scaled dot-product attention softmax(QK^T / sqrt(d_k))V weights values by query-key similarity; h parallel heads with learned projections attend to different subspaces and are concatenated. Describes three model families built on it: BERT (encoder only, bidirectional; masked language modelling masks 15% of tokens and next sentence prediction; [CLS] representation for classification, token vectors for NER or QA), T5 (encoder-decoder that casts every task as text-to-text with task prefixes such as 'summarize:') and the GPT family (decoder only, autoregressive next-token prediction; GPT-3 with 175 billion parameters showed few-shot learning via prompts; assistant models add reinforcement learning from human feedback)."
  autoencoders-and-gans:
    sources:
      - url: https://doi.org/10.1126/science.1127647
        citation: "Hinton, G. E. & Salakhutdinov, R. R. (2006). *Reducing the Dimensionality of Data with Neural Networks.* Science 313(5786)."
        short: Hinton & Salakhutdinov (2006)
        link_label: doi:10.1126/science.1127647
        summary: "A multilayer neural network with a small central layer (autoencoder) is trained to reconstruct its inputs, converting high-dimensional data to low-dimensional codes. With a suitable weight initialisation, deep autoencoders learn codes that work much better than principal components analysis for dimensionality reduction."
      - {arxiv: "1312.6114", expect: "Auto-Encoding Variational Bayes", venue: ICLR 2014}
      - {arxiv: "1406.2661", expect: "Generative Adversarial Networks", venue: NeurIPS 2014}
      - {arxiv: "1511.06434", expect: "Deep Convolutional Generative Adversarial Networks", venue: ICLR 2016}
      - {arxiv: "1701.07875", expect: "Wasserstein GAN", venue: ICML 2017}

  keras-and-tensorflow:
    sources:
      - {arxiv: "1603.04467", expect: "TensorFlow", venue: Whitepaper}
      - url: https://keras.io/guides/sequential_model/
        citation: "Keras team. *The Sequential model.* Keras developer guide."
        short: Keras Sequential guide
        link_label: keras.io
        summary: "A Sequential model is appropriate for a plain stack of layers where each layer has exactly one input tensor and one output tensor, e.g. keras.Sequential([layers.Dense(2, activation='relu'), layers.Dense(3, activation='relu'), layers.Dense(4)]). It is not appropriate for models with multiple inputs or outputs, layers with multiple inputs or outputs, layer sharing or non-linear topology. The Keras developer guides cover training with JAX, TensorFlow and PyTorch backends."
      - url: https://keras.io/guides/functional_api/
        citation: "Keras team. *The Functional API.* Keras developer guide."
        short: Keras Functional API guide
        link_label: keras.io
        summary: "The Keras functional API creates models that are more flexible than the Sequential API: it can handle models with non-linear topology, shared layers and multiple inputs or outputs. A deep learning model is usually a directed acyclic graph of layers, and the functional API builds such graphs by calling layers on inputs and creating a model from inputs and outputs. Models can also be created by subclassing the Model class."
      - url: https://keras.io/guides/training_with_built_in_methods/
        citation: "Keras team. *Training & evaluation with the built-in methods.* Keras developer guide."
        short: Keras training guide
        link_label: keras.io
        summary: "To train a model with fit(), a loss function, an optimizer and optionally metrics are specified by passing them to the compile() method, e.g. optimizer RMSprop, loss SparseCategoricalCrossentropy and an accuracy metric. fit() then trains the model on the data for a number of epochs with a batch size, can hold out validation data, and evaluate() and predict() evaluate the model and generate predictions; callbacks such as early stopping and checkpointing hook into training."
      - {arxiv: "1912.01703", expect: "PyTorch", venue: NeurIPS 2019}

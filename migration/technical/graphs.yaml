# Migration package "Knowledge graphs and embeddings": input for
# `python -m app.agents.technical_notes <command> graphs`.
# arXiv sources are verified against the `expect` title fragment; DOIs checked against Crossref,
# abstracts against OpenAlex; W3C specifications and documentation read directly.
notes:
  knowledge-graphs:
    sources:
      - {arxiv: "2003.02320", expect: "Knowledge Graphs", venue: ACM Computing Surveys 2021}
      - url: https://www.w3.org/TR/rdf11-concepts/
        citation: "W3C (2014). *RDF 1.1 Concepts and Abstract Syntax.* W3C Recommendation."
        short: W3C RDF 1.1 Concepts
        link_label: w3.org
        summary: "RDF represents information as a graph of triples, each consisting of a subject, a predicate and an object. Subjects and predicates are IRIs (or blank nodes for subjects); objects can be IRIs, literals (values such as strings or numbers with an optional datatype or language tag) or blank nodes. A set of triples is an RDF graph; an RDF dataset groups a default graph and named graphs. IRIs give resources globally unique names, so data from different sources can be merged."
      - url: https://www.w3.org/TR/owl2-primer/
        citation: "W3C (2012). *OWL 2 Web Ontology Language Primer (Second Edition).* W3C Recommendation."
        short: W3C OWL 2 Primer
        link_label: w3.org
        summary: "OWL 2 is a language for ontologies: it describes classes, properties, individuals and data values with formally defined meaning, so that reasoners can derive implicit knowledge and check consistency. Classes form hierarchies (subclass), properties can be declared transitive, symmetric, inverse or functional, and domain and range restrict their use. OWL follows the open-world assumption: missing information is not taken as false."
      - url: https://neo4j.com/docs/cypher-manual/current/introduction/
        citation: "Neo4j. *Cypher Manual: Introduction.* Neo4j documentation."
        short: Neo4j Cypher Manual
        link_label: neo4j.com
        summary: "Cypher is Neo4j's declarative query language for property graphs. A property graph consists of nodes, which can have labels, and relationships, which have exactly one type and a direction; both nodes and relationships can carry properties as key-value pairs. Queries describe the graph patterns to find with an ASCII-art-like syntax, e.g. (a:Person)-[:KNOWS]->(b:Person), using clauses such as MATCH, WHERE and RETURN."
      - {arxiv: "2002.00388", expect: "A Survey on Knowledge Graphs", venue: IEEE TNNLS 2022}
      - {arxiv: "2306.08302", expect: "Unifying Large Language Models and Knowledge Graphs", venue: IEEE TKDE 2024}
      - {arxiv: "2404.16130", expect: "From Local to Global"}
  knowledge-graph-engineering:
    sources:
      - {arxiv: "2003.02320", expect: "Knowledge Graphs", venue: ACM Computing Surveys 2021}
      - url: https://www.w3.org/TR/shacl/
        citation: "W3C (2017). *Shapes Constraint Language (SHACL).* W3C Recommendation."
        short: W3C SHACL
        link_label: w3.org
        summary: "SHACL is a language for validating RDF graphs against a set of conditions, called shapes. Shapes graphs describe constraints such as required properties, cardinalities (sh:minCount, sh:maxCount), datatypes, value classes and patterns for the focus nodes they target; a SHACL processor checks a data graph against them and produces a validation report listing every violation. Unlike OWL, SHACL checks data under a closed-world view."
      - {arxiv: "1905.06397", expect: "End-to-End Entity Resolution for Big Data", venue: ACM Computing Surveys 2021}
      - url: https://doi.org/10.3233/SW-160218
        citation: "Paulheim, H. (2017). *Knowledge graph refinement: A survey of approaches and evaluation methods.* Semantic Web 8(3)."
        short: Paulheim (2017)
        link_label: doi:10.3233/SW-160218
        summary: "Survey of knowledge graph refinement: since knowledge graphs such as DBpedia, YAGO and Freebase are never complete or fully correct, refinement methods either add missing knowledge (completion, e.g. missing types or relations) or identify erroneous information (error detection). The survey categorises approaches by goal, the refined targets and whether they use internal or external knowledge, and reviews how refinement is evaluated, e.g. against a partial gold standard, by retrospective human evaluation or against the graph itself."
      - url: https://doi.org/10.3233/SW-150175
        citation: "Zaveri, A., Rula, A., Maurino, A., Pietrobon, R., Lehmann, J. & Auer, S. (2016). *Quality assessment for Linked Data: A Survey.* Semantic Web 7(1)."
        short: Zaveri et al. (2016)
        link_label: doi:10.3233/SW-150175
        summary: "Systematic review of approaches for assessing the quality of Linked Data, whose quality ranges from extensively curated to crowdsourced and extracted data of low quality. Unifies terminology and lists 18 quality dimensions and 69 metrics, and analyses 30 core approaches and 12 tools."
      - url: https://www.w3.org/TR/prov-o/
        citation: "W3C (2013). *PROV-O: The PROV Ontology.* W3C Recommendation."
        short: W3C PROV-O
        link_label: w3.org
        summary: "PROV-O expresses provenance in OWL: entities (things such as documents or datasets), activities (processes that use and generate entities) and agents (people, organisations or software responsible for activities), connected by relations such as wasGeneratedBy, used, wasDerivedFrom and wasAttributedTo. It allows recording where data came from and how it was produced."
  graph-databases:
    sources:
      - url: https://doi.org/10.1145/1322432.1322433
        citation: "Angles, R. & Gutierrez, C. (2008). *Survey of graph database models.* ACM Computing Surveys 40(1)."
        short: Angles & Gutierrez (2008)
        link_label: doi:10.1145/1322432.1322433
        summary: "Graph database models are those in which data structures for schema and instances are modelled as graphs or generalisations of them, and data manipulation is expressed by graph-oriented operations. They took off in the 1980s and early 1990s, faded with other models, and regained relevance with the need to manage information of graph-like nature. The survey covers data structures, query languages and integrity constraints."
      - url: https://doi.org/10.1145/3183713.3190657
        citation: "Francis, N., Green, A., Guagliardo, P., Libkin, L., Lindaaker, T., Marsault, V., Plantikow, S., Rydberg, M., Selmer, P. & Taylor, A. (2018). *Cypher: An Evolving Query Language for Property Graphs.* SIGMOD 2018."
        short: Francis et al. (2018)
        link_label: doi:10.1145/3183713.3190657
        summary: "Describes Cypher 9, the property graph query language originally designed for the Neo4j graph database and used by several commercial products, governed by the openCypher Implementers Group. Gives a formal semantics of the core read-query features, including its property graph data model and its ASCII-art graph pattern matching for expressing subgraphs of interest, and compares Cypher with other property graph query languages."
      - url: https://www.w3.org/TR/sparql11-query/
        citation: "W3C (2013). *SPARQL 1.1 Query Language.* W3C Recommendation."
        short: W3C SPARQL 1.1
        link_label: w3.org
        summary: "SPARQL is the query language for RDF. Queries match triple patterns, i.e. triples that may contain variables, against an RDF graph; basic graph patterns are combined with FILTER, OPTIONAL and UNION, results can be grouped, aggregated, ordered and limited, and property paths match paths of arbitrary length. Query forms are SELECT, CONSTRUCT, ASK and DESCRIBE."
      - url: https://neo4j.com/docs/cypher-manual/current/introduction/
        citation: "Neo4j. *Cypher Manual: Introduction.* Neo4j documentation."
        short: Neo4j Cypher Manual
        link_label: neo4j.com
        summary: "Cypher is Neo4j's declarative query language for property graphs. A property graph consists of nodes, which can have labels, and relationships, which have exactly one type and a direction; both can carry properties as key-value pairs. Queries describe graph patterns with an ASCII-art-like syntax, e.g. (a:Person)-[:KNOWS]->(b:Person), using clauses such as MATCH, WHERE, CREATE and RETURN."
      - {arxiv: "2003.02320", expect: "Knowledge Graphs", venue: ACM Computing Surveys 2021}

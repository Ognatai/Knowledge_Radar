  ontology-design:
    sources:
      - url: https://protege.stanford.edu/publications/ontology_development/ontology101.pdf
        citation: "Noy, N. F. & McGuinness, D. L. (2001). *Ontology Development 101: A Guide to Creating Your First Ontology.* Stanford Knowledge Systems Laboratory Technical Report KSL-01-05."
        short: Noy & McGuinness (2001)
        link_label: PDF
        summary: "Guide to building an ontology, i.e. an explicit formal specification of the terms in a domain and the relations among them. Reasons to develop one include sharing a common understanding of the structure of information, enabling reuse of domain knowledge, making domain assumptions explicit and separating domain knowledge from operational knowledge. Proposes an iterative process: determine the domain and scope, using competency questions the ontology should be able to answer; consider reusing existing ontologies; enumerate important terms; define classes and the class hierarchy (top-down, bottom-up or combined); define properties (slots) and their facets such as value type and cardinality; and create instances. There is no single correct way to model a domain; the best solution depends on the intended application."
      - url: https://www.w3.org/TR/owl2-primer/
        citation: "W3C (2012). *OWL 2 Web Ontology Language Primer (Second Edition).* W3C Recommendation."
        short: W3C OWL 2 Primer
        link_label: w3.org
        summary: "OWL 2 is a language for ontologies with formally defined meaning: classes, properties, individuals and data values. Classes form hierarchies and can be declared disjoint; properties can be transitive, symmetric, inverse or functional, and domain and range restrict their use; reasoners derive implicit knowledge and check consistency. OWL follows the open-world assumption: missing information is not taken as false."
      - url: https://www.w3.org/TR/rdf-schema/
        citation: "W3C (2014). *RDF Schema 1.1.* W3C Recommendation."
        short: W3C RDF Schema 1.1
        link_label: w3.org
        summary: "RDF Schema provides a basic vocabulary for describing RDF data: rdfs:Class and rdf:type for classes and membership, rdfs:subClassOf and rdfs:subPropertyOf for hierarchies, rdfs:domain and rdfs:range to state which classes a property connects, and rdfs:label and rdfs:comment for human-readable descriptions."
      - url: https://www.w3.org/TR/skos-reference/
        citation: "W3C (2009). *SKOS Simple Knowledge Organization System Reference.* W3C Recommendation."
        short: W3C SKOS
        link_label: w3.org
        summary: "SKOS is a vocabulary for representing thesauri, classification schemes and taxonomies in RDF: concepts (skos:Concept) grouped in concept schemes, preferred and alternative labels (skos:prefLabel, skos:altLabel), and broader, narrower and related links between concepts. It is lighter than OWL and intended for knowledge organisation rather than formal logic."
      - {arxiv: "2003.02320", expect: "Knowledge Graphs", venue: ACM Computing Surveys 2021}
  transe:
    sources:
      - url: https://papers.nips.cc/paper/5071-translating-embeddings-for-modeling-multi-relational-data
        citation: "Bordes, A., Usunier, N., Garcia-Durán, A., Weston, J. & Yakhnenko, O. (2013). *Translating Embeddings for Modeling Multi-relational Data.* NeurIPS 2013."
        short: Bordes et al. (2013)
        link_label: NeurIPS proceedings
        summary: "TransE embeds entities and relationships of multi-relational data in low-dimensional vector spaces and models a relationship as a translation on the entity embeddings: for a true triple (head, relation, tail), the head embedding plus the relation vector should be close to the tail embedding. It is trained with a margin-based ranking loss against corrupted triples in which head or tail are replaced. The model is easy to train, has few parameters, outperformed earlier methods on link prediction on WordNet and Freebase, and was trained on a large dataset with 1 million entities, 25,000 relationships and more than 17 million training triples. The paper notes that one-to-many and many-to-many relations are harder for the model."
      - {arxiv: "1412.6575", expect: "Embedding Entities and Relations for Learning and Inference in Knowledge Bases", venue: ICLR 2015}
      - url: https://doi.org/10.1109/TKDE.2017.2754499
        citation: "Wang, Q., Mao, Z., Wang, B. & Guo, L. (2017). *Knowledge Graph Embedding: A Survey of Approaches and Applications.* IEEE Transactions on Knowledge and Data Engineering 29(12)."
        short: Wang et al. (2017)
        link_label: doi:10.1109/TKDE.2017.2754499
        summary: "Survey of knowledge graph embedding, which embeds entities and relations into continuous vector spaces while preserving the graph's structure, for tasks such as knowledge graph completion and relation extraction. Distinguishes translational distance models such as TransE and its extensions (TransH, TransR) from semantic matching models such as RESCAL and DistMult, describes training with negative sampling, and discusses limitations of TransE for one-to-many, many-to-one and many-to-many relations."
      - {arxiv: "1902.10197", expect: "RotatE", venue: ICLR 2019}
  distmult:
    sources:
      - {arxiv: "1412.6575", expect: "Embedding Entities and Relations for Learning and Inference in Knowledge Bases", venue: ICLR 2015}
      - url: https://papers.nips.cc/paper/5071-translating-embeddings-for-modeling-multi-relational-data
        citation: "Bordes, A., Usunier, N., Garcia-Durán, A., Weston, J. & Yakhnenko, O. (2013). *Translating Embeddings for Modeling Multi-relational Data.* NeurIPS 2013."
        short: Bordes et al. (2013)
        link_label: NeurIPS proceedings
        summary: "TransE models a relationship as a translation on entity embeddings: head plus relation should be close to tail for true triples; trained with a margin-based ranking loss against corrupted triples."
      - {arxiv: "1606.06357", expect: "Complex Embeddings for Simple Link Prediction", venue: ICML 2016}
      - url: https://doi.org/10.1109/TKDE.2017.2754499
        citation: "Wang, Q., Mao, Z., Wang, B. & Guo, L. (2017). *Knowledge Graph Embedding: A Survey of Approaches and Applications.* IEEE Transactions on Knowledge and Data Engineering 29(12)."
        short: Wang et al. (2017)
        link_label: doi:10.1109/TKDE.2017.2754499
        summary: "Survey of knowledge graph embedding. Semantic matching models such as RESCAL score triples with a bilinear form between head and tail embeddings and a relation matrix; DistMult restricts the relation matrix to be diagonal, which reduces parameters but makes the score symmetric, so it can only model symmetric relations. Translational models such as TransE are the other main family."

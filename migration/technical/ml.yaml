# Migration package "ML basics": input for `python -m app.agents.technical_notes <command> ml`.
# arXiv sources are verified against the `expect` title fragment before drafting; summaries of
# non-arXiv sources describe only what the cited work is established to contain (DOIs checked
# against Crossref, abstracts against OpenAlex where available).
notes:
  classical-machine-learning:
    sources:
      - url: https://hastie.su.domains/ElemStatLearn/
        citation: "Hastie, T., Tibshirani, R. & Friedman, J. (2009). *The Elements of Statistical Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer."
        short: Hastie et al. (2009)
        link_label: book website
        summary: "Textbook on statistical learning: supervised learning (linear methods for regression and classification, basis expansions, kernel methods, model assessment and selection with cross-validation and bootstrap, trees, boosting, random forests, support vector machines, nearest neighbours, neural networks) and unsupervised learning (clustering, principal components). Frames prediction error through the bias-variance trade-off."
      - url: https://www.statlearning.com/
        citation: "James, G., Witten, D., Hastie, T. & Tibshirani, R. (2021). *An Introduction to Statistical Learning* (2nd ed.). Springer."
        short: James et al. (2021)
        link_label: book website
        summary: "Introductory textbook distinguishing supervised learning, where each observation has a response that the model predicts, from unsupervised learning, where there is no response and the goal is to find structure such as clusters. Covers linear and logistic regression, classification, resampling (cross-validation, bootstrap), regularisation, tree-based methods, support vector machines, deep learning, and unsupervised methods such as PCA and clustering."
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
      - {arxiv: "2207.08815", expect: "Why do tree-based models still outperform deep learning on tabular data", venue: NeurIPS 2022 Datasets and Benchmarks}
      - {arxiv: "2106.03253", expect: "Tabular Data: Deep Learning is Not All You Need"}
  classification:
    sources:
      - url: https://doi.org/10.1111/j.2517-6161.1958.tb00292.x
        citation: "Cox, D. R. (1958). *The Regression Analysis of Binary Sequences.* Journal of the Royal Statistical Society, Series B 20(2)."
        short: Cox (1958)
        link_label: doi:10.1111/j.2517-6161.1958.tb00292.x
        summary: "Considers a sequence of 0s and 1s where the chance that a trial is a 1 depends on one or more independent variables, and develops tests and estimates for this setting; an early foundation of logistic regression for binary outcomes."
      - url: https://doi.org/10.1111/j.1469-1809.1936.tb02137.x
        citation: "Fisher, R. A. (1936). *The Use of Multiple Measurements in Taxonomic Problems.* Annals of Eugenics 7(2)."
        short: Fisher (1936)
        link_label: doi:10.1111/j.1469-1809.1936.tb02137.x
        summary: "Introduces the linear discriminant function: a linear combination of several measurements chosen to best separate groups, illustrated with measurements of iris flowers (the Iris data set)."
      - url: https://proceedings.neurips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html
        citation: "Ng, A. Y. & Jordan, M. I. (2001). *On Discriminative vs. Generative Classifiers: A comparison of logistic regression and naive Bayes.* NIPS 14."
        short: Ng & Jordan (2001)
        link_label: NeurIPS proceedings
        summary: "Compares the generative classifier naive Bayes with the discriminative classifier logistic regression: the discriminative model has lower asymptotic error, but the generative model can approach its (higher) asymptotic error much faster, so with few training examples naive Bayes can perform better."
      - url: https://hastie.su.domains/ElemStatLearn/
        citation: "Hastie, T., Tibshirani, R. & Friedman, J. (2009). *The Elements of Statistical Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer."
        short: Hastie et al. (2009)
        link_label: book website
        summary: "Textbook chapters on linear methods for classification: linear discriminant analysis (LDA, shared covariance matrix, linear boundaries), quadratic discriminant analysis (QDA, class-specific covariance matrices, quadratic boundaries) and logistic regression, as well as naive Bayes and multi-class problems."
      - url: https://doi.org/10.1145/1102351.1102430
        citation: "Niculescu-Mizil, A. & Caruana, R. (2005). *Predicting good probabilities with supervised learning.* ICML 2005."
        short: Niculescu-Mizil & Caruana (2005)
        link_label: doi:10.1145/1102351.1102430
        summary: "Examines how well predictions of different learning algorithms match true posterior probabilities: boosted trees and stumps push probabilities away from 0 and 1, naive Bayes pushes them toward 0 and 1, while neural nets and bagged trees are well calibrated. Platt scaling and isotonic regression correct the distortions; after calibration boosted trees, random forests and SVMs predict the best probabilities."
  decision-trees:
    sources:
      - url: https://doi.org/10.1007/BF00116251
        citation: "Quinlan, J. R. (1986). *Induction of Decision Trees.* Machine Learning 1(1)."
        short: Quinlan (1986)
        link_label: doi:10.1007/BF00116251
        summary: "Describes ID3, which builds a decision tree top-down by repeatedly choosing the attribute that best splits the training examples according to an information-based (entropy) criterion, and discusses handling noisy data and unknown attribute values."
      - url: https://hastie.su.domains/ElemStatLearn/
        citation: "Hastie, T., Tibshirani, R. & Friedman, J. (2009). *The Elements of Statistical Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer."
        short: Hastie et al. (2009)
        link_label: book website
        summary: "Textbook treatment of tree-based methods (CART): recursive binary splitting of the feature space, node impurity measures such as the Gini index and cross-entropy for classification and squared error for regression, growing a large tree and pruning it back by cost-complexity pruning chosen by cross-validation; trees are interpretable but have high variance."
      - url: https://doi.org/10.1023/A:1010933404324
        citation: "Breiman, L. (2001). *Random Forests.* Machine Learning 45(1)."
        short: Breiman (2001)
        link_label: doi:10.1023/A:1010933404324
        summary: "Random forests combine many decision trees, each grown on a bootstrap sample with a random subset of features considered at each split; predictions are aggregated by voting or averaging. The generalisation error converges as the number of trees grows and depends on the strength of the individual trees and the correlation between them; out-of-bag estimates and variable importance are provided."
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
  ensemble-methods:
    sources:
      - url: https://doi.org/10.1007/BF00058655
        citation: "Breiman, L. (1996). *Bagging Predictors.* Machine Learning 24(2)."
        short: Breiman (1996)
        link_label: doi:10.1007/BF00058655
        summary: "Bagging (bootstrap aggregating) trains multiple versions of a predictor on bootstrap replicates of the training set and aggregates them by averaging (regression) or plurality vote (classification). It improves accuracy most when the base method is unstable, i.e. when small changes in the training data change the predictor substantially, such as decision trees."
      - url: https://doi.org/10.1023/A:1010933404324
        citation: "Breiman, L. (2001). *Random Forests.* Machine Learning 45(1)."
        short: Breiman (2001)
        link_label: doi:10.1023/A:1010933404324
        summary: "Random forests combine many decision trees, each grown on a bootstrap sample with a random subset of features considered at each split; predictions are aggregated by voting or averaging. The generalisation error depends on the strength of the individual trees and the correlation between them."
      - url: https://doi.org/10.1006/jcss.1997.1504
        citation: "Freund, Y. & Schapire, R. E. (1997). *A Decision-Theoretic Generalization of On-Line Learning and an Application to Boosting.* Journal of Computer and System Sciences 55(1)."
        short: Freund & Schapire (1997)
        link_label: doi:10.1006/jcss.1997.1504
        summary: "Introduces AdaBoost: weak learners are trained sequentially, each on a reweighted training set in which examples misclassified by the previous learners receive higher weight, and the final classifier is a weighted vote of the weak learners. Unlike earlier boosting algorithms, it needs no prior knowledge of the weak learners' accuracy."
      - url: https://doi.org/10.1214/aos/1013203451
        citation: "Friedman, J. H. (2001). *Greedy Function Approximation: A Gradient Boosting Machine.* The Annals of Statistics 29(5)."
        short: Friedman (2001)
        link_label: doi:10.1214/aos/1013203451
        summary: "Views boosting as numerical optimisation in function space: stagewise additive expansions are fitted by steepest descent, each new component fitted to the negative gradient of an arbitrary loss (least squares, least absolute deviation, Huber, multiclass logistic). Gradient boosting of regression trees gives competitive, robust procedures for regression and classification."
      - url: https://doi.org/10.1016/S0893-6080(05)80023-1
        citation: "Wolpert, D. H. (1992). *Stacked Generalization.* Neural Networks 5(2)."
        short: Wolpert (1992)
        link_label: doi:10.1016/S0893-6080(05)80023-1
        summary: "Stacked generalisation combines several base learners by training a higher-level learner on their predictions (made on data not used to train them), so that it learns how to correct and combine the base learners' outputs."
      - {arxiv: "1603.02754", expect: "XGBoost", venue: KDD 2016}
  support-vector-machines:
    sources:
      - url: https://doi.org/10.1145/130385.130401
        citation: "Boser, B. E., Guyon, I. M. & Vapnik, V. N. (1992). *A Training Algorithm for Optimal Margin Classifiers.* COLT 1992."
        short: Boser et al. (1992)
        link_label: doi:10.1145/130385.130401
        summary: "Training algorithm that maximises the margin between training patterns and the decision boundary, applicable to perceptrons, polynomials and radial basis functions. The solution is a linear combination of supporting patterns, the training patterns closest to the decision boundary; good generalisation on optical character recognition."
      - url: https://doi.org/10.1007/BF00994018
        citation: "Cortes, C. & Vapnik, V. (1995). *Support-Vector Networks.* Machine Learning 20(3)."
        short: Cortes & Vapnik (1995)
        link_label: doi:10.1007/BF00994018
        summary: "Support-vector networks for two-class classification map inputs non-linearly into a high-dimensional feature space and construct a linear decision surface there with maximal margin. Extends the method to non-separable training data with a soft margin that allows training errors at a cost; evaluated on optical character recognition."
      - url: https://doi.org/10.1023/B:STCO.0000035301.49549.88
        citation: "Smola, A. J. & Schölkopf, B. (2004). *A Tutorial on Support Vector Regression.* Statistics and Computing 14(3)."
        short: Smola & Schölkopf (2004)
        link_label: doi:10.1023/B:STCO.0000035301.49549.88
        summary: "Tutorial on support vector regression: an epsilon-insensitive loss ignores errors smaller than epsilon, the function is kept as flat as possible, the problem is solved as a quadratic programme, and kernels allow non-linear regression."
      - url: https://hastie.su.domains/ElemStatLearn/
        citation: "Hastie, T., Tibshirani, R. & Friedman, J. (2009). *The Elements of Statistical Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer."
        short: Hastie et al. (2009)
        link_label: book website
        summary: "Textbook chapter on support vector machines: maximal-margin hyperplane, soft margin with cost parameter C, kernels (polynomial, radial basis) that compute inner products in an enlarged feature space without constructing it explicitly, and the connection to regularised loss (hinge loss)."
  k-nearest-neighbors:
    sources:
      - url: https://doi.org/10.1109/TIT.1967.1053964
        citation: "Cover, T. & Hart, P. (1967). *Nearest Neighbor Pattern Classification.* IEEE Transactions on Information Theory 13(1)."
        short: Cover & Hart (1967)
        link_label: doi:10.1109/TIT.1967.1053964
        summary: "The nearest neighbour rule assigns an unclassified point the class of the nearest previously classified point. In large samples its error probability is bounded above by twice the Bayes error, for any number of categories."
      - url: https://doi.org/10.1007/3-540-49257-7_15
        citation: "Beyer, K., Goldstein, J., Ramakrishnan, R. & Shaft, U. (1999). *When Is \"Nearest Neighbor\" Meaningful?* ICDT 1999."
        short: Beyer et al. (1999)
        link_label: doi:10.1007/3-540-49257-7_15
        summary: "Shows that under broad conditions, as dimensionality increases, the distance to the nearest data point approaches the distance to the farthest data point, so nearest-neighbour queries can become meaningless in high dimensions."
      - url: https://hastie.su.domains/ElemStatLearn/
        citation: "Hastie, T., Tibshirani, R. & Friedman, J. (2009). *The Elements of Statistical Learning: Data Mining, Inference, and Prediction* (2nd ed.). Springer."
        short: Hastie et al. (2009)
        link_label: book website
        summary: "Textbook treatment of k-nearest-neighbour methods: prediction by majority vote or average over the k closest training points, k controlling the bias-variance trade-off (small k: low bias, high variance), the need to standardise features, and the curse of dimensionality."
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
  clustering:
    sources:
      - url: https://doi.org/10.1109/TIT.1982.1056489
        citation: "Lloyd, S. P. (1982). *Least Squares Quantization in PCM.* IEEE Transactions on Information Theory 28(2)."
        short: Lloyd (1982)
        link_label: doi:10.1109/TIT.1982.1056489
        summary: "Derives conditions for an optimal finite quantisation scheme minimising mean squared quantisation error; the resulting iterative procedure of assigning points to the nearest quantum and moving each quantum to the mean of its points is the standard k-means algorithm (Lloyd's algorithm)."
      - url: https://theory.stanford.edu/~sergei/papers/kMeansPP-soda.pdf
        citation: "Arthur, D. & Vassilvitskii, S. (2007). *k-means++: The Advantages of Careful Seeding.* SODA 2007."
        short: Arthur & Vassilvitskii (2007)
        link_label: PDF
        summary: "k-means seeks to minimise the sum of squared distances between points and their closest centre; Lloyd's algorithm starts from arbitrary centres and offers no accuracy guarantee. k-means++ chooses initial centres with a simple randomised seeding and is Theta(log k)-competitive with the optimal clustering; experiments show improved speed and accuracy."
      - url: https://doi.org/10.1080/01621459.1963.10500845
        citation: "Ward, J. H. (1963). *Hierarchical Grouping to Optimize an Objective Function.* Journal of the American Statistical Association 58(301)."
        short: Ward (1963)
        link_label: doi:10.1080/01621459.1963.10500845
        summary: "Agglomerative hierarchical procedure: starting from n groups, repeatedly merge the pair of groups whose union best preserves an objective function (Ward's criterion: smallest increase in within-group sum of squares) until one group remains, giving the complete hierarchy and the loss at each stage."
      - url: https://cdn.aaai.org/KDD/1996/KDD96-037.pdf
        citation: "Ester, M., Kriegel, H.-P., Sander, J. & Xu, X. (1996). *A Density-Based Algorithm for Discovering Clusters in Large Spatial Databases with Noise.* KDD 1996."
        short: Ester et al. (1996)
        link_label: PDF
        summary: "DBSCAN relies on a density-based notion of clusters to discover clusters of arbitrary shape and to mark points in low-density regions as noise. It needs only one input parameter (and supports the user in choosing it) and was more effective and more than 100 times faster than CLARANS in the experiments."
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
  principal-component-analysis:
    sources:
      - url: https://doi.org/10.1080/14786440109462720
        citation: "Pearson, K. (1901). *On Lines and Planes of Closest Fit to Systems of Points in Space.* Philosophical Magazine 2(11)."
        short: Pearson (1901)
        link_label: doi:10.1080/14786440109462720
        summary: "Finds the lines and planes that best fit a system of points in space in the least-squares sense (minimising perpendicular distances); an origin of principal component analysis."
      - url: https://doi.org/10.1098/rsta.2015.0202
        citation: "Jolliffe, I. T. & Cadima, J. (2016). *Principal component analysis: a review and recent developments.* Philosophical Transactions of the Royal Society A 374(2065)."
        short: Jolliffe & Cadima (2016)
        link_label: doi:10.1098/rsta.2015.0202
        summary: "PCA reduces the dimensionality of large datasets while minimising information loss by creating new uncorrelated variables that successively maximise variance. Finding these principal components reduces to an eigenvalue/eigenvector problem; the review discusses what PCA can and cannot do, including the choice between covariance and correlation matrices (i.e. standardising variables), and variants."
      - {arxiv: "1404.1100", expect: "A Tutorial on Principal Component Analysis"}
      - url: https://doi.org/10.1126/science.1127647
        citation: "Hinton, G. E. & Salakhutdinov, R. R. (2006). *Reducing the Dimensionality of Data with Neural Networks.* Science 313(5786)."
        short: Hinton & Salakhutdinov (2006)
        link_label: doi:10.1126/science.1127647
        summary: "A multilayer neural network with a small central layer (autoencoder) is trained to reconstruct its inputs, converting high-dimensional data to low-dimensional codes. With a suitable weight initialisation, deep autoencoders learn codes that work much better than principal components analysis for dimensionality reduction."
  reinforcement-learning:
    sources:
      - url: http://incompleteideas.net/book/the-book-2nd.html
        citation: "Sutton, R. S. & Barto, A. G. (2018). *Reinforcement Learning: An Introduction* (2nd ed.). MIT Press."
        short: Sutton & Barto (2018)
        link_label: book website
        summary: "Textbook on reinforcement learning: an agent interacts with an environment, observing states, taking actions and receiving rewards, and learns a policy that maximises expected cumulative (discounted) reward; formalised as Markov decision processes with value functions. Covers the exploration-exploitation trade-off (e.g. epsilon-greedy), temporal-difference learning, Q-learning, function approximation and policy-gradient methods."
      - url: https://doi.org/10.1007/BF00992698
        citation: "Watkins, C. J. C. H. & Dayan, P. (1992). *Q-learning.* Machine Learning 8(3-4)."
        short: Watkins & Dayan (1992)
        link_label: doi:10.1007/BF00992698
        summary: "Q-learning is a model-free reinforcement learning method that learns the values of actions in states (Q-values) from experienced transitions and rewards; the paper proves that Q-learning converges to the optimal action-values with probability 1 if all actions are repeatedly sampled in all states and the values are represented discretely."
      - {arxiv: "1312.5602", expect: "Playing Atari with Deep Reinforcement Learning"}
      - {arxiv: "1706.03741", expect: "Deep reinforcement learning from human preferences", venue: NeurIPS 2017}
      - {arxiv: "2203.02155", expect: "Training language models to follow instructions", venue: NeurIPS 2022}
  time-series-analysis:
    sources:
      - url: https://otexts.com/fpp3/
        citation: "Hyndman, R. J. & Athanasopoulos, G. (2021). *Forecasting: Principles and Practice* (3rd ed.). OTexts."
        short: Hyndman & Athanasopoulos (2021)
        link_label: online edition
        summary: "Open textbook on forecasting: time series patterns (trend, seasonality, cycles), decomposition, autocorrelation (ACF) and partial autocorrelation (PACF), stationarity and differencing, exponential smoothing (ETS), ARIMA and seasonal ARIMA models, and forecast evaluation on test data with time series cross-validation and accuracy measures such as MAE, RMSE, MAPE and MASE."
      - url: https://doi.org/10.1080/01621459.1979.10482531
        citation: "Dickey, D. A. & Fuller, W. A. (1979). *Distribution of the Estimators for Autoregressive Time Series with a Unit Root.* Journal of the American Statistical Association 74(366)."
        short: Dickey & Fuller (1979)
        link_label: doi:10.1080/01621459.1979.10482531
        summary: "For the autoregressive model Y_t = rho Y_(t-1) + e_t, derives the limit distributions of the regression estimator of rho and of the regression t test under rho = 1, giving methods to test the hypothesis of a unit root (non-stationarity); the basis of the Dickey-Fuller test."
      - url: https://doi.org/10.1016/j.ijforecast.2006.03.001
        citation: "Hyndman, R. J. & Koehler, A. B. (2006). *Another look at measures of forecast accuracy.* International Journal of Forecasting 22(4)."
        short: Hyndman & Koehler (2006)
        link_label: doi:10.1016/j.ijforecast.2006.03.001
        summary: "Reviews forecast accuracy measures and shows that many can be infinite, undefined or misleading, for example percentage errors when actual values are zero or close to zero. Proposes the mean absolute scaled error (MASE), which scales errors by the in-sample mean absolute error of a naive forecast."
      - url: https://doi.org/10.1016/j.ijforecast.2018.06.001
        citation: "Makridakis, S., Spiliotis, E. & Assimakopoulos, V. (2018). *The M4 Competition: Results, findings, conclusion and way forward.* International Journal of Forecasting 34(4)."
        short: Makridakis et al. (2018)
        link_label: doi:10.1016/j.ijforecast.2018.06.001
        summary: "Results of the M4 forecasting competition on 100,000 time series: combinations of methods performed well, the best method was a hybrid of a statistical model and a neural network, and pure machine learning methods performed poorly compared with statistical benchmarks."
      - url: https://doi.org/10.1162/neco.1997.9.8.1735
        citation: "Hochreiter, S. & Schmidhuber, J. (1997). *Long Short-Term Memory.* Neural Computation 9(8)."
        short: Hochreiter & Schmidhuber (1997)
        link_label: doi:10.1162/neco.1997.9.8.1735
        summary: "Introduces the LSTM recurrent network, whose gated memory cells keep error flow constant over long time lags and so allow learning dependencies over more than 1000 time steps, where earlier recurrent networks failed because of vanishing or exploding gradients."
  ml-preprocessing:
    sources:
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
      - url: https://www.ijcai.org/Proceedings/95-2/Papers/016.pdf
        citation: "Kohavi, R. (1995). *A Study of Cross-Validation and Bootstrap for Accuracy Estimation and Model Selection.* IJCAI 1995."
        short: Kohavi (1995)
        link_label: PDF
        summary: "Compares cross-validation and bootstrap for estimating classifier accuracy in a large-scale experiment (over half a million runs of C4.5 and naive Bayes on real-world datasets), varying the number of folds and stratification. For datasets like these, the recommended method for model selection is ten-fold stratified cross-validation, even when more folds would be computationally possible."
      - url: https://doi.org/10.1109/TKDE.2008.239
        citation: "He, H. & Garcia, E. A. (2009). *Learning from Imbalanced Data.* IEEE Transactions on Knowledge and Data Engineering 21(9)."
        short: He & Garcia (2009)
        link_label: doi:10.1109/TKDE.2008.239
        summary: "Review of learning from imbalanced data, i.e. underrepresented classes and severe class distribution skews: sampling methods, cost-sensitive learning, kernel-based and active learning methods, and assessment metrics suited to imbalanced data instead of plain accuracy."
      - url: https://doi.org/10.1613/jair.953
        citation: "Chawla, N. V., Bowyer, K. W., Hall, L. O. & Kegelmeyer, W. P. (2002). *SMOTE: Synthetic Minority Over-sampling Technique.* Journal of Artificial Intelligence Research 16."
        short: Chawla et al. (2002)
        link_label: doi:10.1613/jair.953
        summary: "A dataset is imbalanced if the classes are not approximately equally represented, and misclassifying the rare class is often costlier. SMOTE over-samples the minority class by creating synthetic examples (interpolated between minority examples and their nearest minority neighbours); combined with under-sampling the majority class it achieved better classifier performance in ROC space than under-sampling alone."
      - url: https://doi.org/10.1145/1102351.1102430
        citation: "Niculescu-Mizil, A. & Caruana, R. (2005). *Predicting good probabilities with supervised learning.* ICML 2005."
        short: Niculescu-Mizil & Caruana (2005)
        link_label: doi:10.1145/1102351.1102430
        summary: "Boosted trees and stumps push predicted probabilities away from 0 and 1, naive Bayes pushes them toward 0 and 1, neural nets and bagged trees are well calibrated. Platt scaling and isotonic regression correct the distortions; the paper examines how much data these calibration methods need."
      - {arxiv: "1706.04599", expect: "On Calibration of Modern Neural Networks", venue: ICML 2017}
  regularization-and-hyperparameters:
    sources:
      - url: https://doi.org/10.1080/00401706.1970.10488634
        citation: "Hoerl, A. E. & Kennard, R. W. (1970). *Ridge Regression: Biased Estimation for Nonorthogonal Problems.* Technometrics 12(1)."
        short: Hoerl & Kennard (1970)
        link_label: doi:10.1080/00401706.1970.10488634
        summary: "Least-squares estimates are often unsatisfactory when predictors are not orthogonal. Ridge regression adds small positive quantities to the diagonal of X'X, giving biased estimates with smaller mean squared error; the ridge trace shows the effect of the penalty."
      - url: https://doi.org/10.1111/j.2517-6161.1996.tb02080.x
        citation: "Tibshirani, R. (1996). *Regression Shrinkage and Selection via the Lasso.* Journal of the Royal Statistical Society, Series B 58(1)."
        short: Tibshirani (1996)
        link_label: doi:10.1111/j.2517-6161.1996.tb02080.x
        summary: "The lasso minimises the residual sum of squares subject to the sum of the absolute values of the coefficients being below a constant. Because of this constraint some coefficients become exactly zero, giving interpretable models like subset selection with the stability of ridge regression."
      - url: https://jmlr.org/papers/v15/srivastava14a.html
        citation: "Srivastava, N., Hinton, G., Krizhevsky, A., Sutskever, I. & Salakhutdinov, R. (2014). *Dropout: A Simple Way to Prevent Neural Networks from Overfitting.* JMLR 15."
        short: Srivastava et al. (2014)
        link_label: JMLR
        summary: "Dropout randomly drops units (with their connections) from a neural network during training, preventing units from co-adapting too much; at test time a single network with scaled-down weights approximates averaging the many thinned networks. Dropout reduces overfitting and improved results on vision, speech recognition, document classification and computational biology benchmarks."
      - url: https://doi.org/10.1007/3-540-49430-8_3
        citation: "Prechelt, L. (1998). *Early Stopping - But When?* In Neural Networks: Tricks of the Trade, LNCS 1524."
        short: Prechelt (1998)
        link_label: doi:10.1007/3-540-49430-8_3
        summary: "Early stopping ends training when the error on a validation set starts to increase, to avoid overfitting. The paper compares stopping criteria empirically and finds that slower criteria, which stop later, yield slightly better generalisation at the cost of considerably longer training."
      - url: https://jmlr.org/papers/v13/bergstra12a.html
        citation: "Bergstra, J. & Bengio, Y. (2012). *Random Search for Hyper-Parameter Optimization.* JMLR 13."
        short: Bergstra & Bengio (2012)
        link_label: JMLR
        summary: "Shows empirically and theoretically that randomly chosen trials are more efficient for hyper-parameter optimisation than trials on a grid, because for most datasets only a few hyper-parameters really matter, and random search explores more distinct values of these important ones."
      - {arxiv: "1206.2944", expect: "Practical Bayesian Optimization of Machine Learning Algorithms", venue: NeurIPS 2012}
  feature-engineering:
    sources:
      - url: https://jmlr.org/papers/v3/guyon03a.html
        citation: "Guyon, I. & Elisseeff, A. (2003). *An Introduction to Variable and Feature Selection.* JMLR 3."
        short: Guyon & Elisseeff (2003)
        link_label: JMLR
        summary: "Introduction to variable and feature selection, whose aims are better predictor performance, faster and more cost-effective predictors and better understanding of the data. Covers variable ranking, filter, wrapper and embedded methods, feature construction, and validation of selection methods."
      - url: https://doi.org/10.1145/507533.507538
        citation: "Micci-Barreca, D. (2001). *A preprocessing scheme for high-cardinality categorical attributes in classification and prediction problems.* ACM SIGKDD Explorations 3(1)."
        short: Micci-Barreca (2001)
        link_label: doi:10.1145/507533.507538
        summary: "Categorical fields with very many distinct values are hard for algorithms that need numeric inputs. The paper replaces each category with an estimate of the target statistic for that category, blended with the overall prior using empirical Bayes (target encoding), and can use hierarchies such as ZIP codes."
      - url: https://doi.org/10.1145/2382577.2382579
        citation: "Kaufman, S., Rosset, S., Perlich, C. & Stitelman, O. (2012). *Leakage in Data Mining: Formulation, Detection, and Avoidance.* ACM Transactions on Knowledge Discovery from Data 6(4)."
        short: Kaufman et al. (2012)
        link_label: doi:10.1145/2382577.2382579
        summary: "Defines leakage as the introduction of information about the target that should not legitimately be available to the model; it is one of the top data mining mistakes and appeared in major competitions. The paper formulates leakage via modelling goals and derives methodology to detect and avoid it."
      - url: https://jmlr.org/papers/v12/pedregosa11a.html
        citation: "Pedregosa, F. et al. (2011). *Scikit-learn: Machine Learning in Python.* JMLR 12."
        short: Pedregosa et al. (2011)
        link_label: JMLR
        summary: "Scikit-learn is a Python module integrating a wide range of machine learning algorithms for medium-scale supervised and unsupervised problems, with emphasis on ease of use, performance, documentation and API consistency.."
      - url: https://otexts.com/fpp3/
        citation: "Hyndman, R. J. & Athanasopoulos, G. (2021). *Forecasting: Principles and Practice* (3rd ed.). OTexts."
        short: Hyndman & Athanasopoulos (2021)
        link_label: online edition
        summary: "Includes predictors for regression models of time series: trend, seasonal dummy variables, and Fourier terms (pairs of sine and cosine terms) to model seasonality, as well as mathematical transformations such as logarithms and Box-Cox transformations."
  statistics-fundamentals:
    sources:
      - url: https://doi.org/10.1007/s10654-016-0149-3
        citation: "Greenland, S., Senn, S. J., Rothman, K. J., Carlin, J. B., Poole, C., Goodman, S. N. & Altman, D. G. (2016). *Statistical tests, P values, confidence intervals, and power: a guide to misinterpretations.* European Journal of Epidemiology 31(4)."
        short: Greenland et al. (2016)
        link_label: doi:10.1007/s10654-016-0149-3
        summary: "Misinterpretations of statistical tests, P values, confidence intervals and power remain widespread. The paper gives correct definitions and lists common misinterpretations, for example that a P value is the probability that the null hypothesis is true, or that a 95% confidence interval has a 95% chance of containing the true value; it stresses that selecting analyses by their P values distorts them."
      - url: https://doi.org/10.1080/00031305.2016.1154108
        citation: "Wasserstein, R. L. & Lazar, N. A. (2016). *The ASA Statement on p-Values: Context, Process, and Purpose.* The American Statistician 70(2)."
        short: Wasserstein & Lazar (2016)
        link_label: doi:10.1080/00031305.2016.1154108
        summary: "Statement of the American Statistical Association with six principles: p-values can indicate how incompatible data are with a model; they do not measure the probability that the hypothesis is true; decisions should not rest only on whether a p-value passes a threshold; proper inference requires full reporting and transparency; a p-value does not measure effect size or importance; by itself it is not a good measure of evidence."
      - url: https://doi.org/10.1214/aos/1176344552
        citation: "Efron, B. (1979). *Bootstrap Methods: Another Look at the Jackknife.* The Annals of Statistics 7(1)."
        short: Efron (1979)
        link_label: doi:10.1214/aos/1176344552
        summary: "Introduces the bootstrap: the sampling distribution of a statistic is estimated from the observed data by resampling; shown to work on examples such as the variance of the sample median and error rates in linear discriminant analysis."
      - url: https://doi.org/10.1007/s10618-008-0114-1
        citation: "Kohavi, R., Longbotham, R., Sommerfield, D. & Henne, R. M. (2009). *Controlled experiments on the web: survey and practical guide.* Data Mining and Knowledge Discovery 18(1)."
        short: Kohavi et al. (2009)
        link_label: doi:10.1007/s10618-008-0114-1
        summary: "Practical guide to online controlled experiments (A/B tests): randomised experiments are the best design for establishing a causal effect of a change on user behaviour. Covers statistical power, sample size, variance reduction, experimentation architectures and limitations."
      - url: https://doi.org/10.1162/089976698300017197
        citation: "Dietterich, T. G. (1998). *Approximate Statistical Tests for Comparing Supervised Classification Learning Algorithms.* Neural Computation 10(7)."
        short: Dietterich (1998)
        link_label: doi:10.1162/089976698300017197
        summary: "Compares five tests for whether one learning algorithm outperforms another. A difference-of-proportions test and a paired t test over random train-test splits have high type I error and should not be used; the 10-fold cross-validated t test has somewhat elevated type I error; McNemar's test and the new 5x2 cv test have acceptable type I error."
      - url: https://sites.stat.columbia.edu/gelman/book/
        citation: "Gelman, A., Carlin, J. B., Stern, H. S., Dunson, D. B., Vehtari, A. & Rubin, D. B. (2013). *Bayesian Data Analysis* (3rd ed.). CRC Press."
        short: Gelman et al. (2013)
        link_label: book website
        summary: "Textbook on Bayesian inference: unknown quantities are treated as random, prior distributions are combined with the likelihood of the data via Bayes' rule into a posterior distribution, and uncertainty is summarised with posterior intervals; covers hierarchical models, model checking and computation."
  differential-privacy-and-federated-learning:
    sources:
      - url: https://doi.org/10.1007/11681878_14
        citation: "Dwork, C., McSherry, F., Nissim, K. & Smith, A. (2006). *Calibrating Noise to Sensitivity in Private Data Analysis.* TCC 2006."
        short: Dwork et al. (2006)
        link_label: doi:10.1007/11681878_14
        summary: "Introduces the definition now known as epsilon-differential privacy: the output distribution of a mechanism changes only slightly when one individual's record is added or removed. Privacy is achieved by adding noise (e.g. Laplace noise) calibrated to the sensitivity of the function, i.e. how much one record can change its value."
      - url: https://doi.org/10.1561/0400000042
        citation: "Dwork, C. & Roth, A. (2014). *The Algorithmic Foundations of Differential Privacy.* Foundations and Trends in Theoretical Computer Science 9(3-4)."
        short: Dwork & Roth (2014)
        link_label: doi:10.1561/0400000042
        summary: "Monograph on differential privacy as a robust, mathematically rigorous definition of privacy: its meaning, fundamental techniques for achieving it and their combination, using query release as running example, and fundamental limits on what can be achieved."
      - {arxiv: "1607.00133", expect: "Deep Learning with Differential Privacy", venue: CCS 2016}
      - {arxiv: "1602.05629", expect: "Communication-Efficient Learning of Deep Networks from Decentralized Data", venue: AISTATS 2017}
      - {arxiv: "1912.04977", expect: "Advances and Open Problems in Federated Learning"}
      - {arxiv: "1906.08935", expect: "Deep Leakage from Gradients", venue: NeurIPS 2019}

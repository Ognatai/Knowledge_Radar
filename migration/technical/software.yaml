# Input for `python -m app.agents.technical_notes <command> software`.
# Web pages and specifications were read in full; DOIs checked against Crossref and OpenAlex.
notes:
  clean-code:
    new: {title_en: Clean Code, title_de: Clean Code, entity_type: Concept}
    extra_links: [python, git, regression-testing, quality-control, vibe-coding, engineering-methods-for-ai-systems, harness-engineering, apis, mlops-and-deployment]
    sources:
      - url: https://peps.python.org/pep-0008/
        citation: "van Rossum, G., Warsaw, B. & Coghlan, A. (2001). *PEP 8 – Style Guide for Python Code.* Python Enhancement Proposals."
        short: PEP 8
        link_label: peps.python.org
        summary: "One of Guido van Rossum's key insights is that code is read much more often than it is written; the guidelines aim to improve readability and consistency. A style guide is about consistency: consistency with the guide is important, consistency within a project more important, and consistency within one module or function most important; know when to be inconsistent and do not break backwards compatibility just to comply. Recommends, among other things, limiting lines to 79 characters (72 for docstrings and comments) and naming public API elements after their usage rather than their implementation."
      - url: https://martinfowler.com/bliki/CodeSmell.html
        citation: "Fowler, M. *CodeSmell.* martinfowler.com (bliki)."
        short: Fowler, CodeSmell
        link_label: martinfowler.com
        summary: "A code smell is a surface indication that usually corresponds to a deeper problem in the system; the term was coined by Kent Beck while helping with the Refactoring book. A smell is quick to spot, such as a long method, but smells do not always indicate a problem: some long methods are fine, and smells are indicators rather than problems themselves. Data classes with all data and no behaviour are a good example that leads to moving behaviour into the class."
      - url: https://martinfowler.com/bliki/TechnicalDebt.html
        citation: "Fowler, M. *TechnicalDebt.* martinfowler.com (bliki)."
        short: Fowler, TechnicalDebt
        link_label: martinfowler.com
        summary: "Software systems are prone to cruft, deficiencies in internal quality that make it harder to modify and extend them. Technical debt, a metaphor coined by Ward Cunningham, frames the extra effort for new features as interest on the debt and removing the cruft as paying off the principal. Because productivity cannot be measured objectively, the costs are only estimates; usually the best route is to pay the principal off gradually, which naturally concentrates clean-up on the areas that are modified most frequently. A terrible area that never needs to be changed is not a problem."
      - url: https://refactoring.com/
        citation: "Fowler, M. *Refactoring.* refactoring.com."
        short: Fowler, Refactoring
        link_label: refactoring.com
        summary: "Refactoring is a disciplined technique for restructuring existing code, altering its internal structure without changing its external behaviour. Its heart is a series of small behaviour-preserving transformations; each does little, but a sequence produces significant restructuring, and the system is kept fully working after each step. Refactoring lowers the cost of enhancements, because enhancements piled on top of each other otherwise make changes increasingly hard until new work slows to a crawl; it is part of day-to-day programming."
      - url: https://google.github.io/eng-practices/review/reviewer/looking-for.html
        citation: "Google. *What to look for in a code review.* Google Engineering Practices Documentation."
        short: Google code review guide
        link_label: google.github.io
        summary: "The most important thing in a review is the overall design of the change. Reviewers check functionality, including edge cases and concurrency; complexity, where too complex usually means the code cannot be understood quickly by readers or invites bugs, with special vigilance against over-engineering: solve the problem that needs to be solved now, not a speculative future one. Tests belong in the same change, must actually fail when the code is broken and are themselves code that must be maintained. Good names are long enough to communicate what an item is or does without becoming hard to read. Comments should usually explain why code exists, not what it does; if the code is not clear enough to explain itself, it should be made simpler."
      - url: https://qntm.org/clean
        citation: "qntm (2020). *It's probably time to stop recommending Clean Code.* Things Of Interest, 28 June 2020."
        short: qntm (2020)
        link_label: qntm.org
        summary: "Critical review of Robert C. Martin's 2008 book Clean Code. Notes that empirical definitions of good or clean code may not be possible, so judgements are subjective. Agrees with parts of the advice on functions: do not mix levels of abstraction, use descriptive and consistent names, do one thing, avoid side effects and output arguments, separate commands from queries. Criticises other advice as dogmatic: the book asserts that an ideal function is two to four lines long, that functions should not be indented more than two levels, that the ideal number of arguments is zero, and that duplication may be the root of all evil, whereas a little duplication can be clearer and cheaper than the wrong abstraction. Criticises much of the book's example code as poor and recommends John Ousterhout's A Philosophy of Software Design (2018) instead."
      - url: https://doi.org/10.1145/361598.361623
        citation: "Parnas, D. L. (1972). *On the criteria to be used in decomposing systems into modules.* Communications of the ACM 15(12)."
        short: Parnas (1972)
        link_label: doi:10.1145/361598.361623
        summary: "Discusses modularisation as a mechanism for improving the flexibility and comprehensibility of a system while shortening its development time. The effectiveness of a modularisation depends on the criteria used to divide the system into modules. For a sample design problem, a conventional and an unconventional decomposition are compared, and the unconventional decomposition has distinct advantages for these goals; the criteria used are discussed."
      - url: https://doi.org/10.1109/TSE.2009.70
        citation: "Buse, R. P. L. & Weimer, W. R. (2010). *Learning a Metric for Code Readability.* IEEE Transactions on Software Engineering 36(4)."
        short: Buse & Weimer (2010)
        link_label: doi:10.1109/TSE.2009.70
        summary: "Explores code readability and its relation to software quality. From judgements of 120 human annotators, derives associations between simple local code features and readability, builds an automated readability measure that is 80 percent effective at predicting readability judgements, and shows that it correlates strongly with three measures of software quality: code changes, automated defect reports and defect log messages, measured on over 2.2 million lines of code. Finds, for example, that comments in themselves are less important than simple blank lines for local readability judgements."
  apis:
    new: {title_en: APIs, title_de: APIs (Programmierschnittstellen), entity_type: Concept}
    extra_links: [clean-code, mcp-and-related-protocols, agentic-ai, python, docker, kubernetes, sparql, llm-cost-optimization, harness-engineering]
    sources:
      - url: https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
        citation: "Fielding, R. T. (2000). *Architectural Styles and the Design of Network-based Software Architectures*, chapter 5: Representational State Transfer (REST). Dissertation, University of California, Irvine."
        short: Fielding (2000)
        link_label: ics.uci.edu
        summary: "Introduces REST as an architectural style for distributed hypermedia systems, defined by constraints: client-server (separation of concerns between user interface and data storage), stateless communication (each request contains all information needed to understand it, session state is kept on the client), cache (responses are labelled as cacheable or not), a uniform interface (identification of resources, manipulation of resources through representations, self-descriptive messages and hypermedia as the engine of application state), a layered system, and optional code-on-demand. The uniform interface simplifies the architecture and decouples implementations from the services they provide, but degrades efficiency because information is transferred in a standardised rather than application-specific form; the REST interface is designed for large-grain hypermedia data transfer, optimising for the common case of the web."
      - url: https://www.rfc-editor.org/rfc/rfc9110.html
        citation: "Fielding, R., Nottingham, M. & Reschke, J. (2022). *HTTP Semantics.* RFC 9110, IETF."
        short: RFC 9110
        link_label: rfc-editor.org
        summary: "Defines HTTP semantics. Request methods are safe if their semantics are essentially read-only; GET, HEAD, OPTIONS and TRACE are safe. A method is idempotent if multiple identical requests have the same intended effect as a single one; PUT, DELETE and the safe methods are idempotent, so such requests can be repeated automatically after a communication failure. The first digit of a status code defines its class: 1xx informational, 2xx successful, 3xx redirection, 4xx client error, 5xx server error."
      - url: https://spec.openapis.org/oas/latest.html
        citation: "OpenAPI Initiative. *OpenAPI Specification.* spec.openapis.org."
        short: OpenAPI Specification
        link_label: spec.openapis.org
        summary: "The OpenAPI Specification defines a standard, programming language-agnostic interface description for HTTP APIs, which allows both humans and computers to discover and understand the capabilities of a service without access to source code, additional documentation or inspection of network traffic; a consumer can then interact with the service with minimal implementation logic. An OpenAPI description can be used by documentation generation tools, by code generation tools to generate servers and clients in various programming languages, and by testing tools."
      - url: https://www.jsonrpc.org/specification
        citation: "JSON-RPC Working Group (2010). *JSON-RPC 2.0 Specification.* jsonrpc.org."
        short: JSON-RPC 2.0 specification
        link_label: jsonrpc.org
        summary: "Version 2.0, origin date 26 March 2010. JSON-RPC is a stateless, light-weight remote procedure call protocol that uses JSON as data format. It is transport agnostic: the concepts can be used within the same process, over sockets, over HTTP or in other message-passing environments. A request object has a method, optional parameters and an id that the server returns in the response to correlate the two; a request without an id is a notification."
      - url: https://spec.graphql.org/October2021/
        citation: "GraphQL Foundation (2021). *GraphQL Specification, October 2021 Edition.* spec.graphql.org."
        short: GraphQL specification
        link_label: spec.graphql.org
        summary: "GraphQL is a query language for describing the data requirements of client applications. Design principles include strong typing (every service defines an application-specific type system, and requests are validated against it), client-specified responses (the service publishes its capabilities through the type system, and the client specifies at field level exactly what it consumes, instead of the service determining the shape of the data per endpoint) and introspection (the type system can be queried with GraphQL itself)."
      - url: https://grpc.io/docs/what-is-grpc/introduction/
        citation: "gRPC Authors. *Introduction to gRPC.* grpc.io."
        short: gRPC docs
        link_label: grpc.io
        summary: "In gRPC, a client application can call a method on a server on a different machine as if it were a local object. A service is defined with the methods that can be called remotely, their parameters and return types; the server implements this interface, and the client has a stub with the same methods. By default, gRPC uses Protocol Buffers as interface definition language and message interchange format, defined in .proto files."
      - url: https://cloud.google.com/apis/design
        citation: "Google. *API design guide.* Google Cloud documentation."
        short: Google API design guide
        link_label: cloud.google.com
        summary: "A general design guide for networked APIs, used inside Google since 2014 for Cloud APIs and other Google APIs and shared to inform outside developers. It covers resource-oriented design for RPC and REST APIs, resource names, standard methods (Get, List, Create, Update, Delete) and custom methods, with details in the API Improvement Proposals (AIPs)."
      - url: https://www.rfc-editor.org/rfc/rfc9457.html
        citation: "Nottingham, M., Wilde, E. & Dalal, S. (2023). *Problem Details for HTTP APIs.* RFC 9457, IETF."
        short: RFC 9457
        link_label: rfc-editor.org
        summary: "Defines a problem detail to carry machine-readable details of errors in HTTP response content, avoiding the need to define new error response formats for each HTTP API; obsoletes RFC 7807. The status code informs generic HTTP software about the general semantics, for example 403 Forbidden, while API-specific details, such as why the request was refused and the applicable account balance, are carried in the response content so that the client can act on them."
      - url: https://owasp.org/API-Security/editions/2023/en/0x11-t10/
        citation: "OWASP (2023). *OWASP Top 10 API Security Risks – 2023.* OWASP API Security Project."
        short: OWASP API Top 10 (2023)
        link_label: owasp.org
        summary: "Lists the ten most critical API security risks of 2023, starting with broken object level authorization (APIs expose endpoints that handle object identifiers, so authorisation checks are needed in every function that accesses a data source using an ID from the user), broken authentication (incorrectly implemented authentication lets attackers compromise tokens or assume other users' identities) and broken object property level authorization (excessive data exposure and mass assignment)."
      - url: https://github.com/microsoft/api-guidelines/blob/vNext/azure/Guidelines.md
        citation: "Microsoft. *Microsoft Azure REST API Guidelines.* GitHub repository microsoft/api-guidelines."
        short: Azure REST API guidelines
        link_label: github.com
        summary: "Guidelines for Azure HTTP/REST APIs. On versioning: when a service changes, already-running customer workloads must not break, and customers must be able to adopt a new service version without code changes; breaking changes are only allowed with approval and a defined process. Introducing required fields in a later version, removing a required field or making an optional field required or vice versa are breaking changes. Further guidance: use GET for retrieval returning JSON, PATCH with JSON Merge Patch for create and update, PUT for wholesale create or replace, and keep fields simple with a shallow hierarchy."

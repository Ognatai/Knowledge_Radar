      - {arxiv: "2210.07316", expect: "MTEB"}
      - {arxiv: "2205.13147", expect: "Matryoshka Representation Learning"}
      - url: https://aclanthology.org/D14-1162/
        citation: "Pennington, J., Socher, R. & Manning, C. D. (2014). *GloVe: Global Vectors for Word Representation.* EMNLP 2014."
        short: Pennington et al. (2014)
        link_label: ACL Anthology
        summary: "GloVe learns word vectors from global word-word co-occurrence statistics with a weighted least-squares objective, combining global matrix factorisation and local context window methods."
  vector-databases:
    sources:
      - {arxiv: "1603.09320", expect: "Hierarchical Navigable Small World"}
      - {arxiv: "1702.08734", expect: "Billion-scale similarity search with GPUs"}
      - {arxiv: "2310.14021", expect: "Vector Database Management Systems"}
      - {arxiv: "1908.10396", expect: "Anisotropic Vector Quantization"}
      - url: https://doi.org/10.1109/TPAMI.2010.57
        citation: "Jégou, H., Douze, M. & Schmid, C. (2011). *Product Quantization for Nearest Neighbor Search.* IEEE Transactions on Pattern Analysis and Machine Intelligence 33(1)."
        short: Jégou et al. (2011)
        link_label: doi:10.1109/TPAMI.2010.57
        summary: "Product quantization splits a vector into sub-vectors and quantizes each with its own small codebook; distances are estimated from the compact codes, enabling approximate nearest neighbor search over large collections with little memory."

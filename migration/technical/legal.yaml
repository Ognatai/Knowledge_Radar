# Migration package "Legal concepts": input for `python -m app.agents.technical_notes <command> legal`.
# Concept notes on legal topics (technical template). The source summaries are the model's only
# evidence; each was checked on 2026-10-06 against the official text or, for court decisions,
# against the published judgment summary.
notes:
  ai-liability-law:
    extra_links: [geschgehg]
    sources:
      - url: https://eur-lex.europa.eu/eli/dir/2024/2853/oj
        citation: "Directive (EU) 2024/2853 of the European Parliament and of the Council of 23 October 2024 on liability for defective products and repealing Council Directive 85/374/EEC."
        short: Product Liability Directive (2024)
        link_label: EUR-Lex
        summary: "No-fault liability for defective products. Applies to products placed on the market or put into service after 9 December 2026 (Art. 2(1)); transposition deadline 9 December 2026 (Art. 22); repeals Directive 85/374/EEC. 'Product' includes software (Art. 4(1)); free and open-source software developed or supplied outside a commercial activity is excluded (Art. 2(2)). Compensable damage: death or personal injury including medically recognised psychological harm, damage to property not used exclusively for professional purposes, and destruction or corruption of data not used for professional purposes (Art. 6). A product is defective if it does not provide the safety a person is entitled to expect or that Union or national law requires; the assessment considers, among other things, the effect of any ability to continue to learn or acquire new features after it is placed on the market (Art. 7(2)(c)). Liable are the manufacturer, the manufacturer of a defective component and, for non-EU manufacturers, the importer, authorised representative or fulfilment service provider; whoever substantially modifies a product outside the manufacturer's control is treated as manufacturer (Art. 8). Courts can order the defendant to disclose relevant evidence if the claimant has shown the plausibility of the claim (Art. 9). The claimant must prove defectiveness, damage and causation (Art. 10(1)), but defectiveness is presumed if the defendant fails to disclose evidence, the product breaches mandatory safety requirements or there is an obvious malfunction (Art. 10(2)); causation is presumed if the damage is typically consistent with the defect (Art. 10(3)); and courts presume defectiveness or causation where the claimant faces excessive difficulties, in particular due to technical or scientific complexity, and shows that they are likely (Art. 10(4)). All presumptions are rebuttable (Art. 10(5)). The defence that a defect arose later does not apply where it is due to software, including updates or upgrades, a lack of updates necessary to maintain safety, a related service or a substantial modification within the manufacturer's control (Art. 11(2)). Limitation period three years; expiry ten years after placing on the market (Art. 16, 17)."
      - url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52022PC0496
        citation: "European Commission (2022). *Proposal for a Directive on adapting non-contractual civil liability rules to artificial intelligence (AI Liability Directive)*, COM(2022) 496 final."
        short: AI Liability Directive proposal (2022)
        link_label: EUR-Lex
        summary: "Proposal of September 2022 to harmonise aspects of fault-based, non-contractual liability for damage caused by AI systems: national courts could order the disclosure of evidence about high-risk AI systems, and a rebuttable presumption of causation would link a defendant's fault, such as non-compliance with AI Act obligations, to the output of the AI system. The Commission withdrew the proposal; the withdrawal notice was published in the Official Journal on 6 October 2025, citing no foreseeable agreement, and the Commission said it would assess whether to table a new proposal or choose another approach. Fault-based liability for AI therefore remains governed by national tort law."
      - url: https://www.gesetze-im-internet.de/bgb/__823.html
        citation: "Bürgerliches Gesetzbuch (BGB), § 823 Schadensersatzpflicht."
        short: § 823 BGB
        link_label: gesetze-im-internet.de
        summary: "German fault-based tort liability: whoever intentionally or negligently and unlawfully injures the life, body, health, freedom, property or another right of another person is liable for the resulting damage (§ 823(1)); the same applies to a culpable breach of a statute intended to protect another person (§ 823(2)). The injured party generally has to prove fault, damage and causation."
      - url: https://dserver.bundestag.de/btd/21/042/2104297.pdf
        citation: "Deutscher Bundestag (2026). *Gesetzentwurf der Bundesregierung zur Modernisierung des Produkthaftungsrechts*, Drucksache 21/4297."
        short: German government bill on product liability (2026)
        link_label: Bundestag PDF
        summary: "Government bill of 25 February 2026 to transpose Directive (EU) 2024/2853 by replacing the German Product Liability Act (Produkthaftungsgesetz) of 1989, which transposed Directive 85/374/EEC. It brings software, including AI systems, within product liability and adapts the burden of proof; the new rules are to apply to products placed on the market from 9 December 2026, while older products remain under the existing Act."
      - url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
        citation: "Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act)."
        short: AI Act (2024)
        link_label: EUR-Lex
        summary: "Sets product-safety-style obligations for AI systems rather than liability rules. High-risk AI systems must allow the automatic recording of events (logs) over their lifetime (Art. 12) and be designed so that natural persons can oversee them effectively (Art. 14); deployers must use them in accordance with the instructions and assign human oversight to competent persons (Art. 26). Most provisions apply from 2 August 2026 (Art. 113). Breaches of these obligations can be relevant evidence in liability disputes, for instance as non-compliance with mandatory safety requirements under the Product Liability Directive."
  copyright-and-ai-training-data:
    extra_links: [ai-liability-law]
    sources:
      - url: https://eur-lex.europa.eu/eli/dir/2019/790/oj
        citation: "Directive (EU) 2019/790 of the European Parliament and of the Council of 17 April 2019 on copyright and related rights in the Digital Single Market (DSM Directive)."
        short: DSM Directive (2019)
        link_label: EUR-Lex
        summary: "Defines text and data mining (TDM) as any automated analytical technique aimed at analysing text and data in digital form to generate information such as patterns, trends and correlations (Art. 2(2)). Art. 3: mandatory exception for reproductions and extractions by research organisations and cultural heritage institutions for TDM for scientific research of works to which they have lawful access; copies may be retained for research purposes; contractual provisions to the contrary are unenforceable (Art. 7(1)). Art. 4: exception for reproductions and extractions of lawfully accessible works for TDM for any purpose, including commercial; copies may be retained as long as necessary for TDM; it applies only if rightholders have not expressly reserved their rights in an appropriate manner, such as machine-readable means for content made publicly available online (Art. 4(3)). Art. 4(1) also covers computer programs (Directive 2009/24/EC). Art. 17 makes online content-sharing service providers responsible for communicating user-uploaded works to the public and requires them to seek authorisation, for instance through licences."
      - url: https://www.gesetze-im-internet.de/urhg/__44b.html
        citation: "Urheberrechtsgesetz (UrhG), § 44b Text und Data Mining and § 60d Text und Data Mining für Zwecke der wissenschaftlichen Forschung."
        short: §§ 44b, 60d UrhG
        link_label: gesetze-im-internet.de
        summary: "German transposition of Art. 3 and 4 DSM Directive. § 44b UrhG permits reproductions of lawfully accessible works for TDM; they must be deleted when no longer required; uses are permitted only if the rightholder has not reserved them, and for works accessible online a reservation is effective only if it is made in machine-readable form (§ 44b(3)). § 60d UrhG permits reproductions for TDM for scientific research by research organisations that pursue non-commercial purposes, reinvest all profits in research or act under a state-recognised public-interest mission, excluding organisations under decisive influence of a private company with preferential access to results, as well as by publicly accessible libraries, museums and archives."
      - url: https://eur-lex.europa.eu/eli/reg/2024/1689/oj
        citation: "Regulation (EU) 2024/1689 laying down harmonised rules on artificial intelligence (Artificial Intelligence Act)."
        short: AI Act (2024)
        link_label: EUR-Lex
        summary: "Providers of general-purpose AI models must put in place a policy to comply with Union copyright law, in particular to identify and comply with, including through state-of-the-art technologies, a reservation of rights under Art. 4(3) DSM Directive (Art. 53(1)(c)), and must publish a sufficiently detailed summary of the content used for training according to a template of the AI Office (Art. 53(1)(d)). These obligations apply from 2 August 2025 (Art. 113). Providers of open-source models are exempt from some documentation duties but not from points (c) and (d) (Art. 53(2))."
      - url: https://medien-internet-und-recht.de/volltext.php?mir_dok_id=3526
        citation: "Hanseatisches Oberlandesgericht Hamburg, judgment of 10 December 2025, 5 U 104/24 (Kneschke v. LAION), upholding Landgericht Hamburg, judgment of 27 September 2024, 310 O 227/23."
        short: OLG Hamburg (2025)
        link_label: MIR full text
        summary: "A photographer sued LAION e.V., a non-profit association, for downloading his photograph from a stock photo website to check whether it matched its text description when building an image-text dataset for AI training. The Regional Court dismissed the claim, relying mainly on the research exception (§ 60d UrhG). The Higher Regional Court dismissed the appeal and held that both § 44b and § 60d UrhG applied: the reservation in the stock photo agency's terms, formulated in natural language, was not machine-readable as required by § 44b(3) UrhG at the time of download, and building the dataset was a methodical, verifiable activity of applied research. The court allowed an appeal on points of law to the Federal Court of Justice (BGH); the judgment is not final."
      - url: https://www.lto.de/recht/nachrichten/n/42o1413924-lg-muenchen-i-gema-openai-chatgpt-songtexte-ki
        citation: "Landgericht München I, judgment of 11 November 2025, 42 O 14139/24 (GEMA v. OpenAI)."
        short: LG München I (2025)
        link_label: LTO report
        summary: "The collecting society GEMA sued two OpenAI companies over nine German song lyrics that ChatGPT could reproduce exactly or almost exactly. The court found that the lyrics were memorised in the model parameters, which it treated as a reproduction (§ 16 UrhG), and that outputting them was a making available to the public (§ 19a UrhG); the TDM exception of § 44b UrhG did not cover the memorisation. It granted claims for an injunction, information and damages. The judgment is not final."
      - url: https://www.law.cornell.edu/uscode/text/17/107
        citation: "17 U.S.C. § 107, Limitations on exclusive rights: Fair use."
        short: 17 U.S.C. § 107
        link_label: Cornell LII
        summary: "US copyright law has no specific TDM exception; unlicensed uses are assessed under the fair use doctrine using four factors: the purpose and character of the use, including whether it is commercial; the nature of the copyrighted work; the amount and substantiality of the portion used in relation to the work as a whole; and the effect of the use on the potential market for or value of the work. The outcome depends on the individual case and court decisions."
  information-security-in-banking:
    sources:
      - url: https://www.bundesbank.de/de/aufgaben/bankenaufsicht/einzelaspekte/risikomanagement/bait-dora-598580
        citation: "Deutsche Bundesbank. *BAIT / DORA – Aufsichtliche Anforderungen an die IT und die digitale operationale Resilienz.*"
        short: Bundesbank, BAIT / DORA
        link_label: bundesbank.de
        summary: "The BAIT (Bankaufsichtliche Anforderungen an die IT, BaFin circular 10/2017 (BA), current version of January 2025) specify IT requirements for banks based on § 25a KWG. Since DORA applies (17 January 2025), all institutions that must carry out ICT risk management under Articles 5 to 15 or Article 16 DORA are excluded from the scope of the BAIT, and the BAIT will be repealed completely with effect from the end of 31 December 2026. BaFin withdrew the corresponding circulars for payment institutions, insurers and investment management companies (ZAIT, VAIT, KAIT) on 17 January 2025 to avoid duplicate rules."
      - url: https://eur-lex.europa.eu/eli/reg/2022/2554/oj
        citation: "Regulation (EU) 2022/2554 on digital operational resilience for the financial sector (DORA)."
        short: DORA (2022)
        link_label: EUR-Lex
        summary: "The management body defines, approves, oversees and is responsible for the ICT risk management framework and bears ultimate responsibility for ICT risk (Art. 5(2)). Financial entities other than microenterprises assign the management and oversight of ICT risk to an independent control function and ensure appropriate segregation and independence of ICT risk management, control and internal audit functions according to the three lines of defence model or an internal risk management and control model; the framework is documented and reviewed at least annually (Art. 6(4), 6(5)). As part of ICT security, financial entities develop an information security policy protecting the availability, authenticity, integrity and confidentiality of data, and implement policies that limit physical or logical access to information assets to what is required for legitimate and approved functions and activities (Art. 9(4)). Applies from 17 January 2025."
      - url: https://www.bafin.de/SharedDocs/Downloads/DE/Rundschreiben/dl_rs_0626_9_marisk.html
        citation: "BaFin, Rundschreiben 06/2026 (BA) – Mindestanforderungen an das Risikomanagement (MaRisk), 30 June 2026."
        short: MaRisk (2026)
        link_label: bafin.de
        summary: "Specifies § 25a KWG for institutions not directly supervised by the ECB. The internal control system comprises rules on organisational structure and processes, risk management and risk control processes, a risk control function and a compliance function (AT 4.3); the risk control function is separated up to management level from units that initiate or conclude business (AT 4.4.1); every institution has an internal audit function with full rights to information (AT 4.4.3). Incompatible activities must be carried out by different staff (AT 4.3.1). Technical and organisational resources must match business activities and risk situation, with effective data quality processes (AT 7.2); critical or important functions need a contingency plan (AT 7.3). Models, expressly including artificial intelligence, must be validated and sufficiently explainable (AT 4.3.4). ICT services subject to ICT third-party risk management under DORA are outside the outsourcing rules of AT 9."
      - url: https://www.gesetze-im-internet.de/kredwg/__25a.html
        citation: "Kreditwesengesetz (KWG), § 25a Besondere organisatorische Pflichten."
        short: § 25a KWG
        link_label: gesetze-im-internet.de
        summary: "Requires institutions to have a proper business organisation that ensures compliance with legal requirements, including appropriate and effective risk management with strategies, procedures to determine and ensure risk-bearing capacity, internal control procedures with an internal control system and an internal audit function, and contingency management, in particular for IT systems. It is the common legal basis of MaRisk and BAIT."
      - url: https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/internal-governance/guidelines-internal-governance-under-crd
        citation: "European Banking Authority (2021). *Guidelines on internal governance under Directive 2013/36/EU* (EBA/GL/2021/05)."
        short: EBA internal governance guidelines (2021)
        link_label: eba.europa.eu
        summary: "The guidelines are consistent with the three lines of defence model: business lines take and manage risks (first line), the risk management and compliance functions form the second line, and the independent internal audit function is the third line. Internal control functions must be independent of the business they control, adequately resourced and led by heads with access to the management body in its supervisory function; internal audit must not be combined with another control function. A new product approval policy covers new products and significant changes, including IT changes."

  quality-control:
    sources:
      - url: https://doi.org/10.1109/BigData.2017.8258038
        citation: "Breck, E., Cai, S., Nielsen, E., Salib, M. & Sculley, D. (2017). *The ML Test Score: A Rubric for ML Production Readiness and Technical Debt Reduction.* IEEE BigData 2017."
        short: Breck et al. (2017)
        link_label: doi:10.1109/BigData.2017.8258038
        summary: "Testing and monitoring are key to the production readiness of ML systems and to reducing their technical debt, but specific tests are hard to formulate because a model's prediction behaviour is difficult to specify in advance. The paper presents 28 specific tests and monitoring needs, drawn from experience with a wide range of production ML systems, organised into tests for features and data, model development, ML infrastructure and monitoring, with a score that measures production readiness."
      - url: https://papers.nips.cc/paper/5656-hidden-technical-debt-in-machine-learning-systems
        citation: "Sculley, D., Holt, G., Golovin, D., Davydov, E., Phillips, T., Ebner, D., Chaudhary, V., Young, M., Crespo, J.-F. & Dennison, D. (2015). *Hidden Technical Debt in Machine Learning Systems.* NeurIPS 2015."
        short: Sculley et al. (2015)
        link_label: NeurIPS proceedings
        summary: "Machine learning offers a powerful toolkit for building complex prediction systems quickly, but it is dangerous to think of these quick wins as free: real-world ML systems commonly incur massive ongoing maintenance costs. ML-specific risk factors include boundary erosion, entanglement, hidden feedback loops, undeclared consumers, data dependencies, configuration issues, changes in the external world and a variety of system-level anti-patterns."
      - url: https://doi.org/10.1109/ICSE-SEIP.2019.00042
        citation: "Amershi, S., Begel, A., Bird, C., DeLine, R., Gall, H., Kamar, E., Nagappan, N., Nushi, B. & Zimmermann, T. (2019). *Software Engineering for Machine Learning: A Case Study.* ICSE-SEIP 2019."
        short: Amershi et al. (2019)
        link_label: doi:10.1109/ICSE-SEIP.2019.00042
        summary: "Study of Microsoft software teams developing AI-based applications. Describes a nine-stage ML workflow (model requirements, data collection, data cleaning, data labelling, feature engineering, model training, model evaluation, model deployment and model monitoring) that teams integrated into existing agile software engineering processes, identifies essential engineering challenges, such as data management and model evolution, and collects best practices."
      - {arxiv: "1810.03993", expect: "Model Cards for Model Reporting", venue: FAT* 2019}
      - {arxiv: "1803.09010", expect: "Datasheets for Datasets", venue: Communications of the ACM 2021}
      - {arxiv: "2005.04118", expect: "Beyond Accuracy: Behavioral Testing of NLP models with CheckList", venue: ACL 2020}
  regression-testing:
    sources:
      - {arxiv: "2005.04118", expect: "Beyond Accuracy: Behavioral Testing of NLP models with CheckList", venue: ACL 2020}
      - {arxiv: "2307.09009", expect: "How is ChatGPT's behavior changing over time"}

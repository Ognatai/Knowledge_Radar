        short: Sculley et al. (2015)
        link_label: NeurIPS proceedings
        summary: "Real-world ML systems commonly incur massive ongoing maintenance costs; ML-specific risk factors include entanglement, hidden feedback loops, undeclared consumers, data dependencies, configuration issues and changes in the external world."
      - {arxiv: "2011.09926", expect: "Challenges in Deploying Machine Learning", venue: ACM Computing Surveys 2022}
      - {arxiv: "1810.11953", expect: "Failing Loudly", venue: NeurIPS 2019}
      - url: https://doi.org/10.1109/BigData.2017.8258038
        citation: "Breck, E., Cai, S., Nielsen, E., Salib, M. & Sculley, D. (2017). *The ML Test Score: A Rubric for ML Production Readiness and Technical Debt Reduction.* IEEE BigData 2017."
        short: Breck et al. (2017)
        link_label: doi:10.1109/BigData.2017.8258038
        summary: "Presents 28 tests and monitoring needs for production ML systems, including reproducible training, canary tests of models before they enter production serving, the ability to roll back serving models, and monitoring of input data and prediction quality in production; it is based on production ML systems at Google."
      - url: https://doi.org/10.1109/ICSE-SEIP.2019.00042
        citation: "Amershi, S., Begel, A., Bird, C., DeLine, R., Gall, H., Kamar, E., Nagappan, N., Nushi, B. & Zimmermann, T. (2019). *Software Engineering for Machine Learning: A Case Study.* ICSE-SEIP 2019."

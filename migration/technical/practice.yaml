      - url: https://doi.org/10.1109/BigData.2017.8258038
        citation: "Breck, E., Cai, S., Nielsen, E., Salib, M. & Sculley, D. (2017). *The ML Test Score: A Rubric for ML Production Readiness and Technical Debt Reduction.* IEEE BigData 2017."
        short: Breck et al. (2017)
        link_label: doi:10.1109/BigData.2017.8258038
        summary: "Presents 28 specific tests and monitoring needs for production ML systems, drawn from experience at Google, covering features and data, model development (e.g. testing against a simpler baseline and checking model quality on important data slices), ML infrastructure (e.g. reproducible training, canary tests before serving and rollback of serving models) and monitoring (e.g. detecting changes in input data and prediction quality)."
      - {arxiv: "2211.09110", expect: "Holistic Evaluation of Language Models", venue: TMLR}

        summary: "Study of Microsoft teams developing AI applications: a nine-stage ML workflow from model requirements, data collection, cleaning and labelling, feature engineering, training and evaluation to deployment and monitoring, integrated into agile software engineering processes, with engineering challenges and best practices."
  experiment-tracking:
    sources:
      - url: https://people.eecs.berkeley.edu/~matei/papers/2018/ieee_mlflow.pdf
        citation: "Zaharia, M., Chen, A., Davidson, A., Ghodsi, A., Hong, S. A., Konwinski, A., Murching, S., Nykodym, T., Ogilvie, P., Parkhe, M., Xie, F. & Zumar, C. (2018). *Accelerating the Machine Learning Lifecycle with MLflow.* IEEE Data Engineering Bulletin 41(4)."
        short: Zaharia et al. (2018)
        link_label: PDF
        summary: "ML development brings challenges not present in traditional software development: keeping track of the many inputs to an ML application (data versions, code and tuning parameters), reproducing results and deploying to production; ML development revolves around constant experimentation with datasets, models, libraries and parameters. MLflow is an open-source platform that addresses experimentation, reproducibility and model deployment with generic APIs that work with any ML library, algorithm and language."
      - url: https://mlflow.org/docs/latest/ml/tracking/
        citation: "MLflow. *MLflow Tracking.* MLflow documentation."
        short: MLflow Tracking docs
        link_label: mlflow.org
        summary: "MLflow Tracking is an API and UI for logging parameters, code versions, metrics and output files when running ML code and for visualising the results later. It is organised around runs, executions of data science code such as one python train.py execution; each run records metadata (metrics, parameters, start and end times) and artifacts (output files such as model weights or images). Runs are grouped into experiments, trained models can be logged and registered, and APIs exist for Python, REST, R and Java."
      - {arxiv: "2003.12206", expect: "Improving Reproducibility in Machine Learning Research", venue: JMLR 2021}
      - {arxiv: "1909.03004", expect: "Show Your Work", venue: EMNLP 2019}
      - {arxiv: "2103.03098", expect: "Accounting for Variance in Machine Learning Benchmarks", venue: MLSys 2021}

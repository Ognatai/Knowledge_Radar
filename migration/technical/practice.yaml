notes:
  legal-ai:
    sources:
      - {arxiv: "2401.01301", expect: "Large Legal Fictions", venue: Journal of Legal Analysis 2024}
      - {arxiv: "2405.20362", expect: "Hallucination-Free", venue: Journal of Empirical Legal Studies 2025}
      - {arxiv: "2308.11462", expect: "LegalBench", venue: NeurIPS 2023 Datasets and Benchmarks}
      - {arxiv: "2110.00976", expect: "LexGLUE", venue: ACL 2022}
      - url: https://doi.org/10.1098/rsta.2023.0254
        citation: "Katz, D. M., Bommarito, M. J., Gao, S. & Arredondo, P. (2024). *GPT-4 passes the bar exam.* Philosophical Transactions of the Royal Society A 382(2270)."
        short: Katz et al. (2024)
        link_label: doi:10.1098/rsta.2023.0254
        summary: "Evaluates the zero-shot performance of GPT-4 on the entire US Uniform Bar Examination. On the multiple-choice part (MBE), GPT-4 significantly outperformed both human test-takers and prior models, with a 26% increase over ChatGPT and beating humans in five of seven subject areas; on the essay (MEE) and performance test (MPT) parts it averaged 4.2 out of 6.0. Graded like a human test-taker, it scored approximately 297 points, above the passing threshold in all UBE jurisdictions."
      - {arxiv: "2404.16130", expect: "From Local to Global"}
      - url: https://edoc.ub.uni-muenchen.de/36297/
        citation: "Urchs, S. (2025). *Detecting Gender Discrimination in Natural Language Processing.* Dissertation, Ludwig-Maximilians-Universität München."
        short: Urchs (2025)
        link_label: LMU edoc
        summary: "Dissertation on gender discrimination in NLP. Argues that the text corpora on which LLMs are trained are not neutral but encode historical and structural inequalities, for example in relation to gender, so that models can amplify stereotypes even when they appear neutral on the surface, and that addressing discrimination requires more than post-hoc adjustments to model outputs. Notes that ethical recommendations and emerging legislation such as the EU AI Act require AI systems, including systems based on LLMs, not to reproduce, reinforce or disseminate existing biases, stereotypes or discriminatory patterns. Also notes that parsers trained on general corpora often underperform on specialised texts such as biomedical or legal texts."

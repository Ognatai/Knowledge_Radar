- id: zephyr
  type: Method
  name_en: Zephyr
  name_de: Zephyr
  summary_en: Zephyr-7B is a small chat model aligned to user intent through distilled supervised fine-tuning and distilled direct preference optimisation on preference data ranked by a teacher model, without human annotation (Tunstall et al., 2023). Training takes only a few hours, and on MT-Bench Zephyr-7B surpassed Llama2-Chat-70B.
  summary_de: Zephyr-7B ist ein kleines Chat-Modell, das über destilliertes Supervised Fine-Tuning und destillierte Direct Preference Optimization auf von einem Lehrermodell gerankten Präferenzdaten an Nutzerabsichten angepasst wurde, ohne menschliche Annotation (Tunstall et al., 2023). Das Training dauert nur wenige Stunden, und auf MT-Bench übertraf Zephyr-7B Llama2-Chat-70B.
  sources:
  - https://arxiv.org/abs/2310.16944
- id: deepseek-llm
  type: Method
  name_en: DeepSeek LLM
  name_de: DeepSeek LLM
  summary_en: DeepSeek LLM is an open-source family of large language models in 7B and 67B configurations, guided by its developers' own study of scaling laws and pre-trained on a dataset of 2 trillion tokens (DeepSeek-AI, 2024). Supervised fine-tuning and Direct Preference Optimization produced DeepSeek Chat models; the 67B model surpassed LLaMA-2 70B on several benchmarks, particularly code, mathematics and reasoning.
  summary_de: DeepSeek LLM ist eine offene Familie großer Sprachmodelle in den Größen 7B und 67B, entwickelt auf Grundlage einer eigenen Untersuchung von Skalierungsgesetzen und vortrainiert auf einem Datensatz von 2 Billionen Tokens (DeepSeek-AI, 2024). Supervised Fine-Tuning und Direct Preference Optimization ergaben die DeepSeek-Chat-Modelle; das 67B-Modell übertraf LLaMA-2 70B auf mehreren Benchmarks, besonders bei Code, Mathematik und Schlussfolgern.
  sources:
  - https://arxiv.org/abs/2401.02954

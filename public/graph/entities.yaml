  name_de: Loss Scaling
- id: eight-bit-optimisers
  type: Method
  name_en: 8-bit optimisers
  name_de: 8-Bit-Optimierer
  aliases:
  - 8-bit optimizers
  summary_en: 8-bit optimisers store the state of stateful optimisers such as Adam in 8 bits using block-wise dynamic quantisation, which keeps the performance of 32-bit optimiser states with a fraction of the memory (Dettmers et al., 2021). A stable embedding layer reduces gradient variance, and the optimisers serve as a drop-in replacement needing a two-line code change.
  summary_de: 8-Bit-Optimierer speichern den Zustand zustandsbehafteter Optimierer wie Adam mit blockweiser dynamischer Quantisierung in 8 Bit und erreichen so die Leistung von 32-Bit-Zuständen bei einem Bruchteil des Speichers (Dettmers et al., 2021). Eine stabile Embedding-Schicht verringert die Varianz der Gradienten, und die Optimierer lassen sich mit einer Änderung von zwei Codezeilen einsetzen.
  sources:
  - https://arxiv.org/abs/2110.02861
- id: adam-optimiser
  type: Method
  name_en: Adam
  name_de: Adam
  summary_en: Adam is an algorithm for first-order gradient-based optimisation of stochastic objectives based on adaptive estimates of lower-order moments of the gradients (Kingma & Ba, 2014). It is simple to implement, computationally efficient, needs little memory, suits large and noisy or sparse problems, and its hyperparameters typically need little tuning.
  summary_de: Adam ist ein Verfahren zur gradientenbasierten Optimierung stochastischer Zielfunktionen erster Ordnung, das auf adaptiven Schätzungen der niedrigen Momente der Gradienten beruht (Kingma & Ba, 2014). Es ist einfach umzusetzen, recheneffizient, braucht wenig Speicher, eignet sich für große sowie verrauschte oder dünn besetzte Probleme, und seine Hyperparameter müssen meist kaum abgestimmt werden.
  sources:
  - https://arxiv.org/abs/1412.6980

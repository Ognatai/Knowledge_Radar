- id: jeffrey-dean
  type: Person
  name_en: Jeffrey Dean
  name_de: Jeffrey Dean
  aliases:
  - Jeff Dean
  summary_en: Jeffrey Dean, then at Google, introduced MapReduce with Sanjay Ghemawat at OSDI 2004. MapReduce is a programming model in which users write a map and a reduce function and the run-time system parallelises the program across a large cluster of commodity machines, handling partitioning, scheduling, machine failures and communication.
  summary_de: Jeffrey Dean stellte, damals bei Google, gemeinsam mit Sanjay Ghemawat auf der OSDI 2004 MapReduce vor. MapReduce ist ein Programmiermodell, bei dem eine Map- und eine Reduce-Funktion geschrieben werden und die Laufzeitumgebung das Programm auf einem großen Cluster gewöhnlicher Rechner parallelisiert und dabei Partitionierung, Ablaufplanung, Rechnerausfälle und Kommunikation übernimmt.
  sources:
  - https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
- id: sanjay-ghemawat
  type: Person
  name_en: Sanjay Ghemawat
  name_de: Sanjay Ghemawat
  summary_en: Sanjay Ghemawat, then at Google, is co-author, with Jeffrey Dean, of the MapReduce paper presented at OSDI 2004. The paper describes a programming model and implementation that let programmers without experience in parallel and distributed systems process large data sets on clusters of commodity machines.
  summary_de: Sanjay Ghemawat, damals bei Google, ist gemeinsam mit Jeffrey Dean Autor des MapReduce-Papers, das auf der OSDI 2004 vorgestellt wurde. Es beschreibt ein Programmiermodell mit Implementierung, mit dem auch Programmierende ohne Erfahrung mit parallelen und verteilten Systemen große Datenmengen auf Clustern gewöhnlicher Rechner verarbeiten können.
  sources:
  - https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
- id: tesseract
  type: Technology
  name_en: Tesseract
  name_de: Tesseract
  aliases:
  - Tesseract OCR
- id: layoutlm
  type: Method
  name_en: LayoutLM
  name_de: LayoutLM
  summary_en: LayoutLM pre-trains a model jointly on text and layout information from scanned document images, and also uses image features of words (Xu et al., 2019). It set new results on form understanding (from 70.72 to 79.27), receipt understanding and document image classification, useful for information extraction from scanned documents.
  summary_de: LayoutLM trainiert ein Modell gemeinsam auf Text und Layout gescannter Dokumentbilder vor und nutzt zusätzlich Bildmerkmale der Wörter (Xu et al., 2019). Es erzielte neue Bestwerte beim Verständnis von Formularen (von 70,72 auf 79,27), Belegen und bei der Klassifikation von Dokumentbildern, nützlich für die Informationsextraktion aus gescannten Dokumenten.
  sources:
  - https://arxiv.org/abs/1912.13318
- id: donut
  type: Method
  name_en: Donut
  name_de: Donut
  aliases:
  - Document understanding transformer
  summary_en: 'Donut (Document understanding transformer) is an OCR-free model for visual document understanding: a Transformer reads document images such as invoices directly, avoiding the cost, inflexibility and error propagation of separate OCR engines (Kim et al., 2021). It reached state-of-the-art speed and accuracy on several document understanding tasks and comes with a synthetic data generator for other languages and domains.'
  summary_de: 'Donut (Document understanding transformer) ist ein Modell für visuelles Dokumentverständnis ohne OCR: Ein Transformer liest Dokumentbilder wie Rechnungen direkt und vermeidet Kosten, Unflexibilität und Fehlerfortpflanzung separater OCR-Engines (Kim et al., 2021). Es erreichte Bestwerte bei Geschwindigkeit und Genauigkeit in mehreren Aufgaben des Dokumentverständnisses und bringt einen Generator synthetischer Daten für weitere Sprachen und Domänen mit.'
  sources:
  - https://arxiv.org/abs/2111.15664
- id: docling
  type: Technology
  name_en: Docling
  name_de: Docling
- id: doclaynet
  type: Dataset
  name_en: DocLayNet
  name_de: DocLayNet
  summary_en: DocLayNet is a publicly available document-layout annotation dataset in COCO format with 80,863 manually annotated pages from diverse sources, each with bounding boxes in 11 classes (Pfitzmann et al., 2022). Models trained on it predicted layouts more robustly than those trained on PubLayNet or DocBank, which come only from scientific articles.
  summary_de: DocLayNet ist ein öffentlich verfügbarer Datensatz zur Annotation von Dokumentlayouts im COCO-Format mit 80 863 von Hand annotierten Seiten aus vielfältigen Quellen, jeweils mit Begrenzungsrahmen in 11 Klassen (Pfitzmann et al., 2022). Darauf trainierte Modelle sagten Layouts robuster vorher als solche, die auf PubLayNet oder DocBank trainiert wurden, die nur aus wissenschaftlichen Artikeln stammen.
  sources:
  - https://arxiv.org/abs/2206.01062
- id: yolo
  type: Method
  name_en: YOLO
  name_de: YOLO
  aliases:
  - You Only Look Once
  summary_en: YOLO (You Only Look Once) frames object detection as a single regression from full images to spatially separated bounding boxes and class probabilities, so one network can be optimised end to end (Redmon et al., 2015). The base model ran in real time at 45 frames per second; it made more localisation errors than other detectors but fewer false detections on background and generalised well from natural images to artwork.
  summary_de: YOLO (You Only Look Once) fasst Objekterkennung als eine einzige Regression vom ganzen Bild auf räumlich getrennte Begrenzungsrahmen und Klassenwahrscheinlichkeiten auf, sodass ein einziges Netz durchgängig optimiert werden kann (Redmon et al., 2015). Das Basismodell lief in Echtzeit mit 45 Bildern pro Sekunde; es machte mehr Lokalisierungsfehler als andere Detektoren, aber weniger Fehlerkennungen im Hintergrund und generalisierte gut von Fotos auf Kunstwerke.
  sources:
  - https://arxiv.org/abs/1506.02640
- id: mask-r-cnn
  type: Method
  name_en: Mask R-CNN
  name_de: Mask R-CNN
  summary_en: Mask R-CNN is a framework for object instance segmentation that extends Faster R-CNN with a branch predicting a segmentation mask for each detected object in parallel with bounding-box recognition (He et al., 2017). It adds little overhead, generalises to tasks such as human pose estimation and outperformed all single-model entries in the COCO instance segmentation, detection and keypoint tracks.
  summary_de: Mask R-CNN ist ein Framework für Instanzsegmentierung, das Faster R-CNN um einen Zweig ergänzt, der parallel zur Erkennung der Begrenzungsrahmen für jedes erkannte Objekt eine Segmentierungsmaske vorhersagt (He et al., 2017). Es verursacht wenig Mehraufwand, lässt sich auf Aufgaben wie Posenschätzung übertragen und übertraf alle Einzelmodelle in den COCO-Disziplinen Instanzsegmentierung, Detektion und Keypoints.
  sources:
  - https://arxiv.org/abs/1703.06870
- id: u-net
  type: Method
  name_en: U-Net
  name_de: U-Net
  summary_en: U-Net is a convolutional network for image segmentation with a contracting path that captures context and a symmetric expanding path that enables precise localisation, trained end to end with heavy data augmentation from very few images (Ronneberger et al., 2015). It won segmentation and cell tracking challenges in biomedical microscopy and segments a 512×512 image in under a second on a GPU.
  summary_de: U-Net ist ein Convolutional Network für Bildsegmentierung mit einem verdichtenden Pfad, der Kontext erfasst, und einem symmetrischen erweiternden Pfad für genaue Lokalisierung, das mit starker Datenaugmentierung aus sehr wenigen Bildern durchgängig trainiert wird (Ronneberger et al., 2015). Es gewann Wettbewerbe zur Segmentierung und Zellverfolgung in der biomedizinischen Mikroskopie und segmentiert ein Bild mit 512×512 Pixeln auf einer GPU in unter einer Sekunde.
  sources:
  - https://arxiv.org/abs/1505.04597

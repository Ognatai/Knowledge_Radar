- id: weight-decomposed-low-rank-adaptation
  type: Method
  name_en: DoRA (Weight-Decomposed Low-Rank Adaptation)
  name_de: DoRA (Weight-Decomposed Low-Rank Adaptation)
  aliases:
  - DoRA
  summary_en: Weight-Decomposed Low-Rank Adaptation (DoRA) splits each pre-trained weight into a magnitude and a direction and fine-tunes the direction with LoRA, which brings learning capacity and stability closer to full fine-tuning without extra inference cost (Liu et al., 2024). It consistently outperformed LoRA when fine-tuning LLaMA, LLaVA and VL-BART on tasks such as commonsense reasoning and visual instruction tuning.
  summary_de: Weight-Decomposed Low-Rank Adaptation (DoRA) zerlegt jedes vortrainierte Gewicht in Betrag und Richtung und passt die Richtung mit LoRA an; das bringt Lernfähigkeit und Stabilität näher an vollständiges Fine-Tuning, ohne zusätzliche Inferenzkosten (Liu et al., 2024). Beim Fine-Tuning von LLaMA, LLaVA und VL-BART, etwa für Common-Sense-Schlussfolgern und visuelles Instruction Tuning, übertraf es LoRA durchgängig.
  sources:
  - https://arxiv.org/abs/2402.09353
- id: adapter-layers
  type: Method
  name_en: Adapter layers
  name_de: Adapter-Layer
  summary_en: Adapter layers are small trainable modules inserted into a pre-trained network while the original parameters stay fixed, so each new task adds only a few parameters and tasks can be added without revisiting earlier ones (Houlsby et al., 2019). Transferring BERT to 26 text classification tasks, adapters came within 0.4% of full fine-tuning on GLUE while adding only 3.6% parameters per task.
  summary_de: Adapter-Schichten sind kleine trainierbare Module, die in ein vortrainiertes Netz eingefügt werden, während dessen Parameter fest bleiben; jede neue Aufgabe fügt so nur wenige Parameter hinzu, und Aufgaben lassen sich ergänzen, ohne frühere erneut anzufassen (Houlsby et al., 2019). Beim Transfer von BERT auf 26 Textklassifikationsaufgaben lagen Adapter auf GLUE nur 0,4 % hinter vollständigem Fine-Tuning, bei nur 3,6 % zusätzlichen Parametern je Aufgabe.
  sources:
  - https://arxiv.org/abs/1902.00751
- id: t5
  type: Method
  name_en: T5
  name_de: T5
  summary_en: T5 (Text-to-Text Transfer Transformer) treats every text-based language problem in a unified text-to-text format and was used for a systematic comparison of pre-training objectives, architectures, unlabelled datasets and transfer approaches (Raffel et al., 2019). Combined with scale and the new Colossal Clean Crawled Corpus (C4), it reached state-of-the-art results on benchmarks for summarisation, question answering and text classification.
  summary_de: T5 (Text-to-Text Transfer Transformer) behandelt jede textbasierte Sprachaufgabe in einem einheitlichen Text-zu-Text-Format und diente einem systematischen Vergleich von Vortrainingszielen, Architekturen, nicht annotierten Datensätzen und Transferverfahren (Raffel et al., 2019). Zusammen mit Skalierung und dem neuen Colossal Clean Crawled Corpus (C4) erreichte es Bestwerte auf Benchmarks für Zusammenfassung, Fragebeantwortung und Textklassifikation.
  sources:
  - https://arxiv.org/abs/1910.10683
- id: masked-language-modelling
  type: Method
  name_en: Masked language modelling
  name_de: Masked Language Modelling
- id: flashattention
  type: Method
  name_en: FlashAttention
  name_de: FlashAttention
  summary_en: FlashAttention is an IO-aware exact attention algorithm that uses tiling to reduce reads and writes between GPU high-bandwidth memory and on-chip SRAM (Dao et al., 2022). It sped up training, for example threefold for GPT-2 with sequence length 1K, and enabled longer contexts, including the first Transformers to beat chance on the Path-X challenge with 16K tokens.
  summary_de: FlashAttention ist ein exakter Attention-Algorithmus, der Speicherzugriffe berücksichtigt und mit Kachelung die Lese- und Schreibvorgänge zwischen dem Hauptspeicher der GPU (HBM) und dem SRAM auf dem Chip verringert (Dao et al., 2022). Es beschleunigte das Training, etwa um das Dreifache für GPT-2 mit Sequenzlänge 1K, und ermöglichte längere Kontexte, darunter die ersten Transformer, die bei der Path-X-Aufgabe mit 16K Tokens über dem Zufall lagen.
  sources:
  - https://arxiv.org/abs/2205.14135
- id: id3
  type: Method
  name_en: ID3
  name_de: ID3
  summary_en: ID3 (Iterative Dichotomiser 3), developed by Ross Quinlan in 1986, builds a multiway decision tree by greedily choosing, at each node, the categorical feature with the largest information gain (scikit-learn developers, n.d.-a). Trees are grown to maximum size and then usually pruned; its successor C4.5 also handles numerical features by discretising them.
  summary_de: ID3 (Iterative Dichotomiser 3), 1986 von Ross Quinlan entwickelt, baut einen Entscheidungsbaum mit Mehrfachverzweigungen, indem es an jedem Knoten gierig das kategoriale Merkmal mit dem größten Informationsgewinn wählt (scikit-learn developers, n.d.-a). Bäume wachsen bis zur maximalen Größe und werden meist anschließend beschnitten; der Nachfolger C4.5 verarbeitet durch Diskretisierung auch numerische Merkmale.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: cart
  type: Method
  name_en: CART
  name_de: CART
  summary_en: CART (Classification and Regression Trees) builds binary decision trees by choosing at each node the feature and threshold with the largest information gain; unlike C4.5 it supports numerical targets for regression and does not compute rule sets (scikit-learn developers, n.d.-a). scikit-learn implements an optimised version of CART.
  summary_de: CART (Classification and Regression Trees) baut binäre Entscheidungsbäume, indem an jedem Knoten das Merkmal und der Schwellenwert mit dem größten Informationsgewinn gewählt werden; anders als C4.5 unterstützt es numerische Zielgrößen für Regression und erzeugt keine Regelmengen (scikit-learn developers, n.d.-a). scikit-learn setzt eine optimierte Fassung von CART um.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: cost-complexity-pruning
  type: Method
  name_en: Cost-complexity pruning
  name_de: Cost-Complexity Pruning
  summary_en: Minimal cost-complexity pruning prunes a decision tree to avoid overfitting by finding the subtree that minimises R(T) + α·|leaves|, the tree's error or impurity plus a penalty per terminal node controlled by the complexity parameter α ≥ 0 (scikit-learn developers, n.d.-a). Larger α removes more branches; in scikit-learn it is set with ccp_alpha.
  summary_de: Minimal Cost-Complexity Pruning beschneidet einen Entscheidungsbaum gegen Overfitting, indem es den Teilbaum sucht, der R(T) + α·|Blätter| minimiert, also Fehler oder Unreinheit des Baums plus eine Strafe je Endknoten, gesteuert durch den Komplexitätsparameter α ≥ 0 (scikit-learn developers, n.d.-a). Ein größeres α entfernt mehr Äste; in scikit-learn wird es über ccp_alpha gesetzt.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: fitnets
  type: Method
  name_en: FitNets
  name_de: FitNets
  summary_en: FitNets extend knowledge distillation so that a student network deeper and thinner than its teacher learns not only from the teacher's outputs but also from its intermediate representations, used as "hints" (Romero et al., 2014). On CIFAR-10, a deep student with about 10.4 times fewer parameters outperformed a larger state-of-the-art teacher.
  summary_de: FitNets erweitern Knowledge Distillation, sodass ein Schülernetz, das tiefer und schmaler ist als sein Lehrer, nicht nur von dessen Ausgaben, sondern auch von seinen Zwischenrepräsentationen als „Hinweisen“ lernt (Romero et al., 2014). Auf CIFAR-10 übertraf ein tiefer Schüler mit rund 10,4-mal weniger Parametern einen größeren Lehrer auf dem damaligen Stand der Technik.
  sources:
  - https://arxiv.org/abs/1412.6550
- id: tinybert
  type: Method
  name_en: TinyBERT
  name_de: TinyBERT
  summary_en: TinyBERT uses a Transformer distillation method applied in both pre-training and task-specific learning to transfer knowledge from a large BERT teacher to a small student (Jiao et al., 2019). With 4 layers it reached more than 96.8% of BERT-base's performance on GLUE while being 7.5 times smaller and 9.4 times faster at inference.
  summary_de: TinyBERT nutzt ein Destillationsverfahren für Transformer, das sowohl im Vortraining als auch beim aufgabenspezifischen Lernen angewendet wird, um Wissen von einem großen BERT-Lehrer auf einen kleinen Schüler zu übertragen (Jiao et al., 2019). Mit 4 Schichten erreichte es über 96,8 % der Leistung von BERT-base auf GLUE, bei 7,5-mal kleinerer Größe und 9,4-mal schnellerer Inferenz.
  sources:
  - https://arxiv.org/abs/1909.10351
- id: g-eval
  type: Method
  name_en: G-Eval
  name_de: G-Eval
  summary_en: G-Eval evaluates generated text with an LLM using chain-of-thought and a form-filling paradigm (Liu et al., 2023). With GPT-4 as backbone it reached a Spearman correlation of 0.514 with human judgements on summarisation, well above earlier metrics, and its authors noted a possible bias of LLM evaluators towards LLM-generated text.
  summary_de: G-Eval bewertet erzeugte Texte mit einem LLM, das Chain-of-Thought und ein Formular-Ausfüll-Schema nutzt (Liu et al., 2023). Mit GPT-4 als Grundlage erreichte es bei Zusammenfassungen eine Spearman-Korrelation von 0,514 mit menschlichen Urteilen, deutlich über früheren Metriken, und die Autoren wiesen auf eine mögliche Bevorzugung LLM-erzeugter Texte durch LLM-Bewerter hin.
  sources:
  - https://arxiv.org/abs/2303.16634
- id: prometheus
  type: Method
  name_en: Prometheus (evaluator model)
  name_de: Prometheus (Evaluator-Modell)
  aliases:
  - Prometheus
  summary_en: Prometheus is an open-source 13B evaluator LLM trained on the Feedback Collection of 1,000 score rubrics, 20,000 instructions and 100,000 GPT-4 responses with feedback; it grades long-form text against a user-provided rubric (Kim et al., 2023). With reference answers and rubrics it reached a Pearson correlation of 0.897 with human evaluators, on par with GPT-4 (0.882).
  summary_de: Prometheus ist ein offenes Bewertungs-LLM mit 13 Milliarden Parametern, trainiert auf der Feedback Collection aus 1 000 Bewertungsrastern, 20 000 Anweisungen und 100 000 Antworten mit Feedback von GPT-4; es bewertet lange Texte anhand eines vorgegebenen Rasters (Kim et al., 2023). Mit Referenzantworten und Rastern erreichte es eine Pearson-Korrelation von 0,897 mit menschlichen Bewertungen, gleichauf mit GPT-4 (0,882).
  sources:
  - https://arxiv.org/abs/2310.08491
- id: ontology
  type: Concept
  name_en: Ontology
  name_de: Ontologie
- id: toolformer
  type: Method
  name_en: Toolformer
  name_de: Toolformer
  summary_en: Toolformer is a language model that teaches itself in a self-supervised way which APIs to call, when, with which arguments and how to use the results, from only a handful of demonstrations per API (Schick et al., 2023). Its tools include a calculator, a question-answering system, two search engines, a translation system and a calendar, and it improved zero-shot performance on many tasks.
  summary_de: Toolformer ist ein Sprachmodell, das sich selbstüberwacht beibringt, welche APIs es wann mit welchen Argumenten aufruft und wie es die Ergebnisse nutzt, mit nur wenigen Beispielen je API (Schick et al., 2023). Zu seinen Werkzeugen gehören ein Taschenrechner, ein Frage-Antwort-System, zwei Suchmaschinen, ein Übersetzungssystem und ein Kalender, und es verbesserte die Zero-Shot-Leistung bei vielen Aufgaben.
  sources:
  - https://arxiv.org/abs/2302.04761
- id: function-calling
  type: Method
  name_en: Function calling
  name_de: Function Calling
- id: react
  type: Method
  name_en: ReAct
  name_de: ReAct
  summary_en: 'ReAct prompts an LLM to generate reasoning traces and task-specific actions in an interleaved way: reasoning helps the model plan and handle exceptions, and actions let it query external sources such as a Wikipedia API (Yao et al., 2022). On ALFWorld and WebShop it outperformed imitation and reinforcement learning methods by 34 and 10 percentage points with only one or two in-context examples.'
  summary_de: 'ReAct lässt ein LLM abwechselnd Gedankengänge und aufgabenbezogene Aktionen erzeugen: Das Schlussfolgern hilft beim Planen und beim Umgang mit Ausnahmen, die Aktionen fragen externe Quellen wie eine Wikipedia-API ab (Yao et al., 2022). Auf ALFWorld und WebShop übertraf es Imitations- und Reinforcement-Learning-Verfahren um 34 und 10 Prozentpunkte, mit nur ein oder zwei Beispielen im Prompt.'
  sources:
  - https://arxiv.org/abs/2210.03629
- id: memgpt
  type: Method
  name_en: MemGPT
  name_de: MemGPT
  summary_en: MemGPT applies "virtual context management", inspired by hierarchical memory in operating systems, to give an LLM extended context beyond its context window by moving data between memory tiers and using interrupts to manage control flow (Packer et al., 2023). It was evaluated on analysing documents far larger than the context window and on multi-session chat agents that remember users over long interactions.
  summary_de: 'MemGPT überträgt „virtuelle Kontextverwaltung“, angelehnt an hierarchischen Speicher in Betriebssystemen, auf LLMs: Daten werden zwischen Speicherebenen verschoben und Interrupts steuern den Ablauf, sodass das Modell über sein Kontextfenster hinaus arbeiten kann (Packer et al., 2023). Evaluiert wurde es an Dokumenten, die weit größer sind als das Kontextfenster, und an Chat-Agenten, die sich über viele Sitzungen an Nutzende erinnern.'
  sources:
  - https://arxiv.org/abs/2310.08560
- id: reflexion
  type: Method
  name_en: Reflexion
  name_de: Reflexion
  summary_en: 'Reflexion reinforces language agents through linguistic feedback instead of weight updates: agents reflect verbally on task feedback and keep these reflections in an episodic memory to decide better in later trials (Shinn et al., 2023). It reached 91% pass@1 on the HumanEval coding benchmark, against 80% for GPT-4 at the time.'
  summary_de: 'Reflexion verbessert Sprach-Agenten über sprachliches Feedback statt über Gewichtsanpassungen: Agenten reflektieren schriftlich über Rückmeldungen zur Aufgabe und halten diese Reflexionen in einem episodischen Gedächtnis fest, um in späteren Versuchen besser zu entscheiden (Shinn et al., 2023). Auf dem Programmier-Benchmark HumanEval erreichte es 91 % pass@1, GPT-4 damals 80 %.'
  sources:
  - https://arxiv.org/abs/2303.11366

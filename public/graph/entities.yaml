- id: self-refine
  type: Method
  name_en: Self-Refine
  name_de: Self-Refine
  summary_en: 'Self-Refine improves an LLM''s output iteratively: the same model generates an initial answer, gives feedback on it and refines it, without supervised data, extra training or reinforcement learning (Madaan et al., 2023). Across seven tasks, from dialogue responses to mathematical reasoning, it improved task performance by about 20 percentage points on average over one-step generation.'
  summary_de: 'Self-Refine verbessert die Ausgabe eines LLM schrittweise: Dasselbe Modell erzeugt eine erste Antwort, gibt Feedback dazu und überarbeitet sie, ohne überwachte Daten, zusätzliches Training oder Reinforcement Learning (Madaan et al., 2023). Über sieben Aufgaben, von Dialogantworten bis zu mathematischem Schlussfolgern, verbesserte es die Leistung gegenüber einstufiger Generierung im Mittel um rund 20 Prozentpunkte.'
  sources:

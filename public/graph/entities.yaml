- id: stereoset
  type: Dataset
  name_en: StereoSet
  name_de: StereoSet
  summary_en: StereoSet is a large-scale natural English dataset for measuring stereotypical bias in pretrained language models across four domains, gender, profession, race and religion (Nadeem et al., 2020). Its authors found strong stereotypical biases in BERT, GPT-2, RoBERTa and XLNet and run a leaderboard with a hidden test set.
  summary_de: StereoSet ist ein großer, natürlicher englischer Datensatz, der stereotype Verzerrungen vortrainierter Sprachmodelle in vier Bereichen misst, Geschlecht, Beruf, Herkunft und Religion (Nadeem et al., 2020). Die Autoren fanden starke stereotype Verzerrungen in BERT, GPT-2, RoBERTa und XLNet und betreiben eine Rangliste mit verborgener Testmenge.
  sources:
  - https://arxiv.org/abs/2004.09456
- id: bbq
  type: Dataset
  name_en: Bias Benchmark for QA (BBQ)
  name_de: Bias Benchmark for QA (BBQ)
  summary_en: The Bias Benchmark for QA (BBQ) consists of hand-built question sets that target attested social biases against protected groups along nine social dimensions relevant for U.S. English-speaking contexts (Parrish et al., 2021). With under-informative contexts, models often relied on stereotypes, and even with informative contexts their accuracy was up to 3.4 percentage points higher when the correct answer matched a social bias.
  summary_de: Der Bias Benchmark for QA (BBQ) besteht aus von Hand erstellten Fragensätzen zu belegten sozialen Vorurteilen gegenüber geschützten Gruppen entlang neun sozialer Dimensionen im US-englischsprachigen Kontext (Parrish et al., 2021). Bei wenig informativem Kontext stützten sich Modelle oft auf Stereotype, und selbst bei informativem Kontext lag ihre Accuracy bis zu 3,4 Prozentpunkte höher, wenn die richtige Antwort einem Vorurteil entsprach.
  sources:
  - https://arxiv.org/abs/2110.08193
- id: taz2024full
  type: Dataset
  name_en: taz2024full
  name_de: taz2024full
- id: cuad
  type: Dataset
  name_en: CUAD
  name_de: CUAD
  aliases:
  - Contract Understanding Atticus Dataset
  summary_en: The Contract Understanding Atticus Dataset (CUAD) is a dataset for legal contract review created with dozens of legal experts from The Atticus Project, with over 13,000 annotations (Hendrycks et al., 2021). The task is to highlight the parts of a contract that a human reviewer should look at; Transformer models showed nascent performance that depended strongly on model design and training set size.
  summary_de: Der Contract Understanding Atticus Dataset (CUAD) ist ein Datensatz für die Vertragsprüfung, erstellt mit Dutzenden Fachleuten des Atticus Project, mit über 13 000 Annotationen (Hendrycks et al., 2021). Aufgabe ist, die Stellen eines Vertrags zu markieren, die eine prüfende Person ansehen sollte; Transformer-Modelle zeigten erste Erfolge, die stark von Modellaufbau und Größe der Trainingsdaten abhingen.
  sources:
  - https://arxiv.org/abs/2103.06268
- id: contractnli
  type: Dataset
  name_en: ContractNLI
  name_de: ContractNLI
  summary_en: ContractNLI frames contract review as document-level natural language inference; for each hypothesis, such as that some obligations survive termination, a system decides whether the contract entails it, contradicts it or does not mention it and marks the evidence spans (Koreeda & Manning, 2021). It contains 607 annotated contracts, and negations by exceptions make the task hard.
  summary_de: ContractNLI fasst die Vertragsprüfung als Natural Language Inference auf Dokumentebene; für jede Hypothese, etwa dass bestimmte Pflichten eine Kündigung überdauern, entscheidet ein System, ob der Vertrag sie stützt, ihr widerspricht oder sie nicht erwähnt, und markiert die Belegstellen (Koreeda & Manning, 2021). Er umfasst 607 annotierte Verträge, und Negationen durch Ausnahmen machen die Aufgabe schwierig.
  sources:
  - https://arxiv.org/abs/2110.01799
- id: mteb
  type: Dataset
  name_en: Massive Text Embedding Benchmark (MTEB)
  name_de: Massive Text Embedding Benchmark (MTEB)
  summary_en: The Massive Text Embedding Benchmark (MTEB) evaluates text embeddings on 8 task types, among them clustering and reranking, with 58 datasets in 112 languages (Muennighoff et al., 2022). Benchmarking 33 models, its authors found that no embedding method dominates across all tasks; MTEB has open-source code and a public leaderboard.
  summary_de: Der Massive Text Embedding Benchmark (MTEB) bewertet Text-Embeddings in 8 Aufgabentypen, darunter Clustering und Reranking, mit 58 Datensätzen in 112 Sprachen (Muennighoff et al., 2022). Beim Vergleich von 33 Modellen dominierte keine Embedding-Methode über alle Aufgaben; MTEB bietet offenen Code und eine öffentliche Rangliste.
  sources:
  - https://arxiv.org/abs/2210.07316
- id: conll-2003
  type: Dataset
  name_en: CoNLL-2003
  name_de: CoNLL-2003
- id: dbpedia
  type: Dataset
  name_en: DBpedia
  name_de: DBpedia
- id: yago
  type: Dataset
  name_en: YAGO
  name_de: YAGO
- id: freebase
  type: Dataset
  name_en: Freebase
  name_de: Freebase
- id: lexglue
  type: Dataset
  name_en: LexGLUE
  name_de: LexGLUE
  summary_en: The Legal General Language Understanding Evaluation (LexGLUE) benchmark collects datasets for evaluating models on diverse English legal NLU tasks in a standardised way (Chalkidis et al., 2021). In its evaluation, legal-oriented models consistently outperformed generic ones across multiple tasks.
  summary_de: Der Benchmark Legal General Language Understanding Evaluation (LexGLUE) bündelt Datensätze, um Modelle einheitlich auf verschiedenen Aufgaben des Verstehens englischer Rechtssprache zu bewerten (Chalkidis et al., 2021). In seiner Evaluation übertrafen auf Recht ausgerichtete Modelle generische Modelle durchgängig über mehrere Aufgaben.
  sources:
  - https://arxiv.org/abs/2110.00976
- id: legalbench
  type: Dataset
  name_en: LegalBench
  name_de: LegalBench
  summary_en: LegalBench is a collaboratively built benchmark of 162 tasks covering six types of legal reasoning, designed and hand-crafted by legal professionals (Guha et al., 2023). Its authors map the tasks to legal frameworks for describing legal reasoning and evaluated 20 open-source and commercial LLMs.
  summary_de: LegalBench ist ein gemeinschaftlich erstellter Benchmark aus 162 Aufgaben zu sechs Arten juristischen Schlussfolgerns, von Fachleuten aus dem Recht entworfen (Guha et al., 2023). Die Autoren ordnen die Aufgaben juristischen Modellen des Schlussfolgerns zu und evaluierten 20 offene und kommerzielle LLMs.
  sources:
  - https://arxiv.org/abs/2308.11462
- id: mmlu
  type: Dataset
  name_en: MMLU
  name_de: MMLU
  aliases:
  - Massive Multitask Language Understanding
  summary_en: MMLU (Measuring Massive Multitask Language Understanding) tests a text model's multitask accuracy on 57 tasks, including elementary mathematics, US history, computer science and law (Hendrycks et al., 2020). When it was introduced, most models were near chance, the largest GPT-3 model improved on chance by almost 20 percentage points, and models were near random on subjects such as morality and law.
  summary_de: MMLU (Measuring Massive Multitask Language Understanding) prüft die Multitask-Accuracy eines Textmodells in 57 Aufgaben, darunter Elementarmathematik, US-Geschichte, Informatik und Recht (Hendrycks et al., 2020). Bei der Einführung lagen die meisten Modelle nahe am Zufall, das größte GPT-3-Modell um fast 20 Prozentpunkte darüber, und bei Themen wie Moral und Recht blieben Modelle nahe am Zufall.
  sources:
  - https://arxiv.org/abs/2009.03300
- id: truthfulqa
  type: Dataset
  name_en: TruthfulQA
  name_de: TruthfulQA
  summary_en: TruthfulQA measures whether a language model answers truthfully, with 817 questions in 38 categories such as health, law, finance and politics that some humans would answer falsely because of misconceptions (Lin et al., 2021). The best model tested was truthful on 58% of questions against 94% for humans, and the largest models were generally the least truthful.
  summary_de: TruthfulQA misst, ob ein Sprachmodell wahrheitsgemäß antwortet, mit 817 Fragen in 38 Kategorien wie Gesundheit, Recht, Finanzen und Politik, die manche Menschen wegen verbreiteter Irrtümer falsch beantworten würden (Lin et al., 2021). Das beste getestete Modell war bei 58 % der Fragen wahrheitsgemäß, Menschen bei 94 %, und die größten Modelle waren im Allgemeinen am wenigsten wahrheitsgemäß.
  sources:
  - https://arxiv.org/abs/2109.07958
- id: mt-bench
  type: Dataset
  name_en: MT-bench
  name_de: MT-bench
  summary_en: MT-bench is a set of multi-turn questions for evaluating chat assistants, introduced together with the crowdsourced Chatbot Arena to check how well LLM judges agree with human preferences (Zheng et al., 2023). Strong judges such as GPT-4 reached over 80% agreement with human preferences, the same level as agreement between humans.
  summary_de: MT-bench ist eine Sammlung mehrstufiger Fragen zur Bewertung von Chat-Assistenten, vorgestellt zusammen mit der per Crowdsourcing betriebenen Chatbot Arena, um zu prüfen, wie gut LLM-Judges mit menschlichen Präferenzen übereinstimmen (Zheng et al., 2023). Starke Judges wie GPT-4 erreichten über 80 % Übereinstimmung, so viel wie Menschen untereinander.
  sources:
  - https://arxiv.org/abs/2306.05685
- id: chatbot-arena
  type: Technology
  name_en: Chatbot Arena
  name_de: Chatbot Arena
- id: squad
  type: Dataset
  name_en: SQuAD
  name_de: SQuAD
  aliases:
  - Stanford Question Answering Dataset
  summary_en: The Stanford Question Answering Dataset (SQuAD) is a reading comprehension dataset of more than 100,000 questions posed by crowdworkers on Wikipedia articles, where each answer is a segment of the corresponding passage (Rajpurkar et al., 2016). Its logistic regression baseline reached an F1 score of 51.0% against human performance of 86.8%.
  summary_de: Der Stanford Question Answering Dataset (SQuAD) ist ein Datensatz zum Leseverständnis mit über 100 000 Fragen, die Crowdworker zu Wikipedia-Artikeln stellten; jede Antwort ist ein Abschnitt der zugehörigen Textpassage (Rajpurkar et al., 2016). Die Baseline mit logistischer Regression erreichte einen F1-Wert von 51,0 %, Menschen 86,8 %.
  sources:
  - https://arxiv.org/abs/1606.05250
- id: alce
  type: Dataset
  name_en: ALCE
  name_de: ALCE
  summary_en: ALCE is a benchmark for Automatic LLMs' Citation Evaluation, in which systems retrieve supporting evidence and generate answers with citations; it measures fluency, correctness and citation quality with automatic metrics that correlate strongly with human judgements (Gao et al., 2023). On the ELI5 dataset, even the best models lacked complete citation support half of the time.
  summary_de: ALCE ist ein Benchmark für die automatische Bewertung von Zitaten in LLM-Antworten, bei dem Systeme Belege abrufen und Antworten mit Quellenangaben erzeugen; er misst Flüssigkeit, Korrektheit und Zitierqualität mit automatischen Metriken, die stark mit menschlichen Urteilen korrelieren (Gao et al., 2023). Auf dem Datensatz ELI5 fehlte selbst den besten Modellen in der Hälfte der Fälle eine vollständige Belegung durch Zitate.
  sources:
  - https://arxiv.org/abs/2305.14627
- id: humaneval
  type: Dataset
  name_en: HumanEval
  name_de: HumanEval
  summary_en: HumanEval is an evaluation set released with Codex to measure the functional correctness of programs synthesised from docstrings (Chen et al., 2021). Codex solved 28.8% of its problems against 0% for GPT-3, and 70.2% when 100 samples were drawn per problem.
  summary_de: HumanEval ist ein Evaluationsdatensatz, der mit Codex veröffentlicht wurde, um die funktionale Korrektheit von Programmen zu messen, die aus Docstrings erzeugt werden (Chen et al., 2021). Codex löste 28,8 % der Aufgaben, GPT-3 0 %, und mit 100 Stichproben je Aufgabe 70,2 %.
  sources:
  - https://arxiv.org/abs/2107.03374
- id: agentbench
  type: Dataset
  name_en: AgentBench
  name_de: AgentBench
  summary_en: AgentBench evaluates LLMs as agents in 8 distinct interactive environments that test reasoning and decision-making (Liu et al., 2023). It found a significant gap between top commercial LLMs and many open-source models up to 70B parameters, with poor long-term reasoning, decision-making and instruction following as the main obstacles.
  summary_de: AgentBench bewertet LLMs als Agenten in 8 verschiedenen interaktiven Umgebungen, die Schlussfolgern und Entscheiden prüfen (Liu et al., 2023). Er zeigte eine deutliche Lücke zwischen führenden kommerziellen LLMs und vielen offenen Modellen bis 70 Milliarden Parametern; Hauptprobleme waren schwaches langfristiges Schlussfolgern, Entscheiden und Befolgen von Anweisungen.
  sources:
  - https://arxiv.org/abs/2308.03688
- id: swe-bench
  type: Dataset
  name_en: SWE-bench
  name_de: SWE-bench
  summary_en: SWE-bench is an evaluation framework of 2,294 software engineering problems drawn from real GitHub issues and pull requests across 12 popular Python repositories; a model must edit the codebase to resolve the issue (Jimenez et al., 2023). At its release, the best model, Claude 2, resolved only 1.96% of the issues.
  summary_de: SWE-bench ist ein Evaluationsrahmen aus 2 294 Softwareentwicklungsaufgaben aus echten GitHub-Issues und Pull Requests von 12 verbreiteten Python-Repositories; ein Modell muss die Codebasis so ändern, dass das Issue gelöst ist (Jimenez et al., 2023). Bei der Veröffentlichung löste das beste Modell, Claude 2, nur 1,96 % der Issues.
  sources:
  - https://arxiv.org/abs/2310.06770
- id: houyi
  type: Method
  name_en: HouYi
  name_de: HouYi
  summary_en: HouYi is a black-box prompt injection attack technique for LLM-integrated applications, inspired by web injection attacks, with three parts, a pre-constructed prompt, an injection prompt that induces context partition and a malicious payload (Liu et al., 2023). Deployed on 36 real applications, it found 31 susceptible, with outcomes such as unrestricted LLM use and theft of application prompts; ten vendors confirmed the findings.
  summary_de: 'HouYi ist eine Black-Box-Technik für Prompt-Injection-Angriffe auf LLM-integrierte Anwendungen nach dem Vorbild von Injection-Angriffen im Web, mit drei Teilen: einem vorbereiteten Prompt, einem Injection-Prompt, der eine Kontexttrennung herbeiführt, und einer schädlichen Nutzlast (Liu et al., 2023). Bei 36 echten Anwendungen waren 31 anfällig, mit Folgen wie uneingeschränkter LLM-Nutzung und Diebstahl von Anwendungs-Prompts; zehn Anbieter bestätigten die Befunde.'
  sources:
  - https://arxiv.org/abs/2306.05499
- id: injecagent
  type: Dataset
  name_en: InjecAgent
  name_de: InjecAgent
  summary_en: InjecAgent is a benchmark for indirect prompt injection attacks on tool-integrated LLM agents, with 1,054 test cases covering 17 user tools and 62 attacker tools and two attack intentions, direct harm to users and exfiltration of private data (Zhan et al., 2024). Of 30 agents evaluated, ReAct-prompted GPT-4 was vulnerable 24% of the time, and reinforcing attacks with a hacking prompt nearly doubled the success rate.
  summary_de: InjecAgent ist ein Benchmark für indirekte Prompt-Injection-Angriffe auf LLM-Agenten mit Werkzeugen, mit 1 054 Testfällen zu 17 Nutzer- und 62 Angreiferwerkzeugen und zwei Angriffszielen, direktem Schaden für Nutzende und Abfluss privater Daten (Zhan et al., 2024). Von 30 getesteten Agenten war GPT-4 mit ReAct-Prompting in 24 % der Fälle angreifbar, und ein zusätzlicher Hacking-Prompt verdoppelte die Erfolgsrate fast.
  sources:
  - https://arxiv.org/abs/2403.02691
- id: ltbd
  type: Method
  name_en: Learnable Trust-Boundary Delimiters (LTBD)
  name_de: Learnable Trust-Boundary Delimiters (LTBD)
  summary_en: Learnable Trust-Boundary Delimiters (LTBD) defend against prompt injection by inserting a small number of learnable delimiters that mark trusted user instructions apart from untrusted external data, without changing the LLM's parameters (Zhao et al., 2026). LTBD outperformed inference-time defences, competed with training-based ones, kept benign-task utility and reached 0.00% attack success on AlpacaFarm.
  summary_de: Learnable Trust-Boundary Delimiters (LTBD) wehren Prompt Injection ab, indem wenige lernbare Trennzeichen vertrauenswürdige Anweisungen der Nutzenden von nicht vertrauenswürdigen externen Daten abgrenzen, ohne die Parameter des LLM zu verändern (Zhao et al., 2026). LTBD übertraf Abwehrmaßnahmen zur Inferenzzeit, hielt mit trainingsbasierten mit, erhielt die Nützlichkeit bei harmlosen Aufgaben und erreichte 0,00 % Angriffserfolg auf AlpacaFarm.
  sources:
  - https://arxiv.org/abs/2610.11634
- id: raised
  type: Method
  name_en: RAISED
  name_de: RAISED
  summary_en: 'RAISED (Robust Attack Invariance through Self-Distillation) trains tool-using LLM agents against indirect prompt injection: the model generates its own tool-use scenarios and is then trained to match its clean-context behaviour on both clean and injected versions of the same trajectory (Dhouib et al., 2026). It substantially reduced attack success while, unlike earlier training-based defences, preserving utility on agentic and general benchmarks.'
  summary_de: 'RAISED (Robust Attack Invariance through Self-Distillation) trainiert LLM-Agenten mit Werkzeugen gegen indirekte Prompt Injection: Das Modell erzeugt eigene Szenarien mit Werkzeugnutzung und wird dann darauf trainiert, sich bei sauberen und manipulierten Varianten desselben Ablaufs so zu verhalten wie im sauberen Kontext (Dhouib et al., 2026). Es senkte den Angriffserfolg deutlich und erhielt, anders als frühere trainingsbasierte Abwehr, die Nützlichkeit auf Agenten- und allgemeinen Benchmarks.'
  sources:
  - https://arxiv.org/abs/2610.06401
- id: apex-execution-boundary
  type: Method
  name_en: APEX
  name_de: APEX
  summary_en: APEX defends LLM agents against indirect prompt injection at the execution boundary, where an agent turns internal state into an external action or output, instead of trying to recognise attack patterns (Zheng et al., 2026). An authorisation contract compiled from the trusted task before untrusted execution admits only justified effects and exposes unendorsed use through deception; APEX reached 0% attack success on five of six benchmarks.
  summary_de: APEX schützt LLM-Agenten gegen indirekte Prompt Injection an der Ausführungsgrenze, an der ein Agent internen Zustand in eine externe Aktion oder Ausgabe umsetzt, statt Angriffsmuster erkennen zu wollen (Zheng et al., 2026). Ein vor der Ausführung aus der vertrauenswürdigen Aufgabe kompilierter Berechtigungsvertrag lässt nur begründete Wirkungen zu und macht nicht gedeckte Nutzung durch Täuschung sichtbar; APEX erreichte bei fünf von sechs Benchmarks 0 % Angriffserfolg.
  sources:
  - https://arxiv.org/abs/2610.06966
- id: rag-pibench
  type: Dataset
  name_en: RAG-PIBench
  name_de: RAG-PIBench
  summary_en: RAG-PIBench is a benchmark for detecting prompt injections embedded in retrieved content in RAG systems, with 4,876 contextual examples in frozen train, validation and protected test splits built by a leakage-aware pipeline (Jaffal et al., 2026). DistilBERT performed best on the protected test set (F1 0.896), while TF-IDF with SVM or logistic regression remained competitive.
  summary_de: RAG-PIBench ist ein Benchmark zur Erkennung von Prompt Injections in abgerufenen Inhalten von RAG-Systemen, mit 4 876 kontextbezogenen Beispielen in festen Trainings-, Validierungs- und geschützten Testmengen, erstellt mit einem Verfahren gegen Datenlecks (Jaffal et al., 2026). DistilBERT schnitt auf der geschützten Testmenge am besten ab (F1 0,896), TF-IDF mit SVM oder logistischer Regression blieb konkurrenzfähig.
  sources:
  - https://arxiv.org/abs/2610.08571
- id: pruning
  type: Method
  name_en: Pruning
  name_de: Pruning
  summary_en: Pruning removes parameters from a trained neural network; it can reduce parameter counts by over 90% while keeping accuracy and lowering storage and inference cost (Frankle & Carbin, 2018). Frankle and Carbin found that standard pruning uncovers sparse "winning ticket" subnetworks that, trained from their original initialisation, reach comparable accuracy, the lottery ticket hypothesis.
  summary_de: Pruning entfernt Parameter aus einem trainierten neuronalen Netz; es kann die Zahl der Parameter um über 90 % verringern, ohne Genauigkeit einzubüßen, und senkt Speicher- und Inferenzkosten (Frankle & Carbin, 2018). Frankle und Carbin fanden, dass übliches Pruning dünn besetzte „Gewinnlos“-Teilnetze freilegt, die von ihrer ursprünglichen Initialisierung aus trainiert eine vergleichbare Genauigkeit erreichen, die Lottery-Ticket-Hypothese.
  sources:
  - https://arxiv.org/abs/1803.03635
- id: low-rank-factorisation
  type: Method
  name_en: Low-rank factorisation
  name_de: Low-Rank-Faktorisierung
  summary_en: Low-rank factorisation is one of four main categories of techniques for compressing and accelerating deep neural networks, alongside parameter pruning and quantisation, transferred or compact convolutional filters, and knowledge distillation (Cheng et al., 2017).
  summary_de: Low-Rank-Faktorisierung ist eine von vier Hauptgruppen von Verfahren zur Kompression und Beschleunigung tiefer neuronaler Netze, neben Pruning und Quantisierung von Parametern, übertragenen oder kompakten Faltungsfiltern und Knowledge Distillation (Cheng et al., 2017).
  sources:
  - https://arxiv.org/abs/1710.09282
- id: selfcheckgpt
  type: Method
  name_en: SelfCheckGPT
  name_de: SelfCheckGPT
  summary_en: 'SelfCheckGPT is a sampling-based method for detecting hallucinations of black-box LLMs without an external database: if a model knows a fact, sampled responses tend to be consistent, whereas hallucinated facts diverge and contradict each other (Manakul et al., 2023). On GPT-3 passages about people from WikiBio it detected non-factual sentences and ranked passages by factuality better than grey-box baselines.'
  summary_de: 'SelfCheckGPT erkennt Halluzinationen von Black-Box-LLMs über Stichproben und ohne externe Datenbank: Kennt ein Modell einen Fakt, stimmen mehrere gezogene Antworten meist überein, während halluzinierte Fakten auseinanderlaufen und sich widersprechen (Manakul et al., 2023). Bei GPT-3-Texten über Personen aus WikiBio erkannte es nicht faktentreue Sätze und ordnete Texte nach Faktentreue besser als Grey-Box-Verfahren.'
  sources:
  - https://arxiv.org/abs/2303.08896
- id: hades
  type: Dataset
  name_en: HaDes
  name_de: HaDes
  summary_en: HaDes (HAllucination DEtection dataSet) supports token-level, reference-free hallucination detection for free-form text generation (Liu et al., 2021). It was built by perturbing text segments from English Wikipedia and verifying them with crowd-sourced annotations, using an iterative model-in-the-loop strategy against label imbalance.
  summary_de: HaDes (HAllucination DEtection dataSet) dient der Erkennung von Halluzinationen auf Token-Ebene ohne Referenztext bei freier Textgenerierung (Liu et al., 2021). Er entstand, indem Textabschnitte aus der englischen Wikipedia verändert und per Crowdsourcing geprüft wurden, mit einem iterativen Model-in-the-Loop-Verfahren gegen unausgewogene Labels.
  sources:
  - https://arxiv.org/abs/2104.08704
- id: reld
  type: Method
  name_en: RelD
  name_de: RelD
- id: grounding-probe
  type: Method
  name_en: Grounding Probe
  name_de: Grounding Probe
  summary_en: The Grounding Probe detects ungrounded RAG responses with logistic regression over mean-pooled middle-layer hidden states of an observer language model that reads context, question and response in one forward pass, independent of the generating model (Rathmayr et al., 2026). Trained on 15,090 annotated responses it reached 0.879 to 0.894 AUROC on RAGTruth and held across six generators.
  summary_de: Die Grounding Probe erkennt nicht belegte RAG-Antworten mit logistischer Regression über gemittelte verborgene Zustände einer mittleren Schicht eines Beobachter-Sprachmodells, das Kontext, Frage und Antwort in einem Durchlauf liest, unabhängig vom erzeugenden Modell (Rathmayr et al., 2026). Auf 15 090 annotierten Antworten trainiert, erreichte sie 0,879 bis 0,894 AUROC auf RAGTruth und blieb über sechs Generatoren stabil.
  sources:
  - https://arxiv.org/abs/2610.04642
- id: parcel
  type: Dataset
  name_en: PARCEL
  name_de: PARCEL
- id: next-sentence-prediction
  type: Method
  name_en: Next sentence prediction (NSP)
  name_de: Next Sentence Prediction (NSP)
  summary_en: 'Next sentence prediction (NSP) is the second pre-training task of BERT, besides masked language modelling: for each pair of sentences A and B, B is the actual next sentence in 50% of cases and a random sentence otherwise, and the model predicts which (Devlin et al., 2018). It was added because tasks such as question answering and natural language inference depend on relationships between sentences, and the authors found it very beneficial for both.'
  summary_de: 'Next Sentence Prediction (NSP) ist neben Masked Language Modelling die zweite Vortrainingsaufgabe von BERT: Für jedes Satzpaar A und B ist B in 50 % der Fälle der tatsächliche Folgesatz und sonst ein zufälliger Satz, und das Modell sagt vorher, welcher Fall vorliegt (Devlin et al., 2018). Sie wurde ergänzt, weil Aufgaben wie Fragebeantwortung und Natural Language Inference von Beziehungen zwischen Sätzen abhängen, und erwies sich nach Angaben der Autoren für beide als sehr nützlich.'
  sources:
  - https://arxiv.org/abs/1810.04805
- id: bm25f
  type: Method
  name_en: BM25F
  name_de: BM25F
- id: poly-encoder
  type: Method
  name_en: Poly-encoder
  name_de: Poly-Encoder
  summary_en: The Poly-encoder is a Transformer architecture for scoring pairs of sequences that learns global rather than token-level self-attention features, placed between bi-encoders, which encode both sides separately, and cross-encoders, which attend over the full pair (Humeau et al., 2019). It was faster than cross-encoders and more accurate than bi-encoders, with best results after pre-training on data similar to the downstream task.
  summary_de: Der Poly-Encoder ist eine Transformer-Architektur zum Bewerten von Sequenzpaaren, die globale statt tokenweise Self-Attention-Merkmale lernt; er liegt zwischen Bi-Encodern, die beide Seiten getrennt kodieren, und Cross-Encodern, die über das ganze Paar Aufmerksamkeit berechnen (Humeau et al., 2019). Er war schneller als Cross-Encoder und genauer als Bi-Encoder, am besten nach Vortraining auf Daten ähnlich der Zielaufgabe.
  sources:
  - https://arxiv.org/abs/1905.01969
- id: nested-cross-validation
  type: Method
  name_en: Nested cross-validation
  name_de: Verschachtelte Kreuzvalidierung
- id: whisper
  type: Method
  name_en: Whisper
  name_de: Whisper
  summary_en: Whisper is a family of speech recognition models trained to predict transcripts on 680,000 hours of multilingual and multitask audio from the internet (Radford et al., 2022). The models generalise to standard benchmarks in a zero-shot setting without fine-tuning, are often competitive with fully supervised systems and approach human accuracy and robustness; models and inference code were released.
  summary_de: Whisper ist eine Familie von Spracherkennungsmodellen, die auf 680 000 Stunden mehrsprachigem und multitask-annotiertem Audio aus dem Internet darauf trainiert wurden, Transkripte vorherzusagen (Radford et al., 2022). Die Modelle generalisieren ohne Fine-Tuning auf Standard-Benchmarks, sind oft mit vollständig überwachten Systemen konkurrenzfähig und nähern sich menschlicher Genauigkeit und Robustheit; Modelle und Inferenzcode wurden veröffentlicht.
  sources:
  - https://arxiv.org/abs/2212.04356
- id: wav2vec-2-0
  type: Method
  name_en: wav2vec 2.0
  name_de: wav2vec 2.0
  summary_en: wav2vec 2.0 learns speech representations self-supervised from audio alone by masking the input in latent space and solving a contrastive task over jointly learned quantised representations, followed by fine-tuning on transcribed speech (Baevski et al., 2020). With ten minutes of labelled data and 53,000 hours of unlabelled pre-training data it still reached 4.8/8.2 word error rate on Librispeech clean/other.
  summary_de: wav2vec 2.0 lernt Sprachrepräsentationen selbstüberwacht allein aus Audio, indem es die Eingabe im latenten Raum maskiert und eine kontrastive Aufgabe über gemeinsam gelernte quantisierte Repräsentationen löst; danach folgt Fine-Tuning auf transkribierter Sprache (Baevski et al., 2020). Mit zehn Minuten annotierter Daten und 53 000 Stunden nicht annotierter Vortrainingsdaten erreichte es noch 4,8/8,2 Wortfehlerrate auf Librispeech clean/other.
  sources:
  - https://arxiv.org/abs/2006.11477

- id: chinchilla
  type: Method
  name_en: Chinchilla
  name_de: Chinchilla
  summary_en: Chinchilla is a 70-billion-parameter language model trained with the same compute budget as Gopher but on four times more data, to test the finding that model size and training tokens should be scaled equally (Hoffmann et al., 2022). Based on over 400 trained models, the study concluded that large language models were significantly undertrained; Chinchilla outperformed Gopher, GPT-3 and Megatron-Turing NLG and reached 67.5% on MMLU.
  summary_de: Chinchilla ist ein Sprachmodell mit 70 Milliarden Parametern, trainiert mit demselben Rechenbudget wie Gopher, aber auf viermal mehr Daten, um den Befund zu prüfen, dass Modellgröße und Zahl der Trainingstokens gleichermaßen wachsen sollten (Hoffmann et al., 2022). Auf Grundlage von über 400 trainierten Modellen kam die Studie zu dem Schluss, dass große Sprachmodelle deutlich untertrainiert waren; Chinchilla übertraf Gopher, GPT-3 und Megatron-Turing NLG und erreichte 67,5 % auf MMLU.
  sources:
  - https://arxiv.org/abs/2203.15556

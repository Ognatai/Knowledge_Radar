- id: xgboost
  type: Method
  name_en: XGBoost
  name_de: XGBoost
  summary_en: XGBoost is a scalable end-to-end tree boosting system widely used by data scientists to reach state-of-the-art results in machine learning challenges (Chen & Guestrin, 2016). It adds a sparsity-aware algorithm, a weighted quantile sketch for approximate tree learning and optimisations for cache access, compression and sharding, scaling beyond billions of examples.
  summary_de: XGBoost ist ein skalierbares, durchgängiges System für Tree Boosting, das in Data Science weit verbreitet ist, um Spitzenergebnisse in ML-Wettbewerben zu erreichen (Chen & Guestrin, 2016). Es ergänzt einen Algorithmus für dünn besetzte Daten, eine gewichtete Quantilschätzung für näherungsweises Baumlernen sowie Optimierungen für Cache-Zugriffe, Kompression und Sharding und skaliert über Milliarden von Beispielen.
  sources:
  - https://arxiv.org/abs/1603.02754
- id: discriminant-analysis
  type: Method
  name_en: Discriminant analysis
  name_de: Diskriminanzanalyse
  summary_en: Discriminant analysis classifies by modelling the class-conditional distribution of the data, typically as a multivariate Gaussian, and choosing the class with the highest posterior probability via Bayes' rule (scikit-learn developers, n.d.-c). Its two classic forms, linear and quadratic discriminant analysis, have closed-form solutions, are inherently multiclass and have no hyperparameters to tune.
  summary_de: Diskriminanzanalyse klassifiziert, indem sie die bedingte Verteilung der Daten je Klasse modelliert, meist als multivariate Normalverteilung, und über den Satz von Bayes die Klasse mit der höchsten A-posteriori-Wahrscheinlichkeit wählt (scikit-learn developers, n.d.-c). Ihre zwei klassischen Formen, lineare und quadratische Diskriminanzanalyse, haben geschlossene Lösungen, sind von Natur aus mehrklassenfähig und haben keine abzustimmenden Hyperparameter.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: linear-discriminant-analysis
  type: Method
  name_en: Linear discriminant analysis (LDA)
  name_de: Lineare Diskriminanzanalyse (LDA)
  aliases:
  - LDA
  summary_en: Linear discriminant analysis (LDA) is a classifier with a linear decision surface derived from Gaussian class-conditional models with a shared covariance matrix (scikit-learn developers, n.d.-c). It can also reduce dimensionality in a supervised way by projecting data onto the directions that best separate the classes, with fewer output dimensions than classes.
  summary_de: Die lineare Diskriminanzanalyse (LDA) ist ein Klassifikator mit linearer Entscheidungsgrenze, hergeleitet aus Normalverteilungsmodellen je Klasse mit gemeinsamer Kovarianzmatrix (scikit-learn developers, n.d.-c). Sie kann auch überwacht die Dimension reduzieren, indem sie Daten auf die Richtungen projiziert, die die Klassen am besten trennen, mit weniger Ausgabedimensionen als Klassen.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: quadratic-discriminant-analysis
  type: Method
  name_en: Quadratic discriminant analysis (QDA)
  name_de: Quadratische Diskriminanzanalyse (QDA)
  aliases:
  - QDA
  summary_en: Quadratic discriminant analysis (QDA) models each class with its own Gaussian covariance matrix, which gives quadratic decision boundaries and makes it more flexible than linear discriminant analysis (scikit-learn developers, n.d.-c). Like LDA it has a closed-form solution and no hyperparameters to tune.
  summary_de: Die quadratische Diskriminanzanalyse (QDA) modelliert jede Klasse mit eigener Kovarianzmatrix, was quadratische Entscheidungsgrenzen ergibt und sie flexibler macht als die lineare Diskriminanzanalyse (scikit-learn developers, n.d.-c). Wie LDA hat sie eine geschlossene Lösung und keine abzustimmenden Hyperparameter.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html

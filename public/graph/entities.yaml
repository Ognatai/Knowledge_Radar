# Entities without a note of their own. Every public note already describes one
# entity, whose id is the note's slug; those are not listed here. An entity
# gets its own note once 3 or more notes discuss it, and a short sourced text
# before that.
# Fields: id (lowercase ASCII slug), type (public entity type from schema.yaml),
# name_en, name_de, aliases (optional; replaces the former synonyms.yaml),
# summary_en, summary_de and sources (optional short text, 2-4 sentences per
# language, based only on the listed primary sources; all three together).
version: 1
entities:
- id: hipporag
  type: Method
  name_en: HippoRAG
  name_de: HippoRAG
  summary_en: HippoRAG is a retrieval framework inspired by the hippocampal indexing theory of human long-term memory; it combines LLMs, a knowledge graph and Personalized PageRank (Gutiérrez et al., 2024). On multi-hop question answering it outperformed earlier methods by up to 20%, and single-step retrieval with HippoRAG matched iterative retrieval such as IRCoT while being 10 to 30 times cheaper.
  summary_de: HippoRAG ist ein Retrieval-Framework nach dem Vorbild der hippocampalen Indexierungstheorie des menschlichen Langzeitgedächtnisses; es verbindet LLMs, einen Wissensgraphen und Personalized PageRank (Gutiérrez et al., 2024). Bei mehrstufiger Fragebeantwortung übertraf es frühere Verfahren um bis zu 20 %, und einstufiges Retrieval mit HippoRAG erreichte iteratives Retrieval wie IRCoT bei 10- bis 30-mal geringeren Kosten.
  sources:
  - https://arxiv.org/abs/2405.14831
- id: lightrag
  type: Method
  name_en: LightRAG
  name_de: LightRAG
  summary_en: LightRAG incorporates graph structures into text indexing and retrieval for retrieval-augmented generation, with dual-level retrieval of low-level and high-level knowledge (Guo et al., 2024). Combining graphs with vector representations speeds up retrieval of related entities and relationships, and an incremental update algorithm integrates new data in a timely way.
  summary_de: LightRAG bindet Graphstrukturen in Indexierung und Retrieval für Retrieval-Augmented Generation ein, mit einem zweistufigen Retrieval von Detail- und Überblickswissen (Guo et al., 2024). Die Verbindung von Graphen mit Vektorrepräsentationen beschleunigt das Abrufen verwandter Entitäten und Beziehungen, und ein inkrementelles Aktualisierungsverfahren nimmt neue Daten zeitnah auf.
  sources:
  - https://arxiv.org/abs/2410.05779
- id: personalized-pagerank
  type: Method
  name_en: Personalized PageRank
  name_de: Personalized PageRank
  summary_en: Personalised PageRank biases the random surfer's teleport step towards a chosen set of nodes instead of all nodes, so that the steady state reflects importance relative to these nodes (Manning et al. 2008). For a user with mixed interests it can be computed as a linear combination of topic-specific PageRank vectors; HippoRAG uses Personalized PageRank over a knowledge graph for retrieval (Gutiérrez et al. 2024).
  summary_de: Personalisierter PageRank lenkt den Teleport-Schritt des Zufallssurfers auf eine gewählte Knotenmenge statt auf alle Knoten, sodass der stationäre Zustand die Wichtigkeit relativ zu diesen Knoten abbildet (Manning et al. 2008). Für Nutzende mit gemischten Interessen lässt er sich als Linearkombination themenspezifischer PageRank-Vektoren berechnen; HippoRAG nutzt Personalized PageRank über einem Wissensgraphen für das Retrieval (Gutiérrez et al. 2024).
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/topic-specific-pagerank-1.html
  - https://arxiv.org/abs/2405.14831
- id: ircot
  type: Method
  name_en: IRCoT
  name_de: IRCoT
  summary_en: IRCoT interleaves retrieval with the steps of a chain of thought for multi-step question answering, so that what is retrieved next depends on what has been derived so far (Trivedi et al., 2022). With GPT-3 it improved retrieval by up to 21 points and question answering by up to 15 points on HotpotQA, 2WikiMultihopQA, MuSiQue and IIRC, and reduced hallucination.
  summary_de: IRCoT verschränkt Retrieval mit den Schritten einer Chain of Thought für mehrstufige Fragebeantwortung, sodass das als Nächstes Abgerufene davon abhängt, was bisher hergeleitet wurde (Trivedi et al., 2022). Mit GPT-3 verbesserte es das Retrieval um bis zu 21 Punkte und die Fragebeantwortung um bis zu 15 Punkte auf HotpotQA, 2WikiMultihopQA, MuSiQue und IIRC und verringerte Halluzinationen.
  sources:
  - https://arxiv.org/abs/2212.10509
- id: trade-secret
  type: Concept
  name_en: Trade secret
  name_de: Geschäftsgeheimnis
  summary_en: Under the German Trade Secrets Act, a trade secret is information that is not generally known or readily accessible to people who normally deal with such information and therefore has economic value, that is subject to reasonable confidentiality measures by its lawful holder, and in whose confidentiality there is a legitimate interest (§ 2 No. 1 GeschGehG).
  summary_de: Nach dem Geschäftsgeheimnisgesetz ist ein Geschäftsgeheimnis eine Information, die den Personen, die üblicherweise mit dieser Art von Informationen umgehen, weder allgemein bekannt noch ohne Weiteres zugänglich und daher von wirtschaftlichem Wert ist, die Gegenstand angemessener Geheimhaltungsmaßnahmen durch ihren rechtmäßigen Inhaber ist und bei der ein berechtigtes Interesse an der Geheimhaltung besteht (§ 2 Nr. 1 GeschGehG).
  sources:
  - https://www.gesetze-im-internet.de/geschgehg/
- id: reverse-engineering
  type: Concept
  name_en: Reverse engineering
  name_de: Reverse Engineering
  summary_en: Under the German Trade Secrets Act, a trade secret may lawfully be obtained by observing, studying, disassembling or testing a product that has been made publicly available or that is lawfully in the possession of the person doing so, if that person is not under a duty to limit the acquisition of the trade secret (§ 3(1) No. 2 GeschGehG).
  summary_de: Nach dem Geschäftsgeheimnisgesetz darf ein Geschäftsgeheimnis durch Beobachten, Untersuchen, Rückbauen oder Testen eines Produkts erlangt werden, das öffentlich verfügbar gemacht wurde oder sich im rechtmäßigen Besitz der handelnden Person befindet, sofern diese keiner Pflicht zur Beschränkung der Erlangung unterliegt (§ 3 Abs. 1 Nr. 2 GeschGehG).
  sources:
  - https://www.gesetze-im-internet.de/geschgehg/
- id: trade-secrets-directive
  type: Regulation
  name_en: Trade Secrets Directive (EU) 2016/943
  name_de: Geschäftsgeheimnis-Richtlinie (EU) 2016/943
  aliases:
  - Directive (EU) 2016/943
  summary_en: Directive (EU) 2016/943 of 8 June 2016 protects undisclosed know-how and business information (trade secrets) against their unlawful acquisition, use and disclosure (Art. 1(1)). Member States may provide more far-reaching protection as long as certain provisions are respected; in Germany it was transposed by the Trade Secrets Act (GeschGehG).
  summary_de: Die Richtlinie (EU) 2016/943 vom 8. Juni 2016 schützt vertrauliches Know-how und vertrauliche Geschäftsinformationen (Geschäftsgeheimnisse) vor rechtswidrigem Erwerb sowie rechtswidriger Nutzung und Offenlegung (Art. 1 Abs. 1). Die Mitgliedstaaten können einen weitergehenden Schutz vorsehen, sofern bestimmte Vorschriften gewahrt bleiben; in Deutschland wurde sie durch das Geschäftsgeheimnisgesetz (GeschGehG) umgesetzt.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016L0943
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016L0943
- id: uwg
  type: Regulation
  name_en: Act against Unfair Competition (UWG)
  name_de: Gesetz gegen den unlauteren Wettbewerb (UWG)
  aliases:
  - UWG
  summary_en: The German Act against Unfair Competition (Gesetz gegen den unlauteren Wettbewerb, UWG) protects competitors, consumers and other market participants against unfair commercial practices and, at the same time, the public interest in undistorted competition (§ 1 UWG). Special rules on particular aspects of unfair practices take precedence; according to its official notes, the Act transposes, among others, Directive 2005/29/EC on unfair commercial practices.
  summary_de: Das Gesetz gegen den unlauteren Wettbewerb (UWG) dient dem Schutz der Mitbewerber, der Verbraucher sowie der sonstigen Marktteilnehmer vor unlauteren geschäftlichen Handlungen und schützt zugleich das Interesse der Allgemeinheit an einem unverfälschten Wettbewerb (§ 1 UWG). Vorschriften zu besonderen Aspekten unlauterer Handlungen gehen vor; nach den amtlichen Hinweisen setzt das Gesetz unter anderem die Richtlinie 2005/29/EG über unlautere Geschäftspraktiken um.
  sources:
  - https://www.gesetze-im-internet.de/uwg_2004/
- id: intrinsic-dimension
  type: Concept
  name_en: Intrinsic dimension
  name_de: Intrinsische Dimension
  summary_en: The intrinsic dimension of a fine-tuning problem is the size of the smallest low-dimensional reparameterisation that is as effective as the full parameter space (Aghajanyan et al., 2020). Pre-trained language models have a very low intrinsic dimension; for example, optimising only 200 parameters projected into the full space reached 90% of full performance with RoBERTa on MRPC.
  summary_de: Die intrinsische Dimension eines Fine-Tuning-Problems ist die Größe der kleinsten niedrigdimensionalen Umparametrisierung, die so wirksam ist wie der volle Parameterraum (Aghajanyan et al., 2020). Vortrainierte Sprachmodelle haben eine sehr niedrige intrinsische Dimension; etwa erreichte die Optimierung von nur 200 in den vollen Raum projizierten Parametern mit RoBERTa auf MRPC 90 % der vollen Leistung.
  sources:
  - https://arxiv.org/abs/2012.13255
- id: weight-decomposed-low-rank-adaptation
  type: Method
  name_en: DoRA (Weight-Decomposed Low-Rank Adaptation)
  name_de: DoRA (Weight-Decomposed Low-Rank Adaptation)
  aliases:
  - DoRA
  summary_en: Weight-Decomposed Low-Rank Adaptation (DoRA) splits each pre-trained weight into a magnitude and a direction and fine-tunes the direction with LoRA, which brings learning capacity and stability closer to full fine-tuning without extra inference cost (Liu et al., 2024). It consistently outperformed LoRA when fine-tuning LLaMA, LLaVA and VL-BART on tasks such as commonsense reasoning and visual instruction tuning.
  summary_de: Weight-Decomposed Low-Rank Adaptation (DoRA) zerlegt jedes vortrainierte Gewicht in Betrag und Richtung und passt die Richtung mit LoRA an; das bringt Lernfähigkeit und Stabilität näher an vollständiges Fine-Tuning, ohne zusätzliche Inferenzkosten (Liu et al., 2024). Beim Fine-Tuning von LLaMA, LLaVA und VL-BART, etwa für Common-Sense-Schlussfolgern und visuelles Instruction Tuning, übertraf es LoRA durchgängig.
  sources:
  - https://arxiv.org/abs/2402.09353
- id: adapter-layers
  type: Method
  name_en: Adapter layers
  name_de: Adapter-Layer
  summary_en: Adapter layers are small trainable modules inserted into a pre-trained network while the original parameters stay fixed, so each new task adds only a few parameters and tasks can be added without revisiting earlier ones (Houlsby et al., 2019). Transferring BERT to 26 text classification tasks, adapters came within 0.4% of full fine-tuning on GLUE while adding only 3.6% parameters per task.
  summary_de: Adapter-Schichten sind kleine trainierbare Module, die in ein vortrainiertes Netz eingefügt werden, während dessen Parameter fest bleiben; jede neue Aufgabe fügt so nur wenige Parameter hinzu, und Aufgaben lassen sich ergänzen, ohne frühere erneut anzufassen (Houlsby et al., 2019). Beim Transfer von BERT auf 26 Textklassifikationsaufgaben lagen Adapter auf GLUE nur 0,4 % hinter vollständigem Fine-Tuning, bei nur 3,6 % zusätzlichen Parametern je Aufgabe.
  sources:
  - https://arxiv.org/abs/1902.00751
- id: t5
  type: Method
  name_en: T5
  name_de: T5
  summary_en: T5 (Text-to-Text Transfer Transformer) treats every text-based language problem in a unified text-to-text format and was used for a systematic comparison of pre-training objectives, architectures, unlabelled datasets and transfer approaches (Raffel et al., 2019). Combined with scale and the new Colossal Clean Crawled Corpus (C4), it reached state-of-the-art results on benchmarks for summarisation, question answering and text classification.
  summary_de: T5 (Text-to-Text Transfer Transformer) behandelt jede textbasierte Sprachaufgabe in einem einheitlichen Text-zu-Text-Format und diente einem systematischen Vergleich von Vortrainingszielen, Architekturen, nicht annotierten Datensätzen und Transferverfahren (Raffel et al., 2019). Zusammen mit Skalierung und dem neuen Colossal Clean Crawled Corpus (C4) erreichte es Bestwerte auf Benchmarks für Zusammenfassung, Fragebeantwortung und Textklassifikation.
  sources:
  - https://arxiv.org/abs/1910.10683
- id: masked-language-modelling
  type: Method
  name_en: Masked language modelling
  name_de: Masked Language Modelling
  summary_en: Masked language modelling is a pre-training objective in which some input tokens are masked at random and the model predicts the original tokens from their left and right context, inspired by the Cloze task (Devlin et al. 2019). BERT selects 15% of the token positions; of these, 80% are replaced by a [MASK] token, 10% by a random token and 10% stay unchanged, to reduce the mismatch with fine-tuning, where [MASK] does not occur.
  summary_de: Masked Language Modelling ist ein Vortrainingsziel, bei dem zufällig einige Eingabetokens maskiert werden und das Modell die ursprünglichen Tokens aus ihrem linken und rechten Kontext vorhersagt, angelehnt an den Cloze-Test (Devlin et al. 2019). BERT wählt 15 % der Tokenpositionen aus; davon werden 80 % durch ein [MASK]-Token, 10 % durch ein zufälliges Token ersetzt und 10 % bleiben unverändert, um den Unterschied zum Fine-Tuning zu verringern, in dem [MASK] nicht vorkommt.
  sources:
  - https://arxiv.org/abs/1810.04805
- id: flashattention
  type: Method
  name_en: FlashAttention
  name_de: FlashAttention
  summary_en: FlashAttention is an IO-aware exact attention algorithm that uses tiling to reduce reads and writes between GPU high-bandwidth memory and on-chip SRAM (Dao et al., 2022). It sped up training, for example threefold for GPT-2 with sequence length 1K, and enabled longer contexts, including the first Transformers to beat chance on the Path-X challenge with 16K tokens.
  summary_de: FlashAttention ist ein exakter Attention-Algorithmus, der Speicherzugriffe berücksichtigt und mit Kachelung die Lese- und Schreibvorgänge zwischen dem Hauptspeicher der GPU (HBM) und dem SRAM auf dem Chip verringert (Dao et al., 2022). Es beschleunigte das Training, etwa um das Dreifache für GPT-2 mit Sequenzlänge 1K, und ermöglichte längere Kontexte, darunter die ersten Transformer, die bei der Path-X-Aufgabe mit 16K Tokens über dem Zufall lagen.
  sources:
  - https://arxiv.org/abs/2205.14135
- id: id3
  type: Method
  name_en: ID3
  name_de: ID3
  summary_en: ID3 (Iterative Dichotomiser 3), developed by Ross Quinlan in 1986, builds a multiway decision tree by greedily choosing, at each node, the categorical feature with the largest information gain (scikit-learn developers, n.d.-a). Trees are grown to maximum size and then usually pruned; its successor C4.5 also handles numerical features by discretising them.
  summary_de: ID3 (Iterative Dichotomiser 3), 1986 von Ross Quinlan entwickelt, baut einen Entscheidungsbaum mit Mehrfachverzweigungen, indem es an jedem Knoten gierig das kategoriale Merkmal mit dem größten Informationsgewinn wählt (scikit-learn developers, n.d.-a). Bäume wachsen bis zur maximalen Größe und werden meist anschließend beschnitten; der Nachfolger C4.5 verarbeitet durch Diskretisierung auch numerische Merkmale.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: cart
  type: Method
  name_en: CART
  name_de: CART
  summary_en: CART (Classification and Regression Trees) builds binary decision trees by choosing at each node the feature and threshold with the largest information gain; unlike C4.5 it supports numerical targets for regression and does not compute rule sets (scikit-learn developers, n.d.-a). scikit-learn implements an optimised version of CART.
  summary_de: CART (Classification and Regression Trees) baut binäre Entscheidungsbäume, indem an jedem Knoten das Merkmal und der Schwellenwert mit dem größten Informationsgewinn gewählt werden; anders als C4.5 unterstützt es numerische Zielgrößen für Regression und erzeugt keine Regelmengen (scikit-learn developers, n.d.-a). scikit-learn setzt eine optimierte Fassung von CART um.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: cost-complexity-pruning
  type: Method
  name_en: Cost-complexity pruning
  name_de: Cost-Complexity Pruning
  summary_en: Minimal cost-complexity pruning prunes a decision tree to avoid overfitting by finding the subtree that minimises R(T) + α·|leaves|, the tree's error or impurity plus a penalty per terminal node controlled by the complexity parameter α ≥ 0 (scikit-learn developers, n.d.-a). Larger α removes more branches; in scikit-learn it is set with ccp_alpha.
  summary_de: Minimal Cost-Complexity Pruning beschneidet einen Entscheidungsbaum gegen Overfitting, indem es den Teilbaum sucht, der R(T) + α·|Blätter| minimiert, also Fehler oder Unreinheit des Baums plus eine Strafe je Endknoten, gesteuert durch den Komplexitätsparameter α ≥ 0 (scikit-learn developers, n.d.-a). Ein größeres α entfernt mehr Äste; in scikit-learn wird es über ccp_alpha gesetzt.
  sources:
  - https://scikit-learn.org/stable/modules/tree.html
- id: fitnets
  type: Method
  name_en: FitNets
  name_de: FitNets
  summary_en: FitNets extend knowledge distillation so that a student network deeper and thinner than its teacher learns not only from the teacher's outputs but also from its intermediate representations, used as "hints" (Romero et al., 2014). On CIFAR-10, a deep student with about 10.4 times fewer parameters outperformed a larger state-of-the-art teacher.
  summary_de: FitNets erweitern Knowledge Distillation, sodass ein Schülernetz, das tiefer und schmaler ist als sein Lehrer, nicht nur von dessen Ausgaben, sondern auch von seinen Zwischenrepräsentationen als „Hinweisen“ lernt (Romero et al., 2014). Auf CIFAR-10 übertraf ein tiefer Schüler mit rund 10,4-mal weniger Parametern einen größeren Lehrer auf dem damaligen Stand der Technik.
  sources:
  - https://arxiv.org/abs/1412.6550
- id: tinybert
  type: Method
  name_en: TinyBERT
  name_de: TinyBERT
  summary_en: TinyBERT uses a Transformer distillation method applied in both pre-training and task-specific learning to transfer knowledge from a large BERT teacher to a small student (Jiao et al., 2019). With 4 layers it reached more than 96.8% of BERT-base's performance on GLUE while being 7.5 times smaller and 9.4 times faster at inference.
  summary_de: TinyBERT nutzt ein Destillationsverfahren für Transformer, das sowohl im Vortraining als auch beim aufgabenspezifischen Lernen angewendet wird, um Wissen von einem großen BERT-Lehrer auf einen kleinen Schüler zu übertragen (Jiao et al., 2019). Mit 4 Schichten erreichte es über 96,8 % der Leistung von BERT-base auf GLUE, bei 7,5-mal kleinerer Größe und 9,4-mal schnellerer Inferenz.
  sources:
  - https://arxiv.org/abs/1909.10351
- id: g-eval
  type: Method
  name_en: G-Eval
  name_de: G-Eval
  summary_en: G-Eval evaluates generated text with an LLM using chain-of-thought and a form-filling paradigm (Liu et al., 2023). With GPT-4 as backbone it reached a Spearman correlation of 0.514 with human judgements on summarisation, well above earlier metrics, and its authors noted a possible bias of LLM evaluators towards LLM-generated text.
  summary_de: G-Eval bewertet erzeugte Texte mit einem LLM, das Chain-of-Thought und ein Formular-Ausfüll-Schema nutzt (Liu et al., 2023). Mit GPT-4 als Grundlage erreichte es bei Zusammenfassungen eine Spearman-Korrelation von 0,514 mit menschlichen Urteilen, deutlich über früheren Metriken, und die Autoren wiesen auf eine mögliche Bevorzugung LLM-erzeugter Texte durch LLM-Bewerter hin.
  sources:
  - https://arxiv.org/abs/2303.16634
- id: prometheus
  type: Method
  name_en: Prometheus (evaluator model)
  name_de: Prometheus (Evaluator-Modell)
  aliases:
  - Prometheus
  summary_en: Prometheus is an open-source 13B evaluator LLM trained on the Feedback Collection of 1,000 score rubrics, 20,000 instructions and 100,000 GPT-4 responses with feedback; it grades long-form text against a user-provided rubric (Kim et al., 2023). With reference answers and rubrics it reached a Pearson correlation of 0.897 with human evaluators, on par with GPT-4 (0.882).
  summary_de: Prometheus ist ein offenes Bewertungs-LLM mit 13 Milliarden Parametern, trainiert auf der Feedback Collection aus 1 000 Bewertungsrastern, 20 000 Anweisungen und 100 000 Antworten mit Feedback von GPT-4; es bewertet lange Texte anhand eines vorgegebenen Rasters (Kim et al., 2023). Mit Referenzantworten und Rastern erreichte es eine Pearson-Korrelation von 0,897 mit menschlichen Bewertungen, gleichauf mit GPT-4 (0,882).
  sources:
  - https://arxiv.org/abs/2310.08491
- id: ontology
  type: Concept
  name_en: Ontology
  name_de: Ontologie
- id: toolformer
  type: Method
  name_en: Toolformer
  name_de: Toolformer
  summary_en: Toolformer is a language model that teaches itself in a self-supervised way which APIs to call, when, with which arguments and how to use the results, from only a handful of demonstrations per API (Schick et al., 2023). Its tools include a calculator, a question-answering system, two search engines, a translation system and a calendar, and it improved zero-shot performance on many tasks.
  summary_de: Toolformer ist ein Sprachmodell, das sich selbstüberwacht beibringt, welche APIs es wann mit welchen Argumenten aufruft und wie es die Ergebnisse nutzt, mit nur wenigen Beispielen je API (Schick et al., 2023). Zu seinen Werkzeugen gehören ein Taschenrechner, ein Frage-Antwort-System, zwei Suchmaschinen, ein Übersetzungssystem und ein Kalender, und es verbesserte die Zero-Shot-Leistung bei vielen Aufgaben.
  sources:
  - https://arxiv.org/abs/2302.04761
- id: function-calling
  type: Method
  name_en: Function calling
  name_de: Function Calling
- id: react
  type: Method
  name_en: ReAct
  name_de: ReAct
  summary_en: 'ReAct prompts an LLM to generate reasoning traces and task-specific actions in an interleaved way: reasoning helps the model plan and handle exceptions, and actions let it query external sources such as a Wikipedia API (Yao et al., 2022). On ALFWorld and WebShop it outperformed imitation and reinforcement learning methods by 34 and 10 percentage points with only one or two in-context examples.'
  summary_de: 'ReAct lässt ein LLM abwechselnd Gedankengänge und aufgabenbezogene Aktionen erzeugen: Das Schlussfolgern hilft beim Planen und beim Umgang mit Ausnahmen, die Aktionen fragen externe Quellen wie eine Wikipedia-API ab (Yao et al., 2022). Auf ALFWorld und WebShop übertraf es Imitations- und Reinforcement-Learning-Verfahren um 34 und 10 Prozentpunkte, mit nur ein oder zwei Beispielen im Prompt.'
  sources:
  - https://arxiv.org/abs/2210.03629
- id: memgpt
  type: Method
  name_en: MemGPT
  name_de: MemGPT
  summary_en: MemGPT applies "virtual context management", inspired by hierarchical memory in operating systems, to give an LLM extended context beyond its context window by moving data between memory tiers and using interrupts to manage control flow (Packer et al., 2023). It was evaluated on analysing documents far larger than the context window and on multi-session chat agents that remember users over long interactions.
  summary_de: 'MemGPT überträgt „virtuelle Kontextverwaltung“, angelehnt an hierarchischen Speicher in Betriebssystemen, auf LLMs: Daten werden zwischen Speicherebenen verschoben und Interrupts steuern den Ablauf, sodass das Modell über sein Kontextfenster hinaus arbeiten kann (Packer et al., 2023). Evaluiert wurde es an Dokumenten, die weit größer sind als das Kontextfenster, und an Chat-Agenten, die sich über viele Sitzungen an Nutzende erinnern.'
  sources:
  - https://arxiv.org/abs/2310.08560
- id: reflexion
  type: Method
  name_en: Reflexion
  name_de: Reflexion
  summary_en: 'Reflexion reinforces language agents through linguistic feedback instead of weight updates: agents reflect verbally on task feedback and keep these reflections in an episodic memory to decide better in later trials (Shinn et al., 2023). It reached 91% pass@1 on the HumanEval coding benchmark, against 80% for GPT-4 at the time.'
  summary_de: 'Reflexion verbessert Sprach-Agenten über sprachliches Feedback statt über Gewichtsanpassungen: Agenten reflektieren schriftlich über Rückmeldungen zur Aufgabe und halten diese Reflexionen in einem episodischen Gedächtnis fest, um in späteren Versuchen besser zu entscheiden (Shinn et al., 2023). Auf dem Programmier-Benchmark HumanEval erreichte es 91 % pass@1, GPT-4 damals 80 %.'
  sources:
  - https://arxiv.org/abs/2303.11366
- id: json-rpc
  type: Technology
  name_en: JSON-RPC
  name_de: JSON-RPC
  summary_en: JSON-RPC is a stateless, lightweight remote procedure call protocol that uses JSON as its data format (JSON-RPC Working Group, 2010). Version 2.0 defines data structures for requests, responses and notifications and their processing rules, and is transport-agnostic, usable in-process, over sockets, over HTTP or other message passing environments.
  summary_de: JSON-RPC ist ein zustandsloses, leichtgewichtiges Protokoll für entfernte Prozeduraufrufe, das JSON als Datenformat nutzt (JSON-RPC Working Group, 2010). Version 2.0 legt Datenstrukturen für Anfragen, Antworten und Benachrichtigungen samt Verarbeitungsregeln fest und ist unabhängig vom Transport, also im selben Prozess, über Sockets, über HTTP oder andere Nachrichtenwege nutzbar.
  sources:
  - https://www.jsonrpc.org/specification
- id: language-server-protocol
  type: Technology
  name_en: Language Server Protocol (LSP)
  name_de: Language Server Protocol (LSP)
  aliases:
  - LSP
  summary_en: The Language Server Protocol (LSP) standardises how editors and IDEs communicate with language servers that provide features such as auto-completion, go to definition and find all references (Microsoft, n.d.). One language server can thus be reused in many development tools, instead of reimplementing language support for each tool.
  summary_de: Das Language Server Protocol (LSP) standardisiert, wie Editoren und IDEs mit Language Servern kommunizieren, die Funktionen wie Autovervollständigung, Sprung zur Definition und Suche aller Verweise bereitstellen (Microsoft, n.d.). So lässt sich ein Language Server in vielen Entwicklungswerkzeugen wiederverwenden, statt die Sprachunterstützung für jedes Werkzeug neu zu bauen.
  sources:
  - https://microsoft.github.io/language-server-protocol/
- id: a2a
  type: Technology
  name_en: A2A (Agent2Agent protocol)
  name_de: A2A (Agent2Agent-Protokoll)
  aliases:
  - Agent2Agent
  summary_en: The Agent2Agent (A2A) Protocol is an open standard for communication and collaboration between AI agents built with different frameworks and by different vendors (A2A Project, n.d.). Agents can delegate sub-tasks, exchange information and coordinate actions without sharing internal memory, tools or proprietary logic; the project is hosted by the Linux Foundation and complements MCP, which connects agents to tools.
  summary_de: Das Agent2Agent-Protokoll (A2A) ist ein offener Standard für Kommunikation und Zusammenarbeit zwischen KI-Agenten, die mit unterschiedlichen Frameworks und von verschiedenen Anbietern gebaut wurden (A2A Project, n.d.). Agenten können Teilaufgaben delegieren, Informationen austauschen und Handlungen abstimmen, ohne internen Speicher, Werkzeuge oder eigene Logik offenzulegen; das Projekt ist bei der Linux Foundation angesiedelt und ergänzt MCP, das Agenten mit Werkzeugen verbindet.
  sources:
  - https://a2a-protocol.org/latest/
- id: openapi
  type: Technology
  name_en: OpenAPI
  name_de: OpenAPI
  summary_en: The OpenAPI Specification defines a standard, programming language-agnostic interface description for HTTP APIs, so that humans and computers can discover and understand a service's capabilities without access to source code, extra documentation or network inspection (OpenAPI Initiative, n.d.). A consumer of a properly described API can interact with it with minimal implementation logic.
  summary_de: Die OpenAPI Specification legt eine standardisierte, von Programmiersprachen unabhängige Schnittstellenbeschreibung für HTTP-APIs fest, damit Menschen und Computer die Fähigkeiten eines Dienstes erkennen und verstehen können, ohne Zugriff auf Quellcode, zusätzliche Dokumentation oder Mitschnitte des Netzwerkverkehrs (OpenAPI Initiative, n.d.). Wer eine sauber beschriebene API nutzt, kommt mit minimaler eigener Implementierungslogik aus.
  sources:
  - https://spec.openapis.org/oas/latest.html
- id: lime
  type: Method
  name_en: LIME
  name_de: LIME
  summary_en: LIME explains the predictions of any classifier by learning an interpretable model locally around a prediction (Ribeiro et al., 2016). Its authors also proposed selecting representative predictions with explanations to explain a whole model and showed in experiments with human subjects that explanations help decide whether to trust a prediction or a model.
  summary_de: LIME erklärt die Vorhersagen beliebiger Klassifikatoren, indem es lokal um eine Vorhersage ein interpretierbares Modell lernt (Ribeiro et al., 2016). Die Autoren schlugen außerdem vor, repräsentative Vorhersagen mit Erklärungen auszuwählen, um ein ganzes Modell zu erklären, und zeigten in Experimenten mit Menschen, dass Erklärungen bei der Entscheidung helfen, ob einer Vorhersage oder einem Modell zu trauen ist.
  sources:
  - https://arxiv.org/abs/1602.04938
- id: shap
  type: Method
  name_en: SHAP
  name_de: SHAP
  summary_en: SHAP (SHapley Additive exPlanations) assigns each feature an importance value for a particular prediction (Lundberg & Lee, 2017). It defines a class of additive feature importance measures with a unique solution that has desirable properties, unifies six existing explanation methods and led to new estimation methods that are faster or more consistent with human intuition.
  summary_de: SHAP (SHapley Additive exPlanations) weist jedem Merkmal für eine bestimmte Vorhersage einen Wichtigkeitswert zu (Lundberg & Lee, 2017). Es definiert eine Klasse additiver Wichtigkeitsmaße mit einer eindeutigen Lösung mit wünschenswerten Eigenschaften, vereint sechs bestehende Erklärungsverfahren und führte zu neuen Schätzverfahren, die schneller sind oder besser mit menschlicher Intuition übereinstimmen.
  sources:
  - https://arxiv.org/abs/1705.07874
- id: integrated-gradients
  type: Method
  name_en: Integrated Gradients
  name_de: Integrated Gradients
  summary_en: Integrated Gradients attributes a deep network's prediction to its input features and was designed to satisfy two axioms, sensitivity and implementation invariance, that most earlier attribution methods violate (Sundararajan et al., 2017). It needs no change to the network and only a few calls to the standard gradient operator, and was applied to image, text and chemistry models.
  summary_de: Integrated Gradients ordnet die Vorhersage eines tiefen Netzes seinen Eingabemerkmalen zu und wurde so entworfen, dass es zwei Axiome erfüllt, Sensitivität und Implementierungsinvarianz, die die meisten früheren Attributionsverfahren verletzen (Sundararajan et al., 2017). Es erfordert keine Änderung am Netz und nur wenige Aufrufe des üblichen Gradientenoperators und wurde auf Bild-, Text- und Chemiemodelle angewendet.
  sources:
  - https://arxiv.org/abs/1703.01365
- id: counterfactual-explanations
  type: Method
  name_en: Counterfactual explanations
  name_de: Kontrafaktische Erklärungen
  summary_en: Counterfactual explanations describe the smallest change to the world that would lead to a desired outcome of an automated decision, without explaining the system's internal logic (Wachter et al., 2017). The authors propose them as a way for data controllers to help people understand, contest and change decisions in the context of the GDPR.
  summary_de: Kontrafaktische Erklärungen beschreiben die kleinste Änderung der Umstände, die zu einem gewünschten Ergebnis einer automatisierten Entscheidung führen würde, ohne die innere Logik des Systems zu erklären (Wachter et al., 2017). Die Autoren schlagen sie Verantwortlichen vor, um Betroffenen im Rahmen der DSGVO zu helfen, Entscheidungen zu verstehen, anzufechten und zu ändern.
  sources:
  - https://arxiv.org/abs/1711.00399
- id: interpretable-models
  type: Concept
  name_en: Inherently interpretable models
  name_de: Inhärent interpretierbare Modelle
- id: container
  type: Concept
  name_en: Container
  name_de: Container
  summary_en: A container is an isolated process for one component of an application, such as a frontend, an API or a database, that runs in its own environment, isolated from everything else on the machine (Docker Inc., n.d.-e). Containers solve problems such as keeping runtime versions consistent across developers, CI/CD and production; they are started from container images.
  summary_de: Ein Container ist ein isolierter Prozess für eine Komponente einer Anwendung, etwa ein Frontend, eine API oder eine Datenbank, der in einer eigenen Umgebung läuft, abgeschottet von allem anderen auf dem Rechner (Docker Inc., n.d.-e). Container lösen Probleme wie einheitliche Laufzeitversionen bei allen Entwicklerinnen und Entwicklern, in CI/CD und in Produktion; sie werden aus Container-Images gestartet.
  sources:
  - https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-a-container/
- id: container-image
  type: Concept
  name_en: Container image
  name_de: Container-Image
  aliases:
  - Image
  - Docker image
  summary_en: A container image is a standardised package of all the files, binaries, libraries and configuration needed to run a container (Docker Inc., n.d.-d). Images are immutable, so changes produce a new image, and they are composed of layers, each a set of file system changes, which lets new images extend existing ones, for example an application image built on a Python base image.
  summary_de: Ein Container-Image ist ein standardisiertes Paket mit allen Dateien, Programmen, Bibliotheken und Konfigurationen, die zum Ausführen eines Containers nötig sind (Docker Inc., n.d.-d). Images sind unveränderlich, Änderungen ergeben also ein neues Image, und sie bestehen aus Schichten, jeweils einer Menge von Dateisystemänderungen; so können neue Images bestehende erweitern, etwa ein Anwendungs-Image auf Basis eines Python-Images.
  sources:
  - https://docs.docker.com/get-started/docker-concepts/the-basics/what-is-an-image/
- id: dockerfile
  type: Technology
  name_en: Dockerfile
  name_de: Dockerfile
  summary_en: A Dockerfile is a text document with the commands a user could run on the command line to assemble a container image; Docker builds images automatically by reading these instructions (Docker Inc., n.d.-a). Instructions include FROM to start a build stage from a base image, RUN to execute build commands, COPY and ADD to add files, ENV for environment variables and CMD or ENTRYPOINT for the default command.
  summary_de: Ein Dockerfile ist ein Textdokument mit den Befehlen, die man auf der Kommandozeile ausführen könnte, um ein Container-Image zusammenzustellen; Docker baut Images automatisch, indem es diese Anweisungen liest (Docker Inc., n.d.-a). Zu den Anweisungen gehören FROM, um eine Build-Stufe von einem Basis-Image aus zu beginnen, RUN für Build-Befehle, COPY und ADD zum Hinzufügen von Dateien, ENV für Umgebungsvariablen und CMD oder ENTRYPOINT für den Standardbefehl.
  sources:
  - https://docs.docker.com/reference/dockerfile/
- id: docker-volume
  type: Concept
  name_en: Docker volume
  name_de: Docker-Volume
  summary_en: Docker volumes are persistent data stores for containers, created and managed by Docker and stored in a directory on the Docker host that is mounted into the container (Docker Inc., n.d.-c). Unlike bind mounts, they do not depend on the host's directory structure and operating system, and they are the preferred mechanism for persisting data that containers generate and use.
  summary_de: Docker-Volumes sind dauerhafte Datenspeicher für Container, die Docker anlegt und verwaltet und in einem Verzeichnis auf dem Docker-Host ablegt, das in den Container eingebunden wird (Docker Inc., n.d.-c). Anders als Bind Mounts hängen sie nicht von Verzeichnisstruktur und Betriebssystem des Hosts ab und sind der bevorzugte Weg, Daten zu speichern, die Container erzeugen und nutzen.
  sources:
  - https://docs.docker.com/engine/storage/volumes/
- id: docker-compose
  type: Technology
  name_en: Docker Compose
  name_de: Docker Compose
  summary_en: 'Docker Compose is a tool for defining and running multi-container applications: services, networks and volumes are described in a single YAML file and started with one command (Docker Inc., n.d.-b). Compose works in production, staging, development, testing and CI and manages the application''s lifecycle, from starting, stopping and rebuilding services to viewing their status and logs.'
  summary_de: 'Docker Compose ist ein Werkzeug, um Anwendungen aus mehreren Containern festzulegen und auszuführen: Dienste, Netzwerke und Volumes werden in einer einzigen YAML-Datei beschrieben und mit einem Befehl gestartet (Docker Inc., n.d.-b). Compose funktioniert in Produktion, Staging, Entwicklung, Test und CI und verwaltet den Lebenszyklus der Anwendung, vom Starten, Stoppen und Neubauen von Diensten bis zur Anzeige von Status und Logs.'
  sources:
  - https://docs.docker.com/compose/
- id: basel-committee
  type: Organisation
  name_en: Basel Committee on Banking Supervision
  name_de: Basler Ausschuss für Bankenaufsicht
  aliases:
  - Basel Committee
  - BCBS
  summary_en: The Basel Committee on Banking Supervision (BCBS) is the primary global standard setter for the prudential regulation of banks and a forum for cooperation on banking supervisory matters (BIS). Its 45 members are central banks and bank supervisors from 28 jurisdictions; it exchanges information on risks to the global financial system and establishes global standards and guidelines for the regulation and supervision of banks.
  summary_de: Der Basler Ausschuss für Bankenaufsicht (BCBS) ist der wichtigste globale Standardsetzer für die Bankenaufsichtsregulierung und ein Forum für die Zusammenarbeit in Fragen der Bankenaufsicht (BIZ). Seine 45 Mitglieder sind Zentralbanken und Bankenaufseher aus 28 Rechtsräumen; er tauscht Informationen über Risiken für das globale Finanzsystem aus und legt globale Standards und Leitlinien für die Regulierung und Beaufsichtigung von Banken fest.
  sources:
  - https://www.bis.org/bcbs/
- id: risk-data-aggregation
  type: Concept
  name_en: Risk data aggregation and risk reporting (RDARR)
  name_de: Risikodatenaggregation und Risikoberichterstattung (RDARR)
  aliases:
  - RDARR
  summary_en: Risk data aggregation and risk reporting (RDARR) is the ability of banks to aggregate risk data quickly and accurately and report it to decision-makers; the Basel Committee set out 14 principles for it in BCBS 239 (January 2013), covering governance and IT infrastructure, risk data aggregation capabilities, risk reporting practices and supervisory review. The ECB guide of May 2024 sets out the ECB's supervisory expectations for the banks it supervises directly and uses the BCBS 239 principles as a benchmark (ECB 2024).
  summary_de: Risikodatenaggregation und Risikoberichterstattung (RDARR) bezeichnet die Fähigkeit von Banken, Risikodaten schnell und genau zusammenzuführen und an Entscheidungsträger zu berichten; der Basler Ausschuss hat dafür in BCBS 239 (Januar 2013) 14 Grundsätze festgelegt, die Governance und IT-Infrastruktur, Fähigkeiten zur Risikodatenaggregation, Risikoberichterstattung und aufsichtliche Überprüfung abdecken. Der EZB-Leitfaden vom Mai 2024 legt die aufsichtlichen Erwartungen der EZB an die direkt beaufsichtigten Banken fest und nutzt die BCBS-239-Grundsätze als Maßstab (EZB 2024).
  sources:
  - https://www.bis.org/publ/bcbs239.htm
  - https://www.bankingsupervision.europa.eu/ecb/pub/pdf/ssm.supervisory_guides240503_riskreporting.en.pdf
- id: secrecy-of-telecommunications
  type: Concept
  name_en: Secrecy of telecommunications
  name_de: Fernmeldegeheimnis
  summary_en: The secrecy of telecommunications (Fernmeldegeheimnis) covers the content of telecommunications and its specific circumstances, in particular whether someone is or was involved in a telecommunications process, including unsuccessful connection attempts (§ 3(1) TDDDG). Providers of publicly available and of commercially offered telecommunications services, and persons involved in providing them, are bound by it (§ 3(2) TDDDG).
  summary_de: Dem Fernmeldegeheimnis unterliegen der Inhalt der Telekommunikation und ihre näheren Umstände, insbesondere die Tatsache, ob jemand an einem Telekommunikationsvorgang beteiligt ist oder war, auch bei erfolglosen Verbindungsversuchen (§ 3 Abs. 1 TDDDG). Zu seiner Wahrung verpflichtet sind unter anderem Anbieter öffentlich zugänglicher und geschäftsmäßig angebotener Telekommunikationsdienste und die an deren Erbringung mitwirkenden Personen (§ 3 Abs. 2 TDDDG).
  sources:
  - https://www.gesetze-im-internet.de/ttdsg/
- id: cookie-consent
  type: Concept
  name_en: Consent for cookies and device access
  name_de: Einwilligung für Cookies und Endgerätezugriff
  summary_en: Storing information in, or accessing information already stored in, an end user's terminal equipment, for example through cookies, is only permitted if the end user has consented on the basis of clear and comprehensive information, given in accordance with the GDPR (§ 25(1) TDDDG, implementing Art. 5(3) ePrivacy Directive). No consent is needed where storage or access is solely for transmitting a message or strictly necessary to provide a service the user has expressly requested (§ 25(2) TDDDG).
  summary_de: Die Speicherung von Informationen in der Endeinrichtung des Endnutzers oder der Zugriff auf dort gespeicherte Informationen, etwa über Cookies, ist nur zulässig, wenn der Endnutzer auf Grundlage klarer und umfassender Informationen eingewilligt hat; Information und Einwilligung richten sich nach der DSGVO (§ 25 Abs. 1 TDDDG, Umsetzung von Art. 5 Abs. 3 ePrivacy-Richtlinie). Keine Einwilligung ist nötig, wenn Speicherung oder Zugriff allein der Übertragung einer Nachricht dienen oder unbedingt erforderlich sind, um einen ausdrücklich gewünschten Dienst bereitzustellen (§ 25 Abs. 2 TDDDG).
  sources:
  - https://www.gesetze-im-internet.de/ttdsg/
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02002L0058-20091219
- id: bfdi
  type: Organisation
  name_en: Federal Commissioner for Data Protection and Freedom of Information (BfDI)
  name_de: Bundesbeauftragte für den Datenschutz und die Informationsfreiheit (BfDI)
  aliases:
  - BfDI
  summary_en: The Federal Commissioner for Data Protection and Freedom of Information (Bundesbeauftragte für den Datenschutz und die Informationsfreiheit, BfDI) is a supreme federal authority with its seat in Bonn (§ 8(1) BDSG).
  summary_de: Die oder der Bundesbeauftragte für den Datenschutz und die Informationsfreiheit (BfDI) ist eine oberste Bundesbehörde mit Dienstsitz in Bonn (§ 8 Abs. 1 BDSG).
  sources:
  - https://www.gesetze-im-internet.de/bdsg_2018/
- id: digitale-dienste-gesetz
  type: Regulation
  name_en: Digital Services Act implementation law (Digitale-Dienste-Gesetz, DDG)
  name_de: Digitale-Dienste-Gesetz (DDG)
  aliases:
  - DDG
  summary_en: The Digitale-Dienste-Gesetz (DDG) of 6 May 2024 contains, among other things, the German rules implementing the Digital Services Act. The Federal Network Agency (Bundesnetzagentur) is the competent authority under Article 49(1) of Regulation (EU) 2022/2065, with special competences for the Federal Agency for Child and Youth Media Protection (§ 12 DDG); according to its official notes, the Act also transposes the E-Commerce Directive 2000/31/EC.
  summary_de: Das Digitale-Dienste-Gesetz (DDG) vom 6. Mai 2024 enthält unter anderem die deutschen Durchführungsvorschriften zum Gesetz über digitale Dienste. Zuständige Behörde nach Artikel 49 Absatz 1 der Verordnung (EU) 2022/2065 ist die Bundesnetzagentur, mit besonderen Zuständigkeiten der Bundeszentrale für Kinder- und Jugendmedienschutz (§ 12 DDG); nach den amtlichen Hinweisen setzt das Gesetz außerdem die E-Commerce-Richtlinie 2000/31/EG um.
  sources:
  - https://www.gesetze-im-internet.de/ddg/
- id: e-evidence-regulation
  type: Regulation
  name_en: Regulation (EU) 2023/1543 on European production and preservation orders
  name_de: Verordnung (EU) 2023/1543 über Europäische Herausgabe- und Sicherungsanordnungen
  aliases:
  - Regulation (EU) 2023/1543
  summary_en: Regulation (EU) 2023/1543 lays down rules under which an authority of a Member State, in criminal proceedings, may issue a European Production Order or a European Preservation Order requiring a service provider offering services in the Union and established or represented in another Member State to produce or preserve electronic evidence, regardless of where the data are located (Art. 1(1)).
  summary_de: Die Verordnung (EU) 2023/1543 legt fest, nach welchen Regeln eine Behörde eines Mitgliedstaats im Strafverfahren eine Europäische Herausgabeanordnung oder Europäische Sicherungsanordnung erlassen und damit von einem Diensteanbieter, der in der Union Dienste anbietet und in einem anderen Mitgliedstaat niedergelassen oder vertreten ist, verlangen kann, elektronische Beweismittel herauszugeben oder zu sichern, unabhängig davon, wo sich die Daten befinden (Art. 1 Abs. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R1543
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R1543
- id: einwilligungsverwaltungsverordnung
  type: Regulation
  name_en: Ordinance on recognised consent management services (Einwilligungsverwaltungsverordnung)
  name_de: Einwilligungsverwaltungsverordnung (EinwV)
  summary_en: The Einwilligungsverwaltungsverordnung (EinwV), in force since 1 April 2025, is a German ordinance under the Telecommunications Digital Services Data Protection Act (TDDDG) on services for managing consent (§ 1 EinwV). It sets the requirements such services must meet to be recognised, the recognition procedure by an independent body, and technical and organisational measures for providers of digital services and browser software so that users' settings are respected.
  summary_de: Die Einwilligungsverwaltungsverordnung (EinwV), seit 1. April 2025 in Kraft, ist eine Verordnung nach dem Telekommunikation-Digitale-Dienste-Datenschutz-Gesetz (TDDDG) über Dienste zur Einwilligungsverwaltung (§ 1 EinwV). Sie regelt die Anforderungen an deren Anerkennung, das Anerkennungsverfahren durch eine unabhängige Stelle sowie technische und organisatorische Maßnahmen von Anbietern digitaler Dienste und von Browser-Software, damit die Einstellungen der Nutzer beachtet werden.
  sources:
  - https://www.gesetze-im-internet.de/einwv/
- id: claude-code
  type: Technology
  name_en: Claude Code
  name_de: Claude Code
  summary_en: Claude Code is Anthropic's AI coding assistant that builds features, fixes bugs and automates development tasks, working across the files and tools of a codebase (Claude Code documentation). It runs in the terminal, in IDE extensions, as a desktop app and on the web.
  summary_de: Claude Code ist der KI-Programmierassistent von Anthropic, der Funktionen umsetzt, Fehler behebt und Entwicklungsaufgaben automatisiert und dabei über Dateien und Werkzeuge einer Codebasis hinweg arbeitet (Claude-Code-Dokumentation). Er läuft im Terminal, in IDE-Erweiterungen, als Desktop-App und im Web.
  sources:
  - https://docs.claude.com/en/docs/claude-code/overview
- id: codex
  type: Technology
  name_en: Codex
  name_de: Codex
  summary_en: Codex is OpenAI's coding agent (Codex repository). The Codex CLI runs locally on a developer's computer; Codex is also available in code editors, as a desktop app and as a cloud-based agent (Codex Web).
  summary_de: Codex ist der Programmieragent von OpenAI (Codex-Repository). Die Codex-CLI läuft lokal auf dem Rechner der Entwickler; Codex gibt es außerdem in Code-Editoren, als Desktop-App und als cloudbasierten Agenten (Codex Web).
  sources:
  - https://github.com/openai/codex
- id: product-liability-directive-2024
  type: Regulation
  name_en: Product Liability Directive (EU) 2024/2853
  name_de: Produkthaftungsrichtlinie (EU) 2024/2853
  aliases:
  - Product Liability Directive (2024)
  summary_en: Directive (EU) 2024/2853 of 23 October 2024 lays down common rules on the liability of economic operators for damage suffered by natural persons caused by defective products and on compensation for such damage, aiming at a functioning internal market and a high level of consumer protection (Art. 1). It repeals Council Directive 85/374/EEC.
  summary_de: Die Richtlinie (EU) 2024/2853 vom 23. Oktober 2024 legt gemeinsame Vorschriften über die Haftung von Wirtschaftsakteuren für Schäden fest, die natürlichen Personen durch fehlerhafte Produkte entstanden sind, und über deren Ersatz, mit dem Ziel eines funktionierenden Binnenmarkts und eines hohen Verbraucherschutzniveaus (Art. 1). Sie hebt die Richtlinie 85/374/EWG des Rates auf.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024L2853
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024L2853
- id: product-liability-directive-1985
  type: Regulation
  name_en: Product Liability Directive 85/374/EEC
  name_de: Produkthaftungsrichtlinie 85/374/EWG
  aliases:
  - Directive 85/374/EEC
  summary_en: Council Directive 85/374/EEC was the EU's original directive on liability for defective products. It is repealed by Directive (EU) 2024/2853, which lays down new common rules on the liability of economic operators for damage caused by defective products.
  summary_de: Die Richtlinie 85/374/EWG des Rates war die ursprüngliche EU-Richtlinie über die Haftung für fehlerhafte Produkte. Sie wird durch die Richtlinie (EU) 2024/2853 aufgehoben, die neue gemeinsame Vorschriften über die Haftung von Wirtschaftsakteuren für Schäden durch fehlerhafte Produkte festlegt.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024L2853
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024L2853
- id: ai-liability-directive-proposal
  type: Regulation
  name_en: AI Liability Directive (proposal)
  name_de: KI-Haftungsrichtlinie (Vorschlag)
  aliases:
  - AI Liability Directive
  summary_en: The AI Liability Directive was a Commission proposal of 2022, COM(2022) 496 final, procedure 2022/0303 (COD), "on adapting non-contractual civil liability rules to artificial intelligence". The Commission listed it for withdrawal in its 2025 work programme, approved the withdrawal on 16 July 2025, and the withdrawal was published in the Official Journal on 6 October 2025 (C/2025/5423).
  summary_de: Die KI-Haftungsrichtlinie war ein Vorschlag der Kommission von 2022, COM(2022) 496 final, Verfahren 2022/0303 (COD), zur Anpassung der Vorschriften über außervertragliche zivilrechtliche Haftung an künstliche Intelligenz. Die Kommission sah ihre Rücknahme im Arbeitsprogramm 2025 vor, beschloss sie am 16. Juli 2025, und die Rücknahme wurde am 6. Oktober 2025 im Amtsblatt veröffentlicht (C/2025/5423).
  sources:
  - https://data.consilium.europa.eu/doc/document/ST-13873-2025-INIT/en/pdf
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52022PC0496
- id: produkthaftungsgesetz
  type: Regulation
  name_en: Product Liability Act (ProdHaftG)
  name_de: Produkthaftungsgesetz (ProdHaftG)
  aliases:
  - ProdHaftG
  - Produkthaftungsgesetz
  summary_en: The German Product Liability Act (Produkthaftungsgesetz, ProdHaftG), in force since 1 January 1990, makes the manufacturer of a product liable for damage when a defect kills someone, injures their body or health, or damages property other than the product itself that is ordinarily intended and mainly used for private purposes (§ 1 ProdHaftG). Liability is excluded in defined cases (§ 1(2) ProdHaftG).
  summary_de: Das Produkthaftungsgesetz (ProdHaftG), seit 1. Januar 1990 in Kraft, verpflichtet den Hersteller eines Produkts zum Schadensersatz, wenn durch den Fehler des Produkts jemand getötet, sein Körper oder seine Gesundheit verletzt oder eine andere Sache als das fehlerhafte Produkt beschädigt wird, die gewöhnlich für den privaten Gebrauch bestimmt und hauptsächlich so verwendet worden ist (§ 1 ProdHaftG). In bestimmten Fällen ist die Haftung ausgeschlossen (§ 1 Abs. 2 ProdHaftG).
  sources:
  - https://www.gesetze-im-internet.de/prodhaftg/
- id: product-liability-bill-2026
  type: Regulation
  name_en: German government bill on product liability (2026)
  name_de: Regierungsentwurf zum Produkthaftungsrecht (2026)
  summary_en: The German government's bill to modernise product liability law (Bundestag printed paper 21/4297 of 25 February 2026) transposes the Product Liability Directive (EU) 2024/2853, which must be implemented by 9 December 2026, and is to replace the Product Liability Act of 1989. Software, regardless of how it is provided or used, is to be covered, and with it AI systems; open-source software developed or supplied outside a commercial activity remains excluded.
  summary_de: Der Gesetzentwurf der Bundesregierung zur Modernisierung des Produkthaftungsrechts (Bundestagsdrucksache 21/4297 vom 25. Februar 2026) dient der Umsetzung der Produkthaftungsrichtlinie (EU) 2024/2853, die bis zum 9. Dezember 2026 umzusetzen ist, und soll das Produkthaftungsgesetz von 1989 neu fassen. Software soll unabhängig von der Art ihrer Bereitstellung oder Nutzung einbezogen werden und damit auch KI-Systeme; Open-Source-Software, die außerhalb einer Geschäftstätigkeit entwickelt oder bereitgestellt wird, bleibt ausgenommen.
  sources:
  - https://dserver.bundestag.de/btd/21/042/2104297.pdf
- id: bgb
  type: Regulation
  name_en: German Civil Code (BGB)
  name_de: Bürgerliches Gesetzbuch (BGB)
  aliases:
  - BGB
  summary_en: The German Civil Code (Bürgerliches Gesetzbuch, BGB) is Germany's central codification of private law. Provisions relevant here include the general tort rule that anyone who intentionally or negligently and unlawfully injures another's life, body, health, freedom, property or other right must compensate the damage (§ 823 BGB), and the lender's duty to assess the borrower's creditworthiness before concluding a consumer loan agreement (§ 505a BGB).
  summary_de: Das Bürgerliche Gesetzbuch (BGB) ist die zentrale Kodifikation des deutschen Privatrechts. Hier relevant sind unter anderem die allgemeine deliktische Haftung, nach der zum Schadensersatz verpflichtet ist, wer vorsätzlich oder fahrlässig das Leben, den Körper, die Gesundheit, die Freiheit, das Eigentum oder ein sonstiges Recht eines anderen widerrechtlich verletzt (§ 823 BGB), und die Pflicht des Darlehensgebers zur Kreditwürdigkeitsprüfung vor Abschluss eines Verbraucherdarlehensvertrags (§ 505a BGB).
  sources:
  - https://www.gesetze-im-internet.de/bgb/
- id: remote-procedure-call
  type: Concept
  name_en: Remote procedure call (RPC)
  name_de: Remote Procedure Call (RPC)
  aliases:
  - RPC
  summary_en: A remote procedure call (RPC) lets a program call a function on another machine or process as if it were local; a service defines the callable methods with their parameters and return types (gRPC Authors, n.d.). Examples include JSON-RPC, a stateless, lightweight, transport-agnostic RPC protocol using JSON, and gRPC, which generates client stubs from service definitions.
  summary_de: Ein entfernter Prozeduraufruf (Remote Procedure Call, RPC) erlaubt einem Programm, eine Funktion auf einem anderen Rechner oder in einem anderen Prozess aufzurufen, als wäre sie lokal; ein Dienst legt die aufrufbaren Methoden mit Parametern und Rückgabetypen fest (gRPC Authors, n.d.). Beispiele sind JSON-RPC, ein zustandsloses, leichtgewichtiges und transportunabhängiges RPC-Protokoll mit JSON, und gRPC, das aus Dienstdefinitionen Client-Stubs erzeugt.
  sources:
  - https://grpc.io/docs/what-is-grpc/introduction/
  - https://www.jsonrpc.org/specification
- id: grpc
  type: Technology
  name_en: gRPC
  name_de: gRPC
  summary_en: gRPC is a remote procedure call framework in which a client calls methods on a server on another machine as if it were a local object; a service defines the remotely callable methods with their parameters and return types, the server implements them and the client uses a stub (gRPC Authors, n.d.). gRPC can use Protocol Buffers as interface definition language and message format, and clients and servers can be written in different supported languages.
  summary_de: gRPC ist ein Framework für entfernte Prozeduraufrufe, bei dem ein Client Methoden eines Servers auf einem anderen Rechner so aufruft, als wäre es ein lokales Objekt; ein Dienst legt die aufrufbaren Methoden mit Parametern und Rückgabetypen fest, der Server setzt sie um, und der Client nutzt einen Stub (gRPC Authors, n.d.). gRPC kann Protocol Buffers als Schnittstellenbeschreibungssprache und Nachrichtenformat nutzen, und Clients und Server lassen sich in verschiedenen unterstützten Sprachen schreiben.
  sources:
  - https://grpc.io/docs/what-is-grpc/introduction/
- id: graphql
  type: Technology
  name_en: GraphQL
  name_de: GraphQL
  summary_en: GraphQL is a query language with which client applications describe exactly the data they need and their interactions with a service, using a uniform type system defined by the specification (GraphQL Foundation, 2021). It is not a general programming language and does not prescribe a programming language or storage system for the services that implement it.
  summary_de: GraphQL ist eine Abfragesprache, mit der Client-Anwendungen genau die benötigten Daten und ihre Interaktionen mit einem Dienst beschreiben, auf Grundlage eines einheitlichen Typsystems, das die Spezifikation festlegt (GraphQL Foundation, 2021). Es ist keine allgemeine Programmiersprache und schreibt den umsetzenden Diensten weder Programmiersprache noch Speichersystem vor.
  sources:
  - https://spec.graphql.org/October2021/
- id: protocol-buffers
  type: Technology
  name_en: Protocol Buffers
  name_de: Protocol Buffers
  summary_en: Protocol Buffers (protobuf) are a language-neutral, platform-neutral, extensible mechanism for serialising structured data, like JSON but smaller and faster, with generated native language bindings (Google, n.d.). The data structure is defined once and generated code reads and writes it in many languages; gRPC uses protobuf as its interface definition language and message format.
  summary_de: Protocol Buffers (Protobuf) sind ein sprach- und plattformunabhängiger, erweiterbarer Mechanismus zur Serialisierung strukturierter Daten, ähnlich wie JSON, aber kleiner und schneller, mit generierten Anbindungen für die jeweilige Sprache (Google, n.d.). Die Datenstruktur wird einmal festgelegt, und generierter Code liest und schreibt sie in vielen Sprachen; gRPC nutzt Protobuf als Schnittstellenbeschreibungssprache und Nachrichtenformat.
  sources:
  - https://protobuf.dev/overview/
  - https://grpc.io/docs/what-is-grpc/introduction/
- id: problem-details
  type: Technology
  name_en: Problem Details for HTTP APIs (RFC 9457)
  name_de: Problem Details for HTTP APIs (RFC 9457)
  aliases:
  - RFC 9457
  summary_en: Problem Details for HTTP APIs (RFC 9457) defines a "problem detail" format that carries machine-readable details of errors in HTTP response content, so that APIs do not need to invent their own error formats (Nottingham et al., 2023). It is an IETF Standards Track document and obsoletes RFC 7807.
  summary_de: Problem Details for HTTP APIs (RFC 9457) legt ein Format für „Problem Details“ fest, das maschinenlesbare Fehlerangaben im Inhalt von HTTP-Antworten überträgt, damit APIs keine eigenen Fehlerformate erfinden müssen (Nottingham et al., 2023). Es ist ein Dokument des IETF Standards Track und ersetzt RFC 7807.
  sources:
  - https://www.rfc-editor.org/rfc/rfc9457.html
- id: variational-autoencoder
  type: Method
  name_en: Variational autoencoder (VAE)
  name_de: Variational Autoencoder (VAE)
  aliases:
  - VAE
  summary_en: The variational autoencoder (VAE) comes from Auto-Encoding Variational Bayes, a stochastic variational inference and learning algorithm for models with continuous latent variables and intractable posteriors (Kingma & Welling, 2013). A reparameterisation of the variational lower bound makes it optimisable with standard stochastic gradient methods, and an approximate inference (recognition) model makes posterior inference efficient.
  summary_de: Der Variational Autoencoder (VAE) geht auf Auto-Encoding Variational Bayes zurück, ein stochastisches Verfahren für variationelle Inferenz und Lernen in Modellen mit stetigen latenten Variablen und nicht berechenbaren Posterior-Verteilungen (Kingma & Welling, 2013). Eine Reparametrisierung der variationellen unteren Schranke macht es mit üblichen stochastischen Gradientenverfahren optimierbar, und ein Modell für näherungsweise Inferenz (Recognition Model) macht die Posterior-Inferenz effizient.
  sources:
  - https://arxiv.org/abs/1312.6114
- id: dcgan
  type: Method
  name_en: Deep convolutional GAN (DCGAN)
  name_de: Deep Convolutional GAN (DCGAN)
  aliases:
  - DCGAN
  summary_en: Deep convolutional generative adversarial networks (DCGANs) are a class of convolutional GANs with specific architectural constraints for unsupervised representation learning (Radford et al., 2015). Trained on image datasets, generator and discriminator learn a hierarchy of representations from object parts to scenes, and the learned features work as general image representations for new tasks.
  summary_de: Deep Convolutional Generative Adversarial Networks (DCGANs) sind eine Klasse konvolutionaler GANs mit bestimmten Architekturvorgaben für unüberwachtes Repräsentationslernen (Radford et al., 2015). Auf Bilddatensätzen trainiert, lernen Generator und Diskriminator eine Hierarchie von Repräsentationen von Objektteilen bis zu Szenen, und die gelernten Merkmale dienen als allgemeine Bildrepräsentationen für neue Aufgaben.
  sources:
  - https://arxiv.org/abs/1511.06434
- id: wasserstein-gan
  type: Method
  name_en: Wasserstein GAN
  name_de: Wasserstein-GAN
  aliases:
  - WGAN
  summary_en: Wasserstein GAN (WGAN) is an alternative algorithm for training generative adversarial networks that improves learning stability, avoids problems such as mode collapse and yields meaningful learning curves for debugging and hyperparameter search (Arjovsky et al., 2017). Its authors show that the underlying optimisation problem is sound and relate it to distances between probability distributions.
  summary_de: Wasserstein GAN (WGAN) ist ein alternatives Trainingsverfahren für Generative Adversarial Networks, das die Stabilität des Lernens verbessert, Probleme wie Mode Collapse vermeidet und aussagekräftige Lernkurven für Fehlersuche und Hyperparameter-Suche liefert (Arjovsky et al., 2017). Die Autoren zeigen, dass das zugrunde liegende Optimierungsproblem wohldefiniert ist, und setzen es in Bezug zu Abständen zwischen Wahrscheinlichkeitsverteilungen.
  sources:
  - https://arxiv.org/abs/1701.07875
- id: employee-data-protection
  type: Concept
  name_en: Employee data protection
  name_de: Beschäftigtendatenschutz
  summary_en: The German Federal Data Protection Act allows employees' personal data to be processed for employment purposes where this is necessary to decide on establishing an employment relationship, to carry it out or end it, or to exercise or fulfil rights and duties of employee representation arising from law or collective agreements (§ 26(1) BDSG). Processing to uncover criminal offences is subject to additional conditions.
  summary_de: Nach dem Bundesdatenschutzgesetz dürfen personenbezogene Daten von Beschäftigten für Zwecke des Beschäftigungsverhältnisses verarbeitet werden, wenn dies für die Entscheidung über seine Begründung, für seine Durchführung oder Beendigung oder zur Ausübung oder Erfüllung der sich aus Gesetz oder Kollektivvereinbarung ergebenden Rechte und Pflichten der Interessenvertretung erforderlich ist (§ 26 Abs. 1 BDSG). Für die Aufdeckung von Straftaten gelten zusätzliche Voraussetzungen.
  sources:
  - https://www.gesetze-im-internet.de/bdsg_2018/
- id: credit-scoring
  type: Concept
  name_en: Scoring (probability values for contract decisions)
  name_de: Scoring (Wahrscheinlichkeitswerte für Vertragsentscheidungen)
  aliases:
  - scoring
  - credit scoring
  summary_en: Under the German Federal Data Protection Act, scoring is the use of a probability value about a natural person's specific future behaviour to decide on establishing, carrying out or ending a contractual relationship with that person (§ 31(1) BDSG). It is only permitted if, among other conditions, data protection law is complied with and the data used are demonstrably relevant for calculating the probability on the basis of a scientifically recognised mathematical-statistical method.
  summary_de: Nach dem Bundesdatenschutzgesetz ist Scoring die Verwendung eines Wahrscheinlichkeitswerts über ein bestimmtes zukünftiges Verhalten einer natürlichen Person zum Zweck der Entscheidung über die Begründung, Durchführung oder Beendigung eines Vertragsverhältnisses mit ihr (§ 31 Abs. 1 BDSG). Es ist nur zulässig, wenn unter anderem das Datenschutzrecht eingehalten wird und die genutzten Daten unter Zugrundelegung eines wissenschaftlich anerkannten mathematisch-statistischen Verfahrens nachweisbar für die Berechnung der Wahrscheinlichkeit erheblich sind.
  sources:
  - https://www.gesetze-im-internet.de/bdsg_2018/
- id: video-surveillance
  type: Concept
  name_en: Video surveillance
  name_de: Videoüberwachung
  summary_en: Under the German Federal Data Protection Act, monitoring publicly accessible spaces with optical-electronic devices (video surveillance) is only permitted where necessary for public bodies' tasks, for exercising domiciliary rights or for legitimate interests for specified purposes, and only if there is no indication that the data subjects' interests override (§ 4(1) BDSG).
  summary_de: Nach dem Bundesdatenschutzgesetz ist die Beobachtung öffentlich zugänglicher Räume mit optisch-elektronischen Einrichtungen (Videoüberwachung) nur zulässig, soweit sie zur Aufgabenerfüllung öffentlicher Stellen, zur Wahrnehmung des Hausrechts oder zur Wahrnehmung berechtigter Interessen für konkret festgelegte Zwecke erforderlich ist und keine Anhaltspunkte bestehen, dass schutzwürdige Interessen der Betroffenen überwiegen (§ 4 Abs. 1 BDSG).
  sources:
  - https://www.gesetze-im-internet.de/bdsg_2018/
- id: data-protection-officer
  type: Concept
  name_en: Data protection officer
  name_de: Datenschutzbeauftragte
  summary_en: Under the German Federal Data Protection Act, public bodies must designate a data protection officer, chosen on the basis of professional qualities and in particular expert knowledge of data protection law and practice (§ 5(1) and (3) BDSG). Several public bodies may designate a joint officer (§ 5(2) BDSG).
  summary_de: Nach dem Bundesdatenschutzgesetz benennen öffentliche Stellen eine Datenschutzbeauftragte oder einen Datenschutzbeauftragten, die oder der auf Grundlage der beruflichen Qualifikation und insbesondere des Fachwissens auf dem Gebiet des Datenschutzrechts und der Datenschutzpraxis benannt wird (§ 5 Abs. 1 und 3 BDSG). Mehrere öffentliche Stellen können eine gemeinsame Person benennen (§ 5 Abs. 2 BDSG).
  sources:
  - https://www.gesetze-im-internet.de/bdsg_2018/
- id: weat
  type: Method
  name_en: Word Embedding Association Test (WEAT)
  name_de: Word Embedding Association Test (WEAT)
  aliases:
  - WEAT
  summary_en: The Word Embedding Association Test (WEAT) measures bias in word embeddings by analogy with the Implicit Association Test from psychology (Caliskan et al., 2016). Using it on GloVe embeddings trained on web text, Caliskan et al. replicated a spectrum of known human biases, from neutral ones towards insects and flowers to problematic ones towards race and gender.
  summary_de: Der Word Embedding Association Test (WEAT) misst Verzerrungen in Wort-Embeddings in Anlehnung an den Impliziten Assoziationstest der Psychologie (Caliskan et al., 2016). Damit reproduzierten Caliskan et al. an GloVe-Embeddings aus Webtexten eine Reihe bekannter menschlicher Vorurteile, von neutralen gegenüber Insekten und Blumen bis zu problematischen bezüglich Herkunft und Geschlecht.
  sources:
  - https://arxiv.org/abs/1608.07187
- id: wefat
  type: Method
  name_en: Word Embedding Factual Association Test (WEFAT)
  name_de: Word Embedding Factual Association Test (WEFAT)
  aliases:
  - WEFAT
  summary_en: The Word Embedding Factual Association Test (WEFAT) relates associations in word embeddings to real-world facts, for example the gender distribution of careers or first names (Caliskan et al., 2016). It shows that embeddings capture veridical imprints of the status quo alongside biases, introduced together with the Word Embedding Association Test.
  summary_de: Der Word Embedding Factual Association Test (WEFAT) setzt Assoziationen in Wort-Embeddings mit realen Fakten in Beziehung, etwa der Geschlechterverteilung in Berufen oder bei Vornamen (Caliskan et al., 2016). Er zeigt, dass Embeddings neben Vorurteilen auch zutreffende Abbilder des Status quo enthalten, und wurde zusammen mit dem Word Embedding Association Test eingeführt.
  sources:
  - https://arxiv.org/abs/1608.07187
- id: geometric-debiasing
  type: Method
  name_en: Geometric debiasing of word embeddings
  name_de: Geometrisches Debiasing von Word Embeddings
  summary_en: Geometric debiasing of word embeddings uses the finding that gender bias is captured by a direction in the embedding space and that gender-neutral words are linearly separable from gender-definitional words (Bolukbasi et al., 2016). The method removes stereotypical associations such as receptionist–female while keeping definitional ones such as queen–female, and keeps clustering and analogy abilities.
  summary_de: Geometrisches Debiasing von Wort-Embeddings nutzt den Befund, dass Geschlechterverzerrung durch eine Richtung im Embedding-Raum erfasst wird und geschlechtsneutrale Wörter linear von geschlechtsdefinierenden Wörtern trennbar sind (Bolukbasi et al., 2016). Das Verfahren entfernt stereotype Zuordnungen wie Empfangskraft–weiblich und behält definitorische wie Königin–weiblich, ohne Clustering- und Analogiefähigkeiten zu verlieren.
  sources:
  - https://arxiv.org/abs/1607.06520
- id: bsig-2009
  type: Regulation
  name_en: BSI Act (2009 version)
  name_de: BSI-Gesetz (Fassung von 2009)
  summary_en: The BSI Act of 14 August 2009 (BGBl. I p. 2821) was the earlier version of the law on the Federal Office for Information Security, last amended in June 2021. It has been replaced by the 2025 BSI Act implementing NIS2, whose transitional provisions refer to obligations and deadlines under the 2009 version.
  summary_de: Das BSI-Gesetz vom 14. August 2009 (BGBl. I S. 2821) war die frühere Fassung des Gesetzes über das Bundesamt für Sicherheit in der Informationstechnik, zuletzt im Juni 2021 geändert. Es wurde durch das BSI-Gesetz von 2025 zur Umsetzung von NIS2 abgelöst, dessen Übergangsvorschriften auf Pflichten und Fristen nach der Fassung von 2009 Bezug nehmen.
  sources:
  - https://www.gesetze-im-internet.de/bsig_2025/
- id: it-security-label
  type: Concept
  name_en: IT security label
  name_de: IT-Sicherheitskennzeichen
  summary_en: The voluntary IT security label (IT-Sicherheitskennzeichen) introduced by the BSI informs consumers about the IT security of products in categories set by the BSI; it says nothing about data protection properties (§ 55(1) BSIG). It consists of a manufacturer's or service provider's assurance that the product meets certain IT security requirements for a set period and a BSI information about security-relevant IT properties of the product (§ 55(2) BSIG).
  summary_de: Das freiwillige IT-Sicherheitskennzeichen des BSI informiert Verbraucher über die IT-Sicherheit von Produkten bestimmter vom BSI festgelegter Produktkategorien und trifft keine Aussage über Datenschutzeigenschaften (§ 55 Abs. 1 BSIG). Es besteht aus einer Herstellererklärung, dass das Produkt für eine festgelegte Dauer bestimmte IT-Sicherheitsanforderungen erfüllt, und einer Sicherheitsinformation des BSI über sicherheitsrelevante IT-Eigenschaften des Produkts (§ 55 Abs. 2 BSIG).
  sources:
  - https://www.gesetze-im-internet.de/bsig_2025/
- id: propensity-score
  type: Method
  name_en: Propensity score
  name_de: Propensity Score
  summary_en: The propensity score is the probability that a unit receives a treatment given its observed covariates (Rosenbaum and Rubin 1983). Adjusting for it is sufficient to remove bias due to all observed covariates, so it reduces adjustment for many covariates to a single score and can be used for matching, subclassification or regression adjustment in observational studies.
  summary_de: Der Propensity Score ist die Wahrscheinlichkeit, dass eine Einheit eine Behandlung erhält, gegeben ihre beobachteten Kovariaten (Rosenbaum und Rubin 1983). Eine Adjustierung für ihn genügt, um Verzerrungen durch alle beobachteten Kovariaten zu beseitigen; er verdichtet die Adjustierung für viele Kovariaten so auf einen einzigen Wert und lässt sich in Beobachtungsstudien für Matching, Stratifizierung oder Regressionsadjustierung nutzen.
  sources:
  - https://doi.org/10.1093/biomet/70.1.41
- id: instrumental-variables
  type: Method
  name_en: Instrumental variables
  name_de: Instrumentvariablen
  summary_en: 'An instrumental variable affects whether a unit receives treatment but influences the outcome only through the treatment, which allows causal effects to be identified despite unobserved confounding or imperfect compliance (Angrist et al. 1996). Angrist, Imbens and Rubin embedded the approach in the potential-outcomes framework: under simple assumptions it identifies the average causal effect for compliers, illustrated with the Vietnam-era draft lottery as an instrument for veteran status.'
  summary_de: 'Eine Instrumentvariable beeinflusst, ob eine Einheit behandelt wird, wirkt auf das Ergebnis aber nur über die Behandlung; das erlaubt es, kausale Effekte trotz unbeobachteter Störgrößen oder unvollständiger Befolgung zu identifizieren (Angrist et al. 1996). Angrist, Imbens und Rubin betten den Ansatz in das Potential-Outcomes-Modell ein: Unter einfachen Annahmen identifiziert er den durchschnittlichen kausalen Effekt für die Befolgenden (Compliers), illustriert mit der Wehrpflicht-Lotterie der Vietnamkriegszeit als Instrument für den Veteranenstatus.'
  sources:
  - https://doi.org/10.1080/01621459.1996.10476902
- id: randomised-experiments
  type: Method
  name_en: Randomised experiment
  name_de: Randomisiertes Experiment
  aliases:
  - randomized experiment
  - randomised controlled trial
  summary_en: In a randomised experiment, treatment is assigned at random, so treated and untreated groups are comparable in expectation and differences in outcomes can be attributed to the treatment (Holland 1986; Hernán and Robins 2020). Randomised experiments are therefore the reference design for estimating causal effects.
  summary_de: In einem randomisierten Experiment wird die Behandlung zufällig zugeteilt, sodass behandelte und unbehandelte Gruppen im Erwartungswert vergleichbar sind und Unterschiede im Ergebnis der Behandlung zugeschrieben werden können (Holland 1986; Hernán und Robins 2020). Randomisierte Experimente sind daher das Referenzdesign für die Schätzung kausaler Effekte.
  sources:
  - https://doi.org/10.1080/01621459.1986.10478354
  - https://miguelhernan.org/whatifbook
- id: structural-causal-model
  type: Method
  name_en: Structural causal model
  name_de: Strukturelles Kausalmodell
  summary_en: The structural causal model (SCM) is Pearl's framework for causal inference, which combines structural equation models, the potential-outcome framework of Neyman and Rubin, and graphical models (Pearl 2009). Causal assumptions are expressed as structural equations and directed graphs, from which the effects of interventions, counterfactuals and testable implications such as conditional independencies (d-separation) can be derived.
  summary_de: Das strukturelle Kausalmodell (SCM) ist Pearls Rahmenwerk für Kausalinferenz, das Strukturgleichungsmodelle, das Potential-Outcomes-Modell von Neyman und Rubin und graphische Modelle verbindet (Pearl 2009). Kausale Annahmen werden als Strukturgleichungen und gerichtete Graphen formuliert, aus denen sich Effekte von Interventionen, Kontrafaktische und prüfbare Folgerungen wie bedingte Unabhängigkeiten (d-Separation) ableiten lassen.
  sources:
  - https://doi.org/10.1214/09-SS057
- id: potential-outcomes-model
  type: Concept
  name_en: Potential-outcomes model
  name_de: Potential-Outcomes-Modell
  summary_en: In the potential-outcomes model, each unit has an outcome under treatment and an outcome under control, and the causal effect is their difference (Holland 1986). Only one of the two can ever be observed for a given unit, which Holland calls the fundamental problem of causal inference; causal inference therefore estimates average effects over groups under assumptions, for example those justified by randomisation (Hernán and Robins 2020).
  summary_de: Im Potential-Outcomes-Modell hat jede Einheit ein Ergebnis unter Behandlung und eines unter Kontrolle, und der kausale Effekt ist ihre Differenz (Holland 1986). Für eine Einheit lässt sich immer nur eines der beiden beobachten, was Holland das fundamentale Problem der Kausalinferenz nennt; Kausalinferenz schätzt daher durchschnittliche Effekte über Gruppen unter Annahmen, etwa solchen, die durch Randomisierung gerechtfertigt sind (Hernán und Robins 2020).
  sources:
  - https://doi.org/10.1080/01621459.1986.10478354
  - https://miguelhernan.org/whatifbook
- id: counterfactual-fairness
  type: Concept
  name_en: Counterfactual fairness
  name_de: Counterfactual Fairness
  summary_en: 'Counterfactual fairness uses causal inference to define fairness towards an individual: a decision is fair if it is the same in the actual world and in a counterfactual world in which the individual belonged to a different demographic group (Kusner et al., 2017). The authors demonstrated it on predicting success in law school.'
  summary_de: 'Kontrafaktische Fairness nutzt kausale Inferenz, um Fairness gegenüber einer Person zu bestimmen: Eine Entscheidung ist fair, wenn sie in der tatsächlichen Welt und in einer kontrafaktischen Welt, in der die Person einer anderen demografischen Gruppe angehört, gleich ausfällt (Kusner et al., 2017). Die Autoren zeigten das am Beispiel der Vorhersage des Studienerfolgs im Jurastudium.'
  sources:
  - https://arxiv.org/abs/1703.06856
- id: front-door-adjustment
  type: Method
  name_en: Causal front-door adjustment
  name_de: Kausale Front-Door-Adjustierung
- id: ab-testing
  type: Method
  name_en: A/B testing
  name_de: A/B-Test
  aliases:
  - A/B test
  summary_en: An A/B test, or online controlled experiment, randomly assigns users to a control and a treatment variant; it is the best scientific design for establishing a causal effect of a change on user behaviour (Kohavi et al. 2009). Kohavi et al.'s practical guide covers statistical power, sample size and variance reduction, and discusses the limitations of such experiments.
  summary_de: Ein A/B-Test, auch Online Controlled Experiment, teilt Nutzende zufällig einer Kontroll- und einer Behandlungsvariante zu; er ist das beste wissenschaftliche Design, um eine kausale Wirkung einer Änderung auf das Nutzerverhalten nachzuweisen (Kohavi et al. 2009). Der Praxisleitfaden von Kohavi et al. behandelt Teststärke, Stichprobengröße und Varianzreduktion und erörtert die Grenzen solcher Experimente.
  sources:
  - https://doi.org/10.1007/s10618-008-0114-1
- id: simpsons-paradox
  type: Concept
  name_en: Simpson's paradox
  name_de: Simpson-Paradoxon
  summary_en: Simpson's paradox is a reversal phenomenon in which an association in aggregated data disappears or reverses once the data are split into subgroups; Pearl calls it the classical example of why causal vocabulary is needed to interpret data (Pearl 2009). In graduate admissions at Berkeley, women appeared to be admitted less often overall, but disaggregated by department there was little evidence of discrimination, because women applied more often to departments that were harder to enter for applicants of either sex (Bickel et al. 1975).
  summary_de: Das Simpson-Paradoxon ist ein Umkehrphänomen, bei dem ein Zusammenhang in aggregierten Daten verschwindet oder sich umkehrt, sobald die Daten in Untergruppen aufgeteilt werden; Pearl nennt es das klassische Beispiel dafür, dass Daten nur mit kausalem Vokabular richtig interpretiert werden können (Pearl 2009). Bei den Zulassungen zum Graduiertenstudium in Berkeley schienen Frauen insgesamt seltener zugelassen zu werden, nach Fachbereichen aufgeschlüsselt gab es aber kaum Hinweise auf Diskriminierung, weil sich Frauen häufiger bei Fachbereichen bewarben, die für Bewerbende beiderlei Geschlechts schwerer zugänglich waren (Bickel et al. 1975).
  sources:
  - https://doi.org/10.1126/science.187.4175.398
  - https://doi.org/10.1214/09-SS057
- id: eci-directive
  type: Regulation
  name_en: European Critical Infrastructures Directive 2008/114/EC
  name_de: Richtlinie 2008/114/EG über Europäische kritische Infrastrukturen
  aliases:
  - Directive 2008/114/EC
  summary_en: Council Directive 2008/114/EC established a procedure for identifying and designating European critical infrastructures (ECIs) and a common approach to assessing the need to improve their protection, to contribute to the protection of people (Art. 1). It was repealed with effect from 18 October 2024 by the CER Directive (EU) 2022/2557 (Art. 27 CER Directive).
  summary_de: Die Richtlinie 2008/114/EG des Rates führte ein Verfahren zur Ermittlung und Ausweisung europäischer kritischer Infrastrukturen (EKI) und einen gemeinsamen Ansatz für die Bewertung der Notwendigkeit ihres besseren Schutzes ein, um zum Schutz der Menschen beizutragen (Art. 1). Sie wurde mit Wirkung vom 18. Oktober 2024 durch die CER-Richtlinie (EU) 2022/2557 aufgehoben (Art. 27 CER-Richtlinie).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32008L0114
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2557
- id: critical-entity
  type: Concept
  name_en: Critical entity
  name_de: Kritische Einrichtung
  summary_en: Under the CER Directive, a critical entity is a public or private entity that a Member State has identified, in accordance with Article 6, as belonging to one of the categories listed in the Annex (Art. 2(1) CER Directive). Member States had to identify their critical entities for the sectors and subsectors in the Annex by 17 July 2026, based on their risk assessment and strategy (Art. 6(1)–(2) CER Directive).
  summary_de: Nach der CER-Richtlinie ist eine kritische Einrichtung eine öffentliche oder private Einrichtung, die ein Mitgliedstaat nach Artikel 6 als einer der im Anhang aufgeführten Kategorien angehörend eingestuft hat (Art. 2 Nr. 1 CER-Richtlinie). Die Mitgliedstaaten hatten ihre kritischen Einrichtungen für die im Anhang festgelegten Sektoren und Teilsektoren bis zum 17. Juli 2026 zu ermitteln, auf Grundlage ihrer Risikobewertung und Strategie (Art. 6 Abs. 1 und 2 CER-Richtlinie).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022L2557
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2557
- id: linear-regression
  type: Method
  name_en: Linear regression
  name_de: Lineare Regression
  summary_en: Linear regression by ordinary least squares fits a linear model whose coefficients minimise the residual sum of squares between observed and predicted targets (scikit-learn developers, n.d.-d). Its coefficient estimates rely on the independence of the features; ridge and lasso regression add penalties on the coefficients.
  summary_de: Lineare Regression nach der Methode der kleinsten Quadrate passt ein lineares Modell an, dessen Koeffizienten die Summe der quadrierten Abweichungen zwischen beobachteten und vorhergesagten Zielwerten minimieren (scikit-learn developers, n.d.-d). Ihre Koeffizientenschätzungen setzen unabhängige Merkmale voraus; Ridge- und Lasso-Regression ergänzen Strafterme auf die Koeffizienten.
  sources:
  - https://scikit-learn.org/stable/modules/linear_model.html
- id: supervised-learning
  type: Concept
  name_en: Supervised learning
  name_de: Überwachtes Lernen
  summary_en: Supervised learning is learning from a training set of labelled examples provided by an external supervisor; each example describes a situation together with the correct output, often the category it belongs to (Sutton and Barto 2018). Supervised learning algorithms experience a dataset whose examples each have features and an associated label or target (Goodfellow et al. 2016).
  summary_de: Überwachtes Lernen ist Lernen aus einem Trainingsdatensatz mit gelabelten Beispielen, die eine externe Instanz bereitstellt; jedes Beispiel beschreibt eine Situation zusammen mit der richtigen Ausgabe, oft der Kategorie, zu der sie gehört (Sutton und Barto 2018). Algorithmen des überwachten Lernens arbeiten mit einem Datensatz, dessen Beispiele jeweils Merkmale und ein zugehöriges Label oder einen Zielwert haben (Goodfellow et al. 2016).
  sources:
  - http://incompleteideas.net/book/the-book-2nd.html
  - https://www.deeplearningbook.org/contents/ml.html
- id: unsupervised-learning
  type: Concept
  name_en: Unsupervised learning
  name_de: Unüberwachtes Lernen
  summary_en: Unsupervised learning is about finding structure hidden in collections of unlabelled data (Sutton and Barto 2018). Unsupervised algorithms learn useful properties of a dataset's structure, for example the probability distribution that generated it, as in density estimation, or a division into clusters of similar examples (Goodfellow et al. 2016).
  summary_de: Unüberwachtes Lernen sucht nach verborgener Struktur in Sammlungen ungelabelter Daten (Sutton und Barto 2018). Unüberwachte Algorithmen lernen nützliche Eigenschaften der Struktur eines Datensatzes, etwa die Wahrscheinlichkeitsverteilung, die ihn erzeugt hat, wie bei der Dichteschätzung, oder eine Aufteilung in Cluster ähnlicher Beispiele (Goodfellow et al. 2016).
  sources:
  - http://incompleteideas.net/book/the-book-2nd.html
  - https://www.deeplearningbook.org/contents/ml.html
- id: xgboost
  type: Method
  name_en: XGBoost
  name_de: XGBoost
  summary_en: XGBoost is a scalable end-to-end tree boosting system widely used by data scientists to reach state-of-the-art results in machine learning challenges (Chen & Guestrin, 2016). It adds a sparsity-aware algorithm, a weighted quantile sketch for approximate tree learning and optimisations for cache access, compression and sharding, scaling beyond billions of examples.
  summary_de: XGBoost ist ein skalierbares, durchgängiges System für Tree Boosting, das in Data Science weit verbreitet ist, um Spitzenergebnisse in ML-Wettbewerben zu erreichen (Chen & Guestrin, 2016). Es ergänzt einen Algorithmus für dünn besetzte Daten, eine gewichtete Quantilschätzung für näherungsweises Baumlernen sowie Optimierungen für Cache-Zugriffe, Kompression und Sharding und skaliert über Milliarden von Beispielen.
  sources:
  - https://arxiv.org/abs/1603.02754
- id: discriminant-analysis
  type: Method
  name_en: Discriminant analysis
  name_de: Diskriminanzanalyse
  summary_en: Discriminant analysis classifies by modelling the class-conditional distribution of the data, typically as a multivariate Gaussian, and choosing the class with the highest posterior probability via Bayes' rule (scikit-learn developers, n.d.-c). Its two classic forms, linear and quadratic discriminant analysis, have closed-form solutions, are inherently multiclass and have no hyperparameters to tune.
  summary_de: Diskriminanzanalyse klassifiziert, indem sie die bedingte Verteilung der Daten je Klasse modelliert, meist als multivariate Normalverteilung, und über den Satz von Bayes die Klasse mit der höchsten A-posteriori-Wahrscheinlichkeit wählt (scikit-learn developers, n.d.-c). Ihre zwei klassischen Formen, lineare und quadratische Diskriminanzanalyse, haben geschlossene Lösungen, sind von Natur aus mehrklassenfähig und haben keine abzustimmenden Hyperparameter.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: linear-discriminant-analysis
  type: Method
  name_en: Linear discriminant analysis (LDA)
  name_de: Lineare Diskriminanzanalyse (LDA)
  aliases:
  - LDA
  summary_en: Linear discriminant analysis (LDA) is a classifier with a linear decision surface derived from Gaussian class-conditional models with a shared covariance matrix (scikit-learn developers, n.d.-c). It can also reduce dimensionality in a supervised way by projecting data onto the directions that best separate the classes, with fewer output dimensions than classes.
  summary_de: Die lineare Diskriminanzanalyse (LDA) ist ein Klassifikator mit linearer Entscheidungsgrenze, hergeleitet aus Normalverteilungsmodellen je Klasse mit gemeinsamer Kovarianzmatrix (scikit-learn developers, n.d.-c). Sie kann auch überwacht die Dimension reduzieren, indem sie Daten auf die Richtungen projiziert, die die Klassen am besten trennen, mit weniger Ausgabedimensionen als Klassen.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: quadratic-discriminant-analysis
  type: Method
  name_en: Quadratic discriminant analysis (QDA)
  name_de: Quadratische Diskriminanzanalyse (QDA)
  aliases:
  - QDA
  summary_en: Quadratic discriminant analysis (QDA) models each class with its own Gaussian covariance matrix, which gives quadratic decision boundaries and makes it more flexible than linear discriminant analysis (scikit-learn developers, n.d.-c). Like LDA it has a closed-form solution and no hyperparameters to tune.
  summary_de: Die quadratische Diskriminanzanalyse (QDA) modelliert jede Klasse mit eigener Kovarianzmatrix, was quadratische Entscheidungsgrenzen ergibt und sie flexibler macht als die lineare Diskriminanzanalyse (scikit-learn developers, n.d.-c). Wie LDA hat sie eine geschlossene Lösung und keine abzustimmenden Hyperparameter.
  sources:
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: discriminative-model
  type: Concept
  name_en: Discriminative model
  name_de: Diskriminatives Modell
  summary_en: A discriminative classifier models the posterior p(y|x) directly or learns a direct map from inputs x to class labels, as logistic regression does (Ng and Jordan 2001). Ng and Jordan found that discriminative learning has the lower asymptotic error, while a generative classifier such as naive Bayes may approach its higher asymptotic error much faster, so each can be better depending on the training set size.
  summary_de: Ein diskriminativer Klassifikator modelliert die A-posteriori-Wahrscheinlichkeit p(y|x) direkt oder lernt eine direkte Abbildung von Eingaben x auf Klassenlabels, wie die logistische Regression (Ng und Jordan 2001). Ng und Jordan zeigten, dass diskriminatives Lernen den geringeren asymptotischen Fehler hat, ein generativer Klassifikator wie Naive Bayes seinen höheren asymptotischen Fehler aber deutlich schneller erreichen kann, sodass je nach Größe des Trainingsdatensatzes das eine oder das andere besser ist.
  sources:
  - https://proceedings.neurips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html
- id: generative-model
  type: Concept
  name_en: Generative model
  name_de: Generatives Modell
  summary_en: A generative classifier learns a model of the joint probability p(x, y) of inputs and labels, as naive Bayes does, and predicts by computing p(y|x) with Bayes' rule and picking the most likely label (Ng and Jordan 2001). Compared with discriminative classifiers such as logistic regression, generative classifiers can approach their (higher) asymptotic error much faster, so they may perform better with small training sets.
  summary_de: Ein generativer Klassifikator lernt ein Modell der gemeinsamen Wahrscheinlichkeit p(x, y) von Eingaben und Labels, wie Naive Bayes, und sagt vorher, indem er p(y|x) mit dem Satz von Bayes berechnet und das wahrscheinlichste Label wählt (Ng und Jordan 2001). Im Vergleich zu diskriminativen Klassifikatoren wie der logistischen Regression können generative Klassifikatoren ihren (höheren) asymptotischen Fehler deutlich schneller erreichen und daher bei kleinen Trainingsdatensätzen besser abschneiden.
  sources:
  - https://proceedings.neurips.cc/paper/2001/hash/7b7a53e239400a13bd6be6c91c4f6c4e-Abstract.html
- id: confusion-matrix
  type: Concept
  name_en: Confusion matrix
  name_de: Konfusionsmatrix
  summary_en: A confusion matrix tabulates a classifier's predictions against the true classes; in scikit-learn's convention, entry (i, j) is the number of observations actually in class i but predicted to be in class j (scikit-learn developers, n.d.). It can be normalised to show ratios instead of counts and underlies metrics such as precision, recall and specificity.
  summary_de: Eine Konfusionsmatrix stellt die Vorhersagen eines Klassifikators den wahren Klassen gegenüber; nach der Konvention von scikit-learn ist Eintrag (i, j) die Zahl der Beobachtungen, die tatsächlich zur Klasse i gehören, aber Klasse j zugeordnet wurden (scikit-learn developers, n.d.). Sie lässt sich normieren, um Anteile statt Zählungen zu zeigen, und liegt Metriken wie Precision, Recall und Spezifität zugrunde.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: specificity
  type: Concept
  name_en: Specificity
  name_de: Spezifität
  summary_en: Specificity, or true negative rate, is the proportion of actual negatives that a classifier correctly identifies, TN / (TN + FP) (scikit-learn developers, n.d.). Balanced accuracy is the mean of recall (sensitivity) and specificity, and the false positive rate plotted in a ROC curve is one minus specificity.
  summary_de: Spezifität oder True Negative Rate ist der Anteil tatsächlich negativer Fälle, die ein Klassifikator richtig erkennt, TN / (TN + FP) (scikit-learn developers, n.d.). Die Balanced Accuracy ist der Mittelwert aus Recall (Sensitivität) und Spezifität, und die False Positive Rate in einer ROC-Kurve ist eins minus Spezifität.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: accuracy
  type: Concept
  name_en: Accuracy
  name_de: Accuracy
  summary_en: Accuracy is the fraction of correct predictions, the number of samples whose predicted label equals the true label divided by the number of samples (scikit-learn developers, n.d.). In multilabel classification, scikit-learn's accuracy_score returns subset accuracy, which counts a sample as correct only if its whole set of predicted labels matches the true set.
  summary_de: Accuracy ist der Anteil richtiger Vorhersagen, also die Zahl der Beispiele, deren vorhergesagtes Label dem wahren entspricht, geteilt durch die Zahl aller Beispiele (scikit-learn developers, n.d.). Bei Multilabel-Klassifikation liefert accuracy_score in scikit-learn die Subset Accuracy, die ein Beispiel nur dann als richtig zählt, wenn die gesamte Menge vorhergesagter Labels mit der wahren übereinstimmt.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: f1-score
  type: Concept
  name_en: F1 score
  name_de: F1-Score
  aliases:
  - F1
  summary_en: The F1 score is the harmonic mean of precision, a classifier's ability not to label negative samples as positive, and recall, its ability to find all positive samples; the general F-beta measure weights the two and reaches its best value at 1 and worst at 0 (scikit-learn developers, n.d.). With beta = 1, precision and recall are equally important.
  summary_de: Der F1-Score ist das harmonische Mittel aus Precision, der Fähigkeit eines Klassifikators, negative Beispiele nicht als positiv zu kennzeichnen, und Recall, der Fähigkeit, alle positiven Beispiele zu finden; das allgemeine F-Beta-Maß gewichtet beide und reicht von 0 (schlechtester) bis 1 (bester Wert) (scikit-learn developers, n.d.). Bei Beta = 1 sind Precision und Recall gleich wichtig.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: matthews-correlation-coefficient
  type: Concept
  name_en: Matthews correlation coefficient (MCC)
  name_de: Matthews-Korrelationskoeffizient (MCC)
  aliases:
  - MCC
  summary_en: The Matthews correlation coefficient (MCC) measures the quality of binary classifications from true and false positives and negatives and is regarded as balanced even when classes have very different sizes (scikit-learn developers, n.d.). It ranges from −1, an inverse prediction, through 0, an average random prediction, to +1, a perfect prediction; it is also known as the phi coefficient.
  summary_de: Der Matthews-Korrelationskoeffizient (MCC) misst die Güte binärer Klassifikationen aus richtig und falsch positiven und negativen Fällen und gilt auch bei sehr unterschiedlich großen Klassen als ausgewogen (scikit-learn developers, n.d.). Er reicht von −1, einer umgekehrten Vorhersage, über 0, einer zufälligen Vorhersage, bis +1, einer perfekten Vorhersage; er ist auch als Phi-Koeffizient bekannt.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: roc-curve
  type: Concept
  name_en: ROC curve and AUC
  name_de: ROC-Kurve und AUC
  aliases:
  - ROC
  - ROC AUC
  - receiver operating characteristic
  summary_en: A receiver operating characteristic (ROC) curve plots the true positive rate (sensitivity) against the false positive rate (one minus specificity) of a binary classifier as its decision threshold varies (scikit-learn developers, n.d.). It is computed from true labels and scores such as probability estimates; the area under the curve (AUC) summarises it in one number.
  summary_de: Eine ROC-Kurve (Receiver Operating Characteristic) trägt die True Positive Rate (Sensitivität) eines binären Klassifikators gegen die False Positive Rate (eins minus Spezifität) auf, während die Entscheidungsschwelle variiert (scikit-learn developers, n.d.). Sie wird aus wahren Labels und Scores wie Wahrscheinlichkeitsschätzungen berechnet; die Fläche unter der Kurve (AUC) fasst sie in einer Zahl zusammen.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: precision-recall-curve
  type: Concept
  name_en: Precision-recall curve
  name_de: Precision-Recall-Kurve
  aliases:
  - PR curve
  summary_en: A precision-recall curve shows precision against recall as a classifier's decision threshold varies (scikit-learn developers, n.d.). Average precision summarises it as the sum of precision values weighted by the increase in recall at each threshold; with random predictions it equals the fraction of positive samples, and linear interpolation between points gives an overly optimistic measure.
  summary_de: Eine Precision-Recall-Kurve zeigt Precision gegen Recall, während die Entscheidungsschwelle eines Klassifikators variiert (scikit-learn developers, n.d.). Die Average Precision fasst sie als Summe der Precision-Werte zusammen, gewichtet mit dem Zuwachs an Recall je Schwelle; bei zufälligen Vorhersagen entspricht sie dem Anteil positiver Beispiele, und lineare Interpolation zwischen den Punkten ergibt ein zu optimistisches Maß.
  sources:
  - https://scikit-learn.org/stable/modules/model_evaluation.html
- id: exact-match
  type: Concept
  name_en: Exact match
  name_de: Exact Match
  summary_en: Exact match scores a prediction as correct only if it is identical to a reference answer; in extractive question answering such as SQuAD, it is reported alongside a token-level F1 score that gives partial credit for overlap (Rajpurkar et al. 2016).
  summary_de: Exact Match wertet eine Vorhersage nur dann als richtig, wenn sie mit einer Referenzantwort identisch ist; bei extraktiver Fragebeantwortung wie SQuAD wird es zusammen mit einem F1-Wert auf Tokenebene berichtet, der Überlappungen teilweise anrechnet (Rajpurkar et al. 2016).
  sources:
  - https://arxiv.org/abs/1606.05250
- id: robert-c-martin
  type: Person
  name_en: Robert C. Martin
  name_de: Robert C. Martin
  summary_en: Robert C. Martin ("Uncle Bob") is a programmer, speaker and teacher and the author of Clean Code. A Handbook of Agile Software Craftsmanship, published by Pearson in 2008, which he wrote with colleagues from Object Mentor (Pearson; cleancoder.com). The term clean code goes back to this book.
  summary_de: Robert C. Martin („Uncle Bob“) ist Programmierer, Redner und Lehrender und Autor von Clean Code. A Handbook of Agile Software Craftsmanship, 2008 bei Pearson erschienen und gemeinsam mit Kollegen von Object Mentor erarbeitet (Pearson; cleancoder.com). Der Begriff Clean Code geht auf dieses Buch zurück.
  sources:
  - https://cleancoder.com/
  - https://www.informit.com/store/clean-code-a-handbook-of-agile-software-craftsmanship-9780132350884
- id: pep-8
  type: Technology
  name_en: PEP 8
  name_de: PEP 8
  summary_en: PEP 8 is the style guide for Python code, originally written as coding conventions for the Python standard library and adapted from Guido van Rossum's original Python style guide essay (van Rossum et al., 2001). It covers code layout such as indentation, line length and blank lines, imports, whitespace, comments, docstrings and naming conventions, and evolves as conventions change.
  summary_de: PEP 8 ist der Stilleitfaden für Python-Code, ursprünglich als Konventionen für die Python-Standardbibliothek verfasst und aus Guido van Rossums ursprünglichem Essay zum Python-Stil abgeleitet (van Rossum et al., 2001). Er behandelt Code-Layout wie Einrückung, Zeilenlänge und Leerzeilen, Importe, Leerzeichen, Kommentare, Docstrings und Namenskonventionen und entwickelt sich mit den Konventionen weiter.
  sources:
  - https://peps.python.org/pep-0008/
- id: modular-design
  type: Concept
  name_en: Modular design
  name_de: Modulares Design
- id: code-review
  type: Method
  name_en: Code review
  name_de: Code Review
  summary_en: A code review is a process in which someone other than the author examines a piece of code; Google uses it to maintain the quality of its code and products (Google Engineering Practices). Reviewers look at design, functionality, complexity, tests, naming, comments, style and documentation, with the overall design being the most important point.
  summary_de: Ein Code Review ist ein Prozess, in dem jemand anderes als die Autorin oder der Autor ein Stück Code prüft; Google nutzt ihn, um die Qualität von Code und Produkten zu sichern (Google Engineering Practices). Geprüft werden Design, Funktionalität, Komplexität, Tests, Benennung, Kommentare, Stil und Dokumentation, wobei das Gesamtdesign der wichtigste Punkt ist.
  sources:
  - https://google.github.io/eng-practices/review/
  - https://google.github.io/eng-practices/review/reviewer/looking-for.html
- id: k-means
  type: Method
  name_en: k-means
  name_de: k-Means
  aliases:
  - Lloyd's algorithm
  summary_en: k-means clusters data into a fixed number of disjoint clusters by choosing centroids that minimise the inertia, the within-cluster sum of squares (scikit-learn developers, n.d.-b). It scales well to many samples but assumes convex, isotropic clusters, and the number of clusters must be specified in advance.
  summary_de: k-Means teilt Daten in eine feste Zahl disjunkter Cluster, indem es Zentroide wählt, die die Inertia minimieren, die Summe der quadrierten Abstände innerhalb der Cluster (scikit-learn developers, n.d.-b). Es skaliert gut auf viele Datenpunkte, setzt aber konvexe, isotrope Cluster voraus, und die Zahl der Cluster muss vorab festgelegt werden.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: k-means-plus-plus
  type: Method
  name_en: k-means++
  name_de: k-Means++
  summary_en: k-means++ is an initialisation scheme for k-means that places the initial centroids generally far from each other, which usually leads to better results than random initialisation (scikit-learn developers, n.d.-b). It is the default initialisation in scikit-learn and can also be used on its own to select seeds for other clustering algorithms.
  summary_de: k-Means++ ist ein Initialisierungsverfahren für k-Means, das die Startzentroide in der Regel weit voneinander entfernt platziert und meist zu besseren Ergebnissen führt als zufällige Initialisierung (scikit-learn developers, n.d.-b). Es ist in scikit-learn voreingestellt und kann auch eigenständig Startpunkte für andere Clustering-Verfahren auswählen.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: hierarchical-clustering
  type: Method
  name_en: Hierarchical clustering
  name_de: Hierarchisches Clustering
  aliases:
  - agglomerative clustering
  summary_en: Hierarchical clustering builds nested clusters by successively merging or splitting them, represented as a tree (dendrogram) whose root holds all samples and whose leaves are single samples (scikit-learn developers, n.d.-b). Agglomerative clustering works bottom up, and the linkage criterion, such as Ward, complete, average or single linkage, decides which clusters to merge.
  summary_de: Hierarchisches Clustering bildet verschachtelte Cluster durch schrittweises Zusammenführen oder Aufteilen, dargestellt als Baum (Dendrogramm), dessen Wurzel alle Datenpunkte enthält und dessen Blätter einzelne Datenpunkte sind (scikit-learn developers, n.d.-b). Agglomeratives Clustering arbeitet von unten nach oben, und das Linkage-Kriterium, etwa Ward, Complete, Average oder Single Linkage, bestimmt, welche Cluster zusammengeführt werden.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: dbscan
  type: Method
  name_en: DBSCAN
  name_de: DBSCAN
  summary_en: DBSCAN views clusters as areas of high density separated by areas of low density, so clusters can have any shape, unlike in k-means (scikit-learn developers, n.d.-b). Core samples have at least min_samples neighbours within distance eps; a cluster consists of connected core samples and nearby non-core samples, and samples that are not close to any core sample are outliers.
  summary_de: DBSCAN versteht Cluster als Bereiche hoher Dichte, getrennt durch Bereiche geringer Dichte, sodass Cluster anders als bei k-Means beliebige Formen haben können (scikit-learn developers, n.d.-b). Kernpunkte haben mindestens min_samples Nachbarn im Abstand eps; ein Cluster besteht aus verbundenen Kernpunkten und nahe gelegenen Nicht-Kernpunkten, und Punkte, die keinem Kernpunkt nahe sind, gelten als Ausreißer.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: hermitian-dot-product
  type: Concept
  name_en: Hermitian dot product
  name_de: Hermitesches Skalarprodukt
- id: atlassian
  type: Organisation
  name_en: Atlassian
  name_de: Atlassian
  summary_en: Atlassian is a software company founded by Mike Cannon-Brookes and Scott Farquhar that makes team collaboration tools such as Jira and Confluence (Atlassian). It reports more than 300,000 customers.
  summary_de: Atlassian ist ein Softwareunternehmen, gegründet von Mike Cannon-Brookes und Scott Farquhar, das Werkzeuge für die Zusammenarbeit im Team wie Jira und Confluence herstellt (Atlassian). Nach eigenen Angaben hat es mehr als 300.000 Kunden.
  sources:
  - https://www.atlassian.com/company
- id: confluence-space
  type: Concept
  name_en: Space (Confluence)
  name_de: Bereich (Confluence)
  aliases:
  - Confluence space
  summary_en: In Confluence, a space is a container where a team creates, stores and collaborates on work related to a team, shared project or initiative, a collaborative workspace or knowledge base (Atlassian, n.d.-a). Teams create as many spaces as they need, for example one knowledge base for how-to and troubleshooting guides or a collaboration space per product launch.
  summary_de: In Confluence ist ein Bereich (Space) ein Container, in dem ein Team Arbeit zu einem Team, gemeinsamen Projekt oder Vorhaben erstellt, ablegt und gemeinsam bearbeitet, ein gemeinsamer Arbeitsbereich oder eine Wissensdatenbank (Atlassian, n.d.-a). Teams legen so viele Bereiche an wie nötig, etwa eine Wissensdatenbank für Anleitungen und Fehlerbehebung oder einen Bereich je Produkteinführung.
  sources:
  - https://support.atlassian.com/confluence-cloud/docs/what-is-a-space/
- id: confluence-page-tree
  type: Concept
  name_en: Page tree (Confluence)
  name_de: Seitenbaum (Confluence)
- id: cql
  type: Technology
  name_en: Confluence Query Language (CQL)
  name_de: Confluence Query Language (CQL)
  aliases:
  - CQL
  summary_en: The Confluence Query Language (CQL) defines structured queries for the advanced search of the Confluence REST API (Atlassian, n.d.-b). A simple query, or clause, consists of a field, an operator and one or more values, and results take the same form as the content model returned by the Content REST API.
  summary_de: Die Confluence Query Language (CQL) legt strukturierte Abfragen für die erweiterte Suche der Confluence-REST-API fest (Atlassian, n.d.-b). Eine einfache Abfrage, eine Klausel, besteht aus einem Feld, einem Operator und einem oder mehreren Werten, und die Ergebnisse haben dieselbe Form wie das Inhaltsmodell der Content-REST-API.
  sources:
  - https://developer.atlassian.com/server/confluence/advanced-searching-using-cql/
- id: llmlingua
  type: Method
  name_en: LLMLingua
  name_de: LLMLingua
  summary_en: LLMLingua is a coarse-to-fine prompt compression method with a budget controller, token-level iterative compression and instruction tuning to align a small and a large language model (Jiang et al., 2023). On GSM8K, BBH, ShareGPT and arXiv data it allowed up to 20 times compression with little loss in performance, speeding up inference and lowering cost.
  summary_de: LLMLingua ist ein Verfahren zur Prompt-Kompression vom Groben zum Feinen mit Budgetsteuerung, iterativer Kompression auf Token-Ebene und Instruction Tuning, um ein kleines und ein großes Sprachmodell aufeinander abzustimmen (Jiang et al., 2023). Auf GSM8K, BBH, ShareGPT und arXiv-Daten erlaubte es bis zu 20-fache Kompression bei geringem Leistungsverlust und beschleunigte so die Inferenz bei niedrigeren Kosten.
  sources:
  - https://arxiv.org/abs/2310.05736
- id: clause-extraction
  type: Method
  name_en: Clause extraction
  name_de: Klauselextraktion
- id: contract-type-classification
  type: Method
  name_en: Contract type classification
  name_de: Klassifikation des Vertragstyps

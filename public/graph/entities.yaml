- id: llmlingua
  type: Method
  name_en: LLMLingua
  name_de: LLMLingua
  summary_en: LLMLingua is a coarse-to-fine prompt compression method with a budget controller, token-level iterative compression and instruction tuning to align a small and a large language model (Jiang et al., 2023). On GSM8K, BBH, ShareGPT and arXiv data it allowed up to 20 times compression with little loss in performance, speeding up inference and lowering cost.
  summary_de: LLMLingua ist ein Verfahren zur Prompt-Kompression vom Groben zum Feinen mit Budgetsteuerung, iterativer Kompression auf Token-Ebene und Instruction Tuning, um ein kleines und ein großes Sprachmodell aufeinander abzustimmen (Jiang et al., 2023). Auf GSM8K, BBH, ShareGPT und arXiv-Daten erlaubte es bis zu 20-fache Kompression bei geringem Leistungsverlust und beschleunigte so die Inferenz bei niedrigeren Kosten.
  sources:

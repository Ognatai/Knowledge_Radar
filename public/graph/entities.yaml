- id: expected-validation-performance
  type: Method
  name_en: Expected validation performance
  name_de: Erwartete Validierungsleistung
  summary_en: Expected validation performance reports the expected best validation score of a model as a function of computation budget, such as the number of hyperparameter search trials or training time (Dodge et al., 2019). Its authors found published model comparisons whose conclusions would have changed with more or less computation and recommend reporting it alongside test results.
  summary_de: Expected Validation Performance gibt den erwarteten besten Validierungswert eines Modells in Abhängigkeit vom Rechenbudget an, etwa der Zahl der Durchläufe bei der Hyperparameter-Suche oder der Trainingszeit (Dodge et al., 2019). Die Autoren fanden veröffentlichte Modellvergleiche, deren Schlussfolgerung sich mit mehr oder weniger Rechenaufwand geändert hätte, und empfehlen, sie neben Testergebnissen zu berichten.
  sources:
  - https://arxiv.org/abs/1909.03004
- id: clip
  type: Method
  name_en: CLIP
  name_de: CLIP
  summary_en: CLIP learns image representations from natural language supervision by predicting which caption goes with which image, trained on 400 million image-text pairs from the internet (Radford et al., 2021). Natural language then names visual concepts, enabling zero-shot transfer; CLIP matched the accuracy of the original ResNet-50 on ImageNet without using any of its 1.28 million training examples.
  summary_de: CLIP lernt Bildrepräsentationen aus natürlichsprachlicher Überwachung, indem es vorhersagt, welche Bildunterschrift zu welchem Bild gehört, trainiert auf 400 Millionen Bild-Text-Paaren aus dem Internet (Radford et al., 2021). Natürliche Sprache benennt danach visuelle Konzepte und ermöglicht Zero-Shot-Transfer; CLIP erreichte die Accuracy des ursprünglichen ResNet-50 auf ImageNet, ohne eines seiner 1,28 Millionen Trainingsbeispiele zu nutzen.
  sources:
  - https://arxiv.org/abs/2103.00020
- id: flamingo
  type: Method
  name_en: Flamingo
  name_de: Flamingo
  summary_en: Flamingo is a family of visual language models that bridges pretrained vision-only and language-only models and handles arbitrarily interleaved sequences of images, videos and text (Alayrac et al., 2022). Trained on large multimodal web corpora, it learns new image and video tasks in context from a few examples and outperformed models fine-tuned on thousands of times more task-specific data on many benchmarks.
  summary_de: Flamingo ist eine Familie visueller Sprachmodelle, die vortrainierte reine Bild- und reine Sprachmodelle verbindet und beliebig verschränkte Folgen aus Bildern, Videos und Text verarbeitet (Alayrac et al., 2022). Auf großen multimodalen Webkorpora trainiert, lernt es neue Bild- und Videoaufgaben im Kontext aus wenigen Beispielen und übertraf auf vielen Benchmarks Modelle, die mit tausendfach mehr aufgabenspezifischen Daten feinjustiert waren.
  sources:
  - https://arxiv.org/abs/2204.14198
- id: blip-2
  type: Method
  name_en: BLIP-2
  name_de: BLIP-2
  summary_en: BLIP-2 is a pre-training strategy that bootstraps vision-language learning from a frozen pretrained image encoder and a frozen large language model, bridged by a lightweight Querying Transformer trained in two stages (Li et al., 2023). With far fewer trainable parameters it reached state-of-the-art results, outperforming Flamingo-80B by 8.7% on zero-shot VQAv2 with 54 times fewer trainable parameters.
  summary_de: BLIP-2 ist eine Vortrainingsstrategie, die Bild-Sprach-Lernen aus einem eingefrorenen vortrainierten Bild-Encoder und einem eingefrorenen großen Sprachmodell aufbaut, verbunden durch einen leichten, in zwei Stufen trainierten Querying Transformer (Li et al., 2023). Mit deutlich weniger trainierbaren Parametern erreichte es Bestwerte und übertraf Flamingo-80B auf Zero-Shot-VQAv2 um 8,7 % bei 54-mal weniger trainierbaren Parametern.
  sources:
  - https://arxiv.org/abs/2301.12597
- id: llava
  type: Method
  name_en: LLaVA
  name_de: LLaVA
  summary_en: LLaVA (Large Language and Vision Assistant) is a large multimodal model that connects a vision encoder with an LLM and is trained end to end by visual instruction tuning on language-image instruction data generated with language-only GPT-4 (Liu et al., 2023). It showed multimodal chat abilities and, fine-tuned on Science QA together with GPT-4, reached 92.53% accuracy.
  summary_de: LLaVA (Large Language and Vision Assistant) ist ein großes multimodales Modell, das einen Bild-Encoder mit einem LLM verbindet und durchgängig per visuellem Instruction Tuning auf Bild-Sprach-Anweisungsdaten trainiert wird, die mit dem rein sprachlichen GPT-4 erzeugt wurden (Liu et al., 2023). Es zeigte multimodale Chat-Fähigkeiten und erreichte, auf Science QA feinjustiert und mit GPT-4 kombiniert, 92,53 % Accuracy.
  sources:
  - https://arxiv.org/abs/2304.08485

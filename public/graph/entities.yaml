- id: raptor
  type: Method
  name_en: RAPTOR
  name_de: RAPTOR
  summary_en: RAPTOR recursively embeds, clusters and summarises text chunks to build a tree with different levels of summarisation from the bottom up, and retrieves from this tree at inference time to integrate information across long documents (Sarthi et al., 2024). Combined with GPT-4 it improved the best result on the QuALITY benchmark by 20 percentage points in accuracy.
  summary_de: RAPTOR bettet Textabschnitte rekursiv ein, clustert und fasst sie zusammen und baut so von unten einen Baum mit unterschiedlichen Zusammenfassungsebenen auf, aus dem es bei der Inferenz abruft, um Informationen aus langen Dokumenten zu verbinden (Sarthi et al., 2024). Zusammen mit GPT-4 verbesserte es das beste Ergebnis auf dem Benchmark QuALITY um 20 Prozentpunkte Accuracy.
  sources:
  - https://arxiv.org/abs/2401.18059
- id: support-vector-regression
  type: Method
  name_en: Support vector regression
  name_de: Support-Vector-Regression
  summary_en: Support vector regression (SVR) extends support vector classification to regression; the model depends only on a subset of the training data because the cost function ignores samples whose prediction is close to their target (scikit-learn developers, n.d.-k). scikit-learn offers SVR, NuSVR and LinearSVR.
  summary_de: Support Vector Regression (SVR) überträgt die Support-Vector-Klassifikation auf Regression; das Modell hängt nur von einem Teil der Trainingsdaten ab, weil die Kostenfunktion Beispiele ignoriert, deren Vorhersage nahe am Zielwert liegt (scikit-learn developers, n.d.-k). scikit-learn bietet SVR, NuSVR und LinearSVR.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: kernel-trick
  type: Method
  name_en: Kernel trick
  name_de: Kernel-Trick
  summary_en: The kernel trick lets support vector machines work in a higher, possibly infinite-dimensional feature space without computing the mapping explicitly, because the dual formulation only needs inner products, which a kernel function such as the linear, polynomial, RBF or sigmoid kernel provides (scikit-learn developers, n.d.-k). It cannot be applied to the primal hinge-loss formulation used by LinearSVC.
  summary_de: Der Kernel-Trick erlaubt Support Vector Machines, in einem höher-, möglicherweise unendlichdimensionalen Merkmalsraum zu arbeiten, ohne die Abbildung explizit zu berechnen, weil die duale Formulierung nur Skalarprodukte braucht, die eine Kernfunktion wie der lineare, polynomielle, RBF- oder Sigmoid-Kernel liefert (scikit-learn developers, n.d.-k). Auf die primale Formulierung mit Hinge Loss, die LinearSVC nutzt, lässt er sich nicht anwenden.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: soft-margin
  type: Method
  name_en: Soft margin
  name_de: Soft Margin
  summary_en: 'A soft margin lets a support vector machine separate classes that are not perfectly separable: some samples may lie within the margin or on the wrong side at a distance ζ, penalised in the objective (scikit-learn developers, n.d.-k). The parameter C controls the strength of this penalty and acts as an inverse regularisation parameter.'
  summary_de: 'Ein weicher Rand (Soft Margin) erlaubt einer Support Vector Machine, Klassen zu trennen, die nicht vollständig trennbar sind: Einzelne Beispiele dürfen im Randbereich oder auf der falschen Seite im Abstand ζ liegen und werden in der Zielfunktion bestraft (scikit-learn developers, n.d.-k). Der Parameter C steuert die Stärke dieser Strafe und wirkt als inverser Regularisierungsparameter.'
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: hinge-loss
  type: Method
  name_en: Hinge loss
  name_de: Hinge Loss
  summary_en: The hinge loss, max(0, 1 − y·f(x)), is zero for samples classified correctly with a margin of at least 1 and grows linearly otherwise (scikit-learn developers, n.d.-k). The primal problem of a linear support vector machine can be written as minimising ½‖w‖² plus C times the sum of hinge losses, the form LinearSVC optimises directly.
  summary_de: Der Hinge Loss, max(0, 1 − y·f(x)), ist null für Beispiele, die mit einem Rand von mindestens 1 richtig klassifiziert sind, und wächst sonst linear (scikit-learn developers, n.d.-k). Das primale Problem einer linearen Support Vector Machine lässt sich als Minimierung von ½‖w‖² plus C mal die Summe der Hinge Losses schreiben, die Form, die LinearSVC direkt optimiert.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html

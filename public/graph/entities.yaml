  summary_en: VGG networks are deep convolutional networks with very small 3×3 filters that showed that increasing depth to 16 to 19 weight layers markedly improves large-scale image recognition (Simonyan & Zisserman, 2014). The team won first place in localisation and second in classification at the ImageNet Challenge 2014 and released their two best models.
  summary_de: VGG-Netze sind tiefe Convolutional Networks mit sehr kleinen 3×3-Filtern, die zeigten, dass eine Tiefe von 16 bis 19 Gewichtsschichten die Bilderkennung im großen Maßstab deutlich verbessert (Simonyan & Zisserman, 2014). Das Team belegte bei der ImageNet Challenge 2014 den ersten Platz in der Lokalisierung und den zweiten in der Klassifikation und veröffentlichte seine zwei besten Modelle.
  sources:

- id: ben-shneiderman
  type: Person
  name_en: Ben Shneiderman
  name_de: Ben Shneiderman
  summary_en: Ben Shneiderman, of the Human-Computer Interaction Laboratory at the University of Maryland, formulated the Visual Information-Seeking Mantra "overview first, zoom and filter, then details on demand" in 1996. The same paper proposes a task by data type taxonomy for information visualisation with seven data types and seven tasks.
  summary_de: Ben Shneiderman vom Human-Computer Interaction Laboratory der University of Maryland formulierte 1996 das Visual Information-Seeking Mantra „overview first, zoom and filter, then details on demand“. Dasselbe Paper schlägt eine Taxonomie für Informationsvisualisierung nach Aufgaben und Datentypen vor, mit sieben Datentypen und sieben Aufgaben.
  sources:
  - https://www.cs.umd.edu/~ben/papers/Shneiderman1996eyes.pdf
- id: hadley-wickham
  type: Person
  name_en: Hadley Wickham
  name_de: Hadley Wickham
  summary_en: Hadley Wickham described a layered grammar of graphics in 2010, building on Wilkinson's grammar of graphics and refined while he built ggplot2, an open-source implementation for R. A grammar of graphics describes the components of a plot concisely instead of relying on named chart types such as the scatterplot.
  summary_de: Hadley Wickham beschrieb 2010 eine geschichtete Grammatik der Grafik, die auf Wilkinsons Grammar of Graphics aufbaut und bei der Entwicklung von ggplot2, einer Open-Source-Umsetzung für R, verfeinert wurde. Eine solche Grammatik beschreibt die Bestandteile einer Grafik knapp, statt sich auf benannte Diagrammtypen wie das Streudiagramm zu stützen.
  sources:
  - https://vita.had.co.nz/papers/layered-grammar.pdf
- id: llama-guard
  type: Method
  name_en: Llama Guard
  name_de: Llama Guard
  summary_en: 'Llama Guard is an LLM-based input-output safeguard for human-AI conversations: a Llama 2 7B model instruction-tuned to classify both prompts and responses against a safety risk taxonomy (Inan et al., 2023). It matched or exceeded available content moderation tools on the OpenAI Moderation Evaluation dataset and ToxicChat, and its taxonomy can be adapted to a use case through zero-shot or few-shot prompting.'
  summary_de: 'Llama Guard ist ein LLM-basierter Schutz für Ein- und Ausgaben in Gesprächen zwischen Menschen und KI: ein Llama-2-7B-Modell, das per Instruction Tuning darauf trainiert ist, Prompts und Antworten anhand einer Taxonomie von Sicherheitsrisiken zu klassifizieren (Inan et al., 2023). Auf dem OpenAI Moderation Evaluation Dataset und ToxicChat erreichte oder übertraf es verfügbare Moderationswerkzeuge, und seine Taxonomie lässt sich per Zero- oder Few-Shot-Prompting an einen Anwendungsfall anpassen.'
  sources:
  - https://arxiv.org/abs/2312.06674
- id: nemo-guardrails
  type: Technology
  name_en: NeMo Guardrails
  name_de: NeMo Guardrails
- id: natural-questions
  type: Dataset
  name_en: Natural Questions
  name_de: Natural Questions
- id: omar-khattab
  type: Person
  name_en: Omar Khattab
  name_de: Omar Khattab
  summary_en: Omar Khattab, then at Stanford University, introduced ColBERT with Matei Zaharia at SIGIR 2020. ColBERT encodes queries and documents independently with BERT and scores them with a cheap "late interaction" step that keeps fine-grained similarity while making BERT-based retrieval efficient.
  summary_de: Omar Khattab, damals an der Stanford University, stellte mit Matei Zaharia auf der SIGIR 2020 ColBERT vor. ColBERT kodiert Anfragen und Dokumente getrennt mit BERT und bewertet sie mit einem günstigen „Late Interaction“-Schritt, der feinkörnige Ähnlichkeit erhält und Retrieval mit BERT effizient macht.
  sources:
  - https://arxiv.org/abs/2004.12832
- id: ukp-lab
  type: Organisation
  name_en: UKP Lab (TU Darmstadt)
  name_de: UKP Lab (TU Darmstadt)
  aliases:
  - Ubiquitous Knowledge Processing Lab
  summary_en: The Ubiquitous Knowledge Processing (UKP) Lab is a research group in the Department of Computer Science at Technische Universität Darmstadt. Its researchers introduced BEIR in 2021, a heterogeneous benchmark of 18 public datasets for zero-shot evaluation of retrieval models, which found BM25 to be a robust baseline.
  summary_de: Das Ubiquitous Knowledge Processing (UKP) Lab ist eine Forschungsgruppe im Fachbereich Informatik der Technischen Universität Darmstadt. Seine Forschenden stellten 2021 BEIR vor, einen heterogenen Benchmark aus 18 öffentlichen Datensätzen zur Zero-Shot-Evaluation von Retrieval-Modellen, in dem sich BM25 als robuste Baseline erwies.
  sources:
  - https://arxiv.org/abs/2104.08663
- id: stanford-university
  type: Organisation
  name_en: Stanford University
  name_de: Stanford University
  aliases:
  - Stanford
  summary_en: Stanford University is a research university in California. Work from its Computer Science Department cited here includes GloVe (2014), a global log-bilinear regression model for word vectors trained on word-word co-occurrence counts, and ColBERT (2020), a late-interaction retrieval model built on BERT.
  summary_de: Die Stanford University ist eine Forschungsuniversität in Kalifornien. Zu den hier zitierten Arbeiten ihres Computer Science Department gehören GloVe (2014), ein globales log-bilineares Regressionsmodell für Wortvektoren auf Basis von Kookkurrenzzählungen, und ColBERT (2020), ein Retrieval-Modell mit Late Interaction auf Basis von BERT.
  sources:
  - https://nlp.stanford.edu/pubs/glove.pdf
  - https://arxiv.org/abs/2004.12832
- id: ibm
  type: Organisation
  name_en: IBM
  name_de: IBM
  summary_en: IBM is a technology company whose research labs produced foundational work cited here, among them BLEU, developed at the IBM T. J. Watson Research Center in 2002 as a quick, inexpensive and language-independent automatic metric for machine translation, and Codd's relational model of data from the IBM Research Laboratory in San Jose in 1970.
  summary_de: IBM ist ein Technologieunternehmen, aus dessen Forschungslaboren hier zitierte Grundlagenarbeiten stammen, darunter BLEU, 2002 am IBM T. J. Watson Research Center als schnelle, günstige und sprachunabhängige automatische Metrik für maschinelle Übersetzung entwickelt, sowie Codds relationales Datenmodell aus dem IBM Research Laboratory in San José von 1970.
  sources:
  - https://aclanthology.org/P02-1040/
  - https://www.seas.upenn.edu/~zives/03f/cis550/codd.pdf
- id: hugging-face
  type: Organisation
  name_en: Hugging Face
  name_de: Hugging Face
  summary_en: Hugging Face is the company whose researchers released DistilBERT in 2019, a smaller general-purpose language model obtained by knowledge distillation during pre-training. DistilBERT reduced the size of a BERT model by 40% while retaining 97% of its language understanding capabilities and running 60% faster.
  summary_de: Hugging Face ist das Unternehmen, dessen Forschende 2019 DistilBERT veröffentlichten, ein kleineres Allzweck-Sprachmodell, das durch Knowledge Distillation während des Vortrainings entsteht. DistilBERT verkleinerte ein BERT-Modell um 40 %, behielt 97 % seines Sprachverständnisses und war 60 % schneller.
  sources:
  - https://arxiv.org/abs/1910.01108
- id: thomas-dietterich
  type: Person
  name_en: Thomas G. Dietterich
  name_de: Thomas G. Dietterich
  summary_en: Thomas G. Dietterich compared approximate statistical tests for comparing supervised classification learning algorithms in a 1998 paper. He found McNemar's test preferable to the difference-of-proportions test and introduced the 5×2-fold cross-validated paired t-test.
  summary_de: Thomas G. Dietterich verglich 1998 in einem Artikel näherungsweise statistische Tests zum Vergleich überwachter Klassifikationsverfahren. Er zog den McNemar-Test dem Test auf Differenz von Anteilen vor und führte den 5×2-fach kreuzvalidierten gepaarten t-Test ein.
  sources:
  - https://arxiv.org/abs/1811.12808
- id: roy-fielding
  type: Person
  name_en: Roy T. Fielding
  name_de: Roy T. Fielding
  aliases:
  - Roy Fielding
  summary_en: Roy T. Fielding defined Representational State Transfer (REST) in chapter 5 of his 2000 dissertation at the University of California, Irvine, as an architectural style for distributed hypermedia systems with a uniform connector interface. He is also lead author of RFC 9110, which specifies HTTP semantics.
  summary_de: Roy T. Fielding definierte Representational State Transfer (REST) im fünften Kapitel seiner Dissertation an der University of California, Irvine, aus dem Jahr 2000 als Architekturstil für verteilte Hypermedia-Systeme mit einheitlicher Schnittstelle. Er ist außerdem Erstautor von RFC 9110, das die Semantik von HTTP festlegt.
  sources:
  - https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
  - https://www.rfc-editor.org/rfc/rfc9110.html

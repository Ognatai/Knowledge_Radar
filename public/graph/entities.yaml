  name_en: Contract playbook
  name_de: Vertrags-Playbook
- id: redlining
  type: Method
  name_en: Redlining
  name_de: Redlining
- id: lenet
  type: Method
  name_en: LeNet
  name_de: LeNet
- id: alexnet
  type: Method
  name_en: AlexNet
  name_de: AlexNet
- id: vgg
  type: Method
  name_en: VGG
  name_de: VGG
  summary_en: VGG networks are deep convolutional networks with very small 3×3 filters that showed that increasing depth to 16 to 19 weight layers markedly improves large-scale image recognition (Simonyan & Zisserman, 2014). The team won first place in localisation and second in classification at the ImageNet Challenge 2014 and released their two best models.
  summary_de: VGG-Netze sind tiefe Convolutional Networks mit sehr kleinen 3×3-Filtern, die zeigten, dass eine Tiefe von 16 bis 19 Gewichtsschichten die Bilderkennung im großen Maßstab deutlich verbessert (Simonyan & Zisserman, 2014). Das Team belegte bei der ImageNet Challenge 2014 den ersten Platz in der Lokalisierung und den zweiten in der Klassifikation und veröffentlichte seine zwei besten Modelle.
  sources:
  - https://arxiv.org/abs/1409.1556
- id: convolution
  type: Concept
  name_en: Convolution
  name_de: Faltung
  summary_en: Convolution is a specialised kind of linear operation that gives convolutional networks their name; these networks process data with a grid-like topology such as time series (1-D) or images (2-D) (Goodfellow et al., 2016). In network terminology, the first argument of the convolution is the input, the second the kernel, and the output the feature map.
  summary_de: Die Faltung (Convolution) ist eine spezielle lineare Operation, nach der Convolutional Networks benannt sind; diese verarbeiten Daten mit gitterartiger Struktur wie Zeitreihen (1-D) oder Bilder (2-D) (Goodfellow et al., 2016). In der Terminologie dieser Netze ist das erste Argument der Faltung die Eingabe, das zweite der Kernel und das Ergebnis die Feature Map.
  sources:
  - https://www.deeplearningbook.org/contents/convnets.html
- id: pooling
  type: Concept
  name_en: Pooling
  name_de: Pooling
  summary_en: In a convolutional network, a pooling function replaces the output at a location with a summary statistic of nearby outputs, for example the maximum within a rectangular neighbourhood (max pooling) or its average (Goodfellow et al., 2016). A typical convolutional layer applies convolutions, then a nonlinearity such as ReLU, and then pooling.
  summary_de: In einem Convolutional Network ersetzt eine Pooling-Funktion die Ausgabe an einer Stelle durch eine zusammenfassende Kennzahl der benachbarten Ausgaben, etwa das Maximum in einer rechteckigen Umgebung (Max Pooling) oder deren Mittelwert (Goodfellow et al., 2016). Eine typische Faltungsschicht wendet Faltungen an, dann eine Nichtlinearität wie ReLU und dann Pooling.
  sources:
  - https://www.deeplearningbook.org/contents/convnets.html
- id: transfer-learning
  type: Concept
  name_en: Transfer learning
  name_de: Transfer Learning
  summary_en: Transfer learning reuses features learned on one task for another; in deep convolutional networks, first-layer features resemble general Gabor filters and colour blobs, while higher layers become specific to the original task (Yosinski et al., 2014). Transferability decreases as tasks diverge, yet features transferred even from distant tasks beat random features, and initialising with transferred features can improve generalisation after fine-tuning.
  summary_de: Transfer Learning nutzt auf einer Aufgabe gelernte Merkmale für eine andere; in tiefen Convolutional Networks ähneln die Merkmale der ersten Schicht allgemeinen Gabor-Filtern und Farbflecken, während höhere Schichten auf die ursprüngliche Aufgabe spezialisiert sind (Yosinski et al., 2014). Die Übertragbarkeit nimmt mit dem Abstand der Aufgaben ab, doch selbst von entfernten Aufgaben übertragene Merkmale schlagen zufällige, und eine Initialisierung mit übertragenen Merkmalen kann die Generalisierung nach dem Fine-Tuning verbessern.
  sources:
  - https://arxiv.org/abs/1411.1792
- id: dsm-directive
  type: Regulation
  name_en: Directive (EU) 2019/790 on copyright in the Digital Single Market (DSM Directive)
  name_de: Richtlinie (EU) 2019/790 über das Urheberrecht im digitalen Binnenmarkt (DSM-Richtlinie)
  aliases:
  - DSM Directive
  - DSM-Richtlinie
  summary_en: Directive (EU) 2019/790 on copyright and related rights in the Digital Single Market further harmonises copyright law for digital and cross-border uses of protected content, with rules on exceptions and limitations, on facilitating licences and on a well-functioning marketplace for the exploitation of works (Art. 1(1)). Its text and data mining exceptions are central to the debate on AI training data; it also amended Directives 96/9/EC and 2001/29/EC (Art. 24).
  summary_de: Die Richtlinie (EU) 2019/790 über das Urheberrecht und die verwandten Schutzrechte im digitalen Binnenmarkt harmonisiert das Urheberrecht weiter mit Blick auf die digitale und grenzüberschreitende Nutzung geschützter Inhalte, mit Vorschriften zu Ausnahmen und Beschränkungen, zur Erleichterung der Lizenzvergabe und zum Funktionieren des Marktes für die Verwertung von Werken (Art. 1 Abs. 1). Ihre Ausnahmen für Text und Data Mining sind zentral für die Debatte über KI-Trainingsdaten; sie änderte außerdem die Richtlinien 96/9/EG und 2001/29/EG (Art. 24).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32019L0790
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L0790
- id: urhg
  type: Regulation
  name_en: German Copyright Act (UrhG)
  name_de: Urheberrechtsgesetz (UrhG)
  aliases:
  - UrhG
  summary_en: 'The German Copyright Act (Urheberrechtsgesetz, UrhG) protects authors of works of literature, science and art (§ 1 UrhG). For AI training, § 44b UrhG is central: it permits reproductions of lawfully accessible works for text and data mining, the automated analysis of works to obtain information on patterns, trends and correlations, unless the rights holder has reserved this use, which for works available online must be done in machine-readable form.'
  summary_de: 'Das Urheberrechtsgesetz (UrhG) schützt die Urheber von Werken der Literatur, Wissenschaft und Kunst (§ 1 UrhG). Für KI-Training ist § 44b UrhG zentral: Er erlaubt Vervielfältigungen rechtmäßig zugänglicher Werke für Text und Data Mining, die automatisierte Analyse von Werken, um Informationen insbesondere über Muster, Trends und Korrelationen zu gewinnen, sofern sich der Rechtsinhaber diese Nutzung nicht vorbehalten hat; bei online zugänglichen Werken muss der Vorbehalt maschinenlesbar sein.'
  sources:
  - https://www.gesetze-im-internet.de/urhg/
- id: text-and-data-mining
  type: Concept
  name_en: Text and data mining (TDM)
  name_de: Text und Data Mining (TDM)
  aliases:
  - TDM
- id: fair-use
  type: Concept
  name_en: Fair use
  name_de: Fair Use
- id: memorisation
  type: Concept
  name_en: Memorisation in models
  name_de: Memorisierung in Modellen
  aliases:
  - memorization
  summary_en: Memorisation means that a model stores individual training examples verbatim; Carlini et al. (2020) extracted hundreds of verbatim sequences from GPT-2's training data by querying the model, including personally identifiable information, code and UUIDs, even when a sequence appeared in only one training document. Larger models were more vulnerable than smaller ones.
  summary_de: Memorisierung bedeutet, dass ein Modell einzelne Trainingsbeispiele wörtlich speichert; Carlini et al. (2020) extrahierten durch Abfragen von GPT-2 Hunderte wörtlicher Sequenzen aus dessen Trainingsdaten, darunter personenbezogene Daten, Code und UUIDs, selbst wenn eine Sequenz nur in einem einzigen Trainingsdokument vorkam. Größere Modelle waren anfälliger als kleinere.
  sources:
  - https://arxiv.org/abs/2012.07805
- id: laion
  type: Organisation
  name_en: LAION
  name_de: LAION
  summary_en: LAION is a non-profit organisation with members worldwide that aims to make large-scale machine learning models, datasets and code available to the public, releasing open datasets, code and models (LAION). In Germany, the Higher Regional Court of Hamburg ruled in 2025 that LAION's download of a photo for a training dataset was covered by the text and data mining exception, because the rights reservation was not machine-readable (OLG Hamburg 2025).
  summary_de: LAION ist eine gemeinnützige Organisation mit Mitgliedern weltweit, die große Modelle, Datensätze und Code für maschinelles Lernen öffentlich verfügbar machen will und dazu offene Datensätze, Code und Modelle veröffentlicht (LAION). In Deutschland entschied das Hanseatische Oberlandesgericht Hamburg 2025, dass der Download eines Fotos durch LAION für einen Trainingsdatensatz von der Schranke für Text und Data Mining gedeckt war, weil der Nutzungsvorbehalt nicht maschinenlesbar war (OLG Hamburg 2025).
  sources:
  - https://laion.ai/about/
  - https://medien-internet-und-recht.de/volltext.php?mir_dok_id=3526
- id: gema
  type: Organisation
  name_en: GEMA
  name_de: GEMA
  summary_en: GEMA (Gesellschaft für musikalische Aufführungs- und mechanische Vervielfältigungsrechte) is a German association representing more than 100,000 members, namely composers, lyricists and music publishers (GEMA). Members transfer the usage rights in their works to GEMA, which licenses them to music users and distributes the income as royalties. In 2025 the Regional Court of Munich I largely upheld GEMA's claim against OpenAI over ChatGPT storing and reproducing song lyrics (LG München I, 11 November 2025, 42 O 14139/24).
  summary_de: Die GEMA (Gesellschaft für musikalische Aufführungs- und mechanische Vervielfältigungsrechte) ist ein Verein, der die Interessen von über 100.000 Mitgliedern vertritt, also Komponistinnen und Komponisten, Textdichtern und Musikverlagen (GEMA). Die Mitglieder übertragen ihr die Nutzungsrechte an ihren Werken; die GEMA vergibt Lizenzen an Musiknutzende und verteilt die Einnahmen als Tantiemen. 2025 gab das Landgericht München I einer Klage der GEMA gegen OpenAI wegen der Speicherung und Ausgabe von Liedtexten durch ChatGPT weitgehend statt (LG München I, 11.11.2025, 42 O 14139/24).
  sources:
  - https://www.gema.de/de/die-gema
  - https://www.lto.de/recht/nachrichten/n/42o1413924-lg-muenchen-i-gema-openai-chatgpt-songtexte-ki
- id: basel-iii
  type: Regulation
  name_en: Basel III
  name_de: Basel III
  summary_en: Basel III is the set of post-crisis reforms agreed by the Basel Committee on Banking Supervision, now integrated into the consolidated Basel Framework (BIS, n.d.). It includes the initial 2010/2011 framework for more resilient banks, the Liquidity Coverage Ratio (2013), the Net Stable Funding Ratio (2014), revised market risk requirements (2019) and the 2017 finalisation of the post-crisis reforms, with transitional arrangements for 2017 to 2028.
  summary_de: Basel III umfasst die nach der Finanzkrise vom Basler Ausschuss für Bankenaufsicht vereinbarten Reformen, die inzwischen in das konsolidierte Basel Framework eingegangen sind (BIS, n.d.). Dazu gehören der ursprüngliche Rahmen von 2010/2011 für widerstandsfähigere Banken, die Liquiditätsdeckungsquote (2013), die strukturelle Liquiditätsquote (2014), überarbeitete Anforderungen an das Marktrisiko (2019) und die Finalisierung der Reformen 2017 mit Übergangsregelungen für 2017 bis 2028.
  sources:
  - https://www.bis.org/bcbs/basel3.htm
- id: crr-iii-and-crd-vi
  type: Regulation
  name_en: CRR III (Regulation (EU) 2024/1623) and CRD VI (Directive (EU) 2024/1619)
  name_de: CRR III (Verordnung (EU) 2024/1623) und CRD VI (Richtlinie (EU) 2024/1619)
  aliases:
  - CRR III
  - CRD VI
  summary_en: CRR III, Regulation (EU) 2024/1623, amends the Capital Requirements Regulation (EU) No 575/2013 as regards requirements for credit risk, credit valuation adjustment risk, operational risk, market risk and the output floor. CRD VI, Directive (EU) 2024/1619, amends the Capital Requirements Directive 2013/36/EU as regards supervisory powers, sanctions, third-country branches and environmental, social and governance risks.
  summary_de: CRR III, die Verordnung (EU) 2024/1623, ändert die Kapitaladäquanzverordnung (EU) Nr. 575/2013 im Hinblick auf Vorschriften für das Kreditrisiko, das Risiko einer Anpassung der Kreditbewertung, das operationelle Risiko, das Marktrisiko und die Eigenmitteluntergrenze (Output Floor). CRD VI, die Richtlinie (EU) 2024/1619, ändert die Eigenkapitalrichtlinie 2013/36/EU im Hinblick auf Aufsichtsbefugnisse, Sanktionen, Zweigstellen aus Drittländern sowie Umwelt-, Sozial- und Unternehmensführungsrisiken.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024R1623
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1623
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024L1619
- id: esrb
  type: Organisation
  name_en: European Systemic Risk Board (ESRB)
  name_de: Europäischer Ausschuss für Systemrisiken (ESRB)
  aliases:
  - ESRB
  summary_en: The European Systemic Risk Board (ESRB), seated in Frankfurt am Main, is part of the European System of Financial Supervision (Art. 1 Regulation (EU) No 1092/2010). It is responsible for the macro-prudential oversight of the Union's financial system, contributing to the prevention or mitigation of systemic risks to financial stability so as to avoid periods of widespread financial distress (Art. 3(1)).
  summary_de: Der Europäische Ausschuss für Systemrisiken (ESRB) mit Sitz in Frankfurt am Main ist Teil des Europäischen Finanzaufsichtssystems (Art. 1 Verordnung (EU) Nr. 1092/2010). Er ist für die Makroaufsicht über das Finanzsystem der Union zuständig und trägt dazu bei, Systemrisiken für die Finanzstabilität abzuwenden oder einzudämmen, damit Phasen weit verbreiteter finanzieller Notlagen vorgebeugt werden kann (Art. 3 Abs. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32010R1092
- id: capital-buffer
  type: Concept
  name_en: Capital buffer
  name_de: Kapitalpuffer
  summary_en: Capital buffers are own funds that institutions must or may be required to hold in addition to the minimum own funds requirements; the CRD defines the capital conservation buffer, the institution-specific countercyclical buffer, the G-SII and O-SII buffers for systemically important institutions and the systemic risk buffer, which together form the combined buffer requirement (Art. 128 CRD).
  summary_de: Kapitalpuffer sind Eigenmittel, die Institute zusätzlich zu den Mindesteigenmittelanforderungen vorhalten müssen oder vorzuhalten verpflichtet werden können; die CRD bestimmt den Kapitalerhaltungspuffer, den institutsspezifischen antizyklischen Kapitalpuffer, die G-SRI- und O-SRI-Puffer für systemrelevante Institute und den Systemrisikopuffer, die zusammen die kombinierte Kapitalpufferanforderung bilden (Art. 128 CRD).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02013L0036-20260711
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02013L0036-20260711
- id: leverage-ratio
  type: Concept
  name_en: Leverage ratio
  name_de: Verschuldungsquote (Leverage Ratio)
  summary_en: The leverage ratio is an institution's capital measure, its Tier 1 capital, divided by its total exposure measure, expressed as a percentage (Art. 429(2)–(3) CRR). Institutions must at all times maintain a leverage ratio of 3%, and global systemically important institutions an additional leverage ratio buffer (Art. 92(1)(d) and (1a) CRR).
  summary_de: Die Verschuldungsquote ist der Quotient aus der Kapitalmessgröße eines Instituts, seinem Kernkapital, und seiner Gesamtrisikopositionsmessgröße, angegeben als Prozentsatz (Art. 429 Abs. 2 und 3 CRR). Institute müssen jederzeit eine Verschuldungsquote von 3 % einhalten, global systemrelevante Institute zusätzlich einen Puffer der Verschuldungsquote (Art. 92 Abs. 1 Buchst. d und Abs. 1a CRR).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02013R0575-20260626
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02013R0575-20260626
- id: output-floor
  type: Concept
  name_en: Output floor
  name_de: Output Floor
  summary_en: 'The output floor, introduced by CRR III, sets a lower bound on risk-weighted assets: an institution''s total risk exposure amount is the higher of its un-floored amount and 72.5% of the amount calculated with the standardised approaches (Art. 92(3) CRR). Member States may, under conditions, apply the un-floored amount for institutions in a group whose parent is in the same Member State.'
  summary_de: 'Die Eigenmitteluntergrenze (Output Floor), mit CRR III eingeführt, setzt eine Untergrenze für den Gesamtrisikobetrag: Der Gesamtrisikobetrag eines Instituts ist der höhere Wert aus dem Betrag ohne Untergrenze und 72,5 % des nach Standardansätzen berechneten Betrags (Art. 92 Abs. 3 CRR). Mitgliedstaaten können unter Bedingungen für Institute einer Gruppe mit Mutterinstitut im selben Mitgliedstaat den Betrag ohne Untergrenze zugrunde legen.'
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02013R0575-20260626
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02013R0575-20260626
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1623
- id: irb-approach
  type: Method
  name_en: Internal ratings-based approach (IRB)
  name_de: Auf internen Ratings basierender Ansatz (IRB-Ansatz)
  aliases:
  - IRB
  summary_en: Under the internal ratings-based approach (IRB approach), institutions calculate their risk-weighted exposure amounts for credit risk on the basis of their own rating systems, with permission from the competent authority where the conditions of the CRR are met (Art. 143(1) CRR). Prior permission is required for each exposure class, each rating system and each approach to estimating loss given default (LGD) and conversion factors (Art. 143(2) CRR).
  summary_de: Beim auf internen Einstufungen basierenden Ansatz (IRB-Ansatz) berechnen Institute ihre risikogewichteten Positionsbeträge für das Kreditrisiko auf Grundlage eigener Ratingsysteme; die zuständige Behörde gestattet dies, wenn die Bedingungen der CRR erfüllt sind (Art. 143 Abs. 1 CRR). Eine vorherige Erlaubnis ist für jede Risikopositionsklasse, jedes Ratingsystem und jeden Ansatz für die Schätzung der Verlustquote bei Ausfall (LGD) und der Umrechnungsfaktoren erforderlich (Art. 143 Abs. 2 CRR).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02013R0575-20260626
- id: srep
  type: Concept
  name_en: Supervisory review and evaluation process (SREP)
  name_de: Aufsichtlicher Überprüfungs- und Bewertungsprozess (SREP)
  aliases:
  - SREP
  summary_en: In the supervisory review and evaluation process (SREP), competent authorities review the arrangements, strategies, processes and mechanisms institutions have implemented to comply with the CRD and CRR and evaluate the risks to which they are or might be exposed, including risks revealed by stress testing (Art. 97(1) CRD).
  summary_de: Im aufsichtlichen Überprüfungs- und Bewertungsprozess (SREP) überprüfen die zuständigen Behörden die Regelungen, Strategien, Verfahren und Mechanismen, die Institute zur Einhaltung von CRD und CRR geschaffen haben, und bewerten die Risiken, denen sie ausgesetzt sind oder sein könnten, einschließlich der anhand von Stresstests ermittelten Risiken (Art. 97 Abs. 1 CRD).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02013L0036-20260711
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02013L0036-20260711
- id: general-product-safety-regulation
  type: Regulation
  name_en: General Product Safety Regulation (EU) 2023/988
  name_de: Verordnung (EU) 2023/988 über die allgemeine Produktsicherheit
  aliases:
  - GPSR
  summary_en: The General Product Safety Regulation (EU) 2023/988 lays down essential rules on the safety of consumer products placed or made available on the market, to improve the functioning of the internal market while providing a high level of consumer protection (Art. 1). It repealed Directive 2001/95/EC.
  summary_de: Die Verordnung (EU) 2023/988 über die allgemeine Produktsicherheit legt wesentliche Vorschriften für die Sicherheit von Verbraucherprodukten fest, die in Verkehr gebracht oder auf dem Markt bereitgestellt werden, um die Funktionsweise des Binnenmarkts zu verbessern und ein hohes Verbraucherschutzniveau zu gewährleisten (Art. 1). Sie hob die Richtlinie 2001/95/EG auf.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R0988
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R0988
- id: european-health-data-space
  type: Regulation
  name_en: European Health Data Space Regulation (EU) 2025/327
  name_de: Verordnung (EU) 2025/327 über den europäischen Gesundheitsdatenraum
  aliases:
  - EHDS
  - European Health Data Space
  summary_en: Regulation (EU) 2025/327 establishes the European Health Data Space (EHDS) with common rules, standards, infrastructures and a governance framework to facilitate access to electronic health data for primary use and secondary use (Art. 1(1)). It specifies and complements GDPR rights regarding personal electronic health data and lays down common rules for electronic health record systems (Art. 1(2)).
  summary_de: Die Verordnung (EU) 2025/327 schafft den europäischen Gesundheitsdatenraum (EHDS) mit gemeinsamen Vorschriften, Standards, Infrastrukturen und einem Governance-Rahmen, um den Zugang zu elektronischen Gesundheitsdaten für die Primär- und Sekundärnutzung zu erleichtern (Art. 1 Abs. 1). Sie präzisiert und ergänzt die Rechte aus der DSGVO in Bezug auf personenbezogene elektronische Gesundheitsdaten und legt gemeinsame Vorschriften für Systeme für elektronische Gesundheitsakten fest (Art. 1 Abs. 2).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32025R0327
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0327
- id: product-with-digital-elements
  type: Concept
  name_en: Product with digital elements
  name_de: Produkt mit digitalen Elementen
  summary_en: Under the Cyber Resilience Act, a product with digital elements is "a software or hardware product and its remote data processing solutions, including software or hardware components being placed on the market separately" (Art. 3(1) CRA).
  summary_de: Nach der Cyberresilienz-Verordnung ist ein Produkt mit digitalen Elementen „ein Software- oder Hardwareprodukt und dessen Datenfernverarbeitungslösungen, einschließlich Software- oder Hardwarekomponenten, die getrennt in den Verkehr gebracht werden“ (Art. 3 Nr. 1 CRA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024R2847
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R2847
- id: european-ombudsman
  type: Organisation
  name_en: European Ombudsman
  name_de: Europäische Bürgerbeauftragte
  summary_en: The European Ombudsman is elected by the European Parliament and receives complaints from Union citizens and from natural or legal persons residing or registered in a Member State about maladministration in the activities of Union institutions, bodies, offices or agencies, except the CJEU acting in its judicial role (Art. 228(1) TFEU). The Ombudsman conducts inquiries on complaints or on their own initiative and reports on them.
  summary_de: Der Europäische Bürgerbeauftragte wird vom Europäischen Parlament gewählt und nimmt Beschwerden von Unionsbürgern sowie von natürlichen oder juristischen Personen mit Wohnort oder satzungsmäßigem Sitz in einem Mitgliedstaat über Missstände bei der Tätigkeit der Organe, Einrichtungen oder sonstigen Stellen der Union entgegen, mit Ausnahme des Gerichtshofs der Europäischen Union in Ausübung seiner Rechtsprechungsbefugnisse (Art. 228 Abs. 1 AEUV). Er führt aufgrund von Beschwerden oder von sich aus Untersuchungen durch und erstattet darüber Bericht.
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:12016E228
- id: enisa-regulation-2013
  type: Regulation
  name_en: ENISA Regulation (EU) No 526/2013
  name_de: ENISA-Verordnung (EU) Nr. 526/2013
  aliases:
  - Regulation (EU) No 526/2013
  summary_en: Regulation (EU) No 526/2013 established the European Union Agency for Network and Information Security (ENISA) to contribute to a high level of network and information security in the Union, to raise awareness and to promote a culture of network and information security (Art. 1(1)). It repealed Regulation (EC) No 460/2004 and was itself repealed with effect from 27 June 2019 by the Cybersecurity Act (EU) 2019/881 (Art. 68 CSA).
  summary_de: Die Verordnung (EU) Nr. 526/2013 errichtete die Agentur der Europäischen Union für Netz- und Informationssicherheit (ENISA), um zu einer hohen Netz- und Informationssicherheit in der Union beizutragen, das Problembewusstsein zu heben und eine Kultur der Netz- und Informationssicherheit zu fördern (Art. 1 Abs. 1). Sie hob die Verordnung (EG) Nr. 460/2004 auf und wurde ihrerseits mit Wirkung vom 27. Juni 2019 durch den Rechtsakt zur Cybersicherheit (EU) 2019/881 aufgehoben (Art. 68 CSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32013R0526
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32013R0526
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019R0881
- id: regulation-2025-37
  type: Regulation
  name_en: Regulation (EU) 2025/37 (managed security services)
  name_de: Verordnung (EU) 2025/37 (gemanagte Sicherheitsdienste)
  summary_en: Regulation (EU) 2025/37 of 19 December 2024 amends the Cybersecurity Act (EU) 2019/881 as regards managed security services, so that the framework for European cybersecurity certification schemes covers managed security services in addition to ICT products, services and processes (Art. 1(1)).
  summary_de: Die Verordnung (EU) 2025/37 vom 19. Dezember 2024 ändert den Rechtsakt zur Cybersicherheit (EU) 2019/881 im Hinblick auf verwaltete Sicherheitsdienste, sodass der Rahmen für europäische Schemata für die Cybersicherheitszertifizierung neben IKT-Produkten, -Diensten und -Prozessen auch verwaltete Sicherheitsdienste erfasst (Art. 1 Nr. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32025R0037
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32025R0037
- id: eucc
  type: Regulation
  name_en: EUCC certification scheme (Implementing Regulation (EU) 2024/482)
  name_de: EUCC-Zertifizierungsschema (Durchführungsverordnung (EU) 2024/482)
  aliases:
  - EUCC
  summary_en: Commission Implementing Regulation (EU) 2024/482 sets out the European Common Criteria-based cybersecurity certification scheme (EUCC) under the Cybersecurity Act (Art. 1). It applies to all ICT products, including their documentation, submitted for certification under the EUCC and to protection profiles submitted for certification as part of the ICT process.
  summary_de: Die Durchführungsverordnung (EU) 2024/482 der Kommission legt das auf den Gemeinsamen Kriterien beruhende europäische System für die Cybersicherheitszertifizierung (EUCC) nach dem Rechtsakt zur Cybersicherheit fest (Art. 1). Sie gilt für alle IKT-Produkte einschließlich ihrer Dokumentation, die zur Zertifizierung im Rahmen des EUCC vorgelegt werden, sowie für Schutzprofile, die im IKT-Prozess zur Zertifizierung vorgelegt werden.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024R0482
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R0482
- id: cybersecurity-certification
  type: Concept
  name_en: European cybersecurity certification
  name_de: Europäische Cybersicherheitszertifizierung
  summary_en: The Cybersecurity Act establishes European cybersecurity certification schemes, comprehensive sets of rules, technical requirements, standards and procedures established at Union level for the certification or conformity assessment of specific ICT products, services or processes (Art. 2(9) CSA). National schemes are adopted by national authorities for products in their scope (Art. 2(10) CSA); the EUCC, based on the Common Criteria, is a European scheme adopted under the Act.
  summary_de: Der Rechtsakt zur Cybersicherheit schafft europäische Schemata für die Cybersicherheitszertifizierung, umfassende Pakete von Vorschriften, technischen Anforderungen, Normen und Verfahren, die auf Unionsebene festgelegt werden und für die Zertifizierung oder Konformitätsbewertung bestimmter IKT-Produkte, -Dienste und -Prozesse gelten (Art. 2 Nr. 9 CSA). Nationale Schemata werden von nationalen Behörden für die jeweils erfassten Produkte erlassen (Art. 2 Nr. 10 CSA); das EUCC auf Grundlage der Gemeinsamen Kriterien ist ein europäisches Schema nach dem Rechtsakt.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32019R0881
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019R0881
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R0482
- id: edib
  type: Organisation
  name_en: European Data Innovation Board (EDIB)
  name_de: Europäischer Dateninnovationsrat (EDIB)
  aliases:
  - EDIB
  summary_en: The European Data Innovation Board (EDIB) is an expert group established by the Commission under the Data Governance Act (Art. 29 DGA). It consists of representatives of the Member States' competent authorities for data intermediation services and data altruism organisations, the EDPB, the EDPS, ENISA, the Commission, the EU SME Envoy and representatives of relevant bodies in specific sectors.
  summary_de: Der Europäische Dateninnovationsrat (EDIB) ist eine von der Kommission nach dem Daten-Governance-Rechtsakt eingesetzte Expertengruppe (Art. 29 DGA). Er besteht aus Vertretern der für Datenvermittlungsdienste und datenaltruistische Organisationen zuständigen Behörden der Mitgliedstaaten, des Europäischen Datenschutzausschusses, des Europäischen Datenschutzbeauftragten, der ENISA, der Kommission, dem KMU-Beauftragten der EU und Vertretern maßgeblicher Stellen in bestimmten Sektoren.
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R0868
- id: database-directive
  type: Regulation
  name_en: Database Directive 96/9/EC
  name_de: Datenbank-Richtlinie 96/9/EG
  aliases:
  - Directive 96/9/EC
  summary_en: Directive 96/9/EC on the legal protection of databases provides, in its Article 7, a sui generis right for database makers. Under the Data Act, this right does not apply when data is obtained from or generated by a connected product or related service within the Data Act's scope (Art. 43 Data Act), and the DSM Directive amended its exception for teaching and scientific research (Art. 24 DSM Directive).
  summary_de: Die Richtlinie 96/9/EG über den rechtlichen Schutz von Datenbanken sieht in Artikel 7 ein Schutzrecht sui generis für Datenbankhersteller vor. Nach dem Datengesetz findet dieses Recht keine Anwendung, wenn Daten mittels eines in dessen Anwendungsbereich fallenden vernetzten Produkts oder verbundenen Dienstes erlangt oder erzeugt wurden (Art. 43 Datengesetz), und die DSM-Richtlinie änderte ihre Ausnahme für Unterricht und wissenschaftliche Forschung (Art. 24 DSM-Richtlinie).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R2854
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2854
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L0790
- id: connected-product
  type: Concept
  name_en: Connected product
  name_de: Vernetztes Produkt
  summary_en: Under the Data Act, a connected product is an item that obtains, generates or collects data concerning its use or environment, can communicate product data via an electronic communications service, physical connection or on-device access, and whose primary function is not storing, processing or transmitting data on behalf of a party other than the user (Art. 2(5) Data Act).
  summary_de: Nach dem Datengesetz ist ein vernetztes Produkt ein Gegenstand, der Daten über seine Nutzung oder Umgebung erlangt, generiert oder erhebt, Produktdaten über einen elektronischen Kommunikationsdienst, eine physische Verbindung oder einen geräteinternen Zugang übermitteln kann und dessen Hauptfunktion nicht die Speicherung, Verarbeitung oder Übertragung von Daten im Namen einer anderen Partei als des Nutzers ist (Art. 2 Nr. 5 Datengesetz).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R2854
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2854
- id: cloud-switching
  type: Concept
  name_en: Switching between data processing services
  name_de: Wechsel zwischen Datenverarbeitungsdiensten
  aliases:
  - cloud switching
  summary_en: The Data Act requires providers of data processing services, such as cloud services, to enable customers to switch to another provider's service of the same type or to on-premises infrastructure, or to use several providers at the same time (Art. 23 Data Act). Providers may not impose, and must remove, pre-commercial, commercial, technical, contractual and organisational obstacles to switching.
  summary_de: Das Datengesetz verpflichtet Anbieter von Datenverarbeitungsdiensten wie Cloud-Diensten, Kunden den Wechsel zu einem gleichartigen Dienst eines anderen Anbieters oder zu IKT-Infrastruktur in eigenen Räumlichkeiten oder die gleichzeitige Nutzung mehrerer Anbieter zu ermöglichen (Art. 23 Datengesetz). Anbieter dürfen keine vorkommerziellen, gewerblichen, technischen, vertraglichen und organisatorischen Hindernisse für einen Wechsel aufzwingen und müssen solche Hindernisse beseitigen.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023R2854
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023R2854
- id: data-intermediation-service
  type: Concept
  name_en: Data intermediation service
  name_de: Datenvermittlungsdienst
  aliases:
  - data intermediary
  summary_en: Under the Data Governance Act, a data intermediation service aims to establish commercial relationships for data sharing between an undetermined number of data subjects and data holders on the one hand and data users on the other, through technical, legal or other means, including for exercising data subjects' rights; services that aggregate, enrich or transform data to add substantial value and license the result are excluded (Art. 2(11) DGA).
  summary_de: Nach dem Daten-Governance-Rechtsakt ist ein Datenvermittlungsdienst ein Dienst, mit dem durch technische, rechtliche oder sonstige Mittel Geschäftsbeziehungen zwischen einer unbestimmten Anzahl betroffener Personen oder Dateninhaber einerseits und Datennutzern andererseits zur gemeinsamen Datennutzung hergestellt werden sollen, auch zur Ausübung der Rechte betroffener Personen; ausgenommen sind Dienste, die Daten aggregieren, anreichern oder umwandeln, um ihren Wert erheblich zu steigern, und das Ergebnis lizenzieren (Art. 2 Nr. 11 DGA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R0868
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R0868
- id: data-altruism
  type: Concept
  name_en: Data altruism
  name_de: Datenaltruismus
  summary_en: Under the Data Governance Act, data altruism is the voluntary sharing of data, based on data subjects' consent for personal data or data holders' permission for non-personal data, without a reward beyond compensation for costs, for objectives of general interest such as healthcare, combating climate change, improving mobility or official statistics (Art. 2(16) DGA).
  summary_de: Nach dem Daten-Governance-Rechtsakt ist Datenaltruismus die freiwillige gemeinsame Nutzung von Daten auf Grundlage der Einwilligung betroffener Personen bei personenbezogenen Daten oder der Erlaubnis von Dateninhabern bei nicht personenbezogenen Daten, ohne ein Entgelt, das über eine Kostenentschädigung hinausgeht, für Ziele von allgemeinem Interesse wie Gesundheitsversorgung, Bekämpfung des Klimawandels, Verbesserung der Mobilität oder amtliche Statistik (Art. 2 Nr. 16 DGA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R0868
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R0868
- id: open-data-directive
  type: Regulation
  name_en: Open Data Directive (EU) 2019/1024
  name_de: Open-Data-Richtlinie (EU) 2019/1024
  aliases:
  - Directive (EU) 2019/1024
  summary_en: The Open Data Directive (EU) 2019/1024, a recast on open data and the re-use of public sector information, sets minimum rules on the re-use of existing documents held by public sector bodies and certain public undertakings, to promote the use of open data and stimulate innovation in products and services (Art. 1(1)). Protected public sector data outside its scope fall under the Data Governance Act.
  summary_de: Die Richtlinie (EU) 2019/1024 über offene Daten und die Weiterverwendung von Informationen des öffentlichen Sektors (Neufassung) enthält Mindestvorschriften für die Weiterverwendung vorhandener Dokumente öffentlicher Stellen und bestimmter öffentlicher Unternehmen, um die Verwendung offener Daten zu fördern und Innovation bei Produkten und Dienstleistungen anzuregen (Art. 1 Abs. 1). Geschützte Daten öffentlicher Stellen außerhalb ihres Anwendungsbereichs fallen unter den Daten-Governance-Rechtsakt.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32019L1024
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L1024
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R0868
- id: public-sector-data-reuse
  type: Concept
  name_en: Re-use of protected public sector data
  name_de: Weiterverwendung geschützter Daten des öffentlichen Sektors
  summary_en: Chapter II of the Data Governance Act governs the re-use of data held by public sector bodies that are protected on grounds of commercial confidentiality, statistical confidentiality, third parties' intellectual property rights or the protection of personal data, insofar as such data fall outside the scope of Directive (EU) 2019/1024 (Art. 3(1) DGA). It does not apply, for example, to data held by public undertakings or public service broadcasters (Art. 3(2) DGA).
  summary_de: Kapitel II des Daten-Governance-Rechtsakts regelt die Weiterverwendung von Daten im Besitz öffentlicher Stellen, die aus Gründen der geschäftlichen oder statistischen Geheimhaltung, des Schutzes geistigen Eigentums Dritter oder des Schutzes personenbezogener Daten geschützt sind, soweit sie nicht unter die Richtlinie (EU) 2019/1024 fallen (Art. 3 Abs. 1 DGA). Es gilt etwa nicht für Daten öffentlicher Unternehmen oder öffentlich-rechtlicher Rundfunkanstalten (Art. 3 Abs. 2 DGA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R0868
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R0868
- id: privacy-preserving-ml
  type: Concept
  name_en: Privacy-preserving machine learning
  name_de: Datenschutzfreundliches maschinelles Lernen
- id: dp-deep-learning
  type: Method
  name_en: Differentially private deep learning
  name_de: Differentially Private Deep Learning
  aliases:
  - DP-SGD
  summary_en: Differentially private deep learning trains neural networks under the framework of differential privacy, so that models do not expose private information from their training data (Abadi et al., 2016). Abadi et al. developed algorithmic techniques and a refined analysis of privacy costs and showed that deep networks with non-convex objectives can be trained under a modest privacy budget at manageable cost in complexity, efficiency and model quality.
  summary_de: Differenziell privates Deep Learning trainiert neuronale Netze im Rahmen der Differential Privacy, sodass Modelle keine privaten Informationen aus ihren Trainingsdaten preisgeben (Abadi et al., 2016). Abadi et al. entwickelten Trainingsverfahren und eine genauere Analyse der Privatsphärekosten und zeigten, dass tiefe Netze mit nicht konvexen Zielfunktionen bei moderatem Privatsphärebudget und vertretbarem Aufwand an Komplexität, Effizienz und Modellqualität trainierbar sind.
  sources:
  - https://arxiv.org/abs/1607.00133
- id: federated-averaging
  type: Method
  name_en: Federated averaging
  name_de: Federated Averaging
  aliases:
  - FedAvg
  - iterative model averaging
  summary_en: Federated averaging is a practical method for federated learning in which training data stays on mobile devices and a shared model is learned by iteratively averaging locally computed updates (McMahan et al., 2016). It proved robust to unbalanced and non-IID data and reduced the required communication rounds by 10 to 100 times compared with synchronised stochastic gradient descent.
  summary_de: Federated Averaging ist ein praktisches Verfahren für föderiertes Lernen, bei dem die Trainingsdaten auf den Mobilgeräten bleiben und ein gemeinsames Modell durch iteratives Mitteln lokal berechneter Updates gelernt wird (McMahan et al., 2016). Es erwies sich als robust gegenüber unausgewogenen und nicht identisch verteilten Daten und verringerte die nötigen Kommunikationsrunden gegenüber synchronisiertem stochastischem Gradientenabstieg um das 10- bis 100-Fache.
  sources:
  - https://arxiv.org/abs/1602.05629
- id: gradient-leakage
  type: Concept
  name_en: Gradient leakage
  name_de: Gradient Leakage
  summary_en: Gradient leakage means that private training data can be recovered from gradients shared in distributed or collaborative training, contrary to the long-held belief that gradients are safe to share (Zhu et al., 2019). Deep Leakage from Gradients recovered images pixel-accurately and text token by token; gradient pruning was the most effective defence they found.
  summary_de: Gradient Leakage bedeutet, dass private Trainingsdaten aus Gradienten rekonstruiert werden können, die beim verteilten oder gemeinsamen Training ausgetauscht werden, entgegen der lange verbreiteten Annahme, Gradienten seien unbedenklich (Zhu et al., 2019). Deep Leakage from Gradients stellte Bilder pixelgenau und Texte Token für Token wieder her; Gradient Pruning war die wirksamste gefundene Abwehr.
  sources:
  - https://arxiv.org/abs/1906.08935
- id: latent-diffusion
  type: Method
  name_en: Latent diffusion model
  name_de: Latent Diffusion Model
  aliases:
  - latent diffusion
  summary_en: Latent diffusion models train diffusion models in the latent space of a pretrained autoencoder instead of pixel space, which greatly reduces computational cost while preserving detail (Rombach et al., 2021). Cross-attention layers allow conditioning on inputs such as text or bounding boxes, enabling high-resolution text-to-image synthesis and inpainting.
  summary_de: Latent-Diffusion-Modelle trainieren Diffusionsmodelle im latenten Raum eines vortrainierten Autoencoders statt im Pixelraum, was den Rechenaufwand stark senkt und Details erhält (Rombach et al., 2021). Cross-Attention-Schichten erlauben die Konditionierung auf Eingaben wie Text oder Begrenzungsrahmen und ermöglichen hochaufgelöste Text-zu-Bild-Synthese und Inpainting.
  sources:
  - https://arxiv.org/abs/2112.10752
- id: classifier-guidance
  type: Method
  name_en: Classifier guidance
  name_de: Classifier Guidance
  summary_en: Classifier guidance improves sample quality in conditional diffusion models by using gradients of an image classifier to trade diversity for fidelity (Dhariwal & Nichol, 2021). With it, diffusion models surpassed the best GANs on ImageNet image synthesis, for example with an FID of 4.59 at 256×256, while covering the distribution better.
  summary_de: Classifier Guidance verbessert die Qualität von Samples bedingter Diffusionsmodelle, indem es die Gradienten eines Bildklassifikators nutzt, um Vielfalt gegen Detailtreue abzuwägen (Dhariwal & Nichol, 2021). Damit übertrafen Diffusionsmodelle die besten GANs bei der Bildsynthese auf ImageNet, etwa mit einem FID von 4,59 bei 256×256, und deckten die Verteilung besser ab.
  sources:
  - https://arxiv.org/abs/2105.05233
- id: classifier-free-guidance
  type: Method
  name_en: Classifier-free guidance
  name_de: Classifier-free Guidance
  summary_en: 'Classifier-free guidance trades off sample quality and diversity in conditional diffusion models without a separate classifier: a conditional and an unconditional diffusion model are trained jointly, and their score estimates are combined at sampling time (Ho & Salimans, 2022). It reaches a trade-off similar to classifier guidance, which instead uses gradients of a separately trained image classifier.'
  summary_de: 'Classifier-free Guidance wägt bei bedingten Diffusionsmodellen Qualität und Vielfalt der Samples ab, ohne einen separaten Klassifikator: Ein bedingtes und ein unbedingtes Diffusionsmodell werden gemeinsam trainiert und ihre Score-Schätzungen beim Sampling kombiniert (Ho & Salimans, 2022). Es erreicht eine ähnliche Abwägung wie Classifier Guidance, das dafür die Gradienten eines separat trainierten Bildklassifikators nutzt.'
  sources:
  - https://arxiv.org/abs/2207.12598
- id: core-platform-service
  type: Concept
  name_en: Core platform service
  name_de: Zentraler Plattformdienst
  summary_en: Under the Digital Markets Act, core platform services are online intermediation services, online search engines, online social networking services, video-sharing platform services, number-independent interpersonal communications services, operating systems, web browsers, virtual assistants, cloud computing services and online advertising services provided by an undertaking that provides one of the others (Art. 2(2) DMA).
  summary_de: Nach dem Gesetz über digitale Märkte sind zentrale Plattformdienste Online-Vermittlungsdienste, Online-Suchmaschinen, Online-Dienste sozialer Netzwerke, Video-Sharing-Plattform-Dienste, nummernunabhängige interpersonelle Kommunikationsdienste, Betriebssysteme, Webbrowser, virtuelle Assistenten, Cloud-Computing-Dienste und Online-Werbedienste eines Unternehmens, das einen der übrigen Dienste bereitstellt (Art. 2 Nr. 2 DMA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R1925
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R1925
- id: whistleblower-directive
  type: Regulation
  name_en: Whistleblower Directive (EU) 2019/1937
  name_de: Whistleblower-Richtlinie (EU) 2019/1937
  aliases:
  - Directive (EU) 2019/1937
  summary_en: Directive (EU) 2019/1937 on the protection of persons who report breaches of Union law aims to enhance the enforcement of Union law and policies in specific areas by laying down common minimum standards for a high level of protection of whistleblowers (Art. 1).
  summary_de: Die Richtlinie (EU) 2019/1937 zum Schutz von Personen, die Verstöße gegen das Unionsrecht melden, soll die Durchsetzung des Unionsrechts und der Unionspolitik in bestimmten Bereichen durch gemeinsame Mindeststandards verbessern, die ein hohes Schutzniveau für hinweisgebende Personen sicherstellen (Art. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32019L1937
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32019L1937
- id: tfeu
  type: Regulation
  name_en: Treaty on the Functioning of the European Union (TFEU)
  name_de: Vertrag über die Arbeitsweise der Europäischen Union (AEUV)
  aliases:
  - TFEU
  - AEUV
  summary_en: The Treaty on the Functioning of the European Union (TFEU) is one of the EU's treaties and provides the legal bases for EU legislation. The Digital Markets Act, for example, was adopted "having regard to the Treaty on the Functioning of the European Union, and in particular Article 114 thereof".
  summary_de: Der Vertrag über die Arbeitsweise der Europäischen Union (AEUV) ist einer der Verträge der EU und enthält die Rechtsgrundlagen für EU-Rechtsakte. Das Gesetz über digitale Märkte etwa wurde „gestützt auf den Vertrag über die Arbeitsweise der Europäischen Union, insbesondere auf Artikel 114“ erlassen.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R1925
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R1925
- id: intermediary-service
  type: Concept
  name_en: Intermediary service
  name_de: Vermittlungsdienst
  summary_en: Under the Digital Services Act, an intermediary service is one of three information society services, a "mere conduit" service that transmits information or provides network access, a "caching" service with automatic, temporary storage to make onward transmission more efficient, or a "hosting" service that stores information provided by a recipient (Art. 3(g) DSA).
  summary_de: 'Nach dem Gesetz über digitale Dienste ist ein Vermittlungsdienst eine von drei Diensten der Informationsgesellschaft: eine „reine Durchleitung“, die Informationen übermittelt oder Netzzugang vermittelt, eine „Caching“-Leistung mit automatischer, zeitlich begrenzter Zwischenspeicherung zur effizienteren Weiterleitung oder ein „Hosting“-Dienst, der von Nutzern bereitgestellte Informationen speichert (Art. 3 Buchst. g DSA).'
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: very-large-online-platform
  type: Concept
  name_en: Very large online platforms and search engines (VLOPs and VLOSEs)
  name_de: Sehr große Online-Plattformen und Suchmaschinen (VLOPs und VLOSEs)
  aliases:
  - VLOP
  - VLOSE
  - very large online platform
  summary_en: Very large online platforms and very large online search engines are those with at least 45 million average monthly active recipients in the Union that the Commission has designated as such (Art. 33(1) DSA). They must, among other things, identify, analyse and assess systemic risks stemming from their services, at least once a year and before deploying functionalities with critical impact on those risks (Art. 34 DSA).
  summary_de: Sehr große Online-Plattformen und sehr große Online-Suchmaschinen sind solche mit durchschnittlich mindestens 45 Millionen monatlich aktiven Nutzern in der Union, die die Kommission als solche benannt hat (Art. 33 Abs. 1 DSA). Sie müssen unter anderem die systemischen Risiken ihrer Dienste ermitteln, analysieren und bewerten, mindestens einmal jährlich und vor der Einführung von Funktionen mit kritischen Auswirkungen auf diese Risiken (Art. 34 DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: european-board-for-digital-services
  type: Organisation
  name_en: European Board for Digital Services
  name_de: Europäisches Gremium für digitale Dienste
  summary_en: The European Board for Digital Services is an independent advisory group of the Digital Services Coordinators on the supervision of providers of intermediary services (Art. 61(1) DSA). It advises the Digital Services Coordinators and the Commission, for example to contribute to the consistent application of the DSA and to coordinate guidelines and analysis (Art. 61(2) DSA); it is composed of the Digital Services Coordinators, represented by high-level officials (Art. 62(1) DSA).
  summary_de: Das Europäische Gremium für digitale Dienste ist eine unabhängige Beratergruppe der Koordinatoren für digitale Dienste für die Beaufsichtigung der Anbieter von Vermittlungsdiensten (Art. 61 Abs. 1 DSA). Es berät die Koordinatoren für digitale Dienste und die Kommission, etwa um zur einheitlichen Anwendung des DSA beizutragen und Leitlinien und Analysen zu koordinieren (Art. 61 Abs. 2 DSA); es setzt sich aus den Koordinatoren für digitale Dienste zusammen, die durch hochrangige Beamte vertreten werden (Art. 62 Abs. 1 DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: cjeu
  type: Organisation
  name_en: Court of Justice of the European Union (CJEU)
  name_de: Gerichtshof der Europäischen Union (EuGH)
  aliases:
  - CJEU
  - EuGH
  summary_en: The Court of Justice of the European Union (CJEU) comprises the Court of Justice, the General Court and specialised courts and ensures that the law is observed in the interpretation and application of the Treaties (Art. 19(1) TEU). The Court of Justice has one judge per Member State, assisted by Advocates-General; judges are appointed by common accord of the Member States' governments for six years (Art. 19(2) TEU).
  summary_de: Der Gerichtshof der Europäischen Union (EuGH) umfasst den Gerichtshof, das Gericht und Fachgerichte und sichert die Wahrung des Rechts bei der Auslegung und Anwendung der Verträge (Art. 19 Abs. 1 EUV). Der Gerichtshof besteht aus einem Richter je Mitgliedstaat und wird von Generalanwälten unterstützt; die Richter werden von den Regierungen der Mitgliedstaaten im gegenseitigen Einvernehmen für sechs Jahre ernannt (Art. 19 Abs. 2 EUV).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:12016M019
- id: e-commerce-directive
  type: Regulation
  name_en: E-Commerce Directive 2000/31/EC
  name_de: E-Commerce-Richtlinie 2000/31/EG
  aliases:
  - Directive 2000/31/EC
  summary_en: The E-Commerce Directive 2000/31/EC set out rules for information society services, including the liability exemptions for intermediaries in its Articles 12 to 15. The Digital Services Act deleted those articles; references to them are read as references to Articles 4, 5, 6 and 8 DSA (Art. 89 DSA).
  summary_de: Die E-Commerce-Richtlinie 2000/31/EG enthielt Vorschriften für Dienste der Informationsgesellschaft, darunter in den Artikeln 12 bis 15 die Haftungsprivilegien für Vermittler. Das Gesetz über digitale Dienste hat diese Artikel gestrichen; Bezugnahmen darauf gelten als Bezugnahmen auf die Artikel 4, 5, 6 und 8 DSA (Art. 89 DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: representative-actions-directive
  type: Regulation
  name_en: Representative Actions Directive (EU) 2020/1828
  name_de: Verbandsklagenrichtlinie (EU) 2020/1828
  aliases:
  - Directive (EU) 2020/1828
  summary_en: Directive (EU) 2020/1828 ensures that a representative action mechanism for the protection of the collective interests of consumers is available in all Member States, with safeguards against abusive litigation, to achieve a high level of consumer protection and improve consumers' access to justice (Art. 1(1)). It repealed Directive 2009/22/EC.
  summary_de: Die Richtlinie (EU) 2020/1828 stellt sicher, dass in allen Mitgliedstaaten ein Verfahren für Verbandsklagen zum Schutz der Kollektivinteressen der Verbraucher besteht, mit Schutzmaßnahmen gegen Klagemissbrauch, um ein hohes Verbraucherschutzniveau zu erreichen und den Zugang der Verbraucher zur Justiz zu verbessern (Art. 1 Abs. 1). Sie hob die Richtlinie 2009/22/EG auf.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32020L1828
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32020L1828
- id: recommender-system
  type: Concept
  name_en: Recommender system
  name_de: Empfehlungssystem
  summary_en: Under the Digital Services Act, a recommender system is "a fully or partially automated system used by an online platform to suggest in its online interface specific information to recipients of the service or prioritise that information, including as a result of a search initiated by the recipient of the service or otherwise determining the relative order or prominence of information displayed" (Art. 3(s) DSA).
  summary_de: Nach dem Gesetz über digitale Dienste ist ein Empfehlungssystem „ein vollständig oder teilweise automatisiertes System, das von einer Online-Plattform verwendet wird, um auf ihrer Online-Schnittstelle den Nutzern bestimmte Informationen vorzuschlagen oder diese Informationen zu priorisieren, auch infolge einer vom Nutzer veranlassten Suche, oder das auf andere Weise die relative Reihenfolge oder Hervorhebung der angezeigten Informationen bestimmt“ (Art. 3 Buchst. s DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: content-moderation
  type: Concept
  name_en: Content moderation
  name_de: Inhaltsmoderation
  summary_en: Under the Digital Services Act, content moderation means the activities, automated or not, of providers of intermediary services aimed at detecting, identifying and addressing illegal content or information incompatible with their terms and conditions (Art. 3(t) DSA). It includes measures affecting the availability, visibility and accessibility of such content, such as demotion, demonetisation, disabling access or removal, and measures affecting users, such as suspending or terminating accounts.
  summary_de: Nach dem Gesetz über digitale Dienste ist die Moderation von Inhalten die automatisierte oder nicht automatisierte Tätigkeit von Anbietern von Vermittlungsdiensten, mit der insbesondere rechtswidrige Inhalte oder mit ihren allgemeinen Geschäftsbedingungen unvereinbare Informationen erkannt, festgestellt und bekämpft werden sollen (Art. 3 Buchst. t DSA). Dazu gehören Maßnahmen zu Verfügbarkeit, Anzeige und Zugänglichkeit solcher Inhalte, etwa Herabstufung, Demonetisierung, Sperrung des Zugangs oder Entfernung, und Maßnahmen gegenüber Nutzern wie die Sperrung oder Kündigung von Konten.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: online-advertising
  type: Concept
  name_en: Online advertising
  name_de: Online-Werbung
  summary_en: The Digital Services Act defines an advertisement as information designed to promote the message of a legal or natural person, for commercial or non-commercial purposes, that an online platform presents on its interface against remuneration specifically for promoting that information (Art. 3(r) DSA). Online advertising services are also a core platform service under the Digital Markets Act (Art. 2(2)(j) DMA).
  summary_de: Das Gesetz über digitale Dienste definiert Werbung als Informationen, die die Botschaft einer juristischen oder natürlichen Person zu gewerblichen oder nichtgewerblichen Zwecken verbreiten sollen und die eine Online-Plattform auf ihrer Online-Schnittstelle gegen Entgelt speziell zur Bekanntmachung dieser Informationen darstellt (Art. 3 Buchst. r DSA). Online-Werbedienste sind auch ein zentraler Plattformdienst nach dem Gesetz über digitale Märkte (Art. 2 Nr. 2 Buchst. j DMA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R1925
- id: systemic-risk
  type: Concept
  name_en: Systemic risk (DSA)
  name_de: Systemisches Risiko (DSA)
  summary_en: Under the Digital Services Act, very large online platforms and search engines must assess systemic risks stemming from their services, including the dissemination of illegal content, negative effects on fundamental rights such as human dignity, privacy, data protection, freedom of expression, non-discrimination and the rights of the child, effects on civic discourse, electoral processes and public security, and effects related to gender-based violence, public health, minors and physical and mental well-being (Art. 34(1) DSA).
  summary_de: Nach dem Gesetz über digitale Dienste müssen sehr große Online-Plattformen und Suchmaschinen die systemischen Risiken ihrer Dienste bewerten, darunter die Verbreitung rechtswidriger Inhalte, nachteilige Auswirkungen auf Grundrechte wie Menschenwürde, Privatleben, Datenschutz, Meinungs- und Informationsfreiheit, Nichtdiskriminierung und Rechte des Kindes, Auswirkungen auf die gesellschaftliche Debatte, Wahlprozesse und die öffentliche Sicherheit sowie Auswirkungen in Bezug auf geschlechtsspezifische Gewalt, öffentliche Gesundheit, Minderjährige und körperliches und geistiges Wohlbefinden (Art. 34 Abs. 1 DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: dark-patterns
  type: Concept
  name_en: Dark patterns
  name_de: Dark Patterns
  summary_en: The Digital Services Act prohibits providers of online platforms from designing, organising or operating their online interfaces in a way that deceives or manipulates recipients or otherwise materially distorts or impairs their ability to make free and informed decisions (Art. 25(1) DSA). The Commission may issue guidelines on specific practices, such as giving more prominence to certain choices or repeatedly requesting a decision already made (Art. 25(3) DSA).
  summary_de: Das Gesetz über digitale Dienste verbietet Anbietern von Online-Plattformen, ihre Online-Schnittstellen so zu konzipieren, zu organisieren oder zu betreiben, dass Nutzer getäuscht, manipuliert oder anderweitig in ihrer Fähigkeit, freie und informierte Entscheidungen zu treffen, maßgeblich beeinträchtigt oder behindert werden (Art. 25 Abs. 1 DSA). Die Kommission kann Leitlinien zu bestimmten Praktiken herausgeben, etwa zur stärkeren Hervorhebung bestimmter Auswahlmöglichkeiten oder zu wiederholten Aufforderungen zu einer bereits getroffenen Entscheidung (Art. 25 Abs. 3 DSA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2065
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2065
- id: semantic-matching-model
  type: Method
  name_en: Semantic matching model
  name_de: Semantic-Matching-Modell
- id: rule-mining
  type: Method
  name_en: Rule mining
  name_de: Regel-Mining
- id: ict-risk-management
  type: Concept
  name_en: ICT risk management
  name_de: IKT-Risikomanagement
  summary_en: Under DORA, financial entities must have a sound, comprehensive and well-documented ICT risk management framework as part of their overall risk management system, so that they can address ICT risk quickly, efficiently and comprehensively and ensure a high level of digital operational resilience (Art. 6(1) DORA). The framework includes at least strategies, policies, procedures, ICT protocols and tools to protect all information and ICT assets and relevant physical infrastructure (Art. 6(2) DORA).
  summary_de: Nach DORA müssen Finanzunternehmen über einen soliden, umfassenden und gut dokumentierten IKT-Risikomanagementrahmen als Teil ihres Gesamtrisikomanagementsystems verfügen, um IKT-Risiken schnell, effizient und umfassend anzugehen und ein hohes Niveau an digitaler operationaler Resilienz zu gewährleisten (Art. 6 Abs. 1 DORA). Der Rahmen umfasst mindestens Strategien, Leit- und Richtlinien, Verfahren sowie IKT-Protokolle und -Tools zum Schutz aller Informations- und IKT-Assets und der relevanten physischen Infrastruktur (Art. 6 Abs. 2 DORA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2554
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
- id: ict-third-party-risk
  type: Concept
  name_en: ICT third-party risk
  name_de: IKT-Drittparteienrisiko
  summary_en: Under DORA, ICT third-party risk is ICT risk that may arise for a financial entity from its use of ICT services provided by ICT third-party service providers or their subcontractors, including through outsourcing arrangements (Art. 3(18) DORA).
  summary_de: Nach DORA ist das IKT-Drittparteienrisiko ein IKT-bezogenes Risiko, das für ein Finanzunternehmen aus der Nutzung von IKT-Dienstleistungen entstehen kann, die IKT-Drittdienstleister oder deren Unterauftragnehmer bereitstellen, auch über Vereinbarungen zur Auslagerung (Art. 3 Nr. 18 DORA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2554
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
- id: threat-led-penetration-testing
  type: Method
  name_en: Threat-led penetration testing (TLPT)
  name_de: Bedrohungsorientierte Penetrationstests (TLPT)
  aliases:
  - TLPT
  summary_en: Under DORA, threat-led penetration testing (TLPT) is a framework that mimics the tactics, techniques and procedures of real-life threat actors and delivers a controlled, bespoke, intelligence-led red team test of a financial entity's critical live production systems (Art. 3(17) DORA). Financial entities identified by the competent authorities must carry out such advanced testing at least every three years, covering several or all critical or important functions (Art. 26(1)–(2) DORA).
  summary_de: Nach DORA sind bedrohungsorientierte Penetrationstests (TLPT) ein Rahmen, der Taktik, Techniken und Verfahren realer Angreifer nachbildet und einen kontrollierten, maßgeschneiderten, erkenntnisgestützten Red-Team-Test der kritischen Live-Produktionssysteme eines Finanzunternehmens ermöglicht (Art. 3 Nr. 17 DORA). Von den zuständigen Behörden ermittelte Finanzunternehmen müssen solche erweiterten Tests mindestens alle drei Jahre durchführen; sie erstrecken sich auf mehrere oder alle kritischen oder wichtigen Funktionen (Art. 26 Abs. 1 und 2 DORA).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
- id: critical-ict-third-party-provider
  type: Concept
  name_en: Critical ICT third-party service provider
  name_de: Kritischer IKT-Drittdienstleister
  summary_en: A critical ICT third-party service provider under DORA is one designated as critical in accordance with Article 31 (Art. 3(23) DORA). The European Supervisory Authorities, through the Joint Committee and on recommendation of the Oversight Forum, designate such providers after an assessment against set criteria and appoint one of them as Lead Overseer for each (Art. 31(1) DORA).
  summary_de: Ein kritischer IKT-Drittdienstleister im Sinne von DORA ist ein IKT-Drittdienstleister, der gemäß Artikel 31 als kritisch eingestuft wurde (Art. 3 Nr. 23 DORA). Die Europäischen Aufsichtsbehörden stufen solche Dienstleister über den Gemeinsamen Ausschuss und auf Empfehlung des Überwachungsforums nach einer Bewertung anhand festgelegter Kriterien ein und ernennen für jeden eine federführende Überwachungsbehörde (Art. 31 Abs. 1 DORA).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022R2554
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
- id: credit-rating-agencies-regulation
  type: Regulation
  name_en: Credit Rating Agencies Regulation (EC) No 1060/2009
  name_de: Ratingagentur-Verordnung (EG) Nr. 1060/2009
  aliases:
  - Regulation (EC) No 1060/2009
  summary_en: Regulation (EC) No 1060/2009 on credit rating agencies introduces a common regulatory approach to enhance the integrity, transparency, responsibility, good governance and reliability of credit rating activities (Art. 1). It lays down conditions for issuing credit ratings and rules on the organisation and conduct of credit rating agencies to promote their independence and avoid conflicts of interest.
  summary_de: Die Verordnung (EG) Nr. 1060/2009 über Ratingagenturen führt einen gemeinsamen Regulierungsansatz ein, um Integrität, Transparenz, Verantwortung, gute Unternehmensführung und Verlässlichkeit von Ratingtätigkeiten zu fördern (Art. 1). Sie legt die Bedingungen für die Abgabe von Ratings sowie Organisations- und Verhaltensregeln für Ratingagenturen fest, die deren Unabhängigkeit fördern und Interessenkonflikte vermeiden sollen.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32009R1060
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009R1060
- id: emir
  type: Regulation
  name_en: European Market Infrastructure Regulation (EU) No 648/2012 (EMIR)
  name_de: Verordnung (EU) Nr. 648/2012 über OTC-Derivate
  aliases:
  - EMIR
  - Regulation (EU) No 648/2012
  summary_en: The European Market Infrastructure Regulation (EU) No 648/2012 (EMIR) lays down clearing and bilateral risk-management requirements for over-the-counter (OTC) derivative contracts, reporting requirements for derivative contracts and uniform requirements for central counterparties (CCPs) and trade repositories (Art. 1(1)).
  summary_de: Die Verordnung (EU) Nr. 648/2012 über OTC-Derivate, zentrale Gegenparteien und Transaktionsregister (EMIR) legt Clearing- und bilaterale Risikomanagementvorschriften für außerbörsliche (OTC-)Derivatekontrakte, Meldepflichten für Derivatekontrakte sowie einheitliche Vorschriften für zentrale Gegenparteien (CCPs) und Transaktionsregister fest (Art. 1 Abs. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32012R0648
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32012R0648
- id: eba-gl-2026-09
  type: Regulation
  name_en: EBA Guidelines on third-party risk for non-ICT services (EBA/GL/2026/09)
  name_de: EBA-Leitlinien zum Drittparteienrisiko bei Nicht-IKT-Dienstleistungen (EBA/GL/2026/09)
  aliases:
  - EBA/GL/2026/09
  summary_en: The EBA Guidelines on the sound management of third-party risk regarding non-ICT services (EBA/GL/2026/09, final report of 18 September 2026) extend the traditional notion of outsourcing to the broader scope of arrangements with third-party service providers, based on the governance mandate in Article 74 CRD. They will repeal the EBA Guidelines on outsourcing of 25 February 2019 and apply from a date still to be set, with a transitional period for reviewing arrangements that support critical or important functions.
  summary_de: Die EBA-Leitlinien zum soliden Management des Drittparteienrisikos bei Nicht-IKT-Dienstleistungen (EBA/GL/2026/09, Abschlussbericht vom 18. September 2026) erweitern den klassischen Begriff der Auslagerung auf Vereinbarungen mit Drittdienstleistern insgesamt, gestützt auf das Governance-Mandat in Artikel 74 CRD. Sie werden die EBA-Leitlinien zu Auslagerungen vom 25. Februar 2019 aufheben und ab einem noch festzulegenden Datum gelten, mit einer Übergangsfrist für die Überprüfung von Vereinbarungen zu kritischen oder wichtigen Funktionen.
  sources:
  - https://www.eba.europa.eu/sites/default/files/2026-09/dc9ccbb3-79b9-493d-b693-c21adeffbcc9/Final%20report%20on%20GL%20on%20third-party%20risk%20management.pdf
- id: outsourcing
  type: Concept
  name_en: Outsourcing (banking supervision)
  name_de: Auslagerung (Bankenaufsicht)
  summary_en: In banking supervision, outsourcing is an arrangement of any form between an institution, a payment institution or an electronic money institution and a service provider by which the provider performs a process, service or activity that the institution would otherwise undertake itself (EBA/GL/2019/02). Under German law, an institution must take appropriate precautions against excessive additional risks when outsourcing activities and processes that are material for its banking business, keep an outsourcing register, and remains responsible for compliance; the managers' responsibility cannot be transferred (§ 25b(1)–(2) KWG).
  summary_de: In der Bankenaufsicht ist eine Auslagerung eine Vereinbarung gleich welcher Form zwischen einem Institut, einem Zahlungsinstitut oder einem E-Geld-Institut und einem Dienstleister, in deren Rahmen der Dienstleister einen Prozess durchführt, eine Dienstleistung erbringt oder eine Tätigkeit ausführt, die das Institut ansonsten selbst übernähme (EBA/GL/2019/02). Nach dem Kreditwesengesetz muss ein Institut bei der Auslagerung von für Bankgeschäfte wesentlichen Aktivitäten und Prozessen angemessene Vorkehrungen gegen übermäßige zusätzliche Risiken treffen und ein Auslagerungsregister führen; es bleibt für die Einhaltung der gesetzlichen Bestimmungen verantwortlich, und die Verantwortung der Geschäftsleiter darf nicht übertragen werden (§ 25b Abs. 1 und 2 KWG).
  sources:
  - https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/internal-governance/guidelines-outsourcing-arrangements
  - https://www.gesetze-im-internet.de/kredwg/__25b.html
- id: internal-governance
  type: Concept
  name_en: Internal governance (banks)
  name_de: Interne Governance (Banken)
  summary_en: Internal governance covers the standards and principles for setting an institution's objectives, strategies and risk management framework, how its business is organised, how responsibilities and reporting lines are allocated, and how the internal control framework is organised; it also includes IT systems, outsourcing and business continuity (EBA/GL/2021/05). The EBA guidelines specify the arrangements, processes and mechanisms that institutions under Directive 2013/36/EU should implement under Article 74(1) CRD.
  summary_de: Die EBA-Leitlinien zur internen Governance präzisieren die internen Regelungen, Prozesse und Mechanismen für die interne Governance, die Institute nach der Richtlinie 2013/36/EU gemäß Artikel 74 Absatz 1 der Richtlinie einführen sollten (EBA/GL/2021/05). Dazu gehören unter anderem eine klare Organisationsstruktur, ein unabhängiges internes Risikomanagement, eine Compliance-Funktion und eine interne Revision mit ausreichenden Befugnissen und Ressourcen sowie ein angemessener Rahmen für die interne Kontrolle.
  sources:
  - https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/internal-governance/guidelines-internal-governance-under-crd
- id: berec
  type: Organisation
  name_en: Body of European Regulators for Electronic Communications (BEREC)
  name_de: Gremium Europäischer Regulierungsstellen für elektronische Kommunikation (GEREK)
  aliases:
  - BEREC
  - GEREK
  summary_en: The Body of European Regulators for Electronic Communications (BEREC) was established, together with the BEREC Office, by Regulation (EU) 2018/1971, succeeding the bodies set up by Regulation (EC) No 1211/2009 (Art. 1). It aims in particular to ensure the consistent implementation of the regulatory framework for electronic communications, carries out its tasks independently and impartially, and assists and advises national regulatory authorities, the European Parliament, the Council and the Commission (Art. 3–4).
  summary_de: Das Gremium europäischer Regulierungsstellen für elektronische Kommunikation (GEREK) wurde zusammen mit dem GEREK-Büro durch die Verordnung (EU) 2018/1971 eingerichtet, als Nachfolger der durch die Verordnung (EG) Nr. 1211/2009 geschaffenen Stellen (Art. 1). Es soll insbesondere eine einheitliche Umsetzung des Rechtsrahmens für die elektronische Kommunikation gewährleisten, übt seine Aufgaben unabhängig und unparteiisch aus und unterstützt und berät die nationalen Regulierungsbehörden, das Europäische Parlament, den Rat und die Kommission (Art. 3 und 4).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32018R1971
- id: telecom-framework-directives-2002
  type: Regulation
  name_en: Telecommunications framework directives 2002/19/EC to 2002/22/EC
  name_de: Telekommunikations-Rahmenrichtlinien 2002/19/EG bis 2002/22/EG
  summary_en: The 2002 telecommunications framework consisted of Directives 2002/19/EC (access), 2002/20/EC (authorisation), 2002/21/EC (framework) and 2002/22/EC (universal service). They were repealed with effect from 21 December 2020 by the European Electronic Communications Code, Directive (EU) 2018/1972 (Art. 125 EECC).
  summary_de: Der Telekommunikationsrahmen von 2002 bestand aus den Richtlinien 2002/19/EG (Zugang), 2002/20/EG (Genehmigung), 2002/21/EG (Rahmen) und 2002/22/EG (Universaldienst). Sie wurden mit Wirkung vom 21. Dezember 2020 durch den Europäischen Kodex für die elektronische Kommunikation, die Richtlinie (EU) 2018/1972, aufgehoben (Art. 125 EKEK).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02018L1972-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018L1972-20241018
- id: electronic-communications-service
  type: Concept
  name_en: Electronic communications service
  name_de: Elektronischer Kommunikationsdienst
  summary_en: Under the European Electronic Communications Code, an electronic communications service is a service normally provided for remuneration via electronic communications networks, including internet access services and interpersonal communications services, but excluding services that provide or exercise editorial control over content (Art. 2(4) EECC).
  summary_de: Nach dem Europäischen Kodex für die elektronische Kommunikation sind elektronische Kommunikationsdienste gewöhnlich gegen Entgelt über elektronische Kommunikationsnetze erbrachte Dienste, die etwa Internetzugangsdienste und interpersonelle Kommunikationsdienste umfassen, nicht aber Dienste, die Inhalte anbieten oder eine redaktionelle Kontrolle über sie ausüben (Art. 2 Nr. 4 EKEK).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02018L1972-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018L1972-20241018
- id: universal-service
  type: Concept
  name_en: Universal service (telecommunications)
  name_de: Universaldienst (Telekommunikation)
  summary_en: Universal service in telecommunications means that Member States ensure all consumers in their territory have access, at an affordable price and in light of national conditions, to an available adequate broadband internet access service and to voice communications services at a fixed location, including the underlying connection (Art. 84(1) EECC).
  summary_de: Universaldienst in der Telekommunikation bedeutet, dass die Mitgliedstaaten sicherstellen, dass alle Verbraucher in ihrem Gebiet unter Berücksichtigung nationaler Gegebenheiten zu einem erschwinglichen Preis Zugang zu einem verfügbaren angemessenen Breitbandinternetzugangsdienst und zu Sprachkommunikationsdiensten an einem festen Standort einschließlich des zugrunde liegenden Anschlusses haben (Art. 84 Abs. 1 EKEK).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02018L1972-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02018L1972-20241018
- id: eidas-2
  type: Regulation
  name_en: Regulation (EU) 2024/1183 (eIDAS 2.0)
  name_de: Verordnung (EU) 2024/1183 (eIDAS 2.0)
  aliases:
  - eIDAS 2.0
  summary_en: Regulation (EU) 2024/1183 (eIDAS 2.0) amends Regulation (EU) No 910/2014 to establish the European Digital Identity Framework. The amended eIDAS Regulation aims to ensure the proper functioning of the internal market and an adequate level of security of electronic identification means and trust services, so that people and businesses can participate safely in the digital society and access online services throughout the Union (Art. 1).
  summary_de: Die Verordnung (EU) 2024/1183 (eIDAS 2.0) ändert die Verordnung (EU) Nr. 910/2014, um den europäischen Rahmen für eine digitale Identität zu schaffen. Die geänderte eIDAS-Verordnung dient dem Funktionieren des Binnenmarkts und einem angemessenen Sicherheitsniveau bei elektronischen Identifizierungsmitteln und Vertrauensdiensten, damit natürliche und juristische Personen sicher an der digitalen Gesellschaft teilhaben und unionsweit Online-Dienste nutzen können (Art. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32024R1183
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1183
- id: e-signatures-directive
  type: Regulation
  name_en: Electronic Signatures Directive 1999/93/EC
  name_de: Signaturrichtlinie 1999/93/EG
  aliases:
  - Directive 1999/93/EC
  summary_en: The Electronic Signatures Directive 1999/93/EC was the EU's first legal framework for electronic signatures. It was repealed with effect from 1 July 2016 by the eIDAS Regulation (EU) No 910/2014, and references to it are read as references to eIDAS (Art. 50 eIDAS).
  summary_de: Die Signaturrichtlinie 1999/93/EG war der erste Rechtsrahmen der EU für elektronische Signaturen. Sie wurde mit Wirkung vom 1. Juli 2016 durch die eIDAS-Verordnung (EU) Nr. 910/2014 aufgehoben, und Bezugnahmen darauf gelten als Bezugnahmen auf die eIDAS-Verordnung (Art. 50 eIDAS).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32014R0910
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32014R0910
- id: eudi-wallet
  type: Concept
  name_en: European Digital Identity Wallet
  name_de: Europäische Brieftasche für die Digitale Identität (EUDI-Wallet)
  aliases:
  - EUDI Wallet
  summary_en: The European Digital Identity Wallet is an electronic identification means that allows users to securely store, manage and validate person identification data and electronic attestations of attributes, present them to relying parties and other wallet users, and sign with qualified electronic signatures or seal with qualified electronic seals (Art. 3(42) eIDAS, as amended by Regulation (EU) 2024/1183).
  summary_de: Die Europäische Brieftasche für die Digitale Identität ist ein elektronisches Identifizierungsmittel, mit dem Nutzer Personenidentifizierungsdaten und elektronische Attributsbescheinigungen sicher speichern, verwalten und validieren, sie vertrauenden Beteiligten und anderen Nutzern vorlegen und mit qualifizierten elektronischen Signaturen unterzeichnen oder mit qualifizierten elektronischen Siegeln siegeln können (Art. 3 Nr. 42 eIDAS in der Fassung der Verordnung (EU) 2024/1183).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02014R0910-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02014R0910-20241018
- id: trust-service
  type: Concept
  name_en: Trust service
  name_de: Vertrauensdienst
  summary_en: Under the eIDAS Regulation, a trust service is an electronic service normally provided for remuneration that consists of activities such as issuing or validating certificates for electronic signatures, electronic seals or website authentication, or other services listed in the Regulation (Art. 3(16) eIDAS).
  summary_de: Nach der eIDAS-Verordnung ist ein Vertrauensdienst ein elektronischer Dienst, der in der Regel gegen Entgelt erbracht wird und etwa in der Ausstellung oder Validierung von Zertifikaten für elektronische Signaturen, elektronische Siegel oder Website-Authentifizierung oder in anderen in der Verordnung genannten Tätigkeiten besteht (Art. 3 Nr. 16 eIDAS).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02014R0910-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02014R0910-20241018
- id: electronic-signature
  type: Concept
  name_en: Electronic signature
  name_de: Elektronische Signatur
  summary_en: Under the eIDAS Regulation, an electronic signature is "data in electronic form which is attached to or logically associated with other data in electronic form and which is used by the signatory to sign" (Art. 3(10) eIDAS).
  summary_de: Nach der eIDAS-Verordnung sind elektronische Signaturen „Daten in elektronischer Form, die anderen elektronischen Daten beigefügt oder logisch mit ihnen verbunden werden und die der Unterzeichner zum Unterzeichnen verwendet“ (Art. 3 Nr. 10 eIDAS).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02014R0910-20241018
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02014R0910-20241018
- id: eudi-cooperation-group
  type: Organisation
  name_en: European Digital Identity Cooperation Group
  name_de: Kooperationsgruppe für die europäische digitale Identität
  summary_en: The European Digital Identity Cooperation Group supports and facilitates cross-border cooperation and the exchange of information among Member States on trust services, European Digital Identity Wallets and notified electronic identification schemes (Art. 46e(1) eIDAS Regulation, inserted by Regulation (EU) 2024/1183). It is composed of representatives of the Member States and the Commission and is chaired by the Commission (Art. 46e(2)).
  summary_de: Die europäische Kooperationsgruppe für die digitale Identität erleichtert die grenzübergreifende Zusammenarbeit und den Informationsaustausch der Mitgliedstaaten im Bereich der Vertrauensdienste, der europäischen Brieftaschen für die Digitale Identität und der notifizierten elektronischen Identifizierungssysteme (Art. 46e Abs. 1 eIDAS-Verordnung, eingefügt durch die Verordnung (EU) 2024/1183). Sie setzt sich aus Vertretern der Mitgliedstaaten und der Kommission zusammen; den Vorsitz führt die Kommission (Art. 46e Abs. 2).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1183
- id: matryoshka-representation-learning
  type: Method
  name_en: Matryoshka Representation Learning (MRL)
  name_de: Matryoshka Representation Learning (MRL)
  aliases:
  - MRL
  - Matryoshka representations
  - Matryoshka embeddings
  summary_en: Matryoshka Representation Learning (MRL) trains one embedding that encodes information at several granularities, so that shorter prefixes of the vector can be used when computation is constrained, at no extra inference cost (Kusupati et al., 2022). It allowed up to 14 times smaller embeddings for ImageNet-1K classification at the same accuracy and up to 14 times faster large-scale retrieval.
  summary_de: Matryoshka Representation Learning (MRL) trainiert ein Embedding, das Informationen in mehreren Granularitäten kodiert, sodass bei knappen Ressourcen kürzere Anfangsstücke des Vektors genutzt werden können, ohne zusätzliche Kosten bei der Inferenz (Kusupati et al., 2022). Es ermöglichte bis zu 14-mal kleinere Embeddings bei gleicher Accuracy für die Klassifikation auf ImageNet-1K und bis zu 14-mal schnelleres Retrieval im großen Maßstab.
  sources:
  - https://arxiv.org/abs/2205.13147
- id: bagging
  type: Method
  name_en: Bagging (bootstrap aggregating)
  name_de: Bagging (Bootstrap Aggregating)
  aliases:
  - bootstrap aggregating
  summary_en: Bagging (bootstrap aggregating) builds several instances of an estimator on random subsets of the training set and aggregates their predictions, which reduces the variance of the base estimator (scikit-learn developers, n.d.-e). It works best with strong, complex models such as fully grown decision trees, in contrast to boosting, which usually works best with weak models.
  summary_de: Bagging (Bootstrap Aggregating) trainiert mehrere Instanzen eines Schätzers auf zufälligen Teilmengen der Trainingsdaten und fasst ihre Vorhersagen zusammen, was die Varianz des Basismodells senkt (scikit-learn developers, n.d.-e). Es wirkt am besten mit starken, komplexen Modellen wie voll ausgewachsenen Entscheidungsbäumen, während Boosting meist mit schwachen Modellen am besten funktioniert.
  sources:
  - https://scikit-learn.org/stable/modules/ensemble.html
- id: adaboost
  type: Method
  name_en: AdaBoost
  name_de: AdaBoost
  summary_en: AdaBoost, introduced by Freund and Schapire in 1995, fits a sequence of weak learners, such as small decision trees, on repeatedly reweighted versions of the data and combines them by a weighted majority vote (scikit-learn developers, n.d.-e). After each round, the weights of samples that were predicted incorrectly increase, so later learners focus on the hard cases.
  summary_de: AdaBoost, 1995 von Freund und Schapire eingeführt, trainiert eine Folge schwacher Lerner, etwa kleiner Entscheidungsbäume, auf wiederholt neu gewichteten Fassungen der Daten und verbindet sie über eine gewichtete Mehrheitsentscheidung (scikit-learn developers, n.d.-e). Nach jeder Runde steigt das Gewicht falsch vorhergesagter Beispiele, sodass spätere Lerner sich auf die schwierigen Fälle konzentrieren.
  sources:
  - https://scikit-learn.org/stable/modules/ensemble.html
- id: gradient-boosting
  type: Method
  name_en: Gradient boosting
  name_de: Gradient Boosting
  summary_en: Gradient boosting generalises boosting to arbitrary differentiable loss functions, building an ensemble of decision trees stage by stage, following Friedman (2001) (scikit-learn developers, n.d.-e). Gradient-boosted trees are an excellent model for regression and classification on tabular data; histogram-based implementations are much faster on large datasets and handle missing values natively.
  summary_de: Gradient Boosting verallgemeinert Boosting auf beliebige differenzierbare Verlustfunktionen und baut nach Friedman (2001) stufenweise ein Ensemble aus Entscheidungsbäumen auf (scikit-learn developers, n.d.-e). Gradient-geboostete Bäume sind ein sehr gutes Modell für Regression und Klassifikation auf tabellarischen Daten; histogrammbasierte Umsetzungen sind bei großen Datenmengen deutlich schneller und verarbeiten fehlende Werte direkt.
  sources:
  - https://scikit-learn.org/stable/modules/ensemble.html
  - https://doi.org/10.1214/aos/1013203451
- id: stacking
  type: Method
  name_en: Stacking (stacked generalisation)
  name_de: Stacking (Stacked Generalisation)
  aliases:
  - stacked generalisation
  - stacked generalization
  summary_en: 'Stacking (stacked generalisation), introduced by Wolpert (1992), combines estimators to reduce their biases: the predictions of the individual estimators are used as input to a final estimator, which is trained through cross-validation (scikit-learn developers, n.d.-e).'
  summary_de: 'Stacking (Stacked Generalization), von Wolpert (1992) eingeführt, verbindet Schätzer, um ihre Verzerrungen zu verringern: Die Vorhersagen der einzelnen Schätzer dienen als Eingabe für einen abschließenden Schätzer, der per Kreuzvalidierung trainiert wird (scikit-learn developers, n.d.-e).'
  sources:
  - https://scikit-learn.org/stable/modules/ensemble.html
- id: gliner
  type: Method
  name_en: GLiNER
  name_de: GLiNER
  summary_en: GLiNER is a compact named entity recognition model built on a bidirectional Transformer encoder that can identify arbitrary entity types given in natural language and extracts entities in parallel rather than token by token (Zaratiana et al., 2023). In zero-shot evaluations on several NER benchmarks it outperformed ChatGPT and fine-tuned LLMs.
  summary_de: GLiNER ist ein kompaktes Modell für Named Entity Recognition auf Basis eines bidirektionalen Transformer-Encoders, das beliebige, in natürlicher Sprache angegebene Entitätstypen erkennt und Entitäten parallel statt Token für Token extrahiert (Zaratiana et al., 2023). In Zero-Shot-Evaluationen auf mehreren NER-Benchmarks übertraf es ChatGPT und feinjustierte LLMs.
  sources:
  - https://arxiv.org/abs/2311.08526
- id: gpt-ner
  type: Method
  name_en: GPT-NER
  name_de: GPT-NER
  summary_en: GPT-NER turns named entity recognition into a generation task an LLM can handle, for example by rewriting "Columbus is a city" as "@@Columbus## is a city" to mark a location, and adds a self-verification step against over-confident labelling (Wang et al., 2023). On five NER datasets it reached performance comparable to fully supervised baselines and did better in low-resource settings.
  summary_de: GPT-NER verwandelt Named Entity Recognition in eine Generierungsaufgabe für ein LLM, etwa indem „Columbus is a city“ als „@@Columbus## is a city“ ausgegeben wird, um einen Ort zu markieren, und ergänzt eine Selbstprüfung gegen übermäßig selbstsicheres Labeln (Wang et al., 2023). Auf fünf NER-Datensätzen erreichte es Ergebnisse vergleichbar mit vollständig überwachten Baselines und war bei wenigen Trainingsdaten besser.
  sources:
  - https://arxiv.org/abs/2304.10428
- id: bilstm-crf
  type: Method
  name_en: BiLSTM-CRF
  name_de: BiLSTM-CRF
  summary_en: A BiLSTM-CRF model combines a bidirectional LSTM, which uses both past and future input features, with a conditional random field layer that uses sentence-level tag information (Huang et al., 2015). Its authors were the first to apply it to standard NLP sequence tagging benchmarks and reached state-of-the-art or near state-of-the-art accuracy on part-of-speech tagging, chunking and named entity recognition.
  summary_de: Ein BiLSTM-CRF-Modell verbindet ein bidirektionales LSTM, das vorherige und nachfolgende Eingaben nutzt, mit einer Conditional-Random-Field-Schicht, die Informationen über die Tags des ganzen Satzes verwendet (Huang et al., 2015). Die Autoren setzten es als Erste auf Standard-Benchmarks für Sequenz-Tagging ein und erreichten bei Wortartenerkennung, Chunking und Named Entity Recognition Bestwerte oder Werte nahe daran.
  sources:
  - https://arxiv.org/abs/1508.01991
- id: coreference-resolution
  type: Method
  name_en: Coreference resolution
  name_de: Koreferenzauflösung
- id: citizens-rights-directive-2009
  type: Regulation
  name_en: Directive 2009/136/EC (amending the ePrivacy Directive)
  name_de: Richtlinie 2009/136/EG (Änderung der ePrivacy-Richtlinie)
  aliases:
  - Directive 2009/136/EC
  summary_en: Directive 2009/136/EC of 25 November 2009 amended the Universal Service Directive 2002/22/EC, the ePrivacy Directive 2002/58/EC and the consumer protection cooperation rules, as part of the 2009 telecoms reform. Among other things, it replaced Article 5(3) of the ePrivacy Directive so that storing information on, or accessing information in, a user's terminal equipment is only allowed with consent after clear and comprehensive information (Art. 2(5)), the basis of cookie consent.
  summary_de: Die Richtlinie 2009/136/EG vom 25. November 2009 änderte die Universaldienstrichtlinie 2002/22/EG, die Datenschutzrichtlinie für elektronische Kommunikation 2002/58/EG und die Vorschriften zur Zusammenarbeit im Verbraucherschutz als Teil der Telekommunikationsreform von 2009. Unter anderem fasste sie Artikel 5 Absatz 3 der ePrivacy-Richtlinie neu, sodass das Speichern von Informationen im Endgerät eines Nutzers oder der Zugriff darauf nur mit Einwilligung nach klarer und umfassender Information zulässig ist (Art. 2 Nr. 5), die Grundlage der Einwilligung in Cookies.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32009L0136
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32009L0136
- id: data-retention-directive
  type: Regulation
  name_en: Data Retention Directive 2006/24/EC
  name_de: Vorratsdatenspeicherungsrichtlinie 2006/24/EG
  aliases:
  - Directive 2006/24/EC
  summary_en: The Data Retention Directive 2006/24/EC harmonised obligations of providers of public electronic communications services and networks to retain traffic and location data so that they were available for the investigation, detection and prosecution of serious crime (Art. 1). In Digital Rights Ireland (C-293/12, 8 April 2014), the Court of Justice declared the Directive invalid.
  summary_de: Die Richtlinie 2006/24/EG über die Vorratsspeicherung von Daten harmonisierte die Pflichten von Anbietern öffentlicher elektronischer Kommunikationsdienste und -netze, Verkehrs- und Standortdaten zu speichern, damit sie zur Ermittlung, Feststellung und Verfolgung schwerer Straftaten zur Verfügung stehen (Art. 1). Im Urteil Digital Rights Ireland (C-293/12, 8. April 2014) erklärte der Gerichtshof die Richtlinie für ungültig.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32006L0024
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:62012CJ0293
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:62012CJ0293
- id: telecom-privacy-directive-1997
  type: Regulation
  name_en: Telecommunications Privacy Directive 97/66/EC
  name_de: Telekommunikations-Datenschutzrichtlinie 97/66/EG
  aliases:
  - Directive 97/66/EC
  summary_en: The Telecommunications Privacy Directive 97/66/EC governed the processing of personal data and the protection of privacy in the telecommunications sector. It was repealed by the ePrivacy Directive 2002/58/EC, and references to it are read as references to that Directive (Art. 19 ePrivacy Directive).
  summary_de: Die Telekommunikations-Datenschutzrichtlinie 97/66/EG regelte die Verarbeitung personenbezogener Daten und den Schutz der Privatsphäre im Telekommunikationsbereich. Sie wurde durch die Datenschutzrichtlinie für elektronische Kommunikation 2002/58/EG aufgehoben, und Bezugnahmen darauf gelten als Bezugnahmen auf diese Richtlinie (Art. 19 ePrivacy-Richtlinie).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02002L0058-20091219
- id: eprivacy-regulation-proposal
  type: Regulation
  name_en: ePrivacy Regulation (proposal)
  name_de: ePrivacy-Verordnung (Vorschlag)
  summary_en: The ePrivacy Regulation was a Commission proposal of 2017, procedure 2017/0003 (COD), "concerning the respect for private life and the protection of personal data in electronic communications and repealing Directive 2002/58/EC". It was among the pending proposals withdrawn under the Commission's 2025 work programme, with the withdrawal published in the Official Journal on 6 October 2025 (C/2025/5423).
  summary_de: Die ePrivacy-Verordnung war ein Vorschlag der Kommission von 2017, Verfahren 2017/0003 (COD), über die Achtung des Privatlebens und den Schutz personenbezogener Daten in der elektronischen Kommunikation und zur Aufhebung der Richtlinie 2002/58/EG. Sie gehörte zu den anhängigen Vorschlägen, die nach dem Arbeitsprogramm 2025 der Kommission zurückgenommen wurden; die Rücknahme wurde am 6. Oktober 2025 im Amtsblatt veröffentlicht (C/2025/5423).
  sources:
  - https://data.consilium.europa.eu/doc/document/ST-13873-2025-INIT/en/pdf
- id: direct-marketing
  type: Concept
  name_en: Unsolicited direct marketing
  name_de: Unerbetene Direktwerbung
  summary_en: German unfair competition law prohibits commercial practices that unreasonably harass market participants, in particular advertising the recipient evidently does not want (§ 7(1) UWG). Unreasonable harassment is always assumed for telephone advertising to consumers without their prior express consent and for advertising by automated calling machine, fax or email without prior express consent, with a limited exception for email advertising in an existing customer relationship (§ 7(2)–(3) UWG); according to its official notes, the UWG also transposes the ePrivacy Directive 2002/58/EC.
  summary_de: Das Lauterkeitsrecht verbietet geschäftliche Handlungen, die Marktteilnehmer unzumutbar belästigen, insbesondere Werbung, die der Angesprochene erkennbar nicht wünscht (§ 7 Abs. 1 UWG). Eine unzumutbare Belästigung ist stets anzunehmen bei Telefonwerbung gegenüber Verbrauchern ohne deren vorherige ausdrückliche Einwilligung und bei Werbung mit automatischen Anrufmaschinen, Fax oder E-Mail ohne vorherige ausdrückliche Einwilligung, mit einer begrenzten Ausnahme für E-Mail-Werbung im Rahmen einer bestehenden Kundenbeziehung (§ 7 Abs. 2 und 3 UWG); nach seinen amtlichen Hinweisen setzt das UWG auch die ePrivacy-Richtlinie 2002/58/EG um.
  sources:
  - https://www.gesetze-im-internet.de/uwg_2004/
- id: ai-system
  type: Concept
  name_en: AI system
  name_de: KI-System
  summary_en: Under the AI Act, an AI system is "a machine-based system that is designed to operate with varying levels of autonomy and that may exhibit adaptiveness after deployment, and that, for explicit or implicit objectives, infers, from the input it receives, how to generate outputs such as predictions, content, recommendations, or decisions that can influence physical or virtual environments" (Art. 3(1) AI Act).
  summary_de: Nach der KI-Verordnung ist ein KI-System „ein maschinengestütztes System, das für einen in unterschiedlichem Grade autonomen Betrieb ausgelegt ist und das nach seiner Betriebsaufnahme anpassungsfähig sein kann und das aus den erhaltenen Eingaben für explizite oder implizite Ziele ableitet, wie Ausgaben wie etwa Vorhersagen, Inhalte, Empfehlungen oder Entscheidungen erstellt werden, die physische oder virtuelle Umgebungen beeinflussen können“ (Art. 3 Nr. 1 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: general-purpose-ai-model
  type: Concept
  name_en: General-purpose AI model (GPAI model)
  name_de: KI-Modell mit allgemeinem Verwendungszweck
  aliases:
  - GPAI model
  - general-purpose AI model
  summary_en: A general-purpose AI model under the AI Act is an AI model, including one trained with a large amount of data using self-supervision at scale, that displays significant generality, can competently perform a wide range of distinct tasks regardless of how it is placed on the market and can be integrated into a variety of downstream systems or applications; models used only for research, development or prototyping before being placed on the market are excluded (Art. 3(63) AI Act).
  summary_de: Ein KI-Modell mit allgemeinem Verwendungszweck im Sinne der KI-Verordnung ist ein KI-Modell, auch wenn es mit einer großen Datenmenge unter umfassender Selbstüberwachung trainiert wird, das eine erhebliche allgemeine Verwendbarkeit aufweist, unabhängig von der Art seines Inverkehrbringens ein breites Spektrum unterschiedlicher Aufgaben kompetent erfüllen und in eine Vielzahl nachgelagerter Systeme oder Anwendungen integriert werden kann; ausgenommen sind Modelle, die vor dem Inverkehrbringen nur für Forschung, Entwicklung oder Prototypen genutzt werden (Art. 3 Nr. 63 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: general-purpose-ai-system
  type: Concept
  name_en: General-purpose AI system
  name_de: KI-System mit allgemeinem Verwendungszweck
  summary_en: A general-purpose AI system under the AI Act is an AI system that is based on a general-purpose AI model and can serve a variety of purposes, both for direct use and for integration in other AI systems (Art. 3(66) AI Act).
  summary_de: Ein KI-System mit allgemeinem Verwendungszweck im Sinne der KI-Verordnung ist ein KI-System, das auf einem KI-Modell mit allgemeinem Verwendungszweck beruht und einer Vielzahl von Zwecken sowohl für die direkte Verwendung als auch für die Integration in andere KI-Systeme dienen kann (Art. 3 Nr. 66 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: high-risk-ai-system
  type: Concept
  name_en: High-risk AI system
  name_de: Hochrisiko-KI-System
  summary_en: Under Article 6 of the AI Act, an AI system is high-risk if it is a safety component of a product, or itself a product, covered by the Union harmonisation legislation in Annex I and subject to third-party conformity assessment, or if it falls under one of the use cases listed in Annex III (Art. 6(1)–(2) AI Act). An Annex III system is not high-risk if it does not pose a significant risk of harm to health, safety or fundamental rights, including by not materially influencing the outcome of decision-making (Art. 6(3) AI Act).
  summary_de: Nach Artikel 6 der KI-Verordnung ist ein KI-System hochriskant, wenn es als Sicherheitsbauteil eines Produkts verwendet werden soll oder selbst ein Produkt ist, das unter die Harmonisierungsrechtsvorschriften in Anhang I fällt und einer Konformitätsbewertung durch Dritte unterliegt, oder wenn es unter einen der in Anhang III genannten Anwendungsfälle fällt (Art. 6 Abs. 1 und 2 KI-VO). Ein System nach Anhang III gilt nicht als hochriskant, wenn es kein erhebliches Risiko der Beeinträchtigung von Gesundheit, Sicherheit oder Grundrechten birgt, unter anderem weil es das Ergebnis der Entscheidungsfindung nicht wesentlich beeinflusst (Art. 6 Abs. 3 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: prohibited-ai-practice
  type: Concept
  name_en: Prohibited AI practice
  name_de: Verbotene Praktik im KI-Bereich
  summary_en: Article 5 of the AI Act prohibits certain AI practices outright, among them manipulative or deceptive techniques that cause significant harm, exploiting vulnerabilities due to age or disability, social scoring, predicting criminal offences based solely on profiling, untargeted scraping of facial images for facial recognition databases, emotion recognition in workplaces and education, biometric categorisation to infer sensitive traits and, with exceptions, real-time remote biometric identification for law enforcement in public spaces. Later amendments added AI systems that generate non-consensual intimate images of identifiable persons or child sexual abuse material (Art. 5(1) AI Act).
  summary_de: Artikel 5 der KI-Verordnung verbietet bestimmte Praktiken im KI-Bereich vollständig, darunter manipulative oder täuschende Techniken, die erheblichen Schaden verursachen, das Ausnutzen von Schwächen aufgrund von Alter oder Behinderung, Social Scoring, die Vorhersage von Straftaten allein aufgrund von Profiling, das ungezielte Auslesen von Gesichtsbildern für Gesichtserkennungsdatenbanken, Emotionserkennung am Arbeitsplatz und in Bildungseinrichtungen, biometrische Kategorisierung zum Ableiten sensibler Merkmale sowie, mit Ausnahmen, biometrische Echtzeit-Fernidentifizierung zur Strafverfolgung in öffentlich zugänglichen Räumen. Spätere Änderungen ergänzten KI-Systeme, die ohne Zustimmung intime Darstellungen bestimmbarer Personen oder Material über sexuellen Kindesmissbrauch erzeugen (Art. 5 Abs. 1 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: ai-literacy
  type: Concept
  name_en: AI literacy
  name_de: KI-Kompetenz
  summary_en: Article 4 of the AI Act requires providers and deployers of AI systems to take measures to support the development of AI literacy of their staff and other persons operating or using AI systems on their behalf, taking into account their knowledge, experience, training and the context of use; the obligation does not require guaranteeing a specific level of AI literacy (Art. 4(1) AI Act). The Commission and the Member States support providers and deployers, especially SMEs, and the Commission publishes practical examples (Art. 4(2) AI Act).
  summary_de: Artikel 4 der KI-Verordnung verpflichtet Anbieter und Betreiber von KI-Systemen, Maßnahmen zu ergreifen, um die Entwicklung der KI-Kompetenz ihres Personals und anderer Personen zu unterstützen, die in ihrem Auftrag mit Betrieb und Nutzung von KI-Systemen befasst sind, unter Berücksichtigung von Kenntnissen, Erfahrung, Ausbildung und Einsatzkontext; die Pflicht verlangt nicht, ein bestimmtes Niveau an KI-Kompetenz zu garantieren (Art. 4 Abs. 1 KI-VO). Kommission und Mitgliedstaaten unterstützen Anbieter und Betreiber, insbesondere KMU, und die Kommission veröffentlicht praktische Beispiele (Art. 4 Abs. 2 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: ai-regulatory-sandbox
  type: Concept
  name_en: AI regulatory sandbox
  name_de: KI-Reallabor
  summary_en: An AI regulatory sandbox is a controlled framework set up by a competent authority in which providers or prospective providers can develop, train, validate and test an innovative AI system, where appropriate in real-world conditions, for a limited time under regulatory supervision (Art. 3(55) AI Act). Each Member State must ensure that its competent authorities establish at least one sandbox at national level, operational by 2 August 2027, possibly jointly with other Member States or by participating in an existing sandbox; additional regional or local sandboxes are possible (Art. 57(1)–(2) AI Act).
  summary_de: Ein KI-Reallabor ist ein von einer zuständigen Behörde geschaffener kontrollierter Rahmen, den Anbieter oder zukünftige Anbieter nach einem Plan für einen begrenzten Zeitraum und unter regulatorischer Aufsicht nutzen können, um ein innovatives KI-System zu entwickeln, zu trainieren, zu validieren und gegebenenfalls unter Realbedingungen zu testen (Art. 3 Nr. 55 KI-VO). Jeder Mitgliedstaat sorgt dafür, dass seine zuständigen Behörden mindestens ein KI-Reallabor auf nationaler Ebene einrichten, das bis zum 2. August 2027 einsatzbereit sein muss, auch gemeinsam mit anderen Mitgliedstaaten oder durch Beteiligung an einem bestehenden Reallabor; zusätzliche regionale oder lokale Reallabore sind möglich (Art. 57 Abs. 1 und 2 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: deep-fake
  type: Concept
  name_en: Deep fake
  name_de: Deepfake
  summary_en: Under the AI Act, a deep fake is "AI-generated or manipulated image, audio or video content that resembles existing persons, objects, places, entities or events and would falsely appear to a person to be authentic or truthful" (Art. 3(60) AI Act). Since a later amendment, placing on the market or using AI systems that generate realistic intimate images or sexually explicit depictions of an identifiable person without explicit consent is a prohibited practice (Art. 5(1)(ba) AI Act).
  summary_de: Nach der KI-Verordnung ist ein Deepfake „ein durch KI erzeugter oder manipulierter Bild-, Ton- oder Videoinhalt, der wirklichen Personen, Gegenständen, Orten, Einrichtungen oder Ereignissen ähnelt und einer Person fälschlicherweise als echt oder wahrheitsgemäß erscheinen würde“ (Art. 3 Nr. 60 KI-VO). Seit einer späteren Änderung ist das Inverkehrbringen oder Verwenden von KI-Systemen verboten, die ohne ausdrückliche Zustimmung realistische Darstellungen intimer Körperteile oder eindeutig sexueller Handlungen einer bestimmbaren Person erzeugen (Art. 5 Abs. 1 Buchst. ba KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: ai-act-provider
  type: Concept
  name_en: Provider (AI Act)
  name_de: Anbieter (KI-Verordnung)
  summary_en: A provider under the AI Act is a natural or legal person, public authority, agency or other body that develops an AI system or a general-purpose AI model, or has one developed, and places it on the market or puts the AI system into service under its own name or trademark, whether for payment or free of charge (Art. 3(3) AI Act).
  summary_de: Anbieter im Sinne der KI-Verordnung ist eine natürliche oder juristische Person, Behörde, Einrichtung oder sonstige Stelle, die ein KI-System oder ein KI-Modell mit allgemeinem Verwendungszweck entwickelt oder entwickeln lässt und es unter ihrem eigenen Namen oder ihrer Handelsmarke in Verkehr bringt oder das KI-System unter ihrem eigenen Namen oder ihrer Handelsmarke in Betrieb nimmt, sei es entgeltlich oder unentgeltlich (Art. 3 Nr. 3 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: ai-act-deployer
  type: Concept
  name_en: Deployer (AI Act)
  name_de: Betreiber (KI-Verordnung)
  summary_en: A deployer under the AI Act is a natural or legal person, public authority, agency or other body using an AI system under its authority, except where the AI system is used in the course of a personal non-professional activity (Art. 3(4) AI Act). Like providers, deployers must for example take measures to support the AI literacy of their staff (Art. 4 AI Act).
  summary_de: Betreiber im Sinne der KI-Verordnung ist eine natürliche oder juristische Person, Behörde, Einrichtung oder sonstige Stelle, die ein KI-System in eigener Verantwortung verwendet, es sei denn, das KI-System wird im Rahmen einer persönlichen und nicht beruflichen Tätigkeit verwendet (Art. 3 Nr. 4 KI-VO). Wie Anbieter müssen Betreiber etwa Maßnahmen ergreifen, um die KI-Kompetenz ihres Personals zu unterstützen (Art. 4 KI-VO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R1689-20260727
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:02024R1689-20260727
- id: digital-omnibus-on-ai
  type: Regulation
  name_en: Digital Omnibus on AI (Regulation (EU) 2026/1744)
  name_de: Digital-Omnibus zur KI (Verordnung (EU) 2026/1744)
  aliases:
  - Digital Omnibus on AI
  - Regulation (EU) 2026/1744
  summary_en: Regulation (EU) 2026/1744 of 8 July 2026 (Digital Omnibus on AI) amends the AI Act, Regulation (EU) 2024/1689, together with Regulations (EU) 2018/1139 and (EU) 2023/1230, to simplify the implementation of harmonised rules on artificial intelligence. Among other changes, it adds small mid-cap enterprises to the AI Act's innovation support measures and limits which provisions apply to high-risk AI systems related to products under Section B of Annex I (Art. 1).
  summary_de: Die Verordnung (EU) 2026/1744 vom 8. Juli 2026 (Digital-Omnibus-Verordnung zur KI) ändert die KI-Verordnung (EU) 2024/1689 sowie die Verordnungen (EU) 2018/1139 und (EU) 2023/1230, um die Umsetzung harmonisierter Vorschriften für künstliche Intelligenz zu vereinfachen. Unter anderem bezieht sie kleine Midcap-Unternehmen in die Maßnahmen zur Innovationsförderung ein und begrenzt, welche Vorschriften für Hochrisiko-KI-Systeme im Zusammenhang mit Produkten nach Anhang I Abschnitt B gelten (Art. 1).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32026R1744
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32026R1744
- id: edps
  type: Organisation
  name_en: European Data Protection Supervisor (EDPS)
  name_de: Europäischer Datenschutzbeauftragter (EDSB)
  aliases:
  - EDPS
  - EDSB
  summary_en: The European Data Protection Supervisor (EDPS) ensures that Union institutions and bodies respect the fundamental rights and freedoms of natural persons, in particular their right to data protection, when processing personal data (Art. 52(1)–(2) Regulation (EU) 2018/1725). The EDPS monitors and ensures the application of that Regulation and other Union acts on data protection by Union institutions and bodies (Art. 52(3)).
  summary_de: Der Europäische Datenschutzbeauftragte (EDSB) stellt sicher, dass die Organe und Einrichtungen der Union bei der Verarbeitung personenbezogener Daten die Grundrechte und Grundfreiheiten natürlicher Personen, insbesondere ihr Recht auf Datenschutz, achten (Art. 52 Abs. 1 und 2 Verordnung (EU) 2018/1725). Er überwacht und setzt die Anwendung dieser Verordnung und anderer Datenschutzrechtsakte der Union durch die Organe und Einrichtungen der Union durch (Art. 52 Abs. 3).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32018R1725
- id: weights-and-biases
  type: Technology
  name_en: Weights & Biases
  name_de: Weights & Biases
  aliases:
  - W&B
  - wandb
  summary_en: Weights & Biases (W&B) is a platform for machine learning development that offers experiment tracking, hyperparameter sweeps, artifacts, reports and automations, plus W&B Weave for evaluating LLM and agent applications (W&B documentation).
  summary_de: Weights & Biases (W&B) ist eine Plattform für die Entwicklung im maschinellen Lernen mit Experiment-Tracking, Hyperparameter-Sweeps, Artefakten, Berichten und Automatisierungen sowie W&B Weave zur Evaluation von LLM- und Agentenanwendungen (W&B-Dokumentation).
  sources:
  - https://docs.wandb.ai/
- id: neptune
  type: Technology
  name_en: Neptune (experiment tracking)
  name_de: Neptune (Experiment Tracking)
  summary_en: Neptune was an experiment tracker for teams training foundation models (Neptune documentation). Following its acquisition by OpenAI, the service was discontinued on 5 March 2026, with remaining data deleted at shutdown.
  summary_de: Neptune war ein Experiment-Tracker für Teams, die Foundation Models trainieren (Neptune-Dokumentation). Nach der Übernahme durch OpenAI wurde der Dienst am 5. März 2026 eingestellt; verbliebene Daten wurden dabei gelöscht.
  sources:
  - https://docs.neptune.ai/
- id: tensorboard
  type: Technology
  name_en: TensorBoard
  name_de: TensorBoard
  summary_en: TensorBoard is the visualisation toolkit of TensorFlow for machine learning experiments (TensorFlow documentation). It tracks and plots metrics such as loss and accuracy, shows the model graph and histograms of weights and biases over time, projects embeddings into lower-dimensional space, displays images, text and audio, and profiles TensorFlow programs.
  summary_de: TensorBoard ist das Visualisierungswerkzeug von TensorFlow für Experimente im maschinellen Lernen (TensorFlow-Dokumentation). Es verfolgt und zeichnet Metriken wie Loss und Accuracy, zeigt den Modellgraphen und Histogramme von Gewichten und Biases im Zeitverlauf, projiziert Embeddings in niedrigere Dimensionen, stellt Bilder, Text und Audio dar und profiliert TensorFlow-Programme.
  sources:
  - https://www.tensorflow.org/tensorboard
- id: model-registry
  type: Concept
  name_en: Model registry
  name_de: Model Registry
  summary_en: A model registry is a centralised model store with APIs and a user interface for managing the lifecycle of machine learning models (MLflow, n.d.). The MLflow Model Registry, for example, provides versioning, lineage to the run that produced each version, aliases such as @champion for deployment workflows, and tags and annotations.
  summary_de: Eine Model Registry ist ein zentraler Modellspeicher mit APIs und Oberfläche zur Verwaltung des Lebenszyklus von ML-Modellen (MLflow, n.d.). Die MLflow Model Registry etwa bietet Versionierung, Lineage zum erzeugenden Run jeder Version, Aliase wie @champion für Bereitstellungsabläufe sowie Tags und Anmerkungen.
  sources:
  - https://mlflow.org/docs/latest/ml/model-registry/
- id: neurips
  type: Conference
  name_en: NeurIPS
  name_de: NeurIPS
- id: individual-fairness
  type: Concept
  name_en: Individual fairness
  name_de: Individuelle Fairness
  summary_en: Individual fairness requires that similar individuals be treated similarly, measured by a task-specific metric of how similar individuals are with respect to the classification task (Dwork et al., 2011). Dwork et al. proposed a framework that maximises the classifier's utility subject to this constraint.
  summary_de: Individuelle Fairness verlangt, dass ähnliche Personen ähnlich behandelt werden, gemessen mit einer aufgabenspezifischen Metrik dafür, wie ähnlich sich Personen in Bezug auf die Klassifikationsaufgabe sind (Dwork et al., 2011). Dwork et al. schlugen einen Rahmen vor, der den Nutzen des Klassifikators unter dieser Nebenbedingung maximiert.
  sources:
  - https://arxiv.org/abs/1104.3913
- id: group-fairness
  type: Concept
  name_en: Group fairness
  name_de: Gruppenfairness
  summary_en: Group fairness covers statistical fairness definitions that fix a small collection of pre-defined groups and require parity of some statistic of the classifier, such as false positive rates or the rate of positive decisions, across them (Kearns et al., 2017). Examples are demographic parity, equalised odds and predictive parity.
  summary_de: Gruppenfairness umfasst statistische Fairnessbegriffe, die eine kleine Menge vorab festgelegter Gruppen bestimmen und Parität einer Kennzahl des Klassifikators über diese Gruppen verlangen, etwa der False Positive Rates oder des Anteils positiver Entscheidungen (Kearns et al., 2017). Beispiele sind demografische Parität, Equalised Odds und Predictive Parity.
  sources:
  - https://arxiv.org/abs/1711.05144
- id: subgroup-fairness
  type: Concept
  name_en: Subgroup fairness
  name_de: Subgruppen-Fairness
  summary_en: Subgroup fairness demands statistical notions of fairness, such as equal false positive rates or statistical parity, across exponentially or infinitely many subgroups defined by a structured class of functions over the protected attributes, interpolating between group and individual fairness (Kearns et al., 2017). Auditing it is computationally hard in the worst case; Kearns et al. give algorithms based on a game between a learner and an auditor.
  summary_de: Subgruppenfairness verlangt statistische Fairnessbegriffe wie gleiche False Positive Rates oder statistische Parität über exponentiell oder unendlich viele Teilgruppen, die durch eine strukturierte Funktionsklasse über den geschützten Merkmalen bestimmt sind, und liegt damit zwischen Gruppen- und individueller Fairness (Kearns et al., 2017). Ihre Prüfung ist im schlimmsten Fall rechnerisch schwer; Kearns et al. geben Algorithmen auf Grundlage eines Spiels zwischen Lerner und Prüfer an.
  sources:
  - https://arxiv.org/abs/1711.05144
- id: fairness-through-awareness
  type: Concept
  name_en: Fairness through awareness
  name_de: Fairness through Awareness
  summary_en: 'Fairness Through Awareness is the framework by Dwork et al. (2011) for fair classification: with a task-specific similarity metric between individuals, a classifier maximises utility subject to the constraint that similar individuals are treated similarly. An adaptation achieves "fair affirmative action", guaranteeing statistical parity while treating similar individuals as similarly as possible.'
  summary_de: 'Fairness Through Awareness ist der Rahmen von Dwork et al. (2011) für faire Klassifikation: Mit einer aufgabenspezifischen Ähnlichkeitsmetrik zwischen Personen maximiert ein Klassifikator seinen Nutzen unter der Bedingung, dass ähnliche Personen ähnlich behandelt werden. Eine Anpassung erreicht „faire Fördermaßnahmen“, die statistische Parität garantieren und ähnliche Personen dennoch möglichst ähnlich behandeln.'
  sources:
  - https://arxiv.org/abs/1104.3913
- id: fairness-through-unawareness
  type: Concept
  name_en: Fairness through unawareness
  name_de: Fairness through Unawareness
  summary_en: Fairness through unawareness (FTU) considers an algorithm fair as long as protected attributes are not explicitly used in decision-making (Kusner et al., 2017). Its clear shortcoming is that other features can contain discriminatory information equivalent to the protected attribute, so removing the attribute alone does not prevent discrimination.
  summary_de: Fairness through Unawareness (FTU) hält einen Algorithmus für fair, solange geschützte Merkmale nicht ausdrücklich in die Entscheidung eingehen (Kusner et al., 2017). Ihr deutlicher Mangel ist, dass andere Merkmale diskriminierende Informationen enthalten können, die dem geschützten Merkmal entsprechen, sodass dessen bloßes Weglassen Diskriminierung nicht verhindert.
  sources:
  - https://arxiv.org/abs/1703.06856
- id: demographic-parity
  type: Concept
  name_en: Demographic parity
  name_de: Demographic Parity
  aliases:
  - statistical parity
  summary_en: Demographic parity, also called statistical parity, requires that a decision, such as accepting or denying a loan application, be independent of the protected attribute (Hardt et al., 2016). Hardt et al. note that it often cripples utility when the target, for example actually defaulting, is correlated with the protected attribute.
  summary_de: Demografische Parität, auch statistische Parität, verlangt, dass eine Entscheidung, etwa über die Annahme oder Ablehnung eines Kreditantrags, vom geschützten Merkmal unabhängig ist (Hardt et al., 2016). Hardt et al. merken an, dass sie den Nutzen oft stark einschränkt, wenn die Zielgröße, etwa ein tatsächlicher Zahlungsausfall, mit dem geschützten Merkmal korreliert.
  sources:
  - https://arxiv.org/abs/1610.02413
- id: equalised-odds
  type: Concept
  name_en: Equalised odds
  name_de: Equalised Odds
  aliases:
  - equalized odds
  summary_en: A predictor satisfies equalised odds if its prediction and the protected attribute are independent conditional on the true outcome; for binary variables this means equal true positive rates and equal false positive rates across groups (Hardt et al., 2016). Unlike demographic parity, it allows the prediction to depend on the protected attribute through the true outcome.
  summary_de: Ein Prädiktor erfüllt Equalised Odds, wenn Vorhersage und geschütztes Merkmal bedingt auf das wahre Ergebnis unabhängig sind; bei binären Variablen bedeutet das gleiche True Positive Rates und gleiche False Positive Rates in allen Gruppen (Hardt et al., 2016). Anders als demografische Parität erlaubt es eine Abhängigkeit der Vorhersage vom geschützten Merkmal über das wahre Ergebnis.
  sources:
  - https://arxiv.org/abs/1610.02413
- id: equal-opportunity
  type: Concept
  name_en: Equal opportunity
  name_de: Equal Opportunity
  summary_en: A binary predictor satisfies equal opportunity if its true positive rate is the same across groups defined by the protected attribute, that is, among individuals whose true outcome is positive, each group receives a positive prediction equally often (Hardt et al., 2016). It is a weaker notion than equalised odds and typically allows higher utility.
  summary_de: Ein binärer Prädiktor erfüllt Equal Opportunity, wenn seine True Positive Rate in allen durch das geschützte Merkmal bestimmten Gruppen gleich ist, unter Personen mit tatsächlich positivem Ergebnis also jede Gruppe gleich häufig eine positive Vorhersage erhält (Hardt et al., 2016). Es ist ein schwächerer Begriff als Equalised Odds und erlaubt in der Regel einen höheren Nutzen.
  sources:
  - https://arxiv.org/abs/1610.02413
- id: predictive-parity
  type: Concept
  name_en: Predictive parity
  name_de: Predictive Parity
  summary_en: A score satisfies predictive parity at a threshold if the likelihood of the outcome among those classified as high-risk is the same regardless of group, that is, the positive predictive value is equal across groups (Chouldechova, 2017). Chouldechova showed that when prevalence differs between groups, predictive parity and equal error rates cannot all be satisfied at once, as in the debate over the COMPAS recidivism score.
  summary_de: Ein Score erfüllt Predictive Parity an einer Schwelle, wenn die Wahrscheinlichkeit des Ereignisses unter den als hochriskant Eingestuften unabhängig von der Gruppe gleich ist, der positive Vorhersagewert also in allen Gruppen gleich ist (Chouldechova, 2017). Chouldechova zeigte, dass sich Predictive Parity und gleiche Fehlerraten nicht zugleich erfüllen lassen, wenn sich die Prävalenz zwischen Gruppen unterscheidet, wie in der Debatte über den Rückfall-Score COMPAS.
  sources:
  - https://arxiv.org/abs/1703.00056
- id: fairness-gerrymandering
  type: Concept
  name_en: Fairness gerrymandering
  name_de: Fairness Gerrymandering
  summary_en: Fairness gerrymandering is when a classifier appears fair on each of a few pre-defined groups but badly violates the fairness constraint on structured subgroups defined over combinations of the protected attributes, whether intentionally or not (Kearns et al., 2017). Subgroup fairness was proposed to prevent it.
  summary_de: Fairness Gerrymandering liegt vor, wenn ein Klassifikator für jede von wenigen vorab festgelegten Gruppen fair erscheint, die Fairnessbedingung aber für strukturierte Teilgruppen aus Kombinationen geschützter Merkmale deutlich verletzt, absichtlich oder nicht (Kearns et al., 2017). Subgruppenfairness wurde vorgeschlagen, um das zu verhindern.
  sources:
  - https://arxiv.org/abs/1711.05144
- id: target-encoding
  type: Method
  name_en: Target encoding
  name_de: Target Encoding
  summary_en: Target encoding replaces each category of a nominal feature by the mean of the target conditioned on that category, blended with the overall target mean (scikit-learn developers, n.d.-g). It is useful for high-cardinality features such as postcodes, where one-hot encoding would inflate the feature space; scikit-learn's TargetEncoder uses cross fitting to avoid leaking the target into training.
  summary_de: Target Encoding ersetzt jede Kategorie eines nominalen Merkmals durch den Mittelwert der Zielgröße für diese Kategorie, gemischt mit dem Gesamtmittel der Zielgröße (scikit-learn developers, n.d.-g). Es eignet sich für Merkmale mit vielen Ausprägungen wie Postleitzahlen, bei denen One-Hot-Encoding den Merkmalsraum aufblähen würde; der TargetEncoder in scikit-learn nutzt Cross Fitting, damit die Zielgröße nicht ins Training durchsickert.
  sources:
  - https://scikit-learn.org/stable/modules/preprocessing.html
- id: fourier-terms
  type: Method
  name_en: Fourier terms (seasonal features)
  name_de: Fourier-Terme (saisonale Merkmale)
  summary_en: Fourier terms are pairs of sine and cosine terms at the seasonal frequencies, sin(2πkt/m) and cos(2πkt/m) for seasonal period m, used as predictors for seasonal patterns instead of seasonal dummy variables (Hyndman and Athanasopoulos 2021). They usually need fewer predictors than dummies, which makes them useful for long seasonal periods such as weekly data with m ≈ 52.
  summary_de: Fourier-Terme sind Paare aus Sinus- und Kosinustermen bei den saisonalen Frequenzen, sin(2πkt/m) und cos(2πkt/m) für die Saisonperiode m, die statt saisonaler Dummy-Variablen als Prädiktoren für saisonale Muster dienen (Hyndman und Athanasopoulos 2021). Sie brauchen meist weniger Prädiktoren als Dummies und eignen sich daher für lange Saisonperioden, etwa Wochendaten mit m ≈ 52.
  sources:
  - https://otexts.com/fpp3/useful-predictors.html
- id: feature-selection
  type: Method
  name_en: Feature selection
  name_de: Feature Selection
  summary_en: Feature selection reduces the set of input features, either to improve an estimator's accuracy or to boost performance on very high-dimensional data (scikit-learn developers, n.d.-f). Approaches range from removing features with low variance and univariate statistical tests to recursive elimination and selection based on model weights, for example the sparse coefficients of the lasso.
  summary_de: Merkmalsauswahl verkleinert die Menge der Eingabemerkmale, um die Genauigkeit eines Schätzers zu verbessern oder die Leistung bei sehr hochdimensionalen Daten zu steigern (scikit-learn developers, n.d.-f). Die Verfahren reichen vom Entfernen von Merkmalen mit geringer Varianz und univariaten statistischen Tests bis zu rekursiver Elimination und Auswahl über Modellgewichte, etwa die dünn besetzten Koeffizienten des Lasso.
  sources:
  - https://scikit-learn.org/stable/modules/feature_selection.html
- id: lasso
  type: Method
  name_en: Lasso
  name_de: Lasso
  summary_en: The lasso is a linear model with an L1 penalty on the coefficients that estimates sparse solutions, setting some coefficients exactly to zero and thereby reducing the number of features a model depends on (scikit-learn developers, n.d.-d). This makes it useful for feature selection and fundamental to compressed sensing.
  summary_de: Das Lasso ist ein lineares Modell mit L1-Strafe auf die Koeffizienten, das dünn besetzte Lösungen schätzt, einige Koeffizienten exakt auf null setzt und so die Zahl der Merkmale verringert, von denen ein Modell abhängt (scikit-learn developers, n.d.-d). Das macht es nützlich für die Merkmalsauswahl und grundlegend für Compressed Sensing.
  sources:
  - https://scikit-learn.org/stable/modules/linear_model.html
- id: data-leakage
  type: Concept
  name_en: Data leakage
  name_de: Data Leakage
  aliases:
  - leakage
  summary_en: Data leakage is the introduction of information about the target that should not legitimately be available to the model; it is considered one of the top data mining mistakes and has affected major public competitions (Kaufman et al. 2012). A common source is fitting preprocessing on all data before splitting, which pipelines fitted only on training data prevent (Pedregosa et al. 2011).
  summary_de: Data Leakage bezeichnet das Einschleusen von Informationen über die Zielgröße, die dem Modell legitimerweise nicht zur Verfügung stehen sollten; es gilt als einer der häufigsten Fehler im Data Mining und hat große öffentliche Wettbewerbe beeinträchtigt (Kaufman et al. 2012). Eine häufige Ursache ist das Anpassen der Vorverarbeitung auf allen Daten vor der Aufteilung, was Pipelines verhindern, die nur auf den Trainingsdaten angepasst werden (Pedregosa et al. 2011).
  sources:
  - https://doi.org/10.1145/2382577.2382579
  - https://jmlr.org/papers/v12/pedregosa11a.html
- id: data-protection-directive-1995
  type: Regulation
  name_en: Data Protection Directive 95/46/EC
  name_de: Datenschutzrichtlinie 95/46/EG
  aliases:
  - Directive 95/46/EC
  summary_en: The Data Protection Directive 95/46/EC was the EU's general data protection law before the GDPR. It was repealed with effect from 25 May 2018; references to it are read as references to the GDPR, and references to its Article 29 Working Party as references to the European Data Protection Board (Art. 94 GDPR).
  summary_de: Die Datenschutzrichtlinie 95/46/EG war vor der DSGVO das allgemeine Datenschutzrecht der EU. Sie wurde mit Wirkung vom 25. Mai 2018 aufgehoben; Verweise auf sie gelten als Verweise auf die DSGVO und Verweise auf die Artikel-29-Datenschutzgruppe als Verweise auf den Europäischen Datenschutzausschuss (Art. 94 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: edpb
  type: Organisation
  name_en: European Data Protection Board (EDPB)
  name_de: Europäischer Datenschutzausschuss (EDSA)
  aliases:
  - EDPB
  - EDSA
  summary_en: The European Data Protection Board (EDPB) is a body of the Union with legal personality, composed of the head of one supervisory authority of each Member State and the European Data Protection Supervisor, or their representatives (Art. 68 GDPR). It ensures the consistent application of the GDPR, among other things by monitoring its application and issuing guidelines, recommendations and best practices (Art. 70 GDPR).
  summary_de: Der Europäische Datenschutzausschuss (EDSA) ist eine Einrichtung der Union mit eigener Rechtspersönlichkeit und besteht aus dem Leiter einer Aufsichtsbehörde jedes Mitgliedstaats und dem Europäischen Datenschutzbeauftragten oder ihren jeweiligen Vertretern (Art. 68 DSGVO). Er stellt die einheitliche Anwendung der DSGVO sicher, unter anderem indem er ihre Anwendung überwacht und Leitlinien, Empfehlungen und bewährte Verfahren bereitstellt (Art. 70 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: personal-data
  type: Concept
  name_en: Personal data
  name_de: Personenbezogene Daten
  summary_en: Under the GDPR, personal data means "any information relating to an identified or identifiable natural person"; a person is identifiable if they can be identified directly or indirectly, in particular by reference to an identifier such as a name, an identification number, location data, an online identifier or factors specific to their physical, physiological, genetic, mental, economic, cultural or social identity (Art. 4(1) GDPR).
  summary_de: Nach der DSGVO sind personenbezogene Daten „alle Informationen, die sich auf eine identifizierte oder identifizierbare natürliche Person […] beziehen“; identifizierbar ist eine Person, die direkt oder indirekt, insbesondere mittels Zuordnung zu einer Kennung wie einem Namen, einer Kennnummer, Standortdaten, einer Online-Kennung oder besonderen Merkmalen ihrer physischen, physiologischen, genetischen, psychischen, wirtschaftlichen, kulturellen oder sozialen Identität identifiziert werden kann (Art. 4 Nr. 1 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: special-categories-of-personal-data
  type: Concept
  name_en: Special categories of personal data
  name_de: Besondere Kategorien personenbezogener Daten
  summary_en: Special categories of personal data are data revealing racial or ethnic origin, political opinions, religious or philosophical beliefs or trade union membership, as well as genetic data, biometric data for uniquely identifying a person, health data and data concerning a person's sex life or sexual orientation; processing them is prohibited unless one of the exceptions in Article 9(2) applies (Art. 9 GDPR).
  summary_de: Besondere Kategorien personenbezogener Daten sind Daten, aus denen die rassische und ethnische Herkunft, politische Meinungen, religiöse oder weltanschauliche Überzeugungen oder die Gewerkschaftszugehörigkeit hervorgehen, sowie genetische Daten, biometrische Daten zur eindeutigen Identifizierung, Gesundheitsdaten und Daten zum Sexualleben oder zur sexuellen Orientierung; ihre Verarbeitung ist untersagt, sofern keine Ausnahme nach Artikel 9 Absatz 2 greift (Art. 9 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: data-minimisation
  type: Concept
  name_en: Data minimisation
  name_de: Datenminimierung
  summary_en: 'Data minimisation is one of the GDPR''s principles for processing personal data: personal data must be "adequate, relevant and limited to what is necessary in relation to the purposes for which they are processed" (Art. 5(1)(c) GDPR). It sits alongside lawfulness, fairness and transparency, purpose limitation and accuracy.'
  summary_de: 'Datenminimierung ist einer der Grundsätze der DSGVO für die Verarbeitung personenbezogener Daten: Sie müssen „dem Zweck angemessen und erheblich sowie auf das für die Zwecke der Verarbeitung notwendige Maß beschränkt sein“ (Art. 5 Abs. 1 Buchst. c DSGVO). Er steht neben Rechtmäßigkeit, Verarbeitung nach Treu und Glauben und Transparenz, Zweckbindung und Richtigkeit.'
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: right-to-erasure
  type: Concept
  name_en: Right to erasure
  name_de: Recht auf Löschung
  summary_en: The right to erasure ("right to be forgotten") entitles data subjects to have the controller erase their personal data without undue delay where one of several grounds applies, for example when the data are no longer necessary for their purposes or consent is withdrawn and there is no other legal ground (Art. 17 GDPR).
  summary_de: Das Recht auf Löschung („Recht auf Vergessenwerden“) gibt betroffenen Personen das Recht, vom Verantwortlichen die unverzügliche Löschung ihrer personenbezogenen Daten zu verlangen, wenn einer von mehreren Gründen vorliegt, etwa wenn die Daten für ihre Zwecke nicht mehr notwendig sind oder die Einwilligung widerrufen wird und keine andere Rechtsgrundlage besteht (Art. 17 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: automated-decision-making
  type: Concept
  name_en: Automated individual decision-making
  name_de: Automatisierte Entscheidung im Einzelfall
  summary_en: Under Article 22 GDPR, data subjects have the right not to be subject to a decision based solely on automated processing, including profiling, which produces legal effects concerning them or similarly significantly affects them. Exceptions apply where the decision is necessary for a contract, authorised by Union or Member State law with suitable safeguards, or based on explicit consent (Art. 22(2) GDPR).
  summary_de: Nach Artikel 22 DSGVO haben betroffene Personen das Recht, nicht einer ausschließlich auf einer automatisierten Verarbeitung einschließlich Profiling beruhenden Entscheidung unterworfen zu werden, die ihnen gegenüber rechtliche Wirkung entfaltet oder sie in ähnlicher Weise erheblich beeinträchtigt. Ausnahmen gelten, wenn die Entscheidung für einen Vertrag erforderlich ist, nach Unions- oder mitgliedstaatlichem Recht mit angemessenen Schutzmaßnahmen zulässig ist oder auf ausdrücklicher Einwilligung beruht (Art. 22 Abs. 2 DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: dpia
  type: Concept
  name_en: Data protection impact assessment (DPIA)
  name_de: Datenschutz-Folgenabschätzung (DSFA)
  aliases:
  - DPIA
  - DSFA
  summary_en: A data protection impact assessment (DPIA) is required where a type of processing, in particular one using new technologies, is likely to result in a high risk to the rights and freedoms of natural persons; the controller must assess the impact of the envisaged processing on the protection of personal data before processing begins (Art. 35(1) GDPR). One assessment may cover a set of similar processing operations.
  summary_de: Eine Datenschutz-Folgenabschätzung ist erforderlich, wenn eine Form der Verarbeitung, insbesondere bei Verwendung neuer Technologien, voraussichtlich ein hohes Risiko für die Rechte und Freiheiten natürlicher Personen zur Folge hat; der Verantwortliche schätzt dann vorab die Folgen der vorgesehenen Verarbeitung für den Schutz personenbezogener Daten ab (Art. 35 Abs. 1 DSGVO). Eine einzige Abschätzung kann mehrere ähnliche Verarbeitungsvorgänge umfassen.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: binding-corporate-rules
  type: Concept
  name_en: Binding corporate rules
  name_de: Verbindliche interne Datenschutzvorschriften
  summary_en: Binding corporate rules are personal data protection policies adhered to by a controller or processor established in a Member State for transfers of personal data to a controller or processor in one or more third countries within a group of undertakings or of enterprises engaged in a joint economic activity (Art. 4(20) GDPR). Approved under Article 47, they are one of the appropriate safeguards for transfers to third countries (Art. 46(2)(b) GDPR).
  summary_de: Verbindliche interne Datenschutzvorschriften sind Maßnahmen zum Schutz personenbezogener Daten, zu deren Einhaltung sich ein in einem Mitgliedstaat niedergelassener Verantwortlicher oder Auftragsverarbeiter für Übermittlungen an einen Verantwortlichen oder Auftragsverarbeiter derselben Unternehmensgruppe oder einer Gruppe von Unternehmen mit gemeinsamer Wirtschaftstätigkeit in Drittländern verpflichtet (Art. 4 Nr. 20 DSGVO). Nach Artikel 47 genehmigt, sind sie eine der geeigneten Garantien für Übermittlungen in Drittländer (Art. 46 Abs. 2 Buchst. b DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: standard-contractual-clauses
  type: Concept
  name_en: Standard contractual clauses
  name_de: Standardvertragsklauseln
  aliases:
  - standard data protection clauses
  summary_en: Standard data protection clauses adopted by the Commission are one of the appropriate safeguards under which personal data may be transferred to a third country or international organisation without an adequacy decision and without specific authorisation from a supervisory authority, provided enforceable data subject rights and effective legal remedies are available (Art. 46(1)–(2)(c) GDPR). Supervisory authorities may also adopt such clauses, subject to Commission approval (Art. 46(2)(d) GDPR).
  summary_de: Von der Kommission erlassene Standarddatenschutzklauseln sind eine der geeigneten Garantien, unter denen personenbezogene Daten ohne Angemessenheitsbeschluss und ohne besondere Genehmigung einer Aufsichtsbehörde an ein Drittland oder eine internationale Organisation übermittelt werden dürfen, sofern durchsetzbare Rechte und wirksame Rechtsbehelfe für betroffene Personen bestehen (Art. 46 Abs. 1 und Abs. 2 Buchst. c DSGVO). Auch Aufsichtsbehörden können solche Klauseln annehmen, die die Kommission genehmigt (Art. 46 Abs. 2 Buchst. d DSGVO).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016R0679
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32016R0679
- id: version-control
  type: Concept
  name_en: Version control
  name_de: Versionskontrolle
  summary_en: Version control records the history of a project's files so that earlier states can be inspected and restored. Most systems such as CVS and Subversion store changes to each file over time (delta-based), whereas Git stores a series of snapshots of the whole project, one per commit (Chacon & Straub, n.d.).
  summary_de: Versionsverwaltung hält die Geschichte der Dateien eines Projekts fest, sodass frühere Stände eingesehen und wiederhergestellt werden können. Die meisten Systeme wie CVS und Subversion speichern Änderungen je Datei über die Zeit (deltabasiert), während Git eine Folge von Momentaufnahmen des ganzen Projekts speichert, eine je Commit (Chacon & Straub, n.d.).
  sources:
  - https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F
- id: git-snapshot
  type: Concept
  name_en: Snapshot (Git)
  name_de: Snapshot (Git)
  summary_en: 'Git stores data as a series of snapshots of a miniature file system rather than as file-based changes: every commit records what all files look like at that moment and stores a reference to that snapshot, linking to unchanged files instead of storing them again (Chacon & Straub, n.d.). This distinguishes Git from delta-based version control systems such as CVS or Subversion.'
  summary_de: 'Git speichert Daten als Folge von Momentaufnahmen eines kleinen Dateisystems statt als dateibezogene Änderungen: Jeder Commit hält fest, wie alle Dateien in diesem Moment aussehen, und speichert einen Verweis auf diese Momentaufnahme, wobei unveränderte Dateien verlinkt statt erneut gespeichert werden (Chacon & Straub, n.d.). Das unterscheidet Git von deltabasierten Versionsverwaltungen wie CVS oder Subversion.'
  sources:
  - https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F
- id: git-branch
  type: Concept
  name_en: Branch (Git)
  name_de: Branch (Git)
  summary_en: A branch in Git is simply a lightweight movable pointer to a commit; each new commit moves the current branch pointer forward (Chacon & Straub, n.d.). Creating a branch just creates a new pointer to the current commit, and the default branch created by git init is not special in any way.
  summary_de: Ein Branch in Git ist einfach ein leichtgewichtiger, verschiebbarer Zeiger auf einen Commit; jeder neue Commit bewegt den Zeiger des aktuellen Branches weiter (Chacon & Straub, n.d.). Einen Branch anzulegen erzeugt nur einen neuen Zeiger auf den aktuellen Commit, und der von git init angelegte Standard-Branch ist in keiner Weise besonders.
  sources:
  - https://git-scm.com/book/en/v2/Git-Branching-Branches-in-a-Nutshell
- id: git-staging-area
  type: Concept
  name_en: Staging area (Git)
  name_de: Staging Area (Git)
  aliases:
  - three states
  summary_en: The staging area in Git is a file in the Git directory that records what will go into the next commit; a staged file is a modified file marked to be included in its current version (Chacon & Straub, n.d.). Files thus move between three states, modified, staged and committed, across the working tree, the staging area and the Git directory.
  summary_de: Die Staging Area in Git ist eine Datei im Git-Verzeichnis, die festhält, was in den nächsten Commit eingeht; eine vorgemerkte (staged) Datei ist eine geänderte Datei, die in ihrer aktuellen Fassung für den Commit markiert ist (Chacon & Straub, n.d.). Dateien durchlaufen so drei Zustände, geändert, vorgemerkt und committet, verteilt auf Arbeitsverzeichnis, Staging Area und Git-Verzeichnis.
  sources:
  - https://git-scm.com/book/en/v2/Getting-Started-What-is-Git%3F
- id: gitignore
  type: Technology
  name_en: .gitignore
  name_de: .gitignore
  summary_en: A .gitignore file specifies intentionally untracked files that Git should ignore, one pattern per line; files that Git already tracks are not affected (Git, n.d.). Patterns are read from several sources with a defined precedence, and a .gitignore in a directory applies relative to its location.
  summary_de: Eine .gitignore-Datei legt bewusst nicht verfolgte Dateien fest, die Git ignorieren soll, ein Muster je Zeile; bereits von Git verfolgte Dateien sind davon nicht betroffen (Git, n.d.). Muster werden aus mehreren Quellen in festgelegter Rangfolge gelesen, und eine .gitignore in einem Verzeichnis gilt relativ zu ihrem Ort.
  sources:
  - https://git-scm.com/docs/gitignore
- id: github
  type: Technology
  name_en: GitHub
  name_de: GitHub
  summary_en: GitHub is a platform for building software that hosts Git repositories and supports the software development life cycle from planning work to deploying and operating software (GitHub Docs).
  summary_de: GitHub ist eine Plattform für Softwareentwicklung, die Git-Repositories hostet und den Softwareentwicklungszyklus von der Planung bis zu Deployment und Betrieb unterstützt (GitHub Docs).
  sources:
  - https://docs.github.com/en/get-started/start-your-journey/about-github-and-git
- id: viv-trivedy
  type: Person
  name_en: Viv Trivedy
  name_de: Viv Trivedy
  summary_en: Viv Trivedy coined the term harness engineering, the design of the scaffolding around an AI model; the post "Anatomy of an Agent Harness" derives what an agent harness is and why each of its parts exists (Osmani 2026a).
  summary_de: Viv Trivedy prägte den Begriff Harness Engineering, also die Gestaltung des Gerüsts um ein KI-Modell; der Beitrag „Anatomy of an Agent Harness“ leitet her, was ein Agent-Harness ist und wozu seine einzelnen Teile dienen (Osmani 2026a).
  sources:
  - https://addyosmani.com/blog/agent-harness-engineering/
- id: sandboxing
  type: Concept
  name_en: Sandboxing
  name_de: Sandboxing
  summary_en: Sandboxing runs code in an isolated environment whose access to files, network and system resources is restricted. For AI agents, Anthropic recommends extensive testing in sandboxed environments with appropriate guardrails (Anthropic 2024); in Claude Code, for example, the operating system enforces which files and network domains shell commands may reach, so sandboxed commands can run without approval for each one.
  summary_de: Sandboxing führt Code in einer isolierten Umgebung aus, deren Zugriff auf Dateien, Netzwerk und Systemressourcen eingeschränkt ist. Für KI-Agenten empfiehlt Anthropic umfangreiche Tests in Sandbox-Umgebungen mit geeigneten Guardrails (Anthropic 2024); in Claude Code etwa setzt das Betriebssystem durch, welche Dateien und Netzwerkdomänen Shell-Befehle erreichen dürfen, sodass solche Befehle ohne Einzelfreigabe laufen können.
  sources:
  - https://www.anthropic.com/engineering/building-effective-agents
  - https://docs.claude.com/en/docs/claude-code/sandboxing
- id: least-privilege
  type: Concept
  name_en: Least privilege
  name_de: Least Privilege
  aliases:
  - principle of least privilege
  summary_en: The least-privilege principle limits access rights to what a task requires. DORA makes it a legal requirement for financial entities, which must implement policies that limit physical or logical access to information and ICT assets to what is required for legitimate and approved functions and activities only (Art. 9(4)(c) DORA); for AI agents, it means that an agent can only use the tools and data its task requires.
  summary_de: 'Das Prinzip der minimalen Rechte (Least Privilege) beschränkt Zugriffsrechte auf das, was eine Aufgabe erfordert. DORA macht es für Finanzunternehmen zur Rechtspflicht: Sie implementieren Richtlinien, die den physischen oder logischen Zugang zu Informations- und IKT-Assets ausschließlich auf den Umfang beschränken, der für rechtmäßige und zulässige Funktionen und Tätigkeiten erforderlich ist (Art. 9 Abs. 4 Buchst. c DORA); bei KI-Agenten bedeutet es, dass ein Agent nur die Werkzeuge und Daten nutzen kann, die seine Aufgabe erfordert.'
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022R2554
- id: open-ie
  type: Method
  name_en: Open information extraction (Open IE)
  name_de: Open Information Extraction (Open IE)
  aliases:
  - Open IE
  summary_en: Open information extraction (Open IE) is an extraction paradigm in which a system makes a single data-driven pass over a corpus and extracts a large set of relational tuples without requiring humans to name target relations, write rules or label training examples (Banko et al. 2007). This contrasts with traditional information extraction for narrow, pre-specified requests.
  summary_de: Open Information Extraction (Open IE) ist ein Extraktionsparadigma, bei dem ein System in einem einzigen datengetriebenen Durchlauf über ein Korpus eine große Menge relationaler Tupel extrahiert, ohne dass Menschen Zielrelationen benennen, Regeln schreiben oder Trainingsbeispiele annotieren (Banko et al. 2007). Das unterscheidet sie von klassischer Informationsextraktion für enge, vorab festgelegte Anfragen.
  sources:
  - https://www.ijcai.org/Proceedings/07/Papers/429.pdf
- id: textrunner
  type: Method
  name_en: TextRunner
  name_de: TextRunner
  summary_en: TextRunner is a fully implemented, highly scalable Open IE system (Banko et al. 2007). It assigns probabilities to the extracted tuples and indexes them for queries; on a corpus of 9 million web pages it reduced errors by 33% compared with the web extraction system KnowItAll on a comparable set of extractions.
  summary_de: TextRunner ist ein vollständig umgesetztes, hochskalierbares Open-IE-System (Banko et al. 2007). Es versieht die extrahierten Tupel mit Wahrscheinlichkeiten und indexiert sie für Abfragen; auf einem Korpus von 9 Millionen Webseiten verringerte es die Fehler gegenüber dem Websystem KnowItAll bei vergleichbaren Extraktionen um 33 %.
  sources:
  - https://www.ijcai.org/Proceedings/07/Papers/429.pdf
- id: relation-extraction
  type: Method
  name_en: Relation extraction
  name_de: Relationsextraktion
  summary_en: Relation extraction identifies relation triples (subject, relation, object) in raw text, for example to populate or validate knowledge bases or for fact checking (Huguet Cabot and Navigli 2021). Pipelines first recognise entities and then classify relations between them, which can propagate errors; end-to-end approaches solve both tasks together.
  summary_de: Relationsextraktion erkennt Relationstripel (Subjekt, Relation, Objekt) in Rohtext, etwa um Wissensbasen zu befüllen oder zu prüfen oder für Faktenchecks (Huguet Cabot und Navigli 2021). Pipelines erkennen zuerst Entitäten und klassifizieren dann Relationen zwischen ihnen, wodurch sich Fehler fortpflanzen können; End-to-End-Ansätze lösen beide Aufgaben gemeinsam.
  sources:
  - https://aclanthology.org/2021.findings-emnlp.204/
- id: rebel
  type: Method
  name_en: REBEL
  name_de: REBEL
  summary_en: REBEL (Relation Extraction By End-to-end Language generation) is a sequence-to-sequence model based on BART that frames relation extraction as generating triples as text and covers more than 200 relation types (Huguet Cabot and Navigli 2021). It comes with a large distantly supervised dataset built with the help of a natural language inference model.
  summary_de: REBEL (Relation Extraction By End-to-end Language generation) ist ein Sequence-to-Sequence-Modell auf Basis von BART, das Relationsextraktion als Erzeugung von Tripeln in Textform behandelt und mehr als 200 Relationstypen abdeckt (Huguet Cabot und Navigli 2021). Dazu gehört ein großer, per Distant Supervision erstellter Datensatz, der mithilfe eines Modells für Natural Language Inference aufgebaut wurde.
  sources:
  - https://aclanthology.org/2021.findings-emnlp.204/
- id: bart
  type: Method
  name_en: BART
  name_de: BART
  summary_en: 'BART is a denoising autoencoder for pre-training sequence-to-sequence models: text is corrupted with a noising function and a standard Transformer encoder-decoder learns to reconstruct it, generalising BERT''s bidirectional encoder and GPT''s left-to-right decoder (Lewis et al., 2019). It works especially well for text generation, setting new results in abstractive dialogue, question answering and summarisation with gains of up to 6 ROUGE.'
  summary_de: 'BART ist ein entrauschender Autoencoder zum Vortraining von Sequence-to-Sequence-Modellen: Text wird mit einer Störfunktion verfälscht, und ein üblicher Transformer mit Encoder und Decoder lernt, ihn wiederherzustellen; das verallgemeinert den bidirektionalen Encoder von BERT und den Links-nach-rechts-Decoder von GPT (Lewis et al., 2019). Es eignet sich besonders für Textgenerierung und erzielte neue Bestwerte bei abstraktiven Dialogen, Fragebeantwortung und Zusammenfassung mit bis zu 6 ROUGE-Punkten Zugewinn.'
  sources:
  - https://arxiv.org/abs/1910.13461
- id: probabilistic-relevance-framework
  type: Concept
  name_en: Probabilistic relevance framework
  name_de: Probabilistisches Relevanzmodell
  summary_en: The probabilistic relevance framework is the probabilistic model of information retrieval developed from work in the 1970s and 1980s, from which BM25 grew (Robertson and Zaragoza 2009). It models whether a document is "elite" for a term, a form of aboutness, and BM25 approximates the resulting term weight with a saturation function.
  summary_de: Das Probabilistic Relevance Framework ist das probabilistische Modell des Information Retrieval, das aus Arbeiten der 1970er- und 1980er-Jahre hervorging und aus dem BM25 entstand (Robertson und Zaragoza 2009). Es modelliert, ob ein Dokument für einen Term „elite“ ist, also von ihm handelt, und BM25 nähert das resultierende Termgewicht mit einer Sättigungsfunktion an.
  sources:
  - https://doi.org/10.1561/1500000019
- id: bias-preserving-gender-fairness
  type: Concept
  name_en: Bias-preserving algorithmic gender fairness
  name_de: Bias-erhaltende algorithmische Gender-Fairness
- id: three-lines-of-defence
  type: Concept
  name_en: Three lines of defence
  name_de: Three Lines of Defence (drei Verteidigungslinien)
  aliases:
  - three lines of defense
  summary_en: The three lines of defence model assigns risk responsibilities in an institution to the business lines, which take risks and manage them operationally (first line), the independent risk management and compliance functions (second line) and internal audit (third line) (EBA/GL/2021/05). The EBA guidelines on internal governance are consistent with this model and set out detailed requirements for the second and third lines.
  summary_de: Das Modell der drei Verteidigungslinien ordnet die Verantwortung für Risiken in einem Institut den Geschäftsbereichen zu, die Risiken eingehen und operativ steuern (erste Linie), den unabhängigen Funktionen Risikomanagement und Compliance (zweite Linie) und der internen Revision (dritte Linie) (EBA/GL/2021/05, Begründung, nur auf Englisch). Die EBA-Leitlinien zur internen Governance folgen diesem Modell und legen detaillierte Anforderungen an die zweite und dritte Linie fest.
  sources:
  - https://www.eba.europa.eu/activities/single-rulebook/regulatory-activities/internal-governance/guidelines-internal-governance-under-crd
- id: bait
  type: Regulation
  name_en: Supervisory Requirements for IT in Financial Institutions (BAIT)
  name_de: Bankaufsichtliche Anforderungen an die IT (BAIT)
  aliases:
  - BAIT
  summary_en: The BAIT (Bankaufsichtliche Anforderungen an die IT, BaFin Circular 10/2017, version of 16 December 2024) set out, on the basis of § 25a(1) of the German Banking Act, a flexible framework for institutions' technical and organisational IT resources, IT risk management and IT security management (Deutsche Bundesbank, n.d.). Institutions that must run ICT risk management under DORA are excluded, and the BAIT are to be repealed entirely at the end of 31 December 2026.
  summary_de: Die Bankaufsichtlichen Anforderungen an die IT (BAIT, BaFin-Rundschreiben 10/2017 in der Fassung vom 16. Dezember 2024) geben auf Grundlage des § 25a Abs. 1 KWG einen flexiblen und praxisnahen Rahmen für die technisch-organisatorische Ausstattung der Institute vor, insbesondere für IT-Ressourcen, IT-Risikomanagement und IT-Sicherheitsmanagement (Deutsche Bundesbank, n.d.). Ausgenommen sind Institute, die ein IKT-Risikomanagement nach DORA betreiben müssen, und die BAIT werden mit Ablauf des 31. Dezember 2026 vollständig aufgehoben.
  sources:
  - https://www.bundesbank.de/de/aufgaben/bankenaufsicht/einzelaspekte/risikomanagement/bait-dora-598580
- id: internal-control-system
  type: Concept
  name_en: Internal control system
  name_de: Internes Kontrollsystem
  summary_en: Under the German Banking Act, an institution's risk management includes internal control procedures with an internal control system and an independent internal audit function (§ 25a(1) sentence 4 no. 3 KWG). The internal control system comprises in particular organisational rules with a clear allocation of responsibilities, processes for identifying, assessing, managing, monitoring and communicating risks, and independent risk control and compliance functions; BaFin's MaRisk specify these requirements.
  summary_de: Nach dem Kreditwesengesetz umfasst das Risikomanagement eines Instituts interne Kontrollverfahren mit einem internen Kontrollsystem und einer unabhängigen Internen Revision (§ 25a Abs. 1 Satz 4 Nr. 3 KWG). Das interne Kontrollsystem umfasst insbesondere aufbau- und ablauforganisatorische Regelungen mit klarer Abgrenzung der Verantwortungsbereiche, Prozesse zur Identifizierung, Beurteilung, Steuerung, Überwachung und Kommunikation der Risiken sowie eine unabhängige Risikocontrolling- und Compliance-Funktion; die MaRisk der BaFin konkretisieren diese Anforderungen.
  sources:
  - https://www.gesetze-im-internet.de/kredwg/__25a.html
  - https://www.bafin.de/SharedDocs/Downloads/DE/Rundschreiben/dl_rs_0626_9_marisk.html
- id: nearest-neighbour-rule
  type: Method
  name_en: Nearest neighbour rule
  name_de: Nächste-Nachbarn-Regel
  summary_en: 'The nearest neighbour rule classifies a query point by a majority vote of its nearest neighbours in the training data (scikit-learn developers, n.d.-m). It is instance-based or "non-generalising" learning: instead of building an internal model, it simply stores the training instances.'
  summary_de: 'Die Nächste-Nachbarn-Regel klassifiziert einen Anfragepunkt per Mehrheitsentscheidung seiner nächsten Nachbarn in den Trainingsdaten (scikit-learn developers, n.d.-m). Es ist instanzbasiertes, „nicht generalisierendes“ Lernen: Statt ein internes Modell aufzubauen, werden die Trainingsbeispiele einfach gespeichert.'
  sources:
  - https://scikit-learn.org/stable/modules/neighbors.html
- id: lazy-learning
  type: Concept
  name_en: Lazy learning
  name_de: Lazy Learning
  summary_en: Lazy learning, also called instance-based or non-generalising learning, does not construct a general internal model during training but simply stores the training instances; predictions are computed at query time, for example by a majority vote of the nearest neighbours (scikit-learn developers, n.d.).
  summary_de: Lazy Learning, auch instanzbasiertes oder nicht generalisierendes Lernen, baut beim Training kein allgemeines internes Modell auf, sondern speichert einfach die Trainingsbeispiele; Vorhersagen werden erst bei der Anfrage berechnet, etwa per Mehrheitsentscheidung der nächsten Nachbarn (scikit-learn developers, n.d.).
  sources:
  - https://scikit-learn.org/stable/modules/neighbors.html
- id: curse-of-dimensionality
  type: Concept
  name_en: Curse of dimensionality
  name_de: Fluch der Dimensionalität
  summary_en: The curse of dimensionality is the phenomenon that many machine learning problems become exceedingly difficult when the data have many dimensions, in particular because the number of possible distinct configurations of a set of variables grows exponentially with the number of variables (Goodfellow et al. 2016). For nearest-neighbour methods, distances between points also become less meaningful as dimensionality grows (Beyer et al. 1999).
  summary_de: Der Fluch der Dimensionalität bezeichnet das Phänomen, dass viele Probleme des maschinellen Lernens bei hochdimensionalen Daten sehr schwierig werden, insbesondere weil die Zahl möglicher unterschiedlicher Konfigurationen einer Menge von Variablen exponentiell mit der Zahl der Variablen wächst (Goodfellow et al. 2016). Für Nächste-Nachbarn-Verfahren werden mit zunehmender Dimension zudem die Abstände zwischen Punkten weniger aussagekräftig (Beyer et al. 1999).
  sources:
  - https://www.deeplearningbook.org/contents/ml.html
  - https://doi.org/10.1007/3-540-49257-7_15
- id: pytorch
  type: Technology
  name_en: PyTorch
  name_de: PyTorch
  summary_en: PyTorch is a Python package for tensor computation, similar to NumPy but with strong GPU acceleration, and for deep neural networks built on a tape-based automatic differentiation system (PyTorch repository).
  summary_de: PyTorch ist ein Python-Paket für Tensorberechnungen, ähnlich wie NumPy, aber mit starker GPU-Beschleunigung, und für tiefe neuronale Netze auf Grundlage eines bandbasierten Systems zur automatischen Differenzierung (PyTorch-Repository).
  sources:
  - https://github.com/pytorch/pytorch
- id: shacl
  type: Technology
  name_en: SHACL
  name_de: SHACL
  aliases:
  - Shapes Constraint Language
  summary_en: The Shapes Constraint Language (SHACL) is a W3C language for validating RDF graphs against a set of conditions expressed as shapes in an RDF "shapes graph" (W3C, 2017). Because a shapes graph describes the data graphs that satisfy its conditions, it can also serve user interface building, code generation and data integration.
  summary_de: Die Shapes Constraint Language (SHACL) ist eine W3C-Sprache, um RDF-Graphen anhand von Bedingungen zu validieren, die als Shapes in einem RDF-„Shapes Graph“ formuliert sind (W3C, 2017). Weil ein Shapes Graph die Datengraphen beschreibt, die seine Bedingungen erfüllen, kann er auch für den Bau von Oberflächen, Codegenerierung und Datenintegration dienen.
  sources:
  - https://www.w3.org/TR/shacl/
- id: prov-o
  type: Technology
  name_en: PROV-O
  name_de: PROV-O
  summary_en: The PROV Ontology (PROV-O) expresses the W3C PROV data model in OWL 2 (W3C 2013). It provides classes, properties and restrictions for representing and exchanging provenance information from different systems and contexts, and can be specialised for particular applications and domains.
  summary_de: Die PROV-Ontologie (PROV-O) drückt das PROV-Datenmodell des W3C in OWL 2 aus (W3C 2013). Sie stellt Klassen, Eigenschaften und Einschränkungen bereit, mit denen sich Provenienzinformationen aus unterschiedlichen Systemen und Kontexten darstellen und austauschen lassen, und kann für bestimmte Anwendungen und Domänen spezialisiert werden.
  sources:
  - https://www.w3.org/TR/prov-o/
- id: entity-resolution
  type: Method
  name_en: Entity resolution
  name_de: Entity Resolution
  summary_en: Entity resolution identifies different descriptions that refer to the same real-world entity and is a key task for data quality (Christophides et al., 2019). End-to-end workflows combine entity indexing with matching, and methods from databases, the Semantic Web and machine learning address loosely structured, diverse, fast-changing and large-scale entity descriptions.
  summary_de: Entity Resolution erkennt unterschiedliche Beschreibungen, die sich auf dieselbe reale Entität beziehen, und ist eine Kernaufgabe der Datenqualität (Christophides et al., 2019). Durchgängige Abläufe verbinden die Indexierung von Entitäten mit dem Abgleich, und Verfahren aus Datenbanken, Semantic Web und maschinellem Lernen behandeln lose strukturierte, vielfältige, sich schnell ändernde und große Mengen von Beschreibungen.
  sources:
  - https://arxiv.org/abs/1905.06397
- id: kg-refinement
  type: Method
  name_en: Knowledge graph refinement
  name_de: Knowledge Graph Refinement
  summary_en: Knowledge graph refinement covers methods that improve an existing knowledge graph by inferring and adding missing knowledge (completion) or identifying erroneous information (error detection) (Paulheim 2017). It addresses the trade-off between completeness and correctness in large graphs such as DBpedia, YAGO and Freebase.
  summary_de: Knowledge-Graph-Refinement umfasst Methoden, die einen bestehenden Wissensgraphen verbessern, indem sie fehlendes Wissen ableiten und ergänzen (Vervollständigung) oder fehlerhafte Informationen erkennen (Fehlererkennung) (Paulheim 2017). Es betrifft den Zielkonflikt zwischen Vollständigkeit und Korrektheit großer Graphen wie DBpedia, YAGO und Freebase.
  sources:
  - https://doi.org/10.3233/SW-160218
- id: helm
  type: Technology
  name_en: Helm
  name_de: Helm
  summary_en: Helm manages Kubernetes applications through charts, which define, install and upgrade even complex applications and can be versioned, shared and published (Helm documentation). Helm is a graduated project of the Cloud Native Computing Foundation (CNCF).
  summary_de: Helm verwaltet Kubernetes-Anwendungen über sogenannte Charts, mit denen sich auch komplexe Anwendungen definieren, installieren und aktualisieren lassen und die versioniert, geteilt und veröffentlicht werden können (Helm-Dokumentation). Helm ist ein Graduated Project der Cloud Native Computing Foundation (CNCF).
  sources:
  - https://helm.sh/
- id: pod
  type: Concept
  name_en: Pod (Kubernetes)
  name_de: Pod (Kubernetes)
  summary_en: A Pod is the smallest deployable unit of computing in Kubernetes, a group of one or more containers with shared storage and network resources and a specification for how to run them (Kubernetes, n.d.-a). A Pod's containers are always co-located, co-scheduled and run in a shared context, modelling an application-specific "logical host".
  summary_de: Ein Pod ist die kleinste bereitstellbare Recheneinheit in Kubernetes, eine Gruppe aus einem oder mehreren Containern mit gemeinsamem Speicher und Netzwerk sowie einer Spezifikation, wie sie auszuführen sind (Kubernetes, n.d.-a). Die Container eines Pods liegen immer zusammen, werden gemeinsam eingeplant und laufen in einem gemeinsamen Kontext, sodass der Pod einen anwendungsspezifischen „logischen Host“ bildet.
  sources:
  - https://kubernetes.io/docs/concepts/workloads/pods/
- id: kubernetes-deployment
  type: Concept
  name_en: Deployment (Kubernetes)
  name_de: Deployment (Kubernetes)
  summary_en: 'A Kubernetes Deployment provides declarative updates for Pods and ReplicaSets: users describe a desired state, and the Deployment controller changes the actual state to the desired state at a controlled rate (Kubernetes, n.d.-b). Typical uses are rolling out a new state of the Pods, rolling back to an earlier revision and scaling up for more load.'
  summary_de: 'Ein Kubernetes-Deployment liefert deklarative Aktualisierungen für Pods und ReplicaSets: Man beschreibt einen gewünschten Zustand, und der Deployment-Controller überführt den tatsächlichen Zustand kontrolliert in den gewünschten (Kubernetes, n.d.-b). Typische Anwendungen sind das Ausrollen eines neuen Zustands der Pods, das Zurückrollen auf eine frühere Revision und das Hochskalieren bei mehr Last.'
  sources:
  - https://kubernetes.io/docs/concepts/workloads/controllers/deployment/
- id: declarative-configuration
  type: Concept
  name_en: Declarative configuration
  name_de: Deklarative Konfiguration
  summary_en: With declarative object configuration in Kubernetes, users work on configuration files stored locally without defining the operations to perform; kubectl detects create, update and delete operations per object automatically (Kubernetes, n.d.-e). Kubernetes is a platform for managing containerised workloads that facilitates both declarative configuration and automation (Kubernetes, n.d.-f).
  summary_de: Bei deklarativer Objektkonfiguration in Kubernetes arbeiten Nutzende mit lokal gespeicherten Konfigurationsdateien, ohne die auszuführenden Operationen festzulegen; kubectl erkennt Anlegen, Aktualisieren und Löschen je Objekt automatisch (Kubernetes, n.d.-e). Kubernetes ist eine Plattform zur Verwaltung containerisierter Arbeitslasten, die sowohl deklarative Konfiguration als auch Automatisierung unterstützt (Kubernetes, n.d.-f).
  sources:
  - https://kubernetes.io/docs/concepts/overview/working-with-objects/object-management/
  - https://kubernetes.io/docs/concepts/overview/
- id: self-healing
  type: Concept
  name_en: Self-healing
  name_de: Self-Healing
  summary_en: Self-healing in Kubernetes means that the platform restarts containers that fail, replaces containers, kills containers that do not respond to user-defined health checks, and does not advertise them to clients until they are ready to serve (Kubernetes, n.d.-f).
  summary_de: Selbstheilung in Kubernetes bedeutet, dass die Plattform ausgefallene Container neu startet, Container ersetzt, Container beendet, die auf benutzerdefinierte Gesundheitsprüfungen nicht antworten, und sie Clients erst anbietet, wenn sie bereit sind (Kubernetes, n.d.-f).
  sources:
  - https://kubernetes.io/docs/concepts/overview/
- id: probe
  type: Concept
  name_en: Probe (Kubernetes)
  name_de: Probe (Kubernetes)
  summary_en: Kubernetes probes check the health of containers. A liveness probe detects states such as deadlocks in which an application runs but makes no progress; if it fails more often than configured, the kubelet restarts the container, while readiness probes decide when a container is ready to accept traffic and a startup probe holds back liveness and readiness checks until the application has initialised (Kubernetes, n.d.-d). Badly configured liveness probes can cause cascading failures under load.
  summary_de: Kubernetes-Probes prüfen den Zustand von Containern. Eine Liveness-Probe erkennt Zustände wie Deadlocks, in denen eine Anwendung läuft, aber nicht vorankommt; schlägt sie öfter fehl als eingestellt, startet das Kubelet den Container neu, während Readiness-Probes bestimmen, wann ein Container Verkehr annehmen kann, und eine Startup-Probe Liveness- und Readiness-Prüfungen zurückhält, bis die Anwendung initialisiert ist (Kubernetes, n.d.-d). Falsch eingestellte Liveness-Probes können unter Last zu Kaskadenfehlern führen.
  sources:
  - https://kubernetes.io/docs/concepts/configuration/liveness-readiness-startup-probes/
- id: kubernetes-namespace
  type: Concept
  name_en: Namespace (Kubernetes)
  name_de: Namespace (Kubernetes)
  summary_en: In Kubernetes, namespaces isolate groups of resources within a single cluster; names must be unique within a namespace but not across namespaces (Kubernetes, n.d.-c). Namespace scoping applies only to namespaced objects such as Deployments and Services, not to cluster-wide objects such as Nodes, and namespaces are intended for environments with many users across teams or projects.
  summary_de: In Kubernetes trennen Namespaces Gruppen von Ressourcen innerhalb eines Clusters; Namen müssen innerhalb eines Namespace eindeutig sein, nicht aber über Namespaces hinweg (Kubernetes, n.d.-c). Die Abgrenzung gilt nur für Objekte mit Namespace wie Deployments und Services, nicht für clusterweite Objekte wie Nodes, und Namespaces sind für Umgebungen mit vielen Nutzenden über mehrere Teams oder Projekte gedacht.
  sources:
  - https://kubernetes.io/docs/concepts/overview/working-with-objects/namespaces/
- id: gwg
  type: Regulation
  name_en: Money Laundering Act (GwG)
  name_de: Geldwäschegesetz (GwG)
  aliases:
  - GwG
  - Money Laundering Act
  summary_en: The German Money Laundering Act (Geldwäschegesetz, GwG; officially the act on detecting proceeds of serious crime), in its 2017 version, defines money laundering by reference to § 261 of the Criminal Code and defines terrorist financing (§ 1 GwG). It interacts with banking supervisory law, for example § 25h of the Banking Act.
  summary_de: Das Geldwäschegesetz (GwG; amtlich Gesetz über das Aufspüren von Gewinnen aus schweren Straftaten) in der Fassung von 2017 definiert Geldwäsche als Straftat nach § 261 des Strafgesetzbuchs und bestimmt den Begriff der Terrorismusfinanzierung (§ 1 GwG). Es greift mit dem Bankaufsichtsrecht ineinander, etwa mit § 25h des Kreditwesengesetzes.
  sources:
  - https://www.gesetze-im-internet.de/gwg_2017/
- id: banking-licence
  type: Concept
  name_en: Authorisation requirement for banking business
  name_de: Erlaubnispflicht für Bankgeschäfte
  summary_en: Under the German Banking Act, anyone who wants to conduct banking business or provide financial services in Germany commercially, or on a scale requiring a commercially organised business operation, needs written or electronic authorisation from the supervisory authority (§ 32(1) KWG).
  summary_de: Nach dem Kreditwesengesetz bedarf, wer im Inland gewerbsmäßig oder in einem Umfang, der einen in kaufmännischer Weise eingerichteten Geschäftsbetrieb erfordert, Bankgeschäfte betreiben oder Finanzdienstleistungen erbringen will, der schriftlichen oder elektronischen Erlaubnis der Aufsichtsbehörde (§ 32 Abs. 1 KWG).
  sources:
  - https://www.gesetze-im-internet.de/kredwg/
- id: chinchilla
  type: Method
  name_en: Chinchilla
  name_de: Chinchilla
  summary_en: Chinchilla is a 70-billion-parameter language model trained with the same compute budget as Gopher but on four times more data, to test the finding that model size and training tokens should be scaled equally (Hoffmann et al., 2022). Based on over 400 trained models, the study concluded that large language models were significantly undertrained; Chinchilla outperformed Gopher, GPT-3 and Megatron-Turing NLG and reached 67.5% on MMLU.
  summary_de: Chinchilla ist ein Sprachmodell mit 70 Milliarden Parametern, trainiert mit demselben Rechenbudget wie Gopher, aber auf viermal mehr Daten, um den Befund zu prüfen, dass Modellgröße und Zahl der Trainingstokens gleichermaßen wachsen sollten (Hoffmann et al., 2022). Auf Grundlage von über 400 trainierten Modellen kam die Studie zu dem Schluss, dass große Sprachmodelle deutlich untertrainiert waren; Chinchilla übertraf Gopher, GPT-3 und Megatron-Turing NLG und erreichte 67,5 % auf MMLU.
  sources:
  - https://arxiv.org/abs/2203.15556
- id: scaling-laws
  type: Concept
  name_en: Scaling laws
  name_de: Skalierungsgesetze
  aliases:
  - compute-optimal scaling
  summary_en: Scaling laws describe how language model loss falls as a power law with model size, dataset size and training compute, with trends spanning more than seven orders of magnitude, while width or depth matter little within a wide range (Kaplan et al., 2020). They allow allocating a fixed compute budget optimally; Kaplan et al. concluded that larger models are more sample-efficient.
  summary_de: Skalierungsgesetze beschreiben, wie der Verlust von Sprachmodellen als Potenzgesetz mit Modellgröße, Datenmenge und Trainingsrechenaufwand sinkt, über mehr als sieben Größenordnungen, während Breite oder Tiefe in einem weiten Bereich kaum eine Rolle spielen (Kaplan et al., 2020). Sie erlauben, ein festes Rechenbudget optimal zu verteilen; Kaplan et al. folgerten, dass größere Modelle dateneffizienter sind.
  sources:
  - https://arxiv.org/abs/2001.08361
- id: emergent-abilities
  type: Concept
  name_en: Emergent abilities
  name_de: Emergente Fähigkeiten
  summary_en: An ability of large language models is called emergent if it is not present in smaller models but is present in larger ones, so it cannot be predicted by extrapolating the performance of smaller models (Wei et al., 2022). Its existence implies that further scaling could expand the range of capabilities.
  summary_de: Eine Fähigkeit großer Sprachmodelle gilt als emergent, wenn sie in kleineren Modellen fehlt, in größeren aber vorhanden ist, sodass sie sich nicht durch Extrapolation der Leistung kleinerer Modelle vorhersagen lässt (Wei et al., 2022). Ihr Auftreten legt nahe, dass weitere Skalierung das Spektrum der Fähigkeiten erweitern könnte.
  sources:
  - https://arxiv.org/abs/2206.07682
- id: nucleus-sampling
  type: Method
  name_en: Nucleus (top-p) sampling
  name_de: Nucleus-Sampling (Top-p)
  aliases:
  - top-p sampling
  summary_en: Nucleus (top-p) sampling generates text by sampling from the dynamic nucleus of the probability distribution, which keeps diversity while cutting off the unreliable tail (Holtzman et al., 2019). It was proposed because likelihood-maximising decoding produces bland and repetitive text, and it yields more human-like text without losing fluency and coherence.
  summary_de: Nucleus Sampling (Top-p) erzeugt Text, indem aus dem dynamischen Kern der Wahrscheinlichkeitsverteilung gezogen wird; das erhält Vielfalt und schneidet den unzuverlässigen Rand der Verteilung ab (Holtzman et al., 2019). Es wurde vorgeschlagen, weil auf maximale Wahrscheinlichkeit ausgerichtetes Dekodieren eintönigen, sich wiederholenden Text liefert, und ergibt menschenähnlicheren Text ohne Verlust an Flüssigkeit und Kohärenz.
  sources:
  - https://arxiv.org/abs/1904.09751
- id: claude-3
  type: Method
  name_en: Claude 3
  name_de: Claude 3
- id: gemini
  type: Method
  name_en: Gemini
  name_de: Gemini
  summary_en: Gemini is a family of multimodal models from Google that understand image, audio, video and text, introduced in sizes Ultra, Pro and Nano for uses from complex reasoning to on-device applications (Gemini Team 2023). According to the technical report, Gemini Ultra advanced the state of the art on 30 of 32 benchmarks examined and was the first model to reach human-expert performance on MMLU.
  summary_de: Gemini ist eine Familie multimodaler Modelle von Google, die Bild, Audio, Video und Text verarbeiten; sie wurde in den Größen Ultra, Pro und Nano für Anwendungen vom komplexen Schlussfolgern bis zum Einsatz auf Endgeräten vorgestellt (Gemini Team 2023). Laut technischem Bericht verbesserte Gemini Ultra den Stand der Technik in 30 von 32 untersuchten Benchmarks und erreichte als erstes Modell Leistung auf dem Niveau menschlicher Fachleute im MMLU.
  sources:
  - https://arxiv.org/abs/2312.11805
- id: mistral-models
  type: Method
  name_en: Mistral models
  name_de: Mistral-Modelle
  summary_en: Mistral 7B is a 7-billion-parameter language model that uses grouped-query attention for faster inference and sliding window attention for long sequences at reduced cost (Jiang et al., 2023). It outperformed Llama 2 13B on all evaluated benchmarks, its instruction-tuned version surpassed Llama 2 13B Chat, and both were released under the Apache 2.0 licence.
  summary_de: Mistral 7B ist ein Sprachmodell mit 7 Milliarden Parametern, das Grouped-Query Attention für schnellere Inferenz und Sliding Window Attention für lange Sequenzen bei geringeren Kosten nutzt (Jiang et al., 2023). Es übertraf Llama 2 13B auf allen evaluierten Benchmarks, seine Instruct-Version übertraf Llama 2 13B Chat, und beide wurden unter der Apache-2.0-Lizenz veröffentlicht.
  sources:
  - https://arxiv.org/abs/2310.06825
- id: amazon-titan
  type: Method
  name_en: Amazon Titan
  name_de: Amazon Titan
  aliases:
  - Titan
- id: zephyr
  type: Method
  name_en: Zephyr
  name_de: Zephyr
  summary_en: Zephyr-7B is a small chat model aligned to user intent through distilled supervised fine-tuning and distilled direct preference optimisation on preference data ranked by a teacher model, without human annotation (Tunstall et al., 2023). Training takes only a few hours, and on MT-Bench Zephyr-7B surpassed Llama2-Chat-70B.
  summary_de: Zephyr-7B ist ein kleines Chat-Modell, das über destilliertes Supervised Fine-Tuning und destillierte Direct Preference Optimization auf von einem Lehrermodell gerankten Präferenzdaten an Nutzerabsichten angepasst wurde, ohne menschliche Annotation (Tunstall et al., 2023). Das Training dauert nur wenige Stunden, und auf MT-Bench übertraf Zephyr-7B Llama2-Chat-70B.
  sources:
  - https://arxiv.org/abs/2310.16944
- id: deepseek-llm
  type: Method
  name_en: DeepSeek LLM
  name_de: DeepSeek LLM
  summary_en: DeepSeek LLM is an open-source family of large language models in 7B and 67B configurations, guided by its developers' own study of scaling laws and pre-trained on a dataset of 2 trillion tokens (DeepSeek-AI, 2024). Supervised fine-tuning and Direct Preference Optimization produced DeepSeek Chat models; the 67B model surpassed LLaMA-2 70B on several benchmarks, particularly code, mathematics and reasoning.
  summary_de: DeepSeek LLM ist eine offene Familie großer Sprachmodelle in den Größen 7B und 67B, entwickelt auf Grundlage einer eigenen Untersuchung von Skalierungsgesetzen und vortrainiert auf einem Datensatz von 2 Billionen Tokens (DeepSeek-AI, 2024). Supervised Fine-Tuning und Direct Preference Optimization ergaben die DeepSeek-Chat-Modelle; das 67B-Modell übertraf LLaMA-2 70B auf mehreren Benchmarks, besonders bei Code, Mathematik und Schlussfolgern.
  sources:
  - https://arxiv.org/abs/2401.02954
- id: google-deepmind
  type: Organisation
  name_en: Google DeepMind
  name_de: Google DeepMind
  summary_en: Google DeepMind is Google's AI research unit, created in April 2023 by combining the Brain team from Google Research and DeepMind, with Demis Hassabis as CEO (Google 2023). The two groups' earlier work includes AlphaGo, the Transformer, word2vec, WaveNet and AlphaFold.
  summary_de: Google DeepMind ist die KI-Forschungseinheit von Google, die im April 2023 aus dem Brain-Team von Google Research und DeepMind gebildet wurde; CEO ist Demis Hassabis (Google 2023). Zu den früheren Arbeiten beider Gruppen gehören AlphaGo, der Transformer, word2vec, WaveNet und AlphaFold.
  sources:
  - https://blog.google/technology/ai/april-ai-update/
- id: mistral-ai
  type: Organisation
  name_en: Mistral AI
  name_de: Mistral AI
  aliases:
  - Mistral
  summary_en: Mistral AI is an AI company founded by Arthur Mensch (CEO), Guillaume Lample and Timothée Lacroix (Mistral AI). Its first employee started in June 2023; it released Mistral 7B in September 2023 and later models such as Mistral Large, as well as the assistant Le Chat.
  summary_de: Mistral AI ist ein KI-Unternehmen, gegründet von Arthur Mensch (CEO), Guillaume Lample und Timothée Lacroix (Mistral AI). Der erste Mitarbeiter begann im Juni 2023; im September 2023 erschien Mistral 7B, später folgten Modelle wie Mistral Large sowie der Assistent Le Chat.
  sources:
  - https://mistral.ai/about
- id: amazon
  type: Organisation
  name_en: Amazon
  name_de: Amazon
  summary_en: Amazon is a company whose businesses include online shopping, cloud computing, streaming entertainment, consumer electronic devices, advertising, healthcare and AI services (Amazon). Its cloud arm, Amazon Web Services (AWS), offers AI services such as Amazon Lex (AWS documentation).
  summary_de: Amazon ist ein Unternehmen mit Geschäftsfeldern wie Onlinehandel, Cloud Computing, Streaming, Unterhaltungselektronik, Werbung, Gesundheit und KI-Diensten (Amazon). Über Amazon Web Services (AWS) bietet es KI-Dienste wie Amazon Lex an (AWS-Dokumentation).
  sources:
  - https://www.aboutamazon.com/about-us
  - https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
- id: flan
  type: Method
  name_en: FLAN
  name_de: FLAN
  summary_en: FLAN is a 137-billion-parameter language model instruction-tuned on more than 60 NLP tasks phrased as natural language instructions (Wei et al., 2021). Instruction tuning substantially improved zero-shot performance on unseen task types, and FLAN surpassed zero-shot GPT-3 (175B) on 20 of 25 evaluated tasks; the number of tasks, model scale and natural language instructions were key to the effect.
  summary_de: FLAN ist ein Sprachmodell mit 137 Milliarden Parametern, das mit Instruction Tuning auf über 60 als Anweisungen formulierten NLP-Aufgaben angepasst wurde (Wei et al., 2021). Das Instruction Tuning verbesserte die Zero-Shot-Leistung bei unbekannten Aufgabentypen deutlich, und FLAN übertraf Zero-Shot-GPT-3 (175B) bei 20 von 25 Aufgaben; entscheidend waren die Zahl der Aufgaben, die Modellgröße und die Anweisungen in natürlicher Sprache.
  sources:
  - https://arxiv.org/abs/2109.01652
- id: frugalgpt
  type: Method
  name_en: FrugalGPT
  name_de: FrugalGPT
  summary_en: FrugalGPT is an LLM cascade that learns which combination of LLMs to query for each request in order to reduce cost and improve accuracy (Chen et al., 2023). Its authors describe three cost strategies, prompt adaptation, LLM approximation and LLM cascades, and report matching GPT-4 with up to 98% lower cost or improving on GPT-4 by 4% at the same cost.
  summary_de: FrugalGPT ist eine LLM-Kaskade, die lernt, welche Kombination von LLMs je Anfrage abgefragt wird, um Kosten zu senken und die Accuracy zu verbessern (Chen et al., 2023). Die Autoren beschreiben drei Kostenstrategien, Prompt-Anpassung, LLM-Approximation und LLM-Kaskaden, und berichten, GPT-4 bei bis zu 98 % geringeren Kosten zu erreichen oder GPT-4 bei gleichen Kosten um 4 % zu übertreffen.
  sources:
  - https://arxiv.org/abs/2305.05176
- id: routellm
  type: Method
  name_en: RouteLLM
  name_de: RouteLLM
  summary_en: RouteLLM trains router models that choose at inference time between a stronger and a weaker LLM to balance cost and response quality, using human preference data and data augmentation (Ong et al., 2024). The routers reduced costs by more than half in some cases without lowering quality and kept working when the strong and weak models were swapped at test time.
  summary_de: RouteLLM trainiert Router-Modelle, die bei der Inferenz zwischen einem stärkeren und einem schwächeren LLM wählen, um Kosten und Antwortqualität auszubalancieren, mit menschlichen Präferenzdaten und Datenaugmentierung (Ong et al., 2024). Die Router senkten die Kosten in einigen Fällen um mehr als die Hälfte ohne Qualitätsverlust und funktionierten weiter, wenn starkes und schwaches Modell beim Testen ausgetauscht wurden.
  sources:
  - https://arxiv.org/abs/2406.18665
- id: model-routing
  type: Method
  name_en: Model routing
  name_de: Model Routing
  summary_en: Model routing selects for each request which language model answers it, for example a weaker, cheaper model for easy requests and a stronger one for hard requests (Ong et al. 2024). RouteLLM trains such routers on human preference data and reduced costs by more than half in some cases without lowering response quality; the routers kept their performance when the strong and weak models were swapped at test time.
  summary_de: Model Routing wählt für jede Anfrage aus, welches Sprachmodell sie beantwortet, etwa ein schwächeres, günstigeres Modell für einfache und ein stärkeres für schwierige Anfragen (Ong et al. 2024). RouteLLM trainiert solche Router auf menschlichen Präferenzdaten und senkte die Kosten in einigen Fällen auf weniger als die Hälfte, ohne die Antwortqualität zu verringern; die Router behielten ihre Leistung, als starkes und schwaches Modell zur Testzeit ausgetauscht wurden.
  sources:
  - https://arxiv.org/abs/2406.18665
- id: llm-cascade
  type: Method
  name_en: LLM cascade
  name_de: LLM-Kaskade
  summary_en: An LLM cascade sends a query to a sequence of language models, typically starting with cheaper ones, and only passes it on to more expensive models when needed (Chen et al. 2023). Chen et al. name cascades as one of three cost strategies alongside prompt adaptation and LLM approximation; their FrugalGPT learns which combinations of LLMs to use per query and matched the best single model with up to 98% lower cost in their experiments.
  summary_de: Eine LLM-Kaskade schickt eine Anfrage an eine Folge von Sprachmodellen, meist beginnend mit günstigeren, und reicht sie nur bei Bedarf an teurere Modelle weiter (Chen et al. 2023). Chen et al. nennen Kaskaden neben Prompt-Anpassung und LLM-Approximation als eine von drei Kostenstrategien; ihr FrugalGPT lernt, welche Kombinationen von LLMs pro Anfrage genutzt werden, und erreichte in ihren Experimenten die Leistung des besten Einzelmodells bei bis zu 98 % geringeren Kosten.
  sources:
  - https://arxiv.org/abs/2305.05176
- id: prompt-caching
  type: Method
  name_en: Prompt caching
  name_de: Prompt Caching
  summary_en: Prompt caching lets an LLM API resume processing from a cached prefix of a prompt, which reduces processing time and cost for repeated tasks or prompts with constant parts (Anthropic documentation). In the Claude API it is enabled either automatically with one cache_control field per request or with explicit cache breakpoints on individual content blocks.
  summary_de: Prompt Caching erlaubt einer LLM-API, die Verarbeitung ab einem zwischengespeicherten Präfix eines Prompts fortzusetzen, was Verarbeitungszeit und Kosten bei wiederkehrenden Aufgaben oder Prompts mit gleichbleibenden Teilen senkt (Anthropic-Dokumentation). In der Claude-API wird es entweder automatisch mit einem cache_control-Feld pro Anfrage oder mit expliziten Cache-Breakpoints an einzelnen Inhaltsblöcken aktiviert.
  sources:
  - https://platform.claude.com/docs/en/build-with-claude/prompt-caching
- id: semantic-caching
  type: Method
  name_en: Semantic caching
  name_de: Semantic Caching
- id: request-batching
  type: Method
  name_en: Batching of LLM requests
  name_de: Batching von LLM-Anfragen
  summary_en: Batching submits many LLM requests together for asynchronous processing instead of answering each immediately, which suits bulk data processing and large evaluations (Anthropic documentation). Anthropic's Message Batches API reduces costs by 50%, and most batches finish in less than one hour.
  summary_de: Beim Batching werden viele LLM-Anfragen gemeinsam zur asynchronen Verarbeitung eingereicht, statt jede sofort zu beantworten; das eignet sich für Massendatenverarbeitung und große Evaluationen (Anthropic-Dokumentation). Die Message Batches API von Anthropic senkt die Kosten um 50 %, und die meisten Batches sind in weniger als einer Stunde abgeschlossen.
  sources:
  - https://platform.claude.com/docs/en/build-with-claude/batch-processing
- id: helm-framework
  type: Method
  name_en: HELM (Holistic Evaluation of Language Models)
  name_de: HELM (Holistic Evaluation of Language Models)
  aliases:
  - HELM
  summary_en: HELM (Holistic Evaluation of Language Models) is a living benchmark that taxonomises scenarios and metrics and measures seven metrics, accuracy, calibration, robustness, fairness, bias, toxicity and efficiency, on 16 core scenarios (Liang et al., 2022). It evaluated 30 language models on 42 scenarios under standardised conditions, raising the share of core scenarios covered per model from 17.9% to 96.0%, and released all prompts and completions.
  summary_de: HELM (Holistic Evaluation of Language Models) ist ein fortlaufend aktualisierter Benchmark, der Szenarien und Metriken systematisiert und sieben Metriken misst, Accuracy, Kalibrierung, Robustheit, Fairness, Bias, Toxizität und Effizienz, auf 16 Kernszenarien (Liang et al., 2022). Er evaluierte 30 Sprachmodelle auf 42 Szenarien unter einheitlichen Bedingungen, erhöhte den Anteil abgedeckter Kernszenarien je Modell von 17,9 % auf 96,0 % und veröffentlichte alle Prompts und Ausgaben.
  sources:
  - https://arxiv.org/abs/2211.09110
- id: crowdsourced-pairwise-comparison
  type: Method
  name_en: Crowdsourced pairwise comparison
  name_de: Crowdsourcing-Paarvergleich
  summary_en: In crowdsourced pairwise comparison, many users compare the answers of two systems to the same input and vote for the one they prefer; a statistical model then turns the votes into a ranking (Chiang et al. 2024). Chatbot Arena uses this approach with anonymous models whose identities are revealed only after the vote, and estimates rankings with the Bradley-Terry model, among other methods.
  summary_de: Beim crowdgestützten Paarvergleich vergleichen viele Nutzende die Antworten zweier Systeme auf dieselbe Eingabe und stimmen für die bevorzugte; ein statistisches Modell macht daraus eine Rangfolge (Chiang et al. 2024). Chatbot Arena nutzt dieses Vorgehen mit anonymen Modellen, deren Identität erst nach der Abstimmung offengelegt wird, und schätzt Rangfolgen unter anderem mit dem Bradley-Terry-Modell.
  sources:
  - https://arxiv.org/abs/2403.04132
- id: langfuse
  type: Technology
  name_en: Langfuse
  name_de: Langfuse
  summary_en: Langfuse is an open-source, self-hostable platform for debugging, analysing and improving LLM and agent applications (Langfuse documentation). It covers observability through traces, cost and latency, prompt management and evaluation.
  summary_de: Langfuse ist eine quelloffene, selbst betreibbare Plattform zum Debuggen, Analysieren und Verbessern von LLM- und Agentenanwendungen (Langfuse-Dokumentation). Sie umfasst Observability über Traces, Kosten und Latenz, Prompt-Verwaltung und Evaluation.
  sources:
  - https://langfuse.com/docs
- id: langsmith
  type: Technology
  name_en: LangSmith
  name_de: LangSmith
  summary_en: LangSmith is LangChain's platform for observing and evaluating LLM applications (LangSmith documentation). It records traces of what applications and agents did, from single runs to production-wide performance metrics, which are used for debugging, quality monitoring and building evaluation datasets.
  summary_de: LangSmith ist die Plattform von LangChain zur Beobachtung und Evaluation von LLM-Anwendungen (LangSmith-Dokumentation). Sie zeichnet Traces dessen auf, was Anwendungen und Agenten getan haben, von einzelnen Läufen bis zu produktionsweiten Leistungsmetriken, und nutzt sie für Debugging, Qualitätsüberwachung und den Aufbau von Evaluationsdatensätzen.
  sources:
  - https://docs.smith.langchain.com/
- id: opentelemetry
  type: Technology
  name_en: OpenTelemetry
  name_de: OpenTelemetry
  summary_en: OpenTelemetry is an open-source, vendor- and tool-agnostic observability framework and toolkit for generating, exporting and collecting telemetry data such as traces, metrics and logs (OpenTelemetry documentation). It is not an observability backend; storage and visualisation are left to other tools such as Jaeger or Prometheus.
  summary_de: OpenTelemetry ist ein quelloffenes, hersteller- und werkzeugunabhängiges Observability-Framework mit Toolkit zum Erzeugen, Exportieren und Sammeln von Telemetriedaten wie Traces, Metriken und Logs (OpenTelemetry-Dokumentation). Es ist selbst kein Observability-Backend; Speicherung und Visualisierung übernehmen andere Werkzeuge wie Jaeger oder Prometheus.
  sources:
  - https://opentelemetry.io/docs/what-is-opentelemetry/
- id: distributed-tracing
  type: Concept
  name_en: Distributed tracing
  name_de: Distributed Tracing
  summary_en: A distributed trace records the path a single request takes as it propagates through multiple services, for example from an API gateway to a backend service and a database (OpenTelemetry, n.d.). A trace consists of spans, units of work with names, timestamps and attributes; the root span represents the whole request and child spans show the steps within it.
  summary_de: Ein verteilter Trace hält den Weg fest, den eine einzelne Anfrage durch mehrere Dienste nimmt, etwa von einem API-Gateway über einen Backend-Dienst zu einer Datenbank (OpenTelemetry, n.d.). Ein Trace besteht aus Spans, Arbeitseinheiten mit Namen, Zeitstempeln und Attributen; der Root-Span steht für die ganze Anfrage, untergeordnete Spans zeigen die Schritte darin.
  sources:
  - https://opentelemetry.io/docs/concepts/observability-primer/
  - https://opentelemetry.io/docs/concepts/signals/traces/
- id: addy-osmani
  type: Person
  name_en: Addy Osmani
  name_de: Addy Osmani
  summary_en: Addy Osmani is an engineering and evangelism leader and a Member of Technical Staff at Anthropic, working on Claude Code (addyosmani.com). Before that he spent more than 14 years at Google, most recently as a Director at Google Cloud AI, and earlier led developer experience for Chrome, DevTools, Lighthouse and Core Web Vitals; his books include Learning JavaScript Design Patterns, and his blog posts on agent harness engineering and loop engineering are sources for this knowledge base.
  summary_de: Addy Osmani ist eine Führungskraft in Engineering und Developer Relations und Member of Technical Staff bei Anthropic, wo er an Claude Code arbeitet (addyosmani.com). Zuvor war er mehr als 14 Jahre bei Google, zuletzt als Director bei Google Cloud AI, und leitete davor die Developer Experience für Chrome, DevTools, Lighthouse und Core Web Vitals; zu seinen Büchern gehört Learning JavaScript Design Patterns, und seine Blogbeiträge zu Agent Harness Engineering und Loop Engineering sind Quellen dieser Wissensbasis.
  sources:
  - https://addyosmani.com/
- id: boris-cherny
  type: Person
  name_en: Boris Cherny
  name_de: Boris Cherny
  summary_en: 'Boris Cherny is head of Claude Code at Anthropic (Osmani 2026b). Cherny is quoted as saying: "I don''t prompt Claude anymore. I have loops running that prompt Claude and figuring out what to do. My job is to write loops", an example of loop engineering.'
  summary_de: Boris Cherny leitet Claude Code bei Anthropic (Osmani 2026b). Cherny wird mit der Aussage zitiert, Claude nicht mehr direkt zu prompten, sondern Schleifen laufen zu lassen, die Claude prompten; die eigene Aufgabe sei, Schleifen zu schreiben. Das ist ein Beispiel für Loop Engineering.
  sources:
  - https://addyosmani.com/blog/loop-engineering/
- id: reflection-loop
  type: Method
  name_en: Reflection loop
  name_de: Reflexionsschleife
- id: self-refine
  type: Method
  name_en: Self-Refine
  name_de: Self-Refine
  summary_en: 'Self-Refine improves an LLM''s output iteratively: the same model generates an initial answer, gives feedback on it and refines it, without supervised data, extra training or reinforcement learning (Madaan et al., 2023). Across seven tasks, from dialogue responses to mathematical reasoning, it improved task performance by about 20 percentage points on average over one-step generation.'
  summary_de: 'Self-Refine verbessert die Ausgabe eines LLM schrittweise: Dasselbe Modell erzeugt eine erste Antwort, gibt Feedback dazu und überarbeitet sie, ohne überwachte Daten, zusätzliches Training oder Reinforcement Learning (Madaan et al., 2023). Über sieben Aufgaben, von Dialogantworten bis zu mathematischem Schlussfolgern, verbesserte es die Leistung gegenüber einstufiger Generierung im Mittel um rund 20 Prozentpunkte.'
  sources:
  - https://arxiv.org/abs/2303.17651
- id: risk-bearing-capacity
  type: Concept
  name_en: Risk-bearing capacity
  name_de: Risikotragfähigkeit
  summary_en: Under the German Banking Act, an institution must ensure its risk-bearing capacity (Risikotragfähigkeit) on an ongoing basis through appropriate and effective risk management (§ 25a(1) KWG). The procedures for determining and ensuring it are based on a prudent assessment of the risks, of potential losses under stress scenarios and of the risk coverage potential available to cover them (§ 25a(1) sentence 4 no. 2 KWG); BaFin's MaRisk specify these requirements.
  summary_de: Nach dem Kreditwesengesetz muss ein Institut auf Basis eines angemessenen und wirksamen Risikomanagements seine Risikotragfähigkeit laufend sicherstellen (§ 25a Abs. 1 KWG). Die Verfahren zur Ermittlung und Sicherstellung der Risikotragfähigkeit beruhen auf einer vorsichtigen Ermittlung der Risiken, der potenziellen Verluste aus Stressszenarien und des zu ihrer Abdeckung verfügbaren Risikodeckungspotenzials (§ 25a Abs. 1 Satz 4 Nr. 2 KWG); die MaRisk der BaFin konkretisieren diese Anforderungen.
  sources:
  - https://www.gesetze-im-internet.de/kredwg/__25a.html
  - https://www.bafin.de/SharedDocs/Downloads/DE/Rundschreiben/dl_rs_0626_9_marisk.html
- id: fp16
  type: Concept
  name_en: FP16 (IEEE half precision)
  name_de: FP16 (IEEE-Halbgenauigkeit)
  aliases:
  - FP16
  summary_en: FP16 is the IEEE half-precision floating-point format, which has a more limited numerical range than single precision (FP32) (Micikevicius et al., 2017). Mixed precision training stores weights, activations and gradients in FP16 while keeping an FP32 master copy of the weights and scaling the loss, nearly halving memory use.
  summary_de: FP16 ist das IEEE-Gleitkommaformat mit halber Genauigkeit, das einen kleineren Wertebereich hat als einfache Genauigkeit (FP32) (Micikevicius et al., 2017). Beim Mixed-Precision-Training werden Gewichte, Aktivierungen und Gradienten in FP16 gespeichert, während eine FP32-Masterkopie der Gewichte erhalten bleibt und der Verlust skaliert wird; das halbiert den Speicherbedarf fast.
  sources:
  - https://arxiv.org/abs/1710.03740
- id: fp32
  type: Concept
  name_en: FP32 (single precision)
  name_de: FP32 (einfache Genauigkeit)
  aliases:
  - FP32
  summary_en: FP32 is the IEEE 754 single-precision floating-point format, the standard for training deep neural networks (Kalamkar et al., 2019). In mixed precision training, an FP32 copy of the weights accumulates gradient updates while computations use half precision (Micikevicius et al., 2017).
  summary_de: FP32 ist das IEEE-754-Gleitkommaformat mit einfacher Genauigkeit, der Standard beim Training tiefer neuronaler Netze (Kalamkar et al., 2019). Beim Mixed-Precision-Training sammelt eine FP32-Kopie der Gewichte die Gradientenupdates, während die Berechnungen in halber Genauigkeit laufen (Micikevicius et al., 2017).
  sources:
  - https://arxiv.org/abs/1905.12322
  - https://arxiv.org/abs/1710.03740
- id: bfloat16
  type: Concept
  name_en: bfloat16 (BF16)
  name_de: bfloat16 (BF16)
  aliases:
  - BF16
  - BFLOAT16
  summary_en: bfloat16 (Brain Floating Point) is a 16-bit floating-point format with the same numerical range as FP32 and simple conversion to and from it (Kalamkar et al., 2019). Unlike IEEE FP16, it needs no hyperparameter tuning for convergence, and training with bfloat16 tensors matched FP32 results across image, speech, language and recommendation tasks.
  summary_de: bfloat16 (Brain Floating Point) ist ein 16-Bit-Gleitkommaformat mit demselben Wertebereich wie FP32 und einfacher Umwandlung von und nach FP32 (Kalamkar et al., 2019). Anders als IEEE-FP16 braucht es für die Konvergenz keine Anpassung der Hyperparameter, und Training mit bfloat16-Tensoren erreichte bei Bild-, Sprach-, Text- und Empfehlungsaufgaben die Ergebnisse von FP32.
  sources:
  - https://arxiv.org/abs/1905.12322
- id: loss-scaling
  type: Method
  name_en: Loss scaling
  name_de: Loss Scaling
  summary_en: Loss scaling is a technique of mixed precision training that multiplies the loss by a factor before back-propagation so that small gradient values are not lost in the limited numerical range of half-precision numbers (Micikevicius et al. 2018). It is combined with a single-precision master copy of the weights that accumulates the gradient updates.
  summary_de: Loss Scaling ist eine Technik des Mixed-Precision-Trainings, die den Loss vor der Backpropagation mit einem Faktor multipliziert, damit kleine Gradientenwerte im begrenzten Zahlenbereich von Halbpräzisionszahlen nicht verloren gehen (Micikevicius et al. 2018). Es wird mit einer Masterkopie der Gewichte in einfacher Genauigkeit kombiniert, in der die Gradientenaktualisierungen aufsummiert werden.
  sources:
  - https://arxiv.org/abs/1710.03740
- id: eight-bit-optimisers
  type: Method
  name_en: 8-bit optimisers
  name_de: 8-Bit-Optimierer
  aliases:
  - 8-bit optimizers
  summary_en: 8-bit optimisers store the state of stateful optimisers such as Adam in 8 bits using block-wise dynamic quantisation, which keeps the performance of 32-bit optimiser states with a fraction of the memory (Dettmers et al., 2021). A stable embedding layer reduces gradient variance, and the optimisers serve as a drop-in replacement needing a two-line code change.
  summary_de: 8-Bit-Optimierer speichern den Zustand zustandsbehafteter Optimierer wie Adam mit blockweiser dynamischer Quantisierung in 8 Bit und erreichen so die Leistung von 32-Bit-Zuständen bei einem Bruchteil des Speichers (Dettmers et al., 2021). Eine stabile Embedding-Schicht verringert die Varianz der Gradienten, und die Optimierer lassen sich mit einer Änderung von zwei Codezeilen einsetzen.
  sources:
  - https://arxiv.org/abs/2110.02861
- id: adam-optimiser
  type: Method
  name_en: Adam
  name_de: Adam
  summary_en: Adam is an algorithm for first-order gradient-based optimisation of stochastic objectives based on adaptive estimates of lower-order moments of the gradients (Kingma & Ba, 2014). It is simple to implement, computationally efficient, needs little memory, suits large and noisy or sparse problems, and its hyperparameters typically need little tuning.
  summary_de: Adam ist ein Verfahren zur gradientenbasierten Optimierung stochastischer Zielfunktionen erster Ordnung, das auf adaptiven Schätzungen der niedrigen Momente der Gradienten beruht (Kingma & Ba, 2014). Es ist einfach umzusetzen, recheneffizient, braucht wenig Speicher, eignet sich für große sowie verrauschte oder dünn besetzte Probleme, und seine Hyperparameter müssen meist kaum abgestimmt werden.
  sources:
  - https://arxiv.org/abs/1412.6980
- id: smote
  type: Method
  name_en: SMOTE (Synthetic Minority Over-sampling Technique)
  name_de: SMOTE (Synthetic Minority Over-sampling Technique)
  aliases:
  - SMOTE
  summary_en: SMOTE (Synthetic Minority Over-sampling Technique) addresses imbalanced classification data by creating synthetic examples of the minority class instead of only duplicating existing ones (Chawla et al. 2002). Combined with under-sampling of the majority class, it achieved better classifier performance in ROC space than under-sampling alone in the authors' experiments.
  summary_de: SMOTE (Synthetic Minority Over-sampling Technique) behandelt unausgewogene Klassifikationsdaten, indem synthetische Beispiele der Minderheitsklasse erzeugt werden, statt nur vorhandene zu duplizieren (Chawla et al. 2002). In Kombination mit Unterabtastung der Mehrheitsklasse erreichte es in den Experimenten der Autoren eine bessere Klassifikationsleistung im ROC-Raum als Unterabtastung allein.
  sources:
  - https://doi.org/10.1613/jair.953
- id: devops
  type: Method
  name_en: DevOps
  name_de: DevOps
- id: shadow-deployment
  type: Method
  name_en: Shadow deployment
  name_de: Shadow Deployment
- id: canary-release
  type: Method
  name_en: Canary release
  name_de: Canary Release
- id: blue-green-deployment
  type: Method
  name_en: Blue-green deployment
  name_de: Blue-Green Deployment
- id: data-drift
  type: Concept
  name_en: Data drift
  name_de: Data Drift
  summary_en: Data drift, or dataset shift, means that the distribution of inputs a deployed model receives moves away from the training data; because ML systems depend strongly on properties of their inputs such as the i.i.d. assumption, they tend to fail silently (Rabanser et al. 2018). In an empirical comparison of detection methods, two-sample tests on representations from pretrained classifiers performed best.
  summary_de: Data Drift oder Dataset Shift bedeutet, dass sich die Verteilung der Eingaben, die ein produktives Modell erhält, von den Trainingsdaten entfernt; weil ML-Systeme stark von Eigenschaften ihrer Eingaben wie der i.i.d.-Annahme abhängen, scheitern sie dabei oft unbemerkt (Rabanser et al. 2018). In einem empirischen Vergleich von Erkennungsmethoden schnitten Zwei-Stichproben-Tests auf Repräsentationen vortrainierter Klassifikatoren am besten ab.
  sources:
  - https://arxiv.org/abs/1810.11953
- id: concept-drift
  type: Concept
  name_en: Concept drift
  name_de: Concept Drift
- id: wilcoxon-signed-ranks-test
  type: Method
  name_en: Wilcoxon signed-ranks test
  name_de: Wilcoxon-Vorzeichen-Rang-Test
  summary_en: The Wilcoxon signed-ranks test is a non-parametric alternative to the paired t-test (Demšar 2006). To compare two classifiers over several datasets, it ranks the absolute performance differences per dataset and compares the rank sums of positive and negative differences; Demšar recommends it for comparing two classifiers over multiple datasets.
  summary_de: Der Wilcoxon-Vorzeichen-Rang-Test ist eine nicht parametrische Alternative zum gepaarten t-Test (Demšar 2006). Um zwei Klassifikatoren über mehrere Datensätze zu vergleichen, bringt er die absoluten Leistungsunterschiede je Datensatz in eine Rangfolge und vergleicht die Rangsummen positiver und negativer Unterschiede; Demšar empfiehlt ihn für den Vergleich zweier Klassifikatoren über mehrere Datensätze.
  sources:
  - https://jmlr.org/papers/v7/demsar06a.html
- id: friedman-test
  type: Method
  name_en: Friedman test
  name_de: Friedman-Test
  summary_en: The Friedman test is a non-parametric equivalent of repeated-measures ANOVA (Demšar 2006). It ranks the algorithms separately on each dataset and tests whether their average ranks differ, under the null hypothesis that all algorithms are equivalent; Demšar recommends it, with post-hoc tests, for comparing more than two classifiers over multiple datasets.
  summary_de: Der Friedman-Test ist ein nicht parametrisches Gegenstück zur Varianzanalyse mit Messwiederholung (Demšar 2006). Er bringt die Algorithmen auf jedem Datensatz einzeln in eine Rangfolge und prüft, ob sich ihre mittleren Ränge unterscheiden, unter der Nullhypothese, dass alle Algorithmen gleichwertig sind; Demšar empfiehlt ihn mit Post-hoc-Tests für den Vergleich von mehr als zwei Klassifikatoren über mehrere Datensätze.
  sources:
  - https://jmlr.org/papers/v7/demsar06a.html
- id: expected-validation-performance
  type: Method
  name_en: Expected validation performance
  name_de: Erwartete Validierungsleistung
  summary_en: Expected validation performance reports the expected best validation score of a model as a function of computation budget, such as the number of hyperparameter search trials or training time (Dodge et al., 2019). Its authors found published model comparisons whose conclusions would have changed with more or less computation and recommend reporting it alongside test results.
  summary_de: Expected Validation Performance gibt den erwarteten besten Validierungswert eines Modells in Abhängigkeit vom Rechenbudget an, etwa der Zahl der Durchläufe bei der Hyperparameter-Suche oder der Trainingszeit (Dodge et al., 2019). Die Autoren fanden veröffentlichte Modellvergleiche, deren Schlussfolgerung sich mit mehr oder weniger Rechenaufwand geändert hätte, und empfehlen, sie neben Testergebnissen zu berichten.
  sources:
  - https://arxiv.org/abs/1909.03004
- id: clip
  type: Method
  name_en: CLIP
  name_de: CLIP
  summary_en: CLIP learns image representations from natural language supervision by predicting which caption goes with which image, trained on 400 million image-text pairs from the internet (Radford et al., 2021). Natural language then names visual concepts, enabling zero-shot transfer; CLIP matched the accuracy of the original ResNet-50 on ImageNet without using any of its 1.28 million training examples.
  summary_de: CLIP lernt Bildrepräsentationen aus natürlichsprachlicher Überwachung, indem es vorhersagt, welche Bildunterschrift zu welchem Bild gehört, trainiert auf 400 Millionen Bild-Text-Paaren aus dem Internet (Radford et al., 2021). Natürliche Sprache benennt danach visuelle Konzepte und ermöglicht Zero-Shot-Transfer; CLIP erreichte die Accuracy des ursprünglichen ResNet-50 auf ImageNet, ohne eines seiner 1,28 Millionen Trainingsbeispiele zu nutzen.
  sources:
  - https://arxiv.org/abs/2103.00020
- id: flamingo
  type: Method
  name_en: Flamingo
  name_de: Flamingo
  summary_en: Flamingo is a family of visual language models that bridges pretrained vision-only and language-only models and handles arbitrarily interleaved sequences of images, videos and text (Alayrac et al., 2022). Trained on large multimodal web corpora, it learns new image and video tasks in context from a few examples and outperformed models fine-tuned on thousands of times more task-specific data on many benchmarks.
  summary_de: Flamingo ist eine Familie visueller Sprachmodelle, die vortrainierte reine Bild- und reine Sprachmodelle verbindet und beliebig verschränkte Folgen aus Bildern, Videos und Text verarbeitet (Alayrac et al., 2022). Auf großen multimodalen Webkorpora trainiert, lernt es neue Bild- und Videoaufgaben im Kontext aus wenigen Beispielen und übertraf auf vielen Benchmarks Modelle, die mit tausendfach mehr aufgabenspezifischen Daten feinjustiert waren.
  sources:
  - https://arxiv.org/abs/2204.14198
- id: blip-2
  type: Method
  name_en: BLIP-2
  name_de: BLIP-2
  summary_en: BLIP-2 is a pre-training strategy that bootstraps vision-language learning from a frozen pretrained image encoder and a frozen large language model, bridged by a lightweight Querying Transformer trained in two stages (Li et al., 2023). With far fewer trainable parameters it reached state-of-the-art results, outperforming Flamingo-80B by 8.7% on zero-shot VQAv2 with 54 times fewer trainable parameters.
  summary_de: BLIP-2 ist eine Vortrainingsstrategie, die Bild-Sprach-Lernen aus einem eingefrorenen vortrainierten Bild-Encoder und einem eingefrorenen großen Sprachmodell aufbaut, verbunden durch einen leichten, in zwei Stufen trainierten Querying Transformer (Li et al., 2023). Mit deutlich weniger trainierbaren Parametern erreichte es Bestwerte und übertraf Flamingo-80B auf Zero-Shot-VQAv2 um 8,7 % bei 54-mal weniger trainierbaren Parametern.
  sources:
  - https://arxiv.org/abs/2301.12597
- id: llava
  type: Method
  name_en: LLaVA
  name_de: LLaVA
  summary_en: LLaVA (Large Language and Vision Assistant) is a large multimodal model that connects a vision encoder with an LLM and is trained end to end by visual instruction tuning on language-image instruction data generated with language-only GPT-4 (Liu et al., 2023). It showed multimodal chat abilities and, fine-tuned on Science QA together with GPT-4, reached 92.53% accuracy.
  summary_de: LLaVA (Large Language and Vision Assistant) ist ein großes multimodales Modell, das einen Bild-Encoder mit einem LLM verbindet und durchgängig per visuellem Instruction Tuning auf Bild-Sprach-Anweisungsdaten trainiert wird, die mit dem rein sprachlichen GPT-4 erzeugt wurden (Liu et al., 2023). Es zeigte multimodale Chat-Fähigkeiten und erreichte, auf Science QA feinjustiert und mit GPT-4 kombiniert, 92,53 % Accuracy.
  sources:
  - https://arxiv.org/abs/2304.08485
- id: contrastive-learning
  type: Method
  name_en: Contrastive learning
  name_de: Kontrastives Lernen
  summary_en: Contrastive learning trains representations so that matching pairs end up similar and non-matching pairs dissimilar. CLIP trains an image encoder and a text encoder to maximise the cosine similarity of the real image–text pairs in a batch and minimise it for all incorrect pairings, learning on 400 million image–text pairs from the internet; natural language can then refer to visual concepts, which enables zero-shot transfer to new tasks (Radford et al. 2021).
  summary_de: Kontrastives Lernen trainiert Repräsentationen so, dass zusammengehörige Paare ähnlich und nicht zusammengehörige unähnlich werden. CLIP trainiert einen Bild- und einen Text-Encoder darauf, die Kosinusähnlichkeit der echten Bild-Text-Paare eines Batches zu maximieren und die aller falschen Paarungen zu minimieren, mit 400 Millionen Bild-Text-Paaren aus dem Internet; dadurch lässt sich anschließend mit natürlicher Sprache auf visuelle Konzepte verweisen, was Zero-Shot-Transfer auf neue Aufgaben ermöglicht (Radford et al. 2021).
  sources:
  - https://arxiv.org/abs/2103.00020
- id: mean-absolute-error
  type: Method
  name_en: Mean absolute error (MAE)
  name_de: Mittlerer absoluter Fehler (MAE)
  summary_en: The mean absolute error (MAE) is the mean of the absolute forecast errors, mean(|e_t|) (Hyndman and Athanasopoulos 2021). It is scale-dependent, so it cannot compare series with different units, but it is easy to understand and compute; minimising the MAE leads to forecasts of the median.
  summary_de: Der mittlere absolute Fehler (MAE) ist der Mittelwert der absoluten Prognosefehler, mean(|e_t|) (Hyndman und Athanasopoulos 2021). Er ist skalenabhängig und eignet sich daher nicht für Vergleiche zwischen Reihen mit unterschiedlichen Einheiten, ist aber leicht zu verstehen und zu berechnen; die Minimierung des MAE führt zu Prognosen des Medians.
  sources:
  - https://otexts.com/fpp3/accuracy.html
- id: root-mean-squared-error
  type: Method
  name_en: Root mean squared error (RMSE)
  name_de: Wurzel der mittleren quadratischen Abweichung (RMSE)
  summary_en: The root mean squared error (RMSE) is the square root of the mean of the squared forecast errors (Hyndman and Athanasopoulos 2021). Like the MAE it is scale-dependent; minimising the RMSE leads to forecasts of the mean, which is why it is widely used despite being harder to interpret.
  summary_de: Die Wurzel der mittleren quadratischen Abweichung (RMSE) ist die Quadratwurzel des Mittelwerts der quadrierten Prognosefehler (Hyndman und Athanasopoulos 2021). Wie der MAE ist sie skalenabhängig; ihre Minimierung führt zu Prognosen des Mittelwerts, weshalb sie trotz schwierigerer Interpretation weit verbreitet ist.
  sources:
  - https://otexts.com/fpp3/accuracy.html
- id: mean-absolute-scaled-error
  type: Method
  name_en: Mean absolute scaled error (MASE)
  name_de: Mittlerer absoluter skalierter Fehler (MASE)
  summary_en: The mean absolute scaled error (MASE) is the mean of the absolute scaled errors, where each forecast error is divided by the training-set MAE of a simple benchmark, for non-seasonal data the one-step naive forecast (Hyndman and Koehler 2006; Hyndman and Athanasopoulos 2021). It is independent of the scale of the data, so it can compare accuracy across series; values below one mean the forecast is better than the average naive forecast on the training data.
  summary_de: Der mittlere absolute skalierte Fehler (MASE) ist der Mittelwert der absoluten skalierten Fehler; dabei wird jeder Prognosefehler durch den MAE einer einfachen Vergleichsprognose auf den Trainingsdaten geteilt, bei nicht saisonalen Daten der naiven Ein-Schritt-Prognose (Hyndman und Koehler 2006; Hyndman und Athanasopoulos 2021). Er ist unabhängig von der Skala der Daten und erlaubt so Vergleiche über Reihen hinweg; Werte unter eins bedeuten, dass die Prognose besser ist als die durchschnittliche naive Prognose auf den Trainingsdaten.
  sources:
  - https://otexts.com/fpp3/accuracy.html
  - https://doi.org/10.1016/j.ijforecast.2006.03.001
- id: stochastic-gradient-descent
  type: Method
  name_en: Stochastic gradient descent (SGD)
  name_de: Stochastischer Gradientenabstieg (SGD)
  summary_en: Stochastic gradient descent (SGD) updates model parameters using the gradient of the loss on a single training example at a time, which makes it a simple and very efficient way to fit models on large-scale and sparse problems such as text classification (scikit-learn developers, n.d.-i). It is also the basic optimisation method for training neural networks, on which adaptive variants such as Adam build.
  summary_de: Stochastischer Gradientenabstieg (SGD) aktualisiert Modellparameter mit dem Gradienten des Verlusts für jeweils ein einzelnes Trainingsbeispiel und ist damit ein einfacher, sehr effizienter Weg, Modelle auf großen und dünn besetzten Problemen wie der Textklassifikation anzupassen (scikit-learn developers, n.d.-i). Er ist auch das grundlegende Optimierungsverfahren zum Training neuronaler Netze, auf dem adaptive Varianten wie Adam aufbauen.
  sources:
  - https://scikit-learn.org/stable/modules/sgd.html
  - https://arxiv.org/abs/1412.6980
- id: adamw
  type: Method
  name_en: AdamW
  name_de: AdamW
  summary_en: 'AdamW is Adam with decoupled weight decay: Loshchilov and Hutter showed that L2 regularisation and weight decay are not equivalent for adaptive optimisers such as Adam and applied weight decay separately from the gradient step (Loshchilov & Hutter, 2017). This decoupled the best weight decay factor from the learning rate and substantially improved Adam''s generalisation on image classification.'
  summary_de: 'AdamW ist Adam mit entkoppeltem Weight Decay: Loshchilov und Hutter zeigten, dass L2-Regularisierung und Weight Decay für adaptive Optimierer wie Adam nicht gleichwertig sind, und wenden den Weight Decay getrennt vom Gradientenschritt an (Loshchilov & Hutter, 2017). Das entkoppelte den besten Weight-Decay-Faktor von der Lernrate und verbesserte die Generalisierung von Adam bei der Bildklassifikation deutlich.'
  sources:
  - https://arxiv.org/abs/1711.05101
- id: batch-normalisation
  type: Method
  name_en: Batch normalisation
  name_de: Batch-Normalisierung
  aliases:
  - Batch normalization
  summary_en: Batch normalisation normalises layer inputs for each training mini-batch as part of the model architecture, to counter "internal covariate shift", the change in layer input distributions during training (Ioffe & Szegedy, 2015). It allows much higher learning rates, makes initialisation less critical, acts as a regulariser and reached the same accuracy as a leading image classifier with 14 times fewer training steps.
  summary_de: Batch Normalization normalisiert die Eingaben einer Schicht für jedes Trainings-Mini-Batch als Teil der Modellarchitektur, um „Internal Covariate Shift“ zu begegnen, der Verschiebung der Eingabeverteilungen einer Schicht während des Trainings (Ioffe & Szegedy, 2015). Sie erlaubt deutlich höhere Lernraten, macht die Initialisierung weniger heikel, wirkt regularisierend und erreichte die Accuracy eines führenden Bildklassifikators mit 14-mal weniger Trainingsschritten.
  sources:
  - https://arxiv.org/abs/1502.03167
- id: glorot-initialisation
  type: Method
  name_en: Glorot initialisation
  name_de: Glorot-Initialisierung
  aliases:
  - Xavier initialisation
  summary_en: Glorot initialisation (also called Xavier initialisation) draws the initial weights of a layer from a uniform distribution whose range depends on the number of units in that layer and the next, ±√6/√(n_j + n_{j+1}) (Glorot and Bengio 2010). It was proposed to keep activations and back-propagated gradients from shrinking or growing across the layers of deep networks at initialisation.
  summary_de: Die Glorot-Initialisierung (auch Xavier-Initialisierung) zieht die Anfangsgewichte einer Schicht aus einer Gleichverteilung, deren Spannweite von der Zahl der Einheiten dieser und der nächsten Schicht abhängt, ±√6/√(n_j + n_{j+1}) (Glorot und Bengio 2010). Sie wurde vorgeschlagen, damit Aktivierungen und zurückpropagierte Gradienten bei der Initialisierung tiefer Netze nicht über die Schichten hinweg schrumpfen oder wachsen.
  sources:
  - https://proceedings.mlr.press/v9/glorot10a.html
- id: he-initialisation
  type: Method
  name_en: He initialisation
  name_de: He-Initialisierung
  summary_en: He initialisation is a weight initialisation method derived for networks with rectifier nonlinearities such as ReLU and PReLU, which allows very deep rectified models to be trained from scratch (He et al., 2015). With it and the parametric ReLU, He et al. reached 4.94% top-5 error on ImageNet 2012 classification, reported as the first result to surpass human-level performance of 5.1%.
  summary_de: He-Initialisierung ist ein Verfahren zur Initialisierung von Gewichten, das für Netze mit Gleichrichter-Nichtlinearitäten wie ReLU und PReLU hergeleitet wurde und es erlaubt, sehr tiefe Netze dieser Art von Grund auf zu trainieren (He et al., 2015). Damit und mit der parametrischen ReLU erreichten He et al. 4,94 % Top-5-Fehler bei der ImageNet-2012-Klassifikation, nach ihren Angaben das erste Ergebnis unter dem menschlichen Wert von 5,1 %.
  sources:
  - https://arxiv.org/abs/1502.01852
- id: weight-decay
  type: Method
  name_en: Weight decay
  name_de: Weight Decay
  summary_en: Weight decay is a regularisation technique that shrinks a network's weights during training. For standard stochastic gradient descent it is equivalent to L2 regularisation when rescaled by the learning rate, but not for adaptive optimisers such as Adam, where decoupling weight decay from the gradient step (AdamW) improves generalisation (Loshchilov & Hutter, 2017).
  summary_de: Weight Decay ist eine Regularisierungstechnik, die die Gewichte eines Netzes während des Trainings verkleinert. Für gewöhnlichen stochastischen Gradientenabstieg ist sie, mit der Lernrate skaliert, gleichwertig zu L2-Regularisierung, nicht aber für adaptive Optimierer wie Adam, bei denen ein vom Gradientenschritt entkoppelter Weight Decay (AdamW) die Generalisierung verbessert (Loshchilov & Hutter, 2017).
  sources:
  - https://arxiv.org/abs/1711.05101
- id: perceptron
  type: Method
  name_en: Perceptron
  name_de: Perzeptron
  summary_en: The perceptron is a single neural unit that computes a weighted sum of its inputs and applies a threshold; it is the historical starting point of neural networks (Goodfellow et al. 2016). A single layer of such units can only separate classes linearly.
  summary_de: Das Perzeptron ist eine einzelne neuronale Einheit, die eine gewichtete Summe ihrer Eingaben bildet und einen Schwellenwert anwendet; es ist der historische Ausgangspunkt neuronaler Netze (Goodfellow et al. 2016). Eine einzelne Schicht solcher Einheiten kann Klassen nur linear trennen.
  sources:
  - https://www.deeplearningbook.org/
- id: multilayer-perceptron
  type: Method
  name_en: Multilayer perceptron
  name_de: Mehrschichtiges Perzeptron
  summary_en: A multilayer perceptron (MLP) is a supervised learning model that learns a non-linear function for classification or regression; unlike logistic regression it has one or more non-linear hidden layers between the input and output layers (scikit-learn developers, n.d.-j). It is trained with back-propagation and gradient-based optimisation.
  summary_de: Ein Multilayer Perceptron (MLP) ist ein überwachtes Lernmodell, das eine nichtlineare Funktion für Klassifikation oder Regression lernt; anders als die logistische Regression hat es zwischen Ein- und Ausgabeschicht eine oder mehrere nichtlineare verborgene Schichten (scikit-learn developers, n.d.-j). Es wird mit Backpropagation und gradientenbasierter Optimierung trainiert.
  sources:
  - https://scikit-learn.org/stable/modules/neural_networks_supervised.html
- id: deep-learning
  type: Method
  name_en: Deep learning
  name_de: Deep Learning
  summary_en: Deep learning uses computational models with multiple processing layers that learn representations of data at multiple levels of abstraction (LeCun et al. 2015). The back-propagation algorithm indicates how the internal parameters of each layer should change; deep convolutional networks brought breakthroughs for images, video, speech and audio, and recurrent networks for sequential data such as text and speech.
  summary_de: Deep Learning nutzt Rechenmodelle aus mehreren Verarbeitungsschichten, die Repräsentationen von Daten auf mehreren Abstraktionsebenen lernen (LeCun et al. 2015). Der Backpropagation-Algorithmus gibt an, wie die internen Parameter jeder Schicht angepasst werden; tiefe Faltungsnetze brachten Durchbrüche bei Bildern, Video, Sprache und Audio, rekurrente Netze bei sequenziellen Daten wie Text und gesprochener Sprache.
  sources:
  - https://doi.org/10.1038/nature14539
  - https://www.deeplearningbook.org/
- id: universal-approximation-theorem
  type: Concept
  name_en: Universal approximation theorem
  name_de: Universeller Approximationssatz
  summary_en: The universal approximation theorem (Hornik et al., 1989; Cybenko, 1989) states that a feedforward network with a linear output layer and at least one hidden layer with a "squashing" activation function can approximate any Borel measurable function between finite-dimensional spaces to any desired accuracy, given enough hidden units; later versions cover activations such as ReLU (Goodfellow et al., 2016). It guarantees representation, not that training will find the right function.
  summary_de: Das universelle Approximationstheorem (Hornik et al., 1989; Cybenko, 1989) besagt, dass ein Feedforward-Netz mit linearer Ausgabeschicht und mindestens einer verborgenen Schicht mit einer „stauchenden“ Aktivierungsfunktion jede Borel-messbare Funktion zwischen endlichdimensionalen Räumen beliebig genau annähern kann, sofern es genug verborgene Einheiten hat; spätere Fassungen gelten auch für Aktivierungen wie ReLU (Goodfellow et al., 2016). Es garantiert die Darstellbarkeit, nicht dass das Training die richtige Funktion findet.
  sources:
  - https://www.deeplearningbook.org/contents/mlp.html
- id: relu
  type: Method
  name_en: Rectified linear unit (ReLU)
  name_de: Rectified Linear Unit (ReLU)
  summary_en: The rectified linear unit (ReLU) uses the activation function g(z) = max{0, z} and is the default activation recommended for most feedforward neural networks (Goodfellow et al. 2016). Being piecewise linear with two linear pieces, it keeps many properties that make linear models easy to optimise with gradient-based methods and generalise well.
  summary_de: Die Rectified Linear Unit (ReLU) nutzt die Aktivierungsfunktion g(z) = max{0, z} und ist die für die meisten Feedforward-Netze empfohlene Standardaktivierung (Goodfellow et al. 2016). Als stückweise lineare Funktion aus zwei linearen Teilen behält sie viele Eigenschaften, die lineare Modelle gut mit gradientenbasierten Verfahren optimierbar machen und gut generalisieren lassen.
  sources:
  - https://www.deeplearningbook.org/contents/mlp.html
- id: nis-directive-2016
  type: Regulation
  name_en: NIS Directive (EU) 2016/1148
  name_de: NIS-Richtlinie (EU) 2016/1148
  aliases:
  - NIS1
  - Directive (EU) 2016/1148
  summary_en: The NIS Directive (EU) 2016/1148 laid down measures for a high common level of security of network and information systems in the Union, including national strategies, a Cooperation Group and a CSIRTs network (Art. 1). It was repealed with effect from 18 October 2024 by the NIS2 Directive (EU) 2022/2555 (Art. 44 NIS2).
  summary_de: Die NIS-Richtlinie (EU) 2016/1148 legte Maßnahmen für ein hohes gemeinsames Sicherheitsniveau von Netz- und Informationssystemen in der Union fest, darunter nationale Strategien, eine Kooperationsgruppe und ein CSIRTs-Netzwerk (Art. 1). Sie wurde mit Wirkung vom 18. Oktober 2024 durch die NIS-2-Richtlinie (EU) 2022/2555 aufgehoben (Art. 44 NIS2).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32016L1148
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
- id: eu-cyclone
  type: Organisation
  name_en: EU-CyCLONe (European cyber crisis liaison organisation network)
  name_de: EU-CyCLONe
  aliases:
  - EU-CyCLONe
  summary_en: The European cyber crisis liaison organisation network (EU-CyCLONe) supports the coordinated management of large-scale cybersecurity incidents and crises at operational level and ensures the regular exchange of relevant information among Member States and Union institutions, bodies, offices and agencies (Art. 16(1) NIS2 Directive). It is composed of representatives of the Member States' cyber crisis management authorities and, in certain cases, the Commission (Art. 16(2)).
  summary_de: Das Europäische Netzwerk der Verbindungsorganisationen für Cyberkrisen (EU-CyCLONe) unterstützt das koordinierte Management von Cybersicherheitsvorfällen großen Ausmaßes und Krisen auf operativer Ebene und gewährleistet einen regelmäßigen Informationsaustausch zwischen den Mitgliedstaaten und den Organen, Einrichtungen und sonstigen Stellen der Union (Art. 16 Abs. 1 NIS-2-Richtlinie). Es setzt sich aus Vertretern der Behörden der Mitgliedstaaten für das Cyberkrisenmanagement und in bestimmten Fällen der Kommission zusammen (Art. 16 Abs. 2).
  sources:
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
- id: essential-and-important-entities
  type: Concept
  name_en: Essential and important entities (NIS2)
  name_de: Wesentliche und wichtige Einrichtungen (NIS2)
  summary_en: NIS2 distinguishes essential and important entities. Essential entities include entities of a type listed in Annex I that exceed the ceilings for medium-sized enterprises, qualified trust service providers, top-level domain name registries and DNS service providers regardless of size, and certain providers of public electronic communications and public administration entities; other Annex I or II entities that are not essential are important entities (Art. 3 NIS2).
  summary_de: NIS2 unterscheidet wesentliche und wichtige Einrichtungen. Wesentlich sind unter anderem Einrichtungen der in Anhang I aufgeführten Art, die die Schwellenwerte für mittlere Unternehmen überschreiten, qualifizierte Vertrauensdiensteanbieter, Domänennamenregister der obersten Stufe und DNS-Diensteanbieter unabhängig von ihrer Größe sowie bestimmte Anbieter öffentlicher elektronischer Kommunikation und Einrichtungen der öffentlichen Verwaltung; andere Einrichtungen nach Anhang I oder II, die nicht wesentlich sind, gelten als wichtige Einrichtungen (Art. 3 NIS2).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022L2555
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
- id: cybersecurity-risk-management-measures
  type: Concept
  name_en: Cybersecurity risk-management measures
  name_de: Risikomanagementmaßnahmen im Bereich der Cybersicherheit
  summary_en: NIS2 requires essential and important entities to take appropriate and proportionate technical, operational and organisational measures to manage the risks to the security of the network and information systems they use, and to prevent or minimise the impact of incidents on recipients of their services and on other services, taking into account the state of the art, relevant standards and the cost of implementation (Art. 21(1) NIS2).
  summary_de: NIS2 verpflichtet wesentliche und wichtige Einrichtungen, geeignete und verhältnismäßige technische, operative und organisatorische Maßnahmen zu ergreifen, um die Risiken für die Sicherheit ihrer Netz- und Informationssysteme zu beherrschen und die Auswirkungen von Sicherheitsvorfällen auf die Empfänger ihrer Dienste und auf andere Dienste zu verhindern oder möglichst gering zu halten, unter Berücksichtigung des Stands der Technik, einschlägiger Normen und der Umsetzungskosten (Art. 21 Abs. 1 NIS2).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022L2555
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
- id: incident-reporting
  type: Concept
  name_en: Incident reporting
  name_de: Meldung von Sicherheitsvorfällen
  summary_en: Under NIS2, essential and important entities must notify their CSIRT or competent authority without undue delay of any significant incident, one that has caused or can cause severe operational disruption or financial loss or considerable damage to others (Art. 23(1) and (3) NIS2). They submit an early warning within 24 hours of becoming aware of it and an incident notification within 72 hours (Art. 23(4) NIS2).
  summary_de: Nach NIS2 müssen wesentliche und wichtige Einrichtungen ihr CSIRT oder die zuständige Behörde unverzüglich über jeden erheblichen Sicherheitsvorfall unterrichten, also einen Vorfall, der schwerwiegende Betriebsstörungen oder finanzielle Verluste oder erhebliche Schäden für andere verursacht hat oder verursachen kann (Art. 23 Abs. 1 und 3 NIS2). Innerhalb von 24 Stunden nach Kenntnisnahme übermitteln sie eine Frühwarnung und innerhalb von 72 Stunden eine Meldung über den Sicherheitsvorfall (Art. 23 Abs. 4 NIS2).
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32022L2555
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32022L2555
- id: rdf-schema
  type: Technology
  name_en: RDF Schema
  name_de: RDF Schema
  aliases:
  - RDFS
  summary_en: RDF Schema (RDFS) is a W3C data-modelling vocabulary for RDF data that extends the basic RDF vocabulary, for example with classes, subclass and subproperty relations, and domains and ranges of properties (W3C 2014). RDF Schema 1.1 is an edited version of the 2004 Recommendation with unchanged technical content.
  summary_de: RDF Schema (RDFS) ist ein Datenmodellierungsvokabular des W3C für RDF-Daten, das das grundlegende RDF-Vokabular erweitert, etwa um Klassen, Unterklassen- und Untereigenschaftsbeziehungen sowie Domänen und Wertebereiche von Eigenschaften (W3C 2014). RDF Schema 1.1 ist eine überarbeitete Fassung der Empfehlung von 2004 mit unverändertem technischem Inhalt.
  sources:
  - https://www.w3.org/TR/rdf-schema/
- id: skos
  type: Technology
  name_en: SKOS (Simple Knowledge Organization System)
  name_de: SKOS (Simple Knowledge Organization System)
  aliases:
  - SKOS
  summary_en: The Simple Knowledge Organization System (SKOS) is a W3C data model for sharing and linking knowledge organisation systems such as thesauri, taxonomies, classification schemes and subject heading systems via the Web (W3C 2009). It offers a low-cost migration path for existing systems to the Semantic Web and can be used on its own or together with formal languages such as OWL.
  summary_de: Das Simple Knowledge Organization System (SKOS) ist ein Datenmodell des W3C, um Wissensorganisationssysteme wie Thesauri, Taxonomien, Klassifikationen und Schlagwortsysteme über das Web zu teilen und zu verknüpfen (W3C 2009). Es bietet einen kostengünstigen Migrationspfad für bestehende Systeme ins Semantic Web und lässt sich allein oder zusammen mit formalen Sprachen wie OWL nutzen.
  sources:
  - https://www.w3.org/TR/skos-reference/
- id: competency-questions
  type: Method
  name_en: Competency questions
  name_de: Kompetenzfragen
- id: dimensionality-reduction
  type: Concept
  name_en: Dimensionality reduction
  name_de: Dimensionsreduktion
  summary_en: Dimensionality reduction maps data to fewer dimensions while keeping as much relevant structure as possible. Principal component analysis, for example, decomposes a multivariate dataset into successive orthogonal components that explain a maximum amount of the variance and projects new data onto them (scikit-learn developers, n.d.); linear discriminant analysis offers a supervised alternative.
  summary_de: Dimensionsreduktion bildet Daten auf weniger Dimensionen ab und erhält dabei möglichst viel relevante Struktur. Die Hauptkomponentenanalyse etwa zerlegt einen multivariaten Datensatz in aufeinanderfolgende orthogonale Komponenten, die ein Maximum der Varianz erklären, und projiziert neue Daten darauf (scikit-learn developers, n.d.); die lineare Diskriminanzanalyse bietet eine überwachte Alternative.
  sources:
  - https://scikit-learn.org/stable/modules/decomposition.html
  - https://scikit-learn.org/stable/modules/lda_qda.html
- id: eigendecomposition
  type: Method
  name_en: Eigenvalue decomposition
  name_de: Eigenwertzerlegung
- id: formatspread
  type: Method
  name_en: FormatSpread
  name_de: FormatSpread
  summary_en: FormatSpread is an algorithm that evaluates a sampled set of plausible prompt formats for a task and reports the interval of expected performance, without access to model weights (Sclar et al., 2023). It was motivated by the finding that open LLMs are extremely sensitive to meaning-preserving formatting changes in few-shot prompts, with differences of up to 76 accuracy points for LLaMA-2-13B.
  summary_de: FormatSpread ist ein Algorithmus, der eine Stichprobe plausibler Prompt-Formate für eine Aufgabe evaluiert und das Intervall der zu erwartenden Leistung angibt, ohne Zugriff auf die Modellgewichte (Sclar et al., 2023). Anlass war der Befund, dass offene LLMs bei Few-Shot-Prompts extrem empfindlich auf bedeutungserhaltende Formatänderungen reagieren, mit Unterschieden von bis zu 76 Accuracy-Punkten bei LLaMA-2-13B.
  sources:
  - https://arxiv.org/abs/2310.11324
- id: multi-prompt-evaluation
  type: Method
  name_en: Multi-prompt evaluation
  name_de: Multi-Prompt-Evaluation
  summary_en: Multi-prompt evaluation assesses LLMs with a set of diverse instruction templates instead of a single one, because results from single-prompt evaluation are brittle (Mizrahi et al., 2023). The analysis covered 6.5 million instances, 20 LLMs and 39 tasks from three benchmarks and proposes metrics tailored to different use cases, such as model developers versus developers of a specific downstream task.
  summary_de: Multi-Prompt-Evaluation bewertet LLMs mit einer Menge unterschiedlicher Anweisungsvorlagen statt mit einer einzigen, weil Ergebnisse aus Evaluationen mit nur einem Prompt brüchig sind (Mizrahi et al., 2023). Die Analyse umfasste 6,5 Millionen Instanzen, 20 LLMs und 39 Aufgaben aus drei Benchmarks und schlägt Metriken für unterschiedliche Zwecke vor, etwa für Modellentwickler oder für Entwickler einer bestimmten Anwendung.
  sources:
  - https://arxiv.org/abs/2401.00595
- id: zero-shot-prompting
  type: Method
  name_en: Zero-shot prompting
  name_de: Zero-Shot-Prompting
  summary_en: A zero-shot prompt contains only the task instruction and the input, without demonstrations. Kojima et al. (2022) showed that adding "Let's think step by step" before the answer makes large models produce reasoning steps without examples (zero-shot chain of thought), which with text-davinci-002 raised accuracy on MultiArith from 17.7% to 78.7%.
  summary_de: Ein Zero-Shot-Prompt enthält nur die Aufgabenanweisung und die Eingabe, ohne Beispiele. Kojima et al. (2022) zeigten, dass der Zusatz „Let's think step by step“ vor der Antwort große Modelle ohne Beispiele Denkschritte erzeugen lässt (Zero-Shot Chain of Thought); mit text-davinci-002 stieg die Accuracy auf MultiArith dadurch von 17,7 % auf 78,7 %.
  sources:
  - https://arxiv.org/abs/2205.11916
- id: zero-shot-chain-of-thought
  type: Method
  name_en: Zero-shot chain of thought
  name_de: Zero-Shot Chain of Thought
  summary_en: Zero-shot chain of thought elicits step-by-step reasoning without examples by adding "Let's think step by step" before each answer (Kojima et al., 2022). With InstructGPT (text-davinci-002) this single prompt raised accuracy on MultiArith from 17.7% to 78.7% and on GSM8K from 10.4% to 40.7%, with similar gains for the 540B PaLM model.
  summary_de: Zero-Shot Chain of Thought löst schrittweises Schlussfolgern ohne Beispiele aus, indem vor jeder Antwort „Let's think step by step“ ergänzt wird (Kojima et al., 2022). Mit InstructGPT (text-davinci-002) hob dieser eine Prompt die Accuracy auf MultiArith von 17,7 % auf 78,7 % und auf GSM8K von 10,4 % auf 40,7 %, mit ähnlichen Gewinnen beim 540B-Modell PaLM.
  sources:
  - https://arxiv.org/abs/2205.11916
- id: self-consistency
  type: Method
  name_en: Self-consistency
  name_de: Self-Consistency
  summary_en: Self-consistency is a decoding strategy for chain-of-thought prompting that samples a diverse set of reasoning paths instead of only the greedy one and selects the most consistent final answer (Wang et al., 2022). It rests on the intuition that complex problems admit several ways of reasoning to the same correct answer and improved results markedly, for example by 17.9 percentage points on GSM8K.
  summary_de: Self-Consistency ist eine Dekodierstrategie für Chain-of-Thought-Prompting, die statt nur des wahrscheinlichsten Lösungswegs eine Vielfalt von Lösungswegen zieht und die am häufigsten erreichte Antwort wählt (Wang et al., 2022). Sie beruht auf der Annahme, dass komplexe Probleme mehrere Lösungswege zur selben richtigen Antwort zulassen, und verbesserte die Ergebnisse deutlich, etwa um 17,9 Prozentpunkte auf GSM8K.
  sources:
  - https://arxiv.org/abs/2203.11171
- id: prompt-report
  type: Method
  name_en: The Prompt Report (taxonomy of prompting techniques)
  name_de: The Prompt Report (Taxonomie von Prompting-Techniken)
  summary_en: The Prompt Report is a systematic survey of prompt engineering that establishes a vocabulary of 33 terms, a taxonomy of 58 prompting techniques for LLMs and 40 techniques for other modalities, and best practices for prompting (Schulhoff et al., 2024). It also includes a meta-analysis of the literature on natural-language prefix prompting.
  summary_de: The Prompt Report ist eine systematische Übersicht über Prompt Engineering mit einem Vokabular aus 33 Begriffen, einer Taxonomie von 58 Prompting-Techniken für LLMs und 40 Techniken für andere Modalitäten sowie Empfehlungen für das Prompting (Schulhoff et al., 2024). Er enthält außerdem eine Metaanalyse der Literatur zu natürlichsprachlichem Präfix-Prompting.
  sources:
  - https://arxiv.org/abs/2406.06608
- id: numpy
  type: Technology
  name_en: NumPy
  name_de: NumPy
  summary_en: NumPy is the fundamental package for scientific computing in Python (NumPy documentation). At its core is the ndarray, an n-dimensional array of elements of one data type, on which many operations run in compiled code; the library adds routines for mathematical, logical and shape operations, sorting, I/O, Fourier transforms, linear algebra, statistics and random simulation.
  summary_de: NumPy ist das grundlegende Paket für wissenschaftliches Rechnen in Python (NumPy-Dokumentation). Kern ist das ndarray, ein n-dimensionales Array aus Elementen desselben Datentyps, auf dem viele Operationen in kompiliertem Code laufen; dazu kommen Routinen für mathematische und logische Operationen, Formänderungen, Sortieren, Ein- und Ausgabe, Fourier-Transformationen, lineare Algebra, Statistik und Zufallssimulation.
  sources:
  - https://numpy.org/doc/stable/user/whatisnumpy.html
- id: pandas
  type: Technology
  name_en: pandas
  name_de: pandas
  summary_en: pandas is an open-source, BSD-licensed Python library that provides high-performance, easy-to-use data structures and data analysis tools (pandas documentation).
  summary_de: pandas ist eine quelloffene Python-Bibliothek unter BSD-Lizenz, die leistungsfähige, einfach nutzbare Datenstrukturen und Werkzeuge zur Datenanalyse bereitstellt (pandas-Dokumentation).
  sources:
  - https://pandas.pydata.org/docs/
- id: venv
  type: Technology
  name_en: venv (virtual environments)
  name_de: venv (virtuelle Umgebungen)
  summary_en: The venv module of the Python standard library (since Python 3.3) creates lightweight virtual environments, each with its own independent set of installed Python packages (Python documentation). A virtual environment is built on top of an existing base Python installation and is isolated from its packages by default; installers such as pip install into the active virtual environment.
  summary_de: Das Modul venv der Python-Standardbibliothek (seit Python 3.3) erzeugt leichtgewichtige virtuelle Umgebungen mit jeweils eigenen, unabhängig installierten Python-Paketen (Python-Dokumentation). Eine virtuelle Umgebung setzt auf einer bestehenden Basis-Installation von Python auf und ist standardmäßig von deren Paketen isoliert; Installationswerkzeuge wie pip installieren in die aktive virtuelle Umgebung.
  sources:
  - https://docs.python.org/3/library/venv.html
- id: behavioural-testing
  type: Method
  name_en: Behavioural testing
  name_de: Verhaltenstests
- id: checklist-nlp
  type: Method
  name_en: CheckList
  name_de: CheckList
  summary_en: CheckList is a task-agnostic methodology for behavioural testing of NLP models, inspired by software engineering, with a matrix of general linguistic capabilities and test types and a tool to generate many test cases quickly (Ribeiro et al., 2020). It found critical failures in commercial and state-of-the-art models, and practitioners using it created twice as many tests and found almost three times as many bugs.
  summary_de: CheckList ist eine aufgabenunabhängige Methode für Verhaltenstests von NLP-Modellen nach dem Vorbild der Softwaretechnik, mit einer Matrix allgemeiner sprachlicher Fähigkeiten und Testarten und einem Werkzeug, das schnell viele Testfälle erzeugt (Ribeiro et al., 2020). Sie deckte kritische Fehler in kommerziellen und aktuellen Modellen auf, und Fachleute erstellten damit doppelt so viele Tests und fanden fast dreimal so viele Fehler.
  sources:
  - https://arxiv.org/abs/2005.04118
- id: model-cards
  type: Method
  name_en: Model cards
  name_de: Model Cards
  summary_en: Model cards are short documents that accompany trained machine learning models and report benchmarked evaluation across relevant groups, for example by demographic or phenotypic characteristics and their intersections, together with the intended context of use and the evaluation procedure (Mitchell et al., 2018). They aim to make clear where a model is suitable and to increase transparency about how well it works.
  summary_de: Model Cards sind kurze Dokumente zu trainierten ML-Modellen, die Evaluationsergebnisse für relevante Gruppen angeben, etwa nach demografischen oder phänotypischen Merkmalen und deren Überschneidungen, zusammen mit dem vorgesehenen Einsatzkontext und dem Evaluationsverfahren (Mitchell et al., 2018). Sie sollen klarstellen, wofür ein Modell geeignet ist, und die Transparenz darüber erhöhen, wie gut es funktioniert.
  sources:
  - https://arxiv.org/abs/1810.03993
- id: datasheets-for-datasets
  type: Method
  name_en: Datasheets for datasets
  name_de: Datasheets for Datasets
  summary_en: Datasheets for datasets propose that, as electronic components come with datasheets, every dataset be accompanied by a document on its motivation, composition, collection process and recommended uses (Gebru et al., 2018). They aim to improve communication between dataset creators and consumers and to make transparency and accountability a priority in machine learning.
  summary_de: Datasheets for Datasets schlagen vor, dass jeder Datensatz, wie elektronische Bauteile ein Datenblatt haben, von einem Dokument zu Motivation, Zusammensetzung, Erhebungsprozess und empfohlener Verwendung begleitet wird (Gebru et al., 2018). Sie sollen die Kommunikation zwischen Erstellern und Nutzenden von Datensätzen verbessern und Transparenz und Rechenschaft im maschinellen Lernen stärken.
  sources:
  - https://arxiv.org/abs/1803.09010
- id: post-training-quantisation
  type: Method
  name_en: Post-training quantisation (PTQ)
  name_de: Post-Training-Quantisierung (PTQ)
  aliases:
  - PTQ
  - Post-training quantization (PTQ)
  summary_en: Post-training quantisation (PTQ) reduces the numerical precision of a model's weights after training, without retraining, to cut memory and inference cost. GPTQ, a one-shot PTQ method for large generative Transformers, compressed 175-billion-parameter models to 3 or 4 bits per weight with negligible accuracy loss (Frantar et al., 2022).
  summary_de: Post-Training-Quantisierung (PTQ) verringert die numerische Genauigkeit der Gewichte eines Modells nach dem Training, ohne erneutes Training, um Speicher und Inferenzkosten zu senken. GPTQ, ein einmalig angewendetes PTQ-Verfahren für große generative Transformer, komprimierte Modelle mit 175 Milliarden Parametern auf 3 oder 4 Bit je Gewicht bei vernachlässigbarem Genauigkeitsverlust (Frantar et al., 2022).
  sources:
  - https://arxiv.org/abs/2210.17323
- id: quantisation-aware-training
  type: Method
  name_en: Quantisation-aware training (QAT)
  name_de: Quantization-Aware Training (QAT)
  aliases:
  - QAT
  - Quantization-aware training (QAT)
  summary_en: Quantisation-aware training co-designs the training procedure with a quantisation scheme so that model accuracy is preserved after quantisation (Jacob et al., 2017). Jacob et al. combined it with integer-only arithmetic inference, which is more efficient on common integer hardware, and improved the accuracy-latency trade-off even for efficient MobileNets on ImageNet classification and COCO detection.
  summary_de: Quantisierungsbewusstes Training stimmt das Trainingsverfahren auf ein Quantisierungsschema ab, damit die Genauigkeit des Modells nach der Quantisierung erhalten bleibt (Jacob et al., 2017). Jacob et al. verbanden es mit Inferenz allein in Ganzzahlarithmetik, die auf gängiger Hardware effizienter ist, und verbesserten das Verhältnis von Genauigkeit und Latenz selbst bei effizienten MobileNets für ImageNet-Klassifikation und COCO-Detektion.
  sources:
  - https://arxiv.org/abs/1712.05877
- id: llm-int8
  type: Method
  name_en: LLM.int8()
  name_de: LLM.int8()
  summary_en: LLM.int8() is an 8-bit matrix multiplication procedure for Transformer feed-forward and attention projection layers that halves inference memory while keeping full-precision performance (Dettmers et al., 2022). It combines vector-wise quantisation with a mixed-precision decomposition that keeps rare emergent outlier feature dimensions in 16 bit, so models with up to 175 billion parameters run without performance loss.
  summary_de: LLM.int8() ist ein Verfahren für 8-Bit-Matrixmultiplikation in den Feed-Forward- und Attention-Projektionsschichten von Transformern, das den Speicherbedarf bei der Inferenz halbiert und die volle Genauigkeit erhält (Dettmers et al., 2022). Es verbindet vektorweise Quantisierung mit einer Zerlegung in gemischter Genauigkeit, die seltene, auffällige Ausreißer-Dimensionen in 16 Bit belässt, sodass Modelle mit bis zu 175 Milliarden Parametern ohne Leistungsverlust laufen.
  sources:
  - https://arxiv.org/abs/2208.07339
- id: gptq
  type: Method
  name_en: GPTQ
  name_de: GPTQ
  summary_en: GPTQ is a one-shot post-training weight quantisation method for generative Transformers based on approximate second-order information (Frantar et al., 2022). It quantises models with 175 billion parameters to 3 or 4 bits per weight in about four GPU hours with negligible accuracy loss, which made it possible to run such a model on a single GPU, with inference speed-ups of around 3.25 to 4.5 times over FP16.
  summary_de: GPTQ ist ein einmalig angewendetes Verfahren zur Quantisierung der Gewichte generativer Transformer nach dem Training, das auf genäherten Informationen zweiter Ordnung beruht (Frantar et al., 2022). Es quantisiert Modelle mit 175 Milliarden Parametern in rund vier GPU-Stunden auf 3 oder 4 Bit je Gewicht bei vernachlässigbarem Genauigkeitsverlust; dadurch ließ sich ein solches Modell erstmals auf einer einzigen GPU ausführen, mit rund 3,25- bis 4,5-fach schnellerer Inferenz als mit FP16.
  sources:
  - https://arxiv.org/abs/2210.17323
- id: awq
  type: Method
  name_en: AWQ (Activation-aware Weight Quantization)
  name_de: AWQ (Activation-aware Weight Quantization)
  aliases:
  - AWQ
  summary_en: Activation-aware Weight Quantization (AWQ) is a hardware-friendly low-bit weight-only quantisation method for LLMs; it protects the roughly 1% of salient weight channels, identified from activation statistics, by scaling them rather than keeping them in higher precision (Lin et al., 2023). It needs no backpropagation or reconstruction, generalises across domains and modalities, and its TinyChat framework runs 4-bit models more than three times faster than FP16.
  summary_de: Activation-aware Weight Quantization (AWQ) ist ein hardwarefreundliches Verfahren zur Niedrigbit-Quantisierung nur der Gewichte von LLMs; es schützt die rund 1 % wichtigen Gewichtskanäle, erkannt an Aktivierungsstatistiken, durch Skalierung statt durch höhere Genauigkeit (Lin et al., 2023). Es braucht weder Backpropagation noch Rekonstruktion, generalisiert über Domänen und Modalitäten, und sein Framework TinyChat führt 4-Bit-Modelle mehr als dreimal so schnell aus wie FP16.
  sources:
  - https://arxiv.org/abs/2306.00978
- id: fixed-size-chunking
  type: Method
  name_en: Fixed-size chunking
  name_de: Chunking mit fester Größe
  summary_en: Fixed-size chunking splits documents into chunks of a fixed number of tokens, for example 100, 256 or 512, the most common chunking method in retrieval-augmented generation (Gao et al. 2023). Larger chunks capture more context but also more noise and cost more to process, while smaller chunks have less noise but may not convey the necessary context; fixed lengths can also cut through sentences.
  summary_de: Fixed-Size-Chunking zerlegt Dokumente in Abschnitte mit einer festen Anzahl von Tokens, etwa 100, 256 oder 512; es ist die häufigste Chunking-Methode in Retrieval-Augmented Generation (Gao et al. 2023). Größere Chunks erfassen mehr Kontext, aber auch mehr Rauschen und kosten mehr Verarbeitung, kleinere haben weniger Rauschen, vermitteln aber womöglich nicht den nötigen Kontext; feste Längen können zudem Sätze zerschneiden.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: semantic-chunking
  type: Method
  name_en: Semantic chunking
  name_de: Semantisches Chunking
  summary_en: Semantic chunking places chunk boundaries according to units of meaning rather than after a fixed length. A fine-grained form indexes propositions, atomic expressions that each contain one distinct factoid in a concise, self-contained form; indexing a corpus by propositions significantly outperformed passage-level indexing in dense retrieval and improved downstream question answering for a given computation budget (Chen et al. 2023).
  summary_de: Semantisches Chunking setzt Chunk-Grenzen nach Bedeutungseinheiten statt nach einer festen Länge. Eine feingranulare Form indexiert Propositionen, atomare Ausdrücke, die jeweils genau einen Sachverhalt knapp und für sich verständlich enthalten; die Indexierung eines Korpus nach Propositionen übertraf beim Dense Retrieval die Indexierung nach Passagen deutlich und verbesserte bei gegebenem Rechenbudget die nachgelagerte Fragebeantwortung (Chen et al. 2023).
  sources:
  - https://arxiv.org/abs/2312.06648
- id: structure-based-chunking
  type: Method
  name_en: Structure-based chunking
  name_de: Strukturbasiertes Chunking
- id: proposition-indexing
  type: Method
  name_en: Proposition indexing
  name_de: Indexierung nach Propositionen
  summary_en: Proposition indexing uses propositions, atomic, self-contained expressions that each state one distinct factoid, as the retrieval unit for dense retrieval instead of passages or sentences (Chen et al., 2023). Indexing a corpus by propositions significantly outperformed passage-level units in retrieval and improved downstream question answering for a given computation budget.
  summary_de: Proposition Indexing nutzt Propositionen, atomare, für sich verständliche Aussagen mit jeweils einem Faktum, statt Passagen oder Sätzen als Einheit für dichtes Retrieval (Chen et al., 2023). Ein nach Propositionen indexiertes Korpus übertraf Einheiten auf Passagenebene im Retrieval deutlich und verbesserte die nachgelagerte Fragebeantwortung bei gegebenem Rechenbudget.
  sources:
  - https://arxiv.org/abs/2312.06648
- id: late-chunking
  type: Method
  name_en: Late chunking
  name_de: Late Chunking
  summary_en: Late chunking embeds all tokens of a long text with a long-context embedding model first and applies chunking only afterwards, just before mean pooling, so that each chunk embedding keeps context from the surrounding text (Günther et al., 2024). It improved results across retrieval tasks, works with many long-context embedding models without additional training, and can be strengthened by dedicated fine-tuning.
  summary_de: Late Chunking bettet zunächst alle Tokens eines langen Textes mit einem Embedding-Modell für lange Kontexte ein und teilt erst danach, direkt vor dem Mean Pooling, in Chunks; so behält jedes Chunk-Embedding den Kontext des umgebenden Textes (Günther et al., 2024). Es verbesserte die Ergebnisse über verschiedene Retrieval-Aufgaben, funktioniert ohne zusätzliches Training mit vielen Embedding-Modellen für lange Kontexte und lässt sich durch gezieltes Fine-Tuning weiter stärken.
  sources:
  - https://arxiv.org/abs/2409.04701
- id: context-enrichment
  type: Method
  name_en: Context enrichment of chunks
  name_de: Kontextanreicherung von Chunks
  summary_en: Context enrichment attaches metadata such as page number, file name, author, category or timestamp to chunks, so that chunks retrieved on their own can be placed in context and retrieval can be filtered by these fields (Gao et al. 2023). For legal texts this can be, for example, the act and article a paragraph belongs to.
  summary_de: Bei der Kontextanreicherung werden Chunks mit Metadaten wie Seitenzahl, Dateiname, Autor, Kategorie oder Zeitstempel versehen, sodass einzeln abgerufene Chunks eingeordnet werden können und sich das Retrieval nach diesen Feldern filtern lässt (Gao et al. 2023). Bei Rechtstexten kann das etwa das Gesetz und der Artikel sein, zu dem ein Absatz gehört.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: chunk-overlap
  type: Method
  name_en: Chunk overlap
  name_de: Überlappung von Chunks
  summary_en: Chunk overlap lets neighbouring chunks share part of their text, as in a sliding window, so that content cut at a chunk boundary still appears together in at least one chunk (Gao et al. 2023). It addresses the truncation of sentences by fixed-size chunking at the cost of storing and embedding some text twice.
  summary_de: Bei Chunk-Overlap teilen sich benachbarte Chunks einen Teil ihres Texts, wie bei einem gleitenden Fenster, sodass an einer Chunk-Grenze getrennter Inhalt zumindest in einem Chunk zusammen vorkommt (Gao et al. 2023). Das mildert das Zerschneiden von Sätzen durch Fixed-Size-Chunking, um den Preis, dass ein Teil des Texts doppelt gespeichert und eingebettet wird.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: parent-child-retrieval
  type: Method
  name_en: Parent-child retrieval
  name_de: Parent-Child-Retrieval
  summary_en: Parent-child retrieval separates the unit that is searched from the unit given to the language model; methods such as Small2Big use sentences (small) as retrieval units and pass the surrounding sentences (big) to the LLM as context (Gao et al. 2023). This balances precise retrieval of small units against enough context for generation.
  summary_de: Parent-Child-Retrieval trennt die Einheit, nach der gesucht wird, von der Einheit, die das Sprachmodell erhält; Verfahren wie Small2Big nutzen Sätze (klein) als Retrieval-Einheiten und geben die umgebenden Sätze (groß) als Kontext an das LLM weiter (Gao et al. 2023). So wird präzises Retrieval kleiner Einheiten mit ausreichend Kontext für die Generierung verbunden.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: ares
  type: Method
  name_en: ARES
  name_de: ARES
  summary_en: ARES (Automated RAG Evaluation System) evaluates retrieval-augmented generation systems on context relevance, answer faithfulness and answer relevance by fine-tuning lightweight LM judges on synthetic training data it creates itself (Saad-Falcon et al., 2023). A few hundred human annotations feed prediction-powered inference to correct judge errors, and the judges stayed accurate after shifts in queries and documents.
  summary_de: ARES (Automated RAG Evaluation System) bewertet Retrieval-Augmented-Generation-Systeme nach Kontextrelevanz, Antworttreue und Antwortrelevanz, indem es leichte Sprachmodelle als Richter auf selbst erzeugten synthetischen Trainingsdaten feinjustiert (Saad-Falcon et al., 2023). Einige hundert menschliche Annotationen fließen in Prediction-Powered Inference ein, um Fehler der Richter auszugleichen, und die Richter blieben auch nach veränderten Anfragen und Dokumenten genau.
  sources:
  - https://arxiv.org/abs/2311.09476
- id: prediction-powered-inference
  type: Method
  name_en: Prediction-powered inference (PPI)
  name_de: Prediction-Powered Inference (PPI)
  aliases:
  - PPI
  summary_en: Prediction-powered inference is a framework for valid statistical inference when an experimental dataset is supplemented with predictions from a machine learning system (Angelopoulos et al., 2023). It yields provably valid confidence intervals for quantities such as means, quantiles and regression coefficients without assumptions about the ML model, and more accurate predictions give narrower intervals; ARES uses it to correct LM judges with a small set of human labels.
  summary_de: Prediction-Powered Inference ist ein Rahmen für gültige statistische Inferenz, wenn ein experimenteller Datensatz durch Vorhersagen eines ML-Systems ergänzt wird (Angelopoulos et al., 2023). Er liefert nachweislich gültige Konfidenzintervalle für Größen wie Mittelwerte, Quantile und Regressionskoeffizienten ohne Annahmen über das ML-Modell, und genauere Vorhersagen ergeben engere Intervalle; ARES nutzt ihn, um LM-Richter mit wenigen menschlichen Labels zu korrigieren.
  sources:
  - https://arxiv.org/abs/2301.09633
  - https://arxiv.org/abs/2311.09476
- id: context-pollution
  type: Concept
  name_en: Context pollution
  name_de: Kontextverschmutzung
  summary_en: 'Context pollution means that the context given to a language model contains irrelevant or poorly placed material. It matters because language models do not use long contexts robustly: performance is often highest when relevant information is at the beginning or end of the input and degrades significantly when it is in the middle, even for long-context models (Liu et al., 2023).'
  summary_de: 'Kontextverschmutzung bedeutet, dass der Kontext eines Sprachmodells irrelevante oder ungünstig platzierte Inhalte enthält. Das wiegt schwer, weil Sprachmodelle lange Kontexte nicht robust nutzen: Die Leistung ist oft am höchsten, wenn relevante Information am Anfang oder Ende der Eingabe steht, und sinkt deutlich, wenn sie in der Mitte steht, auch bei Modellen für lange Kontexte (Liu et al., 2023).'
  sources:
  - https://arxiv.org/abs/2307.03172
- id: citation-hallucination
  type: Concept
  name_en: Citation hallucination
  name_de: Zitat-Halluzination
  summary_en: A citation hallucination is a claim that cites a source which does not exist or does not support it. Magesh et al. (2024) call a response misgrounded if its key propositions are cited but misinterpret the source or reference an inapplicable one, and count this as a hallucination; in the PARCEL benchmark, fabricated but plausible citations caused the largest drop in detection performance (Demir and Canbaz 2026).
  summary_de: Eine Zitathalluzination ist eine Aussage, die eine Quelle zitiert, die nicht existiert oder die Aussage nicht stützt. Magesh et al. (2024) nennen eine Antwort fehlverankert (misgrounded), wenn ihre zentralen Aussagen zwar belegt sind, die Quelle aber falsch auslegen oder auf eine nicht einschlägige Quelle verweisen, und werten das als Halluzination; im Benchmark PARCEL führten erfundene, aber plausible Zitate zum stärksten Leistungseinbruch bei der Erkennung (Demir und Canbaz 2026).
  sources:
  - https://arxiv.org/abs/2405.20362
  - https://arxiv.org/abs/2610.10971
- id: grounding-hallucination
  type: Concept
  name_en: Grounding hallucination
  name_de: Grounding-Halluzination
  summary_en: A grounding hallucination is a statement in a retrieval-augmented answer that is not supported by the retrieved context. Ragas evaluates this as faithfulness, the idea that the answer should be grounded in the given context so that the context can justify it (Es et al. 2023); in legal claims, missing support was harder for LLMs to detect than direct contradiction (Demir and Canbaz 2026).
  summary_de: Eine Verankerungshalluzination ist eine Aussage in einer Antwort mit Retrieval, die vom abgerufenen Kontext nicht gestützt wird. Ragas bewertet das als Faithfulness, also den Anspruch, dass die Antwort im gegebenen Kontext verankert ist und dieser sie begründen kann (Es et al. 2023); bei juristischen Aussagen war fehlende Stützung für LLMs schwerer zu erkennen als ein direkter Widerspruch (Demir und Canbaz 2026).
  sources:
  - https://arxiv.org/abs/2309.15217
  - https://arxiv.org/abs/2610.10971
- id: claim-level-grounding-check
  type: Method
  name_en: Claim-level grounding check
  name_de: Grounding-Prüfung auf Aussageebene
  summary_en: A claim-level grounding check splits a generated answer into short statements or atomic facts and verifies each one against a source; the score is the share of supported claims. FActScore computes the percentage of atomic facts supported by a reliable knowledge source (Min et al. 2023), and Ragas measures faithfulness as the share of statements that can be inferred from the retrieved context (Es et al. 2023).
  summary_de: Eine Prüfung der Verankerung auf Aussageebene zerlegt eine generierte Antwort in kurze Aussagen oder atomare Fakten und prüft jede gegen eine Quelle; der Wert ist der Anteil gestützter Aussagen. FActScore berechnet den Anteil atomarer Fakten, die von einer verlässlichen Wissensquelle gestützt werden (Min et al. 2023), und Ragas misst Faithfulness als Anteil der Aussagen, die sich aus dem abgerufenen Kontext ableiten lassen (Es et al. 2023).
  sources:
  - https://arxiv.org/abs/2305.14251
  - https://arxiv.org/abs/2309.15217
- id: factscore
  type: Method
  name_en: FActScore
  name_de: FActScore
  aliases:
  - FACTSCORE
  summary_en: FActScore evaluates the factuality of long-form generated text by breaking it into atomic facts and computing the percentage supported by a reliable knowledge source (Min et al., 2023). In human evaluation of generated biographies, ChatGPT reached only 58%, and an automated estimator using retrieval and a strong language model had an error rate below 2%.
  summary_de: FActScore bewertet die Faktentreue langer generierter Texte, indem er sie in atomare Fakten zerlegt und den Anteil berechnet, den eine verlässliche Wissensquelle stützt (Min et al., 2023). In einer menschlichen Bewertung generierter Biografien erreichte ChatGPT nur 58 %, und ein automatischer Schätzer mit Retrieval und einem starken Sprachmodell hatte eine Fehlerrate unter 2 %.
  sources:
  - https://arxiv.org/abs/2305.14251
- id: citation-verification
  type: Method
  name_en: Citation correctness verification
  name_de: Prüfung der Zitatkorrektheit
  summary_en: Citation verification checks whether the sources cited in a generated answer actually support it. The ALCE benchmark measures citation recall, whether each statement is fully supported by its cited passages, and citation precision, which detects irrelevant citations, using a natural language inference model (Gao et al. 2023); even the best models lacked complete citation support in half of the cases on ELI5.
  summary_de: Bei der Zitatprüfung wird kontrolliert, ob die in einer generierten Antwort zitierten Quellen sie tatsächlich stützen. Der Benchmark ALCE misst mit einem Modell für Natural Language Inference den Citation Recall, also ob jede Aussage vollständig von den zitierten Passagen gestützt wird, und die Citation Precision, die irrelevante Zitate erkennt (Gao et al. 2023); selbst die besten Modelle hatten auf ELI5 in der Hälfte der Fälle keine vollständige Zitatstützung.
  sources:
  - https://arxiv.org/abs/2305.14627
- id: hallucination-rate
  type: Method
  name_en: Hallucination rate
  name_de: Halluzinationsrate
  summary_en: The hallucination rate is the share of generated content that is not supported, for example the share of unsupported claims among all claims checked, the complement of measures such as FActScore (Min et al. 2023). Magesh et al. (2024) counted a response as hallucinated if it was incorrect or misgrounded and found that leading AI legal research tools hallucinated in 17% to 33% of cases.
  summary_de: Die Halluzinationsrate ist der Anteil generierter Inhalte, der nicht gestützt ist, etwa der Anteil nicht gestützter Aussagen an allen geprüften Aussagen, also das Gegenstück zu Maßen wie FActScore (Min et al. 2023). Magesh et al. (2024) werteten eine Antwort als halluziniert, wenn sie falsch oder fehlverankert war, und fanden bei führenden KI-Werkzeugen für juristische Recherche Halluzinationsraten von 17 % bis 33 %.
  sources:
  - https://arxiv.org/abs/2305.14251
  - https://arxiv.org/abs/2405.20362
- id: sparse-retrieval
  type: Method
  name_en: Sparse retrieval
  name_de: Sparse Retrieval
  summary_en: Sparse retrieval represents queries and documents by weighted terms, as in BM25, and matches them on shared terms (Gao et al. 2023; Robertson and Zaragoza 2009). In retrieval-augmented generation it complements dense retrieval with embeddings in hybrid search, for example for queries with rare entities.
  summary_de: Sparse Retrieval stellt Anfragen und Dokumente über gewichtete Terme dar, etwa mit BM25, und gleicht sie über gemeinsame Terme ab (Gao et al. 2023; Robertson und Zaragoza 2009). In Retrieval-Augmented Generation ergänzt es in hybrider Suche das Dense Retrieval mit Embeddings, etwa bei Anfragen mit seltenen Entitäten.
  sources:
  - https://arxiv.org/abs/2312.10997
  - https://doi.org/10.1561/1500000019
- id: hyde
  type: Method
  name_en: HyDE (Hypothetical Document Embeddings)
  name_de: HyDE (Hypothetical Document Embeddings)
  aliases:
  - HyDE
  summary_en: 'HyDE (Hypothetical Document Embeddings) enables zero-shot dense retrieval without relevance labels: an instruction-following LLM writes a hypothetical document for the query, and an unsupervised encoder such as Contriever embeds it to find similar real documents (Gao et al., 2022). The encoder''s dense bottleneck filters out false details, and HyDE significantly outperformed Contriever across web search, QA and fact verification.'
  summary_de: 'HyDE (Hypothetical Document Embeddings) ermöglicht dichtes Retrieval ohne Relevanzlabels: Ein anweisungsfolgendes LLM schreibt zur Anfrage ein hypothetisches Dokument, und ein unüberwacht trainierter Encoder wie Contriever bettet es ein, um ähnliche echte Dokumente zu finden (Gao et al., 2022). Die Verdichtung im Encoder filtert falsche Details heraus, und HyDE übertraf Contriever deutlich bei Websuche, Fragebeantwortung und Faktenprüfung.'
  sources:
  - https://arxiv.org/abs/2212.10496
- id: contriever
  type: Method
  name_en: Contriever
  name_de: Contriever
  summary_en: Contriever is an unsupervised dense retriever trained with contrastive learning (Izacard et al., 2021). On the BEIR benchmark it outperformed BM25 on 11 of 15 datasets for Recall@100, improved further when used as pre-training before fine-tuning, and showed strong multilingual and cross-lingual retrieval, for example retrieving English documents from Arabic queries.
  summary_de: Contriever ist ein unüberwacht mit kontrastivem Lernen trainierter dichter Retriever (Izacard et al., 2021). Auf dem BEIR-Benchmark übertraf er BM25 bei 11 von 15 Datensätzen im Recall@100, verbesserte sich weiter, wenn er als Vortraining vor dem Fine-Tuning diente, und zeigte starkes mehrsprachiges und sprachübergreifendes Retrieval, etwa englische Dokumente zu arabischen Anfragen.
  sources:
  - https://arxiv.org/abs/2112.09118
- id: raft
  type: Method
  name_en: RAFT (Retrieval Augmented Fine-Tuning)
  name_de: RAFT (Retrieval Augmented Fine-Tuning)
  aliases:
  - RAFT
  summary_en: 'Retrieval Augmented Fine-Tuning (RAFT) is a training recipe for "open-book" domain-specific question answering: the model is given a question and retrieved documents and learns to ignore distractor documents and to cite the relevant passage verbatim in a chain-of-thought answer (Zhang et al., 2024). It consistently improved performance on PubMed, HotpotQA and Gorilla.'
  summary_de: 'Retrieval Augmented Fine-Tuning (RAFT) ist ein Trainingsverfahren für domänenspezifische Fragebeantwortung „mit offenem Buch“: Das Modell erhält eine Frage und abgerufene Dokumente, lernt, ablenkende Dokumente zu ignorieren, und zitiert die relevante Stelle wörtlich in einer Chain-of-Thought-Antwort (Zhang et al., 2024). Es verbesserte die Leistung auf PubMed, HotpotQA und Gorilla durchgängig.'
  sources:
  - https://arxiv.org/abs/2403.10131
- id: naive-rag
  type: Method
  name_en: Naive RAG
  name_de: Naive RAG
  summary_en: Naive RAG is the first of three paradigms in Gao et al.'s survey of retrieval-augmented generation, followed by Advanced RAG and Modular RAG (Gao et al., 2023). The survey describes RAG as built on three components, retrieval, generation and augmentation, and RAG as a way to counter hallucination and outdated knowledge by drawing on external databases.
  summary_de: Naive RAG ist das erste von drei Paradigmen in der Übersicht von Gao et al. zu Retrieval-Augmented Generation, gefolgt von Advanced RAG und Modular RAG (Gao et al., 2023). Die Übersicht beschreibt RAG als Verbindung von drei Bausteinen, Retrieval, Generierung und Augmentierung, und als Mittel gegen Halluzinationen und veraltetes Wissen durch Rückgriff auf externe Datenbanken.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: advanced-rag
  type: Method
  name_en: Advanced RAG
  name_de: Advanced RAG
  summary_en: Advanced RAG is the second of three paradigms in Gao et al.'s survey of retrieval-augmented generation, between Naive RAG and Modular RAG; the survey traces how techniques for retrieval, generation and augmentation advanced across these paradigms (Gao et al., 2023).
  summary_de: Advanced RAG ist das zweite von drei Paradigmen in der Übersicht von Gao et al. zu Retrieval-Augmented Generation, zwischen Naive RAG und Modular RAG; die Übersicht zeichnet nach, wie sich Verfahren für Retrieval, Generierung und Augmentierung über diese Paradigmen weiterentwickelt haben (Gao et al., 2023).
  sources:
  - https://arxiv.org/abs/2312.10997
- id: modular-rag
  type: Method
  name_en: Modular RAG
  name_de: Modular RAG
  summary_en: Modular RAG is the third and most recent of the RAG paradigms in Gao et al.'s survey, after Naive RAG and Advanced RAG, in the progression of paradigms that the survey examines through their retrieval, generation and augmentation techniques (Gao et al., 2023).
  summary_de: Modular RAG ist das dritte und jüngste der RAG-Paradigmen in der Übersicht von Gao et al., nach Naive RAG und Advanced RAG, in der Entwicklung von Paradigmen, die die Übersicht anhand ihrer Verfahren für Retrieval, Generierung und Augmentierung untersucht (Gao et al., 2023).
  sources:
  - https://arxiv.org/abs/2312.10997
- id: inverted-file-index
  type: Method
  name_en: Inverted file index (IVF)
  name_de: Inverted File Index (IVF)
  aliases:
  - IVF
  summary_en: An inverted file index (IVF) clusters database vectors at indexing time with a coarse quantiser, storing the vectors of each cluster contiguously in inverted lists (Douze et al., 2024). At search time only the clusters with the nearest centroids are visited, set by the nprobe parameter, which trades speed against accuracy in vector search libraries such as Faiss.
  summary_de: Ein Inverted File Index (IVF) clustert Datenbankvektoren bei der Indexierung mit einem groben Quantisierer und speichert die Vektoren jedes Clusters zusammenhängend in invertierten Listen (Douze et al., 2024). Bei der Suche werden nur die Cluster mit den nächsten Zentroiden besucht, festgelegt über den Parameter nprobe, der in Bibliotheken wie Faiss Geschwindigkeit gegen Genauigkeit abwägt.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: product-quantisation
  type: Method
  name_en: Product quantisation (PQ)
  name_de: Produktquantisierung (PQ)
  aliases:
  - Product quantization (PQ)
  summary_en: Product quantisation (PQ) compresses vectors by splitting each into M sub-vectors and quantising each separately with k-means; the code is the concatenation of the sub-quantiser indices, so each vector is stored as a short code (Douze et al., 2024). It was introduced by Jégou, Douze and Schmid for nearest-neighbour search and is a core compression method in Faiss.
  summary_de: Product Quantization (PQ) komprimiert Vektoren, indem jeder in M Teilvektoren zerlegt und jeder Teil separat mit k-Means quantisiert wird; der Code ist die Verkettung der Indizes der Teilquantisierer, sodass jeder Vektor als kurzer Code gespeichert wird (Douze et al., 2024). Sie wurde von Jégou, Douze und Schmid für die Nächste-Nachbarn-Suche eingeführt und ist ein zentrales Kompressionsverfahren in Faiss.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: ivf-pq
  type: Method
  name_en: IVF-PQ
  name_de: IVF-PQ
  summary_en: IVF-PQ combines an inverted file index, which restricts search to the clusters nearest to the query, with product quantisation of the stored vectors, so large collections can be searched quickly with compact codes (Douze et al., 2024). It is a central index type in Faiss, and Google's ScaNN library is a heavily optimised implementation of IVF-PQ.
  summary_de: IVF-PQ verbindet einen Inverted File Index, der die Suche auf die der Anfrage nächsten Cluster beschränkt, mit Product Quantization der gespeicherten Vektoren, sodass große Sammlungen schnell und mit kompakten Codes durchsucht werden können (Douze et al., 2024). Er ist ein zentraler Indextyp in Faiss, und Googles Bibliothek ScaNN ist eine stark optimierte Umsetzung von IVF-PQ.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: anisotropic-quantisation
  type: Method
  name_en: Anisotropic quantisation
  name_de: Anisotrope Quantisierung
  aliases:
  - Anisotropic quantization
  summary_en: Anisotropic quantisation is a vector quantisation approach for maximum inner product search that, instead of minimising reconstruction error, penalises the component of a data point's residual parallel to the point more than the orthogonal one, because points with the largest inner products matter most (Guo et al., 2019). It achieved state-of-the-art results on the ann-benchmarks.com benchmarks.
  summary_de: Anisotrope Quantisierung ist ein Verfahren der Vektorquantisierung für Maximum Inner Product Search, das statt den Rekonstruktionsfehler zu minimieren den zum Datenpunkt parallelen Anteil des Restfehlers stärker bestraft als den orthogonalen, weil Punkte mit den größten Skalarprodukten am wichtigsten sind (Guo et al., 2019). Es erreichte Bestwerte auf den Benchmarks von ann-benchmarks.com.
  sources:
  - https://arxiv.org/abs/1908.10396
- id: maximum-inner-product-search
  type: Method
  name_en: Maximum inner product search (MIPS)
  name_de: Maximum Inner Product Search (MIPS)
  aliases:
  - MIPS
  summary_en: Maximum inner product search (MIPS) finds the database vectors with the largest inner product with a query vector. Quantisation-based techniques are the state of the art for scaling MIPS to massive databases, for example anisotropic vector quantisation, which focuses accuracy on the points with the largest inner products (Guo et al., 2019).
  summary_de: Maximum Inner Product Search (MIPS) sucht die Datenbankvektoren mit dem größten Skalarprodukt zu einem Anfragevektor. Quantisierungsverfahren sind der Stand der Technik, um MIPS auf sehr große Datenbanken zu skalieren, etwa die anisotrope Vektorquantisierung, die die Genauigkeit auf die Punkte mit den größten Skalarprodukten konzentriert (Guo et al., 2019).
  sources:
  - https://arxiv.org/abs/1908.10396
- id: scann
  type: Technology
  name_en: ScaNN
  name_de: ScaNN
  summary_en: ScaNN (Scalable Nearest Neighbors) is a Google Research method and library for efficient vector similarity search at scale (ScaNN repository). It combines search space pruning with quantisation for maximum inner product search, also supports distances such as the Euclidean distance, and is based on anisotropic vector quantisation (Guo et al. 2020).
  summary_de: ScaNN (Scalable Nearest Neighbors) ist eine Methode und Bibliothek von Google Research für effiziente Vektorähnlichkeitssuche in großem Maßstab (ScaNN-Repository). Sie verbindet das Beschneiden des Suchraums mit Quantisierung für die Suche nach dem maximalen Skalarprodukt, unterstützt auch Distanzen wie die euklidische und beruht auf anisotroper Vektorquantisierung (Guo et al. 2020).
  sources:
  - https://github.com/google-research/google-research/tree/master/scann
- id: metadata-filtering
  type: Method
  name_en: Metadata filtering
  name_de: Metadatenfilterung
  summary_en: Metadata filtering restricts retrieval to chunks whose metadata, such as file name, category or timestamp, match given conditions, which limits the scope of the search (Gao et al. 2023). Weighting timestamps, for example, allows time-aware retrieval that favours current over outdated information.
  summary_de: Metadatenfilterung beschränkt das Retrieval auf Chunks, deren Metadaten wie Dateiname, Kategorie oder Zeitstempel bestimmte Bedingungen erfüllen, und grenzt so den Suchraum ein (Gao et al. 2023). Eine Gewichtung von Zeitstempeln erlaubt etwa zeitbewusstes Retrieval, das aktuelle Informationen gegenüber veralteten bevorzugt.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: turtle
  type: Technology
  name_en: Turtle
  name_de: Turtle
  summary_en: Turtle is a W3C textual syntax that writes an RDF graph completely in a compact and natural text form, with abbreviations for common usage patterns and datatypes (W3C 2014). It is compatible to some degree with N-Triples and with the triple pattern syntax of SPARQL.
  summary_de: Turtle ist eine textuelle Syntax des W3C, mit der sich ein RDF-Graph vollständig in kompakter, natürlicher Textform aufschreiben lässt, mit Abkürzungen für häufige Muster und Datentypen (W3C 2014). Sie ist in Teilen kompatibel mit N-Triples und mit der Tripelmuster-Syntax von SPARQL.
  sources:
  - https://www.w3.org/TR/turtle/
- id: json-ld
  type: Technology
  name_en: JSON-LD
  name_de: JSON-LD
  summary_en: JSON-LD is a W3C JSON-based format for serialising Linked Data, designed to integrate easily into systems that already use JSON and to offer an upgrade path from JSON to JSON-LD (W3C 2020). Version 1.1 is a superset of JSON-LD 1.0, and 1.0 documents generally remain compatible.
  summary_de: JSON-LD ist ein JSON-basiertes Format des W3C zur Serialisierung von Linked Data, das sich leicht in Systeme einfügen soll, die bereits JSON nutzen, und einen Übergang von JSON zu JSON-LD bietet (W3C 2020). Version 1.1 ist eine Obermenge von JSON-LD 1.0; Dokumente der Version 1.0 bleiben in der Regel kompatibel.
  sources:
  - https://www.w3.org/TR/json-ld11/
- id: n-triples
  type: Technology
  name_en: N-Triples / N-Quads
  name_de: N-Triples / N-Quads
  summary_en: N-Triples is a W3C line-based plain-text format for encoding an RDF graph; its counterpart N-Quads is a line-based plain-text format for encoding an RDF dataset, i.e. several graphs (W3C 2014a; W3C 2014b).
  summary_de: N-Triples ist ein zeilenbasiertes Klartextformat des W3C zur Kodierung eines RDF-Graphen; das Gegenstück N-Quads ist ein zeilenbasiertes Klartextformat zur Kodierung eines RDF-Datasets, also mehrerer Graphen (W3C 2014a; W3C 2014b).
  sources:
  - https://www.w3.org/TR/n-triples/
  - https://www.w3.org/TR/n-quads/
- id: reification
  type: Method
  name_en: Reification (RDF)
  name_de: Reifikation (RDF)
  summary_en: RDF reification uses a vocabulary (rdf:Statement, rdf:subject, rdf:predicate, rdf:object) to describe RDF statements without asserting them, so that statements about statements can be made (W3C 2014). The vocabulary dates back to the 1999 RDF Model and Syntax specification and has no normative formal semantics; RDF Schema 1.1 only describes its intended meaning in a non-normative section.
  summary_de: Die RDF-Reifikation beschreibt RDF-Aussagen mit einem eigenen Vokabular (rdf:Statement, rdf:subject, rdf:predicate, rdf:object), ohne sie selbst zu behaupten, sodass sich Aussagen über Aussagen treffen lassen (W3C 2014). Das Vokabular stammt aus der RDF-Spezifikation von 1999 und hat keine normative formale Semantik; RDF Schema 1.1 beschreibt seine beabsichtigte Bedeutung nur in einem nicht normativen Abschnitt.
  sources:
  - https://www.w3.org/TR/rdf-schema/
- id: lstm
  type: Method
  name_en: Long short-term memory (LSTM)
  name_de: Long Short-Term Memory (LSTM)
  aliases:
  - LSTM
  summary_en: Long short-term memory (LSTM) is a recurrent neural network architecture that addresses the decaying error flow that makes learning over long time intervals with recurrent back-propagation slow (Hochreiter and Schmidhuber 1997). Special units enforce constant error flow through so-called constant error carousels, and multiplicative gate units learn to open and close access to them, so that LSTM can bridge time lags of more than 1,000 steps.
  summary_de: Long Short-Term Memory (LSTM) ist eine Architektur rekurrenter neuronaler Netze, die das Abklingen des Fehlersignals angeht, das Lernen über lange Zeitabstände mit rekurrenter Backpropagation verlangsamt (Hochreiter und Schmidhuber 1997). Spezielle Einheiten erzwingen einen konstanten Fehlerfluss durch sogenannte Constant Error Carousels, und multiplikative Gate-Einheiten lernen, den Zugang dazu zu öffnen und zu schließen, sodass LSTM Zeitabstände von mehr als 1.000 Schritten überbrücken kann.
  sources:
  - https://doi.org/10.1162/neco.1997.9.8.1735
  - https://www.bioinf.jku.at/publications/older/2604.pdf
- id: gru
  type: Method
  name_en: Gated recurrent unit (GRU)
  name_de: Gated Recurrent Unit (GRU)
  aliases:
  - GRU
  summary_en: The gated recurrent unit (GRU) is a recurrent unit with a gating mechanism, like the long short-term memory (LSTM) unit (Chung et al., 2014). On polyphonic music and speech signal modelling, gated units clearly beat traditional tanh units, and the GRU was comparable to the LSTM.
  summary_de: Die Gated Recurrent Unit (GRU) ist eine rekurrente Einheit mit Gating-Mechanismus, ähnlich der Long-Short-Term-Memory-Einheit (LSTM) (Chung et al., 2014). Bei der Modellierung polyphoner Musik und von Sprachsignalen schlugen Einheiten mit Gating klassische tanh-Einheiten deutlich, und die GRU war mit dem LSTM vergleichbar.
  sources:
  - https://arxiv.org/abs/1412.3555
- id: back-propagation-through-time
  type: Method
  name_en: Back-propagation through time
  name_de: Backpropagation Through Time
  summary_en: Back-propagation through time (BPTT) is the back-propagation algorithm applied to the graph of a recurrent neural network unrolled over the time steps of a sequence (Goodfellow et al. 2016). Its runtime and memory cost grow with the sequence length, because the states of the forward pass must be stored until they are reused in the backward pass.
  summary_de: Backpropagation Through Time (BPTT) ist der Backpropagation-Algorithmus, angewandt auf den über die Zeitschritte einer Sequenz ausgerollten Graphen eines rekurrenten neuronalen Netzes (Goodfellow et al. 2016). Laufzeit und Speicherbedarf wachsen mit der Sequenzlänge, weil die Zustände des Vorwärtsdurchlaufs bis zu ihrer Wiederverwendung im Rückwärtsdurchlauf gespeichert werden müssen.
  sources:
  - https://www.deeplearningbook.org/contents/rnn.html
- id: vanishing-and-exploding-gradients
  type: Concept
  name_en: Vanishing and exploding gradients
  name_de: Verschwindende und explodierende Gradienten
  summary_en: The vanishing and exploding gradient problems make training recurrent neural networks difficult, as gradients shrink towards zero or grow uncontrollably when propagated through many time steps (Pascanu et al., 2012). Pascanu et al. proposed gradient norm clipping against exploding gradients and a soft constraint against vanishing gradients.
  summary_de: Das Problem verschwindender und explodierender Gradienten erschwert das Training rekurrenter neuronaler Netze, weil Gradienten über viele Zeitschritte hinweg gegen null schrumpfen oder unkontrolliert wachsen (Pascanu et al., 2012). Pascanu et al. schlugen Gradient Norm Clipping gegen explodierende und eine weiche Nebenbedingung gegen verschwindende Gradienten vor.
  sources:
  - https://arxiv.org/abs/1211.5063
- id: positive-congruent-training
  type: Method
  name_en: Positive-congruent training
  name_de: Positive-Congruent Training
  summary_en: Positive-congruent training reduces "negative flips", test samples that an old model classified correctly but a new model gets wrong, while also lowering the overall error rate (Yan et al., 2020). Its method, Focal Distillation, gives more weight to samples the reference model classified correctly, and using an ensemble as reference reduced negative flips further.
  summary_de: Positive-Congruent Training verringert „Negative Flips“, also Testbeispiele, die ein altes Modell richtig, ein neues aber falsch klassifiziert, und senkt zugleich die Gesamtfehlerrate (Yan et al., 2020). Das Verfahren Focal Distillation gewichtet Beispiele stärker, die das Referenzmodell richtig klassifiziert hat, und ein Ensemble als Referenz verringerte Negative Flips weiter.
  sources:
  - https://arxiv.org/abs/2011.09161
- id: negative-flip
  type: Concept
  name_en: Negative flip
  name_de: Negative Flip
  summary_en: A negative flip is a test sample that an old (reference) model classified correctly but a new model classifies incorrectly (Yan et al., 2020). Reducing such inconsistencies between model versions can matter as much in practice as reducing overall error; positive-congruent training targets them.
  summary_de: Ein Negative Flip ist ein Testbeispiel, das ein altes (Referenz-)Modell richtig, ein neues Modell aber falsch klassifiziert (Yan et al., 2020). Negative Flips zu verringern kann in der Praxis so wichtig sein wie die Gesamtfehlerrate zu senken; Positive-Congruent Training zielt darauf ab.
  sources:
  - https://arxiv.org/abs/2011.09161
- id: ridge-regression
  type: Method
  name_en: Ridge regression (L2 regularisation)
  name_de: Ridge-Regression (L2-Regularisierung)
  summary_en: Ridge regression adds a penalty on the size of the coefficients to least squares, minimising the residual sum of squares plus α times the squared L2 norm of the coefficients (scikit-learn developers, n.d.-d). The larger α, the stronger the shrinkage and the more robust the coefficients become to collinearity.
  summary_de: Ridge-Regression ergänzt die Methode der kleinsten Quadrate um eine Strafe auf die Größe der Koeffizienten und minimiert die Summe der quadrierten Abweichungen plus α mal die quadrierte L2-Norm der Koeffizienten (scikit-learn developers, n.d.-d). Je größer α, desto stärker die Schrumpfung und desto robuster werden die Koeffizienten gegenüber Kollinearität.
  sources:
  - https://scikit-learn.org/stable/modules/linear_model.html
- id: dropout
  type: Method
  name_en: Dropout
  name_de: Dropout
  summary_en: Dropout is a regularisation technique for neural networks that randomly drops units together with their connections during training, which prevents units from co-adapting too much (Srivastava et al. 2014). Training thus samples from an exponential number of thinned networks; at test time a single unthinned network with smaller weights approximates averaging their predictions.
  summary_de: Dropout ist eine Regularisierungstechnik für neuronale Netze, die während des Trainings zufällig Einheiten samt ihren Verbindungen weglässt und so verhindert, dass sich Einheiten zu stark aneinander anpassen (Srivastava et al. 2014). Das Training zieht damit Stichproben aus exponentiell vielen ausgedünnten Netzen; zur Testzeit nähert ein einzelnes vollständiges Netz mit kleineren Gewichten den Mittelwert ihrer Vorhersagen an.
  sources:
  - https://jmlr.org/papers/v15/srivastava14a.html
- id: early-stopping
  type: Method
  name_en: Early stopping
  name_de: Early Stopping
  summary_en: Early stopping uses the error on a validation set, i.e. examples not used for training, to detect when overfitting starts during training and stops training before convergence (Prechelt 1998). In Prechelt's experiments with multi-layer perceptrons, slower stopping criteria improved generalisation slightly, by about 4% on average, but needed about four times as much training time.
  summary_de: Early Stopping nutzt den Fehler auf einem Validierungsdatensatz, also auf nicht zum Training verwendeten Beispielen, um zu erkennen, wann während des Trainings Overfitting einsetzt, und bricht das Training vor der Konvergenz ab (Prechelt 1998). In Prechelts Experimenten mit mehrschichtigen Perzeptronen verbesserten langsamere Abbruchkriterien die Generalisierung leicht, im Mittel um etwa 4 %, kosteten aber etwa die vierfache Trainingszeit.
  sources:
  - https://doi.org/10.1007/3-540-49430-8_3
  - https://page.mi.fu-berlin.de/prechelt/Biblio/stop_tricks1997.pdf
- id: random-search
  type: Method
  name_en: Random search
  name_de: Zufallssuche (Random Search)
  summary_en: Random search samples hyperparameter settings from specified distributions instead of an exhaustive grid (scikit-learn developers, n.d.-h). Its budget can be chosen independently of the number of parameters and values, and adding parameters that do not affect performance does not reduce its efficiency.
  summary_de: Random Search zieht Hyperparameter-Einstellungen aus vorgegebenen Verteilungen statt ein Raster vollständig abzusuchen (scikit-learn developers, n.d.-h). Sein Budget lässt sich unabhängig von der Zahl der Parameter und Werte wählen, und Parameter ohne Einfluss auf die Leistung mindern seine Effizienz nicht.
  sources:
  - https://scikit-learn.org/stable/modules/grid_search.html
- id: grid-search
  type: Method
  name_en: Grid search
  name_de: Rastersuche (Grid Search)
  summary_en: Grid search exhaustively evaluates every combination of hyperparameter values from a specified grid, usually with cross-validation, and keeps the best combination (scikit-learn developers, n.d.-h). It is the most widely used approach to hyperparameter optimisation, but its cost grows with every added parameter and value.
  summary_de: Grid Search bewertet erschöpfend jede Kombination von Hyperparameterwerten aus einem vorgegebenen Raster, meist mit Kreuzvalidierung, und behält die beste Kombination (scikit-learn developers, n.d.-h). Sie ist das am weitesten verbreitete Verfahren der Hyperparameter-Optimierung, doch ihr Aufwand wächst mit jedem zusätzlichen Parameter und Wert.
  sources:
  - https://scikit-learn.org/stable/modules/grid_search.html
- id: bayesian-optimisation
  type: Method
  name_en: Bayesian optimisation
  name_de: Bayessche Optimierung
  summary_en: Bayesian optimisation tunes hyperparameters automatically by modelling a learning algorithm's generalisation performance as a sample from a Gaussian process, whose posterior guides which settings to try next (Snoek et al., 2012). Snoek et al. showed that careful choices of prior and inference can reach or surpass human expert tuning, and added variants that account for the cost of experiments and run them in parallel.
  summary_de: Bayes'sche Optimierung stimmt Hyperparameter automatisch ab, indem sie die Generalisierungsleistung eines Lernverfahrens als Stichprobe aus einem Gaußprozess modelliert, dessen Posterior bestimmt, welche Einstellungen als Nächstes probiert werden (Snoek et al., 2012). Snoek et al. zeigten, dass eine sorgfältige Wahl von Prior und Inferenz die Abstimmung durch Fachleute erreichen oder übertreffen kann, und ergänzten Varianten, die die Kosten von Experimenten berücksichtigen und sie parallel ausführen.
  sources:
  - https://arxiv.org/abs/1206.2944
- id: gaussian-process
  type: Method
  name_en: Gaussian process
  name_de: Gauß-Prozess
  summary_en: Gaussian processes are a nonparametric supervised learning method for regression and probabilistic classification whose predictions are probabilistic, so that confidence intervals can be computed, and whose behaviour is set by a choice of kernel (scikit-learn developers, n.d.-l). They lose efficiency in high-dimensional spaces, when the number of features exceeds a few dozen.
  summary_de: Gaußprozesse sind ein nichtparametrisches überwachtes Lernverfahren für Regression und probabilistische Klassifikation, dessen Vorhersagen probabilistisch sind, sodass sich Konfidenzintervalle berechnen lassen, und dessen Verhalten über die Wahl eines Kernels festgelegt wird (scikit-learn developers, n.d.-l). In hochdimensionalen Räumen, ab einigen Dutzend Merkmalen, verlieren sie an Effizienz.
  sources:
  - https://scikit-learn.org/stable/modules/gaussian_process.html
- id: q-learning
  type: Method
  name_en: Q-learning
  name_de: Q-Learning
  summary_en: Q-learning is a reinforcement learning method in which an agent learns to act optimally in Markovian domains by incrementally improving its estimates of the quality (Q-value) of particular actions in particular states (Watkins and Dayan 1992). It converges to the optimal action values with probability 1 as long as all actions are sampled repeatedly in all states and the values are represented discretely.
  summary_de: Q-Learning ist ein Verfahren des Reinforcement Learning, bei dem ein Agent lernt, in Markov-Umgebungen optimal zu handeln, indem er schrittweise seine Schätzungen der Qualität (Q-Wert) bestimmter Aktionen in bestimmten Zuständen verbessert (Watkins und Dayan 1992). Es konvergiert mit Wahrscheinlichkeit 1 gegen die optimalen Aktionswerte, solange alle Aktionen in allen Zuständen wiederholt ausprobiert werden und die Werte diskret dargestellt sind.
  sources:
  - https://doi.org/10.1007/BF00992698
- id: deep-q-learning
  type: Method
  name_en: Deep Q-learning (DQN)
  name_de: Deep Q-Learning (DQN)
  summary_en: Deep Q-learning trains a convolutional neural network with a variant of Q-learning to learn control policies directly from raw pixels, with a value function estimating future rewards as output (Mnih et al., 2013). Applied to seven Atari 2600 games without changing architecture or algorithm, it outperformed all previous approaches on six and surpassed a human expert on three.
  summary_de: Deep Q-Learning trainiert ein Convolutional Neural Network mit einer Variante von Q-Learning, um Steuerungsstrategien direkt aus Rohpixeln zu lernen; die Ausgabe ist eine Wertfunktion, die künftige Belohnungen schätzt (Mnih et al., 2013). Bei sieben Atari-2600-Spielen ohne Anpassung von Architektur oder Algorithmus übertraf es bei sechs alle früheren Verfahren und bei drei einen menschlichen Experten.
  sources:
  - https://arxiv.org/abs/1312.5602
- id: markov-decision-process
  type: Concept
  name_en: Markov decision process
  name_de: Markov-Entscheidungsprozess
  summary_en: A Markov decision process (MDP) is a classical formalisation of sequential decision making in which actions influence not only immediate rewards but also subsequent states and thus future rewards (Sutton and Barto 2018). MDPs therefore involve delayed reward and a trade-off between immediate and delayed reward; they reduce goal-directed learning to actions, states and rewards passed between an agent and its environment.
  summary_de: Ein Markov-Entscheidungsprozess (MDP) ist eine klassische Formalisierung sequenzieller Entscheidungen, bei denen Aktionen nicht nur die unmittelbare Belohnung, sondern auch die folgenden Zustände und damit künftige Belohnungen beeinflussen (Sutton und Barto 2018). MDPs beinhalten daher verzögerte Belohnungen und eine Abwägung zwischen unmittelbarer und späterer Belohnung; sie reduzieren zielgerichtetes Lernen auf Aktionen, Zustände und Belohnungen, die zwischen Agent und Umgebung ausgetauscht werden.
  sources:
  - http://incompleteideas.net/book/the-book-2nd.html
- id: exploration-exploitation-tradeoff
  type: Concept
  name_en: Exploration-exploitation trade-off
  name_de: Exploration-Exploitation-Abwägung
  summary_en: The exploration-exploitation trade-off is a challenge specific to reinforcement learning (Sutton and Barto 2018). To obtain much reward, an agent must prefer actions it has found effective, but to discover such actions it must try actions it has not selected before; neither exploitation nor exploration can be pursued exclusively without failing at the task.
  summary_de: Die Abwägung zwischen Exploration und Exploitation ist eine für Reinforcement Learning typische Herausforderung (Sutton und Barto 2018). Um viel Belohnung zu erhalten, muss ein Agent Aktionen bevorzugen, die sich als wirksam erwiesen haben; um solche Aktionen zu finden, muss er aber auch bisher nicht gewählte Aktionen ausprobieren. Weder Exploitation noch Exploration lässt sich ausschließlich verfolgen, ohne an der Aufgabe zu scheitern.
  sources:
  - http://incompleteideas.net/book/the-book-2nd.html
- id: epsilon-greedy
  type: Method
  name_en: Epsilon-greedy action selection
  name_de: Epsilon-Greedy-Aktionsauswahl
  summary_en: Epsilon-greedy action selection behaves greedily most of the time, choosing the action with the highest estimated value, but with a small probability ε selects an action at random from all actions (Sutton and Barto 2018). In the limit every action is sampled infinitely often, so all value estimates converge to their true values.
  summary_de: Die ε-greedy-Aktionsauswahl handelt meist gierig, wählt also die Aktion mit dem höchsten geschätzten Wert, wählt aber mit einer kleinen Wahrscheinlichkeit ε zufällig eine beliebige Aktion (Sutton und Barto 2018). Im Grenzfall wird jede Aktion unendlich oft ausprobiert, sodass alle Wertschätzungen gegen ihre wahren Werte konvergieren.
  sources:
  - http://incompleteideas.net/book/the-book-2nd.html
- id: self-adversarial-negative-sampling
  type: Method
  name_en: Self-adversarial negative sampling
  name_de: Self-adversarial Negative Sampling
  summary_en: Self-adversarial negative sampling is a technique for training knowledge graph embedding models, proposed together with RotatE to train it efficiently and effectively (Sun et al., 2019). RotatE itself models each relation as a rotation from the source to the target entity in complex vector space, capturing symmetry, antisymmetry, inversion and composition.
  summary_de: Self-Adversarial Negative Sampling ist ein Verfahren zum Training von Knowledge-Graph-Embedding-Modellen, das zusammen mit RotatE vorgeschlagen wurde, um es effizient und wirksam zu trainieren (Sun et al., 2019). RotatE selbst modelliert jede Relation als Drehung von der Ausgangs- zur Zielentität im komplexen Vektorraum und erfasst so Symmetrie, Antisymmetrie, Inversion und Komposition.
  sources:
  - https://arxiv.org/abs/1902.10197
- id: relational-model
  type: Concept
  name_en: Relational model
  name_de: Relationenmodell
- id: window-functions
  type: Method
  name_en: Window functions (SQL)
  name_de: Fensterfunktionen (SQL)
  summary_en: A window function in SQL performs a calculation across a set of table rows that are related to the current row, similar to an aggregate function, but without grouping the rows into a single output row; each row keeps its identity (PostgreSQL documentation). The rows considered are defined in an OVER clause, for example with PARTITION BY.
  summary_de: Eine Fensterfunktion in SQL führt eine Berechnung über eine Menge von Tabellenzeilen aus, die mit der aktuellen Zeile zusammenhängen, ähnlich wie eine Aggregatfunktion, fasst die Zeilen aber nicht zu einer einzigen Ausgabezeile zusammen; jede Zeile bleibt erhalten (PostgreSQL-Dokumentation). Welche Zeilen einbezogen werden, legt eine OVER-Klausel fest, etwa mit PARTITION BY.
  sources:
  - https://www.postgresql.org/docs/current/tutorial-window.html
- id: common-table-expressions
  type: Method
  name_en: Common table expressions (CTEs)
  name_de: Common Table Expressions (CTEs)
  summary_en: Common table expressions (CTEs) are auxiliary statements in a SQL WITH clause that act like temporary tables existing only for one query (PostgreSQL documentation). They break complicated queries into simpler parts, and recursive CTEs are typically used for hierarchical or tree-structured data.
  summary_de: Common Table Expressions (CTEs) sind Hilfsanweisungen in einer WITH-Klausel von SQL, die wie temporäre Tabellen wirken, die nur für eine Abfrage existieren (PostgreSQL-Dokumentation). Sie zerlegen komplizierte Abfragen in einfachere Teile; rekursive CTEs werden typischerweise für hierarchische oder baumartige Daten genutzt.
  sources:
  - https://www.postgresql.org/docs/current/queries-with.html
- id: database-index
  type: Method
  name_en: Database index
  name_de: Datenbankindex
  summary_en: A database index is an auxiliary structure that lets the database system locate matching rows without scanning the entire table row by row, for example by walking a few levels of a search tree (PostgreSQL documentation). Like the index of a book, it speeds up frequent lookups; because it has to be kept synchronised with the table, it adds overhead to data changes.
  summary_de: Ein Datenbankindex ist eine Hilfsstruktur, mit der das Datenbanksystem passende Zeilen findet, ohne die ganze Tabelle Zeile für Zeile zu durchsuchen, etwa indem es wenige Ebenen eines Suchbaums durchläuft (PostgreSQL-Dokumentation). Wie das Register eines Buchs beschleunigt er häufige Suchen, muss aber mit der Tabelle synchron gehalten werden, was Datenänderungen verlangsamt.
  sources:
  - https://www.postgresql.org/docs/current/indexes-intro.html
- id: bootstrap
  type: Method
  name_en: Bootstrap
  name_de: Bootstrap
  summary_en: The bootstrap estimates the sampling distribution of a statistic from the observed data by resampling it, and works on a variety of estimation problems, for example the error rate of a linear discriminant analysis (Efron 1979). In machine learning it is used, for instance, to quantify the uncertainty of evaluation metrics.
  summary_de: Der Bootstrap schätzt die Stichprobenverteilung einer Statistik aus den beobachteten Daten, indem er aus ihnen erneut Stichproben zieht, und funktioniert bei vielen Schätzproblemen, etwa für die Fehlerrate einer linearen Diskriminanzanalyse (Efron 1979). Im maschinellen Lernen dient er zum Beispiel dazu, die Unsicherheit von Evaluationsmetriken zu beziffern.
  sources:
  - https://doi.org/10.1214/aos/1176344552
- id: p-value
  type: Concept
  name_en: p-value
  name_de: p-Wert
  summary_en: A p-value is the probability that the chosen test statistic would have been at least as large as its observed value if every model assumption were correct, including the test hypothesis (Greenland et al. 2016). It is not the probability that the hypothesis is true and does not measure the size or importance of an effect; the American Statistical Association warns against basing decisions only on whether a p-value passes a threshold (Wasserstein and Lazar 2016).
  summary_de: Ein p-Wert ist die Wahrscheinlichkeit, dass die gewählte Teststatistik mindestens so groß wie ihr beobachteter Wert ausgefallen wäre, wenn alle Modellannahmen einschließlich der Testhypothese zuträfen (Greenland et al. 2016). Er ist nicht die Wahrscheinlichkeit, dass die Hypothese wahr ist, und misst weder Größe noch Bedeutung eines Effekts; die American Statistical Association warnt davor, Entscheidungen allein daran festzumachen, ob ein p-Wert eine Schwelle unterschreitet (Wasserstein und Lazar 2016).
  sources:
  - https://doi.org/10.1007/s10654-016-0149-3
  - https://doi.org/10.1080/00031305.2016.1154108
- id: confidence-interval
  type: Concept
  name_en: Confidence interval
  name_de: Konfidenzintervall
  summary_en: A confidence interval is an interval estimate with the property that, if 95% confidence intervals are computed repeatedly in valid applications, 95% of them will on average contain the true effect size (Greenland et al. 2016). A specific reported interval does not have a 95% chance of containing the true value; the 95% refers only to how often such intervals would contain it if all assumptions were correct.
  summary_de: Ein Konfidenzintervall ist ein Intervallschätzer mit der Eigenschaft, dass bei wiederholter Berechnung von 95-%-Konfidenzintervallen in gültigen Anwendungen im Mittel 95 % von ihnen die wahre Effektgröße enthalten (Greenland et al. 2016). Ein konkret berichtetes Intervall enthält den wahren Wert nicht mit 95 % Wahrscheinlichkeit; die 95 % beziehen sich nur darauf, wie oft solche Intervalle ihn enthalten würden, wenn alle Annahmen zuträfen.
  sources:
  - https://doi.org/10.1007/s10654-016-0149-3
- id: bayesian-inference
  type: Method
  name_en: Bayesian inference
  name_de: Bayessche Inferenz
  summary_en: In Bayesian inference, unknown quantities are treated as random; a prior distribution is combined with the likelihood of the data via Bayes' rule into a posterior distribution, and uncertainty is summarised with posterior intervals (Gelman et al. 2013). This contrasts with frequentist tests and confidence intervals, which describe how a procedure behaves over repeated samples.
  summary_de: In der bayesschen Inferenz werden unbekannte Größen als zufällig behandelt; eine A-priori-Verteilung wird über den Satz von Bayes mit der Likelihood der Daten zu einer A-posteriori-Verteilung verbunden, und die Unsicherheit wird mit Posterior-Intervallen zusammengefasst (Gelman et al. 2013). Frequentistische Tests und Konfidenzintervalle beschreiben dagegen, wie sich ein Verfahren über wiederholte Stichproben verhält.
  sources:
  - https://sites.stat.columbia.edu/gelman/book/
- id: american-statistical-association
  type: Organisation
  name_en: American Statistical Association (ASA)
  name_de: American Statistical Association (ASA)
  summary_en: The American Statistical Association (ASA), founded in Boston in 1839, is the world's largest community of statisticians and the second-oldest continuously operating professional association in the United States (ASA). Its mission is to promote the practice and profession of statistics; its members work in industry, government and academia in more than 90 countries.
  summary_de: Die American Statistical Association (ASA), 1839 in Boston gegründet, ist die weltweit größte Gemeinschaft von Statistikerinnen und Statistikern und der zweitälteste fortlaufend bestehende Berufsverband der USA (ASA). Sie will Praxis und Beruf der Statistik fördern; ihre Mitglieder arbeiten in Wirtschaft, Verwaltung und Wissenschaft in mehr als 90 Ländern.
  sources:
  - https://www.amstat.org/about-asa
- id: raptor
  type: Method
  name_en: RAPTOR
  name_de: RAPTOR
  summary_en: RAPTOR recursively embeds, clusters and summarises text chunks to build a tree with different levels of summarisation from the bottom up, and retrieves from this tree at inference time to integrate information across long documents (Sarthi et al., 2024). Combined with GPT-4 it improved the best result on the QuALITY benchmark by 20 percentage points in accuracy.
  summary_de: RAPTOR bettet Textabschnitte rekursiv ein, clustert und fasst sie zusammen und baut so von unten einen Baum mit unterschiedlichen Zusammenfassungsebenen auf, aus dem es bei der Inferenz abruft, um Informationen aus langen Dokumenten zu verbinden (Sarthi et al., 2024). Zusammen mit GPT-4 verbesserte es das beste Ergebnis auf dem Benchmark QuALITY um 20 Prozentpunkte Accuracy.
  sources:
  - https://arxiv.org/abs/2401.18059
- id: support-vector-regression
  type: Method
  name_en: Support vector regression
  name_de: Support-Vector-Regression
  summary_en: Support vector regression (SVR) extends support vector classification to regression; the model depends only on a subset of the training data because the cost function ignores samples whose prediction is close to their target (scikit-learn developers, n.d.-k). scikit-learn offers SVR, NuSVR and LinearSVR.
  summary_de: Support Vector Regression (SVR) überträgt die Support-Vector-Klassifikation auf Regression; das Modell hängt nur von einem Teil der Trainingsdaten ab, weil die Kostenfunktion Beispiele ignoriert, deren Vorhersage nahe am Zielwert liegt (scikit-learn developers, n.d.-k). scikit-learn bietet SVR, NuSVR und LinearSVR.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: kernel-trick
  type: Method
  name_en: Kernel trick
  name_de: Kernel-Trick
  summary_en: The kernel trick lets support vector machines work in a higher, possibly infinite-dimensional feature space without computing the mapping explicitly, because the dual formulation only needs inner products, which a kernel function such as the linear, polynomial, RBF or sigmoid kernel provides (scikit-learn developers, n.d.-k). It cannot be applied to the primal hinge-loss formulation used by LinearSVC.
  summary_de: Der Kernel-Trick erlaubt Support Vector Machines, in einem höher-, möglicherweise unendlichdimensionalen Merkmalsraum zu arbeiten, ohne die Abbildung explizit zu berechnen, weil die duale Formulierung nur Skalarprodukte braucht, die eine Kernfunktion wie der lineare, polynomielle, RBF- oder Sigmoid-Kernel liefert (scikit-learn developers, n.d.-k). Auf die primale Formulierung mit Hinge Loss, die LinearSVC nutzt, lässt er sich nicht anwenden.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: soft-margin
  type: Method
  name_en: Soft margin
  name_de: Soft Margin
  summary_en: 'A soft margin lets a support vector machine separate classes that are not perfectly separable: some samples may lie within the margin or on the wrong side at a distance ζ, penalised in the objective (scikit-learn developers, n.d.-k). The parameter C controls the strength of this penalty and acts as an inverse regularisation parameter.'
  summary_de: 'Ein weicher Rand (Soft Margin) erlaubt einer Support Vector Machine, Klassen zu trennen, die nicht vollständig trennbar sind: Einzelne Beispiele dürfen im Randbereich oder auf der falschen Seite im Abstand ζ liegen und werden in der Zielfunktion bestraft (scikit-learn developers, n.d.-k). Der Parameter C steuert die Stärke dieser Strafe und wirkt als inverser Regularisierungsparameter.'
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: hinge-loss
  type: Method
  name_en: Hinge loss
  name_de: Hinge Loss
  summary_en: The hinge loss, max(0, 1 − y·f(x)), is zero for samples classified correctly with a margin of at least 1 and grows linearly otherwise (scikit-learn developers, n.d.-k). The primal problem of a linear support vector machine can be written as minimising ½‖w‖² plus C times the sum of hinge losses, the form LinearSVC optimises directly.
  summary_de: Der Hinge Loss, max(0, 1 − y·f(x)), ist null für Beispiele, die mit einem Rand von mindestens 1 richtig klassifiziert sind, und wächst sonst linear (scikit-learn developers, n.d.-k). Das primale Problem einer linearen Support Vector Machine lässt sich als Minimierung von ½‖w‖² plus C mal die Summe der Hinge Losses schreiben, die Form, die LinearSVC direkt optimiert.
  sources:
  - https://scikit-learn.org/stable/modules/svm.html
- id: rouge
  type: Method
  name_en: ROUGE
  name_de: ROUGE
  summary_en: ROUGE (Recall-Oriented Understudy for Gisting Evaluation) is a set of measures for automatically evaluating summaries by counting overlapping units such as n-grams, word sequences and word pairs between a generated summary and human reference summaries (Lin 2004). The original package introduced ROUGE-N, ROUGE-L, ROUGE-W and ROUGE-S.
  summary_de: ROUGE (Recall-Oriented Understudy for Gisting Evaluation) ist eine Gruppe von Maßen zur automatischen Bewertung von Zusammenfassungen, die überlappende Einheiten wie N-Gramme, Wortfolgen und Wortpaare zwischen einer erzeugten Zusammenfassung und menschlichen Referenzzusammenfassungen zählen (Lin 2004). Das ursprüngliche Paket führte ROUGE-N, ROUGE-L, ROUGE-W und ROUGE-S ein.
  sources:
  - https://aclanthology.org/W04-1013/
- id: exponential-smoothing
  type: Method
  name_en: Exponential smoothing (ETS)
  name_de: Exponentielle Glättung (ETS)
  aliases:
  - ETS
  summary_en: Exponential smoothing forecasts with weighted averages of past observations whose weights decrease exponentially with age, controlled by a smoothing parameter α between 0 and 1 (Hyndman and Athanasopoulos 2021). The ETS family of state space models (Error, Trend, Seasonal) produces the same point forecasts as the exponential smoothing methods but also prediction intervals, and allows model selection with information criteria.
  summary_de: Exponentielle Glättung prognostiziert mit gewichteten Mittelwerten vergangener Beobachtungen, deren Gewichte mit zunehmendem Alter exponentiell abnehmen; gesteuert wird das über einen Glättungsparameter α zwischen 0 und 1 (Hyndman und Athanasopoulos 2021). Die ETS-Familie von Zustandsraummodellen (Error, Trend, Seasonal) liefert dieselben Punktprognosen wie die Glättungsverfahren, zusätzlich aber Prognoseintervalle, und erlaubt die Modellwahl über Informationskriterien.
  sources:
  - https://otexts.com/fpp3/ses.html
  - https://otexts.com/fpp3/ets.html
- id: arima
  type: Method
  name_en: ARIMA
  name_de: ARIMA
  summary_en: ARIMA (AutoRegressive Integrated Moving Average) models combine differencing with autoregression and a moving average model; "integration" is the reverse of differencing (Hyndman and Athanasopoulos 2021). While exponential smoothing describes trend and seasonality, ARIMA models aim to describe the autocorrelations in the data; together they are the two most widely used approaches to time series forecasting.
  summary_de: ARIMA-Modelle (AutoRegressive Integrated Moving Average) verbinden Differenzenbildung mit Autoregression und einem Moving-Average-Modell; „Integration“ ist dabei die Umkehrung der Differenzenbildung (Hyndman und Athanasopoulos 2021). Während exponentielle Glättung Trend und Saisonalität beschreibt, beschreiben ARIMA-Modelle die Autokorrelationen in den Daten; beide sind die am weitesten verbreiteten Ansätze der Zeitreihenprognose.
  sources:
  - https://otexts.com/fpp3/arima.html
  - https://otexts.com/fpp3/non-seasonal-arima.html
- id: stationarity
  type: Concept
  name_en: Stationarity
  name_de: Stationarität
  summary_en: A stationary time series is one whose statistical properties do not depend on the time at which it is observed (Hyndman and Athanasopoulos 2021). Series with trend or seasonality are therefore not stationary, while white noise is; differencing can make a series stationary, and unit root tests help decide objectively whether differencing is needed.
  summary_de: Eine stationäre Zeitreihe ist eine Reihe, deren statistische Eigenschaften nicht vom Beobachtungszeitpunkt abhängen (Hyndman und Athanasopoulos 2021). Reihen mit Trend oder Saisonalität sind daher nicht stationär, weißes Rauschen dagegen schon; Differenzenbildung kann eine Reihe stationär machen, und Einheitswurzeltests helfen, objektiv zu entscheiden, ob Differenzen nötig sind.
  sources:
  - https://otexts.com/fpp3/stationarity.html
- id: autocorrelation
  type: Concept
  name_en: Autocorrelation
  name_de: Autokorrelation
  summary_en: Autocorrelation measures the linear relationship between lagged values of a time series, just as correlation measures the linear relationship between two variables (Hyndman and Athanasopoulos 2021). The coefficient r_k relates y_t to y_{t−k}; plotted against the lag k, the coefficients form the autocorrelation function, which shows for example trend and seasonality.
  summary_de: Autokorrelation misst den linearen Zusammenhang zwischen zeitversetzten Werten einer Zeitreihe, so wie die Korrelation den linearen Zusammenhang zweier Variablen misst (Hyndman und Athanasopoulos 2021). Der Koeffizient r_k setzt y_t mit y_{t−k} in Beziehung; gegen die Verzögerung k aufgetragen, bilden die Koeffizienten die Autokorrelationsfunktion, die etwa Trend und Saisonalität sichtbar macht.
  sources:
  - https://otexts.com/fpp3/acf.html
- id: dickey-fuller-test
  type: Method
  name_en: Dickey-Fuller test
  name_de: Dickey-Fuller-Test
  summary_en: The Dickey-Fuller test is a unit root test (Dickey and Fuller 1979). For the autoregressive model Y_t = ρY_{t−1} + e_t, Dickey and Fuller derived the distribution of the regression estimator and of the t-statistic under ρ = 1, which gives a test of the hypothesis that the series has a unit root, i.e. is not stationary.
  summary_de: Der Dickey-Fuller-Test ist ein Einheitswurzeltest (Dickey und Fuller 1979). Für das autoregressive Modell Y_t = ρY_{t−1} + e_t leiteten Dickey und Fuller die Verteilung des Regressionsschätzers und der t-Statistik unter ρ = 1 her; das liefert einen Test der Hypothese, dass die Reihe eine Einheitswurzel hat, also nicht stationär ist.
  sources:
  - https://doi.org/10.1080/01621459.1979.10482531
- id: unigram-language-model-tokenisation
  type: Method
  name_en: Unigram language model (tokenisation)
  name_de: Unigram-Sprachmodell (Tokenisierung)
  aliases:
  - Unigram language model (tokenization)
  summary_en: The unigram language model tokenisation algorithm segments text into subwords based on a unigram language model and was proposed to sample subword segmentations for subword regularisation (Kudo, 2018). Because several segmentations are possible with the same vocabulary, it can produce probabilistic alternatives instead of one fixed segmentation.
  summary_de: Die Unigram-Language-Model-Tokenisierung zerlegt Text auf Grundlage eines Unigramm-Sprachmodells in Subwörter und wurde vorgeschlagen, um Segmentierungen für Subword Regularization zu ziehen (Kudo, 2018). Da mit demselben Vokabular mehrere Segmentierungen möglich sind, kann sie statt einer festen Zerlegung wahrscheinlichkeitsgewichtete Alternativen liefern.
  sources:
  - https://arxiv.org/abs/1804.10959
- id: subword-regularisation
  type: Method
  name_en: Subword regularisation
  name_de: Subword-Regularisierung
  aliases:
  - Subword regularization
  summary_en: Subword regularisation trains neural machine translation models on multiple subword segmentations of the same sentence, sampled probabilistically during training, using segmentation ambiguity as noise to improve robustness (Kudo, 2018). It gave consistent improvements, especially in low-resource and out-of-domain settings.
  summary_de: Subword Regularization trainiert neuronale Übersetzungsmodelle auf mehreren, während des Trainings zufällig gezogenen Subwort-Segmentierungen desselben Satzes und nutzt die Mehrdeutigkeit der Segmentierung als Rauschen, um die Robustheit zu erhöhen (Kudo, 2018). Es brachte durchgängige Verbesserungen, besonders bei wenigen Ressourcen und außerhalb der Trainingsdomäne.
  sources:
  - https://arxiv.org/abs/1804.10959
- id: sentencepiece
  type: Technology
  name_en: SentencePiece
  name_de: SentencePiece
  summary_en: SentencePiece is an unsupervised text tokeniser and detokeniser for neural text generation with a vocabulary size fixed before training (Kudo and Richardson 2018). It implements byte-pair encoding and the unigram language model, trains directly on raw sentences and treats input as a raw sequence of Unicode characters, so no language-specific pre- or post-processing is needed.
  summary_de: SentencePiece ist ein unüberwachter Tokenizer und Detokenizer für neuronale Textgenerierung mit vor dem Training festgelegter Vokabulargröße (Kudo und Richardson 2018). Er implementiert Byte-Pair-Encoding und das Unigram-Sprachmodell, trainiert direkt auf Rohsätzen und behandelt die Eingabe als Folge von Unicode-Zeichen, sodass keine sprachspezifische Vor- oder Nachverarbeitung nötig ist.
  sources:
  - https://github.com/google/sentencepiece
  - https://arxiv.org/abs/1808.06226
- id: gnmt
  type: Technology
  name_en: Google neural machine translation (GNMT)
  name_de: Google Neural Machine Translation (GNMT)
  aliases:
  - GNMT
  summary_en: Google's Neural Machine Translation system (GNMT) is a deep LSTM network with eight encoder and eight decoder layers, attention and residual connections (Wu et al. 2016). To handle rare words it splits words into a limited set of common sub-word units called wordpieces; in human side-by-side evaluation it reduced translation errors by an average of 60% compared with Google's phrase-based production system.
  summary_de: Googles Neural Machine Translation System (GNMT) ist ein tiefes LSTM-Netz mit acht Encoder- und acht Decoder-Schichten, Attention und Residualverbindungen (Wu et al. 2016). Für seltene Wörter zerlegt es Wörter in eine begrenzte Menge häufiger Teilworteinheiten, sogenannte Wordpieces; in einer menschlichen Gegenüberstellung verringerte es die Übersetzungsfehler im Mittel um 60 % gegenüber Googles phrasenbasiertem Produktivsystem.
  sources:
  - https://arxiv.org/abs/1609.08144
- id: transh
  type: Method
  name_en: TransH
  name_de: TransH
- id: transr
  type: Method
  name_en: TransR
  name_de: TransR
- id: andrej-karpathy
  type: Person
  name_en: Andrej Karpathy
  name_de: Andrej Karpathy
  summary_en: Andrej Karpathy is an AI researcher and educator (karpathy.ai). He was a founding member of OpenAI (2015–2017), Director of AI at Tesla (2017–2022), where he led the computer vision team of Autopilot, and returned to OpenAI in 2023–2024; during his PhD at Stanford, advised by Fei-Fei Li, he designed and taught the deep learning course CS 231n. He coined the term vibe coding on 6 February 2025 (Willison 2025).
  summary_de: Andrej Karpathy ist KI-Forscher und Lehrender (karpathy.ai). Er war Gründungsmitglied von OpenAI (2015–2017), Director of AI bei Tesla (2017–2022), wo er das Computer-Vision-Team von Autopilot leitete, und 2023–2024 erneut bei OpenAI; während seiner Promotion in Stanford bei Fei-Fei Li konzipierte und leitete er den Deep-Learning-Kurs CS 231n. Den Begriff Vibe Coding prägte er am 6. Februar 2025 (Willison 2025).
  sources:
  - https://karpathy.ai/
  - https://simonwillison.net/2025/Mar/19/vibe-coding/
- id: comprehension-debt
  type: Concept
  name_en: Comprehension debt
  name_de: Comprehension Debt
- id: stereoset
  type: Dataset
  name_en: StereoSet
  name_de: StereoSet
  summary_en: StereoSet is a large-scale natural English dataset for measuring stereotypical bias in pretrained language models across four domains, gender, profession, race and religion (Nadeem et al., 2020). Its authors found strong stereotypical biases in BERT, GPT-2, RoBERTa and XLNet and run a leaderboard with a hidden test set.
  summary_de: StereoSet ist ein großer, natürlicher englischer Datensatz, der stereotype Verzerrungen vortrainierter Sprachmodelle in vier Bereichen misst, Geschlecht, Beruf, Herkunft und Religion (Nadeem et al., 2020). Die Autoren fanden starke stereotype Verzerrungen in BERT, GPT-2, RoBERTa und XLNet und betreiben eine Rangliste mit verborgener Testmenge.
  sources:
  - https://arxiv.org/abs/2004.09456
- id: bbq
  type: Dataset
  name_en: Bias Benchmark for QA (BBQ)
  name_de: Bias Benchmark for QA (BBQ)
  summary_en: The Bias Benchmark for QA (BBQ) consists of hand-built question sets that target attested social biases against protected groups along nine social dimensions relevant for U.S. English-speaking contexts (Parrish et al., 2021). With under-informative contexts, models often relied on stereotypes, and even with informative contexts their accuracy was up to 3.4 percentage points higher when the correct answer matched a social bias.
  summary_de: Der Bias Benchmark for QA (BBQ) besteht aus von Hand erstellten Fragensätzen zu belegten sozialen Vorurteilen gegenüber geschützten Gruppen entlang neun sozialer Dimensionen im US-englischsprachigen Kontext (Parrish et al., 2021). Bei wenig informativem Kontext stützten sich Modelle oft auf Stereotype, und selbst bei informativem Kontext lag ihre Accuracy bis zu 3,4 Prozentpunkte höher, wenn die richtige Antwort einem Vorurteil entsprach.
  sources:
  - https://arxiv.org/abs/2110.08193
- id: taz2024full
  type: Dataset
  name_en: taz2024full
  name_de: taz2024full
- id: cuad
  type: Dataset
  name_en: CUAD
  name_de: CUAD
  aliases:
  - Contract Understanding Atticus Dataset
  summary_en: The Contract Understanding Atticus Dataset (CUAD) is a dataset for legal contract review created with dozens of legal experts from The Atticus Project, with over 13,000 annotations (Hendrycks et al., 2021). The task is to highlight the parts of a contract that a human reviewer should look at; Transformer models showed nascent performance that depended strongly on model design and training set size.
  summary_de: Der Contract Understanding Atticus Dataset (CUAD) ist ein Datensatz für die Vertragsprüfung, erstellt mit Dutzenden Fachleuten des Atticus Project, mit über 13 000 Annotationen (Hendrycks et al., 2021). Aufgabe ist, die Stellen eines Vertrags zu markieren, die eine prüfende Person ansehen sollte; Transformer-Modelle zeigten erste Erfolge, die stark von Modellaufbau und Größe der Trainingsdaten abhingen.
  sources:
  - https://arxiv.org/abs/2103.06268
- id: contractnli
  type: Dataset
  name_en: ContractNLI
  name_de: ContractNLI
  summary_en: ContractNLI frames contract review as document-level natural language inference; for each hypothesis, such as that some obligations survive termination, a system decides whether the contract entails it, contradicts it or does not mention it and marks the evidence spans (Koreeda & Manning, 2021). It contains 607 annotated contracts, and negations by exceptions make the task hard.
  summary_de: ContractNLI fasst die Vertragsprüfung als Natural Language Inference auf Dokumentebene; für jede Hypothese, etwa dass bestimmte Pflichten eine Kündigung überdauern, entscheidet ein System, ob der Vertrag sie stützt, ihr widerspricht oder sie nicht erwähnt, und markiert die Belegstellen (Koreeda & Manning, 2021). Er umfasst 607 annotierte Verträge, und Negationen durch Ausnahmen machen die Aufgabe schwierig.
  sources:
  - https://arxiv.org/abs/2110.01799
- id: mteb
  type: Dataset
  name_en: Massive Text Embedding Benchmark (MTEB)
  name_de: Massive Text Embedding Benchmark (MTEB)
  summary_en: The Massive Text Embedding Benchmark (MTEB) evaluates text embeddings on 8 task types, among them clustering and reranking, with 58 datasets in 112 languages (Muennighoff et al., 2022). Benchmarking 33 models, its authors found that no embedding method dominates across all tasks; MTEB has open-source code and a public leaderboard.
  summary_de: Der Massive Text Embedding Benchmark (MTEB) bewertet Text-Embeddings in 8 Aufgabentypen, darunter Clustering und Reranking, mit 58 Datensätzen in 112 Sprachen (Muennighoff et al., 2022). Beim Vergleich von 33 Modellen dominierte keine Embedding-Methode über alle Aufgaben; MTEB bietet offenen Code und eine öffentliche Rangliste.
  sources:
  - https://arxiv.org/abs/2210.07316
- id: conll-2003
  type: Dataset
  name_en: CoNLL-2003
  name_de: CoNLL-2003
  summary_en: CoNLL-2003 is the shared task and dataset on language-independent named entity recognition at the Conference on Computational Natural Language Learning 2003, with English and German data (Tjong Kim Sang and De Meulder 2003). It is one of the standard benchmarks for named entity recognition.
  summary_de: CoNLL-2003 ist die Shared Task samt Datensatz zur sprachunabhängigen Eigennamenerkennung der Conference on Computational Natural Language Learning 2003, mit englischen und deutschen Daten (Tjong Kim Sang und De Meulder 2003). Sie ist einer der Standard-Benchmarks für die Eigennamenerkennung.
  sources:
  - https://aclanthology.org/W03-0419/
- id: dbpedia
  type: Dataset
  name_en: DBpedia
  name_de: DBpedia
- id: yago
  type: Dataset
  name_en: YAGO
  name_de: YAGO
- id: freebase
  type: Dataset
  name_en: Freebase
  name_de: Freebase
- id: lexglue
  type: Dataset
  name_en: LexGLUE
  name_de: LexGLUE
  summary_en: The Legal General Language Understanding Evaluation (LexGLUE) benchmark collects datasets for evaluating models on diverse English legal NLU tasks in a standardised way (Chalkidis et al., 2021). In its evaluation, legal-oriented models consistently outperformed generic ones across multiple tasks.
  summary_de: Der Benchmark Legal General Language Understanding Evaluation (LexGLUE) bündelt Datensätze, um Modelle einheitlich auf verschiedenen Aufgaben des Verstehens englischer Rechtssprache zu bewerten (Chalkidis et al., 2021). In seiner Evaluation übertrafen auf Recht ausgerichtete Modelle generische Modelle durchgängig über mehrere Aufgaben.
  sources:
  - https://arxiv.org/abs/2110.00976
- id: legalbench
  type: Dataset
  name_en: LegalBench
  name_de: LegalBench
  summary_en: LegalBench is a collaboratively built benchmark of 162 tasks covering six types of legal reasoning, designed and hand-crafted by legal professionals (Guha et al., 2023). Its authors map the tasks to legal frameworks for describing legal reasoning and evaluated 20 open-source and commercial LLMs.
  summary_de: LegalBench ist ein gemeinschaftlich erstellter Benchmark aus 162 Aufgaben zu sechs Arten juristischen Schlussfolgerns, von Fachleuten aus dem Recht entworfen (Guha et al., 2023). Die Autoren ordnen die Aufgaben juristischen Modellen des Schlussfolgerns zu und evaluierten 20 offene und kommerzielle LLMs.
  sources:
  - https://arxiv.org/abs/2308.11462
- id: mmlu
  type: Dataset
  name_en: MMLU
  name_de: MMLU
  aliases:
  - Massive Multitask Language Understanding
  summary_en: MMLU (Measuring Massive Multitask Language Understanding) tests a text model's multitask accuracy on 57 tasks, including elementary mathematics, US history, computer science and law (Hendrycks et al., 2020). When it was introduced, most models were near chance, the largest GPT-3 model improved on chance by almost 20 percentage points, and models were near random on subjects such as morality and law.
  summary_de: MMLU (Measuring Massive Multitask Language Understanding) prüft die Multitask-Accuracy eines Textmodells in 57 Aufgaben, darunter Elementarmathematik, US-Geschichte, Informatik und Recht (Hendrycks et al., 2020). Bei der Einführung lagen die meisten Modelle nahe am Zufall, das größte GPT-3-Modell um fast 20 Prozentpunkte darüber, und bei Themen wie Moral und Recht blieben Modelle nahe am Zufall.
  sources:
  - https://arxiv.org/abs/2009.03300
- id: truthfulqa
  type: Dataset
  name_en: TruthfulQA
  name_de: TruthfulQA
  summary_en: TruthfulQA measures whether a language model answers truthfully, with 817 questions in 38 categories such as health, law, finance and politics that some humans would answer falsely because of misconceptions (Lin et al., 2021). The best model tested was truthful on 58% of questions against 94% for humans, and the largest models were generally the least truthful.
  summary_de: TruthfulQA misst, ob ein Sprachmodell wahrheitsgemäß antwortet, mit 817 Fragen in 38 Kategorien wie Gesundheit, Recht, Finanzen und Politik, die manche Menschen wegen verbreiteter Irrtümer falsch beantworten würden (Lin et al., 2021). Das beste getestete Modell war bei 58 % der Fragen wahrheitsgemäß, Menschen bei 94 %, und die größten Modelle waren im Allgemeinen am wenigsten wahrheitsgemäß.
  sources:
  - https://arxiv.org/abs/2109.07958
- id: mt-bench
  type: Dataset
  name_en: MT-bench
  name_de: MT-bench
  summary_en: MT-bench is a set of multi-turn questions for evaluating chat assistants, introduced together with the crowdsourced Chatbot Arena to check how well LLM judges agree with human preferences (Zheng et al., 2023). Strong judges such as GPT-4 reached over 80% agreement with human preferences, the same level as agreement between humans.
  summary_de: MT-bench ist eine Sammlung mehrstufiger Fragen zur Bewertung von Chat-Assistenten, vorgestellt zusammen mit der per Crowdsourcing betriebenen Chatbot Arena, um zu prüfen, wie gut LLM-Judges mit menschlichen Präferenzen übereinstimmen (Zheng et al., 2023). Starke Judges wie GPT-4 erreichten über 80 % Übereinstimmung, so viel wie Menschen untereinander.
  sources:
  - https://arxiv.org/abs/2306.05685
- id: chatbot-arena
  type: Technology
  name_en: Chatbot Arena
  name_de: Chatbot Arena
  summary_en: Chatbot Arena is an open platform for evaluating LLMs by human preference (Chiang et al. 2024). Users enter any prompt, receive answers from two anonymous models and vote for the better one; the models' identities are revealed only after voting. Rankings are estimated with statistical methods such as the Bradley-Terry model, and the authors found the crowdsourced votes to agree well with expert ratings.
  summary_de: Chatbot Arena ist eine offene Plattform zur Bewertung von LLMs anhand menschlicher Präferenzen (Chiang et al. 2024). Nutzende geben einen beliebigen Prompt ein, erhalten Antworten von zwei anonymen Modellen und stimmen für die bessere; die Identität der Modelle wird erst nach der Abstimmung offengelegt. Rangfolgen werden mit statistischen Verfahren wie dem Bradley-Terry-Modell geschätzt, und die Crowd-Stimmen stimmten nach Angaben der Autoren gut mit Expertenurteilen überein.
  sources:
  - https://arxiv.org/abs/2403.04132
- id: squad
  type: Dataset
  name_en: SQuAD
  name_de: SQuAD
  aliases:
  - Stanford Question Answering Dataset
  summary_en: The Stanford Question Answering Dataset (SQuAD) is a reading comprehension dataset of more than 100,000 questions posed by crowdworkers on Wikipedia articles, where each answer is a segment of the corresponding passage (Rajpurkar et al., 2016). Its logistic regression baseline reached an F1 score of 51.0% against human performance of 86.8%.
  summary_de: Der Stanford Question Answering Dataset (SQuAD) ist ein Datensatz zum Leseverständnis mit über 100 000 Fragen, die Crowdworker zu Wikipedia-Artikeln stellten; jede Antwort ist ein Abschnitt der zugehörigen Textpassage (Rajpurkar et al., 2016). Die Baseline mit logistischer Regression erreichte einen F1-Wert von 51,0 %, Menschen 86,8 %.
  sources:
  - https://arxiv.org/abs/1606.05250
- id: alce
  type: Dataset
  name_en: ALCE
  name_de: ALCE
  summary_en: ALCE is a benchmark for Automatic LLMs' Citation Evaluation, in which systems retrieve supporting evidence and generate answers with citations; it measures fluency, correctness and citation quality with automatic metrics that correlate strongly with human judgements (Gao et al., 2023). On the ELI5 dataset, even the best models lacked complete citation support half of the time.
  summary_de: ALCE ist ein Benchmark für die automatische Bewertung von Zitaten in LLM-Antworten, bei dem Systeme Belege abrufen und Antworten mit Quellenangaben erzeugen; er misst Flüssigkeit, Korrektheit und Zitierqualität mit automatischen Metriken, die stark mit menschlichen Urteilen korrelieren (Gao et al., 2023). Auf dem Datensatz ELI5 fehlte selbst den besten Modellen in der Hälfte der Fälle eine vollständige Belegung durch Zitate.
  sources:
  - https://arxiv.org/abs/2305.14627
- id: humaneval
  type: Dataset
  name_en: HumanEval
  name_de: HumanEval
  summary_en: HumanEval is an evaluation set released with Codex to measure the functional correctness of programs synthesised from docstrings (Chen et al., 2021). Codex solved 28.8% of its problems against 0% for GPT-3, and 70.2% when 100 samples were drawn per problem.
  summary_de: HumanEval ist ein Evaluationsdatensatz, der mit Codex veröffentlicht wurde, um die funktionale Korrektheit von Programmen zu messen, die aus Docstrings erzeugt werden (Chen et al., 2021). Codex löste 28,8 % der Aufgaben, GPT-3 0 %, und mit 100 Stichproben je Aufgabe 70,2 %.
  sources:
  - https://arxiv.org/abs/2107.03374
- id: agentbench
  type: Dataset
  name_en: AgentBench
  name_de: AgentBench
  summary_en: AgentBench evaluates LLMs as agents in 8 distinct interactive environments that test reasoning and decision-making (Liu et al., 2023). It found a significant gap between top commercial LLMs and many open-source models up to 70B parameters, with poor long-term reasoning, decision-making and instruction following as the main obstacles.
  summary_de: AgentBench bewertet LLMs als Agenten in 8 verschiedenen interaktiven Umgebungen, die Schlussfolgern und Entscheiden prüfen (Liu et al., 2023). Er zeigte eine deutliche Lücke zwischen führenden kommerziellen LLMs und vielen offenen Modellen bis 70 Milliarden Parametern; Hauptprobleme waren schwaches langfristiges Schlussfolgern, Entscheiden und Befolgen von Anweisungen.
  sources:
  - https://arxiv.org/abs/2308.03688
- id: swe-bench
  type: Dataset
  name_en: SWE-bench
  name_de: SWE-bench
  summary_en: SWE-bench is an evaluation framework of 2,294 software engineering problems drawn from real GitHub issues and pull requests across 12 popular Python repositories; a model must edit the codebase to resolve the issue (Jimenez et al., 2023). At its release, the best model, Claude 2, resolved only 1.96% of the issues.
  summary_de: SWE-bench ist ein Evaluationsrahmen aus 2 294 Softwareentwicklungsaufgaben aus echten GitHub-Issues und Pull Requests von 12 verbreiteten Python-Repositories; ein Modell muss die Codebasis so ändern, dass das Issue gelöst ist (Jimenez et al., 2023). Bei der Veröffentlichung löste das beste Modell, Claude 2, nur 1,96 % der Issues.
  sources:
  - https://arxiv.org/abs/2310.06770
- id: houyi
  type: Method
  name_en: HouYi
  name_de: HouYi
  summary_en: HouYi is a black-box prompt injection attack technique for LLM-integrated applications, inspired by web injection attacks, with three parts, a pre-constructed prompt, an injection prompt that induces context partition and a malicious payload (Liu et al., 2023). Deployed on 36 real applications, it found 31 susceptible, with outcomes such as unrestricted LLM use and theft of application prompts; ten vendors confirmed the findings.
  summary_de: 'HouYi ist eine Black-Box-Technik für Prompt-Injection-Angriffe auf LLM-integrierte Anwendungen nach dem Vorbild von Injection-Angriffen im Web, mit drei Teilen: einem vorbereiteten Prompt, einem Injection-Prompt, der eine Kontexttrennung herbeiführt, und einer schädlichen Nutzlast (Liu et al., 2023). Bei 36 echten Anwendungen waren 31 anfällig, mit Folgen wie uneingeschränkter LLM-Nutzung und Diebstahl von Anwendungs-Prompts; zehn Anbieter bestätigten die Befunde.'
  sources:
  - https://arxiv.org/abs/2306.05499
- id: injecagent
  type: Dataset
  name_en: InjecAgent
  name_de: InjecAgent
  summary_en: InjecAgent is a benchmark for indirect prompt injection attacks on tool-integrated LLM agents, with 1,054 test cases covering 17 user tools and 62 attacker tools and two attack intentions, direct harm to users and exfiltration of private data (Zhan et al., 2024). Of 30 agents evaluated, ReAct-prompted GPT-4 was vulnerable 24% of the time, and reinforcing attacks with a hacking prompt nearly doubled the success rate.
  summary_de: InjecAgent ist ein Benchmark für indirekte Prompt-Injection-Angriffe auf LLM-Agenten mit Werkzeugen, mit 1 054 Testfällen zu 17 Nutzer- und 62 Angreiferwerkzeugen und zwei Angriffszielen, direktem Schaden für Nutzende und Abfluss privater Daten (Zhan et al., 2024). Von 30 getesteten Agenten war GPT-4 mit ReAct-Prompting in 24 % der Fälle angreifbar, und ein zusätzlicher Hacking-Prompt verdoppelte die Erfolgsrate fast.
  sources:
  - https://arxiv.org/abs/2403.02691
- id: ltbd
  type: Method
  name_en: Learnable Trust-Boundary Delimiters (LTBD)
  name_de: Learnable Trust-Boundary Delimiters (LTBD)
  summary_en: Learnable Trust-Boundary Delimiters (LTBD) defend against prompt injection by inserting a small number of learnable delimiters that mark trusted user instructions apart from untrusted external data, without changing the LLM's parameters (Zhao et al., 2026). LTBD outperformed inference-time defences, competed with training-based ones, kept benign-task utility and reached 0.00% attack success on AlpacaFarm.
  summary_de: Learnable Trust-Boundary Delimiters (LTBD) wehren Prompt Injection ab, indem wenige lernbare Trennzeichen vertrauenswürdige Anweisungen der Nutzenden von nicht vertrauenswürdigen externen Daten abgrenzen, ohne die Parameter des LLM zu verändern (Zhao et al., 2026). LTBD übertraf Abwehrmaßnahmen zur Inferenzzeit, hielt mit trainingsbasierten mit, erhielt die Nützlichkeit bei harmlosen Aufgaben und erreichte 0,00 % Angriffserfolg auf AlpacaFarm.
  sources:
  - https://arxiv.org/abs/2610.11634
- id: raised
  type: Method
  name_en: RAISED
  name_de: RAISED
  summary_en: 'RAISED (Robust Attack Invariance through Self-Distillation) trains tool-using LLM agents against indirect prompt injection: the model generates its own tool-use scenarios and is then trained to match its clean-context behaviour on both clean and injected versions of the same trajectory (Dhouib et al., 2026). It substantially reduced attack success while, unlike earlier training-based defences, preserving utility on agentic and general benchmarks.'
  summary_de: 'RAISED (Robust Attack Invariance through Self-Distillation) trainiert LLM-Agenten mit Werkzeugen gegen indirekte Prompt Injection: Das Modell erzeugt eigene Szenarien mit Werkzeugnutzung und wird dann darauf trainiert, sich bei sauberen und manipulierten Varianten desselben Ablaufs so zu verhalten wie im sauberen Kontext (Dhouib et al., 2026). Es senkte den Angriffserfolg deutlich und erhielt, anders als frühere trainingsbasierte Abwehr, die Nützlichkeit auf Agenten- und allgemeinen Benchmarks.'
  sources:
  - https://arxiv.org/abs/2610.06401
- id: apex-execution-boundary
  type: Method
  name_en: APEX
  name_de: APEX
  summary_en: APEX defends LLM agents against indirect prompt injection at the execution boundary, where an agent turns internal state into an external action or output, instead of trying to recognise attack patterns (Zheng et al., 2026). An authorisation contract compiled from the trusted task before untrusted execution admits only justified effects and exposes unendorsed use through deception; APEX reached 0% attack success on five of six benchmarks.
  summary_de: APEX schützt LLM-Agenten gegen indirekte Prompt Injection an der Ausführungsgrenze, an der ein Agent internen Zustand in eine externe Aktion oder Ausgabe umsetzt, statt Angriffsmuster erkennen zu wollen (Zheng et al., 2026). Ein vor der Ausführung aus der vertrauenswürdigen Aufgabe kompilierter Berechtigungsvertrag lässt nur begründete Wirkungen zu und macht nicht gedeckte Nutzung durch Täuschung sichtbar; APEX erreichte bei fünf von sechs Benchmarks 0 % Angriffserfolg.
  sources:
  - https://arxiv.org/abs/2610.06966
- id: rag-pibench
  type: Dataset
  name_en: RAG-PIBench
  name_de: RAG-PIBench
  summary_en: RAG-PIBench is a benchmark for detecting prompt injections embedded in retrieved content in RAG systems, with 4,876 contextual examples in frozen train, validation and protected test splits built by a leakage-aware pipeline (Jaffal et al., 2026). DistilBERT performed best on the protected test set (F1 0.896), while TF-IDF with SVM or logistic regression remained competitive.
  summary_de: RAG-PIBench ist ein Benchmark zur Erkennung von Prompt Injections in abgerufenen Inhalten von RAG-Systemen, mit 4 876 kontextbezogenen Beispielen in festen Trainings-, Validierungs- und geschützten Testmengen, erstellt mit einem Verfahren gegen Datenlecks (Jaffal et al., 2026). DistilBERT schnitt auf der geschützten Testmenge am besten ab (F1 0,896), TF-IDF mit SVM oder logistischer Regression blieb konkurrenzfähig.
  sources:
  - https://arxiv.org/abs/2610.08571
- id: pruning
  type: Method
  name_en: Pruning
  name_de: Pruning
  summary_en: Pruning removes parameters from a trained neural network; it can reduce parameter counts by over 90% while keeping accuracy and lowering storage and inference cost (Frankle & Carbin, 2018). Frankle and Carbin found that standard pruning uncovers sparse "winning ticket" subnetworks that, trained from their original initialisation, reach comparable accuracy, the lottery ticket hypothesis.
  summary_de: Pruning entfernt Parameter aus einem trainierten neuronalen Netz; es kann die Zahl der Parameter um über 90 % verringern, ohne Genauigkeit einzubüßen, und senkt Speicher- und Inferenzkosten (Frankle & Carbin, 2018). Frankle und Carbin fanden, dass übliches Pruning dünn besetzte „Gewinnlos“-Teilnetze freilegt, die von ihrer ursprünglichen Initialisierung aus trainiert eine vergleichbare Genauigkeit erreichen, die Lottery-Ticket-Hypothese.
  sources:
  - https://arxiv.org/abs/1803.03635
- id: low-rank-factorisation
  type: Method
  name_en: Low-rank factorisation
  name_de: Low-Rank-Faktorisierung
  summary_en: Low-rank factorisation is one of four main categories of techniques for compressing and accelerating deep neural networks, alongside parameter pruning and quantisation, transferred or compact convolutional filters, and knowledge distillation (Cheng et al., 2017).
  summary_de: Low-Rank-Faktorisierung ist eine von vier Hauptgruppen von Verfahren zur Kompression und Beschleunigung tiefer neuronaler Netze, neben Pruning und Quantisierung von Parametern, übertragenen oder kompakten Faltungsfiltern und Knowledge Distillation (Cheng et al., 2017).
  sources:
  - https://arxiv.org/abs/1710.09282
- id: selfcheckgpt
  type: Method
  name_en: SelfCheckGPT
  name_de: SelfCheckGPT
  summary_en: 'SelfCheckGPT is a sampling-based method for detecting hallucinations of black-box LLMs without an external database: if a model knows a fact, sampled responses tend to be consistent, whereas hallucinated facts diverge and contradict each other (Manakul et al., 2023). On GPT-3 passages about people from WikiBio it detected non-factual sentences and ranked passages by factuality better than grey-box baselines.'
  summary_de: 'SelfCheckGPT erkennt Halluzinationen von Black-Box-LLMs über Stichproben und ohne externe Datenbank: Kennt ein Modell einen Fakt, stimmen mehrere gezogene Antworten meist überein, während halluzinierte Fakten auseinanderlaufen und sich widersprechen (Manakul et al., 2023). Bei GPT-3-Texten über Personen aus WikiBio erkannte es nicht faktentreue Sätze und ordnete Texte nach Faktentreue besser als Grey-Box-Verfahren.'
  sources:
  - https://arxiv.org/abs/2303.08896
- id: hades
  type: Dataset
  name_en: HaDes
  name_de: HaDes
  summary_en: HaDes (HAllucination DEtection dataSet) supports token-level, reference-free hallucination detection for free-form text generation (Liu et al., 2021). It was built by perturbing text segments from English Wikipedia and verifying them with crowd-sourced annotations, using an iterative model-in-the-loop strategy against label imbalance.
  summary_de: HaDes (HAllucination DEtection dataSet) dient der Erkennung von Halluzinationen auf Token-Ebene ohne Referenztext bei freier Textgenerierung (Liu et al., 2021). Er entstand, indem Textabschnitte aus der englischen Wikipedia verändert und per Crowdsourcing geprüft wurden, mit einem iterativen Model-in-the-Loop-Verfahren gegen unausgewogene Labels.
  sources:
  - https://arxiv.org/abs/2104.08704
- id: reld
  type: Method
  name_en: RelD
  name_de: RelD
  summary_en: RelD is a discriminator for detecting hallucinations in answers generated by large language models (Chen et al. 2023). It is trained on RelQA, a bilingual question-answering dialogue dataset with LLM-generated answers, and detected hallucinations in answers from different LLMs on in-distribution and out-of-distribution data.
  summary_de: RelD ist ein Diskriminator, der Halluzinationen in Antworten großer Sprachmodelle erkennt (Chen et al. 2023). Er wird auf RelQA trainiert, einem zweisprachigen Question-Answering-Dialogdatensatz mit von LLMs erzeugten Antworten, und erkannte Halluzinationen in Antworten verschiedener LLMs auf Daten innerhalb und außerhalb der Trainingsverteilung.
  sources:
  - https://arxiv.org/abs/2407.04121
- id: grounding-probe
  type: Method
  name_en: Grounding Probe
  name_de: Grounding Probe
  summary_en: The Grounding Probe detects ungrounded RAG responses with logistic regression over mean-pooled middle-layer hidden states of an observer language model that reads context, question and response in one forward pass, independent of the generating model (Rathmayr et al., 2026). Trained on 15,090 annotated responses it reached 0.879 to 0.894 AUROC on RAGTruth and held across six generators.
  summary_de: Die Grounding Probe erkennt nicht belegte RAG-Antworten mit logistischer Regression über gemittelte verborgene Zustände einer mittleren Schicht eines Beobachter-Sprachmodells, das Kontext, Frage und Antwort in einem Durchlauf liest, unabhängig vom erzeugenden Modell (Rathmayr et al., 2026). Auf 15 090 annotierten Antworten trainiert, erreichte sie 0,879 bis 0,894 AUROC auf RAGTruth und blieb über sechs Generatoren stabil.
  sources:
  - https://arxiv.org/abs/2610.04642
- id: parcel
  type: Dataset
  name_en: PARCEL
  name_de: PARCEL
  summary_en: PARCEL is a benchmark for checking whether legal claims are supported by the cited authority (Demir and Canbaz 2026). It contains 3,396 claims about recent decisions of the New York State Court of Appeals labelled as Supported, Refuted or Not Found and treats the task as three-way natural language inference; the best LLMs reached up to 0.97 accuracy zero-shot but still marked unsupported claims as supported.
  summary_de: PARCEL ist ein Benchmark, der prüft, ob juristische Aussagen von der zitierten Quelle gestützt werden (Demir und Canbaz 2026). Er enthält 3.396 Aussagen über neuere Entscheidungen des New York State Court of Appeals mit den Labels Supported, Refuted oder Not Found und behandelt die Aufgabe als dreistufige Natural Language Inference; die besten LLMs erreichten zero-shot bis zu 0,97 Accuracy, markierten aber weiterhin nicht gestützte Aussagen als gestützt.
  sources:
  - https://arxiv.org/abs/2610.10971
- id: next-sentence-prediction
  type: Method
  name_en: Next sentence prediction (NSP)
  name_de: Next Sentence Prediction (NSP)
  summary_en: 'Next sentence prediction (NSP) is the second pre-training task of BERT, besides masked language modelling: for each pair of sentences A and B, B is the actual next sentence in 50% of cases and a random sentence otherwise, and the model predicts which (Devlin et al., 2018). It was added because tasks such as question answering and natural language inference depend on relationships between sentences, and the authors found it very beneficial for both.'
  summary_de: 'Next Sentence Prediction (NSP) ist neben Masked Language Modelling die zweite Vortrainingsaufgabe von BERT: Für jedes Satzpaar A und B ist B in 50 % der Fälle der tatsächliche Folgesatz und sonst ein zufälliger Satz, und das Modell sagt vorher, welcher Fall vorliegt (Devlin et al., 2018). Sie wurde ergänzt, weil Aufgaben wie Fragebeantwortung und Natural Language Inference von Beziehungen zwischen Sätzen abhängen, und erwies sich nach Angaben der Autoren für beide als sehr nützlich.'
  sources:
  - https://arxiv.org/abs/1810.04805
- id: bm25f
  type: Method
  name_en: BM25F
  name_de: BM25F
  summary_en: BM25F extends BM25 to documents with several fields, such as title, body and anchor text, which are weighted separately; the weighted frequencies of a term are summed across fields before the saturation function is applied (Robertson and Zaragoza 2009).
  summary_de: BM25F erweitert BM25 auf Dokumente mit mehreren Feldern wie Titel, Text und Ankertext, die getrennt gewichtet werden; die gewichteten Häufigkeiten eines Terms werden über die Felder summiert, bevor die Sättigungsfunktion angewandt wird (Robertson und Zaragoza 2009).
  sources:
  - https://doi.org/10.1561/1500000019
- id: poly-encoder
  type: Method
  name_en: Poly-encoder
  name_de: Poly-Encoder
  summary_en: The Poly-encoder is a Transformer architecture for scoring pairs of sequences that learns global rather than token-level self-attention features, placed between bi-encoders, which encode both sides separately, and cross-encoders, which attend over the full pair (Humeau et al., 2019). It was faster than cross-encoders and more accurate than bi-encoders, with best results after pre-training on data similar to the downstream task.
  summary_de: Der Poly-Encoder ist eine Transformer-Architektur zum Bewerten von Sequenzpaaren, die globale statt tokenweise Self-Attention-Merkmale lernt; er liegt zwischen Bi-Encodern, die beide Seiten getrennt kodieren, und Cross-Encodern, die über das ganze Paar Aufmerksamkeit berechnen (Humeau et al., 2019). Er war schneller als Cross-Encoder und genauer als Bi-Encoder, am besten nach Vortraining auf Daten ähnlich der Zielaufgabe.
  sources:
  - https://arxiv.org/abs/1905.01969
- id: nested-cross-validation
  type: Method
  name_en: Nested cross-validation
  name_de: Verschachtelte Kreuzvalidierung
  summary_en: 'Nested cross-validation adds a second loop when hyperparameters are tuned by cross-validation: an inner cross-validation tunes the hyperparameters and an outer one estimates the error of the whole procedure, tuning included (Varma and Simon 2006). Using the same cross-validation for tuning and for reporting the error biases the estimate; all model-building steps must be repeated inside each outer fold.'
  summary_de: 'Verschachtelte Kreuzvalidierung fügt eine zweite Schleife hinzu, wenn Hyperparameter per Kreuzvalidierung gewählt werden: Eine innere Kreuzvalidierung stimmt die Hyperparameter ab, eine äußere schätzt den Fehler des gesamten Verfahrens einschließlich der Abstimmung (Varma und Simon 2006). Wird dieselbe Kreuzvalidierung für Abstimmung und Fehlerangabe genutzt, ist die Schätzung verzerrt; alle Schritte der Modellbildung müssen in jeder äußeren Falte wiederholt werden.'
  sources:
  - https://doi.org/10.1186/1471-2105-7-91
- id: whisper
  type: Method
  name_en: Whisper
  name_de: Whisper
  summary_en: Whisper is a family of speech recognition models trained to predict transcripts on 680,000 hours of multilingual and multitask audio from the internet (Radford et al., 2022). The models generalise to standard benchmarks in a zero-shot setting without fine-tuning, are often competitive with fully supervised systems and approach human accuracy and robustness; models and inference code were released.
  summary_de: Whisper ist eine Familie von Spracherkennungsmodellen, die auf 680 000 Stunden mehrsprachigem und multitask-annotiertem Audio aus dem Internet darauf trainiert wurden, Transkripte vorherzusagen (Radford et al., 2022). Die Modelle generalisieren ohne Fine-Tuning auf Standard-Benchmarks, sind oft mit vollständig überwachten Systemen konkurrenzfähig und nähern sich menschlicher Genauigkeit und Robustheit; Modelle und Inferenzcode wurden veröffentlicht.
  sources:
  - https://arxiv.org/abs/2212.04356
- id: wav2vec-2-0
  type: Method
  name_en: wav2vec 2.0
  name_de: wav2vec 2.0
  summary_en: wav2vec 2.0 learns speech representations self-supervised from audio alone by masking the input in latent space and solving a contrastive task over jointly learned quantised representations, followed by fine-tuning on transcribed speech (Baevski et al., 2020). With ten minutes of labelled data and 53,000 hours of unlabelled pre-training data it still reached 4.8/8.2 word error rate on Librispeech clean/other.
  summary_de: wav2vec 2.0 lernt Sprachrepräsentationen selbstüberwacht allein aus Audio, indem es die Eingabe im latenten Raum maskiert und eine kontrastive Aufgabe über gemeinsam gelernte quantisierte Repräsentationen löst; danach folgt Fine-Tuning auf transkribierter Sprache (Baevski et al., 2020). Mit zehn Minuten annotierter Daten und 53 000 Stunden nicht annotierter Vortrainingsdaten erreichte es noch 4,8/8,2 Wortfehlerrate auf Librispeech clean/other.
  sources:
  - https://arxiv.org/abs/2006.11477
- id: connectionist-temporal-classification
  type: Method
  name_en: Connectionist Temporal Classification (CTC)
  name_de: Connectionist Temporal Classification (CTC)
  aliases:
  - CTC
- id: vall-e
  type: Method
  name_en: VALL-E
  name_de: VALL-E
  summary_en: VALL-E treats text-to-speech as conditional language modelling over discrete codes from a neural audio codec rather than as continuous signal regression, pre-trained on 60,000 hours of English speech (Wang et al., 2023). From a 3-second recording of an unseen speaker it synthesises personalised speech, preserving the speaker's emotion and acoustic environment, and outperformed the best zero-shot TTS system in naturalness and speaker similarity.
  summary_de: VALL-E behandelt Sprachsynthese als bedingte Sprachmodellierung über diskrete Codes eines neuronalen Audio-Codecs statt als Regression kontinuierlicher Signale und wurde auf 60 000 Stunden englischer Sprache vortrainiert (Wang et al., 2023). Aus einer 3-Sekunden-Aufnahme einer unbekannten Person erzeugt es personalisierte Sprache, erhält Emotion und akustische Umgebung und übertraf das beste Zero-Shot-TTS-System in Natürlichkeit und Sprecherähnlichkeit.
  sources:
  - https://arxiv.org/abs/2301.02111
- id: ssml
  type: Technology
  name_en: Speech Synthesis Markup Language (SSML)
  name_de: Speech Synthesis Markup Language (SSML)
  aliases:
  - SSML
  summary_en: The Speech Synthesis Markup Language (SSML) is an XML-based W3C markup language that supports the generation of synthetic speech in Web and other applications (W3C 2010). It gives authors a standard way to control aspects of speech such as pronunciation, volume, pitch and rate across different synthesis platforms; SSML 1.1 became a W3C Recommendation in September 2010.
  summary_de: Die Speech Synthesis Markup Language (SSML) ist eine XML-basierte Auszeichnungssprache des W3C, die die Erzeugung synthetischer Sprache in Web- und anderen Anwendungen unterstützt (W3C 2010). Sie bietet eine einheitliche Möglichkeit, Aspekte wie Aussprache, Lautstärke, Tonhöhe und Sprechgeschwindigkeit plattformübergreifend zu steuern; SSML 1.1 wurde im September 2010 W3C-Empfehlung.
  sources:
  - https://www.w3.org/TR/speech-synthesis11/
- id: silero-vad
  type: Technology
  name_en: Silero VAD
  name_de: Silero VAD
  summary_en: Silero VAD is a pre-trained voice activity detector, i.e. a model that detects which parts of an audio signal contain speech (Silero VAD repository). It runs on the CPU with PyTorch or ONNX Runtime.
  summary_de: Silero VAD ist ein vortrainierter Voice Activity Detector, also ein Modell, das erkennt, welche Abschnitte eines Audiosignals Sprache enthalten (Silero-VAD-Repository). Es läuft auf der CPU mit PyTorch oder ONNX Runtime.
  sources:
  - https://github.com/snakers4/silero-vad
- id: amazon-lex
  type: Technology
  name_en: Amazon Lex
  name_de: Amazon Lex
  summary_en: Amazon Lex is an AWS service for building conversational interfaces using voice and text (AWS documentation). It provides natural language understanding and automatic speech recognition; developers specify the basic conversation flow to create a chatbot without deep learning expertise.
  summary_de: Amazon Lex ist ein AWS-Dienst zum Bau sprach- und textbasierter Dialogschnittstellen (AWS-Dokumentation). Er stellt Sprachverstehen (NLU) und automatische Spracherkennung bereit; Entwickler legen den grundlegenden Gesprächsablauf fest und erstellen so einen Chatbot ohne Deep-Learning-Fachwissen.
  sources:
  - https://docs.aws.amazon.com/lexv2/latest/dg/what-is.html
- id: multiwoz
  type: Dataset
  name_en: MultiWOZ
  name_de: MultiWOZ
  summary_en: The Multi-Domain Wizard-of-Oz dataset (MultiWOZ) is a fully labelled collection of about 10,000 human-human written task-oriented conversations spanning several domains, annotated with dialogue belief states and dialogue acts (Budzianowski et al., 2018). It was collected entirely by crowdsourcing and provides baselines for belief tracking, dialogue act and response generation.
  summary_de: Der Multi-Domain Wizard-of-Oz-Datensatz (MultiWOZ) ist eine vollständig annotierte Sammlung von rund 10 000 schriftlichen, aufgabenorientierten Gesprächen zwischen Menschen über mehrere Domänen, mit Belief States und Dialogakten (Budzianowski et al., 2018). Er wurde vollständig per Crowdsourcing erhoben und liefert Baselines für Belief Tracking, Dialogakte und Antwortgenerierung.
  sources:
  - https://arxiv.org/abs/1810.00278
- id: neural-belief-tracker
  type: Method
  name_en: Neural Belief Tracker
  name_de: Neural Belief Tracker
  summary_en: The Neural Belief Tracker estimates the user's goal at every step of a dialogue by composing pre-trained word vectors into representations of user utterances and dialogue context (Mrkšić et al., 2016). It avoids the need for large annotated spoken language understanding data or hand-crafted lexicons and matched or outperformed models that rely on such lexicons.
  summary_de: Der Neural Belief Tracker schätzt in jedem Dialogschritt das Ziel der Nutzenden, indem er vortrainierte Wortvektoren zu Repräsentationen von Äußerungen und Dialogkontext zusammensetzt (Mrkšić et al., 2016). Er kommt ohne große annotierte Daten für Spoken Language Understanding und ohne handgefertigte Lexika aus und erreichte oder übertraf Modelle, die solche Lexika nutzen.
  sources:
  - https://arxiv.org/abs/1606.03777
- id: paradise-framework
  type: Method
  name_en: PARADISE (dialogue evaluation framework)
  name_de: PARADISE (Framework zur Dialogevaluation)
  summary_en: PARADISE (PARAdigm for DIalogue System Evaluation) is a general framework for evaluating spoken dialogue agents (Walker et al. 1997). It separates task requirements from an agent's dialogue behaviour, supports comparing dialogue strategies, computes performance for subdialogues and whole dialogues, determines how much various factors contribute to performance and normalises for task complexity, so that agents for different tasks can be compared.
  summary_de: PARADISE (PARAdigm for DIalogue System Evaluation) ist ein allgemeines Framework zur Evaluation gesprochener Dialogagenten (Walker et al. 1997). Es trennt die Aufgabenanforderungen vom Dialogverhalten eines Agenten, ermöglicht den Vergleich von Dialogstrategien, berechnet die Leistung für Teildialoge und ganze Dialoge, bestimmt den Beitrag verschiedener Faktoren zur Leistung und normalisiert nach Aufgabenkomplexität, sodass sich Agenten für unterschiedliche Aufgaben vergleichen lassen.
  sources:
  - https://arxiv.org/abs/cmp-lg/9704004
- id: apache-kafka
  type: Technology
  name_en: Apache Kafka
  name_de: Apache Kafka
  aliases:
  - Kafka
  summary_en: Apache Kafka is a distributed event streaming platform (Apache Kafka documentation). It lets applications publish and subscribe to streams of events, store them durably for as long as needed and process them as they occur or retrospectively, in a scalable, fault-tolerant way.
  summary_de: Apache Kafka ist eine verteilte Plattform für Event-Streaming (Apache-Kafka-Dokumentation). Anwendungen können damit Ereignisströme veröffentlichen und abonnieren, sie beliebig lange dauerhaft speichern und sie in Echtzeit oder nachträglich verarbeiten, skalierbar und fehlertolerant.
  sources:
  - https://kafka.apache.org/intro
- id: apache-airflow
  type: Technology
  name_en: Apache Airflow
  name_de: Apache Airflow
  aliases:
  - Airflow
  summary_en: Apache Airflow is an open-source platform for developing, scheduling and monitoring workflows such as batch data pipelines, model training and LLM-based workloads (Airflow documentation). Workflows are defined entirely in Python as directed acyclic graphs (DAGs), and a web interface helps visualise, manage and debug them.
  summary_de: Apache Airflow ist eine quelloffene Plattform zum Entwickeln, Planen und Überwachen von Workflows wie Batch-Datenpipelines, Modelltraining und LLM-basierten Abläufen (Airflow-Dokumentation). Workflows werden vollständig in Python als gerichtete azyklische Graphen (DAGs) definiert; eine Weboberfläche hilft beim Visualisieren, Verwalten und Debuggen.
  sources:
  - https://airflow.apache.org/docs/apache-airflow/stable/index.html
- id: dataflow-model
  type: Method
  name_en: Dataflow Model
  name_de: Dataflow-Modell
  summary_en: The Dataflow Model is Google's processing model for unbounded, unordered, large-scale datasets (Akidau et al. 2015). It assumes that one never knows whether all data has been seen, and offers principled abstractions, such as event-time windowing, that let practitioners choose trade-offs between correctness, latency and cost; it describes the processing model of Google Cloud Dataflow, based on FlumeJava and MillWheel.
  summary_de: Das Dataflow Model ist Googles Verarbeitungsmodell für unbegrenzte, ungeordnete, sehr große Datenbestände (Akidau et al. 2015). Es geht davon aus, dass nie sicher ist, ob alle Daten eingetroffen sind, und bietet grundlegende Abstraktionen wie Fenster nach Ereigniszeit, mit denen Praktiker Zielkonflikte zwischen Korrektheit, Latenz und Kosten abwägen; es beschreibt das Verarbeitungsmodell von Google Cloud Dataflow, das auf FlumeJava und MillWheel aufbaut.
  sources:
  - https://www.vldb.org/pvldb/vol8/p1792-Akidau.pdf
- id: oauth-2-0
  type: Technology
  name_en: OAuth 2.0
  name_de: OAuth 2.0
  aliases:
  - OAuth
  summary_en: OAuth 2.0 is an IETF authorisation framework that lets a third-party application obtain limited access to an HTTP service, either on behalf of a resource owner through an approval interaction or on its own behalf (RFC 6749, Hardt 2012). It defines four roles (resource owner, resource server, client and authorisation server) and uses access tokens, credentials that represent specific scopes and durations of access. It obsoletes OAuth 1.0 (RFC 5849).
  summary_de: OAuth 2.0 ist ein Autorisierungs-Framework der IETF, mit dem eine Drittanwendung begrenzten Zugriff auf einen HTTP-Dienst erhält, entweder im Auftrag eines Ressourceneigentümers über eine Zustimmungsinteraktion oder im eigenen Namen (RFC 6749, Hardt 2012). Es definiert vier Rollen (Ressourceneigentümer, Ressourcenserver, Client und Autorisierungsserver) und arbeitet mit Access Tokens, also Berechtigungsnachweisen für bestimmte Zugriffsbereiche und -dauern. Es löst OAuth 1.0 (RFC 5849) ab.
  sources:
  - https://www.rfc-editor.org/rfc/rfc6749
- id: json-web-token
  type: Technology
  name_en: JSON Web Token (JWT)
  name_de: JSON Web Token (JWT)
  aliases:
  - JWT
  summary_en: A JSON Web Token (JWT) is a compact, URL-safe way of representing claims transferred between two parties (RFC 7519, Jones et al. 2015). The claims are encoded as a JSON object that serves as the payload of a JSON Web Signature or the plaintext of a JSON Web Encryption, so they can be signed, protected with a message authentication code and/or encrypted. In the compact serialisation, base64url-encoded parts are joined with periods.
  summary_de: Ein JSON Web Token (JWT) ist eine kompakte, URL-sichere Darstellung von Claims, die zwischen zwei Parteien übertragen werden (RFC 7519, Jones et al. 2015). Die Claims werden als JSON-Objekt kodiert, das als Nutzlast einer JSON Web Signature oder als Klartext einer JSON Web Encryption dient, sodass sie signiert, mit einem Message Authentication Code geschützt und/oder verschlüsselt werden können. In der kompakten Serialisierung werden base64url-kodierte Teile durch Punkte verbunden.
  sources:
  - https://www.rfc-editor.org/rfc/rfc7519
- id: pkce
  type: Method
  name_en: Proof Key for Code Exchange (PKCE)
  name_de: Proof Key for Code Exchange (PKCE)
  aliases:
  - PKCE
  summary_en: Proof Key for Code Exchange (PKCE) protects OAuth 2.0 public clients using the authorisation code grant against interception of the authorisation code (RFC 7636, Sakimura et al. 2015). The client creates a secret code verifier and sends a transformed version, the code challenge, with the authorisation request; when redeeming the code it sends the verifier, and the authorisation server denies access if the transformed verifier does not match the challenge. An attacker who only intercepted the code cannot redeem it.
  summary_de: Proof Key for Code Exchange (PKCE) schützt öffentliche OAuth-2.0-Clients, die den Authorization Code Grant nutzen, gegen das Abfangen des Autorisierungscodes (RFC 7636, Sakimura et al. 2015). Der Client erzeugt einen geheimen Code Verifier und sendet eine transformierte Fassung, die Code Challenge, mit der Autorisierungsanfrage; beim Einlösen des Codes sendet er den Verifier, und der Autorisierungsserver verweigert den Zugriff, wenn der transformierte Verifier nicht zur Challenge passt. Wer nur den Code abgefangen hat, kann ihn nicht einlösen.
  sources:
  - https://www.rfc-editor.org/rfc/rfc7636
- id: owasp
  type: Organisation
  name_en: OWASP
  name_de: OWASP
  aliases:
  - Open Worldwide Application Security Project
  summary_en: The Open Worldwide Application Security Project (OWASP) is a nonprofit foundation that works to improve the security of software through community-led open-source projects, local chapters, conferences and training (OWASP). The project launched in 2001 and was incorporated as the OWASP Foundation, a US nonprofit, in 2004; it maintains widely adopted security standards such as its Top 10 lists.
  summary_de: Das Open Worldwide Application Security Project (OWASP) ist eine gemeinnützige Stiftung, die die Sicherheit von Software durch gemeinschaftlich getragene Open-Source-Projekte, lokale Gruppen, Konferenzen und Schulungen verbessern will (OWASP). Das Projekt startete 2001 und wurde 2004 als OWASP Foundation, eine gemeinnützige Organisation in den USA, eingetragen; es pflegt verbreitete Sicherheitsstandards wie seine Top-10-Listen.
  sources:
  - https://owasp.org/about/
- id: sql-pgq
  type: Technology
  name_en: SQL/PGQ
  name_de: SQL/PGQ
  summary_en: SQL/PGQ (Property Graph Queries) is a part of the ISO SQL standard that defines graph views over a tabular SQL schema and runs read-only graph queries against them (Deutsch et al. 2021). Its core, a graph pattern matching language, is shared with the property graph query language GQL; both are developed by the ISO/IEC JTC1 SC32 working group WG3.
  summary_de: SQL/PGQ (Property Graph Queries) ist ein Teil des ISO-SQL-Standards, der Graphsichten über ein tabellarisches SQL-Schema definiert und darauf nur lesende Graphabfragen ausführt (Deutsch et al. 2021). Sein Kern, eine Sprache für Graph-Pattern-Matching, ist mit der Property-Graph-Abfragesprache GQL identisch; beide werden von der Arbeitsgruppe WG3 von ISO/IEC JTC1 SC32 entwickelt.
  sources:
  - https://arxiv.org/abs/2112.06217
- id: neo4j-graph-data-science
  type: Technology
  name_en: Neo4j Graph Data Science (GDS)
  name_de: Neo4j Graph Data Science (GDS)
  aliases:
  - GDS
  summary_en: The Neo4j Graph Data Science (GDS) library provides parallel implementations of common graph algorithms, exposed as Cypher procedures, and machine learning pipelines for supervised graph tasks such as predicting missing relationships (Neo4j documentation). Its features are grouped into production-quality, beta and alpha tiers.
  summary_de: Die Neo4j Graph Data Science (GDS) Library stellt parallele Implementierungen gängiger Graphalgorithmen als Cypher-Prozeduren bereit, dazu Pipelines für überwachtes Lernen auf Graphen, etwa zur Vorhersage fehlender Beziehungen (Neo4j-Dokumentation). Die Funktionen sind in die Reifestufen production-quality, beta und alpha eingeteilt.
  sources:
  - https://neo4j.com/docs/graph-data-science/current/introduction/
- id: singular-value-decomposition
  type: Method
  name_en: Singular value decomposition (SVD)
  name_de: Singulärwertzerlegung (SVD)
  summary_en: The singular value decomposition (SVD) solves the low-rank approximation problem, finding the matrix of rank at most k closest to a given matrix in Frobenius norm (Manning et al., 2008). Applied to a term-document matrix, this yields latent semantic indexing, which maps documents and queries into a low-rank space to cope with synonymy and polysemy.
  summary_de: Die Singulärwertzerlegung (SVD) löst das Problem der Niedrigrang-Approximation, also das Finden der Matrix mit Rang höchstens k, die einer gegebenen Matrix in der Frobeniusnorm am nächsten ist (Manning et al., 2008). Auf eine Term-Dokument-Matrix angewendet ergibt das Latent Semantic Indexing, das Dokumente und Anfragen in einen Raum niedrigen Rangs abbildet, um Synonymie und Polysemie zu begegnen.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/low-rank-approximations-1.html
  - https://nlp.stanford.edu/IR-book/html/htmledition/latent-semantic-indexing-1.html
- id: jaccard-coefficient
  type: Concept
  name_en: Jaccard coefficient
  name_de: Jaccard-Koeffizient
  aliases:
  - Jaccard similarity
  summary_en: The Jaccard coefficient measures the overlap of two sets as the size of their intersection divided by the size of their union (Manning et al., 2008). For near-duplicate detection, documents are represented as sets of shingles; if their Jaccard coefficient exceeds a threshold, they are treated as near duplicates, and hashing with random permutations avoids computing all pairwise coefficients.
  summary_de: Der Jaccard-Koeffizient misst die Überschneidung zweier Mengen als Größe ihrer Schnittmenge geteilt durch die Größe ihrer Vereinigung (Manning et al., 2008). Bei der Erkennung von Beinahe-Duplikaten werden Dokumente als Mengen von Shingles dargestellt; übersteigt ihr Jaccard-Koeffizient eine Schwelle, gelten sie als Beinahe-Duplikate, und Hashing mit zufälligen Permutationen erspart die paarweise Berechnung.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/near-duplicates-and-shingling-1.html
- id: direct-preference-optimization
  type: Method
  name_en: Direct Preference Optimization (DPO)
  name_de: Direct Preference Optimization (DPO)
  aliases:
  - DPO
  summary_en: Direct Preference Optimization (DPO) aligns language models with human preferences using a simple classification loss instead of reinforcement learning, based on a reparameterisation of the RLHF reward model whose optimal policy has a closed form (Rafailov et al., 2023). It is stable and lightweight, needs no sampling during fine-tuning, and matched or exceeded PPO-based RLHF on sentiment control, summarisation and single-turn dialogue.
  summary_de: Direct Preference Optimization (DPO) richtet Sprachmodelle mit einem einfachen Klassifikationsverlust statt mit Reinforcement Learning an menschlichen Präferenzen aus, gestützt auf eine Umparametrisierung des RLHF-Belohnungsmodells, deren optimale Policy eine geschlossene Form hat (Rafailov et al., 2023). Es ist stabil und leichtgewichtig, braucht beim Fine-Tuning kein Sampling und erreichte oder übertraf PPO-basiertes RLHF bei Sentimentsteuerung, Zusammenfassung und einstufigen Dialogen.
  sources:
  - https://arxiv.org/abs/2305.18290
- id: constitutional-ai
  type: Method
  name_en: Constitutional AI
  name_de: Constitutional AI
  aliases:
  - RLAIF
  summary_en: Constitutional AI trains a harmless AI assistant without human labels for harmful outputs; the only human oversight is a list of principles (Bai et al., 2022). In a supervised phase the model critiques and revises its own responses and is fine-tuned on the revisions; in a reinforcement learning phase an AI preference model provides the reward ("RL from AI Feedback"), producing an assistant that explains its objections instead of being evasive.
  summary_de: Constitutional AI trainiert einen harmlosen KI-Assistenten ohne menschliche Labels für schädliche Ausgaben; die einzige menschliche Aufsicht ist eine Liste von Prinzipien (Bai et al., 2022). In einer überwachten Phase kritisiert und überarbeitet das Modell eigene Antworten und wird auf die Überarbeitungen feinjustiert; in einer Reinforcement-Learning-Phase liefert ein KI-Präferenzmodell die Belohnung („RL from AI Feedback“), sodass ein Assistent entsteht, der seine Einwände erklärt, statt auszuweichen.
  sources:
  - https://arxiv.org/abs/2212.08073
- id: rlvr
  type: Method
  name_en: Reinforcement learning with verifiable rewards (RLVR)
  name_de: Reinforcement Learning mit überprüfbaren Belohnungen (RLVR)
  aliases:
  - RLVR
  summary_en: Reinforcement learning with verifiable rewards (RLVR) is a post-training method introduced with the fully open Tulu 3 models, alongside supervised fine-tuning and Direct Preference Optimization (Lambert et al., 2024). Tulu 3, built on Llama 3.1 base models, surpassed the instruct versions of Llama 3.1, Qwen 2.5 and Mistral as well as GPT-4o-mini and Claude 3.5 Haiku, and its data, code and recipes were released.
  summary_de: Reinforcement Learning with Verifiable Rewards (RLVR) ist ein Nachtrainingsverfahren, das mit den vollständig offenen Tulu-3-Modellen neben Supervised Fine-Tuning und Direct Preference Optimization eingeführt wurde (Lambert et al., 2024). Tulu 3 auf Basis von Llama 3.1 übertraf die Instruct-Versionen von Llama 3.1, Qwen 2.5 und Mistral sowie GPT-4o-mini und Claude 3.5 Haiku, und Daten, Code und Rezepte wurden veröffentlicht.
  sources:
  - https://arxiv.org/abs/2411.15124
- id: bradley-terry-model
  type: Concept
  name_en: Bradley-Terry model
  name_de: Bradley-Terry-Modell
  summary_en: The Bradley-Terry model is a statistical model for paired comparisons in which each item has a positive strength parameter and the probability that one item is preferred over another depends on their relative strengths (Bradley and Terry 1952). It is used, for example, to turn pairwise human votes between LLMs into a ranking in Chatbot Arena (Chiang et al. 2024).
  summary_de: Das Bradley-Terry-Modell ist ein statistisches Modell für Paarvergleiche, in dem jedes Objekt einen positiven Stärkeparameter hat und die Wahrscheinlichkeit, dass ein Objekt einem anderen vorgezogen wird, von ihren relativen Stärken abhängt (Bradley und Terry 1952). Es wird zum Beispiel in Chatbot Arena genutzt, um paarweise menschliche Abstimmungen zwischen LLMs in eine Rangfolge zu überführen (Chiang et al. 2024).
  sources:
  - https://doi.org/10.2307/2334029
  - https://arxiv.org/abs/2403.04132
- id: deepseek-r1
  type: Technology
  name_en: DeepSeek-R1
  name_de: DeepSeek-R1
  summary_en: DeepSeek-R1 is a DeepSeek-AI language model whose reasoning abilities were developed through reinforcement learning without human-labelled reasoning trajectories (DeepSeek-AI 2025). The authors report emergent reasoning patterns such as self-reflection and verification, strong results on verifiable tasks in mathematics, programming competitions and STEM, and transfer of these patterns to smaller models; the work was published in Nature.
  summary_de: DeepSeek-R1 ist ein Sprachmodell von DeepSeek-AI, dessen Fähigkeiten zum schlussfolgernden Denken durch Reinforcement Learning ohne von Menschen annotierte Denkwege entwickelt wurden (DeepSeek-AI 2025). Die Autoren berichten von emergenten Denkmustern wie Selbstreflexion und Verifikation, starken Ergebnissen bei überprüfbaren Aufgaben in Mathematik, Programmierwettbewerben und MINT-Fächern und von der Übertragung dieser Muster auf kleinere Modelle; die Arbeit erschien in Nature.
  sources:
  - https://arxiv.org/abs/2501.12948
- id: perplexity
  type: Concept
  name_en: Perplexity
  name_de: Perplexität
  summary_en: The perplexity of a language model on a test set is the inverse probability of the test set, normalised by the number of words or tokens via the N-th root (Jurafsky and Martin 2026). It is therefore also called per-word or per-token perplexity; lower perplexity means the model assigns higher probability to the test data.
  summary_de: Die Perplexität eines Sprachmodells auf einem Testdatensatz ist die inverse Wahrscheinlichkeit des Testdatensatzes, normiert auf die Zahl der Wörter oder Tokens über die N-te Wurzel (Jurafsky und Martin 2026). Sie heißt daher auch Perplexität pro Wort oder pro Token; eine niedrigere Perplexität bedeutet, dass das Modell den Testdaten eine höhere Wahrscheinlichkeit zuweist.
  sources:
  - https://web.stanford.edu/~jurafsky/slp3/3.pdf
- id: penn-treebank
  type: Dataset
  name_en: Penn Treebank
  name_de: Penn Treebank
- id: semcor
  type: Dataset
  name_en: SemCor
  name_de: SemCor
- id: spacy
  type: Technology
  name_en: spaCy
  name_de: spaCy
  summary_en: spaCy is a free, open-source library for advanced natural language processing in Python, designed for production use (spaCy documentation). It provides pipelines for tasks such as tokenisation, part-of-speech tagging, dependency parsing and named entity recognition.
  summary_de: spaCy ist eine freie, quelloffene Bibliothek für fortgeschrittene Verarbeitung natürlicher Sprache in Python, die für den Produktiveinsatz ausgelegt ist (spaCy-Dokumentation). Sie bietet Pipelines für Aufgaben wie Tokenisierung, Wortartenerkennung, Dependenzparsing und Eigennamenerkennung.
  sources:
  - https://spacy.io/usage/spacy-101
- id: mean-average-precision
  type: Method
  name_en: Mean Average Precision (MAP)
  name_de: Mean Average Precision (MAP)
  aliases:
  - MAP
  summary_en: 'Mean Average Precision (MAP) is a single-figure measure of ranked retrieval quality across recall levels: for each information need, average precision is the mean of the precision values after each relevant document is retrieved, and MAP averages this over information needs (Manning et al., 2008). It is the most standard measure in the TREC community and has especially good discrimination and stability.'
  summary_de: 'Mean Average Precision (MAP) ist ein einzelnes Maß für die Qualität gerankter Ergebnisse über alle Recall-Stufen: Für jeden Informationsbedarf ist die Average Precision der Mittelwert der Precision-Werte nach jedem gefundenen relevanten Dokument, und MAP mittelt dies über alle Informationsbedarfe (Manning et al., 2008). Es ist das gebräuchlichste Maß in der TREC-Gemeinschaft und unterscheidet Systeme besonders trennscharf und stabil.'
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-ranked-retrieval-results-1.html
- id: r-precision
  type: Method
  name_en: R-precision
  name_de: R-Precision
  summary_en: R-precision is the precision of the top |Rel| documents returned for a query, where |Rel| is the number of known relevant documents (Manning et al., 2008). It adjusts for the size of the relevant set, so a perfect system can score 1 on every query, which makes averaging across queries more meaningful than precision at a fixed cut-off.
  summary_de: R-Precision ist die Precision der ersten |Rel| zurückgegebenen Dokumente einer Anfrage, wobei |Rel| die Zahl der bekannten relevanten Dokumente ist (Manning et al., 2008). Sie gleicht die Größe der relevanten Menge aus, sodass ein perfektes System bei jeder Anfrage 1 erreichen kann; das macht die Mittelung über Anfragen aussagekräftiger als Precision an einer festen Grenze.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-ranked-retrieval-results-1.html
- id: relevance-pooling
  type: Method
  name_en: Pooling (relevance assessment)
  name_de: Pooling (Relevanzbeurteilung)
  summary_en: 'Pooling is the standard way to collect relevance judgements for large test collections: relevance is assessed only for a pool of documents formed from the top results of several retrieval systems, usually those being evaluated, plus possibly other sources such as Boolean searches or expert searchers (Manning et al., 2008). Exhaustive judgements of every query-document pair are only feasible for tiny collections such as Cranfield.'
  summary_de: 'Pooling ist das übliche Verfahren, Relevanzurteile für große Testkollektionen zu erheben: Relevanz wird nur für einen Pool von Dokumenten bewertet, der aus den Top-Ergebnissen mehrerer Retrieval-Systeme gebildet wird, meist der zu evaluierenden, ergänzt um weitere Quellen wie Boolesche Suchen oder Recherchen von Fachleuten (Manning et al., 2008). Vollständige Urteile für jedes Paar aus Anfrage und Dokument sind nur bei sehr kleinen Kollektionen wie Cranfield machbar.'
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/assessing-relevance-1.html
- id: kappa-statistic
  type: Method
  name_en: Kappa statistic
  name_de: Kappa-Statistik
  summary_en: The kappa statistic measures agreement between judges on categorical judgements and corrects the simple agreement rate for agreement expected by chance, as (P(A) − P(E)) / (1 − P(E)) (Manning et al., 2008). It is 1 for perfect agreement, 0 for chance-level agreement and negative for worse than chance; as a rule of thumb, values above 0.8 indicate good agreement in relevance assessment.
  summary_de: Die Kappa-Statistik misst die Übereinstimmung von Bewertenden bei kategorialen Urteilen und bereinigt die einfache Übereinstimmungsrate um die zufällig erwartete Übereinstimmung, als (P(A) − P(E)) / (1 − P(E)) (Manning et al., 2008). Sie ist 1 bei vollständiger Übereinstimmung, 0 bei zufälliger und negativ bei schlechterer als zufälliger; als Faustregel gelten Werte über 0,8 bei Relevanzurteilen als gute Übereinstimmung.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/assessing-relevance-1.html
- id: expectation-maximization
  type: Method
  name_en: Expectation-Maximization (EM) algorithm
  name_de: Expectation-Maximization-Algorithmus (EM)
  aliases:
  - EM algorithm
  summary_en: The Expectation-Maximization (EM) algorithm is an iterative method for maximum likelihood estimation that, used for model-based clustering, generalises k-means (Manning et al., 2008). It alternates an expectation step, which computes soft assignments of documents to clusters, and a maximisation step, which re-estimates the model parameters, so documents can belong partly to several clusters.
  summary_de: Der Expectation-Maximization-Algorithmus (EM) ist ein iteratives Verfahren zur Maximum-Likelihood-Schätzung, das im modellbasierten Clustering k-Means verallgemeinert (Manning et al., 2008). Er wechselt zwischen einem Erwartungsschritt, der weiche Zuordnungen von Dokumenten zu Clustern berechnet, und einem Maximierungsschritt, der die Modellparameter neu schätzt, sodass Dokumente anteilig mehreren Clustern angehören können.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/model-based-clustering-1.html
- id: cluster-hypothesis
  type: Concept
  name_en: Cluster hypothesis
  name_de: Cluster-Hypothese
  summary_en: 'The cluster hypothesis states that documents in the same cluster behave similarly with respect to relevance to information needs: if one document from a cluster is relevant to a request, other documents from the same cluster are likely relevant too (Manning et al., 2008). It is the fundamental assumption behind using clustering in information retrieval.'
  summary_de: 'Die Cluster-Hypothese besagt, dass sich Dokumente desselben Clusters hinsichtlich ihrer Relevanz für einen Informationsbedarf ähnlich verhalten: Ist ein Dokument eines Clusters relevant, sind wahrscheinlich auch andere Dokumente desselben Clusters relevant (Manning et al., 2008). Sie ist die Grundannahme hinter dem Einsatz von Clustering im Information Retrieval.'
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/clustering-in-information-retrieval-1.html
- id: rand-index
  type: Method
  name_en: Rand index
  name_de: Rand-Index
  summary_en: The Rand index evaluates a clustering against gold-standard classes by treating it as a series of decisions for every pair of documents and measuring the share of correct decisions, both pairs correctly put together and pairs correctly kept apart (Manning et al., 2008). It weights false positives and false negatives equally; the F measure allows weighting them differently.
  summary_de: Der Rand-Index bewertet ein Clustering gegenüber Goldstandard-Klassen, indem er es als Folge von Entscheidungen für jedes Dokumentpaar betrachtet und den Anteil richtiger Entscheidungen misst, sowohl richtig zusammengelegter als auch richtig getrennter Paare (Manning et al., 2008). Er gewichtet falsch positive und falsch negative Entscheidungen gleich; das F-Maß erlaubt eine unterschiedliche Gewichtung.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-clustering-1.html
- id: normalised-mutual-information
  type: Method
  name_en: Normalised mutual information (NMI)
  name_de: Normalisierte Mutual Information (NMI)
  aliases:
  - NMI
  - Normalized mutual information (NMI)
  summary_en: 'Normalised mutual information (NMI) is an external measure of clustering quality: the mutual information between clusters and gold-standard classes, normalised by their entropies (Manning et al., 2008). Unlike purity or plain mutual information, it does not reward splitting data into many small clusters, so clusterings with different numbers of clusters can be compared; it always lies between 0 and 1.'
  summary_de: 'Normalised Mutual Information (NMI) ist ein externes Maß für die Güte eines Clusterings: die Transinformation zwischen Clustern und Goldstandard-Klassen, normiert über deren Entropien (Manning et al., 2008). Anders als Purity oder einfache Transinformation belohnt sie nicht das Aufteilen in viele kleine Cluster, sodass sich Clusterings mit unterschiedlich vielen Clustern vergleichen lassen; sie liegt immer zwischen 0 und 1.'
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/evaluation-of-clustering-1.html
- id: stemming
  type: Method
  name_en: Stemming
  name_de: Stemming
  summary_en: Stemming reduces inflected and sometimes derivationally related word forms to a common base by a crude heuristic process that chops off word endings, so that a search for one form also finds others (Manning et al., 2008). Unlike lemmatisation, it uses no vocabulary or morphological analysis; Porter's algorithm, with five phases of rule-based reductions, is the most common stemmer for English.
  summary_de: Stemming führt flektierte und teils abgeleitete Wortformen auf eine gemeinsame Grundform zurück, indem es Wortendungen mit groben Heuristiken abschneidet, sodass eine Suche nach einer Form auch andere findet (Manning et al., 2008). Anders als die Lemmatisierung nutzt es weder Wörterbuch noch morphologische Analyse; der Porter-Algorithmus mit fünf Phasen regelbasierter Kürzungen ist der verbreitetste Stemmer für Englisch.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/stemming-and-lemmatization-1.html
- id: boolean-retrieval
  type: Method
  name_en: Boolean retrieval
  name_de: Boolesches Retrieval
  summary_en: The Boolean retrieval model lets users pose queries as Boolean expressions of terms combined with AND, OR and NOT, and treats each document as a set of words (Manning et al., 2008). Queries are answered by combining the rows of a term-document incidence matrix, or in practice an inverted index, for example Brutus AND Caesar AND NOT Calpurnia over Shakespeare's plays.
  summary_de: Das Boolesche Retrieval-Modell erlaubt Anfragen als Boolesche Ausdrücke aus Termen, verknüpft mit AND, OR und NOT, und behandelt jedes Dokument als Menge von Wörtern (Manning et al., 2008). Anfragen werden beantwortet, indem Zeilen einer Term-Dokument-Inzidenzmatrix, in der Praxis eines invertierten Index, verknüpft werden, etwa Brutus AND Caesar AND NOT Calpurnia über die Stücke Shakespeares.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/an-example-information-retrieval-problem-1.html
- id: compound-splitting
  type: Method
  name_en: Compound splitting
  name_de: Kompositazerlegung
  summary_en: Compound splitting divides words written without spaces, such as German compounds like Computerlinguistik or Lebensversicherungsgesellschaftsangestellter, into their parts for indexing (Manning et al., 2008). Retrieval systems for German benefit greatly from a compound splitter, usually implemented by checking whether a word can be divided into several words that appear in a vocabulary.
  summary_de: Compound Splitting zerlegt ohne Leerzeichen geschriebene Wörter, etwa deutsche Komposita wie Computerlinguistik oder Lebensversicherungsgesellschaftsangestellter, für die Indexierung in ihre Bestandteile (Manning et al., 2008). Retrieval-Systeme für Deutsch profitieren stark von einem Kompositazerleger, der meist prüft, ob sich ein Wort in mehrere Wörter eines Vokabulars aufteilen lässt.
  sources:
  - https://nlp.stanford.edu/IR-book/html/htmledition/tokenization-1.html
- id: rescal
  type: Method
  name_en: RESCAL
  name_de: RESCAL
  summary_en: RESCAL is a tensor decomposition model for knowledge graph embeddings that represents each relation as a matrix, so that it can capture edge direction, at a higher cost than DistMult, which uses one vector per relation (Hogan et al. 2021).
  summary_de: RESCAL ist ein Tensorzerlegungsmodell für Knowledge-Graph-Embeddings, das jede Relation als Matrix darstellt und dadurch die Kantenrichtung erfassen kann, zu höheren Kosten als DistMult, das einen Vektor pro Relation nutzt (Hogan et al. 2021).
  sources:
  - https://arxiv.org/abs/2003.02320
- id: tucker
  type: Method
  name_en: TuckER
  name_de: TuckER
  summary_en: TuckER is a linear model for knowledge graph link prediction based on the Tucker decomposition of the binary tensor of knowledge graph triples (Balažević et al., 2019). It outperformed earlier models on standard link prediction datasets, is fully expressive, and several earlier linear models are special cases of it.
  summary_de: TuckER ist ein lineares Modell zur Linkvorhersage in Wissensgraphen auf Grundlage der Tucker-Zerlegung des binären Tensors der Tripel (Balažević et al., 2019). Es übertraf frühere Modelle auf Standarddatensätzen zur Linkvorhersage, ist voll ausdrucksstark, und mehrere frühere lineare Modelle sind Spezialfälle davon.
  sources:
  - https://arxiv.org/abs/1901.09590
- id: conve
  type: Method
  name_en: ConvE
  name_de: ConvE
  summary_en: ConvE is a multi-layer convolutional network for knowledge graph link prediction that is highly parameter-efficient, matching DistMult and R-GCN with 8 and 17 times fewer parameters (Dettmers et al., 2017). Its authors also showed that the WN18 and FB15k datasets suffer from test leakage through inverse relations and derived robust variants of commonly used datasets.
  summary_de: ConvE ist ein mehrschichtiges Convolutional Network zur Linkvorhersage in Wissensgraphen, das sehr parametersparsam ist und DistMult und R-GCN mit 8- bzw. 17-mal weniger Parametern erreicht (Dettmers et al., 2017). Die Autoren zeigten außerdem, dass die Datensätze WN18 und FB15k über inverse Relationen Testdaten durchsickern lassen, und leiteten robuste Varianten gängiger Datensätze ab.
  sources:
  - https://arxiv.org/abs/1707.01476
- id: rdf2vec
  type: Method
  name_en: RDF2Vec
  name_de: RDF2Vec
  summary_en: RDF2Vec is a language-based knowledge graph embedding method that generates random walks over an RDF graph and feeds them as "sentences" into word2vec to learn vectors for entities (Hogan et al. 2021).
  summary_de: RDF2Vec ist eine sprachbasierte Methode für Knowledge-Graph-Embeddings, die Zufallspfade über einen RDF-Graphen erzeugt und sie als „Sätze“ in word2vec einspeist, um Vektoren für Entitäten zu lernen (Hogan et al. 2021).
  sources:
  - https://arxiv.org/abs/2003.02320
- id: pykeen
  type: Technology
  name_en: PyKEEN
  name_de: PyKEEN
  summary_en: PyKEEN is a Python package for reproducible knowledge graph embeddings (PyKEEN documentation). A high-level pipeline function trains and evaluates embedding models such as TransE on named datasets, with configurable training loops and rank-based evaluation.
  summary_de: PyKEEN ist ein Python-Paket für reproduzierbare Knowledge-Graph-Embeddings (PyKEEN-Dokumentation). Eine übergeordnete Pipeline-Funktion trainiert und evaluiert Embedding-Modelle wie TransE auf benannten Datensätzen, mit konfigurierbaren Trainingsschleifen und rangbasierter Evaluation.
  sources:
  - https://pykeen.readthedocs.io/en/stable/
- id: fb15k-237
  type: Dataset
  name_en: FB15K-237
  name_de: FB15K-237
  summary_en: FB15K-237 is a link prediction benchmark derived from the Freebase-based dataset FB15K by Toutanova and Chen (2015). They kept only one relation of each group of near-duplicate or inverse relations, leaving 237 relations, and removed test triples whose entity pairs were directly linked in the training data, to obtain a more realistic dataset without trivially entailed facts.
  summary_de: FB15K-237 ist ein Benchmark für Link Prediction, den Toutanova und Chen (2015) aus dem Freebase-basierten Datensatz FB15K abgeleitet haben. Sie behielten von jeder Gruppe nahezu doppelter oder inverser Relationen nur eine, sodass 237 Relationen übrig blieben, und entfernten Testtripel, deren Entitätenpaare in den Trainingsdaten direkt verbunden waren, um einen realistischeren Datensatz ohne trivial ableitbare Fakten zu erhalten.
  sources:
  - https://aclanthology.org/W15-4007/
- id: wn18rr
  type: Dataset
  name_en: WN18RR
  name_de: WN18RR
  summary_en: WN18RR is a WordNet-based link prediction benchmark that Dettmers et al. (2018) derived from WN18 after showing that a simple rule-based model exploiting inverse relations reached state-of-the-art results on WN18 and FB15K. It contains 93,003 triples with 40,943 entities and 11 relations, and the authors recommend it, FB15K-237 and YAGO3-10 instead of WN18 and FB15K.
  summary_de: WN18RR ist ein WordNet-basierter Benchmark für Link Prediction, den Dettmers et al. (2018) aus WN18 abgeleitet haben, nachdem ein einfaches regelbasiertes Modell, das inverse Relationen ausnutzt, auf WN18 und FB15K State-of-the-Art-Ergebnisse erzielt hatte. Er umfasst 93.003 Tripel mit 40.943 Entitäten und 11 Relationen; die Autoren empfehlen ihn, FB15K-237 und YAGO3-10 anstelle von WN18 und FB15K.
  sources:
  - https://arxiv.org/abs/1707.01476
- id: tim-berners-lee
  type: Person
  name_en: Tim Berners-Lee
  name_de: Tim Berners-Lee
  summary_en: Sir Tim Berners-Lee invented the World Wide Web at CERN in 1989 and wrote the first web server and client in 1990; his specifications of URIs, HTTP and HTML were refined as the Web spread (W3C). When the World Wide Web Consortium (W3C) was formed in 1994, he started leading its work; he is also co-founder and CTO of Inrupt, which develops the open-source Solid platform for giving people control over their data.
  summary_de: Sir Tim Berners-Lee erfand 1989 am CERN das World Wide Web und schrieb 1990 den ersten Webserver und -client; seine Spezifikationen von URIs, HTTP und HTML wurden mit der Verbreitung des Webs weiterentwickelt (W3C). Als 1994 das World Wide Web Consortium (W3C) gegründet wurde, übernahm er die Leitung seiner Arbeit; außerdem ist er Mitgründer und CTO von Inrupt, das die quelloffene Plattform Solid entwickelt, mit der Menschen die Kontrolle über ihre Daten erhalten sollen.
  sources:
  - https://www.w3.org/People/Berners-Lee/
  - https://www.w3.org/about/history/
- id: snli
  type: Dataset
  name_en: SNLI (Stanford Natural Language Inference corpus)
  name_de: SNLI (Stanford Natural Language Inference Corpus)
  aliases:
  - SNLI
  - Stanford Natural Language Inference corpus
  summary_en: The Stanford Natural Language Inference corpus (SNLI) is a freely available collection of 570,000 human-written sentence pairs labelled for entailment and contradiction, created in a grounded task based on image captions (Bowman et al., 2015). Its scale, two orders of magnitude larger than earlier resources, allowed a neural network model to compete on natural language inference benchmarks for the first time.
  summary_de: Das Stanford Natural Language Inference Corpus (SNLI) ist eine frei verfügbare Sammlung von 570 000 von Menschen geschriebenen Satzpaaren mit Labels für Folgerung und Widerspruch, erstellt in einer Aufgabe auf Grundlage von Bildbeschreibungen (Bowman et al., 2015). Sein Umfang, zwei Größenordnungen über früheren Ressourcen, ließ erstmals ein neuronales Modell auf Benchmarks für Natural Language Inference mithalten.
  sources:
  - https://arxiv.org/abs/1508.05326
- id: multinli
  type: Dataset
  name_en: MultiNLI (Multi-Genre NLI corpus)
  name_de: MultiNLI (Multi-Genre NLI Corpus)
  aliases:
  - MultiNLI
  - MNLI
  - Multi-Genre Natural Language Inference corpus
  summary_en: The Multi-Genre Natural Language Inference corpus (MultiNLI) contains 433,000 sentence pairs for training and evaluating models of sentence understanding through inference (Williams et al., 2017). It covers ten genres of written and spoken English and offers an explicit setting for evaluating cross-genre domain adaptation; it is one of the nine GLUE tasks.
  summary_de: Das Multi-Genre Natural Language Inference Corpus (MultiNLI) enthält 433 000 Satzpaare zum Training und zur Evaluation von Modellen für Satzverständnis durch Inferenz (Williams et al., 2017). Es deckt zehn Textsorten geschriebenen und gesprochenen Englischs ab und bietet einen eigenen Aufbau zur Bewertung der Domänenanpassung zwischen Textsorten; es ist eine der neun GLUE-Aufgaben.
  sources:
  - https://arxiv.org/abs/1704.05426
  - https://arxiv.org/abs/1804.07461
- id: summac
  type: Method
  name_en: SummaC
  name_de: SummaC
  summary_en: SummaC revisits natural language inference models for detecting factual inconsistencies between a summary and its source document; its method SummaCConv splits documents into sentences and aggregates sentence-pair NLI scores, resolving the mismatch between sentence-level NLI data and document-level detection (Laban et al., 2021). On the new SummaC benchmark of six datasets it reached 74.4% balanced accuracy.
  summary_de: SummaC greift Modelle für Natural Language Inference wieder auf, um sachliche Widersprüche zwischen einer Zusammenfassung und ihrem Quelldokument zu erkennen; das Verfahren SummaCConv zerlegt Dokumente in Sätze und fasst NLI-Werte für Satzpaare zusammen und behebt so den Unterschied zwischen satzweisen NLI-Daten und Erkennung auf Dokumentebene (Laban et al., 2021). Auf dem neuen SummaC-Benchmark aus sechs Datensätzen erreichte es 74,4 % Balanced Accuracy.
  sources:
  - https://arxiv.org/abs/2111.09525
- id: ward-cunningham
  type: Person
  name_en: Ward Cunningham
  name_de: Ward Cunningham
  summary_en: Ward Cunningham is a programmer and co-principal of Cunningham & Cunningham, a consultancy specialising in object-oriented programming that hosts the Portland Pattern Repository and its wiki, the de facto home of Extreme Programming (c2.com). Cunningham's OOPSLA 1992 experience report on the WyCash portfolio management system compared shipping first-time code with going into debt, the origin of the technical debt metaphor (Cunningham 1992).
  summary_de: Ward Cunningham ist Programmierer und Mitinhaber von Cunningham & Cunningham, einer auf objektorientierte Programmierung spezialisierten Beratung, die das Portland Pattern Repository und dessen Wiki betreibt, die faktische Heimat von Extreme Programming (c2.com). Cunninghams OOPSLA-Erfahrungsbericht von 1992 über das Portfoliomanagementsystem WyCash verglich das Ausliefern von Code in erster Fassung mit dem Aufnehmen von Schulden, der Ursprung der Metapher der technischen Schulden (Cunningham 1992).
  sources:
  - https://c2.com/
  - http://c2.com/doc/oopsla92.html
- id: github-actions
  type: Technology
  name_en: GitHub Actions
  name_de: GitHub Actions
  summary_en: GitHub Actions is the continuous integration and continuous delivery platform of GitHub for automating build, test and deployment pipelines (GitHub Docs). Workflows are triggered by events in a repository, such as an opened pull request or a new issue, and run on GitHub-hosted Linux, Windows or macOS virtual machines or on self-hosted runners.
  summary_de: GitHub Actions ist die Plattform von GitHub für Continuous Integration und Continuous Delivery, mit der sich Build-, Test- und Deployment-Pipelines automatisieren lassen (GitHub Docs). Workflows werden durch Ereignisse in einem Repository ausgelöst, etwa einen geöffneten Pull Request oder ein neues Issue, und laufen auf von GitHub bereitgestellten virtuellen Maschinen mit Linux, Windows oder macOS oder auf selbst betriebenen Runnern.
  sources:
  - https://docs.github.com/en/actions/get-started/understand-github-actions
- id: azure-pipelines
  type: Technology
  name_en: Azure Pipelines
  name_de: Azure Pipelines
  aliases:
  - Azure DevOps Pipelines
  summary_en: Azure Pipelines is the part of Azure DevOps that combines continuous integration, continuous testing and continuous delivery to build, test and deploy code projects automatically to any destination, on premises or in the cloud (Microsoft Learn).
  summary_de: Azure Pipelines ist der Teil von Azure DevOps, der Continuous Integration, Continuous Testing und Continuous Delivery verbindet, um Codeprojekte automatisch zu bauen, zu testen und in beliebige Zielumgebungen auszuliefern, lokal oder in der Cloud (Microsoft Learn).
  sources:
  - https://learn.microsoft.com/en-us/azure/devops/pipelines/get-started/what-is-azure-pipelines
- id: dora-metrics
  type: Method
  name_en: DORA metrics
  name_de: DORA-Metriken
  aliases:
  - DORA software delivery metrics
- id: terraform
  type: Technology
  name_en: Terraform
  name_de: Terraform
  summary_en: HashiCorp Terraform is an infrastructure-as-code tool that defines cloud and on-premises resources in human-readable configuration files that can be versioned, reused and shared (HashiCorp documentation). It creates and manages resources through the platforms' APIs via providers, from compute, storage and network resources to DNS entries and SaaS features.
  summary_de: HashiCorp Terraform ist ein Infrastructure-as-Code-Werkzeug, das Cloud- und On-Premises-Ressourcen in menschenlesbaren Konfigurationsdateien beschreibt, die versioniert, wiederverwendet und geteilt werden können (HashiCorp-Dokumentation). Es erstellt und verwaltet Ressourcen über die APIs der Plattformen mithilfe sogenannter Provider, von Rechen-, Speicher- und Netzwerkressourcen bis zu DNS-Einträgen und SaaS-Funktionen.
  sources:
  - https://developer.hashicorp.com/terraform/intro
- id: zenml
  type: Technology
  name_en: ZenML
  name_de: ZenML
  summary_en: ZenML is an open-source MLOps framework for orchestrating production ML and LLM pipelines, with versioned artifacts, caching and infrastructure abstracted behind so-called stacks (ZenML documentation).
  summary_de: ZenML ist ein quelloffenes MLOps-Framework zur Orchestrierung produktiver ML- und LLM-Pipelines mit versionierten Artefakten, Caching und einer hinter sogenannten Stacks abstrahierten Infrastruktur (ZenML-Dokumentation).
  sources:
  - https://docs.zenml.io/
- id: kubeflow-pipelines
  type: Technology
  name_en: Kubeflow Pipelines
  name_de: Kubeflow Pipelines
  aliases:
  - Kubeflow
  summary_en: Kubeflow Pipelines (KFP) is a platform for building and deploying portable, scalable machine learning workflows using containers on Kubernetes (Kubeflow documentation). Components and pipelines are written with the KFP Python SDK, compiled to an intermediate YAML representation and run on a KFP-conformant backend such as the open-source KFP backend or Google Cloud Vertex AI Pipelines.
  summary_de: Kubeflow Pipelines (KFP) ist eine Plattform, um portable und skalierbare Workflows für maschinelles Lernen mit Containern auf Kubernetes zu bauen und auszuführen (Kubeflow-Dokumentation). Komponenten und Pipelines werden mit dem KFP-Python-SDK geschrieben, in eine YAML-Zwischendarstellung kompiliert und auf einem KFP-konformen Backend ausgeführt, etwa dem quelloffenen KFP-Backend oder Google Cloud Vertex AI Pipelines.
  sources:
  - https://www.kubeflow.org/docs/components/pipelines/overview/
- id: unity-catalog
  type: Technology
  name_en: Unity Catalog
  name_de: Unity Catalog
  summary_en: Unity Catalog is the governance layer for data and AI built into Databricks (Databricks documentation). It enforces access control when tables are queried or models called, tracks lineage, logs activity for auditing and models governed assets as securable objects; an open-source implementation also exists.
  summary_de: Unity Catalog ist die in Databricks integrierte Governance-Schicht für Daten und KI (Databricks-Dokumentation). Sie setzt Zugriffskontrollen durch, wenn Tabellen abgefragt oder Modelle aufgerufen werden, verfolgt die Datenherkunft (Lineage), protokolliert Aktivitäten für Audits und bildet verwaltete Assets als absicherbare Objekte ab; es gibt auch eine quelloffene Implementierung.
  sources:
  - https://docs.databricks.com/aws/en/data-governance/unity-catalog/
- id: openlineage
  type: Technology
  name_en: OpenLineage
  name_de: OpenLineage
  summary_en: OpenLineage is an open framework and standard for collecting and analysing data lineage (OpenLineage documentation). Its core specification defines a generic model of datasets, jobs and runs with consistent naming, which can be extended with user-defined metadata called facets.
  summary_de: OpenLineage ist ein offenes Framework und ein offener Standard für das Erfassen und Analysieren von Datenherkunft (Lineage) (OpenLineage-Dokumentation). Die Kernspezifikation definiert ein allgemeines Modell aus Datensätzen, Jobs und Läufen mit einheitlicher Benennung, das sich um benutzerdefinierte Metadaten, sogenannte Facets, erweitern lässt.
  sources:
  - https://openlineage.io/docs/
- id: jeffrey-dean
  type: Person
  name_en: Jeffrey Dean
  name_de: Jeffrey Dean
  aliases:
  - Jeff Dean
  summary_en: Jeffrey Dean, then at Google, introduced MapReduce with Sanjay Ghemawat at OSDI 2004. MapReduce is a programming model in which users write a map and a reduce function and the run-time system parallelises the program across a large cluster of commodity machines, handling partitioning, scheduling, machine failures and communication.
  summary_de: Jeffrey Dean stellte, damals bei Google, gemeinsam mit Sanjay Ghemawat auf der OSDI 2004 MapReduce vor. MapReduce ist ein Programmiermodell, bei dem eine Map- und eine Reduce-Funktion geschrieben werden und die Laufzeitumgebung das Programm auf einem großen Cluster gewöhnlicher Rechner parallelisiert und dabei Partitionierung, Ablaufplanung, Rechnerausfälle und Kommunikation übernimmt.
  sources:
  - https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
- id: sanjay-ghemawat
  type: Person
  name_en: Sanjay Ghemawat
  name_de: Sanjay Ghemawat
  summary_en: Sanjay Ghemawat, then at Google, is co-author, with Jeffrey Dean, of the MapReduce paper presented at OSDI 2004. The paper describes a programming model and implementation that let programmers without experience in parallel and distributed systems process large data sets on clusters of commodity machines.
  summary_de: Sanjay Ghemawat, damals bei Google, ist gemeinsam mit Jeffrey Dean Autor des MapReduce-Papers, das auf der OSDI 2004 vorgestellt wurde. Es beschreibt ein Programmiermodell mit Implementierung, mit dem auch Programmierende ohne Erfahrung mit parallelen und verteilten Systemen große Datenmengen auf Clustern gewöhnlicher Rechner verarbeiten können.
  sources:
  - https://research.google/pubs/mapreduce-simplified-data-processing-on-large-clusters/
- id: tesseract
  type: Technology
  name_en: Tesseract
  name_de: Tesseract
  aliases:
  - Tesseract OCR
  summary_en: Tesseract is an open-source OCR engine with a command-line program (Tesseract repository). It was developed at Hewlett-Packard between 1985 and 1994, open-sourced by HP in 2005 and developed by Google until 2017; since version 4 it includes a neural (LSTM) engine focused on line recognition and recognises more than 100 languages out of the box.
  summary_de: Tesseract ist eine quelloffene OCR-Engine mit Kommandozeilenprogramm (Tesseract-Repository). Sie wurde zwischen 1985 und 1994 bei Hewlett-Packard entwickelt, 2005 von HP als Open Source veröffentlicht und bis 2017 von Google weiterentwickelt; seit Version 4 enthält sie eine neuronale Engine (LSTM) für die Zeilenerkennung und erkennt ohne Zusatzaufwand mehr als 100 Sprachen.
  sources:
  - https://github.com/tesseract-ocr/tesseract
- id: layoutlm
  type: Method
  name_en: LayoutLM
  name_de: LayoutLM
  summary_en: LayoutLM pre-trains a model jointly on text and layout information from scanned document images, and also uses image features of words (Xu et al., 2019). It set new results on form understanding (from 70.72 to 79.27), receipt understanding and document image classification, useful for information extraction from scanned documents.
  summary_de: LayoutLM trainiert ein Modell gemeinsam auf Text und Layout gescannter Dokumentbilder vor und nutzt zusätzlich Bildmerkmale der Wörter (Xu et al., 2019). Es erzielte neue Bestwerte beim Verständnis von Formularen (von 70,72 auf 79,27), Belegen und bei der Klassifikation von Dokumentbildern, nützlich für die Informationsextraktion aus gescannten Dokumenten.
  sources:
  - https://arxiv.org/abs/1912.13318
- id: donut
  type: Method
  name_en: Donut
  name_de: Donut
  aliases:
  - Document understanding transformer
  summary_en: 'Donut (Document understanding transformer) is an OCR-free model for visual document understanding: a Transformer reads document images such as invoices directly, avoiding the cost, inflexibility and error propagation of separate OCR engines (Kim et al., 2021). It reached state-of-the-art speed and accuracy on several document understanding tasks and comes with a synthetic data generator for other languages and domains.'
  summary_de: 'Donut (Document understanding transformer) ist ein Modell für visuelles Dokumentverständnis ohne OCR: Ein Transformer liest Dokumentbilder wie Rechnungen direkt und vermeidet Kosten, Unflexibilität und Fehlerfortpflanzung separater OCR-Engines (Kim et al., 2021). Es erreichte Bestwerte bei Geschwindigkeit und Genauigkeit in mehreren Aufgaben des Dokumentverständnisses und bringt einen Generator synthetischer Daten für weitere Sprachen und Domänen mit.'
  sources:
  - https://arxiv.org/abs/2111.15664
- id: docling
  type: Technology
  name_en: Docling
  name_de: Docling
  summary_en: Docling is an open-source library that parses many document formats, including PDF, DOCX, PPTX, HTML, images and audio, into a unified DoclingDocument representation (Docling repository). Its PDF understanding covers page layout, reading order, table structure, code and formulas, and documents can be exported to formats such as Markdown, HTML and JSON; it can run locally for sensitive data.
  summary_de: Docling ist eine quelloffene Bibliothek, die viele Dokumentformate, darunter PDF, DOCX, PPTX, HTML, Bilder und Audio, in eine einheitliche DoclingDocument-Darstellung überführt (Docling-Repository). Die PDF-Verarbeitung erfasst Seitenlayout, Lesereihenfolge, Tabellenstruktur, Code und Formeln; Dokumente lassen sich etwa nach Markdown, HTML und JSON exportieren, und die Verarbeitung kann für sensible Daten lokal laufen.
  sources:
  - https://github.com/docling-project/docling
- id: doclaynet
  type: Dataset
  name_en: DocLayNet
  name_de: DocLayNet
  summary_en: DocLayNet is a publicly available document-layout annotation dataset in COCO format with 80,863 manually annotated pages from diverse sources, each with bounding boxes in 11 classes (Pfitzmann et al., 2022). Models trained on it predicted layouts more robustly than those trained on PubLayNet or DocBank, which come only from scientific articles.
  summary_de: DocLayNet ist ein öffentlich verfügbarer Datensatz zur Annotation von Dokumentlayouts im COCO-Format mit 80 863 von Hand annotierten Seiten aus vielfältigen Quellen, jeweils mit Begrenzungsrahmen in 11 Klassen (Pfitzmann et al., 2022). Darauf trainierte Modelle sagten Layouts robuster vorher als solche, die auf PubLayNet oder DocBank trainiert wurden, die nur aus wissenschaftlichen Artikeln stammen.
  sources:
  - https://arxiv.org/abs/2206.01062
- id: yolo
  type: Method
  name_en: YOLO
  name_de: YOLO
  aliases:
  - You Only Look Once
  summary_en: YOLO (You Only Look Once) frames object detection as a single regression from full images to spatially separated bounding boxes and class probabilities, so one network can be optimised end to end (Redmon et al., 2015). The base model ran in real time at 45 frames per second; it made more localisation errors than other detectors but fewer false detections on background and generalised well from natural images to artwork.
  summary_de: YOLO (You Only Look Once) fasst Objekterkennung als eine einzige Regression vom ganzen Bild auf räumlich getrennte Begrenzungsrahmen und Klassenwahrscheinlichkeiten auf, sodass ein einziges Netz durchgängig optimiert werden kann (Redmon et al., 2015). Das Basismodell lief in Echtzeit mit 45 Bildern pro Sekunde; es machte mehr Lokalisierungsfehler als andere Detektoren, aber weniger Fehlerkennungen im Hintergrund und generalisierte gut von Fotos auf Kunstwerke.
  sources:
  - https://arxiv.org/abs/1506.02640
- id: mask-r-cnn
  type: Method
  name_en: Mask R-CNN
  name_de: Mask R-CNN
  summary_en: Mask R-CNN is a framework for object instance segmentation that extends Faster R-CNN with a branch predicting a segmentation mask for each detected object in parallel with bounding-box recognition (He et al., 2017). It adds little overhead, generalises to tasks such as human pose estimation and outperformed all single-model entries in the COCO instance segmentation, detection and keypoint tracks.
  summary_de: Mask R-CNN ist ein Framework für Instanzsegmentierung, das Faster R-CNN um einen Zweig ergänzt, der parallel zur Erkennung der Begrenzungsrahmen für jedes erkannte Objekt eine Segmentierungsmaske vorhersagt (He et al., 2017). Es verursacht wenig Mehraufwand, lässt sich auf Aufgaben wie Posenschätzung übertragen und übertraf alle Einzelmodelle in den COCO-Disziplinen Instanzsegmentierung, Detektion und Keypoints.
  sources:
  - https://arxiv.org/abs/1703.06870
- id: u-net
  type: Method
  name_en: U-Net
  name_de: U-Net
  summary_en: U-Net is a convolutional network for image segmentation with a contracting path that captures context and a symmetric expanding path that enables precise localisation, trained end to end with heavy data augmentation from very few images (Ronneberger et al., 2015). It won segmentation and cell tracking challenges in biomedical microscopy and segments a 512×512 image in under a second on a GPU.
  summary_de: U-Net ist ein Convolutional Network für Bildsegmentierung mit einem verdichtenden Pfad, der Kontext erfasst, und einem symmetrischen erweiternden Pfad für genaue Lokalisierung, das mit starker Datenaugmentierung aus sehr wenigen Bildern durchgängig trainiert wird (Ronneberger et al., 2015). Es gewann Wettbewerbe zur Segmentierung und Zellverfolgung in der biomedizinischen Mikroskopie und segmentiert ein Bild mit 512×512 Pixeln auf einer GPU in unter einer Sekunde.
  sources:
  - https://arxiv.org/abs/1505.04597
- id: nist
  type: Organisation
  name_en: NIST
  name_de: NIST
  aliases:
  - National Institute of Standards and Technology
  summary_en: The National Institute of Standards and Technology (NIST), founded in 1901, is part of the U.S. Department of Commerce and one of the oldest physical science laboratories in the United States (NIST). Its mission is to promote innovation and industrial competitiveness by advancing measurement science, standards and technology; its publications include the AI Risk Management Framework (NIST 2023) and the definition of cloud computing in SP 800-145.
  summary_de: Das National Institute of Standards and Technology (NIST), gegründet 1901, gehört zum US-Handelsministerium und ist eines der ältesten physikalischen Forschungslabore der USA (NIST). Es soll Innovation und industrielle Wettbewerbsfähigkeit fördern, indem es Messwissenschaft, Standards und Technologie voranbringt; zu seinen Veröffentlichungen gehören das AI Risk Management Framework (NIST 2023) und die Cloud-Computing-Definition in SP 800-145.
  sources:
  - https://www.nist.gov/about-nist
  - https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf
  - https://csrc.nist.gov/pubs/sp/800/145/final
- id: edgar-f-codd
  type: Person
  name_en: Edgar F. Codd
  name_de: Edgar F. Codd
  aliases:
  - E. F. Codd
  summary_en: Edgar F. Codd, of the IBM Research Laboratory in San Jose, introduced the relational model of data in 1970 in Communications of the ACM. His model based on n-ary relations, a normal form and a universal data sublanguage aimed to protect users of large data banks from having to know how data is organised internally.
  summary_de: Edgar F. Codd vom IBM Research Laboratory in San José stellte 1970 in den Communications of the ACM das relationale Datenmodell vor. Sein Modell auf Grundlage n-stelliger Relationen, einer Normalform und einer universellen Datenteilsprache sollte Nutzende großer Datenbanken davon befreien, die interne Organisation der Daten kennen zu müssen.
  sources:
  - https://www.seas.upenn.edu/~zives/03f/cis550/codd.pdf
- id: ralph-kimball
  type: Person
  name_en: Ralph Kimball
  name_de: Ralph Kimball
  summary_en: Ralph Kimball founded the Kimball Group and was, from the mid-1980s, a leading proponent of the dimensional approach to data warehousing and business intelligence (Kimball Group). He co-authored all books in the Toolkit series and trained more than 20,000 students.
  summary_de: Ralph Kimball gründete die Kimball Group und war ab Mitte der 1980er-Jahre ein führender Vertreter des dimensionalen Ansatzes für Data Warehousing und Business Intelligence (Kimball Group). Er war Mitautor aller Bücher der Toolkit-Reihe und schulte mehr als 20.000 Teilnehmende.
  sources:
  - https://www.kimballgroup.com/about-kimball-group/
- id: bigquery
  type: Technology
  name_en: BigQuery
  name_de: BigQuery
  aliases:
  - Google BigQuery
  summary_en: BigQuery is a fully managed, serverless data platform from Google Cloud for managing and analysing data with SQL and Python without infrastructure management (Google Cloud documentation). It supports business intelligence and ad hoc analysis, machine learning on the stored data and geospatial analysis, among other uses.
  summary_de: BigQuery ist eine vollständig verwaltete, serverlose Datenplattform von Google Cloud, mit der sich Daten per SQL und Python verwalten und analysieren lassen, ohne Infrastruktur zu betreiben (Google-Cloud-Dokumentation). Sie unterstützt unter anderem Business Intelligence und Ad-hoc-Analysen, maschinelles Lernen auf den gespeicherten Daten und Geodatenanalysen.
  sources:
  - https://cloud.google.com/bigquery/docs/introduction
- id: isaca
  type: Organisation
  name_en: ISACA
  name_de: ISACA
  summary_en: ISACA is a global professional membership association for IT audit and assurance, information and cyber security, governance, risk management, compliance and privacy, with about 185,000 members (ISACA). It offers certifications, education, research, frameworks and standards; it developed COBIT, a framework for the governance and management of enterprise information and technology.
  summary_de: ISACA ist ein weltweiter Berufsverband für IT-Prüfung, Informations- und Cybersicherheit, Governance, Risikomanagement, Compliance und Datenschutz mit rund 185.000 Mitgliedern (ISACA). Der Verband bietet Zertifizierungen, Weiterbildung, Forschung, Frameworks und Standards an und hat COBIT entwickelt, ein Framework für Governance und Management der Unternehmens-IT.
  sources:
  - https://www.isaca.org/about-us
  - https://www.isaca.org/resources/cobit
- id: eric-evans
  type: Person
  name_en: Eric Evans
  name_de: Eric Evans
  summary_en: Eric Evans is a software designer focusing on domain modelling and the author of the book Domain-Driven Design (Addison-Wesley), which gave domain-driven design its name (Domain Language; Fowler 2020). At Domain Language, which offers training in DDD, Evans focuses particularly on strategic design.
  summary_de: Eric Evans ist Softwaredesigner mit Schwerpunkt Domänenmodellierung und Autor des Buchs Domain-Driven Design (Addison-Wesley), nach dem Domain-Driven Design benannt ist (Domain Language; Fowler 2020). Bei Domain Language, das Schulungen zu DDD anbietet, konzentriert sich Evans besonders auf strategisches Design.
  sources:
  - https://www.domainlanguage.com/about/
  - https://martinfowler.com/bliki/DomainDrivenDesign.html
- id: ben-shneiderman
  type: Person
  name_en: Ben Shneiderman
  name_de: Ben Shneiderman
  summary_en: Ben Shneiderman, of the Human-Computer Interaction Laboratory at the University of Maryland, formulated the Visual Information-Seeking Mantra "overview first, zoom and filter, then details on demand" in 1996. The same paper proposes a task by data type taxonomy for information visualisation with seven data types and seven tasks.
  summary_de: Ben Shneiderman vom Human-Computer Interaction Laboratory der University of Maryland formulierte 1996 das Visual Information-Seeking Mantra „overview first, zoom and filter, then details on demand“. Dasselbe Paper schlägt eine Taxonomie für Informationsvisualisierung nach Aufgaben und Datentypen vor, mit sieben Datentypen und sieben Aufgaben.
  sources:
  - https://www.cs.umd.edu/~ben/papers/Shneiderman1996eyes.pdf
- id: hadley-wickham
  type: Person
  name_en: Hadley Wickham
  name_de: Hadley Wickham
  summary_en: Hadley Wickham described a layered grammar of graphics in 2010, building on Wilkinson's grammar of graphics and refined while he built ggplot2, an open-source implementation for R. A grammar of graphics describes the components of a plot concisely instead of relying on named chart types such as the scatterplot.
  summary_de: Hadley Wickham beschrieb 2010 eine geschichtete Grammatik der Grafik, die auf Wilkinsons Grammar of Graphics aufbaut und bei der Entwicklung von ggplot2, einer Open-Source-Umsetzung für R, verfeinert wurde. Eine solche Grammatik beschreibt die Bestandteile einer Grafik knapp, statt sich auf benannte Diagrammtypen wie das Streudiagramm zu stützen.
  sources:
  - https://vita.had.co.nz/papers/layered-grammar.pdf
- id: llama-guard
  type: Method
  name_en: Llama Guard
  name_de: Llama Guard
  summary_en: 'Llama Guard is an LLM-based input-output safeguard for human-AI conversations: a Llama 2 7B model instruction-tuned to classify both prompts and responses against a safety risk taxonomy (Inan et al., 2023). It matched or exceeded available content moderation tools on the OpenAI Moderation Evaluation dataset and ToxicChat, and its taxonomy can be adapted to a use case through zero-shot or few-shot prompting.'
  summary_de: 'Llama Guard ist ein LLM-basierter Schutz für Ein- und Ausgaben in Gesprächen zwischen Menschen und KI: ein Llama-2-7B-Modell, das per Instruction Tuning darauf trainiert ist, Prompts und Antworten anhand einer Taxonomie von Sicherheitsrisiken zu klassifizieren (Inan et al., 2023). Auf dem OpenAI Moderation Evaluation Dataset und ToxicChat erreichte oder übertraf es verfügbare Moderationswerkzeuge, und seine Taxonomie lässt sich per Zero- oder Few-Shot-Prompting an einen Anwendungsfall anpassen.'
  sources:
  - https://arxiv.org/abs/2312.06674
- id: nemo-guardrails
  type: Technology
  name_en: NeMo Guardrails
  name_de: NeMo Guardrails
  summary_en: NVIDIA NeMo Guardrails is an open-source toolkit for adding programmable guardrails to LLM-based conversational applications (NeMo Guardrails repository). Guardrails ("rails") control a model's output, for example by avoiding certain topics, following a predefined dialogue path, using a particular style or extracting structured data.
  summary_de: NVIDIA NeMo Guardrails ist ein quelloffenes Toolkit, mit dem sich programmierbare Guardrails in LLM-basierte Dialoganwendungen einbauen lassen (NeMo-Guardrails-Repository). Die Guardrails („Rails“) steuern die Ausgabe eines Modells, etwa indem bestimmte Themen vermieden, ein vordefinierter Dialogpfad eingehalten, ein bestimmter Stil verwendet oder strukturierte Daten extrahiert werden.
  sources:
  - https://github.com/NVIDIA-NeMo/Guardrails
- id: natural-questions
  type: Dataset
  name_en: Natural Questions
  name_de: Natural Questions
- id: omar-khattab
  type: Person
  name_en: Omar Khattab
  name_de: Omar Khattab
  summary_en: Omar Khattab, then at Stanford University, introduced ColBERT with Matei Zaharia at SIGIR 2020. ColBERT encodes queries and documents independently with BERT and scores them with a cheap "late interaction" step that keeps fine-grained similarity while making BERT-based retrieval efficient.
  summary_de: Omar Khattab, damals an der Stanford University, stellte mit Matei Zaharia auf der SIGIR 2020 ColBERT vor. ColBERT kodiert Anfragen und Dokumente getrennt mit BERT und bewertet sie mit einem günstigen „Late Interaction“-Schritt, der feinkörnige Ähnlichkeit erhält und Retrieval mit BERT effizient macht.
  sources:
  - https://arxiv.org/abs/2004.12832
- id: ukp-lab
  type: Organisation
  name_en: UKP Lab (TU Darmstadt)
  name_de: UKP Lab (TU Darmstadt)
  aliases:
  - Ubiquitous Knowledge Processing Lab
  summary_en: The Ubiquitous Knowledge Processing (UKP) Lab is a research group in the Department of Computer Science at Technische Universität Darmstadt. Its researchers introduced BEIR in 2021, a heterogeneous benchmark of 18 public datasets for zero-shot evaluation of retrieval models, which found BM25 to be a robust baseline.
  summary_de: Das Ubiquitous Knowledge Processing (UKP) Lab ist eine Forschungsgruppe im Fachbereich Informatik der Technischen Universität Darmstadt. Seine Forschenden stellten 2021 BEIR vor, einen heterogenen Benchmark aus 18 öffentlichen Datensätzen zur Zero-Shot-Evaluation von Retrieval-Modellen, in dem sich BM25 als robuste Baseline erwies.
  sources:
  - https://arxiv.org/abs/2104.08663
- id: stanford-university
  type: Organisation
  name_en: Stanford University
  name_de: Stanford University
  aliases:
  - Stanford
  summary_en: Stanford University is a research university in California. Work from its Computer Science Department cited here includes GloVe (2014), a global log-bilinear regression model for word vectors trained on word-word co-occurrence counts, and ColBERT (2020), a late-interaction retrieval model built on BERT.
  summary_de: Die Stanford University ist eine Forschungsuniversität in Kalifornien. Zu den hier zitierten Arbeiten ihres Computer Science Department gehören GloVe (2014), ein globales log-bilineares Regressionsmodell für Wortvektoren auf Basis von Kookkurrenzzählungen, und ColBERT (2020), ein Retrieval-Modell mit Late Interaction auf Basis von BERT.
  sources:
  - https://nlp.stanford.edu/pubs/glove.pdf
  - https://arxiv.org/abs/2004.12832
- id: ibm
  type: Organisation
  name_en: IBM
  name_de: IBM
  summary_en: IBM is a technology company whose research labs produced foundational work cited here, among them BLEU, developed at the IBM T. J. Watson Research Center in 2002 as a quick, inexpensive and language-independent automatic metric for machine translation, and Codd's relational model of data from the IBM Research Laboratory in San Jose in 1970.
  summary_de: IBM ist ein Technologieunternehmen, aus dessen Forschungslaboren hier zitierte Grundlagenarbeiten stammen, darunter BLEU, 2002 am IBM T. J. Watson Research Center als schnelle, günstige und sprachunabhängige automatische Metrik für maschinelle Übersetzung entwickelt, sowie Codds relationales Datenmodell aus dem IBM Research Laboratory in San José von 1970.
  sources:
  - https://aclanthology.org/P02-1040/
  - https://www.seas.upenn.edu/~zives/03f/cis550/codd.pdf
- id: hugging-face
  type: Organisation
  name_en: Hugging Face
  name_de: Hugging Face
  summary_en: Hugging Face is the company whose researchers released DistilBERT in 2019, a smaller general-purpose language model obtained by knowledge distillation during pre-training. DistilBERT reduced the size of a BERT model by 40% while retaining 97% of its language understanding capabilities and running 60% faster.
  summary_de: Hugging Face ist das Unternehmen, dessen Forschende 2019 DistilBERT veröffentlichten, ein kleineres Allzweck-Sprachmodell, das durch Knowledge Distillation während des Vortrainings entsteht. DistilBERT verkleinerte ein BERT-Modell um 40 %, behielt 97 % seines Sprachverständnisses und war 60 % schneller.
  sources:
  - https://arxiv.org/abs/1910.01108
- id: thomas-dietterich
  type: Person
  name_en: Thomas G. Dietterich
  name_de: Thomas G. Dietterich
  summary_en: Thomas G. Dietterich compared approximate statistical tests for comparing supervised classification learning algorithms in a 1998 paper. He found McNemar's test preferable to the difference-of-proportions test and introduced the 5×2-fold cross-validated paired t-test.
  summary_de: Thomas G. Dietterich verglich 1998 in einem Artikel näherungsweise statistische Tests zum Vergleich überwachter Klassifikationsverfahren. Er zog den McNemar-Test dem Test auf Differenz von Anteilen vor und führte den 5×2-fach kreuzvalidierten gepaarten t-Test ein.
  sources:
  - https://arxiv.org/abs/1811.12808
- id: roy-fielding
  type: Person
  name_en: Roy T. Fielding
  name_de: Roy T. Fielding
  aliases:
  - Roy Fielding
  summary_en: Roy T. Fielding defined Representational State Transfer (REST) in chapter 5 of his 2000 dissertation at the University of California, Irvine, as an architectural style for distributed hypermedia systems with a uniform connector interface. He is also lead author of RFC 9110, which specifies HTTP semantics.
  summary_de: Roy T. Fielding definierte Representational State Transfer (REST) im fünften Kapitel seiner Dissertation an der University of California, Irvine, aus dem Jahr 2000 als Architekturstil für verteilte Hypermedia-Systeme mit einheitlicher Schnittstelle. Er ist außerdem Erstautor von RFC 9110, das die Semantik von HTTP festlegt.
  sources:
  - https://ics.uci.edu/~fielding/pubs/dissertation/rest_arch_style.htm
  - https://www.rfc-editor.org/rfc/rfc9110.html
- id: consumer-credit-directive-2023
  type: Regulation
  name_en: Consumer Credit Directive (EU) 2023/2225
  name_de: Verbraucherkreditrichtlinie (EU) 2023/2225
  aliases:
  - Directive (EU) 2023/2225
  - CCD2
  summary_en: Directive (EU) 2023/2225 of 18 October 2023 lays down a common framework for harmonising certain aspects of Member States' rules on credit agreements for consumers (Art. 1) and repeals the Consumer Credit Directive 2008/48/EC. Its Article 18 requires creditors to carry out a thorough assessment of the consumer's creditworthiness before concluding a credit agreement.
  summary_de: Die Richtlinie (EU) 2023/2225 vom 18. Oktober 2023 legt einen gemeinsamen Rahmen zur Harmonisierung bestimmter Aspekte der mitgliedstaatlichen Vorschriften über Verbraucherkreditverträge fest (Art. 1) und hebt die Verbraucherkreditrichtlinie 2008/48/EG auf. Ihr Artikel 18 verpflichtet Kreditgeber, vor Abschluss eines Kreditvertrags die Kreditwürdigkeit des Verbrauchers eingehend zu prüfen.
  sources:
  - https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:32023L2225
  - https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32023L2225
- id: thoughtworks
  type: Organisation
  name_en: Thoughtworks
  name_de: Thoughtworks
  aliases:
  - ThoughtWorks
  summary_en: Thoughtworks is a software delivery company where Martin Fowler works with the title of Chief Scientist. Many authors of articles on his website martinfowler.com are or have been Thoughtworks colleagues.
  summary_de: Thoughtworks ist ein Softwaredienstleister, bei dem Martin Fowler den Titel Chief Scientist trägt. Viele Autorinnen und Autoren von Artikeln auf seiner Website martinfowler.com sind oder waren Kolleginnen und Kollegen bei Thoughtworks.
  sources:
  - https://martinfowler.com/aboutMe.html
- id: extreme-programming
  type: Method
  name_en: Extreme Programming (XP)
  name_de: Extreme Programming (XP)
  aliases:
  - Extreme Programming
  - XP
  summary_en: Extreme Programming (XP) is a software development methodology developed primarily by Kent Beck and one of the first agile methods; it was dominant in the late 1990s and early 2000s. It moves from values through principles to concrete practices and popularised continuous integration, refactoring, test-driven development and agile planning.
  summary_de: Extreme Programming (XP) ist eine maßgeblich von Kent Beck entwickelte Methode der Softwareentwicklung und eine der ersten agilen Methoden; Ende der 1990er und Anfang der 2000er Jahre war sie vorherrschend. Sie führt von Werten über Prinzipien zu konkreten Praktiken und machte kontinuierliche Integration, Refactoring, testgetriebene Entwicklung und agile Planung bekannt.
  sources:
  - https://martinfowler.com/bliki/ExtremeProgramming.html
- id: test-driven-development
  type: Method
  name_en: Test-driven development (TDD)
  name_de: Testgetriebene Entwicklung (TDD)
  aliases:
  - Test-driven development
  - TDD
  - Red, green, refactor
  summary_en: Test-driven development (TDD) guides development by writing tests; Kent Beck developed it in the late 1990s as part of Extreme Programming. The cycle is to write a test for the next bit of functionality, write code until it passes and then refactor ("red, green, refactor"), starting from a list of test cases; neglecting the refactoring step is the most common mistake.
  summary_de: Testgetriebene Entwicklung (TDD) steuert die Entwicklung über das Schreiben von Tests; Kent Beck entwickelte sie Ende der 1990er Jahre als Teil von Extreme Programming. Der Zyklus lautet, einen Test für das nächste Stück Funktionalität zu schreiben, dann Code, bis er besteht, und schließlich zu refaktorieren („Red, Green, Refactor“), ausgehend von einer Liste von Testfällen; den Refactoring-Schritt auszulassen ist der häufigste Fehler.
  sources:
  - https://martinfowler.com/bliki/TestDrivenDevelopment.html
- id: junit
  type: Technology
  name_en: JUnit
  name_de: JUnit
  summary_en: JUnit is "a simple framework to write repeatable tests" for Java and an instance of the xUnit architecture for unit testing frameworks. It was originally written by Kent Beck and Erich Gamma; JUnit 4 is in maintenance mode, and development continues in the newer JUnit framework.
  summary_de: JUnit ist „a simple framework to write repeatable tests“ für Java und eine Umsetzung der xUnit-Architektur für Unit-Test-Frameworks. Ursprünglich schrieben es Kent Beck und Erich Gamma; JUnit 4 ist im Wartungsmodus, die Weiterentwicklung findet im neueren JUnit-Framework statt.
  sources:
  - https://junit.org/junit4/
  - https://martinfowler.com/articles/continuousIntegration.html
- id: erich-gamma
  type: Person
  name_en: Erich Gamma
  name_de: Erich Gamma
  summary_en: Erich Gamma originally wrote the JUnit testing framework together with Kent Beck. According to Martin Fowler, JUnit had a marked impact on the Java community in the late 1990s and inspired similar xUnit frameworks for other languages.
  summary_de: Erich Gamma schrieb gemeinsam mit Kent Beck ursprünglich das Testframework JUnit. Nach Martin Fowler prägte JUnit Ende der 1990er Jahre die Java-Gemeinschaft deutlich und regte ähnliche xUnit-Frameworks für andere Sprachen an.
  sources:
  - https://martinfowler.com/articles/continuousIntegration.html
- id: dspy
  type: Technology
  name_en: DSPy
  name_de: DSPy
  summary_en: DSPy (Declarative Self-improving Python) is a framework for programming rather than prompting language models (DSPy repository). Developers write compositional Python modules, and DSPy offers algorithms that optimise the prompts and weights of the resulting system, from classifiers to RAG pipelines and agent loops.
  summary_de: DSPy (Declarative Self-improving Python) ist ein Framework, mit dem Sprachmodelle programmiert statt gepromptet werden (DSPy-Repository). Entwickler schreiben zusammensetzbare Python-Module, und DSPy bietet Algorithmen, die Prompts und Gewichte des entstehenden Systems optimieren, von Klassifikatoren über RAG-Pipelines bis zu Agentenschleifen.
  sources:
  - https://github.com/stanfordnlp/dspy
- id: delta-lake
  type: Technology
  name_en: Delta Lake
  name_de: Delta Lake
  summary_en: Delta Lake is an open-source project for building a lakehouse architecture on top of data lakes such as S3, ADLS, GCS and HDFS (Delta Lake documentation). It adds ACID transactions, scalable metadata handling, unified streaming and batch processing, schema enforcement and time travel through data versioning.
  summary_de: Delta Lake ist ein quelloffenes Projekt, um eine Lakehouse-Architektur auf Data Lakes wie S3, ADLS, GCS und HDFS aufzubauen (Delta-Lake-Dokumentation). Es ergänzt ACID-Transaktionen, skalierbare Metadatenverwaltung, die gemeinsame Verarbeitung von Streaming- und Batch-Daten, Schemadurchsetzung und Zeitreisen über Datenversionierung.
  sources:
  - https://docs.delta.io/latest/index.html
- id: microsoft-agent-framework
  type: Technology
  name_en: Microsoft Agent Framework
  name_de: Microsoft Agent Framework
  summary_en: Microsoft Agent Framework is a framework for building AI agents and multi-agent workflows (Microsoft Learn). It combines agents that use LLMs, tools and MCP servers, graph-based workflows with explicit execution paths, and integrations with model providers, together with building blocks such as model clients, session state, memory and middleware.
  summary_de: Microsoft Agent Framework ist ein Framework zum Bau von KI-Agenten und Multi-Agenten-Workflows (Microsoft Learn). Es verbindet Agenten, die LLMs, Werkzeuge und MCP-Server nutzen, graphbasierte Workflows mit expliziten Ausführungspfaden und Integrationen zu Modellanbietern mit Bausteinen wie Modell-Clients, Sitzungszustand, Gedächtnis und Middleware.
  sources:
  - https://learn.microsoft.com/en-us/agent-framework/overview/agent-framework-overview

  type: Method
  name_en: HELM (Holistic Evaluation of Language Models)
  name_de: HELM (Holistic Evaluation of Language Models)
  aliases:
  - HELM
  summary_en: HELM (Holistic Evaluation of Language Models) is a living benchmark that taxonomises scenarios and metrics and measures seven metrics, accuracy, calibration, robustness, fairness, bias, toxicity and efficiency, on 16 core scenarios (Liang et al., 2022). It evaluated 30 language models on 42 scenarios under standardised conditions, raising the share of core scenarios covered per model from 17.9% to 96.0%, and released all prompts and completions.
  summary_de: HELM (Holistic Evaluation of Language Models) ist ein fortlaufend aktualisierter Benchmark, der Szenarien und Metriken systematisiert und sieben Metriken misst, Accuracy, Kalibrierung, Robustheit, Fairness, Bias, Toxizität und Effizienz, auf 16 Kernszenarien (Liang et al., 2022). Er evaluierte 30 Sprachmodelle auf 42 Szenarien unter einheitlichen Bedingungen, erhöhte den Anteil abgedeckter Kernszenarien je Modell von 17,9 % auf 96,0 % und veröffentlichte alle Prompts und Ausgaben.

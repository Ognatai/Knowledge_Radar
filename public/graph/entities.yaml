- id: target-encoding
  type: Method
  name_en: Target encoding
  name_de: Target Encoding
  summary_en: Target encoding replaces each category of a nominal feature by the mean of the target conditioned on that category, blended with the overall target mean (scikit-learn developers, n.d.-g). It is useful for high-cardinality features such as postcodes, where one-hot encoding would inflate the feature space; scikit-learn's TargetEncoder uses cross fitting to avoid leaking the target into training.
  summary_de: Target Encoding ersetzt jede Kategorie eines nominalen Merkmals durch den Mittelwert der Zielgröße für diese Kategorie, gemischt mit dem Gesamtmittel der Zielgröße (scikit-learn developers, n.d.-g). Es eignet sich für Merkmale mit vielen Ausprägungen wie Postleitzahlen, bei denen One-Hot-Encoding den Merkmalsraum aufblähen würde; der TargetEncoder in scikit-learn nutzt Cross Fitting, damit die Zielgröße nicht ins Training durchsickert.
  sources:
  - https://scikit-learn.org/stable/modules/preprocessing.html

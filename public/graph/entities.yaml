  name_de: Fourier-Terme (saisonale Merkmale)
- id: feature-selection
  type: Method
  name_en: Feature selection
  name_de: Feature Selection
  summary_en: Feature selection reduces the set of input features, either to improve an estimator's accuracy or to boost performance on very high-dimensional data (scikit-learn developers, n.d.-f). Approaches range from removing features with low variance and univariate statistical tests to recursive elimination and selection based on model weights, for example the sparse coefficients of the lasso.
  summary_de: Merkmalsauswahl verkleinert die Menge der Eingabemerkmale, um die Genauigkeit eines Schätzers zu verbessern oder die Leistung bei sehr hochdimensionalen Daten zu steigern (scikit-learn developers, n.d.-f). Die Verfahren reichen vom Entfernen von Merkmalen mit geringer Varianz und univariaten statistischen Tests bis zu rekursiver Elimination und Auswahl über Modellgewichte, etwa die dünn besetzten Koeffizienten des Lasso.
  sources:
  - https://scikit-learn.org/stable/modules/feature_selection.html
- id: lasso
  type: Method
  name_en: Lasso
  name_de: Lasso
  summary_en: The lasso is a linear model with an L1 penalty on the coefficients that estimates sparse solutions, setting some coefficients exactly to zero and thereby reducing the number of features a model depends on (scikit-learn developers, n.d.-d). This makes it useful for feature selection and fundamental to compressed sensing.
  summary_de: Das Lasso ist ein lineares Modell mit L1-Strafe auf die Koeffizienten, das dünn besetzte Lösungen schätzt, einige Koeffizienten exakt auf null setzt und so die Zahl der Merkmale verringert, von denen ein Modell abhängt (scikit-learn developers, n.d.-d). Das macht es nützlich für die Merkmalsauswahl und grundlegend für Compressed Sensing.
  sources:
  - https://scikit-learn.org/stable/modules/linear_model.html

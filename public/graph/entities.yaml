- id: bart
  type: Method
  name_en: BART
  name_de: BART
  summary_en: 'BART is a denoising autoencoder for pre-training sequence-to-sequence models: text is corrupted with a noising function and a standard Transformer encoder-decoder learns to reconstruct it, generalising BERT''s bidirectional encoder and GPT''s left-to-right decoder (Lewis et al., 2019). It works especially well for text generation, setting new results in abstractive dialogue, question answering and summarisation with gains of up to 6 ROUGE.'
  summary_de: 'BART ist ein entrauschender Autoencoder zum Vortraining von Sequence-to-Sequence-Modellen: Text wird mit einer Störfunktion verfälscht, und ein üblicher Transformer mit Encoder und Decoder lernt, ihn wiederherzustellen; das verallgemeinert den bidirektionalen Encoder von BERT und den Links-nach-rechts-Decoder von GPT (Lewis et al., 2019). Es eignet sich besonders für Textgenerierung und erzielte neue Bestwerte bei abstraktiven Dialogen, Fragebeantwortung und Zusammenfassung mit bis zu 6 ROUGE-Punkten Zugewinn.'
  sources:
  - https://arxiv.org/abs/1910.13461

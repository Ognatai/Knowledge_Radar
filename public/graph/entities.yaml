- id: k-means
  type: Method
  name_en: k-means
  name_de: k-Means
  aliases:
  - Lloyd's algorithm
  summary_en: k-means clusters data into a fixed number of disjoint clusters by choosing centroids that minimise the inertia, the within-cluster sum of squares (scikit-learn developers, n.d.-b). It scales well to many samples but assumes convex, isotropic clusters, and the number of clusters must be specified in advance.
  summary_de: k-Means teilt Daten in eine feste Zahl disjunkter Cluster, indem es Zentroide wählt, die die Inertia minimieren, die Summe der quadrierten Abstände innerhalb der Cluster (scikit-learn developers, n.d.-b). Es skaliert gut auf viele Datenpunkte, setzt aber konvexe, isotrope Cluster voraus, und die Zahl der Cluster muss vorab festgelegt werden.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: k-means-plus-plus
  type: Method
  name_en: k-means++
  name_de: k-Means++
  summary_en: k-means++ is an initialisation scheme for k-means that places the initial centroids generally far from each other, which usually leads to better results than random initialisation (scikit-learn developers, n.d.-b). It is the default initialisation in scikit-learn and can also be used on its own to select seeds for other clustering algorithms.
  summary_de: k-Means++ ist ein Initialisierungsverfahren für k-Means, das die Startzentroide in der Regel weit voneinander entfernt platziert und meist zu besseren Ergebnissen führt als zufällige Initialisierung (scikit-learn developers, n.d.-b). Es ist in scikit-learn voreingestellt und kann auch eigenständig Startpunkte für andere Clustering-Verfahren auswählen.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: hierarchical-clustering
  type: Method
  name_en: Hierarchical clustering
  name_de: Hierarchisches Clustering
  aliases:
  - agglomerative clustering
  summary_en: Hierarchical clustering builds nested clusters by successively merging or splitting them, represented as a tree (dendrogram) whose root holds all samples and whose leaves are single samples (scikit-learn developers, n.d.-b). Agglomerative clustering works bottom up, and the linkage criterion, such as Ward, complete, average or single linkage, decides which clusters to merge.
  summary_de: Hierarchisches Clustering bildet verschachtelte Cluster durch schrittweises Zusammenführen oder Aufteilen, dargestellt als Baum (Dendrogramm), dessen Wurzel alle Datenpunkte enthält und dessen Blätter einzelne Datenpunkte sind (scikit-learn developers, n.d.-b). Agglomeratives Clustering arbeitet von unten nach oben, und das Linkage-Kriterium, etwa Ward, Complete, Average oder Single Linkage, bestimmt, welche Cluster zusammengeführt werden.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html
- id: dbscan
  type: Method
  name_en: DBSCAN
  name_de: DBSCAN
  summary_en: DBSCAN views clusters as areas of high density separated by areas of low density, so clusters can have any shape, unlike in k-means (scikit-learn developers, n.d.-b). Core samples have at least min_samples neighbours within distance eps; a cluster consists of connected core samples and nearby non-core samples, and samples that are not close to any core sample are outliers.
  summary_de: DBSCAN versteht Cluster als Bereiche hoher Dichte, getrennt durch Bereiche geringer Dichte, sodass Cluster anders als bei k-Means beliebige Formen haben können (scikit-learn developers, n.d.-b). Kernpunkte haben mindestens min_samples Nachbarn im Abstand eps; ein Cluster besteht aus verbundenen Kernpunkten und nahe gelegenen Nicht-Kernpunkten, und Punkte, die keinem Kernpunkt nahe sind, gelten als Ausreißer.
  sources:
  - https://scikit-learn.org/stable/modules/clustering.html

- id: gru
  type: Method
  name_en: Gated recurrent unit (GRU)
  name_de: Gated Recurrent Unit (GRU)
  aliases:
  - GRU
  summary_en: The gated recurrent unit (GRU) is a recurrent unit with a gating mechanism, like the long short-term memory (LSTM) unit (Chung et al., 2014). On polyphonic music and speech signal modelling, gated units clearly beat traditional tanh units, and the GRU was comparable to the LSTM.
  summary_de: Die Gated Recurrent Unit (GRU) ist eine rekurrente Einheit mit Gating-Mechanismus, ähnlich der Long-Short-Term-Memory-Einheit (LSTM) (Chung et al., 2014). Bei der Modellierung polyphoner Musik und von Sprachsignalen schlugen Einheiten mit Gating klassische tanh-Einheiten deutlich, und die GRU war mit dem LSTM vergleichbar.
  sources:
  - https://arxiv.org/abs/1412.3555
- id: back-propagation-through-time
  type: Method
  name_en: Back-propagation through time
  name_de: Backpropagation Through Time
- id: vanishing-and-exploding-gradients
  type: Concept
  name_en: Vanishing and exploding gradients
  name_de: Verschwindende und explodierende Gradienten
- id: positive-congruent-training
  type: Method
  name_en: Positive-congruent training
  name_de: Positive-Congruent Training
  summary_en: Positive-congruent training reduces "negative flips", test samples that an old model classified correctly but a new model gets wrong, while also lowering the overall error rate (Yan et al., 2020). Its method, Focal Distillation, gives more weight to samples the reference model classified correctly, and using an ensemble as reference reduced negative flips further.
  summary_de: Positive-Congruent Training verringert „Negative Flips“, also Testbeispiele, die ein altes Modell richtig, ein neues aber falsch klassifiziert, und senkt zugleich die Gesamtfehlerrate (Yan et al., 2020). Das Verfahren Focal Distillation gewichtet Beispiele stärker, die das Referenzmodell richtig klassifiziert hat, und ein Ensemble als Referenz verringerte Negative Flips weiter.
  sources:
  - https://arxiv.org/abs/2011.09161
- id: negative-flip
  type: Concept
  name_en: Negative flip
  name_de: Negative Flip
- id: ridge-regression
  type: Method
  name_en: Ridge regression (L2 regularisation)
  name_de: Ridge-Regression (L2-Regularisierung)
  summary_en: Ridge regression adds a penalty on the size of the coefficients to least squares, minimising the residual sum of squares plus α times the squared L2 norm of the coefficients (scikit-learn developers, n.d.-d). The larger α, the stronger the shrinkage and the more robust the coefficients become to collinearity.
  summary_de: Ridge-Regression ergänzt die Methode der kleinsten Quadrate um eine Strafe auf die Größe der Koeffizienten und minimiert die Summe der quadrierten Abweichungen plus α mal die quadrierte L2-Norm der Koeffizienten (scikit-learn developers, n.d.-d). Je größer α, desto stärker die Schrumpfung und desto robuster werden die Koeffizienten gegenüber Kollinearität.
  sources:
  - https://scikit-learn.org/stable/modules/linear_model.html
- id: dropout
  type: Method
  name_en: Dropout
  name_de: Dropout
- id: early-stopping
  type: Method
  name_en: Early stopping
  name_de: Early Stopping
- id: random-search
  type: Method
  name_en: Random search
  name_de: Zufallssuche (Random Search)
  summary_en: Random search samples hyperparameter settings from specified distributions instead of an exhaustive grid (scikit-learn developers, n.d.-h). Its budget can be chosen independently of the number of parameters and values, and adding parameters that do not affect performance does not reduce its efficiency.
  summary_de: Random Search zieht Hyperparameter-Einstellungen aus vorgegebenen Verteilungen statt ein Raster vollständig abzusuchen (scikit-learn developers, n.d.-h). Sein Budget lässt sich unabhängig von der Zahl der Parameter und Werte wählen, und Parameter ohne Einfluss auf die Leistung mindern seine Effizienz nicht.
  sources:
  - https://scikit-learn.org/stable/modules/grid_search.html
- id: grid-search
  type: Method
  name_en: Grid search
  name_de: Rastersuche (Grid Search)
  summary_en: Grid search exhaustively evaluates every combination of hyperparameter values from a specified grid, usually with cross-validation, and keeps the best combination (scikit-learn developers, n.d.-h). It is the most widely used approach to hyperparameter optimisation, but its cost grows with every added parameter and value.
  summary_de: Grid Search bewertet erschöpfend jede Kombination von Hyperparameterwerten aus einem vorgegebenen Raster, meist mit Kreuzvalidierung, und behält die beste Kombination (scikit-learn developers, n.d.-h). Sie ist das am weitesten verbreitete Verfahren der Hyperparameter-Optimierung, doch ihr Aufwand wächst mit jedem zusätzlichen Parameter und Wert.
  sources:
  - https://scikit-learn.org/stable/modules/grid_search.html
- id: bayesian-optimisation
  type: Method
  name_en: Bayesian optimisation
  name_de: Bayessche Optimierung
  summary_en: Bayesian optimisation tunes hyperparameters automatically by modelling a learning algorithm's generalisation performance as a sample from a Gaussian process, whose posterior guides which settings to try next (Snoek et al., 2012). Snoek et al. showed that careful choices of prior and inference can reach or surpass human expert tuning, and added variants that account for the cost of experiments and run them in parallel.
  summary_de: Bayes'sche Optimierung stimmt Hyperparameter automatisch ab, indem sie die Generalisierungsleistung eines Lernverfahrens als Stichprobe aus einem Gaußprozess modelliert, dessen Posterior bestimmt, welche Einstellungen als Nächstes probiert werden (Snoek et al., 2012). Snoek et al. zeigten, dass eine sorgfältige Wahl von Prior und Inferenz die Abstimmung durch Fachleute erreichen oder übertreffen kann, und ergänzten Varianten, die die Kosten von Experimenten berücksichtigen und sie parallel ausführen.
  sources:
  - https://arxiv.org/abs/1206.2944
- id: gaussian-process
  type: Method
  name_en: Gaussian process
  name_de: Gauß-Prozess
  summary_en: Gaussian processes are a nonparametric supervised learning method for regression and probabilistic classification whose predictions are probabilistic, so that confidence intervals can be computed, and whose behaviour is set by a choice of kernel (scikit-learn developers, n.d.-l). They lose efficiency in high-dimensional spaces, when the number of features exceeds a few dozen.
  summary_de: Gaußprozesse sind ein nichtparametrisches überwachtes Lernverfahren für Regression und probabilistische Klassifikation, dessen Vorhersagen probabilistisch sind, sodass sich Konfidenzintervalle berechnen lassen, und dessen Verhalten über die Wahl eines Kernels festgelegt wird (scikit-learn developers, n.d.-l). In hochdimensionalen Räumen, ab einigen Dutzend Merkmalen, verlieren sie an Effizienz.
  sources:
  - https://scikit-learn.org/stable/modules/gaussian_process.html
- id: q-learning
  type: Method
  name_en: Q-learning
  name_de: Q-Learning
- id: deep-q-learning
  type: Method
  name_en: Deep Q-learning (DQN)
  name_de: Deep Q-Learning (DQN)
  summary_en: Deep Q-learning trains a convolutional neural network with a variant of Q-learning to learn control policies directly from raw pixels, with a value function estimating future rewards as output (Mnih et al., 2013). Applied to seven Atari 2600 games without changing architecture or algorithm, it outperformed all previous approaches on six and surpassed a human expert on three.
  summary_de: Deep Q-Learning trainiert ein Convolutional Neural Network mit einer Variante von Q-Learning, um Steuerungsstrategien direkt aus Rohpixeln zu lernen; die Ausgabe ist eine Wertfunktion, die künftige Belohnungen schätzt (Mnih et al., 2013). Bei sieben Atari-2600-Spielen ohne Anpassung von Architektur oder Algorithmus übertraf es bei sechs alle früheren Verfahren und bei drei einen menschlichen Experten.
  sources:
  - https://arxiv.org/abs/1312.5602
- id: markov-decision-process
  type: Concept
  name_en: Markov decision process
  name_de: Markov-Entscheidungsprozess
- id: exploration-exploitation-tradeoff

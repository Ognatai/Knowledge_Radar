- id: entity-resolution
  type: Method
  name_en: Entity resolution
  name_de: Entity Resolution
  summary_en: Entity resolution identifies different descriptions that refer to the same real-world entity and is a key task for data quality (Christophides et al., 2019). End-to-end workflows combine entity indexing with matching, and methods from databases, the Semantic Web and machine learning address loosely structured, diverse, fast-changing and large-scale entity descriptions.
  summary_de: Entity Resolution erkennt unterschiedliche Beschreibungen, die sich auf dieselbe reale Entität beziehen, und ist eine Kernaufgabe der Datenqualität (Christophides et al., 2019). Durchgängige Abläufe verbinden die Indexierung von Entitäten mit dem Abgleich, und Verfahren aus Datenbanken, Semantic Web und maschinellem Lernen behandeln lose strukturierte, vielfältige, sich schnell ändernde und große Mengen von Beschreibungen.
  sources:

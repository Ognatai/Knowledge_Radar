- id: flan
  type: Method
  name_en: FLAN
  name_de: FLAN
  summary_en: FLAN is a 137-billion-parameter language model instruction-tuned on more than 60 NLP tasks phrased as natural language instructions (Wei et al., 2021). Instruction tuning substantially improved zero-shot performance on unseen task types, and FLAN surpassed zero-shot GPT-3 (175B) on 20 of 25 evaluated tasks; the number of tasks, model scale and natural language instructions were key to the effect.
  summary_de: FLAN ist ein Sprachmodell mit 137 Milliarden Parametern, das mit Instruction Tuning auf über 60 als Anweisungen formulierten NLP-Aufgaben angepasst wurde (Wei et al., 2021). Das Instruction Tuning verbesserte die Zero-Shot-Leistung bei unbekannten Aufgabentypen deutlich, und FLAN übertraf Zero-Shot-GPT-3 (175B) bei 20 von 25 Aufgaben; entscheidend waren die Zahl der Aufgaben, die Modellgröße und die Anweisungen in natürlicher Sprache.
  sources:
  - https://arxiv.org/abs/2109.01652
- id: frugalgpt
  type: Method
  name_en: FrugalGPT
  name_de: FrugalGPT
  summary_en: FrugalGPT is an LLM cascade that learns which combination of LLMs to query for each request in order to reduce cost and improve accuracy (Chen et al., 2023). Its authors describe three cost strategies, prompt adaptation, LLM approximation and LLM cascades, and report matching GPT-4 with up to 98% lower cost or improving on GPT-4 by 4% at the same cost.
  summary_de: FrugalGPT ist eine LLM-Kaskade, die lernt, welche Kombination von LLMs je Anfrage abgefragt wird, um Kosten zu senken und die Accuracy zu verbessern (Chen et al., 2023). Die Autoren beschreiben drei Kostenstrategien, Prompt-Anpassung, LLM-Approximation und LLM-Kaskaden, und berichten, GPT-4 bei bis zu 98 % geringeren Kosten zu erreichen oder GPT-4 bei gleichen Kosten um 4 % zu übertreffen.
  sources:
  - https://arxiv.org/abs/2305.05176
- id: routellm
  type: Method
  name_en: RouteLLM
  name_de: RouteLLM
  summary_en: RouteLLM trains router models that choose at inference time between a stronger and a weaker LLM to balance cost and response quality, using human preference data and data augmentation (Ong et al., 2024). The routers reduced costs by more than half in some cases without lowering quality and kept working when the strong and weak models were swapped at test time.
  summary_de: RouteLLM trainiert Router-Modelle, die bei der Inferenz zwischen einem stärkeren und einem schwächeren LLM wählen, um Kosten und Antwortqualität auszubalancieren, mit menschlichen Präferenzdaten und Datenaugmentierung (Ong et al., 2024). Die Router senkten die Kosten in einigen Fällen um mehr als die Hälfte ohne Qualitätsverlust und funktionierten weiter, wenn starkes und schwaches Modell beim Testen ausgetauscht wurden.
  sources:
  - https://arxiv.org/abs/2406.18665

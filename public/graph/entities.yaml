- id: direct-preference-optimization
  type: Method
  name_en: Direct Preference Optimization (DPO)
  name_de: Direct Preference Optimization (DPO)
  aliases:
  - DPO
  summary_en: Direct Preference Optimization (DPO) aligns language models with human preferences using a simple classification loss instead of reinforcement learning, based on a reparameterisation of the RLHF reward model whose optimal policy has a closed form (Rafailov et al., 2023). It is stable and lightweight, needs no sampling during fine-tuning, and matched or exceeded PPO-based RLHF on sentiment control, summarisation and single-turn dialogue.
  summary_de: Direct Preference Optimization (DPO) richtet Sprachmodelle mit einem einfachen Klassifikationsverlust statt mit Reinforcement Learning an menschlichen Präferenzen aus, gestützt auf eine Umparametrisierung des RLHF-Belohnungsmodells, deren optimale Policy eine geschlossene Form hat (Rafailov et al., 2023). Es ist stabil und leichtgewichtig, braucht beim Fine-Tuning kein Sampling und erreichte oder übertraf PPO-basiertes RLHF bei Sentimentsteuerung, Zusammenfassung und einstufigen Dialogen.
  sources:
  - https://arxiv.org/abs/2305.18290
- id: constitutional-ai
  type: Method
  name_en: Constitutional AI
  name_de: Constitutional AI
  aliases:
  - RLAIF
  summary_en: Constitutional AI trains a harmless AI assistant without human labels for harmful outputs; the only human oversight is a list of principles (Bai et al., 2022). In a supervised phase the model critiques and revises its own responses and is fine-tuned on the revisions; in a reinforcement learning phase an AI preference model provides the reward ("RL from AI Feedback"), producing an assistant that explains its objections instead of being evasive.
  summary_de: Constitutional AI trainiert einen harmlosen KI-Assistenten ohne menschliche Labels für schädliche Ausgaben; die einzige menschliche Aufsicht ist eine Liste von Prinzipien (Bai et al., 2022). In einer überwachten Phase kritisiert und überarbeitet das Modell eigene Antworten und wird auf die Überarbeitungen feinjustiert; in einer Reinforcement-Learning-Phase liefert ein KI-Präferenzmodell die Belohnung („RL from AI Feedback“), sodass ein Assistent entsteht, der seine Einwände erklärt, statt auszuweichen.
  sources:
  - https://arxiv.org/abs/2212.08073
- id: rlvr
  type: Method
  name_en: Reinforcement learning with verifiable rewards (RLVR)
  name_de: Reinforcement Learning mit überprüfbaren Belohnungen (RLVR)
  aliases:
  - RLVR
  summary_en: Reinforcement learning with verifiable rewards (RLVR) is a post-training method introduced with the fully open Tulu 3 models, alongside supervised fine-tuning and Direct Preference Optimization (Lambert et al., 2024). Tulu 3, built on Llama 3.1 base models, surpassed the instruct versions of Llama 3.1, Qwen 2.5 and Mistral as well as GPT-4o-mini and Claude 3.5 Haiku, and its data, code and recipes were released.
  summary_de: Reinforcement Learning with Verifiable Rewards (RLVR) ist ein Nachtrainingsverfahren, das mit den vollständig offenen Tulu-3-Modellen neben Supervised Fine-Tuning und Direct Preference Optimization eingeführt wurde (Lambert et al., 2024). Tulu 3 auf Basis von Llama 3.1 übertraf die Instruct-Versionen von Llama 3.1, Qwen 2.5 und Mistral sowie GPT-4o-mini und Claude 3.5 Haiku, und Daten, Code und Rezepte wurden veröffentlicht.
  sources:
  - https://arxiv.org/abs/2411.15124

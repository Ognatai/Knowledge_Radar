  type: Technology
  name_en: NumPy
  name_de: NumPy
- id: pandas
  type: Technology
  name_en: pandas
  name_de: pandas
- id: venv
  type: Technology
  name_en: venv (virtual environments)
  name_de: venv (virtuelle Umgebungen)
- id: behavioural-testing
  type: Method
  name_en: Behavioural testing
  name_de: Verhaltenstests
- id: checklist-nlp
  type: Method
  name_en: CheckList
  name_de: CheckList
  summary_en: CheckList is a task-agnostic methodology for behavioural testing of NLP models, inspired by software engineering, with a matrix of general linguistic capabilities and test types and a tool to generate many test cases quickly (Ribeiro et al., 2020). It found critical failures in commercial and state-of-the-art models, and practitioners using it created twice as many tests and found almost three times as many bugs.
  summary_de: CheckList ist eine aufgabenunabhängige Methode für Verhaltenstests von NLP-Modellen nach dem Vorbild der Softwaretechnik, mit einer Matrix allgemeiner sprachlicher Fähigkeiten und Testarten und einem Werkzeug, das schnell viele Testfälle erzeugt (Ribeiro et al., 2020). Sie deckte kritische Fehler in kommerziellen und aktuellen Modellen auf, und Fachleute erstellten damit doppelt so viele Tests und fanden fast dreimal so viele Fehler.
  sources:
  - https://arxiv.org/abs/2005.04118
- id: model-cards
  type: Method
  name_en: Model cards
  name_de: Model Cards
  summary_en: Model cards are short documents that accompany trained machine learning models and report benchmarked evaluation across relevant groups, for example by demographic or phenotypic characteristics and their intersections, together with the intended context of use and the evaluation procedure (Mitchell et al., 2018). They aim to make clear where a model is suitable and to increase transparency about how well it works.
  summary_de: Model Cards sind kurze Dokumente zu trainierten ML-Modellen, die Evaluationsergebnisse für relevante Gruppen angeben, etwa nach demografischen oder phänotypischen Merkmalen und deren Überschneidungen, zusammen mit dem vorgesehenen Einsatzkontext und dem Evaluationsverfahren (Mitchell et al., 2018). Sie sollen klarstellen, wofür ein Modell geeignet ist, und die Transparenz darüber erhöhen, wie gut es funktioniert.
  sources:
  - https://arxiv.org/abs/1810.03993
- id: datasheets-for-datasets
  type: Method
  name_en: Datasheets for datasets
  name_de: Datasheets for Datasets
  summary_en: Datasheets for datasets propose that, as electronic components come with datasheets, every dataset be accompanied by a document on its motivation, composition, collection process and recommended uses (Gebru et al., 2018). They aim to improve communication between dataset creators and consumers and to make transparency and accountability a priority in machine learning.
  summary_de: Datasheets for Datasets schlagen vor, dass jeder Datensatz, wie elektronische Bauteile ein Datenblatt haben, von einem Dokument zu Motivation, Zusammensetzung, Erhebungsprozess und empfohlener Verwendung begleitet wird (Gebru et al., 2018). Sie sollen die Kommunikation zwischen Erstellern und Nutzenden von Datensätzen verbessern und Transparenz und Rechenschaft im maschinellen Lernen stärken.
  sources:
  - https://arxiv.org/abs/1803.09010
- id: post-training-quantisation
  type: Method
  name_en: Post-training quantisation (PTQ)
  name_de: Post-Training-Quantisierung (PTQ)
  aliases:
  - PTQ
  - Post-training quantization (PTQ)
  summary_en: Post-training quantisation (PTQ) reduces the numerical precision of a model's weights after training, without retraining, to cut memory and inference cost. GPTQ, a one-shot PTQ method for large generative Transformers, compressed 175-billion-parameter models to 3 or 4 bits per weight with negligible accuracy loss (Frantar et al., 2022).
  summary_de: Post-Training-Quantisierung (PTQ) verringert die numerische Genauigkeit der Gewichte eines Modells nach dem Training, ohne erneutes Training, um Speicher und Inferenzkosten zu senken. GPTQ, ein einmalig angewendetes PTQ-Verfahren für große generative Transformer, komprimierte Modelle mit 175 Milliarden Parametern auf 3 oder 4 Bit je Gewicht bei vernachlässigbarem Genauigkeitsverlust (Frantar et al., 2022).
  sources:
  - https://arxiv.org/abs/2210.17323
- id: quantisation-aware-training
  type: Method
  name_en: Quantisation-aware training (QAT)
  name_de: Quantization-Aware Training (QAT)
  aliases:
  - QAT
  - Quantization-aware training (QAT)
  summary_en: Quantisation-aware training co-designs the training procedure with a quantisation scheme so that model accuracy is preserved after quantisation (Jacob et al., 2017). Jacob et al. combined it with integer-only arithmetic inference, which is more efficient on common integer hardware, and improved the accuracy-latency trade-off even for efficient MobileNets on ImageNet classification and COCO detection.
  summary_de: Quantisierungsbewusstes Training stimmt das Trainingsverfahren auf ein Quantisierungsschema ab, damit die Genauigkeit des Modells nach der Quantisierung erhalten bleibt (Jacob et al., 2017). Jacob et al. verbanden es mit Inferenz allein in Ganzzahlarithmetik, die auf gängiger Hardware effizienter ist, und verbesserten das Verhältnis von Genauigkeit und Latenz selbst bei effizienten MobileNets für ImageNet-Klassifikation und COCO-Detektion.
  sources:
  - https://arxiv.org/abs/1712.05877
- id: llm-int8
  type: Method
  name_en: LLM.int8()
  name_de: LLM.int8()
  summary_en: LLM.int8() is an 8-bit matrix multiplication procedure for Transformer feed-forward and attention projection layers that halves inference memory while keeping full-precision performance (Dettmers et al., 2022). It combines vector-wise quantisation with a mixed-precision decomposition that keeps rare emergent outlier feature dimensions in 16 bit, so models with up to 175 billion parameters run without performance loss.
  summary_de: LLM.int8() ist ein Verfahren für 8-Bit-Matrixmultiplikation in den Feed-Forward- und Attention-Projektionsschichten von Transformern, das den Speicherbedarf bei der Inferenz halbiert und die volle Genauigkeit erhält (Dettmers et al., 2022). Es verbindet vektorweise Quantisierung mit einer Zerlegung in gemischter Genauigkeit, die seltene, auffällige Ausreißer-Dimensionen in 16 Bit belässt, sodass Modelle mit bis zu 175 Milliarden Parametern ohne Leistungsverlust laufen.
  sources:
  - https://arxiv.org/abs/2208.07339
- id: gptq
  type: Method
  name_en: GPTQ
  name_de: GPTQ
  summary_en: GPTQ is a one-shot post-training weight quantisation method for generative Transformers based on approximate second-order information (Frantar et al., 2022). It quantises models with 175 billion parameters to 3 or 4 bits per weight in about four GPU hours with negligible accuracy loss, which made it possible to run such a model on a single GPU, with inference speed-ups of around 3.25 to 4.5 times over FP16.
  summary_de: GPTQ ist ein einmalig angewendetes Verfahren zur Quantisierung der Gewichte generativer Transformer nach dem Training, das auf genäherten Informationen zweiter Ordnung beruht (Frantar et al., 2022). Es quantisiert Modelle mit 175 Milliarden Parametern in rund vier GPU-Stunden auf 3 oder 4 Bit je Gewicht bei vernachlässigbarem Genauigkeitsverlust; dadurch ließ sich ein solches Modell erstmals auf einer einzigen GPU ausführen, mit rund 3,25- bis 4,5-fach schnellerer Inferenz als mit FP16.
  sources:
  - https://arxiv.org/abs/2210.17323
- id: awq
  type: Method
  name_en: AWQ (Activation-aware Weight Quantization)
  name_de: AWQ (Activation-aware Weight Quantization)
  aliases:
  - AWQ
  summary_en: Activation-aware Weight Quantization (AWQ) is a hardware-friendly low-bit weight-only quantisation method for LLMs; it protects the roughly 1% of salient weight channels, identified from activation statistics, by scaling them rather than keeping them in higher precision (Lin et al., 2023). It needs no backpropagation or reconstruction, generalises across domains and modalities, and its TinyChat framework runs 4-bit models more than three times faster than FP16.
  summary_de: Activation-aware Weight Quantization (AWQ) ist ein hardwarefreundliches Verfahren zur Niedrigbit-Quantisierung nur der Gewichte von LLMs; es schützt die rund 1 % wichtigen Gewichtskanäle, erkannt an Aktivierungsstatistiken, durch Skalierung statt durch höhere Genauigkeit (Lin et al., 2023). Es braucht weder Backpropagation noch Rekonstruktion, generalisiert über Domänen und Modalitäten, und sein Framework TinyChat führt 4-Bit-Modelle mehr als dreimal so schnell aus wie FP16.
  sources:
  - https://arxiv.org/abs/2306.00978
- id: fixed-size-chunking
  type: Method
  name_en: Fixed-size chunking
  name_de: Chunking mit fester Größe
- id: semantic-chunking
  type: Method
  name_en: Semantic chunking
  name_de: Semantisches Chunking
- id: structure-based-chunking
  type: Method
  name_en: Structure-based chunking
  name_de: Strukturbasiertes Chunking
- id: proposition-indexing
  type: Method
  name_en: Proposition indexing
  name_de: Indexierung nach Propositionen
  summary_en: Proposition indexing uses propositions, atomic, self-contained expressions that each state one distinct factoid, as the retrieval unit for dense retrieval instead of passages or sentences (Chen et al., 2023). Indexing a corpus by propositions significantly outperformed passage-level units in retrieval and improved downstream question answering for a given computation budget.
  summary_de: Proposition Indexing nutzt Propositionen, atomare, für sich verständliche Aussagen mit jeweils einem Faktum, statt Passagen oder Sätzen als Einheit für dichtes Retrieval (Chen et al., 2023). Ein nach Propositionen indexiertes Korpus übertraf Einheiten auf Passagenebene im Retrieval deutlich und verbesserte die nachgelagerte Fragebeantwortung bei gegebenem Rechenbudget.
  sources:
  - https://arxiv.org/abs/2312.06648
- id: late-chunking
  type: Method
  name_en: Late chunking
  name_de: Late Chunking
  summary_en: Late chunking embeds all tokens of a long text with a long-context embedding model first and applies chunking only afterwards, just before mean pooling, so that each chunk embedding keeps context from the surrounding text (Günther et al., 2024). It improved results across retrieval tasks, works with many long-context embedding models without additional training, and can be strengthened by dedicated fine-tuning.
  summary_de: Late Chunking bettet zunächst alle Tokens eines langen Textes mit einem Embedding-Modell für lange Kontexte ein und teilt erst danach, direkt vor dem Mean Pooling, in Chunks; so behält jedes Chunk-Embedding den Kontext des umgebenden Textes (Günther et al., 2024). Es verbesserte die Ergebnisse über verschiedene Retrieval-Aufgaben, funktioniert ohne zusätzliches Training mit vielen Embedding-Modellen für lange Kontexte und lässt sich durch gezieltes Fine-Tuning weiter stärken.
  sources:
  - https://arxiv.org/abs/2409.04701
- id: context-enrichment
  type: Method
  name_en: Context enrichment of chunks
  name_de: Kontextanreicherung von Chunks
- id: chunk-overlap
  type: Method
  name_en: Chunk overlap
  name_de: Überlappung von Chunks
- id: parent-child-retrieval
  type: Method
  name_en: Parent-child retrieval
  name_de: Parent-Child-Retrieval
- id: ares
  type: Method
  name_en: ARES
  name_de: ARES
  summary_en: ARES (Automated RAG Evaluation System) evaluates retrieval-augmented generation systems on context relevance, answer faithfulness and answer relevance by fine-tuning lightweight LM judges on synthetic training data it creates itself (Saad-Falcon et al., 2023). A few hundred human annotations feed prediction-powered inference to correct judge errors, and the judges stayed accurate after shifts in queries and documents.
  summary_de: ARES (Automated RAG Evaluation System) bewertet Retrieval-Augmented-Generation-Systeme nach Kontextrelevanz, Antworttreue und Antwortrelevanz, indem es leichte Sprachmodelle als Richter auf selbst erzeugten synthetischen Trainingsdaten feinjustiert (Saad-Falcon et al., 2023). Einige hundert menschliche Annotationen fließen in Prediction-Powered Inference ein, um Fehler der Richter auszugleichen, und die Richter blieben auch nach veränderten Anfragen und Dokumenten genau.
  sources:
  - https://arxiv.org/abs/2311.09476
- id: prediction-powered-inference
  type: Method
  name_en: Prediction-powered inference (PPI)
  name_de: Prediction-Powered Inference (PPI)
  aliases:
  - PPI
  summary_en: Prediction-powered inference is a framework for valid statistical inference when an experimental dataset is supplemented with predictions from a machine learning system (Angelopoulos et al., 2023). It yields provably valid confidence intervals for quantities such as means, quantiles and regression coefficients without assumptions about the ML model, and more accurate predictions give narrower intervals; ARES uses it to correct LM judges with a small set of human labels.
  summary_de: Prediction-Powered Inference ist ein Rahmen für gültige statistische Inferenz, wenn ein experimenteller Datensatz durch Vorhersagen eines ML-Systems ergänzt wird (Angelopoulos et al., 2023). Er liefert nachweislich gültige Konfidenzintervalle für Größen wie Mittelwerte, Quantile und Regressionskoeffizienten ohne Annahmen über das ML-Modell, und genauere Vorhersagen ergeben engere Intervalle; ARES nutzt ihn, um LM-Richter mit wenigen menschlichen Labels zu korrigieren.
  sources:
  - https://arxiv.org/abs/2301.09633
  - https://arxiv.org/abs/2311.09476
- id: context-pollution
  type: Concept
  name_en: Context pollution
  name_de: Kontextverschmutzung
- id: citation-hallucination
  type: Concept
  name_en: Citation hallucination
  name_de: Zitat-Halluzination
- id: grounding-hallucination
  type: Concept
  name_en: Grounding hallucination
  name_de: Grounding-Halluzination
- id: claim-level-grounding-check
  type: Method
  name_en: Claim-level grounding check
  name_de: Grounding-Prüfung auf Aussageebene
- id: factscore
  type: Method
  name_en: FActScore
  name_de: FActScore
  aliases:
  - FACTSCORE
  summary_en: FActScore evaluates the factuality of long-form generated text by breaking it into atomic facts and computing the percentage supported by a reliable knowledge source (Min et al., 2023). In human evaluation of generated biographies, ChatGPT reached only 58%, and an automated estimator using retrieval and a strong language model had an error rate below 2%.
  summary_de: FActScore bewertet die Faktentreue langer generierter Texte, indem er sie in atomare Fakten zerlegt und den Anteil berechnet, den eine verlässliche Wissensquelle stützt (Min et al., 2023). In einer menschlichen Bewertung generierter Biografien erreichte ChatGPT nur 58 %, und ein automatischer Schätzer mit Retrieval und einem starken Sprachmodell hatte eine Fehlerrate unter 2 %.
  sources:
  - https://arxiv.org/abs/2305.14251
- id: citation-verification
  type: Method
  name_en: Citation correctness verification
  name_de: Prüfung der Zitatkorrektheit
- id: hallucination-rate
  type: Method
  name_en: Hallucination rate
  name_de: Halluzinationsrate
- id: sparse-retrieval
  type: Method
  name_en: Sparse retrieval
  name_de: Sparse Retrieval
- id: hyde
  type: Method
  name_en: HyDE (Hypothetical Document Embeddings)
  name_de: HyDE (Hypothetical Document Embeddings)
  aliases:
  - HyDE
  summary_en: 'HyDE (Hypothetical Document Embeddings) enables zero-shot dense retrieval without relevance labels: an instruction-following LLM writes a hypothetical document for the query, and an unsupervised encoder such as Contriever embeds it to find similar real documents (Gao et al., 2022). The encoder''s dense bottleneck filters out false details, and HyDE significantly outperformed Contriever across web search, QA and fact verification.'
  summary_de: 'HyDE (Hypothetical Document Embeddings) ermöglicht dichtes Retrieval ohne Relevanzlabels: Ein anweisungsfolgendes LLM schreibt zur Anfrage ein hypothetisches Dokument, und ein unüberwacht trainierter Encoder wie Contriever bettet es ein, um ähnliche echte Dokumente zu finden (Gao et al., 2022). Die Verdichtung im Encoder filtert falsche Details heraus, und HyDE übertraf Contriever deutlich bei Websuche, Fragebeantwortung und Faktenprüfung.'
  sources:
  - https://arxiv.org/abs/2212.10496
- id: contriever
  type: Method
  name_en: Contriever
  name_de: Contriever
  summary_en: Contriever is an unsupervised dense retriever trained with contrastive learning (Izacard et al., 2021). On the BEIR benchmark it outperformed BM25 on 11 of 15 datasets for Recall@100, improved further when used as pre-training before fine-tuning, and showed strong multilingual and cross-lingual retrieval, for example retrieving English documents from Arabic queries.
  summary_de: Contriever ist ein unüberwacht mit kontrastivem Lernen trainierter dichter Retriever (Izacard et al., 2021). Auf dem BEIR-Benchmark übertraf er BM25 bei 11 von 15 Datensätzen im Recall@100, verbesserte sich weiter, wenn er als Vortraining vor dem Fine-Tuning diente, und zeigte starkes mehrsprachiges und sprachübergreifendes Retrieval, etwa englische Dokumente zu arabischen Anfragen.
  sources:
  - https://arxiv.org/abs/2112.09118
- id: raft
  type: Method
  name_en: RAFT (Retrieval Augmented Fine-Tuning)
  name_de: RAFT (Retrieval Augmented Fine-Tuning)
  aliases:
  - RAFT
  summary_en: 'Retrieval Augmented Fine-Tuning (RAFT) is a training recipe for "open-book" domain-specific question answering: the model is given a question and retrieved documents and learns to ignore distractor documents and to cite the relevant passage verbatim in a chain-of-thought answer (Zhang et al., 2024). It consistently improved performance on PubMed, HotpotQA and Gorilla.'
  summary_de: 'Retrieval Augmented Fine-Tuning (RAFT) ist ein Trainingsverfahren für domänenspezifische Fragebeantwortung „mit offenem Buch“: Das Modell erhält eine Frage und abgerufene Dokumente, lernt, ablenkende Dokumente zu ignorieren, und zitiert die relevante Stelle wörtlich in einer Chain-of-Thought-Antwort (Zhang et al., 2024). Es verbesserte die Leistung auf PubMed, HotpotQA und Gorilla durchgängig.'
  sources:
  - https://arxiv.org/abs/2403.10131
- id: naive-rag
  type: Method
  name_en: Naive RAG
  name_de: Naive RAG
  summary_en: Naive RAG is the first of three paradigms in Gao et al.'s survey of retrieval-augmented generation, followed by Advanced RAG and Modular RAG (Gao et al., 2023). The survey describes RAG as built on three components, retrieval, generation and augmentation, and RAG as a way to counter hallucination and outdated knowledge by drawing on external databases.
  summary_de: Naive RAG ist das erste von drei Paradigmen in der Übersicht von Gao et al. zu Retrieval-Augmented Generation, gefolgt von Advanced RAG und Modular RAG (Gao et al., 2023). Die Übersicht beschreibt RAG als Verbindung von drei Bausteinen, Retrieval, Generierung und Augmentierung, und als Mittel gegen Halluzinationen und veraltetes Wissen durch Rückgriff auf externe Datenbanken.
  sources:
  - https://arxiv.org/abs/2312.10997
- id: advanced-rag
  type: Method
  name_en: Advanced RAG
  name_de: Advanced RAG
  summary_en: Advanced RAG is the second of three paradigms in Gao et al.'s survey of retrieval-augmented generation, between Naive RAG and Modular RAG; the survey traces how techniques for retrieval, generation and augmentation advanced across these paradigms (Gao et al., 2023).
  summary_de: Advanced RAG ist das zweite von drei Paradigmen in der Übersicht von Gao et al. zu Retrieval-Augmented Generation, zwischen Naive RAG und Modular RAG; die Übersicht zeichnet nach, wie sich Verfahren für Retrieval, Generierung und Augmentierung über diese Paradigmen weiterentwickelt haben (Gao et al., 2023).
  sources:
  - https://arxiv.org/abs/2312.10997
- id: modular-rag
  type: Method
  name_en: Modular RAG
  name_de: Modular RAG
  summary_en: Modular RAG is the third and most recent of the RAG paradigms in Gao et al.'s survey, after Naive RAG and Advanced RAG, in the progression of paradigms that the survey examines through their retrieval, generation and augmentation techniques (Gao et al., 2023).
  summary_de: Modular RAG ist das dritte und jüngste der RAG-Paradigmen in der Übersicht von Gao et al., nach Naive RAG und Advanced RAG, in der Entwicklung von Paradigmen, die die Übersicht anhand ihrer Verfahren für Retrieval, Generierung und Augmentierung untersucht (Gao et al., 2023).
  sources:
  - https://arxiv.org/abs/2312.10997
- id: inverted-file-index
  type: Method
  name_en: Inverted file index (IVF)
  name_de: Inverted File Index (IVF)
  aliases:
  - IVF
  summary_en: An inverted file index (IVF) clusters database vectors at indexing time with a coarse quantiser, storing the vectors of each cluster contiguously in inverted lists (Douze et al., 2024). At search time only the clusters with the nearest centroids are visited, set by the nprobe parameter, which trades speed against accuracy in vector search libraries such as Faiss.
  summary_de: Ein Inverted File Index (IVF) clustert Datenbankvektoren bei der Indexierung mit einem groben Quantisierer und speichert die Vektoren jedes Clusters zusammenhängend in invertierten Listen (Douze et al., 2024). Bei der Suche werden nur die Cluster mit den nächsten Zentroiden besucht, festgelegt über den Parameter nprobe, der in Bibliotheken wie Faiss Geschwindigkeit gegen Genauigkeit abwägt.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: product-quantisation
  type: Method
  name_en: Product quantisation (PQ)
  name_de: Produktquantisierung (PQ)
  aliases:
  - Product quantization (PQ)
  summary_en: Product quantisation (PQ) compresses vectors by splitting each into M sub-vectors and quantising each separately with k-means; the code is the concatenation of the sub-quantiser indices, so each vector is stored as a short code (Douze et al., 2024). It was introduced by Jégou, Douze and Schmid for nearest-neighbour search and is a core compression method in Faiss.
  summary_de: Product Quantization (PQ) komprimiert Vektoren, indem jeder in M Teilvektoren zerlegt und jeder Teil separat mit k-Means quantisiert wird; der Code ist die Verkettung der Indizes der Teilquantisierer, sodass jeder Vektor als kurzer Code gespeichert wird (Douze et al., 2024). Sie wurde von Jégou, Douze und Schmid für die Nächste-Nachbarn-Suche eingeführt und ist ein zentrales Kompressionsverfahren in Faiss.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: ivf-pq
  type: Method
  name_en: IVF-PQ
  name_de: IVF-PQ
  summary_en: IVF-PQ combines an inverted file index, which restricts search to the clusters nearest to the query, with product quantisation of the stored vectors, so large collections can be searched quickly with compact codes (Douze et al., 2024). It is a central index type in Faiss, and Google's ScaNN library is a heavily optimised implementation of IVF-PQ.
  summary_de: IVF-PQ verbindet einen Inverted File Index, der die Suche auf die der Anfrage nächsten Cluster beschränkt, mit Product Quantization der gespeicherten Vektoren, sodass große Sammlungen schnell und mit kompakten Codes durchsucht werden können (Douze et al., 2024). Er ist ein zentraler Indextyp in Faiss, und Googles Bibliothek ScaNN ist eine stark optimierte Umsetzung von IVF-PQ.
  sources:
  - https://arxiv.org/abs/2401.08281
- id: anisotropic-quantisation
  type: Method
  name_en: Anisotropic quantisation
  name_de: Anisotrope Quantisierung
  aliases:
  - Anisotropic quantization
  summary_en: Anisotropic quantisation is a vector quantisation approach for maximum inner product search that, instead of minimising reconstruction error, penalises the component of a data point's residual parallel to the point more than the orthogonal one, because points with the largest inner products matter most (Guo et al., 2019). It achieved state-of-the-art results on the ann-benchmarks.com benchmarks.
  summary_de: Anisotrope Quantisierung ist ein Verfahren der Vektorquantisierung für Maximum Inner Product Search, das statt den Rekonstruktionsfehler zu minimieren den zum Datenpunkt parallelen Anteil des Restfehlers stärker bestraft als den orthogonalen, weil Punkte mit den größten Skalarprodukten am wichtigsten sind (Guo et al., 2019). Es erreichte Bestwerte auf den Benchmarks von ann-benchmarks.com.
  sources:
  - https://arxiv.org/abs/1908.10396
- id: maximum-inner-product-search
  type: Method
  name_en: Maximum inner product search (MIPS)
  name_de: Maximum Inner Product Search (MIPS)
  aliases:
  - MIPS
  summary_en: Maximum inner product search (MIPS) finds the database vectors with the largest inner product with a query vector. Quantisation-based techniques are the state of the art for scaling MIPS to massive databases, for example anisotropic vector quantisation, which focuses accuracy on the points with the largest inner products (Guo et al., 2019).
  summary_de: Maximum Inner Product Search (MIPS) sucht die Datenbankvektoren mit dem größten Skalarprodukt zu einem Anfragevektor. Quantisierungsverfahren sind der Stand der Technik, um MIPS auf sehr große Datenbanken zu skalieren, etwa die anisotrope Vektorquantisierung, die die Genauigkeit auf die Punkte mit den größten Skalarprodukten konzentriert (Guo et al., 2019).
  sources:
  - https://arxiv.org/abs/1908.10396

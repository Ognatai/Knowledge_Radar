- id: formatspread
  type: Method
  name_en: FormatSpread
  name_de: FormatSpread
  summary_en: FormatSpread is an algorithm that evaluates a sampled set of plausible prompt formats for a task and reports the interval of expected performance, without access to model weights (Sclar et al., 2023). It was motivated by the finding that open LLMs are extremely sensitive to meaning-preserving formatting changes in few-shot prompts, with differences of up to 76 accuracy points for LLaMA-2-13B.
  summary_de: FormatSpread ist ein Algorithmus, der eine Stichprobe plausibler Prompt-Formate für eine Aufgabe evaluiert und das Intervall der zu erwartenden Leistung angibt, ohne Zugriff auf die Modellgewichte (Sclar et al., 2023). Anlass war der Befund, dass offene LLMs bei Few-Shot-Prompts extrem empfindlich auf bedeutungserhaltende Formatänderungen reagieren, mit Unterschieden von bis zu 76 Accuracy-Punkten bei LLaMA-2-13B.
  sources:
  - https://arxiv.org/abs/2310.11324
- id: multi-prompt-evaluation
  type: Method
  name_en: Multi-prompt evaluation
  name_de: Multi-Prompt-Evaluation
  summary_en: Multi-prompt evaluation assesses LLMs with a set of diverse instruction templates instead of a single one, because results from single-prompt evaluation are brittle (Mizrahi et al., 2023). The analysis covered 6.5 million instances, 20 LLMs and 39 tasks from three benchmarks and proposes metrics tailored to different use cases, such as model developers versus developers of a specific downstream task.
  summary_de: Multi-Prompt-Evaluation bewertet LLMs mit einer Menge unterschiedlicher Anweisungsvorlagen statt mit einer einzigen, weil Ergebnisse aus Evaluationen mit nur einem Prompt brüchig sind (Mizrahi et al., 2023). Die Analyse umfasste 6,5 Millionen Instanzen, 20 LLMs und 39 Aufgaben aus drei Benchmarks und schlägt Metriken für unterschiedliche Zwecke vor, etwa für Modellentwickler oder für Entwickler einer bestimmten Anwendung.
  sources:
  - https://arxiv.org/abs/2401.00595
- id: zero-shot-prompting
  type: Method
  name_en: Zero-shot prompting
  name_de: Zero-Shot-Prompting
- id: zero-shot-chain-of-thought
  type: Method
  name_en: Zero-shot chain of thought
  name_de: Zero-Shot Chain of Thought
  summary_en: Zero-shot chain of thought elicits step-by-step reasoning without examples by adding "Let's think step by step" before each answer (Kojima et al., 2022). With InstructGPT (text-davinci-002) this single prompt raised accuracy on MultiArith from 17.7% to 78.7% and on GSM8K from 10.4% to 40.7%, with similar gains for the 540B PaLM model.
  summary_de: Zero-Shot Chain of Thought löst schrittweises Schlussfolgern ohne Beispiele aus, indem vor jeder Antwort „Let's think step by step“ ergänzt wird (Kojima et al., 2022). Mit InstructGPT (text-davinci-002) hob dieser eine Prompt die Accuracy auf MultiArith von 17,7 % auf 78,7 % und auf GSM8K von 10,4 % auf 40,7 %, mit ähnlichen Gewinnen beim 540B-Modell PaLM.
  sources:
  - https://arxiv.org/abs/2205.11916
- id: self-consistency
  type: Method
  name_en: Self-consistency
  name_de: Self-Consistency
  summary_en: Self-consistency is a decoding strategy for chain-of-thought prompting that samples a diverse set of reasoning paths instead of only the greedy one and selects the most consistent final answer (Wang et al., 2022). It rests on the intuition that complex problems admit several ways of reasoning to the same correct answer and improved results markedly, for example by 17.9 percentage points on GSM8K.
  summary_de: Self-Consistency ist eine Dekodierstrategie für Chain-of-Thought-Prompting, die statt nur des wahrscheinlichsten Lösungswegs eine Vielfalt von Lösungswegen zieht und die am häufigsten erreichte Antwort wählt (Wang et al., 2022). Sie beruht auf der Annahme, dass komplexe Probleme mehrere Lösungswege zur selben richtigen Antwort zulassen, und verbesserte die Ergebnisse deutlich, etwa um 17,9 Prozentpunkte auf GSM8K.
  sources:
  - https://arxiv.org/abs/2203.11171
- id: prompt-report
  type: Method
  name_en: The Prompt Report (taxonomy of prompting techniques)
  name_de: The Prompt Report (Taxonomie von Prompting-Techniken)
  summary_en: The Prompt Report is a systematic survey of prompt engineering that establishes a vocabulary of 33 terms, a taxonomy of 58 prompting techniques for LLMs and 40 techniques for other modalities, and best practices for prompting (Schulhoff et al., 2024). It also includes a meta-analysis of the literature on natural-language prefix prompting.
  summary_de: The Prompt Report ist eine systematische Übersicht über Prompt Engineering mit einem Vokabular aus 33 Begriffen, einer Taxonomie von 58 Prompting-Techniken für LLMs und 40 Techniken für andere Modalitäten sowie Empfehlungen für das Prompting (Schulhoff et al., 2024). Er enthält außerdem eine Metaanalyse der Literatur zu natürlichsprachlichem Präfix-Prompting.
  sources:
  - https://arxiv.org/abs/2406.06608

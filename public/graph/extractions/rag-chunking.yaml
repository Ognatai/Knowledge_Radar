relations:
- from: fixed-size-chunking
  type: IS_EXAMPLE_OF
  to: rag-chunking
  evidence: Fixed-size chunking splits input text into uniform-length segments
- from: semantic-chunking
  type: IS_EXAMPLE_OF
  to: rag-chunking
  evidence: Semantic chunking places chunk boundaries where the content changes instead of after a fixed length
- from: semantic-chunking
  type: BASED_ON
  to: embeddings
  evidence: A common implementation embeds consecutive sentences and starts a new chunk where the similarity between neighbouring sentences drops below a threshold
- from: structure-based-chunking
  type: IS_EXAMPLE_OF
  to: semantic-chunking
  evidence: structure-based variants split along headings, paragraphs or, in legal texts, articles
- from: proposition-indexing
  type: IS_EXAMPLE_OF
  to: rag-chunking
  evidence: Proposition-level indexing (Chen et al., 2023) moved the retrieval unit down to single factoids
- from: late-chunking
  type: IS_EXAMPLE_OF
  to: rag-chunking
  evidence: Late chunking embeds the entire document as a single sequence through a long-context embedding model
- from: late-chunking
  type: BASED_ON
  to: embeddings
  evidence: Late chunking embeds the entire document as a single sequence through a long-context embedding model, generating token-level embeddings before applying chunking operations
- from: parent-child-retrieval
  type: BASED_ON
  to: vector-databases
  evidence: Children (e.g., sentences or short paragraphs) are embedded and indexed in a vector database for precise retrieval

relations:
- from: post-training-quantization
  type: IS_EXAMPLE_OF
  to: quantization
  evidence: Post-training quantization (PTQ) converts a trained model without retraining or labelled data
- from: quantization-aware-training
  type: IS_EXAMPLE_OF
  to: quantization
  evidence: Quantization-aware training (QAT) simulates quantization during training or fine-tuning so that the model adapts to it
- from: llm-int8
  type: IS_EXAMPLE_OF
  to: quantization
  evidence: LLM.int8() quantizes most features with vector-wise scaling and isolates the outlier dimensions in a 16-bit matrix multiplication
- from: gptq
  type: IS_EXAMPLE_OF
  to: quantization
  evidence: GPTQ is a one-shot weight quantization method based on approximate second-order information
- from: awq
  type: IS_EXAMPLE_OF
  to: quantization
  evidence: protecting only 1% of salient weight channels, identified from activation statistics, greatly reduces quantization error
- from: qlora
  type: BASED_ON
  to: quantization
  evidence: QLoRA back-propagates gradients through a frozen, 4-bit quantized pretrained language model into low-rank adapters
- from: qlora
  type: BASED_ON
  to: lora
  evidence: QLoRA back-propagates gradients through a frozen, 4-bit quantized pretrained language model into low-rank adapters
- from: knowledge-distillation

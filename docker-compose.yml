# Local app (ThinkPad deployment). Ports are bound to localhost only.
# Start everything with scripts/start-app.ps1: it starts both indices, passes their
# passwords from the Windows Credential Manager to this process only and mounts the
# private repository (docker-compose.app-private.yml) when one is configured.
# The public site (app/site/) is static and deployed to GitHub Pages instead.
services:
  # Chat UI (app/frontend/) on http://127.0.0.1:8080; nginx forwards /api to the api.
  web:
    build:
      context: .
      dockerfile: app/frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: app/backend/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./public/notes:/workspace/public/notes:ro
      - ./public/graph:/workspace/public/graph:ro
    environment:
      KNOWLEDGE_RADAR_NOTES_DIR: /workspace/public/notes
      # Ollama stays a host installation; the container reaches it via the host gateway.
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      KNOWLEDGE_RADAR_CHAT_MODEL: ${KNOWLEDGE_RADAR_CHAT_MODEL:-qwen3:4b-instruct}
      # Public index: the neo4j service below. Private index: its own compose project
      # (docker-compose.private.yml), reached through the host's port 7688.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Start the app with scripts/start-app.ps1 or set NEO4J_PASSWORD}
      NEO4J_PRIVATE_URI: bolt://host.docker.internal:7688
      NEO4J_PRIVATE_PASSWORD: ${NEO4J_PRIVATE_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - neo4j
  # Local index (graph + vector index), see app/backend/knowledge_radar/index.py.
  # NEO4J_PASSWORD comes from the Windows Credential Manager via
  # scripts/start-neo4j.ps1 or scripts/start-app.ps1; it is never stored in a file.
  neo4j:
    image: neo4j:5.26.29-community
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Start Neo4j with scripts/start-neo4j.ps1 or set NEO4J_PASSWORD}
    volumes:
      - neo4j-data:/data

volumes:
  neo4j-data:

version: 1

# Type and property names are always English. Bilingual names are stored as
# separate name_en/name_de properties, not as separate nodes. Private-only
# types are fully specified in the private repository's architecture document.

node_types:
  Note:
    visibility: public
    properties:
      - path
      - title_en
      - title_de
      - update_count
      - last_rewrite_date
  Method:
    visibility: public
    properties: [name_en, name_de, category, description, aliases]
  Regulation:
    visibility: public
    properties: [name_en, name_de, jurisdiction, status, description, aliases]
  Person:
    visibility: public
    properties: [name_en, name_de, affiliation, role, aliases]
  Organization:
    visibility: public
    properties: [name_en, name_de, type, aliases]
  Conference:
    visibility: public
    properties: [name_en, name_de, year, location]
  Concept:
    visibility: public
    properties: [name_en, name_de, description, aliases]
  Technology:
    # Programming/query languages, frameworks, tools, and standards.
    # category: language | framework | tool | standard
    visibility: public
    properties: [name_en, name_de, category, description, aliases]
  Dataset:
    # Benchmarks and corpora (GLUE, MS MARCO); not the documents a note cites.
    visibility: public
    properties: [name_en, name_de, description, aliases]
  Source:
    visibility: public
    properties: [title, url, date, type, tier, source_kind]
  Company:
    visibility: private
    properties: []
  JobPosting:
    visibility: private
    properties: []
  Requirement:
    visibility: private
    properties: []
  InterviewRound:
    visibility: private
    properties: []
  InterviewRetro:
    visibility: private
    properties: []

relation_types:
  BASED_ON:
    # Regulation -> Regulation: an act builds on another act's framework
    # without transposing (IMPLEMENTS) or changing (AMENDS) it.
    visibility: public
    from: [Method, Concept, Technology, Regulation]
    to: [Method, Concept, Technology, Regulation]
  REGULATES:
    visibility: public
    from: [Regulation, Organization]
    to: [Method, Organization, Concept]
  DEVELOPED_BY:
    # For a Regulation: the body that issued it.
    visibility: public
    from: [Method, Concept, Technology, Regulation, Dataset]
    to: [Person, Organization]
  IMPLEMENTS:
    # Technology -> Method/Concept; Regulation -> Regulation: a national act
    # transposes a directive or supplements a regulation. `pairs` restricts
    # from/to to these combinations (a regulation implements no concept).
    visibility: public
    from: [Technology, Regulation]
    to: [Method, Concept, Regulation]
    pairs:
      - [Technology, Method]
      - [Technology, Concept]
      - [Regulation, Regulation]
  MENTIONED_IN:
    visibility: public
    from: [Method, Regulation, Person, Organization, Conference, Concept, Technology, Dataset, Source]
    to: [Source]
  IS_EXAMPLE_OF:
    visibility: public
    from: [Method, Regulation, Technology, Concept]
    to: [Concept, Method, Technology]
  AMENDS:
    # Amends, replaces or repeals; the evidence quote says which.
    visibility: public
    from: [Regulation]
    to: [Regulation]
  EVALUATES:
    # A benchmark or evaluation method measures B ("StereoSet measures
    # stereotypical bias in language models").
    visibility: public
    from: [Dataset, Method]
    to: [Method, Concept, Technology]
  TAKES_PRECEDENCE_OVER:
    # Lex specialis or an explicit precedence rule.
    visibility: public
    from: [Regulation]
    to: [Regulation]
  COMPLEMENTS:
    # Each covers what the other does not; order does not matter.
    visibility: public
    symmetric: true
    from: [Method, Concept, Technology, Regulation]
    to: [Method, Concept, Technology, Regulation]
  CONTRADICTS:
    visibility: public
    from: [Method, Concept]
    to: [Method, Concept]
  PRESENTED_AT:
    visibility: public
    from: [Source, Person]
    to: [Conference]
  DISCUSSES:
    visibility: public
    from: [Note]
    to: [Method, Regulation, Person, Organization, Conference, Concept, Technology, Dataset, Source]
  RELATED_TO:
    visibility: public
    from: [Note]
    to: [Note]
  IDENTIFIED_GAP_IN:
    visibility: private
    from: [InterviewRetro]
    to: [Requirement]
  RETRO_OF:
    visibility: private
    from: [InterviewRetro]
    to: [InterviewRound]
  INTERVIEWED_BY:
    visibility: private
    from: [InterviewRound]
    to: [Person, Company]
